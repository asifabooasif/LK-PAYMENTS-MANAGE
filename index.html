      : '') +

    '<div class="card">' +
      '<div class="card-head"><h3>📅 Upcoming (next 30 days)</h3></div>' +
      (scheduled.length
        ? '<div class="table-wrap"><table>' +
            '<thead><tr><th>Date</th><th>Cheque #</th><th>Payee</th><th>Bank</th>' +
              '<th class="num">Amount</th></tr></thead><tbody>' +
            scheduled.slice(0, 10).map(c =>
              '<tr data-action="cheque-open" data-id="' + esc(c.id) + '" style="cursor:pointer">' +
                '<td>' + dateFmt(c.chequeDate) + '</td>' +
                '<td class="mono"><strong>' + esc(c.chequeNo || '—') + '</strong></td>' +
                '<td>' + esc(c.payeeName || '—') + '</td>' +
                '<td>' + esc(bankName(c.bankId)) + '</td>' +
                '<td class="num">' + money(c.amount) + '</td>' +
              '</tr>'
            ).join('') + '</tbody></table></div>'
        : '<div class="empty"><span class="big">📅</span>No scheduled cheques yet.</div>') +
    '</div>';
}

/* ────────────── BANKS ────────────── */
function renderBanks() {
  const all = arr(state.data.banks).slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  const filter = state.filters.banks || {};
  const q = (filter.q || '').toLowerCase();
  const status = filter.status || 'all';

  let list = all;
  if (q) list = list.filter(b =>
    (b.name || '').toLowerCase().indexOf(q) !== -1 ||
    (b.bankName || '').toLowerCase().indexOf(q) !== -1 ||
    (b.branch || '').toLowerCase().indexOf(q) !== -1 ||
    (b.accountNo || '').toLowerCase().indexOf(q) !== -1
  );
  if (status === 'active') list = list.filter(b => b.active !== false);
  if (status === 'inactive') list = list.filter(b => b.active === false);

  return '' +
    '<div class="card">' +
      '<div class="card-head">' +
        '<h3>🏦 Banks (' + list.length + ')</h3>' +
        '<button class="btn primary" data-action="bank-new">＋ New Bank</button>' +
      '</div>' +
      '<div class="md-filter">' +
        '<label class="field">Search' +
          '<input type="search" id="bankSearch" value="' + esc(filter.q || '') + '" placeholder="Name, bank, branch, account no…">' +
        '</label>' +
        '<label class="field">Status' +
          '<select id="bankStatus">' +
            '<option value="all"' + (status === 'all' ? ' selected' : '') + '>All</option>' +
            '<option value="active"' + (status === 'active' ? ' selected' : '') + '>Active only</option>' +
            '<option value="inactive"' + (status === 'inactive' ? ' selected' : '') + '>Inactive only</option>' +
          '</select>' +
        '</label>' +
        '<div></div><div></div>' +
      '</div>' +
      (list.length
        ? '<div class="table-wrap"><table>' +
            '<thead><tr>' +
              '<th>Name</th><th>Bank</th><th>Account No</th>' +
              '<th class="num">Opening</th><th class="num">Bank</th>' +
              '<th class="num">Book</th><th class="num">Floating</th>' +
              '<th>Status</th><th class="actions-cell"></th>' +
            '</tr></thead><tbody>' +
            list.map(b => {
              const bal = bankBalances(b.id);
              return '<tr>' +
                '<td><strong>' + esc(b.name) + '</strong></td>' +
                '<td>' + esc(b.bankName || '—') + '</td>' +
                '<td class="mono">' + esc(b.accountNo || '—') + '</td>' +
                '<td class="num">' + money(b.openingBalance) + '</td>' +
                '<td class="num" style="font-weight:600;' + (bal.bank < 0 ? 'color:var(--red)' : '') + '">' + money(bal.bank) + '</td>' +
                '<td class="num" style="font-weight:600;color:var(--accent)">' + money(bal.book) + '</td>' +
                '<td class="num" style="color:var(--amber)">' + (bal.floating > 0 ? money(bal.floating) : '—') + '</td>' +
                '<td>' + (b.active !== false
                  ? '<span class="badge green">Active</span>'
                  : '<span class="badge gray">Inactive</span>') + '</td>' +
                '<td class="actions-cell">' +
                  '<button class="btn xs" data-action="bank-edit" data-id="' + esc(b.id) + '">Edit</button>' +
                  (state.perms.delete
                    ? ' <button class="btn xs danger" data-action="bank-delete" data-id="' + esc(b.id) + '">🗑</button>'
                    : '') +
                '</td>' +
              '</tr>';
            }).join('') +
          '</tbody></table></div>'
        : '<div class="empty"><span class="big">🏦</span>' +
          (all.length ? 'No banks match.' : 'No banks yet.') +
          '</div>') +
    '</div>';
}

/* ────────────── CHEQUE BOOKS ────────────── */
function renderChequeBooks() {
  const all = arr(state.data.chequeBooks);
  const banks = arr(state.data.banks);
  const filter = state.filters.chequebooks || {};
  const bankId = filter.bankId || 'all';
  const q = (filter.q || '').toLowerCase();

  let list = all.slice();
  if (bankId !== 'all') list = list.filter(b => b.bankId === bankId);
  if (q) list = list.filter(b =>
    (b.bookNo || '').toLowerCase().indexOf(q) !== -1 ||
    (b.serialStart || '').indexOf(q) !== -1 ||
    (b.serialEnd || '').indexOf(q) !== -1
  );
  list.sort((a, b) => {
    const bn = bankName(a.bankId).localeCompare(bankName(b.bankId));
    if (bn) return bn;
    return String(a.bookNo).localeCompare(String(b.bookNo));
  });

  return '' +
    '<div class="card">' +
      '<div class="card-head">' +
        '<h3>📚 Cheque Books (' + list.length + ')</h3>' +
        '<button class="btn primary" data-action="book-new"' +
          (banks.length ? '' : ' disabled title="Add a bank first"') + '>＋ New Book</button>' +
      '</div>' +
      '<div class="md-filter">' +
        '<label class="field">Search' +
          '<input type="search" id="bookSearch" value="' + esc(filter.q || '') + '" placeholder="Book no or serial…">' +
        '</label>' +
        '<label class="field">Bank' +
          '<select id="bookBank">' +
            '<option value="all"' + (bankId === 'all' ? ' selected' : '') + '>All banks</option>' +
            banks.map(b => '<option value="' + esc(b.id) + '"' +
              (bankId === b.id ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('') +
          '</select>' +
        '</label>' +
        '<div></div><div></div>' +
      '</div>' +
      (list.length
        ? '<div class="table-wrap"><table>' +
            '<thead><tr>' +
              '<th>Book No</th><th>Bank</th><th>Serial Range</th>' +
              '<th class="num">Total</th><th class="num">Available</th><th class="num">Used</th>' +
              '<th class="num">Spoiled</th><th>Status</th><th class="actions-cell"></th>' +
            '</tr></thead><tbody>' +
            list.map(bk => {
              const s = bookLeavesSummary(bk);
              return '<tr>' +
                '<td><strong>' + esc(bk.bookNo || '—') + '</strong></td>' +
                '<td>' + esc(bankName(bk.bankId)) + '</td>' +
                '<td class="mono">' + esc(bk.serialStart) + ' – ' + esc(bk.serialEnd) + '</td>' +
                '<td class="num">' + s.total + '</td>' +
                '<td class="num" style="color:var(--green);font-weight:600">' + s.available + '</td>' +
                '<td class="num">' + s.used + '</td>' +
                '<td class="num">' + s.spoiled + '</td>' +
                '<td>' + (bk.active !== false
                  ? '<span class="badge green">Active</span>'
                  : '<span class="badge gray">Closed</span>') + '</td>' +
                '<td class="actions-cell">' +
                  '<button class="btn xs" data-action="book-edit" data-id="' + esc(bk.id) + '">Edit</button>' +
                  (state.perms.delete
                    ? ' <button class="btn xs danger" data-action="book-delete" data-id="' + esc(bk.id) + '">🗑</button>'
                    : '') +
                '</td>' +
              '</tr>';
            }).join('') +
          '</tbody></table></div>'
        : '<div class="empty"><span class="big">📚</span>' +
          (banks.length
            ? (all.length ? 'No books match.' : 'No cheque books yet.')
            : 'Add a bank first.') +
          '</div>') +
    '</div>';
}

/* ────────────── SETTINGS ────────────── */
function renderSettings() {
  const s = state.settings || defaultSettings();
  const b = s.business || {};
  const c = s.currency || {};

  return '' +
    '<div class="card">' +
      '<div class="card-head"><h3>⚙️ Business Profile</h3></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
        field('Business Name', 'setName', b.name || '') +
        field('Phone', 'setPhone', b.phone || '') +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">' +
        field('Email', 'setEmail', b.email || '', { type: 'email' }) +
        field('Currency Symbol', 'setSymbol', c.symbol || 'Rs.') +
      '</div>' +
      '<div style="margin-top:14px">' +
        field('Address', 'setAddress', b.address || '', { type: 'textarea' }) +
      '</div>' +
      '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px">' +
        '<button class="btn primary" id="saveSettingsBtn">Save Settings</button>' +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-head"><h3>🔧 Session</h3></div>' +
      '<div style="font-size:13px;line-height:1.9;color:var(--text-2)">' +
        '<div><strong>Signed in as:</strong> ' + esc(state.user?.email || '—') + '</div>' +
        '<div><strong>Role:</strong> ' + esc(state.role) + '</div>' +
        '<div><strong>Last pull:</strong> ' + (state.sync.lastPull ? dateTimeFmt(state.sync.lastPull) : '—') + '</div>' +
        '<div><strong>Last push:</strong> ' + (state.sync.lastPush ? dateTimeFmt(state.sync.lastPush) : '—') + '</div>' +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-head"><h3>🧪 Danger Zone</h3></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn" id="hardRefreshBtn">Hard refresh from cloud</button>' +
      '</div>' +
    '</div>';
}
</script>

<!-- ═══════════════════════════════════════════════════════════════════════
     S01-I — BANK + BOOK FORMS
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
function openBankForm(id) {
  if (!state.perms.write) { toast('Read-only role — cannot edit', 'error'); return; }
  const b = id ? bankObj(id) : null;

  const body =
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
      field('Display Name', 'bName', b?.name || '', { req: true, placeholder: 'e.g. Sampath Main A/C' }) +
      field('Bank', 'bBankName', b?.bankName || '', { placeholder: 'e.g. Sampath Bank' }) +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">' +
      field('Branch', 'bBranch', b?.branch || '', { placeholder: 'e.g. Colombo Fort' }) +
      field('Account Number', 'bAccountNo', b?.accountNo || '', { placeholder: 'e.g. 1234567890' }) +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px">' +
      selectField('Account Type', 'bType', [
        { value: 'current', label: 'Current' },
        { value: 'savings', label: 'Savings' },
        { value: 'od', label: 'Overdraft' },
        { value: 'fd', label: 'Fixed Deposit' },
        { value: 'other', label: 'Other' }
      ], b?.accountType || 'current') +
      field('Opening Balance', 'bOpening', b ? num(b.openingBalance).toFixed(2) : '0.00', { type: 'number', step: '0.01' }) +
      field('Opening Date', 'bOpeningDate', b?.openingDate || today(), { type: 'date' }) +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">' +
      field('SWIFT / Other', 'bSwift', b?.swift || '', { placeholder: 'Optional' }) +
      field('Color Tag', 'bColor', b?.color || '#7c3aed', { type: 'color' }) +
    '</div>' +
    '<div style="margin-top:14px">' +
      field('Notes', 'bNotes', b?.notes || '', { type: 'textarea' }) +
    '</div>' +
    '<div style="margin-top:14px">' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px">' +
        '<input type="checkbox" id="bActive" ' + ((b?.active !== false) ? 'checked' : '') + '> Active' +
      '</label>' +
    '</div>';

  openModal(b ? '✏️ Edit Bank' : '＋ New Bank', body, {
    width: 720,
    footer:
      '<button class="btn" data-close-modal>Cancel</button>' +
      '<button class="btn primary" id="bSaveBtn">' + (b ? 'Update' : 'Create') + '</button>'
  });

  document.getElementById('bSaveBtn').onclick = () => {
    const data = {
      name: document.getElementById('bName').value.trim(),
      bankName: document.getElementById('bBankName').value.trim(),
      branch: document.getElementById('bBranch').value.trim(),
      accountNo: document.getElementById('bAccountNo').value.trim(),
      accountType: document.getElementById('bType').value || 'current',
      openingBalance: num(document.getElementById('bOpening').value),
      openingDate: document.getElementById('bOpeningDate').value || today(),
      swift: document.getElementById('bSwift').value.trim(),
      color: document.getElementById('bColor').value || '#7c3aed',
      notes: document.getElementById('bNotes').value.trim(),
      active: document.getElementById('bActive').checked
    };
    if (!data.name) { toast('Display name is required', 'error'); return; }
    if (b) {
      Object.assign(b, data);
      b.updatedAt = nowISO();
      b.updatedBy = state.user?.email || 'system';
      markDirty('banks', b.id);
    } else {
      const created = makeBank(data);
      state.data.banks.push(created);
      markDirty('banks', created.id);
    }
    closeModal();
    toast(b ? 'Bank updated' : 'Bank created', 'success');
    renderApp();
  };
}

function deleteBankById(id) {
  if (!state.perms.delete) { toast('No delete permission', 'error'); return; }
  const b = bankObj(id);
  if (!b) return;
  const linkedBooks = arr(state.data.chequeBooks).filter(bk => bk.bankId === id);
  if (linkedBooks.length) { toast('Cannot delete — ' + linkedBooks.length + ' cheque book(s) linked', 'error', 5000); return; }
  if (!confirm('Delete bank "' + b.name + '"?')) return;
  state.data.banks = state.data.banks.filter(x => x.id !== id);
  _dirty.add('banks:' + id);
  delete _snapshot['banks:' + id];
  scheduleSync();
  closeModal();
  toast('Bank deleted', 'success');
  renderApp();
}

function openBookForm(id) {
  if (!state.perms.write) { toast('Read-only role — cannot edit', 'error'); return; }
  const bk = id ? bookObj(id) : null;
  const banks = arr(state.data.banks).filter(b => b.active !== false);
  if (!banks.length) { toast('Add a bank first', 'warn'); return; }

  const body =
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
      selectField('Bank', 'kBank', banks.map(b => ({ value: b.id, label: b.name })), bk?.bankId || banks[0].id, { req: true }) +
      field('Book Number', 'kBookNo', bk?.bookNo || '', { req: true, placeholder: 'e.g. BK-001' }) +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px">' +
      field('Serial Start', 'kStart', bk?.serialStart || '', { req: true, placeholder: 'e.g. 000001' }) +
      field('Serial End', 'kEnd', bk?.serialEnd || '', { req: true, placeholder: 'e.g. 000100' }) +
      field('Zero Pad', 'kPad', bk?.pad || 6, { type: 'number', min: 1, max: 12 }) +
    '</div>' +
    '<div style="margin-top:14px">' +
      field('Notes', 'kNotes', bk?.notes || '', { type: 'textarea' }) +
    '</div>' +
    '<div style="margin-top:14px">' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px">' +
        '<input type="checkbox" id="kActive" ' + ((bk?.active !== false) ? 'checked' : '') + '> Active' +
      '</label>' +
    '</div>' +
    '<div id="kPreview" style="margin-top:16px;padding:12px 14px;background:var(--surface-2);border-radius:var(--r-md);font-size:12.5px">' +
      'Enter serial range to preview.' +
    '</div>';

  openModal(bk ? '✏️ Edit Cheque Book' : '＋ New Cheque Book', body, {
    width: 720,
    footer:
      '<button class="btn" data-close-modal>Cancel</button>' +
      '<button class="btn primary" id="kSaveBtn">' + (bk ? 'Update' : 'Create') + '</button>'
  });

  const updatePreview = () => {
    const start = document.getElementById('kStart').value.trim();
    const end = document.getElementById('kEnd').value.trim();
    const pad = num(document.getElementById('kPad').value) || 6;
    const preview = document.getElementById('kPreview');
    if (!preview) return;
    const s = parseInt(start, 10), e = parseInt(end, 10);
    if (!Number.isFinite(s) || !Number.isFinite(e) || e < s) {
      preview.textContent = 'Enter a valid serial range.';
      return;
    }
    preview.innerHTML = '<strong>' + (e - s + 1) + ' leaf/leaves</strong> from ' +
      '<span class="mono">' + esc(String(s).padStart(pad, '0')) + '</span> to ' +
      '<span class="mono">' + esc(String(e).padStart(pad, '0')) + '</span>.';
  };
  ['kStart', 'kEnd', 'kPad'].forEach(idd => {
    const el = document.getElementById(idd);
    if (el) el.addEventListener('input', updatePreview);
  });
  updatePreview();

  document.getElementById('kSaveBtn').onclick = () => {
    const bankId = document.getElementById('kBank').value;
    const bookNo = document.getElementById('kBookNo').value.trim();
    const serialStart = document.getElementById('kStart').value.trim();
    const serialEnd = document.getElementById('kEnd').value.trim();
    const pad = num(document.getElementById('kPad').value) || 6;
    const notes = document.getElementById('kNotes').value.trim();
    const active = document.getElementById('kActive').checked;
    if (!bankId || !bookNo) { toast('Bank and book number are required', 'error'); return; }
    const s = parseInt(serialStart, 10), e = parseInt(serialEnd, 10);
    if (!Number.isFinite(s) || !Number.isFinite(e) || e < s) { toast('Serial range invalid', 'error'); return; }

    if (bk) {
      const summary = bookLeavesSummary(bk);
      const rangeChanged = bk.serialStart !== serialStart || bk.serialEnd !== serialEnd || bk.pad !== pad;
      if (rangeChanged && (summary.used > 0 || summary.printed > 0 || summary.spoiled > 0)) {
        toast('Cannot change serial range once leaves are used', 'error', 5000);
        return;
      }
      bk.bankId = bankId; bk.bookNo = bookNo; bk.notes = notes; bk.active = active;
      if (rangeChanged) {
        bk.serialStart = serialStart; bk.serialEnd = serialEnd; bk.pad = pad;
        const fresh = [];
        for (let n = s; n <= e; n++) fresh.push({ serial: String(n).padStart(pad, '0'), status: 'available', chequeId: null, note: '' });
        bk.leaves = fresh;
      }
      bk.updatedAt = nowISO();
      bk.updatedBy = state.user?.email || 'system';
      markDirty('chequeBooks', bk.id);
    } else {
      const created = makeChequeBook({ bankId, bookNo, serialStart, serialEnd, pad, notes, active });
      state.data.chequeBooks.push(created);
      markDirty('chequeBooks', created.id);
    }
    closeModal();
    toast(bk ? 'Cheque book updated' : 'Cheque book created', 'success');
    renderApp();
  };
}

function deleteBookById(id) {
  if (!state.perms.delete) { toast('No delete permission', 'error'); return; }
  const bk = bookObj(id);
  if (!bk) return;
  const summary = bookLeavesSummary(bk);
  if (summary.used > 0 || summary.printed > 0) {
    toast('Cannot delete — leaves are used', 'error', 5000);
    return;
  }
  if (!confirm('Delete book "' + (bk.bookNo || '') + '"?')) return;
  state.data.chequeBooks = state.data.chequeBooks.filter(x => x.id !== id);
  _dirty.add('chequeBooks:' + id);
  delete _snapshot['chequeBooks:' + id];
  scheduleSync();
  closeModal();
  toast('Book deleted', 'success');
  renderApp();
}
</script>

<!-- ═══════════════════════════════════════════════════════════════════════
     S01-J — UI SHELL + EVENT DELEGATION + BOOT
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
function showLogin() {
  document.getElementById('loginWrap').classList.remove('hidden');
  document.getElementById('appRoot').classList.add('hidden');
}
function hideLogin() {
  document.getElementById('loginWrap').classList.add('hidden');
  document.getElementById('appRoot').classList.remove('hidden');
}

function renderSidebar() {
  const nav = document.getElementById('nav');
  if (!nav) return;

  /* Group nav items preserving insertion order */
  const groups = {};
  REGISTRY.nav.forEach(it => {
    if (!groups[it.group]) groups[it.group] = [];
    groups[it.group].push(it);
  });

  nav.innerHTML = Object.keys(groups).map(g =>
    '<div class="nav-group">' +
      '<div class="nav-label">' + esc(g) + '</div>' +
      groups[g].map(it => {
        let badge = '';
        if (it.badgeFn) {
          try { const n = it.badgeFn(); if (n > 0) badge = '<span class="nav-badge">' + n + '</span>'; }
          catch (e) {}
        }
        return '<div class="nav-item' +
          (state.view === it.id ? ' active' : '') +
          (it.disabled ? ' disabled' : '') +
          '"' +
          (!it.disabled ? ' data-nav="' + it.id + '"' : '') + '>' +
          '<span class="ico">' + it.ico + '</span><span>' + esc(it.label) + '</span>' +
          badge +
        '</div>';
      }).join('') +
    '</div>'
  ).join('');
}

function renderSidebarUser() {
  const el = document.getElementById('sidebarUser');
  if (!el || !state.user) return;
  const initials = (state.user.name || state.user.email || '?').slice(0, 1).toUpperCase();
  el.innerHTML =
    '<div class="user-avatar">' +
      (state.user.photo ? '<img src="' + esc(state.user.photo) + '" alt="">' : esc(initials)) +
    '</div>' +
    '<div class="user-info">' +
      '<div class="user-name">' + esc(state.user.name || 'User') + '</div>' +
      '<div class="user-role">' + esc(state.role) + '</div>' +
    '</div>';
}

function applySettings() {
  const s = state.settings || defaultSettings();
  document.documentElement.setAttribute('data-theme', (s.appearance && s.appearance.theme) || 'professional');
  document.body.classList.toggle('collapsed', !!(s.appearance && s.appearance.sidebarCollapsed));
  const bn = document.querySelector('.brand-name');
  if (bn && s.business && s.business.name) bn.textContent = s.business.name;
  const bl = document.querySelector('.brand-logo');
  if (bl && s.business && s.business.logoInitials) bl.textContent = s.business.logoInitials;
}
window.applySettings = applySettings;

function renderApp() {
  applySettings();
  renderSidebar();
  renderSidebarUser();

  const view = document.getElementById('view');
  if (!view) return;

  const route = REGISTRY.routes[state.view] || REGISTRY.routes.dashboard;
  try {
    view.innerHTML = route.fn();
    bindView();
  } catch (e) {
    view.innerHTML = '<div class="card"><p style="color:var(--red)">Render error: ' + esc(e.message) + '</p></div>';
    dbg.err('Render "' + state.view + '": ' + e.message);
    console.error(e);
  }

  const title = document.getElementById('pageTitle');
  if (title) title.textContent = route.title;

  const sub = document.getElementById('pageSub');
  if (sub) sub.textContent = new Date().toLocaleDateString('en-GB', {
    weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
  });
}
window.renderApp = renderApp;

function bindView() {
  /* Bindings specific to S01 views. Later scripts add their own bindings via init. */
  const bs = document.getElementById('bankSearch');
  if (bs) bs.oninput = () => {
    clearTimeout(bs._t);
    bs._t = setTimeout(() => {
      state.filters.banks = Object.assign({}, state.filters.banks, { q: bs.value });
      renderApp();
    }, 220);
  };
  const bst = document.getElementById('bankStatus');
  if (bst) bst.onchange = () => {
    state.filters.banks = Object.assign({}, state.filters.banks, { status: bst.value });
    renderApp();
  };

  const ks = document.getElementById('bookSearch');
  if (ks) ks.oninput = () => {
    clearTimeout(ks._t);
    ks._t = setTimeout(() => {
      state.filters.chequebooks = Object.assign({}, state.filters.chequebooks, { q: ks.value });
      renderApp();
    }, 220);
  };
  const kb = document.getElementById('bookBank');
  if (kb) kb.onchange = () => {
    state.filters.chequebooks = Object.assign({}, state.filters.chequebooks, { bankId: kb.value });
    renderApp();
  };

  const saveBtn = document.getElementById('saveSettingsBtn');
  if (saveBtn) saveBtn.onclick = () => {
    const s = state.settings = state.settings || defaultSettings();
    s.business = s.business || {};
    s.business.name = document.getElementById('setName').value.trim() || 'Lanka Shoe';
    s.business.phone = document.getElementById('setPhone').value.trim();
    s.business.email = document.getElementById('setEmail').value.trim();
    s.business.address = document.getElementById('setAddress').value.trim();
    s.currency = s.currency || {};
    s.currency.symbol = document.getElementById('setSymbol').value.trim() || 'Rs.';
    s.updatedAt = nowISO();
    s.updatedBy = state.user?.email || '';
    saveSettings();
    applySettings();
    toast('Settings saved', 'success');
  };

  const hrBtn = document.getElementById('hardRefreshBtn');
  if (hrBtn) hrBtn.onclick = async () => {
    hrBtn.disabled = true; hrBtn.textContent = 'Pulling…';
    try {
      await loadSettings();
      await sync.pull();
      applySettings();
      renderApp();
      toast('Reloaded from cloud', 'success');
    } catch (e) { toast('Failed: ' + e.message, 'error'); }
    finally { hrBtn.disabled = false; hrBtn.textContent = 'Hard refresh from cloud'; }
  };
}

/* ── Global click delegation ── */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); navigate(nav.dataset.nav); return; }
  if (e.target.closest('[data-close-modal]')) { closeModal(); return; }

  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;
  const a = actionEl.dataset.action;
  const id = actionEl.dataset.id;

  /* Registry actions (from S02+) */
  if (REGISTRY.actions[a]) { e.preventDefault(); REGISTRY.actions[a](e, id); return; }

  /* Built-in S01 actions */
  const builtin = {
    'bank-new':    () => openBankForm(null),
    'bank-edit':   (ev) => { ev.stopPropagation(); openBankForm(id); },
    'bank-delete': (ev) => { ev.stopPropagation(); deleteBankById(id); },
    'book-new':    () => openBookForm(null),
    'book-edit':   (ev) => { ev.stopPropagation(); openBookForm(id); },
    'book-delete': (ev) => { ev.stopPropagation(); deleteBookById(id); },
    'open-approvals': () => { closeModal(); navigate('approvals'); }
  };
  if (builtin[a]) { e.preventDefault(); builtin[a](e); }
});

/* ── BOOT ── */
async function boot() {
  dbg.ok('Boot — v' + CONFIG.appVersion);

  const gb = document.getElementById('googleBtn');
  if (gb) gb.addEventListener('click', signInWithGoogle);
  const mb = document.getElementById('magicBtn');
  if (mb) mb.addEventListener('click', signInWithMagicLink);
  const me = document.getElementById('magicEmail');
  if (me) me.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); signInWithMagicLink(); }
  });

  const tsb = document.getElementById('toggleSidebarBtn');
  if (tsb) tsb.addEventListener('click', () => {
    state.settings = state.settings || defaultSettings();
    state.settings.appearance = state.settings.appearance || {};
    state.settings.appearance.sidebarCollapsed = !state.settings.appearance.sidebarCollapsed;
    applySettings();
    saveSettings();
  });

  const tb = document.getElementById('themeBtn');
  if (tb) tb.addEventListener('click', () => {
    state.settings = state.settings || defaultSettings();
    state.settings.appearance = state.settings.appearance || {};
    const cur = state.settings.appearance.theme || 'professional';
    state.settings.appearance.theme = cur === 'professional' ? 'dark' : 'professional';
    applySettings();
    saveSettings();
  });

  const sb = document.getElementById('signOutBtn');
  if (sb) sb.addEventListener('click', signOut);

  const syncBtn = document.getElementById('syncBtn');
  if (syncBtn) syncBtn.addEventListener('click', async () => {
    updateSyncIndicator('syncing', 'Syncing…');
    try {
      await sync.push(true);
      await sync.pull();
      renderApp();
      toast('Synced', 'success');
    } catch (e) { toast('Sync failed: ' + (e.code || e.message), 'error'); }
  });

  const dbgBtn = document.getElementById('dbgBtn');
  if (dbgBtn) dbgBtn.addEventListener('click', () => {
    document.getElementById('dbg').classList.toggle('on');
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.ctrlKey && e.key === '`') {
      e.preventDefault();
      document.getElementById('dbg').classList.toggle('on');
    }
  });

  window.addEventListener('hashchange', handleRoute);

  if (!initFirebase()) {
    loginMsg('Firebase failed to load. Check your internet connection and reload.', 'err');
    return;
  }

  await handleMagicLinkReturn();
  auth.onAuthStateChanged(onAuthStateChanged);

  if (!location.hash) location.hash = '#/dashboard';
}

boot().catch(e => {
  dbg.err('Boot threw: ' + (e.message || e));
  loginMsg('Boot error: ' + e.message, 'err');
});

scriptLoaded('S01');
</script>
<!-- ═══════════════════════════════════════════════════════════════════════
     S02 — PAYEES MASTER
     Drops in before </body>, after S01.
