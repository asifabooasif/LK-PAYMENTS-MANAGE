<!DOCTYPE html>
<html lang="en" data-theme="professional">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Lanka Shoe — v16</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%9F%3C/text%3E%3C/svg%3E">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
/* ════════════════════════════════════════════════════════════════════
   DESIGN TOKENS
   ════════════════════════════════════════════════════════════════════ */
:root {
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-full: 9999px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
  --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13.5px;
  --fs-lg: 15px; --fs-xl: 18px; --fs-2xl: 22px; --fs-3xl: 28px;
  --sidebar-w: 240px; --sidebar-w-collapsed: 68px; --topbar-h: 60px;
}
[data-theme="professional"] {
  --bg: #fafaff; --surface: #fff; --surface-2: #f6f4fb; --surface-3: #eeebf7;
  --border: #e5e1f0; --border-2: #f0edf7; --border-3: #d4cde6;
  --text: #1a1533; --text-2: #403a5c; --text-3: #78718f; --text-4: #a8a2bd;
  --accent: #7c3aed; --accent-hover: #6d28d9; --accent-soft: #f5f0ff; --accent-text: #6d28d9;
  --green: #10b981; --green-soft: #e9fbf3;
  --amber: #f59e0b; --amber-soft: #fef7e7;
  --red: #ef4444; --red-soft: #fef1f1;
  --shadow-sm: 0 1px 2px rgba(26,21,51,.05);
  --shadow-md: 0 4px 12px rgba(26,21,51,.08);
  --shadow-lg: 0 20px 45px -12px rgba(26,21,51,.2);
  --sidebar-bg: linear-gradient(180deg,#150b30 0%,#2a1758 60%,#3b1d7a 100%);
  --sidebar-text: #e4ddf4; --sidebar-text-2: #9e95bc;
  --sidebar-hover: rgba(255,255,255,.07); --sidebar-active: rgba(124,58,237,.35);
  --sidebar-border: rgba(255,255,255,.08);
}
[data-theme="dark"] {
  --bg: #0a0618; --surface: #12092b; --surface-2: #180d36; --surface-3: #1e1140;
  --border: #2a1a55; --border-2: #1f1142; --border-3: #3a2470;
  --text: #f0eaff; --text-2: #c4b8e4; --text-3: #8e82b8; --text-4: #625a88;
  --accent: #a78bfa; --accent-hover: #c4b5fd; --accent-soft: #241548; --accent-text: #c4b5fd;
  --green: #34d399; --green-soft: #0a2e22;
  --amber: #fbbf24; --amber-soft: #2a1d05;
  --red: #f87171; --red-soft: #2a0e0e;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
  --shadow-md: 0 4px 16px rgba(0,0,0,.4);
  --shadow-lg: 0 20px 60px -12px rgba(0,0,0,.7);
  --sidebar-bg: linear-gradient(180deg,#0a0618 0%,#180d36 100%);
  --sidebar-text: #c4b8e4; --sidebar-text-2: #625a88;
  --sidebar-hover: rgba(167,139,250,.1); --sidebar-active: rgba(167,139,250,.25);
  --sidebar-border: rgba(167,139,250,.15);
}
/* ════════════════════════════════════════════════════════════════════
   RESET + BASE
   ════════════════════════════════════════════════════════════════════ */
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: var(--fs-md); line-height: 1.55;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
h1,h2,h3,h4 { font-weight: 600; letter-spacing: -.01em; }
button,input,select,textarea { font-family: inherit; font-size: inherit; outline: none; }
button { cursor: pointer; border: none; background: none; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.muted { color: var(--text-3); }
.small { font-size: var(--fs-xs); }
.num { font-variant-numeric: tabular-nums; }
/* ════════════════════════════════════════════════════════════════════
   LOGIN
   ════════════════════════════════════════════════════════════════════ */
.login-wrap {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: var(--sidebar-bg); padding: var(--sp-6);
}
.login-wrap.hidden { display: none; }
.login-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-xl); padding: 44px 40px 36px;
  width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); text-align: center;
}
.login-logo {
  width: 60px; height: 60px; border-radius: 16px; margin: 0 auto 20px;
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  color: #fff; display: grid; place-items: center;
  font-weight: 700; font-size: 22px;
}
.login-card h1 { font-size: var(--fs-2xl); font-weight: 700; margin-bottom: 4px; }
.login-card .tagline { font-size: var(--fs-md); color: var(--text-3); margin-bottom: 28px; }
.google-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 12px 18px; border-radius: var(--r-md);
  border: 1px solid var(--border-3); background: var(--surface);
  color: var(--text); font-weight: 500; font-size: var(--fs-md);
  transition: background .15s, border-color .15s;
}
.google-btn:hover:not(:disabled) { background: var(--surface-2); }
.google-btn:disabled { opacity: .5; cursor: not-allowed; }
.google-btn svg { width: 18px; height: 18px; flex: 0 0 18px; }
.login-divider { margin: 24px 0; display: flex; align-items: center; gap: 12px; }
.login-divider span { font-size: var(--fs-xs); color: var(--text-4); }
.login-divider::before, .login-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.magic-row { display: flex; gap: 8px; }
.magic-row input { flex: 1; padding: 11px 14px; border: 1px solid var(--border);
  border-radius: var(--r-md); background: var(--surface); color: var(--text); font-size: var(--fs-md); }
.magic-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.magic-row button {
  padding: 11px 16px; border-radius: var(--r-md); border: none;
  background: var(--accent); color: #fff; font-weight: 600; font-size: var(--fs-sm);
}
.magic-row button:hover:not(:disabled) { background: var(--accent-hover); }
.magic-row button:disabled { opacity: .5; cursor: not-allowed; }
.login-msg { font-size: var(--fs-sm); margin-top: 12px; min-height: 20px; line-height: 1.5; }
.login-msg.err { color: var(--red); }
.login-msg.ok  { color: var(--green); }
.login-msg.info{ color: var(--text-3); }
.login-foot { font-size: var(--fs-xs); color: var(--text-4); margin-top: 26px; line-height: 1.7; }
/* ════════════════════════════════════════════════════════════════════
   APP SHELL
   ════════════════════════════════════════════════════════════════════ */
.app { display: flex; min-height: 100vh; }
.app.hidden { display: none; }
.sidebar {
  width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
  background: var(--sidebar-bg); color: var(--sidebar-text);
  height: 100vh; position: sticky; top: 0; overflow-y: auto;
  display: flex; flex-direction: column; padding: 20px 12px;
  border-right: 1px solid var(--sidebar-border);
  transition: width .2s, flex-basis .2s, padding .2s;
}
body.collapsed .sidebar { width: var(--sidebar-w-collapsed); flex-basis: var(--sidebar-w-collapsed); padding: 20px 8px; }
body.collapsed .brand-text, body.collapsed .nav-item span:not(.ico) { display: none; }
body.collapsed .nav-item { justify-content: center; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px; }
.brand-logo {
  width: 34px; height: 34px; flex: 0 0 34px; border-radius: 10px;
  background: linear-gradient(135deg, #a78bfa, #ec4899); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
}
.brand-text { min-width: 0; }
.brand-name { font-weight: 600; font-size: var(--fs-md); color: #fff; line-height: 1.2; }
.brand-sub { font-size: var(--fs-xs); color: var(--sidebar-text-2); margin-top: 2px; }
.nav-group { margin-bottom: 18px; }
.nav-label {
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--sidebar-text-2); padding: 6px 10px;
}
body.collapsed .nav-label { display: none; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: var(--r-sm);
  color: var(--sidebar-text); font-size: var(--fs-md);
  cursor: pointer; transition: background .12s;
}
.nav-item:hover { background: var(--sidebar-hover); color: #fff; }
.nav-item.active { background: var(--sidebar-active); color: #fff; font-weight: 500; }
.nav-item .ico { width: 18px; text-align: center; font-size: 14px; }
.sidebar-user {
  margin-top: auto; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--r-md);
  background: rgba(255,255,255,.05); border: 1px solid var(--sidebar-border);
}
.user-avatar {
  width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%;
  background: linear-gradient(135deg, #a78bfa, #ec4899); color: #fff;
  display: grid; place-items: center; font-weight: 600; font-size: var(--fs-sm);
  overflow: hidden;
}
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-info { min-width: 0; }
.user-name { font-size: var(--fs-sm); color: #fff; font-weight: 500; }
.user-role { font-size: 10.5px; color: var(--sidebar-text-2); text-transform: uppercase; letter-spacing: .05em; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: var(--topbar-h); padding: 0 22px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  position: sticky; top: 0; z-index: 30;
}
.topbar-title { font-size: var(--fs-lg); font-weight: 600; }
.topbar-sub { font-size: var(--fs-xs); color: var(--text-4); margin-top: 1px; }
.topbar-actions { display: flex; gap: 6px; align-items: center; }
.content { flex: 1; padding: 24px 22px 60px; max-width: 1600px; width: 100%; }
/* ════════════════════════════════════════════════════════════════════
   BUTTONS
   ════════════════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--r-md);
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); font-weight: 500; font-size: var(--fs-sm);
  transition: background .12s, border-color .12s; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { background: var(--surface); border-color: var(--red); color: var(--red); }
.btn.danger:hover:not(:disabled) { background: var(--red-soft); }
.btn.green { background: var(--green); border-color: var(--green); color: #fff; }
.btn.green:hover:not(:disabled) { filter: brightness(.95); }
.btn.sm { padding: 6px 11px; font-size: var(--fs-xs); }
.btn.xs { padding: 4px 8px; font-size: 11px; }
.btn.icon { padding: 0; width: 36px; height: 36px; justify-content: center; border-radius: var(--r-full); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
/* ════════════════════════════════════════════════════════════════════
   FORMS
   ════════════════════════════════════════════════════════════════════ */
.field { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); font-weight: 500; color: var(--text-2); }
.field input, .field select, .field textarea {
  padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface); color: var(--text); font-size: var(--fs-md);
  width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.field .req { color: var(--red); }
/* ════════════════════════════════════════════════════════════════════
   CARDS
   ════════════════════════════════════════════════════════════════════ */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 20px 22px; margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.card-head h3 { font-size: var(--fs-lg); }
.card-head .hint { font-size: var(--fs-xs); color: var(--text-4); }
.kpi-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 14px 16px; position: relative; overflow: hidden;
}
.kpi::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), #ec4899);
}
.k-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); }
.k-value { font-size: var(--fs-2xl); font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.k-value.sm { font-size: var(--fs-xl); }
.k-sub { font-size: var(--fs-xs); color: var(--text-4); margin-top: 4px; }
/* ════════════════════════════════════════════════════════════════════
   TABLES
   ════════════════════════════════════════════════════════════════════ */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
thead th {
  background: var(--surface-2); text-align: left; padding: 10px 14px;
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--text-3); font-weight: 700; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border-2); color: var(--text-2); }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tfoot td { padding: 11px 14px; font-weight: 700; background: var(--surface-2); border-top: 2px solid var(--border); }
/* ════════════════════════════════════════════════════════════════════
   BADGES
   ════════════════════════════════════════════════════════════════════ */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: var(--r-full);
  font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
}
.badge.green  { background: var(--green-soft); color: var(--green); }
.badge.amber  { background: var(--amber-soft); color: var(--amber); }
.badge.red    { background: var(--red-soft); color: var(--red); }
.badge.blue   { background: var(--accent-soft); color: var(--accent-text); }
.badge.gray   { background: var(--surface-3); color: var(--text-3); }
.badge.purple { background: #f3e8ff; color: #7e22ce; }
/* ════════════════════════════════════════════════════════════════════
   TOAST
   ════════════════════════════════════════════════════════════════════ */
#toasts {
  position: fixed; right: 20px; bottom: 20px; z-index: 9000;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  pointer-events: auto; padding: 12px 16px; border-radius: var(--r-md);
  background: var(--text); color: var(--surface); font-size: var(--fs-sm); font-weight: 500;
  box-shadow: var(--shadow-lg); max-width: 380px;
  animation: slideIn .2s ease-out;
}
.toast.info    { background: var(--accent); color: #fff; }
.toast.success { background: var(--green); color: #fff; }
.toast.warn    { background: var(--amber); color: #fff; }
.toast.error   { background: var(--red); color: #fff; }
.toast.out     { opacity: 0; transition: opacity .3s; }
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
/* ════════════════════════════════════════════════════════════════════
   MODAL
   ════════════════════════════════════════════════════════════════════ */
#modalWrap { position: fixed; inset: 0; z-index: 500; display: none; }
#modalWrap.open { display: block; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(26,21,51,.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.modal {
  position: relative; background: var(--surface); border-radius: var(--r-xl);
  max-width: 700px; width: calc(100% - 32px); margin: 5vh auto; max-height: 90vh;
  display: flex; flex-direction: column; box-shadow: var(--shadow-lg); overflow: hidden;
}
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: var(--fs-lg); }
.modal-body { padding: 22px; overflow: auto; }
.modal-foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: var(--surface-2); }
.icon-btn {
  width: 30px; height: 30px; border-radius: var(--r-sm);
  display: inline-grid; place-items: center;
  background: transparent; border: 1px solid transparent;
  color: var(--text-3); font-size: 14px;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
/* ════════════════════════════════════════════════════════════════════
   EMPTY / LOADING
   ════════════════════════════════════════════════════════════════════ */
.empty { padding: 50px 20px; text-align: center; color: var(--text-4); font-size: var(--fs-sm); }
.empty .big { font-size: 34px; display: block; margin-bottom: 10px; opacity: .4; }
/* ════════════════════════════════════════════════════════════════════
   DEBUG PANEL
   ════════════════════════════════════════════════════════════════════ */
#dbg {
  position: fixed; bottom: 12px; left: 12px; right: 12px; max-height: 32vh;
  background: #0a0a0f; color: #e4ddf4; font-family: var(--mono); font-size: 11px;
  padding: 8px 12px; overflow-y: auto; z-index: 999999; border-radius: 10px;
  border: 1px solid #7c3aed; display: none; line-height: 1.55;
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
#dbg.on { display: block; }
#dbg .ln { padding: 1px 0; word-break: break-all; }
#dbgBtn {
  position: fixed; bottom: 20px; left: 20px; z-index: 999998;
  width: 40px; height: 40px; border-radius: 50%;
  background: #7c3aed; color: #fff; border: 0;
  font-size: 16px; cursor: pointer;
  box-shadow: 0 6px 16px rgba(124,58,237,.5);
}
/* ════════════════════════════════════════════════════════════════════
   PHASE 2 — ACCOUNTING UI
   ════════════════════════════════════════════════════════════════════ */
.acct-tree { font-size: 13px; }
.acct-row {
  display: grid; grid-template-columns: 100px 1fr 90px 130px 90px;
  gap: 10px; align-items: center;
  padding: 8px 12px; border-bottom: 1px solid var(--border-2);
  cursor: pointer;
}
.acct-row:hover { background: var(--surface-2); }
.acct-row.head {
  background: var(--surface-2); font-weight: 700; text-transform: uppercase;
  font-size: 10.5px; letter-spacing: .05em; color: var(--text-3);
  cursor: default;
}
.acct-row.head:hover { background: var(--surface-2); }
.acct-code { font-family: var(--mono); color: var(--text-3); }
.acct-name { font-weight: 500; }
.acct-name.child { padding-left: 22px; font-weight: 400; color: var(--text-2); }
.acct-name.child::before { content: "└─ "; opacity: .35; }
.acct-type {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; padding: 2px 7px; border-radius: var(--r-full);
  display: inline-block;
}
.acct-type.asset     { background: #dbeafe; color: #1e40af; }
.acct-type.liability { background: #fef3c7; color: #92400e; }
.acct-type.equity    { background: #ede9fe; color: #6b21a8; }
.acct-type.income    { background: #d1fae5; color: #065f46; }
.acct-type.expense   { background: #fee2e2; color: #991b1b; }
.acct-flag {
  font-size: 9.5px; padding: 1px 5px; border-radius: 4px;
  background: var(--surface-3); color: var(--text-3);
  font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  margin-left: 4px;
}
.acct-bal { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

];
/* Accounting constants used across §9–§12. */

/* ═══════════════════════════════════════════════════════════════════════════
   §2 — UTILS
   Exactly one definition per helper. No duplicates anywhere in the file.
═══════════════════════════════════════════════════════════════════════════ */
const uid = () => 'x' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const arr = v => Array.isArray(v) ? v : [];
const uniq = a => [...new Set(a)];
const sum = (list, key) => arr(list).reduce((a, o) => a + num(o[key]), 0);

/* Single escape function — escapes everything needed for both HTML text
   and inline attributes. Never build event handlers with string concat. */
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/\//g, '&#47;');
}

function today() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

function nowISO() { return new Date().toISOString(); }

function dateFmt(v) {
  if (!v) return '—';
  try {
    const d = new Date(String(v).length === 10 ? v + 'T00:00:00' : v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  } catch { return String(v); }
}

function dateTimeFmt(v) {
  if (!v) return '—';
  try {
    const d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
      + ' ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  } catch { return String(v); }
}

/* Single money function with options. */
function money(v, opts) {
  opts = opts || {};
  const n = num(v);
  const sym = (state.settings?.currency?.symbol) || 'Rs.';
  const decimals = opts.decimals ?? (state.settings?.currency?.decimals ?? 2);
  const body = Math.abs(n).toLocaleString('en-LK', {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  });
  const sign = n < 0 ? '-' : '';
  return opts.plain ? (sign + body) : (sign + sym + ' ' + body);
}

function money0(v) { return money(v, { decimals: 0 }); }

function diffDays(a, b) {
  if (!a || !b) return 0;
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}

function shiftDate(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function monthName(ym) {
  if (!ym || ym.length < 7) return ym || '—';
  try {
    const d = new Date(ym + '-01T00:00:00');
    return d.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
  } catch { return ym; }
}

function lastMonths(n) {
  const out = [];
  const d = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out.push(dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0'));
  }
  return out;
}

function csvEsc(v) {
  const s = (v === null || v === undefined) ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

/* ═══════════════════════════════════════════════════════════════════════════
   §3 — STATE
   Single source of truth. Never introduce another global store.
═══════════════════════════════════════════════════════════════════════════ */
const state = {
  /* Persisted data */
  data: {},
  settings: null,

  /* Session */
  user: null,
  role: 'viewer',
  perms: { write:false, delete:false, users:false, settings:false, backup:false },

  /* UI */
  view: 'dashboard',
  views: {},          // per-view ephemeral state, cleared on navigation

  /* Sync */
  sync: { dirty:false, lastPush:null, lastPull:null, inProgress:false },

  /* Transient — cleared on navigation */
  _scratch: {},

  /* Runtime flags */
  ready: false,
  firebaseReady: false,
  offline: false
};

/* Expose for debugging only. */
window.__LS__ = state;

/* ═══════════════════════════════════════════════════════════════════════════
   §4 — STORAGE
   Local cache — fast boot. Phase 16 will move this to encrypted IndexedDB.
═══════════════════════════════════════════════════════════════════════════ */
function loadCache() {
  try {
    const raw = localStorage.getItem(CONFIG.cacheKey);
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return false;

    state.data = {};
    COLLECTIONS.forEach(c => {
      state.data[c] = Array.isArray(parsed.data?.[c]) ? parsed.data[c] : [];
    });
    state.settings = parsed.settings || null;
    return true;
  } catch (e) {
    dbg.warn('Cache load failed: ' + e.message);
    return false;
  }
}

let _saveCacheTimer = null;
function saveCache() {
  clearTimeout(_saveCacheTimer);
  _saveCacheTimer = setTimeout(() => {
    try {
      localStorage.setItem(CONFIG.cacheKey, JSON.stringify({
        data: state.data,
        settings: state.settings,
        savedAt: nowISO()
      }));
    } catch (e) {
      dbg.warn('Cache save failed: ' + e.message);
    }
  }, 800);
}

function clearCache() {
  try { localStorage.removeItem(CONFIG.cacheKey); } catch {}
}

function isCacheStale() {
  try {
    const raw = localStorage.getItem(CONFIG.cacheKey);
    if (!raw) return true;
    const p = JSON.parse(raw);
    if (!p.savedAt) return true;
    return Date.now() - Date.parse(p.savedAt) > CONFIG.cacheTTLMs;
  } catch { return true; }
}

/* ═══════════════════════════════════════════════════════════════════════════
   §5 — FIREBASE
   One init, one auth, one firestore. No second Firebase app anywhere.
═══════════════════════════════════════════════════════════════════════════ */
let firebaseApp = null;
let auth = null;
let firestore = null;

function initFirebase() {
  try {
    if (!window.firebase || !firebase.initializeApp) {
      throw new Error('Firebase SDK did not load — check internet access to gstatic.com');
    }

    let existing = null;
    try { existing = firebase.app(); } catch {}
    if (existing && existing.options?.projectId !== CONFIG.firebase.projectId) {
      try { existing.delete(); } catch {}
      existing = null;
    }

    firebaseApp = existing || firebase.initializeApp(CONFIG.firebase);
    auth = firebase.auth(firebaseApp);
    firestore = firebase.firestore(firebaseApp);

    try {
      firestore.settings({ merge: true, ignoreUndefinedProperties: true });
    } catch {}

    state.firebaseReady = true;
    dbg.ok('Firebase ready • ' + CONFIG.firebase.projectId);
    return true;
  } catch (e) {
    state.firebaseReady = false;
    dbg.err('Firebase init failed: ' + e.message);
    return false;
  }
}

function colRef(name) { return firestore.collection(CONFIG.dataPrefix + name); }
function docRef(path) { return firestore.doc(path); }

/* ═══════════════════════════════════════════════════════════════════════════
   §6 — AUTH
   Google Sign-In with redirect fallback, magic link secondary, access
   control against lk/access, five roles.
═══════════════════════════════════════════════════════════════════════════ */
const ROLES = {
  owner:   { level: 100, perms: { write:true, delete:true, users:true, settings:true, backup:true } },
  admin:   { level: 90,  perms: { write:true, delete:true, users:true, settings:true, backup:true } },
  manager: { level: 70,  perms: { write:true, delete:true, users:false, settings:false, backup:false } },
  editor:  { level: 50,  perms: { write:true, delete:false, users:false, settings:false, backup:false } },
  viewer:  { level: 10,  perms: { write:false, delete:false, users:false, settings:false, backup:false } }
};

function setRole(role) {
  role = ROLES[role] ? role : 'viewer';
  state.role = role;
  state.perms = Object.assign({}, ROLES[role].perms);
  dbg.ok('Role set: ' + role);
}

async function loadAccess(forceFresh) {
  /* Try cache first (5 minute TTL) */
  if (!forceFresh) {
    try {
      const cached = JSON.parse(localStorage.getItem(CONFIG.accessCacheKey) || 'null');
      if (cached && Date.now() - cached.at < CONFIG.accessCacheMs) {
        return cached.value;
      }
    } catch {}
  }

  try {
    const snap = await docRef(CONFIG.accessPath).get();
    let value;

    if (snap.exists) {
      const d = snap.data() || {};
      value = {
        allowedEmails: Array.isArray(d.allowedEmails)
          ? d.allowedEmails.map(e => String(e).toLowerCase().trim())
          : [],
        userPerms: d.userPerms || {}
      };
      /* Ensure admin is always allowed */
      if (!value.allowedEmails.includes(CONFIG.adminEmail.toLowerCase())) {
        value.allowedEmails.push(CONFIG.adminEmail.toLowerCase());
      }
    } else {
      /* First ever run — bootstrap with admin */
      value = { allowedEmails: [CONFIG.adminEmail.toLowerCase()], userPerms: {} };
      try {
        await docRef(CONFIG.accessPath).set({
          allowedEmails: value.allowedEmails,
          userPerms: {},
          createdAt: nowISO(),
          updatedAt: nowISO()
        });
      } catch (e) {
        dbg.warn('Could not seed access doc: ' + e.message);
      }
    }

    try {
      localStorage.setItem(CONFIG.accessCacheKey, JSON.stringify({ at: Date.now(), value }));
    } catch {}
    return value;
  } catch (e) {
    dbg.warn('Access fetch failed: ' + (e.code || e.message));
    /* Fallback to stale cache */
    try {
      const cached = JSON.parse(localStorage.getItem(CONFIG.accessCacheKey) || 'null');
      if (cached) return cached.value;
    } catch {}
    /* Last resort: admin only */
    return { allowedEmails: [CONFIG.adminEmail.toLowerCase()], userPerms: {} };
  }
}

async function checkAccess(email) {
  if (!email) return null;
  const em = email.toLowerCase().trim();
  if (em === CONFIG.adminEmail.toLowerCase()) return 'owner';

  const access = await loadAccess(false);
  if (!access.allowedEmails.includes(em)) return null;

  const p = access.userPerms[em] || {};
  return p.role && ROLES[p.role] ? p.role : 'viewer';
}

async function signInWithGoogle() {
  const btn = document.getElementById('googleBtn');
  const txt = document.getElementById('googleBtnText');
  if (btn?.dataset.busy === '1') return;

  loginMsg('');

  if (!state.firebaseReady && !initFirebase()) {
    loginMsg('Firebase could not initialize. Check your internet connection.', 'err');
    return;
  }

  if (btn) { btn.disabled = true; btn.dataset.busy = '1'; }
  if (txt) txt.textContent = 'Connecting to Google…';

  try {
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  } catch {}

  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });

  try {
    await auth.signInWithPopup(provider);
  } catch (e) {
    const code = e?.code || '';
    const msg  = e?.message || String(e);

    if (code === 'auth/popup-blocked' || code === 'auth/cancelled-popup-request') {
      if (txt) txt.textContent = 'Redirecting to Google…';
      try {
        await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
        return;
      } catch (err) {
        loginMsg('Google redirect failed: ' + (err.code || err.message), 'err');
      }
    } else if (code === 'auth/popup-closed-by-user') {
      loginMsg('Sign-in window closed. Try again.', 'err');
    } else if (code === 'auth/unauthorized-domain') {
      loginMsg(
        'This domain is not authorized in Firebase.\n' +
        'Add “' + location.hostname + '” under Firebase Console → Authentication → Settings → Authorized domains.',
        'err'
      );
    } else if (code === 'auth/operation-not-allowed') {
      loginMsg('Google Sign-In is disabled in your Firebase project.\nEnable it in Authentication → Sign-in method.', 'err');
    } else if (code === 'auth/network-request-failed') {
      loginMsg('Network error — check your connection and try again.', 'err');
    } else {
      loginMsg('Sign-in failed: ' + code + '\n' + msg, 'err');
    }

    if (btn) { btn.disabled = false; btn.dataset.busy = '0'; }
    if (txt) txt.textContent = 'Continue with Google';
  }
}

async function signInWithMagicLink() {
  const emailEl = document.getElementById('magicEmail');
  const btn = document.getElementById('magicBtn');
  const email = (emailEl?.value || '').trim().toLowerCase();

  if (!email || !email.includes('@')) {
    loginMsg('Please enter a valid email.', 'err');
    return;
  }

  if (!state.firebaseReady && !initFirebase()) {
    loginMsg('Firebase could not initialize.', 'err');
    return;
  }

  const role = await checkAccess(email);
  if (!role) {
    loginMsg('This email is not authorized. Contact the administrator.', 'err');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending…';
  loginMsg('');

  try {
    await auth.sendSignInLinkToEmail(email, {
      url: location.origin + location.pathname,
      handleCodeInApp: true
    });
    try { localStorage.setItem('lankashoe_magic_email', email); } catch {}
    loginMsg('Sign-in link sent to ' + email + '. Check your inbox.', 'ok');
    btn.textContent = 'Sent';
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Send Link'; }, 8000);
  } catch (e) {
    const code = e?.code || '';
    if (code === 'auth/unauthorized-continue-uri') {
      loginMsg('Domain not authorized for email links. Add it in Firebase Console → Authentication → Settings.', 'err');
    } else if (code === 'auth/operation-not-allowed') {
      loginMsg('Email link sign-in is disabled in Firebase.', 'err');
    } else {
      loginMsg('Failed: ' + code + ' ' + (e.message || ''), 'err');
    }
    btn.disabled = false;
    btn.textContent = 'Send Link';
  }
}

async function signOut() {
  if (!confirm('Sign out?')) return;
  try { await pushToFirestore(); } catch {}
  try { await auth.signOut(); } catch {}
  clearCache();
  try { localStorage.removeItem(CONFIG.accessCacheKey); } catch {}
  location.reload();
}

async function handleMagicLinkReturn() {
  if (!state.firebaseReady) return false;
  try {
    if (!auth.isSignInWithEmailLink(location.href)) return false;

    let email = null;
    try { email = localStorage.getItem('lankashoe_magic_email'); } catch {}
    if (!email) {
      email = window.prompt('Confirm your email to finish sign-in:');
      if (!email) return false;
    }

    await auth.signInWithEmailLink(email, location.href);
    try { localStorage.removeItem('lankashoe_magic_email'); } catch {}

    if (location.href.includes('apiKey=') || location.href.includes('oobCode=')) {
      history.replaceState(null, '', location.pathname);
    }
    return true;
  } catch (e) {
    dbg.err('Magic link return failed: ' + (e.code || e.message));
    return false;
  }
}

async function onAuthStateChanged(user) {
  const btn = document.getElementById('googleBtn');
  const txt = document.getElementById('googleBtnText');

  if (!user) {
    state.user = null;
    showLogin();
    if (btn) { btn.disabled = false; btn.dataset.busy = '0'; }
    if (txt) txt.textContent = 'Continue with Google';
    return;
  }

  if (txt) txt.textContent = 'Verifying access…';
  if (btn) btn.disabled = true;

  try {
    loadCache();

    const role = await checkAccess(user.email);
    if (!role) {
      loginMsg('Access denied for ' + user.email + '.\nContact the administrator.', 'err');
      try { await auth.signOut(); } catch {}
      return;
    }

    state.user = {
      uid: user.uid,
      email: user.email,
      name: user.displayName || user.email.split('@')[0],
      photo: user.photoURL || null
    };
    setRole(role);

    hideLogin();

    /* Seed Chart of Accounts on first run (idempotent). */
    await seedChartOfAccountsIfEmpty();

    renderApp();
    toast('Welcome, ' + (state.user.name || state.user.email), 'success');

    /* Refresh from Firestore in background if cache is stale. */
    if (isCacheStale()) {
      dbg.info('Cache stale — pulling from Firestore');
      pullFromFirestore()
        .then(async () => {
          await seedChartOfAccountsIfEmpty();
          takeSnapshot();
          renderApp();
        })
        .catch(e => dbg.err('Background pull failed: ' + e.message));
    } else {
      dbg.info('Cache fresh — skipping cloud pull');
      takeSnapshot();
    }

    registerLogin(user);
  } catch (e) {
    dbg.err('Auth transition failed: ' + e.message);
    loginMsg('App initialization failed: ' + e.message, 'err');
    if (btn) btn.disabled = false;
    if (txt) txt.textContent = 'Continue with Google';
  }
}

async function registerLogin(user) {
  if (state.offline || !state.firebaseReady) return;
  try {
    const ref = docRef(CONFIG.usersCol + '/' + user.uid);
    const doc = await ref.get();
    const now = nowISO();
    if (doc.exists) {
      await ref.set({
        email: user.email,
        name: user.displayName,
        photo: user.photoURL,
        role: state.role,
        lastLogin: now
      }, { merge: true });
    } else {
      await ref.set({
        email: user.email,
        name: user.displayName,
        photo: user.photoURL,
        role: state.role,
        firstLogin: now,
        lastLogin: now
      });
    }
  } catch (e) {
    dbg.warn('registerLogin failed: ' + (e.code || e.message));
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   §7 — SYNC
   The quota-safe diff pipeline. Only changed documents are pushed.
═══════════════════════════════════════════════════════════════════════════ */
let _snapshot = {};           // { "collection:id": JSON string }
let _dirty = new Set();       // "collection:id" keys that changed locally
let _syncTimer = null;

function takeSnapshot() {
  _snapshot = {};
  COLLECTIONS.forEach(col => {
    arr(state.data[col]).forEach(doc => {
      if (doc && doc.id) {
        try { _snapshot[col + ':' + doc.id] = JSON.stringify(doc); } catch {}
      }
    });
  });
  dbg.ok('Snapshot captured: ' + Object.keys(_snapshot).length + ' docs');
}

function markDirty(collection, id) {
  if (!collection || !id) return;
  _dirty.add(collection + ':' + id);
  state.sync.dirty = true;
  scheduleSync();
}

function scheduleSync() {
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => {
    pushToFirestore().catch(e => dbg.err('Sync failed: ' + (e.code || e.message)));
  }, CONFIG.syncDebounceMs);
}

async function pushToFirestore() {
  if (state.offline || !state.firebaseReady || !state.user) return;
  if (state.sync.inProgress) return;
  if (_dirty.size === 0) return;

  state.sync.inProgress = true;
  updateSyncBtn('syncing');

  try {
    const ops = [];

    /* Diff each dirty key against snapshot. */
    _dirty.forEach(key => {
      const [col, id] = key.split(':');
      const doc = arr(state.data[col]).find(d => d.id === id);
      if (doc) {
        const now = JSON.stringify(doc);
        if (_snapshot[key] !== now) {
          ops.push({ type: 'set', col, id, data: doc });
          _snapshot[key] = now;
        }
      } else if (_snapshot[key] !== undefined) {
        ops.push({ type: 'delete', col, id });
        delete _snapshot[key];
      }
    });

    /* Detect orphan deletions (bulk delete scenarios). */
    Object.keys(_snapshot).forEach(key => {
      const [col, id] = key.split(':');
      if (!arr(state.data[col]).some(d => d.id === id)) {
        ops.push({ type: 'delete', col, id });
        delete _snapshot[key];
      }
    });

    if (ops.length === 0) {
      _dirty.clear();
      state.sync.dirty = false;
      state.sync.inProgress = false;
      updateSyncBtn('ok');
      return;
    }

    dbg.info('Pushing ' + ops.length + ' change(s)');

    /* Firestore max batch size is 500; we use 450 for safety margin. */
    for (let i = 0; i < ops.length; i += CONFIG.batchSize) {
      const batch = firestore.batch();
      ops.slice(i, i + CONFIG.batchSize).forEach(op => {
        const ref = colRef(op.col).doc(op.id);
        if (op.type === 'delete') batch.delete(ref);
        else batch.set(ref, JSON.parse(JSON.stringify(op.data)));
      });
      await batch.commit();
    }

    _dirty.clear();
    state.sync.dirty = false;
    state.sync.lastPush = new Date();
    updateSyncBtn('ok');
    dbg.ok('Pushed ' + ops.length + ' change(s)');
  } catch (e) {
    dbg.err('pushToFirestore: ' + (e.code || e.message));
    updateSyncBtn('err');
    /* Dirty set retained for retry. */
  } finally {
    state.sync.inProgress = false;
  }
}

async function pullFromFirestore() {
  if (state.offline || !state.firebaseReady || !state.user) return;

  dbg.info('Pulling all collections…');

  /* Settings first */
  try {
    const snap = await docRef(CONFIG.settingsPath).get();
    if (snap.exists) {
      state.settings = Object.assign(defaultSettings(), snap.data());
    } else {
      state.settings = defaultSettings();
    }
  } catch (e) {
    dbg.warn('Settings pull failed: ' + (e.code || e.message));
    if (!state.settings) state.settings = defaultSettings();
  }

  /* Collections in parallel chunks of 8 (avoids rate limits and speeds boot). */
  const CHUNK = 8;
  let loaded = 0;

  for (let i = 0; i < COLLECTIONS.length; i += CHUNK) {
    const slice = COLLECTIONS.slice(i, i + CHUNK);
    await Promise.all(slice.map(col => new Promise(resolve => {
      colRef(col).get()
        .then(snap => {
          const items = [];
          snap.forEach(doc => {
            const d = doc.data() || {};
            d.id = d.id || doc.id;
            items.push(d);
          });
          state.data[col] = items;
          loaded++;
          resolve();
        })
        .catch(e => {
          dbg.warn('[' + col + '] ' + (e.code || e.message));
          if (!Array.isArray(state.data[col])) state.data[col] = [];
          resolve();
        });
    })));
  }

  state.sync.lastPull = new Date();
  saveCache();
  dbg.ok('Pull complete — ' + loaded + ' collections');
  return true;
}

function updateSyncBtn(mode) {
  const btn = document.getElementById('syncBtn');
  if (!btn) return;
  if (mode === 'syncing') {
    btn.textContent = '⟳';
    btn.title = 'Syncing…';
  } else if (mode === 'err') {
    btn.textContent = '⚠';
    btn.title = 'Sync error — click to retry';
  } else {
    btn.textContent = '↻';
    btn.title = state.sync.lastPush
      ? 'Last sync: ' + state.sync.lastPush.toLocaleTimeString()
      : 'Not synced yet';
  }
}

function makeAccount(def) {
  return {
    id: uid(),
    code: String(def.code || ''),
    name: String(def.name || ''),
    type: def.type,
    subtype: def.subtype || '',
    parentId: def.parentId || null,
    isControl: !!def.isControl,
    controlType: def.controlType || null,
    isContra: !!def.isContra,
    isBank: def.controlType === 'bank' || def.controlType === 'cash' || def.controlType === 'petty-cash',
    active: def.active !== false,
    description: def.description || '',
    openingBalance: num(def.openingBalance),
    openingDate: def.openingDate || null,
    createdAt: nowISO(),
    createdBy: state.user?.email || 'system',
    updatedAt: nowISO(),
    updatedBy: state.user?.email || 'system'
  };
}

async function seedChartOfAccountsIfEmpty() {
  ensureStateShape();

  if (arr(state.data.accounts).length > 0) return;
  if (state.settings?.accounting?.accountsSeeded) return;

  const created = [];
  STANDARD_COA.forEach(def => {
    const acc = makeAccount(def);
    state.data.accounts.push(acc);
    created.push(acc);
  });

  state.settings.accounting = state.settings.accounting || {};
  state.settings.accounting.accountsSeeded = true;
  state.settings.updatedAt = nowISO();
  state.settings.updatedBy = state.user?.email || 'system';

  saveCache();

  /* Push all new accounts + updated settings to Firestore. */
  created.forEach(a => markDirty('accounts', a.id));
  try {
    await docRef(CONFIG.settingsPath).set(JSON.parse(JSON.stringify(state.settings)));
  } catch (e) {
    dbg.warn('Settings push failed: ' + e.message);
  }

  dbg.ok('Chart of Accounts seeded (' + created.length + ' accounts)');
}
function ensureStateShape() {
  if (!state.settings) state.settings = defaultSettings();
  COLLECTIONS.forEach(c => {
    if (!Array.isArray(state.data[c])) state.data[c] = [];
  });
}

/* ───────────────────────────────────────────────────────────────────────────
   Cheque summary — used by customer views and rating engine
─────────────────────────────────────────────────────────────────────────── */
function customerChequeSummary(customerId) {
  const all = arr(state.data.customerCheques).filter(c => c.customerId === customerId);
  const inHand  = all.filter(c => c.status === 'In Hand');
  const issued  = all.filter(c => c.status === 'Issued');
  const cleared = all.filter(c => c.status === 'Cleared');
  const bounced = all.filter(c => c.status === 'Bounced');
  const stopped = all.filter(c => c.status === 'Stopped');

  const v = list => sum(list, 'amount');

  return {
    total:   { count: all.length,     value: v(all) },
    inHand:  { count: inHand.length,  value: v(inHand) },
    issued:  { count: issued.length,  value: v(issued) },
    cleared: { count: cleared.length, value: v(cleared) },
    bounced: { count: bounced.length, value: v(bounced) },
    stopped: { count: stopped.length, value: v(stopped) },
    all,
    byStatus: { inHand, issued, cleared, bounced, stopped }
  };
}

/* ───────────────────────────────────────────────────────────────────────────
   Reliability — v15 badge preserved
─────────────────────────────────────────────────────────────────────────── */
function customerReliability(customerId) {
  const s = customerChequeSummary(customerId);
  const resolved = s.cleared.count + s.bounced.count;
  if (resolved < 3) return { score: 0, label: 'New', cls: 'new' };
  const pct = (s.cleared.count / resolved) * 100;
  if (pct >= 90) return { score: pct, label: 'Trusted', cls: 'trusted' };
  if (pct >= 70) return { score: pct, label: 'Watch', cls: 'watch' };
  return { score: pct, label: 'Risky', cls: 'risky' };
}

/* ───────────────────────────────────────────────────────────────────────────
   Rating engine — Platinum / Gold / Silver / Bronze / New
   Weighted score: 60% clear rate + 20% volume + 20% tenure.
─────────────────────────────────────────────────────────────────────────── */
function computeCustomerRating(customerId) {
  const cheques = arr(state.data.customerCheques).filter(q => q.customerId === customerId);
  const total = cheques.length;

  if (total < 3) {
    return {
      tier: 'new', score: 0, label: 'New',
      clearRate: 0, cheques: total, cleared: 0, bounced: 0,
      totalCleared: 0, monthsActive: 0,
      reason: 'Fewer than 3 cheques — rating not yet available'
    };
  }

  const clearedList = cheques.filter(q => q.status === 'Cleared');
  const bouncedList = cheques.filter(q => q.status === 'Bounced');
  const cleared = clearedList.length;
  const bounced = bouncedList.length;
  const resolved = cleared + bounced;

  if (resolved === 0) {
    return {
      tier: 'new', score: 0, label: 'New',
      clearRate: 0, cheques: total, cleared: 0, bounced: 0,
      totalCleared: 0, monthsActive: 0,
      reason: 'No resolved cheques yet'
    };
  }

  const clearRate = (cleared / resolved) * 100;
  const totalCleared = sum(clearedList, 'amount');

  const dates = cheques.map(q => q.date).filter(Boolean).sort();
  const firstDate = dates[0];
  const monthsActive = firstDate
    ? Math.max(1, Math.round(diffDays(firstDate, today()) / 30))
    : 1;

  /* Weighted score */
  const rateComponent   = clearRate;                                     /* 0–100 */
  const volumeComponent = Math.min(100, (totalCleared / 500000) * 100);  /* cap 500k */
  const tenureComponent = Math.min(100, (monthsActive / 12) * 100);      /* cap 12 mo */
  const score = Math.round(
    rateComponent * 0.6 + volumeComponent * 0.2 + tenureComponent * 0.2
  );

  /* Tier assignment — clear-rate gates + volume/tenure gates */
  let tier, label;
  if (clearRate >= 95 && total >= 20 && monthsActive >= 12) {
    tier = 'platinum'; label = 'Platinum';
  } else if (clearRate >= 85 && total >= 10 && monthsActive >= 6) {
    tier = 'gold'; label = 'Gold';
  } else if (clearRate >= 70 && total >= 5) {
    tier = 'silver'; label = 'Silver';
  } else {
    tier = 'bronze'; label = 'Bronze';
  }

  return {
    tier, score, label,
    clearRate: Math.round(clearRate * 10) / 10,
    cheques: total,
    cleared, bounced,
    totalCleared,
    monthsActive,
    reason: clearRate.toFixed(1) + '% cleared • ' +
            money0(totalCleared) + ' lifetime • ' +
            monthsActive + ' months active'
  };
}

function ratingBadge(rating) {
  if (!rating) return '';
  const ico = {
    platinum: '💎', gold: '🥇', silver: '🥈', bronze: '🥉', new: '•'
  }[rating.tier] || '';
  return '<span class="rating-badge ' + rating.tier + '">' +
    ico + ' ' + esc(rating.label) +
  '</span>';
}

/* ───────────────────────────────────────────────────────────────────────────
   Aging engines — v15 logic preserved, works from raw collections
─────────────────────────────────────────────────────────────────────────── */
function customerAging(customerId, asOf) {
  asOf = asOf || today();

  let current = 0, d30 = 0, d60 = 0, d90 = 0, count = 0;

  arr(state.data.customerCheques)
    .filter(q => q.customerId === customerId)
    .filter(q => q.status === 'Bounced')
    .filter(q => !q.bouncedDate || q.bouncedDate <= asOf)
    .forEach(q => {
      const settled = sum(
        arr(state.data.chequeSettlements).filter(s => s.chequeId === q.id),
        'amount'
      );
      const remaining = Math.max(0, num(q.amount) - settled);
      if (remaining <= 0.005) return;

      count++;
      const bounceDate = q.bouncedDate || q.date || asOf;
      const age = Math.max(0, Math.round(diffDays(bounceDate, asOf)));

      if (age <= 30)      current += remaining;
      else if (age <= 60) d30 += remaining;
      else if (age <= 90) d60 += remaining;
      else                d90 += remaining;
    });

  return {
    current, d30, d60, d90,
    total: current + d30 + d60 + d90,
    bounced: count
  };
}

function supplierAging(supplierId, asOf) {
  asOf = asOf || today();
  const s = supObj(supplierId);
  if (!s) return { current: 0, d30: 0, d60: 0, d90: 0, total: 0 };

  /* Build a list of debits (what we owe) */
  const debits = [];

  const ob = num(s.openingBalance);
  if (ob > 0) {
    debits.push({
      date: s.openingDate || asOf,
      amount: ob,
      source: 'opening'
    });
  }

  arr(state.data.purchases)
    .filter(p => p.supplierId === supplierId)
    .filter(p => !['rejected','cancelled'].includes(String(p.status || '').toLowerCase()))
    .filter(p => !p.isOpeningBalance && p.transactionType !== 'opening_balance')
    .filter(p => !p.date || p.date <= asOf)
    .forEach(p => {
      debits.push({
        date: p.date || asOf,
        amount: num(p.amount),
        source: 'purchase',
        id: p.id
      });
    });

  /* Credits = what we've paid or returned */
  let credits = 0;

  arr(state.data.supplierReturns)
    .filter(r => r.supplierId === supplierId)
    .filter(r => !['rejected','cancelled'].includes(String(r.status || '').toLowerCase()))
    .filter(r => !r.date || r.date <= asOf)
    .forEach(r => { credits += num(r.amount); });

  arr(state.data.payments)
    .filter(p => p.supplierId === supplierId)
    .filter(p => !p.fullyReversed)
    .filter(p => !['rejected','cancelled','void'].includes(String(p.status || '').toLowerCase()))
    .filter(p => !p.date || p.date <= asOf)
    .forEach(p => { credits += num(p.amount); });

  /* Apply credits oldest-first (FIFO) */
  debits.sort((a, b) => String(a.date).localeCompare(String(b.date)));

  const bk = state.settings?.defaults?.agingBuckets || [30, 60, 90];
  const b1 = Math.max(1, num(bk[0]) || 30);
  const b2 = Math.max(b1, num(bk[1]) || 60);
  const b3 = Math.max(b2, num(bk[2]) || 90);
  const creditDays = num(s.creditDays) || 30;

  let current = 0, d30 = 0, d60 = 0, d90 = 0;

  debits.forEach(item => {
    if (item.amount <= 0) return;
    if (credits > 0) {
      const used = Math.min(credits, item.amount);
      item.amount -= used;
      credits -= used;
    }
    if (item.amount <= 0.005) return;

    const age = Math.max(0, Math.round(diffDays(item.date, asOf)));
    const effectiveAge = Math.max(0, age - creditDays);

    if (effectiveAge <= b1)      current += item.amount;
    else if (effectiveAge <= b2) d30 += item.amount;
    else if (effectiveAge <= b3) d60 += item.amount;
    else                         d90 += item.amount;
  });

  return {
    current, d30, d60, d90,
    total: current + d30 + d60 + d90
  };
}

/* ───────────────────────────────────────────────────────────────────────────
   Balance engines — v15 logic preserved
─────────────────────────────────────────────────────────────────────────── */
function customerBalance(customerId) {
  const c = custObj(customerId);
  if (!c) return 0;

  let bal = 0;

  /* Opening balance */
  const ob = Math.abs(num(c.openingBalance));
  if (c.openingBalanceType === 'credit' || c.openingBalanceType === 'negative') {
    bal -= ob;
  } else {
    bal += ob;
  }

  /* Receipts reduce debt */
  arr(state.data.receipts)
    .filter(r => r.customerId === customerId)
    .filter(r => !['rejected','cancelled'].includes(String(r.status || '').toLowerCase()))
    .forEach(r => { bal -= num(r.amount); });

  /* Bounced cheques add back */
  arr(state.data.customerCheques)
    .filter(q => q.customerId === customerId)
    .filter(q => q.status === 'Bounced')
    .forEach(q => {
      const settled = sum(
        arr(state.data.chequeSettlements).filter(s => s.chequeId === q.id),
        'amount'
      );
      bal += Math.max(0, num(q.amount) - settled);
    });

  /* Customer refunds (payments of type customer_refund) */
  arr(state.data.payments)
    .filter(p => p.type === 'customer_refund' && p.customerId === customerId)
    .filter(p => !['rejected','cancelled','void'].includes(String(p.status || '').toLowerCase()))
    .forEach(p => { bal -= num(p.amount); });

  return bal;
}

function supplierBalance(supplierId) {
  const s = supObj(supplierId);
  if (!s) return 0;

  let bal = 0;

  /* Opening */
  const ob = Math.abs(num(s.openingBalance));
  if (s.openingBalanceType === 'advance' || s.openingBalanceType === 'debit') {
    bal -= ob;
  } else {
    bal += ob;
  }

  /* Purchases add */
  arr(state.data.purchases)
    .filter(p => p.supplierId === supplierId)
    .filter(p => !['rejected','cancelled'].includes(String(p.status || '').toLowerCase()))
    .filter(p => !p.isOpeningBalance && p.transactionType !== 'opening_balance')
    .forEach(p => { bal += num(p.amount); });

  /* Returns reduce */
  arr(state.data.supplierReturns)
    .filter(r => r.supplierId === supplierId)
    .filter(r => !['rejected','cancelled'].includes(String(r.status || '').toLowerCase()))
    .forEach(r => { bal -= num(r.amount); });

  /* Payments reduce */
  arr(state.data.payments)
    .filter(p => p.supplierId === supplierId)
    .filter(p => !p.fullyReversed)
    .filter(p => !['rejected','cancelled','void'].includes(String(p.status || '').toLowerCase()))
    .forEach(p => { bal -= num(p.amount); });

  return bal;
}

/* ───────────────────────────────────────────────────────────────────────────
   Global rollups (used by dashboards)
─────────────────────────────────────────────────────────────────────────── */
function totalPayable() {
  return allSuppliers().reduce((a, s) => a + Math.max(0, supplierBalance(s.id)), 0);
}

function totalReceivable() {
  return allCustomers().reduce((a, c) => a + Math.max(0, customerBalance(c.id)), 0);
}

function customerRatingDistribution() {
  const dist = { platinum: 0, gold: 0, silver: 0, bronze: 0, new: 0 };
  allCustomers().forEach(c => {
    const r = computeCustomerRating(c.id);
    dist[r.tier] = (dist[r.tier] || 0) + 1;
  });
  return dist;
}

/* ═══════════════════════════════════════════════════════════════════════════
   §9 — ACCOUNTING CORE
   Pure functions. No side effects. No DOM access. No Firestore calls.
   Every report and view reads from these; nothing else computes balances.
═══════════════════════════════════════════════════════════════════════════ */
function allAccounts() { return arr(state.data.accounts); }
function getAccount(id) { return allAccounts().find(a => a.id === id) || null; }
function getAccountByCode(code) { return allAccounts().find(a => a.code === String(code)) || null; }

function accountsSorted() {
  return allAccounts().slice().sort((a, b) => String(a.code).localeCompare(String(b.code)));
}
function accountsByType(type) {
  return accountsSorted().filter(a => a.type === type);
}
function accountHasChildren(id) {
  return allAccounts().some(a => a.parentId === id);
}

/* Effective normal balance direction, accounting for the contra flag.
   A contra asset behaves like a liability (credit-normal). */
function normalDirection(acc) {
  if (!acc) return 'debit';
  const base = NORMAL_BALANCE[acc.type] || 'debit';
  if (acc.isContra) return base === 'debit' ? 'credit' : 'debit';
  return base;
}

/* Balance of one account, as of a given date. Positive = normal direction. */
function accountBalance(accId, asOf) {
  const acc = getAccount(accId);
  if (!acc) return 0;
  asOf = asOf || today();

  const dir = normalDirection(acc);
  let bal = 0;

  /* Opening balance (stored in normal direction, positive = normal). */
  if (num(acc.openingBalance) !== 0 && (!acc.openingDate || acc.openingDate <= asOf)) {
    bal += num(acc.openingBalance);
  }

  /* Posted journal lines up to asOf. */
  arr(state.data.journalEntries).forEach(entry => {
    if (entry.status !== 'posted') return;
    if (entry.date > asOf) return;
    arr(entry.lines).forEach(line => {
      if (line.accountId !== accId) return;
      const d = num(line.debit), c = num(line.credit);
      bal += (d - c) * (dir === 'debit' ? 1 : -1);
    });
  });

  return bal;
}

/* Raw debits and credits, no direction adjustment. */
function accountRawTotals(accId, asOf) {
  asOf = asOf || today();
  let debits = 0, credits = 0;
  arr(state.data.journalEntries).forEach(entry => {
    if (entry.status !== 'posted') return;
    if (entry.date > asOf) return;
    arr(entry.lines).forEach(line => {
      if (line.accountId !== accId) return;
      debits += num(line.debit);
      credits += num(line.credit);
    });
  });
  return { debits, credits };
}

/* Trial balance: every account with a non-zero balance, split into D/C columns. */
function trialBalance(asOf) {
  asOf = asOf || today();
  const rows = [];

  accountsSorted().forEach(acc => {
    const bal = accountBalance(acc.id, asOf);
    if (Math.abs(bal) < 0.005) return;
    const dir = normalDirection(acc);
    const debitCol  = dir === 'debit'  ? Math.max(0, bal)  : Math.max(0, -bal);
    const creditCol = dir === 'credit' ? Math.max(0, bal)  : Math.max(0, -bal);
    rows.push({ account: acc, debit: debitCol, credit: creditCol, raw: bal });
  });

  const totalDebit = rows.reduce((a, r) => a + r.debit, 0);
  const totalCredit = rows.reduce((a, r) => a + r.credit, 0);
  const balanced = Math.abs(totalDebit - totalCredit) < 0.01;
  return { rows, totalDebit, totalCredit, balanced };
}

/* Full ledger for one account: opening + posted movements + running balance. */
function accountLedger(accId, fromDate, toDate) {
  fromDate = fromDate || '0000-01-01';
  toDate   = toDate   || '9999-12-31';

  const acc = getAccount(accId);
  if (!acc) return { opening: 0, rows: [], closing: 0, totalDebit: 0, totalCredit: 0 };

  const dir = normalDirection(acc);

  /* Opening balance = everything strictly before fromDate. */
  let opening = 0;
  if (num(acc.openingBalance) !== 0 && (!acc.openingDate || acc.openingDate < fromDate)) {
    opening += num(acc.openingBalance);
  }
  arr(state.data.journalEntries).forEach(entry => {
    if (entry.status !== 'posted') return;
    if (entry.date >= fromDate) return;
    arr(entry.lines).forEach(line => {
      if (line.accountId !== accId) return;
      const d = num(line.debit), c = num(line.credit);
      opening += (d - c) * (dir === 'debit' ? 1 : -1);
    });
  });

  /* Rows within range, sorted by date then by entry number. */
  const entries = arr(state.data.journalEntries)
    .filter(e => e.status === 'posted' && e.date >= fromDate && e.date <= toDate)
    .filter(e => arr(e.lines).some(l => l.accountId === accId))
    .sort((a, b) => a.date.localeCompare(b.date) || String(a.entryNo).localeCompare(String(b.entryNo)));

  let running = opening;
  let totalDebit = 0, totalCredit = 0;
  const rows = [];

  entries.forEach(entry => {
    arr(entry.lines).forEach(line => {
      if (line.accountId !== accId) return;
      const d = num(line.debit), c = num(line.credit);
      running += (d - c) * (dir === 'debit' ? 1 : -1);
      totalDebit += d;
      totalCredit += c;
      rows.push({
        entryId: entry.id,
        date: entry.date,
        entryNo: entry.entryNo,
        reference: entry.reference,
        description: entry.description,
        memo: line.memo || '',
        debit: d,
        credit: c,
        balance: running
      });
    });
  });

  return { opening, rows, closing: running, totalDebit, totalCredit };
}

/* Profit & Loss statement. Supports accrual or cash basis. */
function profitAndLoss(fromDate, toDate, basis) {
  basis = basis || (state.settings?.accounting?.basis || 'accrual');
  const isCash = basis === 'cash';

  const collectType = (type) => {
    const list = [];
    accountsByType(type).forEach(acc => {
      const dir = normalDirection(acc);
      let amt = 0;

      arr(state.data.journalEntries).forEach(entry => {
        if (entry.status !== 'posted') return;
        if (entry.date < fromDate || entry.date > toDate) return;

        /* Cash basis: only count entries that touch a cash/bank account. */
        if (isCash) {
          const touchesCash = arr(entry.lines).some(l => {
            const a = getAccount(l.accountId);
            return a && a.isBank;
          });
          if (!touchesCash) return;
        }

        arr(entry.lines).forEach(line => {
          if (line.accountId !== acc.id) return;
          const d = num(line.debit), c = num(line.credit);
          amt += (d - c) * (dir === 'debit' ? 1 : -1);
        });
      });

      if (Math.abs(amt) > 0.005) list.push({ account: acc, amount: amt });
    });
    return list;
  };

  const income = collectType('income');
  const expenses = collectType('expense');
  const totalIncome = income.reduce((a, x) => a + x.amount, 0);
  const totalExpenses = expenses.reduce((a, x) => a + x.amount, 0);

  return {
    fromDate, toDate, basis,
    income, expenses,
    totalIncome, totalExpenses,
    netProfit: totalIncome - totalExpenses
  };
}

/* Balance Sheet as-of a given date. Includes Current Year Earnings. */
function balanceSheet(asOf) {
  asOf = asOf || today();

  const collect = (type) => {
    const list = [];
    accountsByType(type).forEach(acc => {
      const bal = accountBalance(acc.id, asOf);
      if (Math.abs(bal) > 0.005) list.push({ account: acc, amount: bal });
    });
    return list;
  };

  const assets = collect('asset');
  const liabilities = collect('liability');
  const equity = collect('equity');

  /* Current Year Earnings = P&L from fiscal year start to asOf. */
  const fiscalYearStart = (() => {
    const s = state.settings?.accounting?.fiscalYearStart || '01-01';
    const y = new Date().getFullYear();
    const [m, d] = s.split('-').map(x => parseInt(x, 10));
    return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  })();

  const pnl = profitAndLoss(fiscalYearStart, asOf);
  const currentEarnings = pnl.netProfit;

  const totalAssets = assets.reduce((a, x) => a + x.amount, 0);
  const totalLiabilities = liabilities.reduce((a, x) => a + x.amount, 0);
  const totalEquityAccounts = equity.reduce((a, x) => a + x.amount, 0);
  const totalEquity = totalEquityAccounts + currentEarnings;
  const liabilitiesAndEquity = totalLiabilities + totalEquity;
  const balanced = Math.abs(totalAssets - liabilitiesAndEquity) < 0.01;

  return {
    asOf, assets, liabilities, equity,
    currentEarnings,
    totalAssets, totalLiabilities, totalEquity,
    liabilitiesAndEquity, balanced,
    fiscalYearStart
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   §10 — JOURNAL ENGINE
   Create, validate, post, void. Posted entries are immutable.
═══════════════════════════════════════════════════════════════════════════ */
function nextJournalNumber() {
  const year = new Date().getFullYear();
  const prefix = 'JE-' + year + '-';
  const used = arr(state.data.journalEntries)
    .filter(e => e.entryNo && e.entryNo.startsWith(prefix))
    .map(e => parseInt(e.entryNo.slice(prefix.length), 10))
    .filter(n => Number.isFinite(n));
  const next = (used.length ? Math.max(...used) : 0) + 1;
  return prefix + String(next).padStart(4, '0');
}

function validateJournalEntry(entry) {
  const errors = [];

  if (!entry.date) errors.push('Date is required');
  const lines = arr(entry.lines);
  if (lines.length < 2) errors.push('At least two lines are required (double-entry)');

  let totalDebit = 0, totalCredit = 0;
  lines.forEach((l, i) => {
    const d = num(l.debit), c = num(l.credit);
    totalDebit += d;
    totalCredit += c;

    if (!l.accountId) errors.push('Line ' + (i + 1) + ': account is required');
    if (d > 0 && c > 0) errors.push('Line ' + (i + 1) + ': cannot have both debit and credit');
    if (d <= 0 && c <= 0) errors.push('Line ' + (i + 1) + ': enter a debit or credit');
    if (d < 0 || c < 0) errors.push('Line ' + (i + 1) + ': amounts must be positive');
  });

  if (Math.abs(totalDebit - totalCredit) > 0.005) {
    errors.push('Debits (' + money(totalDebit) + ') and credits (' + money(totalCredit) + ') must balance');
  }
  if (totalDebit === 0 && totalCredit === 0 && lines.length > 0) {
    errors.push('Entry totals cannot both be zero');
  }

  const closed = state.settings?.accounting?.closedThrough;
  if (closed && entry.date <= closed) {
    errors.push('Date falls on or before the locked period (' + dateFmt(closed) + ')');
  }

  return { valid: errors.length === 0, errors, totalDebit, totalCredit };
}

function recomputeEntryTotals(entry) {
  let d = 0, c = 0;
  arr(entry.lines).forEach(l => { d += num(l.debit); c += num(l.credit); });
  entry.totalDebit = d;
  entry.totalCredit = c;
}

function createJournalEntry(data) {
  const entry = {
    id: uid(),
    entryNo: '',
    date: data.date || today(),
    reference: data.reference || '',
    description: data.description || '',
    source: data.source || 'manual',
    sourceId: data.sourceId || null,
    status: 'draft',
    lines: arr(data.lines).map(l => ({
      accountId: l.accountId,
      debit: num(l.debit),
      credit: num(l.credit),
      memo: l.memo || '',
      entityType: l.entityType || null,
      entityId: l.entityId || null
    })),
    totalDebit: 0,
    totalCredit: 0,
    createdAt: nowISO(),
    createdBy: state.user?.email || 'system',
    updatedAt: nowISO(),
    updatedBy: state.user?.email || 'system'
  };
  recomputeEntryTotals(entry);
  state.data.journalEntries.push(entry);
  markDirty('journalEntries', entry.id);
  return entry;
}

function updateJournalEntry(id, patch) {
  const entry = arr(state.data.journalEntries).find(e => e.id === id);
  if (!entry) return null;
  if (entry.status !== 'draft') return null;   /* Posted entries are immutable */

  if (patch.date !== undefined) entry.date = patch.date;
  if (patch.reference !== undefined) entry.reference = patch.reference;
  if (patch.description !== undefined) entry.description = patch.description;
  if (patch.lines !== undefined) {
    entry.lines = arr(patch.lines).map(l => ({
      accountId: l.accountId,
      debit: num(l.debit),
      credit: num(l.credit),
      memo: l.memo || '',
      entityType: l.entityType || null,
      entityId: l.entityId || null
    }));
  }
  recomputeEntryTotals(entry);
  entry.updatedAt = nowISO();
  entry.updatedBy = state.user?.email || 'system';
  markDirty('journalEntries', id);
  return entry;
}

function postJournalEntry(id) {
  const entry = arr(state.data.journalEntries).find(e => e.id === id);
  if (!entry) return { ok: false, error: 'Entry not found' };
  if (entry.status !== 'draft') return { ok: false, error: 'Already posted or void' };

  const v = validateJournalEntry(entry);
  if (!v.valid) return { ok: false, error: v.errors.join('\n') };

  if (!entry.entryNo) entry.entryNo = nextJournalNumber();
  entry.status = 'posted';
  entry.postedAt = nowISO();
  entry.postedBy = state.user?.email || 'system';
  entry.updatedAt = nowISO();
  markDirty('journalEntries', id);

  return { ok: true, entry };
}

function deleteJournalEntry(id) {
  const entry = arr(state.data.journalEntries).find(e => e.id === id);
  if (!entry) return { ok: false, error: 'Entry not found' };
  if (entry.status !== 'draft') return { ok: false, error: 'Only draft entries can be deleted. Void posted entries instead.' };

  state.data.journalEntries = state.data.journalEntries.filter(e => e.id !== id);
  _dirty.add('journalEntries:' + id);
  delete _snapshot['journalEntries:' + id];
  state.sync.dirty = true;
  scheduleSync();
  return { ok: true };
}

/* Void a posted entry by creating a reversing entry, then marking the
   original as void. Both stay in the books for audit. */
function voidJournalEntry(id) {
  const original = arr(state.data.journalEntries).find(e => e.id === id);
  if (!original) return { ok: false, error: 'Entry not found' };
  if (original.status !== 'posted') return { ok: false, error: 'Only posted entries can be voided' };
  if (original.source === 'reversal') return { ok: false, error: 'Reversal entries cannot be voided' };

  const reversal = createJournalEntry({
    date: today(),
    reference: 'REV-' + (original.entryNo || original.id.slice(-4)),
    description: 'Reversal of ' + (original.entryNo || original.id) + ': ' + (original.description || ''),
    source: 'reversal',
    sourceId: original.id,
    lines: arr(original.lines).map(l => ({
      accountId: l.accountId,
      debit: num(l.credit),
      credit: num(l.debit),
      memo: 'Reversal — ' + (l.memo || ''),
      entityType: l.entityType,
      entityId: l.entityId
    }))
  });

  /* Auto-post the reversal. */
  reversal.entryNo = nextJournalNumber();
  reversal.status = 'posted';
  reversal.postedAt = nowISO();
  reversal.postedBy = state.user?.email || 'system';
  markDirty('journalEntries', reversal.id);

  /* Mark the original. */
  original.status = 'void';
  original.voidedAt = nowISO();
  original.voidedBy = state.user?.email || 'system';
  original.reversedById = reversal.id;
  original.updatedAt = nowISO();
  markDirty('journalEntries', id);

  return { ok: true, reversal, original };
}

/* Convenience for callers that want a posted entry in one call.
   Used by Phase 3+ when invoices/payments auto-generate journals. */
function postSimpleJournal(opts) {
  const entry = createJournalEntry(opts);
  const r = postJournalEntry(entry.id);
  if (!r.ok) {
    state.data.journalEntries = state.data.journalEntries.filter(e => e.id !== entry.id);
    return { ok: false, error: r.error };
  }
  return { ok: true, entry: r.entry };
}

/* ═══════════════════════════════════════════════════════════════════════════
   §11 — COMPONENTS
   Toast, modal, field helpers, account badges. One definition each.
═══════════════════════════════════════════════════════════════════════════ */
function toast(msg, type, ms) {
  const wrap = document.getElementById('toasts');
  if (!wrap) return;
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 350);
  }, ms || 3200);
}

function openModal(title, bodyHTML, opts) {
  opts = opts || {};
  const wrap = document.getElementById('modalWrap');
  if (!wrap) return;
  wrap.innerHTML =
    '<div class="modal-backdrop" data-close-modal></div>' +
    '<div class="modal" style="max-width:' + (opts.width || 700) + 'px">' +
      '<div class="modal-head">' +
        '<h3>' + esc(title) + '</h3>' +
        '<button class="icon-btn" data-close-modal type="button">✕</button>' +
      '</div>' +
      '<div class="modal-body">' + bodyHTML + '</div>' +
      (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
    '</div>';
  wrap.classList.add('open');
}

function closeModal() {
  const wrap = document.getElementById('modalWrap');
  if (!wrap) return;
  wrap.classList.remove('open');
  wrap.innerHTML = '';
}

function kpi(label, value, sub) {
  return '<div class="kpi">' +
    '<div class="k-label">' + esc(label) + '</div>' +
    '<div class="k-value">' + value + '</div>' +
    (sub ? '<div class="k-sub">' + sub + '</div>' : '') +
  '</div>';
}

function field(label, id, value, opts) {
  opts = opts || {};
  const tag = opts.type === 'textarea' ? 'textarea' : 'input';

  const attrs = [
    'id="' + id + '"',
    (opts.type && opts.type !== 'textarea') ? 'type="' + opts.type + '"' : '',
    opts.required ? 'required' : '',
    opts.placeholder ? 'placeholder="' + esc(opts.placeholder) + '"' : '',
    opts.min !== undefined ? 'min="' + opts.min + '"' : '',
    opts.max !== undefined ? 'max="' + opts.max + '"' : '',
    opts.step ? 'step="' + opts.step + '"' : '',
    opts.disabled ? 'disabled' : ''
  ].filter(Boolean).join(' ');

  return '<label class="field">' +
    esc(label) + (opts.req ? ' <span class="req">*</span>' : '') +
    (tag === 'textarea'
      ? '<textarea ' + attrs + '>' + esc(value) + '</textarea>'
      : '<input ' + attrs + ' value="' + esc(value) + '">') +
  '</label>';
}

function selectField(label, id, options, value, opts) {
  opts = opts || {};
  return '<label class="field">' +
    esc(label) + (opts.req ? ' <span class="req">*</span>' : '') +
    '<select id="' + id + '" ' + (opts.required ? 'required' : '') + '>' +
      (opts.placeholder ? '<option value="">' + esc(opts.placeholder) + '</option>' : '') +
      options.map(o =>
        '<option value="' + esc(o.value) + '"' +
        (String(o.value) === String(value) ? ' selected' : '') + '>' +
        esc(o.label) +
        '</option>'
      ).join('') +
    '</select>' +
  '</label>';
}

/* Full dropdown of accounts grouped by type, ready for a <select>. */
function accountOptionsByType() {
  return ACCOUNT_TYPES.map(t => {
    const list = accountsByType(t);
    if (!list.length) return '';
    return '<optgroup label="' + ACCOUNT_TYPE_LABEL[t] + '">' +
      list.map(a =>
        '<option value="' + esc(a.id) + '">' +
        esc(a.code) + ' — ' + esc(a.name) +
        '</option>'
      ).join('') +
    '</optgroup>';
  }).join('');
}

function accountBadge(acc) {
  if (!acc) return '';
  let html = '<span class="acct-type ' + acc.type + '">' + esc(ACCOUNT_TYPE_LABEL[acc.type]) + '</span>';
  if (acc.isControl) html += '<span class="acct-flag">Ctrl</span>';
  if (acc.isContra)  html += '<span class="acct-flag">Contra</span>';
  if (!acc.active)   html += '<span class="acct-flag" style="color:var(--red)">Inactive</span>';
  return html;
}

function journalStatusBadge(s) {
  if (s === 'posted') return '<span class="badge green">Posted</span>';
  if (s === 'draft')  return '<span class="badge amber">Draft</span>';
  if (s === 'void')   return '<span class="badge red">Void</span>';
  return '<span class="badge gray">' + esc(s) + '</span>';
}
