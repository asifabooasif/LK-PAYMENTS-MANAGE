function savePayment(e){
  e.preventDefault();
  const supplierId = val('paySupplier'), date = val('payDate') || today();
  const reference = val('payRef').trim(), notes = val('payNotes').trim();
  if(!supplierId){ toast('Select a supplier','error'); return; }
  const supplier = supObj(supplierId); if(!supplier){ toast('Not found','error'); return; }
  let partyIds = [];
  if(payMode !== 'own') partyIds = Array.from(document.querySelectorAll('.party-chk:checked')).map(c => c.dataset.id);
  const partyCheques = partyIds.map(id => db.receipts.find(c => c.id === id)).filter(Boolean);
  const partyAmount = sum(partyCheques, 'amount');
  let ownData = [];
  if(payMode !== 'party'){
    Array.from(document.querySelectorAll('#ownRows .own-row')).forEach(r => {
      const amt = num(r.querySelector('.own-amt').value), no = r.querySelector('.own-no').value.trim();
      if(amt <= 0 && !no) return;
      ownData.push({ id:uid(), chequeNo:no, bank:r.querySelector('.own-bank').value.trim(), date: r.querySelector('.own-date').value || date, dueDate: r.querySelector('.own-due').value, amount:amt, payee: r.querySelector('.own-payee').value.trim() || supplier.name, supplierId, status:'Issued', notes:'' });
    });
  }
  const ownAmount = sum(ownData, 'amount');
  if(partyAmount + ownAmount <= 0){ toast('Select cheques or add amount','error'); return; }
  const payment = { id:uid(), supplierId, date, reference, notes, mode:payMode, partyChequeIds: partyCheques.map(c => c.id), partyAmount, ownChequeIds: ownData.map(o => o.id), ownAmount, amount: partyAmount + ownAmount, partyPrev:{}, createdAt: nowISO(), createdBy: currentUser?.email || '' };
  partyCheques.forEach(c => { payment.partyPrev[c.id] = c.status; c.status = 'Issued'; c.issuedTo = supplierId; c.paymentId = payment.id; c.issuedDate = date; });
  ownData.forEach(o => { o.paymentId = payment.id; db.ownCheques.push(o); });
  db.payments.push(payment);
  if(db.settings.autoNumbering) db.settings.nextPaymentNo = (num(db.settings.nextPaymentNo) || 1) + 1;
  logAct('Add Payment','Payment', payment.id, supplier.name + ' • ' + money(payment.amount));
  save(); render(); toast('Payment of ' + moneyPlain(payment.amount) + ' saved');
}
function deletePayment(id){
  const p = db.payments.find(x => x.id === id); if(!p) return;
  if(db.settings.confirmBeforeDelete && !confirm('Delete payment? Linked cheques released.')) return;
  (p.partyChequeIds || []).forEach(cid => {
    const c = db.receipts.find(x => x.id === cid);
    if(c){ c.status = (p.partyPrev && p.partyPrev[cid]) ? p.partyPrev[cid] : 'Cleared'; delete c.issuedTo; delete c.paymentId; delete c.issuedDate; }
  });
  db.ownCheques = db.ownCheques.filter(o => o.paymentId !== p.id);
  db.payments = db.payments.filter(x => x.id !== id);
  logAct('Delete Payment','Payment', id, supName(p.supplierId));
  save(); render(); toast('Payment deleted');
}

function tableOwn(){
  let rows = db.ownCheques.map(o => ({ id:o.id, chequeNo:o.chequeNo, bank:o.bank, date:o.date, dueDate:o.dueDate, amount:num(o.amount), payee:o.payee, supplierId:o.supplierId, supplier: o.supplierId ? supName(o.supplierId) : '', status:o.status, paymentId:o.paymentId }));
  const q = ui.own.q.trim().toLowerCase();
  if(q) rows = rows.filter(r => (r.chequeNo||'').toLowerCase().includes(q) || (r.bank||'').toLowerCase().includes(q) || (r.payee||'').toLowerCase().includes(q) || (r.supplier||'').toLowerCase().includes(q));
  if(ui.own.status) rows = rows.filter(r => r.status === ui.own.status);
  if(ui.own.bank) rows = rows.filter(r => r.bank === ui.own.bank);
  if(ui.own.supplier) rows = rows.filter(r => r.supplierId === ui.own.supplier);
  if(ui.own.from) rows = rows.filter(r => (r.date||'') >= ui.own.from);
  if(ui.own.to) rows = rows.filter(r => (r.date||'') <= ui.own.to);
  rows = sortRows(rows, ui.own.sort, ui.own.dir);
  const total = rows.reduce((a,b) => a + b.amount, 0);
  return `<div class="table-wrap"><table>
    <thead><tr>${th('own','chequeNo','Cheque No')}${th('own','bank','Bank')}${th('own','date','Date')}${th('own','dueDate','Due')}<th>Payee / Supplier</th>${th('own','amount','Amount','num')}${th('own','status','Status')}<th style="width:190px">Actions</th></tr></thead>
    <tbody>${rows.length ? rows.map(r => `<tr>
      <td class="mono"><strong>${esc(r.chequeNo || '—')}</strong></td><td>${esc(r.bank || '—')}</td>
      <td>${dateFmt(r.date)}</td><td>${dateFmt(r.dueDate)}</td>
      <td>${esc(r.supplier || r.payee || '—')}${r.paymentId ? '<br><span class="muted small">linked</span>' : ''}</td>
      <td class="num">${moneyPlain(r.amount)}</td><td>${statusBadge(r.status)}</td>
      <td><div class="row-flex">
        ${r.status === 'Issued' ? `<button class="btn xs green" data-action="own-cleared" data-id="${r.id}">✔</button>` : ''}
        ${r.status === 'Issued' ? `<button class="btn xs danger" data-action="own-cancel" data-id="${r.id}">✖</button>` : ''}
        <button class="btn xs" data-action="edit-own" data-id="${r.id}">✏️</button>
        <button class="btn xs danger" data-action="del-own" data-id="${r.id}">🗑</button>
      </div></td></tr>`).join('') : emptyRow(8, 'No own cheques')}</tbody>
    ${rows.length ? `<tfoot><tr><td colspan="5">Total</td><td class="num">${moneyPlain(total)}</td><td colspan="2"></td></tr></tfoot>` : ''}
  </table></div>`;
}
function openOwnForm(id){
  const o = id ? db.ownCheques.find(x => x.id === id) : null;
  const dfltBank = db.settings.defaultBank || '';
  openModal(o ? 'Edit Own Cheque' : 'Add Own Cheque', `
    <form onsubmit="saveOwn(event)" data-id="${o ? o.id : ''}">
      <div class="form-grid">
        <label class="field">Cheque No <span class="req">*</span><input name="oNo" required value="${esc(o ? o.chequeNo : '')}"></label>
        <label class="field">Bank<input name="oBank" value="${esc(o ? o.bank : dfltBank)}"></label>
        <label class="field">Date<input name="oDate" type="date" value="${o ? (o.date || today()) : today()}"></label>
        <label class="field">Due Date<input name="oDue" type="date" value="${o ? (o.dueDate || '') : ''}"></label>
        <label class="field">Amount <span class="req">*</span><input name="oAmount" type="number" step="0.01" min="0" required value="${o ? num(o.amount) : ''}"></label>
        <label class="field">Supplier<select name="oSupplier"><option value="">— None —</option>${db.suppliers.map(s => `<option value="${s.id}" ${o && o.supplierId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>
        <label class="field">Payee<input name="oPayee" value="${esc(o ? o.payee : '')}"></label>
        <label class="field">Status<select name="oStatus">${['Issued','Cleared','Cancelled'].map(s => `<option value="${s}" ${o && o.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
      </div>

    </form>`);
}
function saveOwn(e){
  e.preventDefault();
  const f = e.target, id = f.dataset.id;
  const data = { chequeNo:f.oNo.value.trim(), bank:f.oBank.value.trim(), date:f.oDate.value || today(), dueDate:f.oDue.value, amount:num(f.oAmount.value), supplierId:f.oSupplier.value, payee:f.oPayee.value.trim(), status:f.oStatus.value };
  if(!data.chequeNo){ toast('Cheque number required','error'); return; }
  if(data.amount <= 0){ toast('Enter amount','error'); return; }
  if(id){ Object.assign(db.ownCheques.find(x => x.id === id), data); logAct('Update Own Cheque','Own Cheque',id,data.chequeNo); toast('Updated'); }
  else { const oid = uid(); db.ownCheques.push(Object.assign({ id:oid, createdAt:nowISO() }, data)); logAct('Add Own Cheque','Own Cheque',oid,data.chequeNo); toast('Added'); }
  save(); closeModal(); render();
}
function deleteOwn(id){
  if(db.settings.confirmBeforeDelete && !confirm('Delete?')) return;
  const o = db.ownCheques.find(x => x.id === id);
  db.ownCheques = db.ownCheques.filter(o => o.id !== id);
  logAct('Delete Own Cheque','Own Cheque',id,o?.chequeNo || '');
  save(); render(); toast('Deleted');
}
function setOwnStatus(id, status){
  const o = db.ownCheques.find(x => x.id === id); if(!o) return;
  o.status = status;
  logAct('Mark ' + status,'Own Cheque',id,o.chequeNo);
  save(); render(); toast('Marked ' + status);
}

/* ================================================================
   LEDGER GENERATOR — MULTI-TYPE
   ================================================================ */
const LEDGER_TYPES = [
  { key:'supplier',   label:'Supplier Ledger',      icon:'🏭' },
  { key:'customer',   label:'Customer Ledger',      icon:'👥' },
  { key:'bank',       label:'Bank Account Ledger',  icon:'🏛️' },
  { key:'cheque',     label:'Customer Cheque Ledger', icon:'🧾' },
  { key:'own_cheque', label:'Own Cheque Ledger',    icon:'🏦' },
  { key:'payment',    label:'Payment Ledger',       icon:'💸' },
  { key:'receipt',    label:'Receipt Ledger',       icon:'💰' },
  { key:'purchase',   label:'Purchase Ledger',      icon:'🛒' },
  { key:'category',   label:'Category Ledger',      icon:'🏷️' },
  { key:'aging',      label:'Aging Ledger',         icon:'⏳' },
  { key:'full',       label:'Full Transaction Ledger', icon:'📒' }
];
function viewLedger(){
  const t = ui.ledger.type || 'supplier';
  return `
  <div class="card">
    <div class="card-head"><div><h3>📒 Ledger Generator</h3><div class="hint">Generate any type of ledger with filters, sorting, and date range.</div></div>
      <div class="row-flex">
        <button class="btn" onclick="exportLedgerCSV()">⬇ CSV</button>
        <button class="btn" onclick="window.print()">🖨 Print</button>
      </div>
    </div>
    <div class="ledger-type-grid">
      ${LEDGER_TYPES.map(lt => `<div class="ledger-type-tile ${t === lt.key ? 'active' : ''}" onclick="setLedgerType('${lt.key}')">
        <div class="l-icon">${lt.icon}</div><div class="l-label">${esc(lt.label)}</div>
      </div>`).join('')}
    </div>
    <div class="divider"></div>
    <div class="form-grid" style="margin-bottom:14px">
      <label class="field">From Date<input type="date" value="${ui.ledger.from}" onchange="ui.ledger.from=this.value; refreshLedger()"></label>
      <label class="field">To Date<input type="date" value="${ui.ledger.to}" onchange="ui.ledger.to=this.value; refreshLedger()"></label>
      ${ledgerEntityFilter(t)}
      ${ledgerSecondaryFilter(t)}
      <label class="field">Sort By
        <select onchange="ui.ledger.sort=this.value; refreshLedger()">
          ${ledgerSortOptions(t).map(([k,l]) => `<option value="${k}" ${ui.ledger.sort === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}
        </select>
      </label>
      <label class="field">Order
        <select onchange="ui.ledger.dir=Number(this.value); refreshLedger()">
          <option value="-1" ${ui.ledger.dir === -1 ? 'selected' : ''}>Descending</option>
          <option value="1" ${ui.ledger.dir === 1 ? 'selected' : ''}>Ascending</option>
        </select>
      </label>
      <label class="field">Search<input type="search" placeholder="🔍 Filter…" value="${esc(ui.ledger.q)}" oninput="ui.ledger.q=this.value; refreshLedger()"></label>
    </div>
    <div id="ledgerBody">${renderLedgerBody()}</div>
  </div>`;
}
function ledgerEntityFilter(t){
  if(t === 'supplier') return `<label class="field">Supplier<select onchange="ui.ledger.entityId=this.value; refreshLedger()"><option value="">— All suppliers —</option>${db.suppliers.map(s => `<option value="${s.id}" ${ui.ledger.entityId === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>`;
  if(t === 'customer') return `<label class="field">Customer<select onchange="ui.ledger.entityId=this.value; refreshLedger()"><option value="">— All customers —</option>${db.customers.map(c => `<option value="${c.id}" ${ui.ledger.entityId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>`;
  if(t === 'bank') return `<label class="field">Bank<select onchange="ui.ledger.entityId=this.value; refreshLedger()"><option value="">— All banks —</option>${db.bankAccounts.map(b => `<option value="${b.id}" ${ui.ledger.entityId === b.id ? 'selected' : ''}>${esc(b.bankName)}</option>`).join('')}</select></label>`;
  if(t === 'category') return `<label class="field">Category<select onchange="ui.ledger.entityId=this.value; refreshLedger()"><option value="">— All categories —</option>${db.categories.map(c => `<option value="${c.id}" ${ui.ledger.entityId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>`;
  return '';
}
function ledgerSecondaryFilter(t){
  if(t === 'customer') return `<label class="field">Method<select onchange="ui.ledger.method=this.value; refreshLedger()">${['','Cheque','Cash','Bank Transfer','Card','Other'].map(m => `<option value="${m}" ${ui.ledger.method === m ? 'selected' : ''}>${m || 'All methods'}</option>`).join('')}</select></label>`;
  if(t === 'cheque') return `<label class="field">Status<select onchange="ui.ledger.status=this.value; refreshLedger()">${['','Pending','Cleared','Issued','Bounced','Returned'].map(s => `<option value="${s}" ${ui.ledger.status === s ? 'selected' : ''}>${s || 'All statuses'}</option>`).join('')}</select></label>`;
  if(t === 'own_cheque') return `<label class="field">Status<select onchange="ui.ledger.status=this.value; refreshLedger()">${['','Issued','Cleared','Cancelled'].map(s => `<option value="${s}" ${ui.ledger.status === s ? 'selected' : ''}>${s || 'All statuses'}</option>`).join('')}</select></label>`;
  if(t === 'payment' || t === 'receipt' || t === 'purchase') return `<label class="field">Category<select onchange="ui.ledger.categoryId=this.value; refreshLedger()"><option value="">All</option>${db.categories.map(c => `<option value="${c.id}" ${ui.ledger.categoryId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>`;
  return '';
}
function ledgerSortOptions(t){
  const base = [['date','Date'], ['amount','Amount']];
  if(t === 'supplier') return [['date','Date'], ['amount','Amount'], ['balance','Running Balance']];
  if(t === 'customer') return [['date','Date'], ['amount','Amount']];
  if(t === 'bank') return [['date','Date'], ['amount','Amount']];
  if(t === 'cheque' || t === 'own_cheque') return [['date','Date'], ['amount','Amount'], ['dueDate','Due Date']];
  if(t === 'category') return [['date','Date'], ['amount','Amount']];
  if(t === 'aging') return [['total','Total'], ['d90','Overdue']];
  return base;
}
function setLedgerType(t){ ui.ledger.type = t; ui.ledger.entityId = ''; ui.ledger.categoryId = ''; ui.ledger.method = ''; ui.ledger.status = ''; render(); }
window.setLedgerType = setLedgerType;
function refreshLedger(){ const el = document.getElementById('ledgerBody'); if(el) el.innerHTML = renderLedgerBody(); }
window.refreshLedger = refreshLedger;

function renderLedgerBody(){
  const t = ui.ledger.type;
  const gen = ledgerGenerators[t] || ledgerGenerators.supplier;
  const { columns, rows, totals, summary } = gen();
  if(!rows.length){
    return `<div class="empty"><span class="big">📒</span>No data for the selected filters</div>`;
  }
  return `
  ${summary ? `<div class="kpi-strip" style="margin-bottom:14px">${summary}</div>` : ''}
  <div class="table-wrap"><table>
    <thead><tr>${columns.map(c => `<th class="${c.cls || ''}">${esc(c.label)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${columns.map(c => `<td class="${c.cls || ''}">${r[c.key] !== undefined ? r[c.key] : '—'}</td>`).join('')}</tr>`).join('')}</tbody>
    ${totals ? `<tfoot><tr>${columns.map((c,i) => `<td class="${c.cls || ''}">${i === 0 ? 'Totals' : (totals[c.key] !== undefined ? totals[c.key] : '')}</td>`).join('')}</tr></tfoot>` : ''}
  </table></div>`;
}
function filterRowsByLedger(rows, dateKey = 'date'){
  const f = ui.ledger;
  const q = (f.q || '').trim().toLowerCase();
  let out = rows;
  if(f.from) out = out.filter(r => (r[dateKey] || '') >= f.from);
  if(f.to) out = out.filter(r => (r[dateKey] || '') <= f.to);
  if(q) out = out.filter(r => Object.values(r).some(v => String(v ?? '').toLowerCase().includes(q)));
  return out;
}
function sortLedgerRows(rows){
  const { sort, dir } = ui.ledger;
  return sortRows(rows, sort || 'date', dir || -1);
}

const ledgerGenerators = {
  supplier(){
    const f = ui.ledger;
    if(!f.entityId){
      const rows = db.suppliers.map(s => {
        const a = supplierAging(s.id);
        return {
          name: s.name,
          purchases: moneyPlain(sum(db.purchases.filter(p => p.supplierId === s.id), 'amount')),
          paid: moneyPlain(sum(db.payments.filter(p => p.supplierId === s.id), 'amount')),
          payable: moneyPlain(supplierBalance(s.id)),
          current: moneyPlain(a.current), warn: moneyPlain(a.d30), crit: moneyPlain(a.d60), overdue: moneyPlain(a.d90),
          _sort: supplierBalance(s.id), _date: s.createdAt || '', _amount: supplierBalance(s.id)
        };
      });
      return {
        columns:[
          { key:'name', label:'Supplier' }, { key:'purchases', label:'Purchases', cls:'num' },
          { key:'paid', label:'Paid', cls:'num' }, { key:'current', label:'Current', cls:'num' },
          { key:'warn', label:'Warn', cls:'num' }, { key:'crit', label:'Crit', cls:'num' },
          { key:'overdue', label:'Overdue', cls:'num' }, { key:'payable', label:'Payable', cls:'num' }
        ],
        rows: sortLedgerRows(filterRowsByLedger(rows)),
        totals:{
          purchases: moneyPlain(sum(db.purchases, 'amount')),
          paid: moneyPlain(sum(db.payments, 'amount')),
          payable: moneyPlain(totalPayable())
        },
        summary: kpiCard('Suppliers', db.suppliers.length, 'Total suppliers') + kpiCard('Total Payable', moneyPlain(totalPayable()), 'Outstanding', { color:'p', small:true })
      };
    }
    const rows = ledgerRows(f.entityId, f.from, f.to).map(r => ({
      date: dateFmt(r.date), type: r.type, ref: r.ref, desc: r.desc,
      debit: r.debit ? moneyPlain(r.debit) : '',
      credit: r.credit ? moneyPlain(r.credit) : '',
      balance: moneyPlain(r.balance),
      _sort: r.date, _date: r.date, _amount: r.debit || r.credit, _balance: r.balance
    }));
    return {
      columns:[
        { key:'date', label:'Date' }, { key:'type', label:'Type' }, { key:'ref', label:'Reference' },
        { key:'desc', label:'Description' }, { key:'debit', label:'Payment (Dr)', cls:'num' },
        { key:'credit', label:'Purchase (Cr)', cls:'num' }, { key:'balance', label:'Balance', cls:'num' }
      ],
      rows: sortLedgerRows(rows),
      summary: (() => { const s = supObj(f.entityId); if(!s) return ''; const bal = supplierBalance(s.id); return kpiCard('Supplier', esc(s.name), s.phone || '', { color:'primary', small:true }) + kpiCard('Current Balance', moneyPlain(bal), 'Outstanding', { color: bal > 0 ? 'r' : 'g', small:true }); })()
    };
  },
  customer(){
    const f = ui.ledger;
    let customers = f.entityId ? [custObj(f.entityId)].filter(Boolean) : db.customers;
    const rows = [];
    customers.forEach(c => {

function ledgerRows(id, from, to){
  const s = supObj(id); if(!s) return [];
  const rows = [];
  rows.push({ date: s.createdAt ? s.createdAt.slice(0,10) : '', type:'Opening', ref:'—', desc:'Opening balance', debit:0, credit:num(s.openingBalance), ts:0 });
  db.purchases.filter(p => p.supplierId === id).forEach(p => rows.push({ date:p.date, type:'Purchase', ref:p.invoiceNo || '—', desc:(p.categoryId ? catName(p.categoryId) + ' • ' : '') + (p.description || ''), debit:0, credit:num(p.amount), ts:1 }));
  db.payments.filter(p => p.supplierId === id).forEach(p => rows.push({ date:p.date, type:'Payment', ref:p.reference || '—', desc: payDesc(p), debit:num(p.amount), credit:0, ts:2 }));
  rows.sort((a,b) => a.date === b.date ? a.ts - b.ts : (a.date < b.date ? -1 : 1));
  let bal = 0; rows.forEach(r => { bal += r.credit - r.debit; r.balance = bal; });
  let out = rows;
  if(from) out = out.filter(r => (r.date||'') >= from);
  if(to) out = out.filter(r => (r.date||'') <= to);
  return out;
}
function payDesc(p){ const parts = []; if(p.partyAmount > 0) parts.push('Party: ' + (p.partyChequeIds || []).length); if(p.ownAmount > 0) parts.push('Own: ' + (p.ownChequeIds || []).length); return parts.join(' + ') || '—'; }
function exportLedgerCSV(){
  const gen = ledgerGenerators[ui.ledger.type] || ledgerGenerators.supplier;
  const { columns, rows } = gen();
  if(!rows.length){ toast('No data to export','error'); return; }
  const headers = columns.map(c => c.label);
  const data = rows.map(r => columns.map(c => String(r[c.key] ?? '').replace(/<[^>]+>/g, '')));
  const csv = toCSV(headers, data);
  const name = 'ledger_' + ui.ledger.type + '_' + today() + '.csv';
  download(name, csv, 'text/csv');
  toast('Ledger exported');
}
window.exportLedgerCSV = exportLedgerCSV;

function viewTimeline(){
  let entries = (db.activityLog || []).slice().reverse();
  const f = ui.timeline;
  const q = f.q.trim().toLowerCase();
  if(q) entries = entries.filter(r => (r.action||'').toLowerCase().includes(q) || (r.details||'').toLowerCase().includes(q) || (r.userEmail||'').toLowerCase().includes(q));
  if(f.entity) entries = entries.filter(r => r.entity === f.entity);
  if(f.user) entries = entries.filter(r => r.userEmail === f.user);
  if(f.from) entries = entries.filter(r => (r.timestamp||'').slice(0,10) >= f.from);
  if(f.to) entries = entries.filter(r => (r.timestamp||'').slice(0,10) <= f.to);
  if(f.type){
    const mapType = { create:['Add','Update'], update:['Update','Mark','Import'], delete:['Delete'], login:['Sign In','Sign Out'], payment:['Payment'] };
    const actions = mapType[f.type] || [];
    if(actions.length) entries = entries.filter(r => actions.some(a => r.action.includes(a)));
  }
  entries = entries.slice(0, 400);
  const entities = uniq((db.activityLog||[]).map(r => r.entity).filter(Boolean));
  const users = uniq((db.activityLog||[]).map(r => r.userEmail).filter(Boolean));
  const grouped = groupBy(entries, e => (e.timestamp || '').slice(0,10));
  const dayKeys = Object.keys(grouped).sort((a,b) => b.localeCompare(a));
  return `
  <div class="card">
    <div class="card-head"><div><h3>⏱️ Timeline</h3><div class="hint">Every action, every user, every moment.</div></div>
      <div class="row-flex">
        <button class="btn" onclick="exportTimelineCSV()">⬇ CSV</button>
      </div></div>
    <div class="form-grid" style="margin-bottom:14px">
      <label class="field">Search<input type="search" placeholder="🔍 Action, user, details…" value="${esc(f.q)}" oninput="ui.timeline.q=this.value; render()"></label>
      <label class="field">Type<select onchange="ui.timeline.type=this.value; render()">
        <option value="">All types</option>
        <option value="create" ${f.type==='create'?'selected':''}>Created</option>
        <option value="update" ${f.type==='update'?'selected':''}>Updated</option>
        <option value="delete" ${f.type==='delete'?'selected':''}>Deleted</option>
        <option value="login" ${f.type==='login'?'selected':''}>Sign in/out</option>
        <option value="payment" ${f.type==='payment'?'selected':''}>Payments</option>
      </select></label>
      <label class="field">Entity<select onchange="ui.timeline.entity=this.value; render()"><option value="">All</option>${entities.map(e => `<option value="${esc(e)}" ${f.entity===e?'selected':''}>${esc(e)}</option>`).join('')}</select></label>
      <label class="field">User<select onchange="ui.timeline.user=this.value; render()"><option value="">All users</option>${users.map(u => `<option value="${esc(u)}" ${f.user===u?'selected':''}>${esc(u)}</option>`).join('')}</select></label>
      <label class="field">From<input type="date" value="${f.from}" onchange="ui.timeline.from=this.value; render()"></label>
      <label class="field">To<input type="date" value="${f.to}" onchange="ui.timeline.to=this.value; render()"></label>
    </div>
    ${dayKeys.length ? dayKeys.map(day => {
      const items = grouped[day];
      const dayObj = new Date(day + 'T00:00:00');
      const dayLabel = dayObj.toLocaleDateString('en-GB',{weekday:'long', day:'2-digit', month:'long', year:'numeric'});
      const isToday = day === today();
      return `<div class="tl-day">
        <div class="tl-day-head"><div class="d">${isToday ? 'Today' : dayLabel}</div><div class="c">${items.length} event${items.length !== 1 ? 's' : ''}</div></div>
        ${items.map(e => {
          const cls = e.action.includes('Delete') ? 'delete' : e.action.includes('Sign In') || e.action.includes('Sign Out') ? 'login' : e.action.includes('Payment') ? 'payment' : e.action.includes('Add') ? 'create' : 'update';
          const ico = e.action.includes('Delete') ? '🗑' : e.action.includes('Sign In') ? '🔓' : e.action.includes('Sign Out') ? '🔒' : e.action.includes('Payment') ? '💸' : e.action.includes('Add') ? '➕' : e.action.includes('Update') ? '✏️' : '📌';
          const timeStr = new Date(e.timestamp).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
          return `<div class="tl-event ${cls}">
            <div class="tl-icon">${ico}</div>
            <div class="tl-body">
              <div class="tl-title">${esc(e.action)} <span class="muted">•</span> <span class="badge gray">${esc(e.entity)}</span></div>
              ${e.details ? `<div class="tl-desc">${esc(e.details)}</div>` : ''}
              <div class="tl-meta">
                <span class="tl-user">${e.userPhoto ? `<img src="${esc(e.userPhoto)}">` : ''}${esc(e.userEmail || 'system')}</span>
                <span>🕐 ${timeStr}</span>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>`;
    }).join('') : '<div class="empty"><span class="big">⏱️</span>No timeline events yet</div>'}
  </div>`;
}
function exportTimelineCSV(){
  const rows = (db.activityLog || []).map(r => [r.timestamp, r.action, r.entity, r.details, r.userEmail]);
  const csv = toCSV(['Timestamp','Action','Entity','Details','User'], rows);
  download('timeline_' + today() + '.csv', csv, 'text/csv');
  toast('Timeline exported');
}
window.exportTimelineCSV = exportTimelineCSV;

function setAnaTab(k){ ui.ana.tab = k; render(); }
window.setAnaTab = setAnaTab;
function applyAnaPreset(p){
  const t = today();
  if(p === 'thisMonth'){ ui.ana.from = t.slice(0,7) + '-01'; ui.ana.to = t; }
  if(p === 'lastMonth'){ const pm = prevMonth(); ui.ana.from = pm + '-01'; const [y,m] = pm.split('-'); ui.ana.to = new Date(y, m, 0).toISOString().slice(0,10); }
  if(p === 'qtd'){ const m = new Date().getMonth(); const qs = Math.floor(m/3)*3; ui.ana.from = thisYear() + '-' + String(qs+1).padStart(2,'0') + '-01'; ui.ana.to = t; }
  if(p === 'ytd'){ ui.ana.from = thisYear() + '-01-01'; ui.ana.to = t; }
  if(p === 'last12'){ ui.ana.from = shiftDate(t, -365); ui.ana.to = t; }
  refreshAnalytics();
}
window.applyAnaPreset = applyAnaPreset;
function refreshAnalytics(){ const el = document.getElementById('anaBody'); if(el) el.innerHTML = analyticsBody(); }
window.refreshAnalytics = refreshAnalytics;
function resetAnalytics(){ ui.ana = { from:'', to:'', supplier:'', cat:'', tab: ui.ana.tab || 'overview' }; render(); }
window.resetAnalytics = resetAnalytics;
function analyticsBody(){
  const f = ui.ana;
  const inR = d => inRange(d, f.from, f.to);
  const purchases = db.purchases.filter(p => inR(p.date) && (!f.supplier || p.supplierId === f.supplier) && (!f.cat || p.categoryId === f.cat));
  const payments = db.payments.filter(p => inR(p.date) && (!f.supplier || p.supplierId === f.supplier));
  const receipts = db.receipts.filter(r => inR(r.date) && (!f.cat || r.categoryId === f.cat));
  const own = db.ownCheques.filter(o => inR(o.date) && (!f.supplier || o.supplierId === f.supplier));
  if(f.tab === 'comparison') return anaComparison();
  if(f.tab === 'concentration') return anaConcentration(purchases);
  if(f.tab === 'receipts') return anaReceipts(receipts, own);
  if(f.tab === 'cashflow') return anaCashflow();
  return anaOverview(purchases, payments, receipts, own);
}
function anaOverview(purchases, payments, receipts, own){
  const pT = sum(purchases, 'amount'), payT = sum(payments, 'amount'), recT = sum(receipts, 'amount'), ownT = sum(own, 'amount');
  const ms = lastMonths(12);
  const purS = ms.map(m => sum(db.purchases.filter(p => inMonth(p.date, m)), 'amount'));
  const payS = ms.map(m => sum(db.payments.filter(p => inMonth(p.date, m)), 'amount'));
  const recS = ms.map(m => sum(db.receipts.filter(r => inMonth(r.date, m)), 'amount'));
  const catRows = db.categories.map(c => ({ name:c.name, color:c.color, chq: sum(receipts.filter(x => x.categoryId === c.id), 'amount'), pur: sum(purchases.filter(x => x.categoryId === c.id), 'amount') })).filter(r => r.chq > 0 || r.pur > 0).sort((a,b) => (b.chq + b.pur) - (a.chq + a.pur));
  const catMax = Math.max(1, ...catRows.map(r => Math.max(r.chq, r.pur)));
  const stRows = ['Pending','Cleared','Issued','Bounced'].map(s => ({ name:s, count: receipts.filter(c => c.status === s).length, total: sum(receipts.filter(c => c.status === s), 'amount') }));
  const stMax = Math.max(1, ...stRows.map(r => r.total));
  const bankMap = {}; receipts.forEach(c => { const b = c.bank || 'Unspecified'; bankMap[b] = (bankMap[b] || 0) + num(c.amount); });
  const bankRows = Object.entries(bankMap).map(([b,v]) => ({ b, v })).sort((a,b) => b.v - a.v).slice(0, 8);
  const bankMax = Math.max(1, ...bankRows.map(r => r.v));
  return `
  <div class="kpi-strip">
    ${kpiCard('Purchases', moneyPlain(pT), purchases.length + ' record(s)', { color:'primary', small:true })}
    ${kpiCard('Payments', moneyPlain(payT), payments.length + ' record(s)', { color:'g', small:true })}
    ${kpiCard('Receipts', moneyPlain(recT), receipts.length + ' record(s)', { color:'t', small:true })}
    ${kpiCard('Own Cheques', moneyPlain(ownT), own.length + ' cheque(s)', { color:'p', small:true })}
  </div>
  <div class="card"><div class="card-head"><h3>📈 Monthly Trend — Last 12 Months</h3></div>
    ${lineChartSVG([{ values: purS, color:'var(--primary)' },{ values: payS, color:'#10b981' },{ values: recS, color:'#14b8a6' }], { w:800, h:200, labels: ms.map(monthLabel) })}
  </div>
  <div class="grid grid-2">
    <div class="card"><div class="card-head"><h3>🏷️ Category Analysis</h3></div>
      ${catRows.length ? catRows.map(r => `<div style="margin-bottom:14px"><div class="small" style="font-weight:800;margin-bottom:6px"><span class="dot" style="background:${r.color};margin-right:7px"></span>${esc(r.name)}</div>
        <div class="bar-row" style="grid-template-columns:60px 1fr 100px;margin-bottom:0;font-size:11px"><span class="bar-label small">Receipts</span><div class="bar-track"><div class="bar-fill i" style="width:${(r.chq/catMax*100).toFixed(1)}%"></div></div><span class="bar-val">${moneyPlain(r.chq)}</span></div>
        <div class="bar-row" style="grid-template-columns:60px 1fr 100px;margin-bottom:0;font-size:11px"><span class="bar-label small">Purchases</span><div class="bar-track"><div class="bar-fill a" style="width:${(r.pur/catMax*100).toFixed(1)}%"></div></div><span class="bar-val">${moneyPlain(r.pur)}</span></div>
      </div>`).join('') : '<div class="empty">No data</div>'}
    </div>
    <div class="card"><div class="card-head"><h3>🧾 Status Breakdown</h3></div>
      ${stRows.map(r => `<div class="bar-row"><span class="bar-label">${r.name} <small>(${r.count})</small></span>
        <div class="bar-track"><div class="bar-fill ${r.name === 'Cleared' ? 'g' : r.name === 'Bounced' ? 'r' : r.name === 'Issued' ? 'c' : 'a'}" style="width:${(r.total/stMax*100).toFixed(1)}%"></div></div>
        <span class="bar-val">${moneyPlain(r.total)}</span></div>`).join('')}
    </div>
  </div>`;
}
function anaComparison(){
  const tm = thisMonth(), pm = prevMonth(), ty = thisYear(), py = prevYear();
  const mk = (arr, m) => sum(arr.filter(x => inMonth(x.date, m)), 'amount');
  const yr = (arr, y) => sum(arr.filter(x => inYear(x.date, y)), 'amount');
  const allPur = db.purchases, allPay = db.payments, allRec = db.receipts;
  const cmp = (title, cur, prev, color) => {
    const d = pctDelta(cur, prev), cls = d > 0.5 ? 'up' : d < -0.5 ? 'down' : 'flat';
    const max = Math.max(cur, prev, 1);
    return `<div style="border:1px solid var(--line);border-radius:12px;padding:14px">
      <div style="font-size:10.5px;font-weight:800;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px">${esc(title)}</div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px"><span class="muted">This period</span><strong>${moneyPlain(cur)}</strong></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px"><span class="muted">Last period</span><strong class="muted">${moneyPlain(prev)}</strong></div>
      <div class="progress"><span style="width:${cur/max*100}%;background:${color}"></span></div>
      <div style="margin-top:9px"><span class="k-delta ${cls}">${d > 0 ? '▲' : d < 0 ? '▼' : '■'} ${Math.abs(d).toFixed(1)}%</span></div>
    </div>`;
  };
  return `
  <div class="grid grid-2">
    <div class="card"><div class="card-head"><h3>📅 Month-over-Month</h3></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
        ${cmp('Purchases', mk(allPur, tm), mk(allPur, pm), 'var(--primary)')}
        ${cmp('Payments', mk(allPay, tm), mk(allPay, pm), '#10b981')}
        ${cmp('Receipts', mk(allRec, tm), mk(allRec, pm), '#14b8a6')}
      </div></div>
    <div class="card"><div class="card-head"><h3>📆 Year-over-Year</h3></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
        ${cmp('Purchases', yr(allPur, ty), yr(allPur, py), 'var(--primary)')}
        ${cmp('Payments', yr(allPay, ty), yr(allPay, py), '#10b981')}
        ${cmp('Receipts', yr(allRec, ty), yr(allRec, py), '#14b8a6')}
      </div></div>
  </div>`;
}
function anaConcentration(purchases){
  const supRows = db.suppliers.map(s => ({ name:s.name, purchases: sum(purchases.filter(p => p.supplierId === s.id), 'amount') })).filter(r => r.purchases > 0).sort((a,b) => b.purchases - a.purchases);
  const totalPur = supRows.reduce((a,b) => a + b.purchases, 0) || 1;
  let cum = 0;
  const pareto = supRows.map(r => { const pct = (r.purchases/totalPur)*100; cum += pct; return { ...r, pct, cum }; });
  return `
  <div class="kpi-strip">
    ${kpiCard('Suppliers Active', pareto.length, 'of ' + db.suppliers.length, { color:'primary', small:true })}
    ${kpiCard('Top 3 Concentration', pareto.slice(0,3).reduce((a,b) => a + b.pct, 0).toFixed(1) + '%', 'of total', { color:'p', small:true })}
    ${kpiCard('Top 5 Concentration', pareto.slice(0,5).reduce((a,b) => a + b.pct, 0).toFixed(1) + '%', 'of total', { color:'t', small:true })}
  </div>
  <div class="card"><div class="card-head"><h3>🎯 Supplier Pareto</h3></div>
    ${pareto.length ? pareto.map(r => `<div style="display:grid;grid-template-columns:140px 1fr 100px 80px;gap:12px;align-items:center;font-size:11.5px;margin-bottom:8px">
      <span class="bar-label">${esc(r.name)}</span>
      <div class="bar-track" style="position:relative"><div class="bar-fill i" style="width:${r.pct}%"></div>
        <div style="position:absolute;top:0;bottom:0;left:${Math.min(100,r.cum)}%;width:2px;background:var(--primary-d)"></div></div>
      <span class="bar-val">${moneyPlain(r.purchases)}</span>
      <span style="font-weight:800;color:var(--primary-d);text-align:right">${r.cum.toFixed(1)}%</span>
    </div>`).join('') : '<div class="empty">No data</div>'}
  </div>`;
}
function anaReceipts(receipts, own){
  const total = receipts.length, cleared = receipts.filter(r => r.status === 'Cleared').length;
  const pending = receipts.filter(r => r.status === 'Pending').length, issued = receipts.filter(r => r.status === 'Issued').length, bounced = receipts.filter(r => r.status === 'Bounced').length;
  const methodRows = ['Cheque','Cash','Bank Transfer','Card','Other'].map(m => ({ name:m, count: receipts.filter(r => r.method === m).length, total: sum(receipts.filter(r => r.method === m), 'amount') })).filter(r => r.total > 0);
  const methodMax = Math.max(1, ...methodRows.map(r => r.total));
  return `
  <div class="kpi-strip">
    ${kpiCard('Collection Rate', (total ? (cleared/total*100) : 0).toFixed(1) + '%', cleared + '/' + total, { color:'g', small:true })}
    ${kpiCard('Bounce Rate', (total ? (bounced/total*100) : 0).toFixed(1) + '%', bounced + ' cheque(s)', { color:'r', small:true })}
    ${kpiCard('Pending', moneyPlain(sum(receipts.filter(r => r.status === 'Pending'), 'amount')), pending + ' receipt(s)', { color:'a', small:true })}
    ${kpiCard('Issued', moneyPlain(sum(receipts.filter(r => r.status === 'Issued'), 'amount')), issued + ' receipt(s)', { color:'c', small:true })}
  </div>
  <div class="card"><div class="card-head"><h3>💳 By Method</h3></div>
    ${methodRows.length ? methodRows.map(r => `<div class="bar-row"><span class="bar-label">${esc(r.name)} <small>(${r.count})</small></span>
      <div class="bar-track"><div class="bar-fill ${r.name === 'Cheque' ? 'i' : r.name === 'Cash' ? 'g' : r.name === 'Bank Transfer' ? 't' : 'p'}" style="width:${(r.total/methodMax*100).toFixed(1)}%"></div></div>
      <span class="bar-val">${moneyPlain(r.total)}</span></div>`).join('') : '<div class="empty">No data</div>'}
  </div>`;
}
function anaCashflow(){
  const ga = globalAging(); const t = today();
  const upcomingCust = db.receipts.filter(r => isCheque(r) && r.dueDate && (r.status === 'Pending' || r.status === 'Cleared')).filter(r => { const d = daysBetween(t, r.dueDate); return d >= -30 && d <= 30; });
  const upcomingIn = sum(upcomingCust, 'amount');
  const upcomingOwn = db.ownCheques.filter(o => o.dueDate && o.status === 'Issued').filter(o => { const d = daysBetween(t, o.dueDate); return d >= -30 && d <= 30; });
  const upcomingOut = sum(upcomingOwn, 'amount');
  const netFlow = upcomingIn - upcomingOut;
  return `
  <div class="kpi-strip">
    ${kpiCard('Inflow (30d)', moneyPlain(upcomingIn), upcomingCust.length + ' cheque(s)', { color:'g', small:true })}
    ${kpiCard('Outflow (30d)', moneyPlain(upcomingOut), upcomingOwn.length + ' own cheque(s)', { color:'r', small:true })}
    ${kpiCard('Net (30d)', moneyPlain(netFlow), netFlow >= 0 ? '✓ Positive' : '⚠ Deficit', { color: netFlow >= 0 ? 'g' : 'r', small:true })}
  </div>
  <div class="card"><div class="card-head"><h3>💰 Aging Exposure</h3></div>
    <div class="grid grid-4" style="gap:12px">
      <div class="kpi g" style="box-shadow:none"><div class="k-label">Current</div><div class="k-value sm">${moneyPlain(ga.current)}</div></div>
      <div class="kpi a" style="box-shadow:none"><div class="k-label">Warning</div><div class="k-value sm">${moneyPlain(ga.d30)}</div></div>
      <div class="kpi k" style="box-shadow:none"><div class="k-label">Critical</div><div class="k-value sm">${moneyPlain(ga.d60)}</div></div>
      <div class="kpi r" style="box-shadow:none"><div class="k-label">Overdue</div><div class="k-value sm">${moneyPlain(ga.d90)}</div></div>
    </div>
  </div>`;
}

function checkIntegrity(){
  const issues = [];
  db.purchases.forEach(p => { if(!supObj(p.supplierId)) issues.push('Purchase ' + (p.invoiceNo || p.id) + ' → missing supplier'); });
  db.payments.forEach(p => { if(!supObj(p.supplierId)) issues.push('Payment ' + (p.reference || p.id) + ' → missing supplier'); });
  db.receipts.forEach(r => { if(r.customerId && !custObj(r.customerId)) issues.push('Receipt ' + (r.chequeNo || r.id) + ' → missing customer'); });
  return { issues };
}
function buildBackup(forceFull){
  const s = ui.bk.sets;
  const from = forceFull ? '' : ui.bk.from, to = forceFull ? '' : ui.bk.to;
  const inR = d => (!from || (d || '') >= from) && (!to || (d || '') <= to);
  const pick = k => forceFull ? true : !!s[k];
  const data = {};
  if(pick('customers')) data.customers = db.customers;
  if(pick('suppliers')) data.suppliers = db.suppliers;
  if(pick('categories')) data.categories = db.categories;
  if(pick('bankAccounts')) data.bankAccounts = db.bankAccounts;
  if(pick('purchases')) data.purchases = db.purchases.filter(x => inR(x.date));
  if(pick('receipts')) data.receipts = db.receipts.filter(x => inR(x.date));
  if(pick('ownCheques')) data.ownCheques = db.ownCheques.filter(x => inR(x.date));
  if(pick('payments')) data.payments = db.payments.filter(x => inR(x.date));
  if(pick('activityLog')) data.activityLog = db.activityLog.filter(x => inR((x.timestamp || '').slice(0,10)));
  if(pick('settings')) data.settings = db.settings;
  if(pick('allowedEmails')) data.allowedEmails = db.allowedEmails;
  return { meta: { app:APP_NAME, version:APP_VER, exportedAt:nowISO(), by: currentUser?.email || '', sets: Object.keys(data), counts: Object.fromEntries(Object.entries(data).map(([k,v]) => [k, Array.isArray(v) ? v.length : 1])) }, data };
}
function download(filename, content, type){
  const blob = new Blob([content], { type: type || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function toCSV(headers, rows){
  const esc2 = v => { const s = (v === undefined || v === null) ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const lines = [headers.map(esc2).join(',')];
  rows.forEach(r => lines.push(r.map(esc2).join(',')));
  return '\uFEFF' + lines.join('\n');
}
function exportCSV(set){
  let headers = [], rows = [], name = set;
  switch(set){
    case 'customers': headers = ['Name','Phone','Email','Address','Total Received']; rows = db.customers.map(c => { const rs = db.receipts.filter(r => r.customerId === c.id); return [c.name, c.phone, c.email, c.address, sum(rs, 'amount')]; }); break;
    case 'suppliers': headers = ['Name','Contact','Phone','Purchases','Paid','Payable']; rows = db.suppliers.map(s => [s.name, s.contactPerson, s.phone, sum(db.purchases.filter(p => p.supplierId === s.id), 'amount'), sum(db.payments.filter(p => p.supplierId === s.id), 'amount'), supplierBalance(s.id)]); break;
    case 'purchases': headers = ['Date','Supplier','Invoice','Amount','Status']; rows = db.purchases.map(p => [p.date, supName(p.supplierId), p.invoiceNo, num(p.amount), p.status]); break;
    case 'receipts': headers = ['Date','Customer','Method','Amount','Status']; rows = db.receipts.map(r => [r.date, r.customerName, r.method, num(r.amount), r.status]); break;
    case 'ownCheques': headers = ['Cheque No','Bank','Date','Amount','Status']; rows = db.ownCheques.map(o => [o.chequeNo, o.bank, o.date, num(o.amount), o.status]); break;
    case 'payments': headers = ['Date','Supplier','Mode','Total']; rows = db.payments.map(p => [p.date, supName(p.supplierId), p.mode, num(p.amount)]); break;
    case 'ledgerAll': headers = ['Supplier','Date','Type','Ref','Desc','Dr','Cr','Balance']; db.suppliers.forEach(s => { ledgerRows(s.id, '', '').forEach(r => rows.push([s.name, r.date, r.type, r.ref, r.desc, r.debit, r.credit, r.balance])); }); name = 'full_ledger'; break;
    case 'aging': headers = ['Supplier','Current','Warn','Crit','Overdue','Total']; rows = db.suppliers.map(s => { const a = supplierAging(s.id); return [s.name, a.current, a.d30, a.d60, a.d90, a.total]; }); break;
  }
  download(name + '_' + today() + '.csv', toCSV(headers, rows), 'text/csv');
  toast('CSV exported');
}
function importBackup(){
  const input = document.getElementById('importFile');
  if(!input || !input.files.length){ toast('Choose a file','error'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      const data = parsed.data || parsed;
      const keys = ['customers','suppliers','purchases','categories','receipts','ownCheques','bankAccounts','payments','activityLog','settings','allowedEmails'].filter(k => Array.isArray(data[k]) || (k === 'settings' && data[k]));
      if(!keys.length){ toast('No valid data','error'); return; }
      if(!confirm('Import will replace: ' + keys.join(', ') + '. Continue?')) return;
      keys.forEach(k => { db[k] = data[k]; });
      logAct('Import Backup','System',null,keys.join(', '));
      save(); render(); toast('Imported');
    }catch(err){ toast('Invalid file','error'); }
  };
  reader.readAsText(input.files[0]);
}

function addAllowedEmail(){
  if(currentUserRole !== 'admin'){ toast('Admin only','error'); return; }
  const el = document.getElementById('newAllowedEmail');
  const email = (el?.value || '').trim().toLowerCase();
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Enter a valid email','error'); return; }
  if(!Array.isArray(db.allowedEmails)) db.allowedEmails = [ADMIN_EMAIL];
  if(db.allowedEmails.map(e => e.toLowerCase()).includes(email)){ toast('Already authorized','error'); return; }
  db.allowedEmails.push(email);
  logAct('Add Authorized User','System', null, email);
  save(); render(); toast('User authorized: ' + email);
}
window.addAllowedEmail = addAllowedEmail;
function removeAllowedEmail(email){
  if(currentUserRole !== 'admin'){ toast('Admin only','error'); return; }
  if(email.toLowerCase() === ADMIN_EMAIL.toLowerCase()){ toast('Cannot remove admin','error'); return; }
  if(!confirm('Remove access for ' + email + '?')) return;
  db.allowedEmails = (db.allowedEmails || []).filter(e => e.toLowerCase() !== email.toLowerCase());
  logAct('Remove Authorized User','System', null, email);
  save(); render(); toast('Removed: ' + email);
}
window.removeAllowedEmail = removeAllowedEmail;
function showLoginHistory(){
  const logins = (db.activityLog || []).filter(a => a.action === 'Sign In' || a.action === 'Sign Out').slice(-50).reverse();
  openModal('Login History', logins.length ? `<div class="table-wrap"><table><thead><tr><th>When</th><th>Action</th><th>User</th></tr></thead><tbody>${logins.map(l => `<tr><td>${dateTimeFmt(l.timestamp)}</td><td>${esc(l.action)}</td><td>${esc(l.userEmail)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No logins</div>');
}

function toggleSettingSwitch(el, name){ const on = !el.classList.contains('on'); el.classList.toggle('on', on); const cb = el.querySelector('input[type=checkbox]'); if(cb) cb.checked = on; }
window.toggleSettingSwitch = toggleSettingSwitch;
function applyThemePreset(primary, accent){ db.settings.themePrimary = primary; db.settings.themeAccent = accent; save(); applySettings(); render(); toast('Theme applied'); }
window.applyThemePreset = applyThemePreset;
function saveSettings(e){
  e.preventDefault();
  const f = e.target, s = db.settings;
  const $ = n => { const el = f.querySelector('[name="' + n + '"]'); return el ? el.value : undefined; };
  const $cb = n => { const el = f.querySelector('[name="' + n + '"]'); return el ? el.checked : undefined; };
  const set = (k, n) => { if($(n) !== undefined) s[k] = $(n); };
  set('shopName','st_shopName'); set('shopTagline','st_shopTagline'); set('logoText','st_logoText'); set('taxId','st_taxId');
  set('businessPhone','st_businessPhone'); set('businessEmail','st_businessEmail'); set('businessWebsite','st_businessWebsite'); set('businessAddress','st_businessAddress');
  set('themePrimary','st_themePrimary'); set('themeAccent','st_themeAccent'); set('density','st_density');
  if($('st_fontSize') !== undefined) s.fontSize = num($('st_fontSize')) || 13.5;
  if($cb('st_showSparklines') !== undefined) s.showSparklines = $cb('st_showSparklines');
  if($cb('st_animationsEnabled') !== undefined) s.animationsEnabled = $cb('st_animationsEnabled');
  set('currency','st_currency'); set('currencyPosition','st_currencyPosition');
  if($('st_decimalPlaces') !== undefined) s.decimalPlaces = num($('st_decimalPlaces'));
  set('thousandsSeparator','st_thousandsSeparator'); set('decimalSeparator','st_decimalSeparator');
  if($('st_taxRate') !== undefined) s.taxRate = num($('st_taxRate'));
  if($cb('st_autoNumbering') !== undefined) s.autoNumbering = $cb('st_autoNumbering');
  set('purchasePrefix','st_purchasePrefix'); set('poPrefix','st_poPrefix'); set('paymentPrefix','st_paymentPrefix'); set('receiptPrefix','st_receiptPrefix');
  if($('st_nextPurchaseNo') !== undefined) s.nextPurchaseNo = num($('st_nextPurchaseNo'));
  if($('st_nextPaymentNo') !== undefined) s.nextPaymentNo = num($('st_nextPaymentNo'));
  if($('st_nextReceiptNo') !== undefined) s.nextReceiptNo = num($('st_nextReceiptNo'));
  set('defaultBank','st_defaultBank');
  if($('st_defaultChequeDays') !== undefined) s.defaultChequeDays = num($('st_defaultChequeDays'));
  set('defaultChequeStatus','st_defaultChequeStatus');
  if($cb('st_allowDuplicateChequeNo') !== undefined) s.allowDuplicateChequeNo = $cb('st_allowDuplicateChequeNo');
  if($('st_defaultSupplierCreditDays') !== undefined) s.defaultSupplierCreditDays = num($('st_defaultSupplierCreditDays'));
  if($('st_defaultSupplierCreditLimit') !== undefined) s.defaultSupplierCreditLimit = num($('st_defaultSupplierCreditLimit'));
  if($('st_defaultSupplierRating') !== undefined) s.defaultSupplierRating = num($('st_defaultSupplierRating'));
  if($cb('st_flagOverLimit') !== undefined) s.flagOverLimit = $cb('st_flagOverLimit');
  const b1 = num($('st_ageB1')), b2 = num($('st_ageB2')), b3 = num($('st_ageB3'));
  if(b1 && b2 && b3 && b1 < b2 && b2 < b3) s.supplierAgingBuckets = [b1, b2, b3];
  if($('st_defaultCustomerCreditDays') !== undefined) s.defaultCustomerCreditDays = num($('st_defaultCustomerCreditDays'));
  if($('st_defaultCustomerCreditLimit') !== undefined) s.defaultCustomerCreditLimit = num($('st_defaultCustomerCreditLimit'));
  set('defaultReceiptMethod','st_defaultReceiptMethod');
  if($('st_chequeReminderDays') !== undefined) s.chequeReminderDays = num($('st_chequeReminderDays'));
  if($('st_agingWarningDays') !== undefined) s.agingWarningDays = num($('st_agingWarningDays'));
  if($('st_agingCriticalDays') !== undefined) s.agingCriticalDays = num($('st_agingCriticalDays'));
  if($cb('st_notifEnabled') !== undefined) s.notifEnabled = $cb('st_notifEnabled');
  if($cb('st_notifOverdueCheques') !== undefined) s.notifOverdueCheques = $cb('st_notifOverdueCheques');
  if($cb('st_notifDueSoon') !== undefined) s.notifDueSoon = $cb('st_notifDueSoon');
  if($cb('st_notifAging90') !== undefined) s.notifAging90 = $cb('st_notifAging90');
  if($cb('st_notifCreditLimit') !== undefined) s.notifCreditLimit = $cb('st_notifCreditLimit');
  if($cb('st_notifBounced') !== undefined) s.notifBounced = $cb('st_notifBounced');
  if($cb('st_notifOwnCheques') !== undefined) s.notifOwnCheques = $cb('st_notifOwnCheques');
  if($('st_notifThresholdAmount') !== undefined) s.notifThresholdAmount = num($('st_notifThresholdAmount'));
  if($cb('st_autoSave') !== undefined) s.autoSave = $cb('st_autoSave');
  if($('st_backupRetention') !== undefined) s.backupRetention = num($('st_backupRetention'));
  if($cb('st_confirmBeforeDelete') !== undefined) s.confirmBeforeDelete = $cb('st_confirmBeforeDelete');
  if($cb('st_checkOnSave') !== undefined) s.checkOnSave = $cb('st_checkOnSave');
  if($cb('st_enableActivityLog') !== undefined) s.enableActivityLog = $cb('st_enableActivityLog');
  if($('st_maxLogEntries') !== undefined) s.maxLogEntries = num($('st_maxLogEntries'));
  set('dateFormat','st_dateFormat');
  if($('st_weekStart') !== undefined) s.weekStart = num($('st_weekStart'));
  if(Array.isArray(db.backupHistory) && db.backupHistory.length > (s.backupRetention || 10)) db.backupHistory = db.backupHistory.slice(-s.backupRetention);
  logAct('Update Settings','System', null, 'Section: ' + (ui.settings.tab || 'profile'));
  save(); applySettings();
  if(s.checkOnSave){
    const integ = checkIntegrity();
    if(integ.issues.length) toast('Saved — integrity issues (' + integ.issues.length + ')','warn');
    else toast('Saved • Integrity OK');
  } else toast('Settings saved');
  render();
}
window.saveSettings = saveSettings;
function resetCurrentSettingsSection(){
  const tab = ui.settings.tab || 'profile';
  if(!confirm('Reset "' + (SETTINGS_SECTIONS.find(x => x.key === tab)?.label || tab) + '" to defaults?')) return;
  const dflt = defaultSettings();
  const keys = {
    profile:['shopName','shopTagline','logoText','taxId','businessPhone','businessEmail','businessWebsite','businessAddress'],
    appearance:['themePrimary','themeAccent','density','fontSize','showSparklines','animationsEnabled'],
    financial:['currency','currencyPosition','decimalPlaces','thousandsSeparator','decimalSeparator','taxRate'],
    numbering:['autoNumbering','purchasePrefix','poPrefix','paymentPrefix','receiptPrefix','nextPurchaseNo','nextPaymentNo','nextReceiptNo'],
    cheque:['defaultBank','defaultChequeDays','defaultChequeStatus','allowDuplicateChequeNo'],
    supplier:['defaultSupplierCreditDays','defaultSupplierCreditLimit','defaultSupplierRating','supplierAgingBuckets','flagOverLimit'],
    customer:['defaultCustomerCreditDays','defaultCustomerCreditLimit','defaultReceiptMethod'],
    reminders:['chequeReminderDays','agingWarningDays','agingCriticalDays'],
    notifications:['notifEnabled','notifOverdueCheques','notifDueSoon','notifAging90','notifCreditLimit','notifBounced','notifOwnCheques','notifThresholdAmount'],
    backup:['autoSave','backupRetention'],
    advanced:['confirmBeforeDelete','enableActivityLog','maxLogEntries','dateFormat','weekStart','checkOnSave']
  }[tab] || [];
  keys.forEach(k => { db.settings[k] = dflt[k]; });
  save(); applySettings(); render(); toast('Section reset');
}
window.resetCurrentSettingsSection = resetCurrentSettingsSection;
function resetAllSettings(){
  if(!confirm('Reset ALL settings? Business data is NOT affected.')) return;
  if(!confirm('Final confirmation?')) return;
  db.settings = defaultSettings();
  logAct('Reset All Settings','System',null,'');
  save(); applySettings(); render(); toast('Settings reset');
}
window.resetAllSettings = resetAllSettings;

/* ================================================================
   EVENT DELEGATION
   ================================================================ */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  const actions = {
    'close-modal': () => closeModal(),
    'nav': () => { ui.view = el.dataset.view; render(); window.scrollTo({ top:0, behavior:'smooth' }); },
    'sort': () => setSort(el.dataset.tbl, el.dataset.key),
    'toggle-notif': () => toggleNotif(),
    'clear-notif': () => markAllNotifRead(),
    'toggle-fab': () => toggleFab(),
    'signout': () => handleSignOut(),
    'force-sync': () => { pushToFirestore().then(() => toast('Cloud sync complete')); },
    'notif-click': () => {
      db.notifRead[el.dataset.id] = true;
      const view = el.dataset.view;
      document.getElementById('notifPanel').classList.remove('open');
      if(view === 'receipts'){ ui.rec.filter = el.dataset.id.startsWith('od-') ? 'overdue' : ''; ui.view = 'receipts'; }
      else if(view) ui.view = view;
      save(); render();
    },
    'add-customer': () => openCustomerForm(),
    'edit-customer': () => openCustomerForm(id),
    'del-customer': () => deleteCustomer(id),
    'customer-detail': () => showCustomerDetail(id),
    'add-supplier': () => openSupplierForm(),
    'edit-supplier': () => openSupplierForm(id),
    'del-supplier': () => deleteSupplier(id),
    'supplier-ledger': () => { ui.ledger.type = 'supplier'; ui.ledger.entityId = id; ui.view = 'ledger'; render(); },
    'supplier-aging': () => showSupplierAging(id),
    'add-purchase': () => openPurchaseForm(),
    'edit-purchase': () => openPurchaseForm(id),
    'del-purchase': () => deletePurchase(id),
    'add-cat': () => openCatForm(),
    'edit-cat': () => openCatForm(id),
    'del-cat': () => deleteCat(id),
    'add-receipt': () => openReceiptForm(),
    'add-cc-heque': () => { toggleFab(); openReceiptForm(null, 'Cheque'); },
    'edit-receipt': () => openReceiptForm(id),
    'del-receipt': () => deleteReceipt(id),
    'rec-cleared': () => markReceipt(id, 'Cleared'),
    'rec-bounced': () => markReceipt(id, 'Bounced'),
    'add-payment-nav': () => { toggleFab(); ui.view = 'payments'; render(); },
    'del-payment': () => deletePayment(id),
    'view-payment': () => viewPayment(id),
    'add-own': () => openOwnForm(),
    'edit-own': () => openOwnForm(id),
    'del-own': () => deleteOwn(id),
    'own-cleared': () => setOwnStatus(id, 'Cleared'),
    'own-cancel': () => setOwnStatus(id, 'Cancelled'),
    'add-bank': () => openBankForm(),
    'edit-bank': () => openBankForm(id),
    'del-bank': () => deleteBank(id),
    'backup-json': () => {
      const b = buildBackup(false);
      download('lankashoe_backup_' + today() + '.json', JSON.stringify(b, null, 2), 'application/json');
      db.backupHistory.push({ id:uid(), timestamp:nowISO(), type:'Selective', sets:b.meta.sets, size:((JSON.stringify(b).length)/1024).toFixed(1) + ' KB', by: currentUser?.email });
      logAct('Download Backup','System',null,b.meta.sets.join(', '));
      save(); render(); toast('Backup downloaded');
    },
    'backup-full': () => {
      const b = buildBackup(true);
      download('lankashoe_FULL_backup_' + today() + '.json', JSON.stringify(b, null, 2), 'application/json');
      db.backupHistory.push({ id:uid(), timestamp:nowISO(), type:'Full', sets:b.meta.sets, size:((JSON.stringify(b).length)/1024).toFixed(1) + ' KB', by: currentUser?.email });
      logAct('Download Full Backup','System',null,'');
      save(); render(); toast('Full backup downloaded');
    },
    'csv': () => exportCSV(el.dataset.set),
    'import-json': () => importBackup(),
    'clear-all': () => clearAll(),
    'load-sample': () => loadSample(),
    'print-report': () => printReport()
  };
  if(actions[a]){ e.preventDefault(); actions[a](); }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    closeModal();
    document.getElementById('notifPanel')?.classList.remove('open');
    document.getElementById('fabMenu')?.classList.remove('open');
    document.getElementById('fabBtn')?.classList.remove('open');
  }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); document.getElementById('globalSearch')?.focus(); }
});

/* ================================================================
   BOOT
   ================================================================ */
(async function boot(){
  await initFirebase();
  if(!firebaseReady){
    showLoginError('Firebase could not load. Please check your internet connection and refresh.');
    return;
  }
  document.getElementById('googleSignInBtn').addEventListener('click', handleSignIn);
  auth.onAuthStateChanged(onAuthStateChanged);
})();
</script>
