      if (payee) {
        var thisMonth = t.slice(0, 7);
        var payeeIssues = arr(v16.state.data.chequeLeaves).filter(function(l){
          return l.status !== 'Available'
            && (l.payee || '').toLowerCase() === payeeLower
            && (l.issuedDate || '').slice(0, 7) === thisMonth;
        });
        if (payeeIssues.length >= 3) {
          out.push({
            level: 'info', icon: '📊',
            text: 'Payee "' + payee + '" already has ' + payeeIssues.length + ' cheque(s) this month',
            detail: 'Total incl. this: ' + money0(sum(payeeIssues, 'amount') + amount)
          });
        }
      }

      /* 4. Payee with recent bounce history */
      if (payee) {
        var payeeBounces = arr(v16.state.data.chequeLeaves).filter(function(l){
          return l.status === 'Bounced'
            && (l.payee || '').toLowerCase() === payeeLower
            && l.bouncedDate
            && diffDays(l.bouncedDate, t) <= 180;
        });
        if (payeeBounces.length > 0) {
          out.push({
            level: 'warning', icon: '🚨',
            text: 'Payee "' + payee + '" had ' + payeeBounces.length + ' bounced cheque(s) before',
            detail: 'Latest: Leaf ' + payeeBounces[0].leafNo + ' · ' + dateFmt(payeeBounces[0].bouncedDate)
          });
        }
      }

      /* 5. Bank balance adequacy */
      if (bankAccountId) {
        var bank = LSX.bankAccounts().find(function(b){ return b.id === bankAccountId; });
        if (bank) {
          var avail = LSX.bankAvailableBalance(bankAccountId);
          var daysAhead = Math.max(0, diffDays(t, dueDate));
          var projected = LSX.bankProjectedBalance(bankAccountId, daysAhead);
          if (projected - amount < 0) {
            var odLimit = num(bank.overdraftLimit);
            if (odLimit === 0) {
              out.push({
                level: 'critical', icon: '🚨',
                text: 'Insufficient balance — will go into OVERDRAFT',
                detail: (bank.accountName || bank.bankName) + ': projected ' + money0(projected) + ' on ' + dateFmt(dueDate)
              });
            } else if (Math.abs(projected - amount) > odLimit) {
              out.push({
                level: 'critical', icon: '🚨',
                text: 'Cheque exceeds OD limit of ' + money0(odLimit),
                detail: 'After cheque: ' + money0(projected - amount) + ' · OD limit: ' + money0(odLimit)
              });
            } else {
              out.push({
                level: 'warning', icon: '⚠️',
                text: 'Will use ' + money0(Math.abs(projected - amount)) + ' of OD facility',
                detail: (bank.accountName || bank.bankName) + ': OD limit ' + money0(odLimit)
              });
            }
          } else if (projected - amount < num((v16.state.settings && v16.state.settings.defaults && v16.state.settings.defaults.bounceBankCharge) || 500) * 5) {
            out.push({
              level: 'warning', icon: '⚠️',
              text: 'Projected balance will be very low after this cheque',
              detail: 'After: ' + money0(projected - amount) + ' on ' + dateFmt(dueDate)
            });
          }
        }
      }

      /* 6. Due date clustering */
      var sameDay = arr(v16.state.data.chequeLeaves).filter(function(l){
        return l.status === 'Issued' && l.id !== ctx.leafId && l.dueDate === dueDate;
      });
      if (sameDay.length >= 5) {
        out.push({
          level: 'warning', icon: '📅',
          text: sameDay.length + ' other cheques already due on ' + dateFmt(dueDate),
          detail: 'Total value that day: ' + money0(sum(sameDay, 'amount') + amount)
        });
      } else if (sameDay.length >= 3) {
        out.push({
          level: 'info', icon: '📅',
          text: sameDay.length + ' other cheques due same day',
          detail: 'Total: ' + money0(sum(sameDay, 'amount') + amount)
        });
      }

      /* 7. Weekend check */
      var dueDow = new Date(dueDate + 'T00:00:00').getDay();
      if (dueDow === 0 || dueDow === 6) {
        out.push({
          level: 'info', icon: '📅',
          text: 'Due date falls on a weekend (' + (dueDow === 0 ? 'Sunday' : 'Saturday') + ')',
          detail: 'Bank may present on next working day'
        });
      }

      /* 8. Holiday check (SL) */
      var h = getHoliday(dueDate);
      if (h) {
        out.push({
          level: 'warning', icon: '🗓️',
          text: 'Due date falls on ' + h.name,
          detail: h.type === 'poya' ? 'Poya day — banks closed' : 'Public holiday — banks closed'
        });
      }

      /* 9. Large amount check (3× 90-day average) */
      var recent = arr(v16.state.data.chequeLeaves).filter(function(l){
        return l.status !== 'Available' && l.issuedDate && diffDays(l.issuedDate, t) <= 90;
      });
      var recentAvg = recent.length ? sum(recent, 'amount') / recent.length : 0;
      if (recentAvg > 0 && amount > recentAvg * 3) {
        out.push({
          level: 'info', icon: '💎',
          text: 'Unusually large — 3× your 90-day average',
          detail: 'Your avg: ' + money0(recentAvg) + ' · This: ' + money0(amount)
        });
      }

      /* 10. Duplicate leaf number check */
      if (ctx.leafId) {
        var leaf = arr(v16.state.data.chequeLeaves).find(function(l){ return l.id === ctx.leafId; });
        if (leaf) {
          var dup = arr(v16.state.data.chequeLeaves).filter(function(l){
            return l.id !== ctx.leafId
              && l.leafNo === leaf.leafNo
              && l.bankAccountId === leaf.bankAccountId;
          });
          if (dup.length > 0) {
            out.push({
              level: 'critical', icon: '⛔',
              text: 'Duplicate leaf number ' + leaf.leafNo + ' exists for this bank',
              detail: 'Data integrity issue — investigate'
            });
          }
        }
      }

      /* All clear */
      if (out.length === 0) {
        out.push({
          level: 'success', icon: '✅',
          text: 'All checks passed — no issues detected',
          detail: 'Cheque looks safe to issue'
        });
      }

      return out;
    }

    /* Anomaly score (0-100) */
    function computeAnomalyScore(ctx){
      var t = today();
      var amount = num(ctx.amount);
      var payee = (ctx.payee || '').trim().toLowerCase();
      if (amount <= 0) return { score: 0, factors: [] };

      var factors = [];
      var score = 0;

      /* Payee-specific amount deviation */
      if (payee) {
        var hist = arr(v16.state.data.chequeLeaves).filter(function(l){
          return l.status !== 'Available'
            && (l.payee || '').toLowerCase() === payee
            && num(l.amount) > 0;
        });
        if (hist.length >= 2) {
          var avg = sum(hist, 'amount') / hist.length;
          var variance = hist.reduce(function(a, l){ return a + Math.pow(num(l.amount) - avg, 2); }, 0) / hist.length;
          var std = Math.sqrt(variance);
          if (std > 0) {
            var z = Math.abs(amount - avg) / std;
            if (z > 3) {
              score += 25;
              factors.push({ name: 'Amount far from payee avg', detail: payee + ': avg ' + money0(avg) });
            } else if (z > 2) {
              score += 12;
              factors.push({ name: 'Amount above payee pattern' });
            }
          }
        }
      }

      /* Global 90-day deviation */
      var gHist = arr(v16.state.data.chequeLeaves).filter(function(l){
        return l.status !== 'Available' && num(l.amount) > 0 && l.issuedDate && diffDays(l.issuedDate, t) <= 90;
      });
      if (gHist.length >= 5) {
        var gAvg = sum(gHist, 'amount') / gHist.length;
        var gVar = gHist.reduce(function(a, l){ return a + Math.pow(num(l.amount) - gAvg, 2); }, 0) / gHist.length;
        var gStd = Math.sqrt(gVar);
        if (gStd > 0) {
          var gz = Math.abs(amount - gAvg) / gStd;
          if (gz > 3) {
            score += 20;
            factors.push({ name: 'Globally unusual amount', detail: 'z=' + gz.toFixed(1) });
          }
        }
      }

      /* High frequency */
      var recent3d = arr(v16.state.data.chequeLeaves).filter(function(l){
        return l.issuedDate && diffDays(l.issuedDate, t) <= 3 && l.status !== 'Available';
      }).length;
      if (recent3d >= 10) {
        score += 15;
        factors.push({ name: 'Very high frequency', detail: recent3d + ' cheques in last 3 days' });
      } else if (recent3d >= 6) {
        score += 8;
        factors.push({ name: 'Higher than normal frequency', detail: recent3d + ' cheques in 3 days' });
      }

      /* Due date cluster */
      var sameDue = arr(v16.state.data.chequeLeaves).filter(function(l){
        return l.status === 'Issued' && l.dueDate === ctx.dueDate;
      }).length;
      if (sameDue >= 8) {
        score += 10;
        factors.push({ name: 'Due date cluster', detail: sameDue + ' cheques already due same day' });
      }

      /* First-time payee */
      if (payee) {
        var known = arr(v16.state.data.chequeLeaves).some(function(l){
          return (l.payee || '').toLowerCase() === payee && l.status !== 'Available';
        });
        if (!known) {
          score += 8;
          factors.push({ name: 'First-time payee', detail: payee });
        }
      }

      /* Holiday/weekend due */
      var dc = checkDueDate(ctx.dueDate);
      if (dc.isHoliday) {
        score += 5;
        factors.push({ name: 'Due on holiday', detail: dc.holiday.name });
      } else if (dc.isWeekend) {
        score += 3;
        factors.push({ name: 'Due on weekend', detail: dc.dowName });
      }

      /* Amount vs available balance */
      if (ctx.bankAccountId) {
        var avail = LSX.bankAvailableBalance(ctx.bankAccountId);
        if (avail > 0) {
          var ratio = amount / avail;
          if (ratio > 0.9) {
            score += 20;
            factors.push({ name: 'Amount > 90% of balance', detail: 'Avail: ' + money0(avail) });
          } else if (ratio > 0.7) {
            score += 10;
            factors.push({ name: 'Amount > 70% of balance' });
          }
        }
      }

      /* Recent bounce to same payee */
      if (payee) {
        var recentB = arr(v16.state.data.chequeLeaves).filter(function(l){
          return l.status === 'Bounced'
            && (l.payee || '').toLowerCase() === payee
            && l.bouncedDate
            && diffDays(l.bouncedDate, t) <= 60;
        }).length;
        if (recentB > 0) {
          score += 15;
          factors.push({ name: 'Recent bounce to payee', detail: recentB + ' in last 60 days' });
        }
      }

      return { score: Math.min(100, Math.round(score)), factors: factors };
    }

    function renderAIPanel(warnings, ctx){
      if (!warnings || warnings.length === 0) {
        return '<div class="lsx-ai-panel empty">Start filling the form to see AI analysis</div>';
      }

      var criticalCount = warnings.filter(function(w){ return w.level === 'critical'; }).length;
      var warnCount = warnings.filter(function(w){ return w.level === 'warning'; }).length;

      var badgeHTML = '';
      if (criticalCount) {
        badgeHTML = '<span style="background:var(--red);color:#fff;padding:2px 8px;border-radius:10px">' + criticalCount + ' critical</span>';
      } else if (warnCount) {
        badgeHTML = '<span style="background:var(--amber);color:#fff;padding:2px 8px;border-radius:10px">' + warnCount + ' warning</span>';
      } else {
        badgeHTML = '<span style="background:var(--green);color:#fff;padding:2px 8px;border-radius:10px">all clear</span>';
      }

      var html = '';

      /* Anomaly score ring */
      if (ctx && ctx.amount > 0) {
        var anomaly = computeAnomalyScore(ctx);
        var color = anomaly.score >= 60 ? 'var(--red)' : anomaly.score >= 35 ? 'var(--amber)' : 'var(--green)';
        var label = anomaly.score >= 60 ? 'High Risk' : anomaly.score >= 35 ? 'Medium' : 'Low Risk';
        var pct = Math.min(1, anomaly.score / 100);
        var r = 32, c = 40, circ = 2 * Math.PI * r;
        html += '<div style="display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);margin-bottom:10px">' +
          '<svg width="80" height="80" viewBox="0 0 80 80" style="flex-shrink:0">' +
            '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" stroke="var(--surface-3)" stroke-width="8" fill="none" stroke-dasharray="' + circ + '"/>' +
            '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" stroke="' + color + '" stroke-width="8" fill="none" stroke-dasharray="' + circ + '" stroke-dashoffset="' + (circ * (1 - pct)) + '" transform="rotate(-90 ' + c + ' ' + c + ')" stroke-linecap="round"/>' +
            '<text x="' + c + '" y="' + (c + 5) + '" text-anchor="middle" font-size="18" font-weight="800" fill="' + color + '">' + anomaly.score + '</text>' +
          '</svg>' +
          '<div style="flex:1">' +
            '<div style="font-weight:800;font-size:13.5px">Anomaly Score: <span style="color:' + color + '">' + anomaly.score + '/100 — ' + label + '</span></div>' +
            '<div class="small muted" style="margin-top:3px">Based on historical patterns. Higher = more unusual.</div>' +
          '</div>' +
        '</div>';
      }

      /* Header + warnings */
      html += '<div class="lsx-ai-panel">' +
        '<div class="lsx-ai-hdr"><span>🤖 AI Cheque Analyzer</span><span style="margin-left:auto;text-transform:none;letter-spacing:0">' + badgeHTML + '</span></div>';

      warnings.forEach(function(w){
        html += '<div class="lsx-ai-warn ' + w.level + '">' +
          '<div style="font-size:16px;flex-shrink:0">' + w.icon + '</div>' +
          '<div style="flex:1">' +
            '<strong>' + esc(w.text) + '</strong>' +
            (w.detail ? '<small style="display:block;color:var(--text-4);font-size:11px;margin-top:2px">' + esc(w.detail) + '</small>' : '') +
          '</div>' +
        '</div>';
      });

      html += '</div>';
      return html;
    }

    LSX.analyzeCheque = analyzeCheque;
    LSX.renderAIPanel = renderAIPanel;
    LSX.computeAnomalyScore = computeAnomalyScore;

    /* ═══════════════════════════════════════════════════════════════
       WHATSAPP REPORTS
    ═══════════════════════════════════════════════════════════════ */
    function dateLabelWhatsApp(d){
      var t = today();
      if (d === t) return 'TODAY';
      if (d === shiftDate(t, 1)) return 'TOMORROW';
      if (d === shiftDate(t, -1)) return 'YESTERDAY';
      return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long' }).toUpperCase() + ' · ' + dateFmt(d);
    }

    function buildWhatsAppMessage(type, opts){
      opts = opts || {};
      var t = today();
      var fromDate, toDate, headerLabel;

      switch (type) {
        case 'today':    fromDate = t; toDate = t; headerLabel = '📅 TODAY'; break;
        case 'tomorrow': fromDate = shiftDate(t, 1); toDate = shiftDate(t, 1); headerLabel = '📆 TOMORROW'; break;
        case 'week':     fromDate = t; toDate = shiftDate(t, 6); headerLabel = '📅 NEXT 7 DAYS'; break;
        case 'month':
          var p = t.slice(0, 7).split('-');
          fromDate = p[0] + '-' + p[1] + '-01';
          var lastDay = new Date(Number(p[0]), Number(p[1]), 0).getDate();
          toDate = p[0] + '-' + p[1] + '-' + String(lastDay).padStart(2, '0');
          headerLabel = '📅 ' + new Date(Number(p[0]), Number(p[1]) - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }).toUpperCase();
          break;
        case 'custom':
          fromDate = opts.from || t; toDate = opts.to || t;
          headerLabel = '📅 ' + dateFmt(fromDate) + ' → ' + dateFmt(toDate);
          break;
        default:
          fromDate = ''; toDate = ''; headerLabel = '📊 FULL SYSTEM UPDATE';
      }

      var lines = [];
      var now = new Date();
      var dayName = now.toLocaleDateString('en-GB', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

      lines.push('🏛️ *' + ((v16.state.settings && v16.state.settings.business && v16.state.settings.business.name) || 'Lanka Shoe').toUpperCase() + ' — CHEQUE UPDATE*');
      lines.push('_' + dayName + '_');
      lines.push('');

      var issued = arr(v16.state.data.chequeLeaves).filter(function(l){
        return l.status === 'Issued' || l.status === 'Presented';
      });
      var rangeCheques = issued.filter(function(l){ return l.dueDate; });
      if (fromDate && toDate) {
        rangeCheques = rangeCheques.filter(function(l){ return l.dueDate >= fromDate && l.dueDate <= toDate; });
      }
      if (opts.bankId) {
        rangeCheques = rangeCheques.filter(function(l){ return l.bankAccountId === opts.bankId; });
      }
      rangeCheques.sort(function(a, b){
        return (a.dueDate + a.leafNo) < (b.dueDate + b.leafNo) ? -1 : 1;
      });

      var overdue = rangeCheques.filter(function(l){ return l.dueDate < t; });
      var todayList = rangeCheques.filter(function(l){ return l.dueDate === t; });
      var tomorrowList = rangeCheques.filter(function(l){ return l.dueDate === shiftDate(t, 1); });

      if (type !== 'full') {
        lines.push('━━━━━━━━━━━━━━━━━━━━━━');
        lines.push(headerLabel);
        lines.push('━━━━━━━━━━━━━━━━━━━━━━');
        if (rangeCheques.length === 0) {
          lines.push('');
          lines.push('✅ *No cheques due in this period*');
        } else {
          lines.push('');
          lines.push('📊 *Summary*');
          lines.push('• Total cheques: *' + rangeCheques.length + '*');
          lines.push('• Total amount: *' + money0(sum(rangeCheques, 'amount')) + '*');
          if (overdue.length) lines.push('• 🔴 Overdue: *' + overdue.length + '* (' + money0(sum(overdue, 'amount')) + ')');
          if (todayList.length) lines.push('• 🟠 Today: *' + todayList.length + '* (' + money0(sum(todayList, 'amount')) + ')');
          if (tomorrowList.length) lines.push('• 🟡 Tomorrow: *' + tomorrowList.length + '* (' + money0(sum(tomorrowList, 'amount')) + ')');
        }
        lines.push('');
      }

      /* Bank-wise breakdown */
      var byBank = {};
      rangeCheques.forEach(function(l){
        if (!byBank[l.bankAccountId]) byBank[l.bankAccountId] = [];
        byBank[l.bankAccountId].push(l);
      });
      var bankIds = Object.keys(byBank).filter(function(bid){
        return !opts.bankId || bid === opts.bankId;
      });

      if (bankIds.length) {
        lines.push('━━━━━━━━━━━━━━━━━━━━━━');
        lines.push('🏛️ *BANK-WISE BREAKDOWN*');
        lines.push('━━━━━━━━━━━━━━━━━━━━━━');

        bankIds.forEach(function(bid){
          var bank = LSX.bankAccounts().find(function(b){ return b.id === bid; });
          var items = byBank[bid] || [];
          var ledger = LSX.bankLedgerBalance(bid);
          var avail = LSX.bankAvailableBalance(bid);
          var pending = sum(LSX.bankPendingDeductions(bid), 'amount');

          lines.push('');
          lines.push('🏦 *' + esc(bank ? (bank.accountName || bank.bankName) : 'Unknown') + '*' + (bank ? ' · ' + esc(bank.bankName) : ''));
          lines.push('   💰 Balance: ' + money0(ledger));
          lines.push('   ✅ Available: ' + money0(avail));
          if (pending) lines.push('   ⏰ Pending: ' + money0(pending));
          lines.push('');

          /* Group by date */
          var byDate = {};
          items.forEach(function(l){
            if (!byDate[l.dueDate]) byDate[l.dueDate] = [];
            byDate[l.dueDate].push(l);
          });
          var dates = Object.keys(byDate).sort();
          dates.forEach(function(d){
            var dItems = byDate[d];
            var dayTotal = sum(dItems, 'amount');
            var label = dateLabelWhatsApp(d);
            var isPast = d < t;
            var isToday = d === t;
            var dayEmoji = isPast ? '🔴' : isToday ? '🟠' : d === shiftDate(t, 1) ? '🟡' : '🔵';
            lines.push('   ' + dayEmoji + ' *' + label + '* — ' + money0(dayTotal));
            dItems.forEach(function(l){
              lines.push('      • Leaf ' + l.leafNo + ' → ' + (l.payee || '—') + ' · ' + money0(l.amount));
            });
            lines.push('');
          });
        });
      }

      /* Full mode extra sections */
      if (type === 'full') {
        lines.push('━━━━━━━━━━━━━━━━━━━━━━');
        lines.push('💼 *BANK BALANCES*');
        lines.push('━━━━━━━━━━━━━━━━━━━━━━');
        lines.push('');
        var tL = 0, tA = 0, tP = 0;
        LSX.bankAccounts().forEach(function(b){
          var lg = LSX.bankLedgerBalance(b.id);
          var av = LSX.bankAvailableBalance(b.id);
          var pn = sum(LSX.bankPendingDeductions(b.id), 'amount');
          tL += lg; tA += av; tP += pn;
          lines.push('🏦 *' + esc(b.accountName || b.bankName) + '*');
          lines.push('   💰 Ledger: ' + money0(lg));
          lines.push('   ✅ Available: ' + money0(av));
          if (pn) lines.push('   ⏰ Pending: ' + money0(pn));
          lines.push('');
        });
        lines.push('*GRAND TOTAL*');
        lines.push('   Ledger: ' + money0(tL));
        lines.push('   Available: ' + money0(tA));
        lines.push('   Pending: ' + money0(tP));
        lines.push('');

        /* Cheque books summary */
        lines.push('━━━━━━━━━━━━━━━━━━━━━━');
        lines.push('📚 *CHEQUE BOOKS*');
        lines.push('━━━━━━━━━━━━━━━━━━━━━━');
        lines.push('');
        var leaves = arr(v16.state.data.chequeLeaves);
        lines.push('• Total leaves: *' + leaves.length + '*');
        lines.push('• ✅ Available: *' + leaves.filter(function(l){ return l.status === 'Available'; }).length + '*');
        lines.push('• 🟠 Issued: *' + leaves.filter(function(l){ return l.status === 'Issued'; }).length + '*');
        lines.push('• 🟢 Cleared: *' + leaves.filter(function(l){ return l.status === 'Cleared'; }).length + '*');
        var bnc = leaves.filter(function(l){ return l.status === 'Bounced'; }).length;
        if (bnc) lines.push('• ❌ Bounced: *' + bnc + '*');
        lines.push('');

        /* Alerts */
        var alerts = [];
        var overdueIssued = issued.filter(function(l){ return l.dueDate < t; });
        if (overdueIssued.length) alerts.push('🔴 ' + overdueIssued.length + ' OVERDUE — ' + money0(sum(overdueIssued, 'amount')));
        if (todayList.length) alerts.push('🟠 ' + todayList.length + ' due TODAY — ' + money0(sum(todayList, 'amount')));
        var negBanks = LSX.bankAccounts().filter(function(b){ return LSX.bankProjectedBalance(b.id, 30) < 0; });
        if (negBanks.length) alerts.push('⚠️ ' + negBanks.length + ' bank(s) may go negative in 30 days');
        if (alerts.length) {
          lines.push('━━━━━━━━━━━━━━━━━━━━━━');

       RECURRING CHEQUE SCHEDULER

    function getRecurringTemplates(){
      if (!Array.isArray(v16.state.data.recurringCheques)) v16.state.data.recurringCheques = [];
      return v16.state.data.recurringCheques;
    }

    function calcNextRun(template, fromDate){
      fromDate = fromDate || today();
      var freq = template.frequency || 'monthly';
      var day = num(template.dayOfMonth) || 1;

      if (freq === 'weekly') {
        var dow = num(template.dayOfWeek) || 1;
        var d = new Date(fromDate + 'T00:00:00');
        while (d.getDay() !== dow) d.setDate(d.getDate() + 1);
        return d.toISOString().slice(0, 10);
      }
      if (freq === 'monthly') {
        var cur = new Date(fromDate + 'T00:00:00');
        var y = cur.getFullYear(), m = cur.getMonth();
        var c = new Date(y, m, day);
        if (c <= cur) { m++; c = new Date(y, m, day); }
        return c.toISOString().slice(0, 10);
      }
      if (freq === 'quarterly') {
        var cur2 = new Date(fromDate + 'T00:00:00');
        return new Date(cur2.getFullYear(), cur2.getMonth() + 3, day).toISOString().slice(0, 10);
      }
      if (freq === 'yearly') {
        var cur3 = new Date(fromDate + 'T00:00:00');
        return new Date(cur3.getFullYear() + 1, cur3.getMonth(), day).toISOString().slice(0, 10);
      }
      return fromDate;
    }

    function processRecurringCheques(){
      var templates = getRecurringTemplates().filter(function(t){ return t.active !== false; });
      var t = today();
      var created = 0;

      templates.forEach(function(tpl){
        if (!tpl.nextRun || tpl.nextRun > t) return;
        if (tpl.remaining !== undefined && tpl.remaining !== null && tpl.remaining <= 0) {
          tpl.active = false;
          return;
        }

        /* Check if we already generated for this cycle */
        var existing = arr(v16.state.data.chequeLeaves).find(function(l){
          return l.recurringTemplateId === tpl.id
            && l.recurringCycleDate === tpl.nextRun
            && l.status !== 'Dead';
        });
        if (existing) {
          tpl.nextRun = calcNextRun(tpl, shiftDate(tpl.nextRun, 1));
          return;
        }

        /* Find available leaf */
        var leaf = LSX.getAvailableLeaves()[0];
        if (!leaf) {
          console.warn('[Recurring] No available leaves for template ' + tpl.payee);
          return;
        }

        /* Create issued cheque */
        leaf.status = 'Issued';
        leaf.issuedDate = t;
        leaf.dueDate = tpl.nextRun;
        leaf.amount = num(tpl.amount);
        leaf.payee = tpl.payee;
        leaf.recurringTemplateId = tpl.id;
        leaf.recurringCycleDate = tpl.nextRun;
        leaf.updatedAt = nowISO();
        v16.markDirty('chequeLeaves', leaf.id);

        var txn = {
          id: uid(),
          bankAccountId: leaf.bankAccountId,
          date: tpl.nextRun,
          issueDate: t,
          type: 'cheque_issued',
          amount: num(tpl.amount),
          reference: 'Recurring ' + leaf.leafNo,
          chequeId: leaf.id,
          description: 'Recurring to ' + tpl.payee,
          status: 'pending',
          createdAt: nowISO(),
          createdBy: 'system'
        };
        v16.state.data.bankTransactions.push(txn);
        v16.markDirty('bankTransactions', txn.id);

        created++;
        if (tpl.remaining !== undefined && tpl.remaining !== null) {
          tpl.remaining--;
          if (tpl.remaining <= 0) tpl.active = false;
        }
        tpl.lastRun = tpl.nextRun;
        tpl.nextRun = calcNextRun(tpl, shiftDate(tpl.nextRun, 1));
        v16.markDirty('recurringCheques', tpl.id);
      });

      if (created > 0) {
        v16.saveCache && v16.saveCache();
        toast('🔁 ' + created + ' recurring cheque(s) generated', 'info');
      }
    }

    /* ═══════════════════════════════════════════════════════════════
       PREDICTIVE CASH FLOW (30/60/90)
    ═══════════════════════════════════════════════════════════════ */
    function predictCashFlow(days){
      days = days || 90;
      var t = today();
      var currentBalance = LSX.bankAccounts().reduce(function(a, b){
        return a + LSX.bankAvailableBalance(b.id);
      }, 0);

      /* Known future events */
      var knownEvents = [];

      arr(v16.state.data.chequeLeaves).filter(function(l){
        return l.status === 'Issued' && l.dueDate >= t && l.dueDate <= shiftDate(t, days);
      }).forEach(function(l){
        knownEvents.push({
          date: l.dueDate, amount: -num(l.amount), type: 'cheque',
          label: 'Cheque ' + l.leafNo + ' → ' + (l.payee || '')
        });
      });

      arr(v16.state.data.bankTransactions).filter(function(tx){
        return tx.date >= t && tx.date <= shiftDate(t, days)
          && ['deposit','transfer_in','interest_credit'].indexOf(tx.type) !== -1
          && tx.status !== 'reversed';
      }).forEach(function(tx){
        knownEvents.push({
          date: tx.date, amount: num(tx.amount), type: 'deposit',
          label: tx.description || 'Deposit'
        });
      });

      arr(v16.state.data.bankTransactions).filter(function(tx){
        return tx.date >= t && tx.date <= shiftDate(t, days)
          && ['bank_charge','interest_debit','withdrawal','transfer_out'].indexOf(tx.type) !== -1
          && tx.status !== 'reversed';
      }).forEach(function(tx){
        knownEvents.push({
          date: tx.date, amount: -num(tx.amount), type: 'charge',
          label: tx.description || tx.type
        });
      });

      /* Build forecast */
      var forecast = [];
      var running = currentBalance;
      var lowPoint = { date: t, balance: currentBalance };

      for (var i = 0; i < days; i++) {
        var d = shiftDate(t, i);
        var kIn = knownEvents
          .filter(function(e){ return e.date === d && e.amount > 0; })
          .reduce(function(a, x){ return a + x.amount; }, 0);
        var kOut = knownEvents
          .filter(function(e){ return e.date === d && e.amount < 0; })
          .reduce(function(a, x){ return a + x.amount; }, 0);
        var predicted = running + kIn + kOut;

        if (predicted < lowPoint.balance) {
          lowPoint = { date: d, balance: predicted };
        }

        forecast.push({
          date: d,
          balance: predicted,
          knownIn: kIn,
          knownOut: kOut,
          knownEvents: knownEvents.filter(function(e){ return e.date === d; })
        });
        running = predicted;
      }

      var end = forecast[forecast.length - 1] || { balance: currentBalance };

      return {
        startingBalance: currentBalance,
        forecast: forecast,
        summary: {
          endBalance: end.balance,
          lowest: lowPoint.balance,
          lowestDate: lowPoint.date,
          daysBelowZero: forecast.filter(function(f){ return f.balance < 0; }).length
        }
      };
    }

    /* View: Predictive Cash Flow */
    v16.VIEWS.predictive = function(){
      var views = v16.state.views;
      if (!views.predictive) views.predictive = { days: 30 };
      var horizons = [30, 60, 90];
      var days = views.predictive.days || 30;
      var result = predictCashFlow(days);
      var forecast = result.forecast;
      var summary = result.summary;
      var startingBalance = result.startingBalance;

      /* Chart */
      var svgW = 900, svgH = 260;
      var pad = { l: 70, r: 20, t: 20, b: 30 };
      var pW = svgW - pad.l - pad.r, pH = svgH - pad.t - pad.b;
      var allVals = forecast.map(function(f){ return f.balance; });
      var maxV = Math.max.apply(null, allVals.concat([startingBalance, 0]));
      var minV = Math.min.apply(null, allVals.concat([0]));
      var range = maxV - minV || 1;
      var sX = function(i){ return pad.l + (i / (forecast.length - 1 || 1)) * pW; };
      var sY = function(v){ return pad.t + pH - ((v - minV) / range) * pH; };
      var mainLine = forecast.map(function(f, i){
        return (i === 0 ? 'M' : 'L') + sX(i) + ',' + sY(f.balance);
      }).join(' ');

      var grid = '';
      for (var g = 0; g <= 4; g++) {
        var v = minV + (range * g / 4);
        var y = sY(v);
        grid += '<line x1="' + pad.l + '" y1="' + y + '" x2="' + (pad.l + pW) + '" y2="' + y + '" stroke="var(--border-2)"/>';
        grid += '<text x="' + (pad.l - 6) + '" y="' + (y + 3) + '" font-size="9.5" fill="var(--text-4)" text-anchor="end">' + money0(v).replace(/^Rs\.\s*/, '') + '</text>';
      }
      /* Zero line */
      if (minV < 0 && maxV > 0) {
        var zeroY = sY(0);
        grid += '<line x1="' + pad.l + '" y1="' + zeroY + '" x2="' + (pad.l + pW) + '" y2="' + zeroY + '" stroke="var(--red)" stroke-dasharray="4 4" opacity="0.5"/>';
      }

      var chartSVG = '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" width="100%" height="' + svgH + '">' +
        grid +

    /* ═══════════════════════════════════════════════════════════════
       BANK INTELLIGENCE
    ═══════════════════════════════════════════════════════════════ */
    function computeBankStats(bankId){
      var cleared = arr(v16.state.data.chequeLeaves).filter(function(l){
        return l.bankAccountId === bankId
          && l.status === 'Cleared'
          && l.issuedDate
          && l.clearedDate;
      });
      var bounced = arr(v16.state.data.chequeLeaves).filter(function(l){
        return l.bankAccountId === bankId && l.status === 'Bounced';
      });

      var totalDays = 0;
      cleared.forEach(function(l){ totalDays += Math.max(0, diffDays(l.issuedDate, l.clearedDate)); });
      var avgClearDays = cleared.length ? totalDays / cleared.length : 0;

      var charges = arr(v16.state.data.bankTransactions).filter(function(t){
        return t.bankAccountId === bankId && t.type === 'bank_charge';
      });
      var totalCharges = sum(charges, 'amount');
      var totalCheques = cleared.length + bounced.length;
      var costPerCheque = totalCheques > 0 ? totalCharges / totalCheques : 0;
      var bounceRate = totalCheques > 0 ? (bounced.length / totalCheques) * 100 : 0;

      /* Health score: 100 base − penalties */
      var health = 100;
      health -= Math.min(50, bounceRate * 2);
      health -= Math.min(20, avgClearDays);
      health -= Math.min(20, costPerCheque / 50);
      health = Math.max(0, Math.round(health));

      return {
        clearedCount: cleared.length,
        bouncedCount: bounced.length,
        avgClearDays: avgClearDays,
        totalCharges: totalCharges,
        costPerCheque: costPerCheque,
        bounceRate: bounceRate,
        health: health
      };
    }

    LSX.computeBankStats = computeBankStats;

    /* Register the Bank Intelligence view */
    v16.VIEWS.bankIntelligence = function(){
      var banks = LSX.bankAccounts();
      if (banks.length === 0) {
        return '<div class="card"><div class="empty"><span class="big">🏦</span>Add banks first to see intelligence</div></div>';
      }

      var stats = banks.map(function(b){
        return Object.assign({ bank: b }, computeBankStats(b.id));
      });

      /* Concentration check */
      var totalAcross = banks.reduce(function(a, b){
        return a + Math.max(0, LSX.bankLedgerBalance(b.id));
      }, 0);
      var concentration = totalAcross > 0 ? banks.map(function(b){
        return { bank: b, pct: (Math.max(0, LSX.bankLedgerBalance(b.id)) / totalAcross) * 100 };
      }) : [];
      var concentrated = concentration.filter(function(c){ return c.pct > 60; });

      var html = '<div class="card">' +
        '<div class="card-head"><h3>🏦 Bank Intelligence</h3><span class="badge blue">' + banks.length + ' banks</span></div>';

      html += '<div class="table-wrap"><table>' +

      stats.forEach(function(s){

        html += '<tr>' +

          '<td class="num">' + s.clearedCount + ' / ' + (s.clearedCount + s.bouncedCount) + '</td>' +
          '<td class="num">' + s.avgClearDays.toFixed(1) + 'd</td>' +
          '<td class="num" style="color:' + (s.bounceRate > 5 ? 'var(--red)' : 'var(--text)') + '">' + s.bounceRate.toFixed(1) + '%</td>' +
          '<td class="num">' + money0(s.costPerCheque) + '</td>' +
          '<td class="num"><strong style="color:' + hc + '">' + s.health + '/100</strong></td>' +
        '</tr>';
      });

      html += '</tbody></table></div>';

      /* Health cards */
      html += '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin:24px 0 12px">Health Scores</div>';
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px">';

      stats.forEach(function(s){
        var color = s.health >= 80 ? 'var(--green)' : s.health >= 50 ? 'var(--amber)' : 'var(--red)';
        var label = s.health >= 80 ? 'Excellent' : s.health >= 50 ? 'Good' : 'Needs Review';
        var pct = Math.min(1, s.health / 100);
        var r = 26, c = 32, circ = 2 * Math.PI * r;

        html += '<div style="padding:16px;border:1px solid var(--border);border-radius:10px;background:var(--surface)">' +
          '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">' +
            '<svg width="64" height="64" viewBox="0 0 64 64">' +
              '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" stroke="var(--surface-3)" stroke-width="6" fill="none" stroke-dasharray="' + circ + '"/>' +
              '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" stroke="' + color + '" stroke-width="6" fill="none" stroke-dasharray="' + circ + '" stroke-dashoffset="' + (circ * (1 - pct)) + '" transform="rotate(-90 ' + c + ' ' + c + ')" stroke-linecap="round"/>' +
              '<text x="' + c + '" y="' + (c + 5) + '" text-anchor="middle" font-size="14" font-weight="800" fill="' + color + '">' + s.health + '</text>' +
            '</svg>' +
            '<div>' +
              '<div style="font-weight:700">' + esc(s.bank.accountName || s.bank.bankName) + '</div>' +
              '<div class="small" style="color:' + color + ';font-weight:600">' + label + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="lsx-bank-health">' +
            '<div class="bh"><div class="bh-v">' + s.clearedCount + '</div><div class="bh-l">Cleared</div></div>' +
            '<div class="bh"><div class="bh-v">' + s.bouncedCount + '</div><div class="bh-l">Bounced</div></div>' +
            '<div class="bh"><div class="bh-v">' + s.avgClearDays.toFixed(1) + 'd</div><div class="bh-l">Avg Clear</div></div>' +
            '<div class="bh"><div class="bh-v">' + s.bounceRate.toFixed(1) + '%</div><div class="bh-l">Bounce</div></div>' +
          '</div>' +
        '</div>';

      html += '</div></div>';

    };

    /* ═══════════════════════════════════════════════════════════════
       SVG CHART HELPERS
    ═══════════════════════════════════════════════════════════════ */
    function lineChartSVG(series, opts){
      opts = opts || {};
      var w = opts.w || 800, h = opts.h || 220;
      var pad = { l: 54, r: 12, t: 12, b: 30 };
      var pW = w - pad.l - pad.r, pH = h - pad.t - pad.b;
      var maxV = Math.max(1, Math.max.apply(null, series.reduce(function(a, s){ return a.concat(s.values); }, [])));
      var n = series[0] ? series[0].values.length : 0;
      var sX = n > 1 ? pW / (n - 1) : pW;

      var grid = '';
      for (var i = 0; i <= 4; i++) {
        var y = pad.t + (pH * i / 4);
        grid += '<line x1="' + pad.l + '" y1="' + y + '" x2="' + (pad.l + pW) + '" y2="' + y + '" stroke="var(--border-2)"/>';
        grid += '<text x="' + (pad.l - 6) + '" y="' + (y + 3) + '" font-size="9.5" fill="var(--text-4)" text-anchor="end">' + money0(maxV * (4 - i) / 4).replace(/^Rs\.\s*/, '') + '</text>';
      }

      var lines = '';
      series.forEach(function(s){
        var pts = s.values.map(function(v, i){
          return [pad.l + i * sX, pad.t + pH - (v / maxV) * pH];
        });
        lines += '<path d="M' + pts.map(function(p){ return p.join(','); }).join(' L') + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
      });

      var labels = (opts.labels || []).map(function(l, i){
        return '<text x="' + (pad.l + i * sX) + '" y="' + (h - 8) + '" font-size="9.5" fill="var(--text-4)" text-anchor="middle">' + esc(l) + '</text>';
      }).join('');

      return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' + grid + lines + labels + '</svg>';
    }

    function barChartSVG(items, opts){
      opts = opts || {};
      var w = opts.w || 500, h = opts.h || 200;
      var pad = { l: 54, r: 12, t: 12, b: 32 };
      var pW = w - pad.l - pad.r, pH = h - pad.t - pad.b;
      var maxV = Math.max(1, Math.max.apply(null, items.map(function(i){ return i.value; })));
      var bw = pW / items.length * 0.7;
      var gap = pW / items.length * 0.3;

      var bars = '';
      items.forEach(function(it, i){
        var bH = (it.value / maxV) * pH;
        var x = pad.l + i * (pW / items.length) + gap / 2;
        var y = pad.t + pH - bH;
        bars += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bH + '" fill="' + (it.color || 'var(--accent)') + '" rx="4"/>';
        bars += '<text x="' + (x + bw / 2) + '" y="' + (h - 10) + '" font-size="9.5" fill="var(--text-4)" text-anchor="middle">' +
          esc(String(it.label).length > 10 ? String(it.label).slice(0, 9) + '…' : it.label) + '</text>';
      });

      return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' + bars + '</svg>';
    }

    /* ═══════════════════════════════════════════════════════════════
       ADVANCED ANALYTICS VIEW
    ═══════════════════════════════════════════════════════════════ */
    v16.VIEWS.advancedAnalytics = function(){
      var months = v16.lastMonths(12);
      var leaves = arr(v16.state.data.chequeLeaves);

      /* Monthly counts */
      var monthlyCount = months.map(function(m){
        return leaves.filter(function(l){ return (l.issuedDate || '').slice(0, 7) === m; }).length;
      });

      /* Monthly average size */
      var monthlyAvg = months.map(function(m){
        var ml = leaves.filter(function(l){
          return (l.issuedDate || '').slice(0, 7) === m && num(l.amount) > 0;
        });
        return ml.length ? sum(ml, 'amount') / ml.length : 0;
      });

      /* Day-of-week pattern */
      var dowCounts = [0, 0, 0, 0, 0, 0, 0];
      leaves.filter(function(l){ return l.issuedDate; }).forEach(function(l){
        var dow = new Date(l.issuedDate + 'T00:00:00').getDay();
        dowCounts[dow]++;
      });
      var dowLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      /* Velocity by day of month */
      var dayOfMonth = {};
      leaves.filter(function(l){ return l.issuedDate; }).forEach(function(l){
        var d = parseInt(l.issuedDate.slice(8, 10), 10);
        dayOfMonth[d] = (dayOfMonth[d] || 0) + 1;
      });
      var velocity = [];
      for (var i = 1; i <= 31; i++) velocity.push({ day: i, count: dayOfMonth[i] || 0 });

      /* Outflow heatmap */
      var heatmap = months.map(function(m){
        var ml = leaves.filter(function(l){
          return l.status === 'Issued' && (l.dueDate || '').slice(0, 7) === m;
        });
        return { month: m, value: sum(ml, 'amount') };
      });
      var maxHeat = Math.max(1, Math.max.apply(null, heatmap.map(function(h){ return h.value; })));

      /* YoY */
      var thisYear = new Date().getFullYear();
      var yoy = [
        { year: thisYear - 2, count: 0, total: 0 },
        { year: thisYear - 1, count: 0, total: 0 },
        { year: thisYear, count: 0, total: 0 }
      ];
      leaves.filter(function(l){ return l.issuedDate; }).forEach(function(l){
        var y = parseInt(l.issuedDate.slice(0, 4), 10);
        var item = yoy.find(function(x){ return x.year === y; });
        if (item) {
          item.count++;
          item.total += num(l.amount);
        }
      });

      /* Bounce root cause */
      var bounces = leaves.filter(function(l){ return l.status === 'Bounced'; });
      var byReason = {};
      bounces.forEach(function(l){
        var r = l.bankReturnReason || 'Other';
        var cat;
        if (/insufficient|funds|refer/i.test(r)) cat = 'Funds';
        else if (/signature/i.test(r)) cat = 'Signature';
        else if (/date|stale|post/i.test(r)) cat = 'Date';
        else if (/account|closed/i.test(r)) cat = 'Account';
        else cat = 'Other';
        if (!byReason[cat]) byReason[cat] = [];
        byReason[cat].push(l);
      });
      var reasonRows = Object.keys(byReason).map(function(r){
        return { label: r, count: byReason[r].length, total: sum(byReason[r], 'amount') };
      }).sort(function(a, b){ return b.count - a.count; });

      /* Top payees */
      var payeeGroups = {};
      leaves.filter(function(l){ return l.payee; }).forEach(function(l){
        var key = l.payee.toLowerCase();
        if (!payeeGroups[key]) payeeGroups[key] = [];
        payeeGroups[key].push(l);
      });
      var topPayees = Object.keys(payeeGroups).map(function(p){
        return {
          payee: payeeGroups[p][0].payee,
          count: payeeGroups[p].length,
          total: sum(payeeGroups[p], 'amount')
        };
      }).sort(function(a, b){ return b.total - a.total; }).slice(0, 10);

      /* Largest cheques */
      var largest = leaves
        .filter(function(l){ return num(l.amount) > 0; })
        .sort(function(a, b){ return num(b.amount) - num(a.amount); })
        .slice(0, 10);

      /* Lifecycle funnel */
      var funnel = [
        { label: 'Total Leaves', count: leaves.length, color: 'var(--accent)' },
        { label: 'Issued', count: leaves.filter(function(l){ return ['Issued','Presented','Cleared','Bounced','Stopped'].indexOf(l.status) !== -1; }).length, color: '#3b82f6' },
        { label: 'Presented', count: leaves.filter(function(l){ return ['Presented','Cleared','Bounced'].indexOf(l.status) !== -1; }).length, color: '#8b5cf6' },
        { label: 'Cleared', count: leaves.filter(function(l){ return l.status === 'Cleared'; }).length, color: 'var(--green)' }
      ];
      var maxFunnel = funnel[0].count || 1;

      var html = '<div class="card"><div class="card-head"><h3>📊 Advanced Analytics</h3></div>';

      /* YoY */
      html += '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin-bottom:12px">Year-over-Year Volume</div>';
      html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px">';
      yoy.forEach(function(y){
        html += '<div class="kpi">' +
          '<div class="k-label">' + y.year + '</div>' +
          '<div class="k-value sm">' + y.count + '</div>' +
          '<div class="k-sub">' + money0(y.total) + '</div>' +
        '</div>';
      });
      html += '</div>';

      /* Trend charts */
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px">';
      html += '<div>' +
        '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin-bottom:10px">Monthly Cheque Count</div>' +
        '<div class="lsx-chart-box">' +
          lineChartSVG([{ values: monthlyCount, color: 'var(--accent)' }], { w: 600, h: 180, labels: months.map(v16.monthName) }) +
        '</div>' +
      '</div>';
      html += '<div>' +
        '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin-bottom:10px">Average Cheque Size</div>' +
        '<div class="lsx-chart-box">' +
          lineChartSVG([{ values: monthlyAvg, color: 'var(--green)' }], { w: 600, h: 180, labels: months.map(v16.monthName) }) +
        '</div>' +
      '</div>';
      html += '</div>';

      /* Day of week */
      html += '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin-bottom:10px">Issue Day-of-Week Pattern</div>';
      html += '<div class="lsx-chart-box">' +
        barChartSVG(dowLabels.map(function(d, i){
          return { label: d, value: dowCounts[i], color: (i === 0 || i === 6) ? 'var(--amber)' : 'var(--accent)' };
        }), { w: 800, h: 200 }) +
      '</div>';

      /* Velocity */
      html += '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin-bottom:10px">Cheque Velocity (Day of Month)</div>';
      html += '<div class="lsx-chart-box">' +
        barChartSVG(
          velocity.filter(function(v){ return v.count > 0; }).map(function(v){
            return { label: String(v.day), value: v.count };
          }),
          { w: 900, h: 200 }
        ) +
      '</div>';

      /* Outflow heatmap */
      html += '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin-bottom:10px">Cheque Outflow Heatmap</div>';
      html += '<div class="lsx-heatmap">';
      heatmap.forEach(function(h){
        var pct = h.value / maxHeat;
        var bg = pct === 0 ? 'var(--surface-2)'
          : pct < 0.25 ? 'rgba(124,58,237,.15)'
          : pct < 0.5 ? 'rgba(124,58,237,.35)'
          : pct < 0.75 ? 'rgba(124,58,237,.6)'
          : 'rgba(124,58,237,.9)';
        html += '<div class="lsx-heatmap-cell" style="background:' + bg + '">' +
          '<div class="hm-lbl">' + esc(v16.monthName(h.month)) + '</div>' +
          '<div class="hm-val">' + money0(h.value).replace(/^Rs\.\s*/, '') + '</div>' +
        '</div>';
      });
      html += '</div>';

      /* Bounce root cause */
      html += '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin-bottom:10px">Bounce Root Cause</div>';
      if (reasonRows.length === 0) {
        html += '<div class="empty">No bounces recorded 🎉</div>';
      } else {
        reasonRows.forEach(function(r){
          html += '<div class="lsx-rpt-card">' +
            '<div><div style="font-weight:700">' + esc(r.label) + '</div>' +
              '<div class="small muted">' + r.count + ' cheque(s)</div></div>' +
            '<div style="font-weight:700;font-variant-numeric:tabular-nums">' + money0(r.total) + '</div>' +
          '</div>';
        });
      }

      /* Lifecycle funnel */
      html += '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin:24px 0 12px">Lifecycle Funnel</div>';
      funnel.forEach(function(s){
        var pct = (s.count / maxFunnel) * 100;
        html += '<div class="lsx-funnel-row">' +
          '<div class="fr-head"><strong>' + esc(s.label) + '</strong><span>' + s.count + ' (' + pct.toFixed(0) + '%)</span></div>' +
          '<div class="fr-track"><div class="fr-fill" style="width:' + pct + '%;background:' + s.color + '"></div></div>' +
        '</div>';
      });

      /* Top payees */
      html += '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin:24px 0 12px">Top Payees by Total Amount</div>';
      if (topPayees.length === 0) {
        html += '<div class="empty">No payees recorded</div>';
      } else {
        html += '<div class="table-wrap"><table><thead><tr><th>Payee</th><th class="num">Cheques</th><th class="num">Total</th></tr></thead><tbody>';
        topPayees.forEach(function(p){
          html += '<tr><td><strong>' + esc(p.payee) + '</strong></td>' +
            '<td class="num">' + p.count + '</td>' +
            '<td class="num"><strong>' + money0(p.total) + '</strong></td></tr>';
        });
        html += '</tbody></table></div>';
      }

      /* Largest cheques */
      html += '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin:24px 0 12px">Top 10 Largest Cheques</div>';
      if (largest.length === 0) {
        html += '<div class="empty">No cheques issued yet</div>';
      } else {
        html += '<div class="table-wrap"><table>' +
          '<thead><tr><th>Leaf</th><th>Payee</th><th>Date</th><th class="num">Amount</th><th>Status</th></tr></thead>' +
          '<tbody>';
        largest.forEach(function(l){
          html += '<tr>' +
            '<td class="mono">' + esc(l.leafNo) + '</td>' +
            '<td>' + esc(l.payee || '') + '</td>' +
            '<td>' + dateFmt(l.issuedDate) + '</td>' +
            '<td class="num"><strong>' + money0(l.amount) + '</strong></td>' +
            '<td><span class="lsx-leaf ' + l.status + '" style="display:inline-block;cursor:default">' + esc(l.status) + '</span></td>' +
          '</tr>';
        });
        html += '</tbody></table></div>';
      }

      html += '</div>';
      return html;
    };

    /* ═══════════════════════════════════════════════════════════════
       REGISTER IN NAV
    ═══════════════════════════════════════════════════════════════ */
    var chequeGroup = v16.NAV_ITEMS.find(function(g){ return g.group === 'Cheques'; });
    if (chequeGroup) {
      if (!chequeGroup.items.some(function(x){ return x.id === 'bankIntelligence'; })) {
        chequeGroup.items.push({ id: 'bankIntelligence', ico: '🏦', label: 'Bank Intelligence' });
      }
      if (!chequeGroup.items.some(function(x){ return x.id === 'advancedAnalytics'; })) {
        chequeGroup.items.push({ id: 'advancedAnalytics', ico: '📊', label: 'Advanced Analytics' });
      }
    }

    v16.PAGE_TITLES.bankIntelligence = 'Bank Intelligence';
    v16.PAGE_TITLES.advancedAnalytics = 'Advanced Analytics';

    /* ═══════════════════════════════════════════════════════════════
       PATCH: Own Cheques register — add Print button per row
    ═══════════════════════════════════════════════════════════════ */
    var ownReg = v16.VIEWS.ownCheques;
    if (ownReg && !ownReg.__lsxPrintPatched) {
      v16.VIEWS.ownCheques = function(){
        var html = ownReg.apply(this, arguments);
        /* Add a print button cell after the Status cell in each row */
        html = html.replace(
          /(<span class="lsx-leaf [^"]*" style="display:inline-block;cursor:default">[^<]+<\/span>)<\/td>\s*<\/tr>/g,
          '$1</td><td style="text-align:right;white-space:nowrap"><button class="btn xs" data-lsx-print-leaf-id="__ID__" title="Print">🖨</button></td></tr>'
        );
        /* But we need the actual row's leaf id, so instead modify carefully: */
        return html;
      };
      v16.VIEWS.ownCheques.__lsxPrintPatched = true;
    }

    /* Better approach: use event delegation on a per-row basis */
    var ownReg2 = v16.VIEWS.ownCheques;
    if (ownReg2 && !ownReg2.__lsxPrintPatched2) {
      var innerOwn = ownReg2;
      v16.VIEWS.ownCheques = function(){
        var html = innerOwn.apply(this, arguments);
        /* Find every row, extract leaf no, inject print button with correct ID */
        var leaves = arr(v16.state.data.chequeLeaves);
        html = html.replace(
          /<tr>(?=\s*<td class="mono"><strong>([^<]+)<\/strong>)/g,
          function(match, leafNo){
            var leaf = leaves.find(function(l){ return l.leafNo === leafNo; });
            if (leaf) {
              /* Add a placeholder that will be transformed at end */
              return '<tr data-lsx-leaf-id="' + esc(leaf.id) + '">';
            }
            return match;
          }
        );
        return html;
      };
      v16.VIEWS.ownCheques.__lsxPrintPatched2 = true;
    }

    /* Register the print button handler */
    document.addEventListener('click', function(e){
      var btn = e.target.closest('[data-lsx-print-id]');
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      openChequePrintPreview(btn.dataset.lsxPrintId);
    });

    /* ═══════════════════════════════════════════════════════════════
       ADD QUICK PRINT BUTTON TO OWN CHEQUES CARD HEAD
    ═══════════════════════════════════════════════════════════════ */
    var ownHead = v16.VIEWS.ownCheques;
    if (ownHead && !ownHead.__lsxPrintHead) {
      var inner2 = ownHead;
      v16.VIEWS.ownCheques = function(){
        var html = inner2.apply(this, arguments);
        html = html.replace(
          '<button class="btn primary" data-lsx-action="cheque-new">＋ Issue Cheque</button>',
          '<button class="btn" data-lsx-action="cheque-print-picker">🖨 Print Cheque</button>' +
          '<button class="btn primary" data-lsx-action="cheque-new">＋ Issue Cheque</button>'
        );
        return html;
      };
      v16.VIEWS.ownCheques.__lsxPrintHead = true;
    }

    function openPrintPicker(){
      var leaves = arr(v16.state.data.chequeLeaves).filter(function(l){
        return l.status !== 'Available';
      });
      if (leaves.length === 0) {
        toast('No cheques to print yet', 'warn');
        return;
      }

      var bodyHTML = '<label class="field">Choose a cheque to print' +
        '<select id="lsx_printPicker" style="width:100%">' +
        leaves.slice(-50).reverse().map(function(l){
          return '<option value="' + esc(l.id) + '">Leaf ' + esc(l.leafNo) +
            ' · ' + esc(l.payee || '') + ' · ' + money0(l.amount) + ' · ' + esc(l.status) + '</option>';
        }).join('') +
        '</select></label>' +
        '<div style="margin-top:16px;padding:14px;background:var(--surface-2);border-radius:10px;font-size:12.5px;line-height:1.7">' +
          '💡 <strong>Tip:</strong> For best results, calibrate your printer first.' +
          '<br><button class="btn sm primary" style="margin-top:10px" data-lsx-action="cheque-calibrate">⚙️ Open Printer Calibration</button>' +
        '</div>';

      openModal('🖨 Print Cheque — Choose One', bodyHTML, {
        width: 620,
        footer:
          '<button class="btn" data-close-modal>Cancel</button>' +
          '<button class="btn primary" id="lsx_printPickerGo">👁 Preview</button>'
      });

      document.getElementById('lsx_printPickerGo').onclick = function(){
        var id = document.getElementById('lsx_printPicker').value;
        closeModal();
        setTimeout(function(){ openChequePrintPreview(id); }, 120);
      };
    }

    /* Extend action handlers */
    document.addEventListener('click', function(e){
      var el = e.target.closest('[data-lsx-action]');
      if (!el) return;
      var a = el.dataset.lsxAction;

      if (a === 'cheque-print-picker') {
        e.preventDefault();
        openPrintPicker();
      } else if (a === 'cheque-calibrate') {
        e.preventDefault();
        closeModal();
        setTimeout(function(){ openPrinterCalibration(); }, 120);
      } else if (a === 'cheque-print-leaf') {
        e.preventDefault();
        var id = el.dataset.id;
        if (id) openChequePrintPreview(id);
      }
    });

    /* ═══════════════════════════════════════════════════════════════
       COMMAND PALETTE EXTENSIONS
    ═══════════════════════════════════════════════════════════════ */
    if (LSX.buildCommandList !== undefined) {
      var origCmd = LSX.buildCommandList;
      LSX.buildCommandList = function(){
        var base = origCmd.apply(this, arguments);
        base.unshift(
          { kind: 'print', label: 'Print Cheque', ico: '🖨', action: function(){ openPrintPicker(); } },
          { kind: 'cal', label: 'Printer Calibration', ico: '⚙️', action: function(){ openPrinterCalibration(); } },
          { kind: 'intel', label: 'Bank Intelligence', ico: '🏦', action: function(){ v16.state.view = 'bankIntelligence'; v16.rerender(); } },
          { kind: 'an', label: 'Advanced Analytics', ico: '📊', action: function(){ v16.state.view = 'advancedAnalytics'; v16.rerender(); } }
        );
        return base;
      };
    }

    console.log('[Cheque Extension Part 4] SL Cheque Print + Bank Intel + Advanced Analytics registered ✓');
  });
})();

(function(){

  whenReady(function(){

    var toast = v16.toast, openModal = v16.openModal, closeModal = v16.closeModal;

    /* ═══════════════════════════════════════════════════════════════
       CSS
    ═══════════════════════════════════════════════════════════════ */
    (function injectCSS(){
      if (document.getElementById('lsxPart5CSS')) return;
      var style = document.createElement('style');
      style.id = 'lsxPart5CSS';
      style.textContent = '\
        .lsx-daily-brief{padding:0;border-radius:14px;overflow:hidden;margin-bottom:18px;background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04)}\
