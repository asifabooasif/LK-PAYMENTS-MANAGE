function openCsvImport(type){
  const templates = {
    customers: 'name,phone,email,address,openingBalance',
    suppliers: 'name,phone,email,address,group,openingBalance,creditDays,creditLimit',
    receipts: 'customerName,method,chequeNo,bank,date,dueDate,amount,status'
  };
  openModal('Import ' + type + ' from CSV', `
    <div class="alert info"><span class="ico">i</span><div>CSV must have a header row. Expected columns: <code class="mono">${esc(templates[type] || '')}</code></div></div>
    <label class="field">CSV File<input type="file" id="csvFile" accept=".csv"></label>
    <label class="field" style="margin-top:14px">Or paste CSV content<textarea id="csvPaste" placeholder="Paste CSV here" style="min-height:120px;font-family:var(--mono);font-size:11.5px"></textarea></label>
    <div class="form-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="button" class="btn primary" onclick="doCsvImport('${type}')">Import</button></div>
  `);
}
window.openCsvImport = openCsvImport;
function parseCSV(text){
  const lines = text.replace(/\r\n/g,'\n').split('\n').filter(l => l.trim());
  if(!lines.length) return { headers:[], rows:[] };
  const headers = splitCSVLine(lines[0]).map(h => h.trim());
  const rows = lines.slice(1).map(l => { const vals = splitCSVLine(l); const obj = {}; headers.forEach((h, i) => obj[h] = (vals[i] || '').trim()); return obj; });
  return { headers, rows };
}
function splitCSVLine(line){
  const out = []; let cur = ''; let inQ = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(ch === '"'){ if(inQ && line[i+1] === '"'){ cur += '"'; i++; } else inQ = !inQ; }
    else if(ch === ',' && !inQ){ out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
function doCsvImport(type){
  const fileInput = document.getElementById('csvFile');
  const paste = document.getElementById('csvPaste')?.value || '';
  const finish = (text) => {
    try{
      const { headers, rows } = parseCSV(text);
      if(!headers.length || !rows.length){ toast('No valid data','error'); return; }
      let imported = 0;
      if(type === 'customers'){
        rows.forEach(r => {
          if(!r.name) return;
          db.customers.push({ id:uid(), name:r.name, phone:r.phone||'', email:r.email||'', address:r.address||'', openingBalance:num(r.openingBalance), openingDate: r.openingDate || today(), createdAt:nowISO() });
          imported++;
        });
      } else if(type === 'suppliers'){
        rows.forEach(r => {
          if(!r.name) return;
          db.suppliers.push({ id:uid(), name:r.name, phone:r.phone||'', email:r.email||'', address:r.address||'', group:r.group||'', openingBalance:num(r.openingBalance), openingDate: r.openingDate || today(), creditDays:num(r.creditDays)||30, creditLimit:num(r.creditLimit), createdAt:nowISO() });
          imported++;
        });
      } else if(type === 'receipts'){
        rows.forEach(r => {
          if(!r.customerName || !r.amount) return;
          const c = db.customers.find(x => x.name.toLowerCase() === String(r.customerName).toLowerCase());
          if(!c) return;
          db.receipts.push({ id:uid(), customerId:c.id, customerName:c.name, method:r.method||'Cheque', chequeNo:r.chequeNo||'', bank:r.bank||'', date:r.date||today(), dueDate:r.dueDate||'', amount:num(r.amount), status:r.status||'Pending', createdAt:nowISO() });
          imported++;
        });
      }
      logAct('Import CSV','System',null, type + ': ' + imported + ' records');
      save(); closeModal(); render();
      toast('Imported ' + imported + ' record(s)', 'ok');
    }catch(e){ toast('CSV parse error: ' + e.message, 'error'); }
  };
  if(fileInput?.files?.length){
    const reader = new FileReader();
    reader.onload = e => finish(e.target.result);
    reader.readAsText(fileInput.files[0]);
  } else if(paste.trim()){
    finish(paste);
  } else { toast('Choose a file or paste CSV content','error'); }
}
window.doCsvImport = doCsvImport;

      const ob = document.createElement('button');
      ob.id = 'offlineBtn';
      ob.className = 'google-btn';
      ob.style.marginTop = '14px';
      ob.innerHTML = 'Continue in Offline Mode';
      ob.onclick = enterOfflineMode;
      note.parentNode.insertBefore(ob, note);
    }
    return;
  }
  document.getElementById('googleSignInBtn').addEventListener('click', handleSignIn);
  auth.onAuthStateChanged(onAuthStateChanged);
})();
