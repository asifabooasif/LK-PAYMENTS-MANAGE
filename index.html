<!-- ═══════════════════════════════════════════════════════════════════
     CHEQUE EXTENSION FOR LANKA SHOE v16 — PART 1
     Banks · Cheque Books · Cheque Leaves
     ═══════════════════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';

  /* ══════════════════════════════════════════════════════════════════
     Wait for v16 bridge to be installed, then register everything
     ══════════════════════════════════════════════════════════════════ */
  function whenReady(fn){
    if (window.__v16 && window.__v16.VIEWS) { fn(); return; }
    var tries = 0;
    var iv = setInterval(function(){
      tries++;
      if (window.__v16 && window.__v16.VIEWS) { clearInterval(iv); fn(); }
      if (tries > 200) clearInterval(iv);   /* 40 sec cap */
    }, 200);
  }

  whenReady(function(){
    var v16 = window.__v16;
    var num = v16.num, arr = v16.arr, sum = v16.sum, uniq = v16.uniq;
    var money = v16.money, money0 = v16.money0, esc = v16.esc;
    var today = v16.today, shiftDate = v16.shiftDate;
    var diffDays = v16.diffDays, dateFmt = v16.dateFmt, dateTimeFmt = v16.dateTimeFmt;
    var nowISO = v16.nowISO, uid = v16.uid;
    var toast = v16.toast, openModal = v16.openModal, closeModal = v16.closeModal;

    /* ─────────────────────────────────────────────────────────────
       Register additional collections (harmless if already present)
    ───────────────────────────────────────────────────────────── */
    var extraCols = ['chequePrintProfiles','smsLog','smsSenderMap','bounceReasons','bankStatements'];
    extraCols.forEach(function(c){
      if (v16.COLLECTIONS.indexOf(c) === -1) v16.COLLECTIONS.push(c);
      if (!Array.isArray(v16.state.data[c])) v16.state.data[c] = [];
    });

    /* ─────────────────────────────────────────────────────────────
       CORE ENGINE — Bank balances and cheque helpers
    ───────────────────────────────────────────────────────────── */

    function bankAccounts(){
      return arr(v16.state.data.bankAccounts);
    }

    function bankTxs(bankId){
      return arr(v16.state.data.bankTransactions).filter(function(t){ return t.bankAccountId === bankId; });
    }

    /* LEDGER BALANCE: opening + cleared movements only */
    function bankLedgerBalance(bankId, upToDate){
      var b = bankAccounts().find(function(x){ return x.id === bankId; });
      if (!b) return 0;
      var txns = bankTxs(bankId).filter(function(t){
        if (t.status === 'reversed' || t.status === 'rejected' || t.status === 'bounced' || t.status === 'stopped') return false;
        if (upToDate && (t.date || '') > upToDate) return false;
        return true;
      });
      var net = txns.reduce(function(s, t){
        var a = num(t.amount);
        if (t.type === 'deposit' || t.type === 'transfer_in' || t.type === 'interest_credit') return s + a;
        if (t.type === 'withdrawal' || t.type === 'transfer_out' || t.type === 'bank_charge' || t.type === 'interest_debit' || t.type === 'adjustment') return s - a;
        if (t.type === 'cheque_issued' && t.status === 'cleared') return s - a;
        if (t.type === 'cheque_cleared') return s - a;
        return s;
      }, 0);
      return num(b.openingBalance) + net;
    }

    /* AVAILABLE BALANCE: ledger − pending cheques */
    function bankAvailableBalance(bankId){
      var pending = arr(v16.state.data.bankTransactions).filter(function(t){
        return t.bankAccountId === bankId && t.type === 'cheque_issued' && (t.status === 'pending' || !t.status);
      });
      return bankLedgerBalance(bankId) - sum(pending, 'amount');
    }

    /* BOOK BALANCE (your internal view) */
    function bankBookBalance(bankId){
      var pending = arr(v16.state.data.bankTransactions).filter(function(t){
        return t.bankAccountId === bankId && t.type === 'cheque_issued' && (t.status === 'pending' || !t.status);
      });
      return bankLedgerBalance(bankId) - sum(pending, 'amount');
    }

    function bankPendingDeductions(bankId){
      return arr(v16.state.data.bankTransactions).filter(function(t){
        return t.bankAccountId === bankId && t.type === 'cheque_issued' && (t.status === 'pending' || !t.status);
      });
    }

    /* PROJECTED BALANCE: N days ahead considering scheduled cheques */
    function bankProjectedBalance(bankId, daysAhead){
      var t = today();
      var limit = shiftDate(t, daysAhead);
      var ledger = bankLedgerBalance(bankId);
      var futureIn = arr(v16.state.data.bankTransactions).filter(function(tx){
        return tx.bankAccountId === bankId && tx.date >= t && tx.date <= limit &&
          (tx.type === 'deposit' || tx.type === 'transfer_in' || tx.type === 'interest_credit') && tx.status !== 'reversed';
      });
      var futureOut = arr(v16.state.data.bankTransactions).filter(function(tx){
        return tx.bankAccountId === bankId && tx.date >= t && tx.date <= limit &&
          (tx.type === 'withdrawal' || tx.type === 'transfer_out' || tx.type === 'bank_charge' || tx.type === 'interest_debit') && tx.status !== 'reversed';
      });
      var futureCheques = arr(v16.state.data.bankTransactions).filter(function(tx){
        return tx.bankAccountId === bankId && tx.type === 'cheque_issued' && tx.date >= t && tx.date <= limit &&
          tx.status !== 'reversed' && tx.status !== 'rejected';
      });
      return ledger + sum(futureIn, 'amount') - sum(futureOut, 'amount') - sum(futureCheques, 'amount');
    }

    /* Shared namespace for future parts */
    window.LSX = window.LSX || {};
    Object.assign(window.LSX, {
      v16: v16,
      bankAccounts: bankAccounts,
      bankTxs: bankTxs,
      bankLedgerBalance: bankLedgerBalance,
      bankAvailableBalance: bankAvailableBalance,
      bankBookBalance: bankBookBalance,
      bankPendingDeductions: bankPendingDeductions,
      bankProjectedBalance: bankProjectedBalance
    });

    /* Colour + short code for Sri Lankan banks */
    var SL_BANKS = [
      { name:'Amana Bank', color:'#1a7d47', short:'AB' },
      { name:'Bank of Ceylon', color:'#f5b800', short:'BOC' },
      { name:'Cargills Bank', color:'#e30613', short:'CGB' },
      { name:'Commercial Bank', color:'#0d4d9c', short:'CB' },
      { name:'DFCC Bank', color:'#00539b', short:'DFCC' },
      { name:'Hatton National Bank', color:'#003366', short:'HNB' },
      { name:'HSBC', color:'#db0011', short:'HSBC' },
      { name:'Nations Trust Bank', color:'#003399', short:'NTB' },
      { name:'National Savings Bank', color:'#003399', short:'NSB' },
      { name:'NDB Bank', color:'#00a651', short:'NDB' },
      { name:'Pan Asia Bank', color:'#6b2d91', short:'PAB' },
      { name:"People's Bank", color:'#c8102e', short:'PB' },
      { name:'Sampath Bank', color:'#e62329', short:'SB' },
      { name:'Seylan Bank', color:'#0066b3', short:'SEY' },
      { name:'Standard Chartered', color:'#0473ea', short:'SC' },
      { name:'State Bank of India', color:'#1e40af', short:'SBI' },
      { name:'Union Bank', color:'#ff6b00', short:'UB' },
      { name:'Other', color:'#6b7280', short:'OT' }
    ];

    function bankLogo(name){
      if (!name) return '<span class="lsx-bank-logo" style="background:#6b7280">?</span>';
      var b = SL_BANKS.find(function(x){
        return name.toLowerCase().indexOf(x.name.toLowerCase().split(' ')[0].toLowerCase()) !== -1;
      }) || SL_BANKS[SL_BANKS.length - 1];
      return '<span class="lsx-bank-logo" style="background:' + b.color + '">' + b.short + '</span>';
    }

    function bankOptions(selected){
      return SL_BANKS.map(function(b){
        return '<option value="' + esc(b.name) + '"' + (selected === b.name ? ' selected' : '') + '>' + esc(b.name) + '</option>';
      }).join('');
    }

    /* ─────────────────────────────────────────────────────────────
       CSS
    ───────────────────────────────────────────────────────────── */
    (function injectCSS(){
      if (document.getElementById('lsxPart1CSS')) return;
      var style = document.createElement('style');
      style.id = 'lsxPart1CSS';
      style.textContent = '\
        .lsx-bank-logo{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;color:#fff;font-weight:800;font-size:11px;flex-shrink:0}\
        .lsx-bank-card{padding:20px 22px;border:1px solid var(--border);border-radius:14px;background:var(--surface);cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s}\
        .lsx-bank-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px -12px rgba(15,23,42,.18);border-color:var(--accent)}\
        .lsx-bank-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),#ec4899)}\
        .lsx-bank-card .bk-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;margin-bottom:4px}\
        .lsx-bank-card .bk-meta{font-size:11.5px;color:var(--text-4);margin-bottom:16px;line-height:1.55}\
        .lsx-tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px 0;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);margin-bottom:12px}\
        .lsx-tri .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-4)}\
        .lsx-tri .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}\
        .lsx-tri .v.primary{color:var(--accent-text);font-size:16px}\
        .lsx-proj{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:10px;border-top:1px dashed var(--border)}\
        .lsx-proj .pi{text-align:center}\
        .lsx-proj .pl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-4)}\
        .lsx-proj .pv{font-size:12px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}\
        .lsx-proj .pv.neg{color:var(--red)}\
        .lsx-book-card{padding:18px 20px;border:1px solid var(--border);border-radius:14px;background:var(--surface);margin-bottom:12px}\
        .lsx-book-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:10px;padding:12px 0;margin:12px 0;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border)}\
        .lsx-book-stats .bs{text-align:center}\
        .lsx-book-stats .bv{font-size:17px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}\
        .lsx-book-stats .bl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-4);margin-top:3px}\
        .lsx-custody{padding:5px 11px;border-radius:9999px;background:var(--surface-3);color:var(--text-2);font-size:11.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px}\
        .lsx-custody:hover{background:var(--accent-soft);color:var(--accent-text)}\
        .lsx-leaf{padding:8px 6px;border-radius:6px;font-size:11.5px;text-align:center;font-family:var(--mono);border:1px solid transparent;cursor:pointer;user-select:none}\
        .lsx-leaf:hover{transform:scale(1.08);box-shadow:0 2px 6px rgba(0,0,0,.08)}\
        .lsx-leaf.Available{background:var(--green-soft);color:var(--green);border-color:var(--green)}\
        .lsx-leaf.Issued{background:#dbeafe;color:#1e40af;border-color:#93c5fd}\
        .lsx-leaf.Presented{background:#ede9fe;color:#6b21a8;border-color:#c4b5fd}\
        .lsx-leaf.Cleared{background:#e8faf7;color:#0f766e;border-color:#5eead4}\
        .lsx-leaf.Bounced{background:var(--red-soft);color:var(--red);border-color:var(--red)}\
        .lsx-leaf.Stopped{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}\
        .lsx-leaf.Dead{background:var(--surface-3);color:var(--text-4);text-decoration:line-through;opacity:.7}\
        .lsx-leaf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:5px}\
        .lsx-alert{background:var(--accent-soft);color:var(--accent-text);padding:14px 16px;border-radius:10px;font-size:12.5px;line-height:1.7;margin-bottom:16px}\
      ';
      document.head.appendChild(style);
    })();

    /* ─────────────────────────────────────────────────────────────
       NAV ITEMS
    ───────────────────────────────────────────────────────────── */
    /* Remove any accidental duplicates first */
    v16.NAV_ITEMS = v16.NAV_ITEMS.filter(function(g){
      return g.group !== 'Cheques';
    });

    /* Insert "Cheques" group right after the "Main" group (Dashboard) */
    v16.NAV_ITEMS.splice(1, 0, {
      group: 'Cheques',
      items: [
        { id: 'bankAccounts', ico: '🏛️', label: 'Bank Accounts' },
        { id: 'chequeBooks',  ico: '📚', label: 'Cheque Books' },
        { id: 'chequeLeaves', ico: '🎯', label: 'Cheque Leaves' }
      ]
    });

    v16.PAGE_TITLES.bankAccounts  = 'Bank Accounts';
    v16.PAGE_TITLES.chequeBooks   = 'Cheque Books';
    v16.PAGE_TITLES.chequeLeaves  = 'Cheque Leaves';

    /* ══════════════════════════════════════════════════════════════════
       VIEW: Bank Accounts
    ══════════════════════════════════════════════════════════════════ */
    v16.VIEWS.bankAccounts = function(){
      var banks = bankAccounts();

      var totalLedger = banks.reduce(function(a,b){ return a + bankLedgerBalance(b.id); }, 0);
      var totalAvail  = banks.reduce(function(a,b){ return a + bankAvailableBalance(b.id); }, 0);
      var totalBook   = banks.reduce(function(a,b){ return a + bankBookBalance(b.id); }, 0);
      var totalPending = banks.reduce(function(a,b){ return a + sum(bankPendingDeductions(b.id),'amount'); }, 0);

      var body = '';

      /* KPI strip */
      body += '<div class="kpi-strip">' +
        v16.kpi('Total Ledger',     money0(totalLedger),  banks.length + ' bank(s)') +
        v16.kpi('Total Available',  money0(totalAvail),   'Spendable now') +
        v16.kpi('Total Book',       money0(totalBook),    'Accounting balance') +
        v16.kpi('Unpresented',      money0(totalPending), 'Issued, not yet cleared') +
      '</div>';

      /* Bank cards or empty state */
      body += '<div class="card">' +
        '<div class="card-head">' +
          '<h3>🏛️ Bank Accounts (' + banks.length + ')</h3>' +
          '<button class="btn primary" data-lsx-action="bank-new">＋ Add Bank Account</button>' +
        '</div>';

      if (banks.length === 0) {
        body += '<div class="empty">' +
          '<span class="big">🏛️</span>' +
          'No bank accounts yet.<br>' +
          '<div class="muted small" style="margin:8px 0 16px">Add your first bank account to start tracking balances.</div>' +
          '<button class="btn primary" data-lsx-action="bank-new">＋ Add First Bank Account</button>' +
        '</div>';
      } else {
        body += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px">';
        banks.forEach(function(b){
          var ledger    = bankLedgerBalance(b.id);
          var avail     = bankAvailableBalance(b.id);
          var book      = bankBookBalance(b.id);
          var pending   = sum(bankPendingDeductions(b.id), 'amount');
          var proj7     = bankProjectedBalance(b.id, 7);
          var proj30    = bankProjectedBalance(b.id, 30);
          var proj60    = bankProjectedBalance(b.id, 60);
          var proj90    = bankProjectedBalance(b.id, 90);

          body += '<div class="lsx-bank-card" data-lsx-action="bank-open" data-id="' + esc(b.id) + '">' +
            '<div class="bk-name">' + bankLogo(b.bankName) + ' ' + esc(b.accountName || b.bankName) + '</div>' +
            '<div class="bk-meta">' +
              esc(b.bankName) +
              (b.accountNo ? ' · ' + esc(b.accountNo) : '') +
              (b.branch ? ' · ' + esc(b.branch) : '') +
              ' · ' + esc(b.accountType || 'Current') +
            '</div>' +
            '<div class="lsx-tri">' +
              '<div><div class="l">Ledger</div><div class="v primary">' + v16.money0(ledger) + '</div></div>' +
              '<div><div class="l">Available</div><div class="v">' + v16.money0(avail) + '</div></div>' +
              '<div><div class="l">Book</div><div class="v">' + v16.money0(book) + '</div></div>' +
            '</div>' +
            (pending > 0 ? '<div class="small muted" style="margin-bottom:10px">⏰ ' + money0(pending) + ' pending deduction' + (pending === 1 ? '' : 's') + '</div>' : '') +
            '<div class="lsx-proj">' +
              '<div class="pi"><div class="pl">7d</div><div class="pv' + (proj7 < 0 ? ' neg' : '') + '">' + v16.money0(proj7).replace(/^Rs\.\s*/, '') + '</div></div>' +
              '<div class="pi"><div class="pl">30d</div><div class="pv' + (proj30 < 0 ? ' neg' : '') + '">' + v16.money0(proj30).replace(/^Rs\.\s*/, '') + '</div></div>' +
              '<div class="pi"><div class="pl">60d</div><div class="pv' + (proj60 < 0 ? ' neg' : '') + '">' + v16.money0(proj60).replace(/^Rs\.\s*/, '') + '</div></div>' +
              '<div class="pi"><div class="pl">90d</div><div class="pv' + (proj90 < 0 ? ' neg' : '') + '">' + v16.money0(proj90).replace(/^Rs\.\s*/, '') + '</div></div>' +
            '</div>' +
          '</div>';
        });
        body += '</div>';
      }

      body += '</div>';
      return body;
    };

    /* ══════════════════════════════════════════════════════════════════
       Bank form (create / edit)
    ══════════════════════════════════════════════════════════════════ */
    function openBankForm(id){
      if (!v16.state.perms.write) { toast('Read-only role', 'error'); return; }
      var b = id ? bankAccounts().find(function(x){ return x.id === id; }) : null;

      var bodyHTML =
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
          v16.field('Account Name', 'lsx_bAccName', b ? (b.accountName || '') : '', { required: true, placeholder: 'e.g. Main Current, Payroll' }) +
          v16.selectField('Bank', 'lsx_bBankName', SL_BANKS.map(function(x){ return { value: x.name, label: x.name }; }), b ? b.bankName : '', { required: true, placeholder: '— Select bank —' }) +
          v16.field('Account Number', 'lsx_bAccNo', b ? (b.accountNo || '') : '', { placeholder: 'e.g. 1234567890' }) +
          v16.field('Branch', 'lsx_bBranch', b ? (b.branch || '') : '', { placeholder: 'e.g. Colombo 03' }) +
          v16.selectField('Account Type', 'lsx_bType', [
            { value: 'Current', label: 'Current' },
            { value: 'Savings', label: 'Savings' },
            { value: 'OD',      label: 'Overdraft' },
            { value: 'Other',   label: 'Other' }
          ], b ? (b.accountType || 'Current') : 'Current', { required: true }) +
          v16.field('Opening Balance', 'lsx_bOpening', b ? String(num(b.openingBalance)) : '0', { type: 'number', step: '0.01' }) +
          v16.field('Opening Date', 'lsx_bOpeningDate', b ? (b.openingDate || today()) : today(), { type: 'date' }) +
          v16.field('Overdraft Limit', 'lsx_bODLimit', b ? String(num(b.overdraftLimit)) : '0', { type: 'number', step: '0.01' }) +
          v16.field('OD Interest Rate (% p.a.)', 'lsx_bODRate', b ? String(num(b.overdraftRate)) : '0', { type: 'number', step: '0.01' }) +
        '</div>';

      openModal(b ? '✏️ Edit Bank Account' : '➕ Add Bank Account', bodyHTML, {
        width: 700,
        footer:
          (b && v16.state.perms.delete ? '<button class="btn danger" id="lsx_bDelete">Delete</button>' : '') +
          '<button class="btn" data-close-modal>Cancel</button>' +
          '<button class="btn primary" id="lsx_bSave">' + (b ? 'Update' : 'Create') + '</button>'
      });

      document.getElementById('lsx_bSave').onclick = function(){
        var data = {
          accountName:   document.getElementById('lsx_bAccName').value.trim(),
          bankName:      document.getElementById('lsx_bBankName').value.trim(),
          accountNo:     document.getElementById('lsx_bAccNo').value.trim(),
          branch:        document.getElementById('lsx_bBranch').value.trim(),
          accountType:   document.getElementById('lsx_bType').value,
          openingBalance: num(document.getElementById('lsx_bOpening').value),
          openingDate:   document.getElementById('lsx_bOpeningDate').value || today(),
          overdraftLimit: num(document.getElementById('lsx_bODLimit').value),
          overdraftRate:  num(document.getElementById('lsx_bODRate').value)
        };
        if (!data.accountName) { toast('Account name required', 'error'); return; }
        if (!data.bankName) { toast('Bank required', 'error'); return; }

        if (b) {
          Object.assign(b, data);
          b.updatedAt = nowISO();
          b.updatedBy = (v16.state.user && v16.state.user.email) || 'system';
          v16.markDirty('bankAccounts', b.id);
        } else {
          data.id = uid();
          data.createdAt = nowISO();
          data.createdBy = (v16.state.user && v16.state.user.email) || 'system';
          data.updatedAt = nowISO();
          data.updatedBy = data.createdBy;
          v16.state.data.bankAccounts.push(data);
          v16.markDirty('bankAccounts', data.id);
        }
        closeModal();
        toast(b ? 'Bank account updated' : 'Bank account created', 'success');
        v16.rerender();
      };

      if (b) {
        var delBtn = document.getElementById('lsx_bDelete');
        if (delBtn) delBtn.onclick = function(){ deleteBank(b.id); };
      }
    }

    function deleteBank(id){
      if (!v16.state.perms.delete) { toast('No delete permission', 'error'); return; }
      var b = bankAccounts().find(function(x){ return x.id === id; });
      if (!b) return;
      var txCount = bankTxs(id).length;
      if (txCount > 0 && !confirm('This account has ' + txCount + ' transaction(s).\nDelete anyway?')) return;
      if (txCount === 0 && !confirm('Delete "' + (b.accountName || b.bankName) + '"?')) return;

      v16.state.data.bankAccounts = v16.state.data.bankAccounts.filter(function(x){ return x.id !== id; });
      v16.markDeleted('bankAccounts', id);
      closeModal();
      toast('Bank account deleted', 'success');
      v16.rerender();
    }

    /* ══════════════════════════════════════════════════════════════════
       VIEW: Cheque Books
    ══════════════════════════════════════════════════════════════════ */
    v16.VIEWS.chequeBooks = function(){
      var books = arr(v16.state.data.chequeBooks);
      var leaves = arr(v16.state.data.chequeLeaves);

      var total     = leaves.length;
      var available = leaves.filter(function(l){ return l.status === 'Available'; }).length;
      var issued    = leaves.filter(function(l){ return l.status === 'Issued'; }).length;
      var used      = leaves.filter(function(l){ return ['Presented','Cleared','Bounced','Stopped','Dead'].indexOf(l.status) !== -1; }).length;

      var html = '';

      html += '<div class="kpi-strip">' +
        v16.kpi('Cheque Books',     books.length, 'Registered') +
        v16.kpi('Total Leaves',     total,        'Physical stock') +
        v16.kpi('Available',        available,    'Ready to issue') +
        v16.kpi('Issued / Used',    issued + ' / ' + used, '') +
      '</div>';

      html += '<div class="card">' +
        '<div class="card-head">' +
          '<h3>📚 Cheque Books (' + books.length + ')</h3>' +
          '<button class="btn primary" data-lsx-action="cbook-new">＋ Register Cheque Book</button>' +
        '</div>';

      if (bankAccounts().length === 0) {
        html += '<div class="empty"><span class="big">🏛️</span>' +
          'Add a bank account first.<br>' +
          '<button class="btn primary" style="margin-top:12px" data-lsx-action="bank-new">＋ Add Bank Account</button>' +
        '</div>';
      } else if (books.length === 0) {
        html += '<div class="empty"><span class="big">📚</span>' +
          'No cheque books registered yet.<br>' +
          '<div class="muted small" style="margin:8px 0 16px">Register your physical cheque books so every leaf is tracked.</div>' +
          '<button class="btn primary" data-lsx-action="cbook-new">＋ Register First Cheque Book</button>' +
        '</div>';
      } else {
        books.forEach(function(book){
          html += renderBookCard(book);
        });
      }

      html += '</div>';
      return html;
    };

    function renderBookCard(book){
      var bookLeaves = arr(v16.state.data.chequeLeaves)
        .filter(function(l){ return l.chequeBookId === book.id; })
        .sort(function(a,b){ return String(a.leafNo).localeCompare(String(b.leafNo)); });
      var bank = bankAccounts().find(function(x){ return x.id === book.bankAccountId; });

      var counts = {
        Available: bookLeaves.filter(function(l){ return l.status === 'Available'; }).length,
        Issued:    bookLeaves.filter(function(l){ return l.status === 'Issued'; }).length,
        Cleared:   bookLeaves.filter(function(l){ return l.status === 'Cleared'; }).length,
        Bounced:   bookLeaves.filter(function(l){ return l.status === 'Bounced'; }).length,
        Stopped:   bookLeaves.filter(function(l){ return l.status === 'Stopped'; }).length,
        Dead:      bookLeaves.filter(function(l){ return l.status === 'Dead'; }).length
      };

      var expanded = (v16.state.views._lsxExpandedBook === book.id);

      var html = '<div class="lsx-book-card">';

      html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">' +
        '<div style="flex:1;min-width:200px">' +
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">' +
            bankLogo(bank ? bank.bankName : '') +
            '<strong style="font-size:15px">Book ' + esc(book.bookNo || '—') + '</strong>' +
          '</div>' +
          '<div class="small muted">' +
            (bank ? esc(bank.accountName || bank.bankName) + ' · ' + esc(bank.bankName) : 'Bank missing') +
          '</div>' +
          '<div class="small" style="color:var(--text-4);margin-top:6px">' +
            'Range <strong class="mono">' + esc(String(book.startNo)) + ' – ' + esc(String(book.endNo)) + '</strong>' +
            ' · ' + bookLeaves.length + ' leaves' +
            ' · Received ' + dateFmt(book.receivedDate) +
          '</div>' +
        '</div>' +
        '<div class="lsx-custody" data-lsx-action="cbook-custody" data-id="' + esc(book.id) + '" title="Change custody">' +
          '👤 ' + esc(book.custodyHolder || 'Unassigned') +
        '</div>' +
      '</div>';

      html += '<div class="lsx-book-stats">' +
        '<div class="bs"><div class="bv" style="color:var(--green)">' + counts.Available + '</div><div class="bl">Available</div></div>' +
        '<div class="bs"><div class="bv" style="color:#1e40af">' + counts.Issued + '</div><div class="bl">Issued</div></div>' +
        '<div class="bs"><div class="bv" style="color:#0f766e">' + counts.Cleared + '</div><div class="bl">Cleared</div></div>' +
        '<div class="bs"><div class="bv" style="color:var(--red)">' + counts.Bounced + '</div><div class="bl">Bounced</div></div>' +
        (counts.Stopped ? '<div class="bs"><div class="bv" style="color:var(--amber)">' + counts.Stopped + '</div><div class="bl">Stopped</div></div>' : '') +
        (counts.Dead ? '<div class="bs"><div class="bv" style="color:var(--text-4)">' + counts.Dead + '</div><div class="bl">Dead</div></div>' : '') +
      '</div>';

      html += '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">' +
        '<button class="btn sm" data-lsx-action="cbook-expand" data-id="' + esc(book.id) + '">' +
          (expanded ? '▴ Hide Leaves' : '▾ View All Leaves') +
        '</button>' +
        '<div style="display:flex;gap:6px">' +
          '<button class="btn sm" data-lsx-action="cbook-edit" data-id="' + esc(book.id) + '">✏️ Edit</button>' +
          (v16.state.perms.delete ? '<button class="btn sm danger" data-lsx-action="cbook-delete" data-id="' + esc(book.id) + '">🗑</button>' : '') +
        '</div>' +
      '</div>';

      if (expanded) {
        html += '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">' +
          '<div class="small muted" style="margin-bottom:8px">Click any leaf for details</div>' +
          '<div class="lsx-leaf-grid">' +
          bookLeaves.map(function(l){
            return '<div class="lsx-leaf ' + l.status + '" title="' + esc(l.leafNo) + ' · ' + esc(l.status) + (l.payee ? ' · ' + esc(l.payee) : '') + '">' + esc(l.leafNo) + '</div>';
          }).join('') +
          '</div>' +
        '</div>';
      }

      html += '</div>';
      return html;
    }

    /* ══════════════════════════════════════════════════════════════════
       Cheque book form
    ══════════════════════════════════════════════════════════════════ */
    function openChequeBookForm(id){
      if (!v16.state.perms.write) { toast('Read-only role', 'error'); return; }
      var isEdit = !!id;
      var book = id ? arr(v16.state.data.chequeBooks).find(function(x){ return x.id === id; }) : null;

      if (!isEdit && bankAccounts().length === 0) {
        toast('Add a bank account first', 'error');
        return;
      }

      var bodyHTML =
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
          v16.selectField('Bank Account',
            'lsx_cbBank',
            bankAccounts().map(function(b){ return { value: b.id, label: (b.accountName || b.bankName) + ' — ' + b.bankName }; }),
            book ? book.bankAccountId : '',
            { required: !isEdit, placeholder: '— Select bank —' }) +
          v16.field('Book Number', 'lsx_cbBookNo', book ? (book.bookNo || '') : '', { placeholder: 'e.g. A0001' }) +
        '</div>' +
        '<div style="height:1px;background:var(--border);margin:18px 0"></div>' +
        '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin-bottom:12px">Leaf Range</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
          v16.field('Start Leaf No', 'lsx_cbStart', book ? book.startNo : '', { type: 'number', required: !isEdit, placeholder: 'e.g. 1000', disabled: isEdit }) +
          v16.field('End Leaf No', 'lsx_cbEnd', book ? book.endNo : '', { type: 'number', required: !isEdit, placeholder: 'e.g. 1050', disabled: isEdit }) +
        '</div>' +
        (isEdit ? '' : '<div id="lsx_cbRangeInfo" class="small muted" style="margin-top:8px">Enter the physical leaf numbers. Max 200 leaves per book.</div>') +
        '<div style="height:1px;background:var(--border);margin:18px 0"></div>' +
        '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin-bottom:12px">Custody & Receipt</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
          v16.field('Custody Holder', 'lsx_cbCustody', book ? (book.custodyHolder || 'Office') : 'Office', { placeholder: 'e.g. Office, Accountant, MD' }) +
          v16.field('Received Date', 'lsx_cbReceived', book ? book.receivedDate : today(), { type: 'date' }) +
        '</div>';

      openModal(isEdit ? '✏️ Edit Cheque Book' : '📚 Register New Cheque Book', bodyHTML, {
        width: 700,
        footer:
          '<button class="btn" data-close-modal>Cancel</button>' +
          '<button class="btn primary" id="lsx_cbSave">' + (isEdit ? 'Update' : 'Create Book + Generate Leaves') + '</button>'
      });

      if (!isEdit) {
        var s = document.getElementById('lsx_cbStart');
        var e = document.getElementById('lsx_cbEnd');
        var info = document.getElementById('lsx_cbRangeInfo');
        var update = function(){
          var sv = num(s.value), ev = num(e.value);
          if (sv && ev && ev >= sv) {
            info.innerHTML = '📚 Will generate <strong>' + (ev - sv + 1) + '</strong> leaves: <span class="mono">' +
              String(sv).padStart(4, '0') + '</span> → <span class="mono">' + String(ev).padStart(4, '0') + '</span>';
            info.style.color = 'var(--accent-text)';
          } else {
            info.textContent = 'Enter the physical leaf numbers. Max 200 leaves per book.';
            info.style.color = '';
          }
        };
        s.addEventListener('input', update);
        e.addEventListener('input', update);
      }

      document.getElementById('lsx_cbSave').onclick = function(){
        var bankId = isEdit ? book.bankAccountId : document.getElementById('lsx_cbBank').value;
        var bookNo = document.getElementById('lsx_cbBookNo').value.trim();
        var custody = document.getElementById('lsx_cbCustody').value.trim() || 'Office';
        var received = document.getElementById('lsx_cbReceived').value || today();

        if (!bankId) { toast('Select a bank account', 'error'); return; }
        var bank = bankAccounts().find(function(b){ return b.id === bankId; });
        if (!bank) { toast('Bank not found', 'error'); return; }

        if (isEdit) {
          book.bookNo = bookNo;
          book.custodyHolder = custody;
          book.receivedDate = received;
          book.updatedAt = nowISO();
          v16.markDirty('chequeBooks', book.id);
          closeModal();
          toast('Book updated', 'success');
          v16.rerender();
          return;
        }

        var startNo = num(document.getElementById('lsx_cbStart').value);
        var endNo   = num(document.getElementById('lsx_cbEnd').value);
        if (!startNo || !endNo) { toast('Enter start and end leaf numbers', 'error'); return; }
        if (endNo < startNo) { toast('End must be ≥ start', 'error'); return; }
        if ((endNo - startNo) > 200) { toast('Max 200 leaves per book', 'error'); return; }

        var bookId = uid();
        var newBook = {
          id: bookId,
          bankAccountId: bankId,
          bankName: bank.bankName,
          bookNo: bookNo,
          startNo: startNo,
          endNo: endNo,
          custodyHolder: custody,
          receivedDate: received,
          leafGenerated: false,
          createdAt: nowISO(),
          createdBy: (v16.state.user && v16.state.user.email) || 'system'
        };
        v16.state.data.chequeBooks.push(newBook);
        v16.markDirty('chequeBooks', bookId);

        /* Generate leaves */
        var created = 0;
        for (var i = startNo; i <= endNo; i++) {
          var leafNo = String(i).padStart(4, '0');
          var exists = arr(v16.state.data.chequeLeaves).find(function(l){
            return l.chequeBookId === bookId && l.leafNo === leafNo;
          });
          if (exists) continue;
          var leaf = {
            id: uid(),
            chequeBookId: bookId,
            bankAccountId: bankId,
            bankName: bank.bankName,
            bookNo: bookNo,
            leafNo: leafNo,
            status: 'Available',
            amount: 0,
            payee: '',
            notes: '',
            createdAt: nowISO()
          };
          v16.state.data.chequeLeaves.push(leaf);
          v16.markDirty('chequeLeaves', leaf.id);
          created++;
        }
        newBook.leafGenerated = true;
        v16.markDirty('chequeBooks', bookId);

        closeModal();
        toast('Book registered with ' + created + ' leaves', 'success');
        v16.rerender();
      };
    }

    function deleteChequeBook(id){
      if (!v16.state.perms.delete) { toast('No delete permission', 'error'); return; }
      var book = arr(v16.state.data.chequeBooks).find(function(x){ return x.id === id; });
      if (!book) return;
      var bookLeaves = arr(v16.state.data.chequeLeaves).filter(function(l){ return l.chequeBookId === id; });
      var used = bookLeaves.filter(function(l){
        return ['Available','Dead'].indexOf(l.status) === -1;
      });
      if (used.length > 0) {
        toast('Cannot delete — ' + used.length + ' leaf(ves) already used', 'error', 5000);
        return;
      }
      if (!confirm('Delete this cheque book and all ' + bookLeaves.length + ' leaves?')) return;

      /* Delete leaves then book */
      bookLeaves.forEach(function(l){
        v16.state.data.chequeLeaves = v16.state.data.chequeLeaves.filter(function(x){ return x.id !== l.id; });
        v16.markDeleted('chequeLeaves', l.id);
      });
      v16.state.data.chequeBooks = v16.state.data.chequeBooks.filter(function(x){ return x.id !== id; });
      v16.markDeleted('chequeBooks', id);

      closeModal();
      toast('Book deleted', 'success');
      v16.rerender();
    }

    /* ══════════════════════════════════════════════════════════════════
       VIEW: Cheque Leaves (all leaves across all books)
    ══════════════════════════════════════════════════════════════════ */
    v16.VIEWS.chequeLeaves = function(){
      var views = v16.state.views;
      if (!views.chequeLeaves) views.chequeLeaves = { q: '', bank: '', book: '', status: '' };
      var f = views.chequeLeaves;

      var rows = arr(v16.state.data.chequeLeaves).slice();
      if (f.bank)   rows = rows.filter(function(l){ return l.bankAccountId === f.bank; });
      if (f.book)   rows = rows.filter(function(l){ return l.chequeBookId === f.book; });
      if (f.status) rows = rows.filter(function(l){ return l.status === f.status; });
      if (f.q) {
        var q = f.q.toLowerCase();
        rows = rows.filter(function(l){
          return (l.leafNo || '').toLowerCase().indexOf(q) !== -1
            || (l.bookNo || '').toLowerCase().indexOf(q) !== -1
            || (l.payee || '').toLowerCase().indexOf(q) !== -1;
        });
      }
      rows.sort(function(a, b){
        if (a.bookNo !== b.bookNo) return String(a.bookNo).localeCompare(String(b.bookNo));
        return String(a.leafNo).localeCompare(String(b.leafNo));
      });

      var statuses = ['Available','Issued','Presented','Cleared','Bounced','Stopped','Dead'];
      var counts = {};
      statuses.forEach(function(s){
        counts[s] = arr(v16.state.data.chequeLeaves).filter(function(l){ return l.status === s; }).length;
      });

      var html = '';

      html += '<div class="kpi-strip">' +
        statuses.slice(0,4).map(function(s){
          return v16.kpi(s, counts[s], 'leaves');
        }).join('') +
      '</div>';

      html += '<div class="card">' +
        '<div class="card-head"><h3>🎯 Cheque Leaves (' + rows.length + ')</h3></div>' +
        '<div class="rpt-filter">' +
          '<label class="field">Search<input type="search" id="lsx_leavesQ" value="' + esc(f.q) + '" placeholder="Leaf, book, payee…"></label>' +
          '<label class="field">Bank<select id="lsx_leavesBank">' +
            '<option value="">All Banks</option>' +
            bankAccounts().map(function(b){
              return '<option value="' + b.id + '"' + (f.bank === b.id ? ' selected' : '') + '>' + esc(b.accountName || b.bankName) + '</option>';
            }).join('') +
          '</select></label>' +
          '<label class="field">Book<select id="lsx_leavesBook">' +
            '<option value="">All Books</option>' +
            arr(v16.state.data.chequeBooks)
              .filter(function(b){ return !f.bank || b.bankAccountId === f.bank; })
              .map(function(b){
                return '<option value="' + b.id + '"' + (f.book === b.id ? ' selected' : '') + '>Book ' + esc(b.bookNo) + '</option>';
              }).join('') +
          '</select></label>' +
          '<label class="field">Status<select id="lsx_leavesStatus">' +
            '<option value="">All Status</option>' +
            statuses.map(function(s){
              return '<option value="' + s + '"' + (f.status === s ? ' selected' : '') + '>' + s + ' (' + counts[s] + ')</option>';
            }).join('') +
          '</select></label>' +
        '</div>';

      if (rows.length) {
        html += '<div class="table-wrap"><table>' +
          '<thead><tr><th>Leaf</th><th>Book</th><th>Bank</th><th>Status</th><th>Payee</th><th class="num">Amount</th><th>Due</th></tr></thead>' +
          '<tbody>' +
          rows.map(function(l){
            var bank = bankAccounts().find(function(b){ return b.id === l.bankAccountId; });
            return '<tr>' +
              '<td class="mono"><strong>' + esc(l.leafNo) + '</strong></td>' +
              '<td class="mono">' + esc(l.bookNo || '—') + '</td>' +
              '<td>' + (bank ? bankLogo(bank.bankName) + ' ' + esc(bank.accountName || bank.bankName) : '—') + '</td>' +
              '<td><span class="lsx-leaf ' + l.status + '" style="display:inline-block;cursor:default">' + esc(l.status) + '</span></td>' +
              '<td>' + esc(l.payee || '—') + '</td>' +
              '<td class="num">' + (num(l.amount) ? money(l.amount) : '—') + '</td>' +
              '<td>' + (l.dueDate ? dateFmt(l.dueDate) : '—') + '</td>' +
            '</tr>';
          }).join('') +
          '</tbody></table></div>';
      } else {
        html += '<div class="empty"><span class="big">🎯</span>No leaves match your filters</div>';
      }

      html += '</div>';
      return html;
    };

    /* Bind filters after render (called from the global click handler in v16) */
    function bindChequeLeavesFilters(){
      var q = document.getElementById('lsx_leavesQ');
      var bank = document.getElementById('lsx_leavesBank');
      var book = document.getElementById('lsx_leavesBook');
      var status = document.getElementById('lsx_leavesStatus');
      if (q) q.oninput = function(){
        clearTimeout(q._t);
        q._t = setTimeout(function(){
          v16.state.views.chequeLeaves.q = q.value;
          v16.rerender();
        }, 250);
      };
      if (bank) bank.onchange = function(){
        v16.state.views.chequeLeaves.bank = bank.value;
        v16.state.views.chequeLeaves.book = '';
        v16.rerender();
      };
      if (book) book.onchange = function(){
        v16.state.views.chequeLeaves.book = book.value;
        v16.rerender();
      };
      if (status) status.onchange = function(){
        v16.state.views.chequeLeaves.status = status.value;
        v16.rerender();
      };
    }

    /* ══════════════════════════════════════════════════════════════════
       Global action handler for extension buttons
    ══════════════════════════════════════════════════════════════════ */
    document.addEventListener('click', function(e){
      var el = e.target.closest('[data-lsx-action]');
      if (!el) return;
      var action = el.dataset.lsxAction;
      var id = el.dataset.id;

      var handlers = {
        'bank-new':      function(){ openBankForm(null); },
        'bank-open':     function(){ openBankForm(id); },
        'bank-edit':     function(ev){ ev.stopPropagation(); openBankForm(id); },
        'bank-delete':   function(ev){ ev.stopPropagation(); deleteBank(id); },

        'cbook-new':     function(){ openChequeBookForm(null); },
        'cbook-edit':    function(ev){ ev.stopPropagation(); openChequeBookForm(id); },
        'cbook-delete':  function(ev){ ev.stopPropagation(); deleteChequeBook(id); },
        'cbook-expand':  function(ev){
          ev.stopPropagation();
          v16.state.views._lsxExpandedBook = (v16.state.views._lsxExpandedBook === id) ? null : id;
          v16.rerender();
        },
        'cbook-custody': function(ev){
          ev.stopPropagation();
          var book = arr(v16.state.data.chequeBooks).find(function(x){ return x.id === id; });
          if (!book) return;
          var v = prompt('Custody holder for Book ' + book.bookNo + ':', book.custodyHolder || '');
          if (v === null) return;
          book.custodyHolder = v.trim() || 'Office';
          v16.markDirty('chequeBooks', id);
          v16.rerender();
        }
      };

      if (handlers[action]) { e.preventDefault(); handlers[action](e); }
    });

    /* Patch renderApp to bind dynamic inputs after every render */
    var originalRenderApp = window.renderApp;
    if (originalRenderApp && !originalRenderApp.__lsxPatched) {
      window.renderApp = function(){
        originalRenderApp.apply(this, arguments);
        try { bindChequeLeavesFilters(); } catch(e){}
      };
      window.renderApp.__lsxPatched = true;
    }

    console.log('[Cheque Extension Part 1] Banks, Books, Leaves registered ✓');
  });
})();
</script>
<!-- ═══════════════════════════════════════════════════════════════════
     CHEQUE EXTENSION FOR LANKA SHOE v16 — PART 2
     Issue Cheque · Check-In Popup · Clear/Bounce/Stop · Own Cheques view
     ═══════════════════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';

  function whenReady(fn){
    if (window.__v16 && window.__v16.VIEWS && window.LSX) { fn(); return; }
    var tries = 0;
    var iv = setInterval(function(){
      tries++;
      if (window.__v16 && window.__v16.VIEWS && window.LSX) { clearInterval(iv); fn(); }
      if (tries > 250) clearInterval(iv);
    }, 200);
  }

  whenReady(function(){
    if (window.__lsxPart2) return;
    window.__lsxPart2 = true;

    var v16 = window.__v16;
    var LSX = window.LSX;
    var num = v16.num, arr = v16.arr, sum = v16.sum, uniq = v16.uniq;
    var money = v16.money, money0 = v16.money0, esc = v16.esc;
    var today = v16.today, shiftDate = v16.shiftDate;
    var diffDays = v16.diffDays, dateFmt = v16.dateFmt, dateTimeFmt = v16.dateTimeFmt;
    var nowISO = v16.nowISO, uid = v16.uid;
    var toast = v16.toast, openModal = v16.openModal, closeModal = v16.closeModal;

    /* ─────────────────────────────────────────────────────────────
       Bounce reasons master list — seed once
    ───────────────────────────────────────────────────────────── */
    function seedBounceReasons(){
      if (arr(v16.state.data.bounceReasons).length > 0) return;
      var list = [
        ['insufficient_funds','Insufficient funds','Funds'],
        ['exceeds_arrangements','Exceeds arrangements','Funds'],
        ['effects_not_cleared','Effects not cleared','Funds'],
        ['refer_to_drawer','Refer to drawer','Funds'],
        ['payment_stopped','Payment stopped by drawer','Instruction'],
        ['drawer_deceased','Drawer deceased','Legal'],
        ['drawer_bankrupt','Drawer bankrupt','Legal'],
        ['account_closed','Account closed','Account'],
        ['account_transferred','Account transferred','Account'],
        ['account_dormant','Account dormant','Account'],
        ['signature_differs','Signature differs','Signature'],
        ['signature_missing','Signature missing','Signature'],
        ['alt_require_signature','Alterations require signature','Signature'],
        ['mutilated','Cheque mutilated','Physical'],
        ['post_dated','Post-dated','Date'],
        ['stale','Stale cheque (expired)','Date'],
        ['date_missing','Date missing','Date'],
        ['words_figures_differ','Words and figures differ','Amount'],
        ['amount_missing','Amount missing','Amount'],
        ['amount_in_words_missing','Amount in words missing','Amount'],
        ['not_drawn_on_us','Not drawn on us','Bank'],
        ['bank_stamp_missing','Bank stamp missing','Bank'],
        ['crossed_counter','Crossed cheque at counter','Bank'],
        ['reported_lost','Cheque reported lost','Bank'],
        ['reported_stolen','Cheque reported stolen','Bank'],
        ['items_in_collection','Items in course of collection','Funds'],
        ['currency_mismatch','Currency mismatch','Bank'],
        ['out_of_date_range','Out of date range','Bank'],
        ['reversal_entry','Retro entry / Reversal','Bank'],
        ['other','Other','Bank']

    function getAvailableLeaves(){
      return arr(v16.state.data.chequeLeaves)
        .filter(function(l){ return l.status === 'Available'; })
        .sort(function(a, b){
          var bk = String(a.bookNo || '').localeCompare(String(b.bookNo || ''));
          if (bk !== 0) return bk;
          return String(a.leafNo).localeCompare(String(b.leafNo));
        });
    }

    function chequeLinkedBankTxn(leafId){
      return arr(v16.state.data.bankTransactions).find(function(t){
        return t.chequeId === leafId && t.type === 'cheque_issued';
      });
    }

    function chequesNeedingCheckIn(){
      var t = today();
      var snooze = (v16.state.views.chequeSnooze || {});
      return arr(v16.state.data.chequeLeaves)
        .filter(function(l){
          if (l.status !== 'Issued') return false;
          if (!l.dueDate) return false;
          if (l.dueDate > t) return false;
          if (snooze[l.id] && snooze[l.id] > t) return false;
          return true;
        })
        .sort(function(a, b){ return a.dueDate < b.dueDate ? -1 : 1; });
    }

    LSX.getAvailableLeaves = getAvailableLeaves;
    LSX.chequeLinkedBankTxn = chequeLinkedBankTxn;
    LSX.chequesNeedingCheckIn = chequesNeedingCheckIn;

    /* Amount in words (Sri Lankan numbering) */
    var ONES = ['','one','two','three','four','five','six','seven','eight','nine','ten',
                'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
    var TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
    function _3(n){
      n = Math.floor(n);
      if (n < 20) return ONES[n];
      if (n < 100) return TENS[Math.floor(n/10)] + (n%10 ? ' ' + ONES[n%10] : '');
      return ONES[Math.floor(n/100)] + ' hundred' + (n%100 ? ' ' + _3(n%100) : '');
    }
    function amountInWords(a){
      var v = Math.round(num(a) * 100) / 100;
      if (v === 0) return 'zero rupees only';
      var r = Math.floor(v), c = Math.round((v - r) * 100);
      var parts = [];
      var cr = Math.floor(r / 10000000);
      var l  = Math.floor((r % 10000000) / 100000);
      var th = Math.floor((r % 100000) / 1000);
      var hu = r % 1000;
      if (cr) parts.push(_3(cr) + ' crore');
      if (l)  parts.push(_3(l) + ' lakh');
      if (th) parts.push(_3(th) + ' thousand');
      if (hu) parts.push(_3(hu));
      var out = parts.join(' ') + ' rupees';
      if (c) out += ' and ' + _3(c) + ' cents';
      return out + ' only';
    }
    LSX.amountInWords = amountInWords;

    function saveIssueCheque(form){
      if (!v16.state.perms.write) { toast('Read-only role', 'error'); return; }

      var leafId   = form.querySelector('[name="icLeaf"]').value;
      var payee    = form.querySelector('[name="icPayee"]').value.trim();
      var amount   = num(form.querySelector('[name="icAmount"]').value);
      var issueD   = form.querySelector('[name="icIssueDate"]').value || today();
      var dueD     = form.querySelector('[name="icDueDate"]').value;
      var notes    = form.querySelector('[name="icNotes"]').value.trim();

      if (!leafId) { toast('Select a leaf', 'error'); return; }
      if (!payee) { toast('Payee required', 'error'); return; }
      if (amount <= 0) { toast('Valid amount required', 'error'); return; }
      if (!dueD) { toast('Due date required', 'error'); return; }
      if (dueD < issueD) { toast('Due date cannot be before issue date', 'error'); return; }

      var leaf = arr(v16.state.data.chequeLeaves).find(function(x){ return x.id === leafId; });
      if (!leaf) { toast('Leaf not found', 'error'); return; }
      if (leaf.status !== 'Available') { toast('Leaf is not Available', 'error'); return; }

      var bank = LSX.bankAccounts().find(function(b){ return b.id === leaf.bankAccountId; });
      if (bank) {
        var avail = LSX.bankAvailableBalance(bank.id);
        if (avail - amount < 0) {
          var odLimit = num(bank.overdraftLimit);
          if (odLimit === 0) {
            if (!confirm('⚠️ Insufficient funds\n\nAvailable: ' + money0(avail) + '\nAfter this cheque: ' + money0(avail - amount) + ' (OVERDRAFT)\n\nProceed?')) return;
          } else if (Math.abs(avail - amount) > odLimit) {
            if (!confirm('⚠️ Exceeds OD limit of ' + money0(odLimit) + '\n\nProceed?')) return;
          }
        }
      }

      /* Update leaf */
      leaf.status = 'Issued';
      leaf.issuedDate = issueD;
      leaf.dueDate = dueD;
      leaf.amount = amount;
      leaf.payee = payee;
      if (notes) leaf.notes = notes;
      leaf.updatedAt = nowISO();
      v16.markDirty('chequeLeaves', leaf.id);

      /* Create pending bank transaction */
      var txn = {
        id: uid(),
        bankAccountId: leaf.bankAccountId,
        date: dueD,
        issueDate: issueD,
        type: 'cheque_issued',
        amount: amount,
        reference: 'Leaf ' + leaf.leafNo,
        chequeId: leaf.id,
        description: 'Cheque to ' + payee,
        status: 'pending',
        createdAt: nowISO(),
        createdBy: (v16.state.user && v16.state.user.email) || 'system'
      };
      v16.state.data.bankTransactions.push(txn);
      v16.markDirty('bankTransactions', txn.id);

      /* Version history */
      if (v16.recordVersion) {
        v16.recordVersion('chequeLeaves', leaf.id, 'issue', null, { payee: payee, amount: amount, dueDate: dueD });
      }

      closeModal();
      toast('✅ Cheque issued — Leaf ' + leaf.leafNo, 'success');
      v16.rerender();
    }

    function confirmBounceCheque(leafId){
      var l = arr(v16.state.data.chequeLeaves).find(function(x){ return x.id === leafId; });
      if (!l) return;

      var bouncedDate = document.getElementById('lsx_bncDate').value || today();
      var reason = document.getElementById('lsx_bncReason').value;
      var charge = num(document.getElementById('lsx_bncCharge').value);
      var notes = document.querySelector('#lsx_bounceForm [name="bncNotes"]').value.trim();
      var decision = document.getElementById('lsx_bncDecision').value;

      if (!reason) { toast('Select return reason', 'error'); return; }

      var origAmount = num(l.amount);
      var origPayee = l.payee;

      l.status = 'Bounced';
      l.bouncedDate = bouncedDate;
      l.bankReturnReason = reason;
      if (notes) l.bounceNotes = notes;
      l.updatedAt = nowISO();
      v16.markDirty('chequeLeaves', leafId);

      var txn = chequeLinkedBankTxn(leafId);
      if (txn) {
        txn.status = 'bounced';
        txn.bouncedDate = bouncedDate;
        txn.reason = reason;
        v16.markDirty('bankTransactions', txn.id);
      }

      if (charge > 0) {
        var feeTxn = {
          id: uid(),
          bankAccountId: l.bankAccountId,
          date: bouncedDate,
          type: 'bank_charge',
          amount: charge,
          reference: 'Leaf ' + l.leafNo,
          chequeId: l.id,
          category: 'cheque_return_fee',
          description: 'Returned cheque fee — ' + reason,
          status: 'completed',
          createdAt: nowISO()
        };
        v16.state.data.bankTransactions.push(feeTxn);
        v16.markDirty('bankTransactions', feeTxn.id);
      }

      if (decision === 'dead') {
        l.status = 'Dead';
        l.deadReason = 'Bounced — ' + reason;
        l.deadAt = bouncedDate;
        v16.markDirty('chequeLeaves', leafId);
      } else if (decision === 'reuse') {
        l.status = 'Available';
        delete l.bouncedDate;
        delete l.bankReturnReason;
        delete l.bounceNotes;
        l.payee = '';
        l.amount = 0;
        l.dueDate = null;
        l.issuedDate = null;
        l.notes = '';
        v16.markDirty('chequeLeaves', leafId);
        toast('Leaf restored to Available', 'info');
      }

      if (v16.recordVersion) {
        v16.recordVersion('chequeLeaves', leafId, 'bounce', null, {
          reason: reason,
          amount: origAmount,
          decision: decision
        });
      }

      closeModal();
      toast('❌ Cheque bounced', 'warn');
      v16.rerender();
    }

    /* ═══════════════════════════════════════════════════════════════

    ═══════════════════════════════════════════════════════════════ */
    v16.VIEWS.ownCheques = function(){
      var views = v16.state.views;
      if (!views.own) views.own = { tab: 'register', filter: 'all', calMonth: null };
      var tab = views.own.tab || 'register';

      var needs = chequesNeedingCheckIn();
      var t = today();
      var allIssued = arr(v16.state.data.chequeLeaves).filter(function(l){
        return ['Issued','Presented','Cleared','Bounced','Stopped'].indexOf(l.status) !== -1;
      });
      var dueSoon = arr(v16.state.data.chequeLeaves).filter(function(l){
        return l.status === 'Issued' && l.dueDate && l.dueDate >= t && diffDays(t, l.dueDate) <= 7;
      }).sort(function(a, b){ return a.dueDate < b.dueDate ? -1 : 1; });
      var upcoming30 = arr(v16.state.data.chequeLeaves).filter(function(l){
        return l.status === 'Issued' && l.dueDate && diffDays(t, l.dueDate) >= 0 && diffDays(t, l.dueDate) <= 30;
      });
      var totals = {
        issued: sum(arr(v16.state.data.chequeLeaves).filter(function(l){ return l.status === 'Issued'; }), 'amount'),
        issuedCount: arr(v16.state.data.chequeLeaves).filter(function(l){ return l.status === 'Issued'; }).length,
        dueSoon: sum(dueSoon, 'amount'),
        upcoming30: sum(upcoming30, 'amount'),
        cleared: sum(arr(v16.state.data.chequeLeaves).filter(function(l){ return l.status === 'Cleared'; }), 'amount')
      };

      var html = '';

      /* Check-in banner */
      if (needs.length > 0) {
        html += '<div class="lsx-checkin-banner" data-lsx-action="checkin-open">' +
          '<div class="cb-icon">🔔</div>' +
          '<div class="cb-body">' +
            '<div class="cb-title">' + needs.length + ' cheque' + (needs.length === 1 ? '' : 's') + ' need your attention</div>' +
            '<div class="cb-desc">Total: ' + money(sum(needs, 'amount')) + ' · Earliest: ' + dateFmt(needs[0].dueDate) + '</div>' +
          '</div>' +
          '<button class="cb-btn">Open Check-In →</button>' +
        '</div>';
      }

      /* KPI strip */
      html += '<div class="kpi-strip">' +
        v16.kpi('Currently Issued', money0(totals.issued), totals.issuedCount + ' cheques') +
        v16.kpi('Due This Week', money0(totals.dueSoon), dueSoon.length + ' cheques') +
        v16.kpi('Next 30 Days', money0(totals.upcoming30), upcoming30.length + ' cheques') +
        v16.kpi('Cleared Total', money0(totals.cleared), 'Lifetime') +
      '</div>';

      /* Main card */
      html += '<div class="card">' +
        '<div class="card-head">' +
          '<h3>🎯 Own Cheques</h3>' +
          '<button class="btn primary" data-lsx-action="cheque-new">＋ Issue Cheque</button>' +
        '</div>' +
        '<div class="lsx-tabs">' +
          '<div class="lsx-tab ' + (tab === 'register' ? 'active' : '') + '" data-lsx-tab="register">📋 Register</div>' +
          '<div class="lsx-tab ' + (tab === 'calendar' ? 'active' : '') + '" data-lsx-tab="calendar">🗓 Calendar</div>' +
          '<div class="lsx-tab ' + (tab === 'due' ? 'active' : '') + '" data-lsx-tab="due">⏰ Due Soon</div>' +
        '</div>';

      if (tab === 'calendar') html += ownCalendarView();
      else if (tab === 'due') html += ownDueSoonView(dueSoon);
      else html += ownRegisterView(allIssued);

      html += '</div>';
      return html;
    };

    function ownRegisterView(issued){
      var views = v16.state.views;
      if (!views.own) views.own = { filter: 'all' };
      var f = views.own.filter || 'all';

      var rows = issued.slice();
      if (f === 'issued')  rows = rows.filter(function(l){ return l.status === 'Issued'; });
      if (f === 'cleared') rows = rows.filter(function(l){ return l.status === 'Cleared'; });
      if (f === 'bounced') rows = rows.filter(function(l){ return l.status === 'Bounced'; });
      if (f === 'stopped') rows = rows.filter(function(l){ return l.status === 'Stopped'; });

      rows.sort(function(a, b){
        if (a.status === 'Issued' && b.status !== 'Issued') return -1;
        if (b.status === 'Issued' && a.status !== 'Issued') return 1;
        return (b.issuedDate || '') < (a.issuedDate || '') ? -1 : 1;
      });

      var filters = [
        { k: 'all',     l: 'All',     c: issued.length },
        { k: 'issued',  l: 'Issued',  c: issued.filter(function(x){ return x.status === 'Issued'; }).length },
        { k: 'cleared', l: 'Cleared', c: issued.filter(function(x){ return x.status === 'Cleared'; }).length },
        { k: 'bounced', l: 'Bounced', c: issued.filter(function(x){ return x.status === 'Bounced'; }).length },
        { k: 'stopped', l: 'Stopped', c: issued.filter(function(x){ return x.status === 'Stopped'; }).length }
      ];

      var html = '<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">';
      filters.forEach(function(fi){
        html += '<button class="btn sm ' + (f === fi.k ? 'primary' : '') + '" data-lsx-filter="' + fi.k + '">' +
          fi.l + ' (' + fi.c + ')</button>';
      });
      html += '</div>';

      if (rows.length === 0) {
        html += '<div class="empty"><span class="big">🎯</span>No cheques to show<br>' +
          '<button class="btn primary" style="margin-top:12px" data-lsx-action="cheque-new">＋ Issue First Cheque</button></div>';
        return html;
      }

      html += '<div class="table-wrap"><table>' +
        '<thead><tr>' +
          '<th>Leaf</th><th>Bank</th><th>Payee</th><th class="num">Amount</th>' +
          '<th>Issued</th><th>Due</th><th>Status</th>' +
        '</tr></thead><tbody>';

      rows.forEach(function(l){
        var bank = LSX.bankAccounts().find(function(b){ return b.id === l.bankAccountId; });
        var t = today();
        var overdue = l.status === 'Issued' && l.dueDate && l.dueDate < t;
        html += '<tr>' +
          '<td class="mono"><strong>' + esc(l.leafNo) + '</strong> <span class="small muted">' + esc(l.bookNo || '') + '</span></td>' +
          '<td>' + (bank ? LSX.bankLogo(bank.bankName) + ' ' + esc(bank.accountName || bank.bankName) : '—') + '</td>' +
          '<td>' + esc(l.payee || '—') + '</td>' +
          '<td class="num"><strong>' + money0(l.amount) + '</strong></td>' +
          '<td>' + dateFmt(l.issuedDate) + '</td>' +
          '<td style="color:' + (overdue ? 'var(--red);font-weight:600' : 'inherit') + '">' +

    function analyzeCheque(ctx){
      var out = [];
      var t = today();
      var amount = num(ctx.amount);
      var payee = (ctx.payee || '').trim();
      var dueDate = ctx.dueDate || t;

          && l.bouncedDate

          level: 'critical', icon: '❌',
          text: similarBounces.length + ' bounced cheque(s) with similar amount (±5%)',
          detail: 'Recent: Leaf ' + similarBounces[0].leafNo + ' · ' + (similarBounces[0].payee || '') + ' · ' + (similarBounces[0].bankReturnReason || '—')
        });
      }
