  function openHolidayForm(id) {
    if (!state.perms.write) { toast('Read-only role', 'error'); return; }
    const h = id ? arr(state.data.holidays).find(x => x.id === id) : null;

    const body =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
        field('Date', 'holDate', h?.date || today(), { type: 'date', req: true }) +
        selectField('Type', 'holType',
          Object.keys(HOLIDAY_TYPES).map(k => ({
            value: k,
            label: HOLIDAY_TYPES[k].ico + ' ' + HOLIDAY_TYPES[k].label
          })),
          h?.type || 'public', { req: true }) +
      '</div>' +
      '<div style="margin-top:14px">' +
        field('Name', 'holName', h?.name || '', { req: true, placeholder: 'e.g. Vesak Full Moon Poya' }) +
      '</div>' +
      '<div style="margin-top:14px">' +
        field('Notes', 'holNotes', h?.notes || '', { type: 'textarea' }) +
      '</div>';

    openModal(h ? '✏️ Edit Holiday' : '＋ New Holiday', body, {
      width: 620,
      footer:
        '<button class="btn" data-close-modal>Cancel</button>' +
        '<button class="btn primary" id="holSaveBtn">' + (h ? 'Update' : 'Create') + '</button>'
    });

    document.getElementById('holSaveBtn').onclick = () => {
      const data = {
        date: document.getElementById('holDate').value,
        name: document.getElementById('holName').value.trim(),
        type: document.getElementById('holType').value,
        notes: document.getElementById('holNotes').value.trim()
      };
      if (!data.date) { toast('Date is required', 'error'); return; }
      if (!data.name) { toast('Name is required', 'error'); return; }

      /* Duplicate check on create */
      if (!h) {
        const dupe = arr(state.data.holidays).find(x => x.date === data.date);
        if (dupe && !confirm('A holiday already exists on ' + dateFmt(data.date) + ' (' + dupe.name + ').\nAdd another?')) return;
      }

      if (h) {
        Object.assign(h, data);
        h.updatedAt = nowISO();
        h.updatedBy = state.user?.email || 'system';
        markDirty('holidays', h.id);
      } else {
        const created = makeHoliday(Object.assign({}, data, { source: 'manual' }));
        state.data.holidays.push(created);
        markDirty('holidays', created.id);
      }
      closeModal();
      toast(h ? 'Holiday updated' : 'Holiday created', 'success');
      renderApp();
    };
  }
  window.openHolidayForm = openHolidayForm;

  function deleteHolidayById(id) {
    if (!state.perms.delete) { toast('No delete permission', 'error'); return; }
    const h = arr(state.data.holidays).find(x => x.id === id);
    if (!h) return;
    if (!confirm('Delete holiday "' + h.name + '" on ' + dateFmt(h.date) + '?')) return;

    state.data.holidays = state.data.holidays.filter(x => x.id !== id);
    _dirty.add('holidays:' + id);
    delete _snapshot['holidays:' + id];
    scheduleSync();

    closeModal();
    toast('Holiday deleted', 'success');
    renderApp();
  }

  /* ═══════════════════════════════════════════════════════════════════════
     13. Re-seed built-in holidays
     ═══════════════════════════════════════════════════════════════════════ */
  async function reseedBuiltInHolidays() {
    if (!state.perms.write) { toast('Read-only role', 'error'); return; }
    if (!confirm('Re-seed all built-in holidays (2025–2027)?\n\n' +
      'Existing holidays will NOT be removed. Missing ones will be added.')) return;

    let inserted = 0;
    BUILTIN_HOLIDAYS.forEach(h => {
      if (arr(state.data.holidays).some(x => x.date === h.date && x.name === h.name)) return;
      const holiday = makeHoliday({
        date: h.date,
        name: h.name,
        type: h.type,
        source: 'builtin'
      });
      state.data.holidays.push(holiday);
      markDirty('holidays', holiday.id);
      inserted++;
    });
    toast(inserted ? 'Added ' + inserted + ' holidays' : 'All built-in holidays already present', inserted ? 'success' : 'info');
    renderApp();
  }
  window.reseedBuiltInHolidays = reseedBuiltInHolidays;

  /* ═══════════════════════════════════════════════════════════════════════
     14. IMPORT / EXPORT holidays as JSON
     ═══════════════════════════════════════════════════════════════════════ */
  function exportHolidaysJSON() {
    const data = arr(state.data.holidays).map(h => ({
      date: h.date, name: h.name, type: h.type, notes: h.notes || ''
    }));
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'holidays_' + today() + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 500);
    toast('Holidays exported', 'success');
  }
  window.exportHolidaysJSON = exportHolidaysJSON;

  function importHolidaysJSON() {
    if (!state.perms.write) { toast('Read-only role', 'error'); return; }

    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result || '[]'));
          if (!Array.isArray(data)) { toast('Invalid JSON — expected an array', 'error'); return; }
          let inserted = 0, skipped = 0;
          data.forEach(h => {
            if (!h.date || !h.name) { skipped++; return; }
            if (arr(state.data.holidays).some(x => x.date === h.date && x.name === h.name)) { skipped++; return; }
            const holiday = makeHoliday({
              date: h.date,
              name: h.name,
              type: h.type || 'public',
              notes: h.notes || '',
              source: 'manual'
            });
            state.data.holidays.push(holiday);
            markDirty('holidays', holiday.id);
            inserted++;
          });
          toast('Imported ' + inserted + ' (skipped ' + skipped + ')', 'success');
          renderApp();
        } catch (e) {
          toast('Invalid JSON: ' + e.message, 'error');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }
  window.importHolidaysJSON = importHolidaysJSON;

  /* ═══════════════════════════════════════════════════════════════════════
     15. CHEQUE-FORM INTEGRATION — informational only
     ═══════════════════════════════════════════════════════════════════════

     We hook into the cheque date input inside the cheque form by:
     - Patching openChequeForm to add a live "non-working day" notice
     - When the field changes, we display a banner below the date field

     We do this by wrapping the cheque form after it opens.
     ═══════════════════════════════════════════════════════════════════════ */
  function attachHolidayNoticeToChequeForm() {
    const dateInput = document.getElementById('chqDate');
    if (!dateInput) return;

    /* Create a notice container if it doesn't exist */
    let notice = document.getElementById('chqHolidayNotice');
    if (!notice) {
      notice = document.createElement('div');
      notice.id = 'chqHolidayNotice';
      notice.style.marginTop = '10px';
      notice.style.padding = '10px 14px';
      notice.style.borderRadius = '10px';
      notice.style.fontSize = '12.5px';
      notice.style.lineHeight = '1.55';
      notice.style.display = 'none';
      dateInput.parentNode.appendChild(notice);
    }

    function refreshNotice() {
      const v = dateInput.value;
      const box = document.getElementById('chqHolidayNotice');
      if (!box) return;
      if (!v) { box.style.display = 'none'; return; }

      const isHolidayDay = isHoliday(v);
      const isWeekendDay = isWeekend(v);

      if (!isHolidayDay && !isWeekendDay) {
        box.style.display = 'none';
        return;
      }

      const h = holidayOn(v);
      const reason = h
        ? (h.type === 'poya' ? 'Full Moon Poya Day' : (h.type === 'bank' ? 'Bank holiday' : 'Public holiday'))
        : (isWeekendDay ? (new Date(v + 'T00:00:00').getDay() === 0 ? 'Sunday' : 'Saturday') : '');
      const nextWorking = nextWorkingDay(v, true);

      box.style.display = '';
      box.style.background = 'var(--accent-soft)';
      box.style.color = 'var(--accent-text)';
      box.style.border = '1px solid var(--accent)';
      box.innerHTML =
        '<strong>ℹ Heads up — ' + dateFmt(v) + '</strong><br>' +
        'This date is a <strong>' + esc(h ? h.name : reason) + '</strong>' +
        (h && h.type === 'poya' ? ' — banks are closed.' : ' — banks may be closed.') +
        '<br>Cheque will effectively clear on <strong>' + dateFmt(nextWorking) +
        '</strong> (next working day).' +
        '<div style="margin-top:6px;opacity:.75;font-size:11.5px">' +
          'ℹ This is informational only — you can still save the cheque on this date.' +
        '</div>';
    }

    /* Only attach once */
    if (dateInput.dataset.holidayAttached !== '1') {
      dateInput.dataset.holidayAttached = '1';
      dateInput.addEventListener('input', refreshNotice);
      dateInput.addEventListener('change', refreshNotice);
    }
    refreshNotice();
  }
  window.attachHolidayNoticeToChequeForm = attachHolidayNoticeToChequeForm;

  /* ═══════════════════════════════════════════════════════════════════════
     16. CHEQUE-DETAIL ENRICHMENT — show clearing-day note if holiday
     ═══════════════════════════════════════════════════════════════════════ */
  function chequeClearingNote(c) {
    if (!c || !c.chequeDate) return '';
    if (isWorkingDay(c.chequeDate)) return '';
    const h = holidayOn(c.chequeDate);
    const eff = nextWorkingDay(c.chequeDate, true);
    const reason = h
      ? (h.type === 'poya' ? h.name + ' (Poya)' : h.name)
      : (isWeekend(c.chequeDate) ? 'Weekend' : 'Non-working day');
    return '<div style="margin-top:10px;padding:10px 12px;background:var(--accent-soft);' +
      'color:var(--accent-text);border-radius:var(--r-md);font-size:12.5px">' +
      '<strong>ℹ Cheque date is ' + esc(reason) + '</strong><br>' +
      'Effective clearing date: <strong>' + dateFmt(eff) + '</strong>' +
    '</div>';
  }
  window.chequeClearingNote = chequeClearingNote;

  /* ═══════════════════════════════════════════════════════════════════════
     17. DASHBOARD WIDGET — 1-day-before reminder
     ═══════════════════════════════════════════════════════════════════════ */
  function renderTomorrowHolidayBanner() {
    const tomorrow = shiftDate(today(), 1);
    const h = holidayOn(tomorrow);
    if (!h) return '';

    /* Which cheques are scheduled for tomorrow? */
    const chequesTomorrow = arr(state.data.cheques)
      .filter(c => c.status === 'scheduled' && c.chequeDate === tomorrow);

    const eff = nextWorkingDay(tomorrow, true);
    const reasonLabel = h.type === 'poya' ? 'Full Moon Poya Day' : (h.type === 'bank' ? 'Bank holiday' : 'Public holiday');

    return '' +
      '<div class="card" style="background:linear-gradient(135deg,var(--accent-soft),var(--blue-soft));' +
        'border:1px solid var(--accent)">' +
        '<div style="display:flex;align-items:flex-start;gap:12px">' +
          '<div style="font-size:32px">' + (h.type === 'poya' ? '🌕' : '🎉') + '</div>' +
          '<div style="flex:1">' +
            '<div style="font-weight:700;font-size:14px">' +
              'Tomorrow is ' + esc(h.name) +
              ' <span class="badge purple" style="margin-left:6px">' + esc(reasonLabel) + '</span>' +
            '</div>' +
            '<div class="small" style="margin-top:6px;line-height:1.55">' +
              'Banks are closed tomorrow. ' +
              (chequesTomorrow.length
                ? 'You have <strong>' + chequesTomorrow.length + ' cheque' +
                    (chequesTomorrow.length > 1 ? 's' : '') + '</strong> scheduled for tomorrow (' +
                    money(chequesTomorrow.reduce((s, c) => s + num(c.amount), 0)) + '). ' +
                    'They will effectively clear on <strong>' + dateFmt(eff) + '</strong>.'
                : 'No cheques scheduled for tomorrow.') +
            '</div>' +
            (chequesTomorrow.length
              ? '<div style="margin-top:10px">' +
                  chequesTomorrow.slice(0, 4).map(c =>
                    '<div class="small" style="margin-bottom:2px">📝 #' + esc(c.chequeNo) +
                      ' — ' + esc(c.payeeName || '—') + ' — ' + money(c.amount) + '</div>'
                  ).join('') +
                  (chequesTomorrow.length > 4 ? '<div class="small muted">+ ' + (chequesTomorrow.length - 4) + ' more</div>' : '') +
                '</div>'
              : '') +
          '</div>' +
          '<button class="btn" data-nav="holidays">View calendar →</button>' +
        '</div>' +
      '</div>';
  }
  window.renderTomorrowHolidayBanner = renderTomorrowHolidayBanner;

  /* ═══════════════════════════════════════════════════════════════════════
     18. ACTION REGISTRATIONS
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_registerAction('holiday-new',    () => openHolidayForm(null));
  __LS_registerAction('holiday-edit',   (ev, id) => { ev.stopPropagation(); openHolidayForm(id); });
  __LS_registerAction('holiday-delete', (ev, id) => { ev.stopPropagation(); deleteHolidayById(id); });
  __LS_registerAction('holiday-reseed', () => reseedBuiltInHolidays());
  __LS_registerAction('holiday-export', () => exportHolidaysJSON());
  __LS_registerAction('holiday-import', () => importHolidaysJSON());

  __LS_registerAction('cal-prev', () => {
    const f = state.filters.calendar || {};
    const ym = f.ym || today().slice(0, 7);
    const [y, m] = ym.split('-').map(x => parseInt(x, 10));
    const prev = new Date(y, m - 2, 1);
    state.filters.calendar = Object.assign({}, f, {
      ym: prev.getFullYear() + '-' + String(prev.getMonth() + 1).padStart(2, '0')
    });
    renderApp();
  });
  __LS_registerAction('cal-next', () => {
    const f = state.filters.calendar || {};
    const ym = f.ym || today().slice(0, 7);
    const [y, m] = ym.split('-').map(x => parseInt(x, 10));
    const next = new Date(y, m, 1);
    state.filters.calendar = Object.assign({}, f, {
      ym: next.getFullYear() + '-' + String(next.getMonth() + 1).padStart(2, '0')
    });
    renderApp();
  });

  /* ═══════════════════════════════════════════════════════════════════════
     19. PATCH openChequeForm — call attachHolidayNoticeToChequeForm after form opens
     ═══════════════════════════════════════════════════════════════════════ */
  const origOpenChequeForm = window.openChequeForm;
  if (typeof origOpenChequeForm === 'function') {
    window.openChequeForm = function (id) {
      const r = origOpenChequeForm.apply(this, arguments);
      /* Attach after modal paints */
      setTimeout(() => {
        try { attachHolidayNoticeToChequeForm(); }
        catch (e) { dbg.warn('attachHolidayNotice: ' + e.message); }
      }, 0);
      return r;
    };
  }

  /* Also patch cheque detail modal to show clearing note */
  const origOpenChequeDetail = window.openChequeDetail;
  if (typeof origOpenChequeDetail === 'function') {
    window.openChequeDetail = function (id) {
      const r = origOpenChequeDetail.apply(this, arguments);
      setTimeout(() => {
        try {
          const bodyEl = document.querySelector('#modalWrap .modal-body');
          const c = chequeObj(id);
          if (bodyEl && c) {
            const note = chequeClearingNote(c);
            if (note) bodyEl.insertAdjacentHTML('afterbegin', note);
          }
        } catch (e) { dbg.warn('chequeClearingNote inject: ' + e.message); }
      }, 0);
      return r;
    };
  }

  /* ═══════════════════════════════════════════════════════════════════════
     20. PATCH DASHBOARD — insert tomorrow-holiday banner at top
     ═══════════════════════════════════════════════════════════════════════ */
  const prevDashboard = REGISTRY.routes.dashboard ? REGISTRY.routes.dashboard.fn : null;

  function renderDashboardWithHolidays() {
    const banner = renderTomorrowHolidayBanner();
    const base = prevDashboard ? prevDashboard() : '';
    return banner + base;
  }
  __LS_addRoute('dashboard', 'Dashboard', renderDashboardWithHolidays);

  /* ═══════════════════════════════════════════════════════════════════════
     21. ROUTES + NAV
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_addRoute('holidays', 'Sri Lankan Calendar', renderHolidays);
  __LS_addRoute('calendar', 'Month Calendar',       renderCalendarMonth);

  __LS_addNav({ group: 'Setup', id: 'holidays', ico: '📅', label: 'Sri Lankan Calendar' });
  __LS_addNav({ group: 'Setup', id: 'calendar', ico: '🗓️', label: 'Month Calendar' });

  /* ═══════════════════════════════════════════════════════════════════════
     22. INIT
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_register('S08', async function () {
    /* Seed built-in holidays if empty */
    try { await seedHolidaysIfEmpty(); }
    catch (e) { dbg.warn('seedHolidays: ' + e.message); }

    /* Try API refresh in background */
    try { await tryFetchHolidaysFromAPI(); }
    catch (e) { dbg.warn('tryFetchHolidays: ' + e.message); }

    /* Re-render so new holidays reflect */
    try { renderApp(); } catch (e) {}

    /* Patch bindView to add holiday filters */
    const prevBind = window.bindView;
    window.bindView = function () {
      try { if (prevBind) prevBind(); }
      catch (e) { dbg.warn('bindView previous threw: ' + e.message); }

      const hs = document.getElementById('holSearch');
      if (hs) hs.oninput = () => {
        clearTimeout(hs._t);
        hs._t = setTimeout(() => {
          state.filters.holidays = Object.assign({}, state.filters.holidays, { q: hs.value });
          renderApp();
        }, 220);
      };
      const hy = document.getElementById('holYear');
      if (hy) hy.onchange = () => {
        state.filters.holidays = Object.assign({}, state.filters.holidays, { year: hy.value });
        renderApp();
      };
      const ht = document.getElementById('holType');
      if (ht) ht.onchange = () => {
        state.filters.holidays = Object.assign({}, state.filters.holidays, { type: ht.value });
        renderApp();
      };
      const cp = document.getElementById('calPicker');
      if (cp) cp.onchange = () => {
        state.filters.calendar = Object.assign({}, state.filters.calendar, { ym: cp.value });
        renderApp();
      };
    };

    scriptLoaded('S08');
  });

})();
</script>
<!-- ═══════════════════════════════════════════════════════════════════════
     S09 — WHATSAPP DAILY REPORT
     Drops in before </body>, after S08.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════════
     1. Register collection
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_addCollection('reportTemplates');

  /* ═══════════════════════════════════════════════════════════════════════
     2. Library loader — loads Chart.js + html2canvas on demand
     ═══════════════════════════════════════════════════════════════════════ */
  const CDN = {
    chartjs:     'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js',
    html2canvas: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'
  };

  function loadScriptOnce(url, globalCheck) {
    return new Promise((resolve, reject) => {
      if (window[globalCheck]) return resolve();
      /* Check if already queued */
      const existing = document.querySelector('script[data-libs="' + globalCheck + '"]');
      if (existing) {
        existing.addEventListener('load', () => resolve());
        existing.addEventListener('error', () => reject(new Error('load failed: ' + url)));
        return;
      }
      const s = document.createElement('script');
      s.src = url;
      s.async = true;
      s.dataset.libs = globalCheck;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('load failed: ' + url));
      document.head.appendChild(s);
    });
  }

  async function ensureLibraries() {
    try {
      await Promise.all([
        loadScriptOnce(CDN.chartjs, 'Chart'),
        loadScriptOnce(CDN.html2canvas, 'html2canvas')
      ]);
      return { ok: true };
    } catch (e) {
      dbg.warn('Library load failed: ' + e.message);
      return { ok: false, error: e.message };
    }
  }
  window.ensureReportLibraries = ensureLibraries;

  /* ═══════════════════════════════════════════════════════════════════════
     3. Schema factory for templates
     ═══════════════════════════════════════════════════════════════════════ */
  function makeReportTemplate(seed) {
    seed = seed || {};
    return {
      id: seed.id || uid(),
      name: String(seed.name || 'Untitled'),
      reportType: seed.reportType || 'daily_whatsapp',
      config: seed.config || {},
      createdAt: seed.createdAt || nowISO(),
      createdBy: seed.createdBy || (state.user?.email || 'system'),
      updatedAt: seed.updatedAt || nowISO(),
      updatedBy: seed.updatedBy || (state.user?.email || 'system')
    };
  }
  window.makeReportTemplate = makeReportTemplate;

  /* ═══════════════════════════════════════════════════════════════════════
     4. Report configuration helpers
     ═══════════════════════════════════════════════════════════════════════ */
  function getDefaultConfig() {
    return {
      rangeMode: 'tomorrow',       /* today | tomorrow | week | month | custom */
      customFrom: today(),
      customTo: shiftDate(today(), 7),
      bankId: 'all',
      showBankBalances: true,
      showTodayCheques: true,
      showWeekCheques: true,
      showMonthForecast: true,
      showCharts: true,
      showAlerts: true,
      showHolidays: true
    };
  }
  window.getDefaultConfig = getDefaultConfig;

  function resolveRange(cfg) {
    switch (cfg.rangeMode) {
      case 'today':    return { from: today(), to: today(), label: 'Today' };
      case 'tomorrow': return { from: shiftDate(today(), 1), to: shiftDate(today(), 1), label: 'Tomorrow' };
      case 'week':     return { from: today(), to: shiftDate(today(), 7), label: 'This Week' };
      case 'month':    return { from: today(), to: shiftDate(today(), 30), label: 'This Month' };
      case 'custom':   return { from: cfg.customFrom, to: cfg.customTo, label: dateFmt(cfg.customFrom) + ' — ' + dateFmt(cfg.customTo) };
      default:         return { from: today(), to: today(), label: 'Today' };
    }
  }

  /* ═══════════════════════════════════════════════════════════════════════
     5. Data builder — collects everything the report needs
     ═══════════════════════════════════════════════════════════════════════ */
  function buildReportData(cfg) {
    const range = resolveRange(cfg);

    /* Banks + balances */
    const banks = cfg.bankId === 'all'
      ? arr(state.data.banks).filter(b => b.active !== false)
      : [bankObj(cfg.bankId)].filter(Boolean);

    const bankRows = banks.map(b => ({
      bank: b,
      balance: bankBalances(b.id)
    }));

    const totalBank = bankRows.reduce((s, r) => s + r.balance.bank, 0);
    const totalBook = bankRows.reduce((s, r) => s + r.balance.book, 0);
    const totalFloating = bankRows.reduce((s, r) => s + r.balance.floating, 0);

    /* Cheques passing in range */
    const inRangeCheques = arr(state.data.cheques)
      .filter(c => (c.status === 'scheduled' || c.status === 'approved'))
      .filter(c => c.chequeDate >= range.from && c.chequeDate <= range.to)
      .filter(c => cfg.bankId === 'all' || c.bankId === cfg.bankId)
      .sort((a, b) => a.chequeDate.localeCompare(b.chequeDate) || String(a.chequeNo).localeCompare(String(b.chequeNo)));

    const inRangeTotal = inRangeCheques.reduce((s, c) => s + num(c.amount), 0);

    /* Today's cheques */
    const todayCheques = arr(state.data.cheques)
      .filter(c => c.chequeDate === today())
      .filter(c => cfg.bankId === 'all' || c.bankId === cfg.bankId)
      .sort((a, b) => String(a.chequeNo).localeCompare(String(b.chequeNo)));

    /* Pending approvals */
    const pendingApprovals = arr(state.data.cheques)
      .filter(c => c.status === 'pending_approval' ||
        (c.status === 'scheduled' && c.chequeDate <= today()))
      .filter(c => cfg.bankId === 'all' || c.bankId === cfg.bankId);

    /* Bounced not re-credited */
    const bouncedPending = arr(state.data.cheques)
      .filter(c => c.status === 'bounced' && c.bankPendingRecredit)
      .filter(c => cfg.bankId === 'all' || c.bankId === cfg.bankId);

    /* Next 7 days daily breakdown */
    const next7 = [];
    for (let i = 0; i < 7; i++) {
      const d = shiftDate(today(), i);
      const dayCheques = arr(state.data.cheques)
        .filter(c => c.chequeDate === d && (c.status === 'scheduled' || c.status === 'approved'))
        .filter(c => cfg.bankId === 'all' || c.bankId === cfg.bankId);
      next7.push({
        date: d,
        label: new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' }),
        shortLabel: new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short' }),
        count: dayCheques.length,
        total: dayCheques.reduce((s, c) => s + num(c.amount), 0)
      });
    }

    /* Next 30 day forecast projection */
    const forecast = [];
    let runningBook = totalBook;
    for (let i = 0; i <= 30; i++) {
      const d = shiftDate(today(), i);
      const scheduledToday = arr(state.data.cheques)
        .filter(c => c.chequeDate === d && c.status === 'scheduled')
        .filter(c => cfg.bankId === 'all' || c.bankId === cfg.bankId)
        .reduce((s, c) => s + num(c.amount), 0);
      const approvedToday = arr(state.data.cheques)
        .filter(c => c.chequeDate === d && c.status === 'approved')
        .filter(c => cfg.bankId === 'all' || c.bankId === cfg.bankId)
        .reduce((s, c) => s + num(c.amount), 0);
      runningBook -= scheduledToday + approvedToday;
      forecast.push({ date: d, closing: runningBook });
    }
    const lowestForecast = forecast.reduce((m, x) => !m || x.closing < m.closing ? x : m, null);
    const shortfallDays = forecast.filter(x => x.closing < 0);

    /* Bank distribution for pie chart */
    const bankDistribution = bankRows.map(r => ({
      name: r.bank.name,
      value: Math.max(0, r.balance.bank)
    }));

    /* Upcoming holidays in range */
    const holidaysInRange = holidaysBetween(range.from, range.to);

    /* Tomorrow's holiday warning */
    const tomorrow = shiftDate(today(), 1);
    const tomorrowHoliday = holidayOn(tomorrow);
    const tomorrowCheques = arr(state.data.cheques)
      .filter(c => c.chequeDate === tomorrow && (c.status === 'scheduled' || c.status === 'approved'))
      .filter(c => cfg.bankId === 'all' || c.bankId === cfg.bankId);

    return {
      range, banks, bankRows, totalBank, totalBook, totalFloating,
      inRangeCheques, inRangeTotal,
      todayCheques, pendingApprovals, bouncedPending,
      next7, forecast, lowestForecast, shortfallDays,
      bankDistribution, holidaysInRange,
      tomorrowHoliday, tomorrowCheques,
      generatedAt: nowISO()
    };
  }
  window.buildReportData = buildReportData;

  /* ═══════════════════════════════════════════════════════════════════════
     6. WhatsApp caption builder — plain text fallback for the message body
     ═══════════════════════════════════════════════════════════════════════ */
  function buildWhatsAppCaption(data, cfg) {
    const s = state.settings || defaultSettings();
    const biz = s.business?.name || 'Lanka Shoe';
    const lines = [];

    lines.push('🏦 ' + biz.toUpperCase() + ' — CHEQUE REPORT');
    lines.push('📅 ' + data.range.label + ' • ' + dateFmt(today()));
    lines.push('');

    if (cfg.showBankBalances) {
      lines.push('━━━ BANK BALANCES ━━━');
      data.bankRows.forEach(r => {
        lines.push('• ' + r.bank.name + ': ' + money(r.balance.bank));
      });
      lines.push('TOTAL BANK: ' + money(data.totalBank));
      lines.push('TOTAL BOOK: ' + money(data.totalBook));
      lines.push('FLOATING: ' + money(data.totalFloating));
      lines.push('');
    }

    if (cfg.showTodayCheques && data.todayCheques.length) {
      lines.push('━━━ TODAY\'S CHEQUES ━━━');
      data.todayCheques.forEach(c => {
        lines.push('• ' + c.chequeNo + ' — ' + (c.payeeName || '—') + ' — ' + money(c.amount));
      });
      lines.push('Today total: ' + money(data.todayCheques.reduce((s, c) => s + num(c.amount), 0)));
      lines.push('');
    }

    if (data.pendingApprovals.length) {
      lines.push('⚠ PENDING APPROVALS: ' + data.pendingApprovals.length +
        ' (' + money(data.pendingApprovals.reduce((s, c) => s + num(c.amount), 0)) + ')');
    }

    if (data.lowestForecast && data.lowestForecast.closing < 0) {
      lines.push('🚨 SHORTFALL WARNING: lowest balance ' + money(data.lowestForecast.closing) +
        ' on ' + dateFmt(data.lowestForecast.date));
    }

    lines.push('');
    lines.push('━━━ 30-DAY FORECAST ━━━');
    lines.push('Lowest: ' + money(data.lowestForecast.closing) + ' on ' + dateFmt(data.lowestForecast.date));
    lines.push('');
    lines.push('— ' + biz + ' • Automated report');
    lines.push('🕐 ' + new Date().toLocaleString('en-GB', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short', year: 'numeric' }));

    return lines.join('\n');
  }
  window.buildWhatsAppCaption = buildWhatsAppCaption;

  /* ═══════════════════════════════════════════════════════════════════════
     7. CHART RENDERERS
     ═══════════════════════════════════════════════════════════════════════ */
  const chartRegistry = {};

  function destroyCharts() {
    Object.keys(chartRegistry).forEach(k => {
      try { chartRegistry[k].destroy(); } catch (e) {}
      delete chartRegistry[k];
    });
  }
  window.destroyCharts = destroyCharts;

  function renderCharts(data) {
    if (!window.Chart) return;
    destroyCharts();

    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const gridColor = isDark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.06)';
    const textColor = isDark ? '#c4b8e4' : '#403a5c';

    const defaults = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: {
            color: textColor,
            font: { size: 11, family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif' }
          }
        }
      },
      scales: {
        x: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor } },
        y: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor } }
      }
    };

    /* Chart 1 — 30-day balance projection (line) */
    const ctx1 = document.getElementById('chartProjection');
    if (ctx1) {
      chartRegistry.projection = new Chart(ctx1, {
        type: 'line',
        data: {
          labels: data.forecast.map(f => {
            const d = new Date(f.date + 'T00:00:00');
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
          }),
          datasets: [{
            label: 'Book balance projection',
            data: data.forecast.map(f => f.closing),
            borderColor: '#7c3aed',
            backgroundColor: 'rgba(124,58,237,.1)',
            fill: true,
            tension: 0.25,
            pointRadius: 2,
            pointBackgroundColor: data.forecast.map(f => f.closing < 0 ? '#ef4444' : '#7c3aed')
          }]
        },
        options: Object.assign({}, defaults, {
          plugins: Object.assign({}, defaults.plugins, {
            tooltip: {
              callbacks: {
                label: function (ctx) { return money(ctx.parsed.y); }
              }
            }
          })
        })
      });
    }

    /* Chart 2 — Cheques per day for next 7 days (bar) */
    const ctx2 = document.getElementById('chartNext7');
    if (ctx2) {
      chartRegistry.next7 = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: data.next7.map(d => d.shortLabel + '\n' + d.date.slice(5)),
          datasets: [{
            label: 'Amount',
            data: data.next7.map(d => d.total),
            backgroundColor: data.next7.map(d => d.total > 0 ? '#7c3aed' : 'rgba(124,58,237,.15)'),
            borderRadius: 6
          }]
        },
        options: Object.assign({}, defaults, {
          plugins: Object.assign({}, defaults.plugins, {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function (ctx) {
                  const d = data.next7[ctx.dataIndex];
                  return d.count + ' cheque(s) — ' + money(d.total);
                }
              }
            }
          })
        })
      });
    }

    /* Chart 3 — Bank distribution (doughnut) */
    const ctx3 = document.getElementById('chartBankDist');
    if (ctx3) {
      const colors = ['#7c3aed', '#ec4899', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#6366f1', '#14b8a6'];
      chartRegistry.bankDist = new Chart(ctx3, {
        type: 'doughnut',
        data: {
          labels: data.bankDistribution.map(b => b.name),
          datasets: [{
            data: data.bankDistribution.map(b => b.value),
            backgroundColor: data.bankDistribution.map((b, i) => colors[i % colors.length]),
            borderWidth: 0
          }]
        },
        options: Object.assign({}, defaults, {
          scales: {},
          plugins: Object.assign({}, defaults.plugins, {
            legend: { position: 'right', labels: { color: textColor, font: { size: 11 } } },
            tooltip: {
              callbacks: {
                label: function (ctx) {
                  const total = data.bankDistribution.reduce((s, b) => s + b.value, 0);
                  const pct = total ? ((ctx.parsed / total) * 100).toFixed(1) : 0;
                  return ctx.label + ': ' + money(ctx.parsed) + ' (' + pct + '%)';
                }
              }
            }
          })
        })
      });
    }

    /* Chart 4 — Weekly outgoing (bar) */
    const ctx4 = document.getElementById('chartWeekly');
    if (ctx4) {
      /* Build week buckets */
      const weeks = [
        { label: 'Week 1', from: today(), to: shiftDate(today(), 6) },
        { label: 'Week 2', from: shiftDate(today(), 7), to: shiftDate(today(), 13) },
        { label: 'Week 3', from: shiftDate(today(), 14), to: shiftDate(today(), 20) },
        { label: 'Week 4', from: shiftDate(today(), 21), to: shiftDate(today(), 27) }
      ];
      const weekData = weeks.map(w => {
        const total = arr(state.data.cheques)
          .filter(c => (c.status === 'scheduled' || c.status === 'approved'))
          .filter(c => c.chequeDate >= w.from && c.chequeDate <= w.to)
          .reduce((s, c) => s + num(c.amount), 0);
        return { label: w.label, total: total };
      });

      chartRegistry.weekly = new Chart(ctx4, {
        type: 'bar',
        data: {
          labels: weekData.map(w => w.label),
          datasets: [{
            label: 'Weekly outgoing',
            data: weekData.map(w => w.total),
            backgroundColor: '#ec4899',
            borderRadius: 6
          }]
        },
        options: Object.assign({}, defaults, {
          indexAxis: 'y',
          plugins: Object.assign({}, defaults.plugins, {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function (ctx) { return money(ctx.parsed.x); }
              }
            }
          }),
          scales: {
            x: { ticks: { color: textColor, font: { size: 10 } }, grid: { color: gridColor } },
            y: { ticks: { color: textColor, font: { size: 11 } }, grid: { display: false } }
          }
        })
      });
    }
  }

                '</thead>' +
                '<tbody>' +
                  data.bankRows.map(r =>
                    '<tr style="border-bottom:1px solid var(--border-2)">' +
                      '<td style="padding:10px 12px;font-weight:500">' + esc(r.bank.name) + '</td>' +
                      '<td style="padding:10px 12px;text-align:right;font-variant-numeric:tabular-nums">' + money(r.balance.bank) + '</td>' +
                      '<td style="padding:10px 12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600">' + money(r.balance.book) + '</td>' +
                      '<td style="padding:10px 12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--amber)">' + (r.balance.floating > 0 ? money(r.balance.floating) : '—') + '</td>' +
                    '</tr>'
                  ).join('') +
                  '<tr style="background:var(--surface-2);font-weight:700">' +
                    '<td style="padding:10px 12px">TOTAL</td>' +
                    '<td style="padding:10px 12px;text-align:right;font-variant-numeric:tabular-nums">' + money(data.totalBank) + '</td>' +
                    '<td style="padding:10px 12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent)">' + money(data.totalBook) + '</td>' +
                    '<td style="padding:10px 12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--amber)">' + money(data.totalFloating) + '</td>' +
                  '</tr>' +
                '</tbody>' +
              '</table>' +
            '</div>'
          : '') +

        /* Today's cheques */
        (cfg.showTodayCheques && data.todayCheques.length
          ? '<div style="margin-bottom:24px">' +
              '<div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;' +
                'color:var(--text-3);font-weight:700;margin-bottom:12px">Today\'s Cheques</div>' +
              '<table style="width:100%;font-size:13px;border-collapse:collapse">' +
                '<thead>' +
                  '<tr style="background:var(--surface-2)">' +
                    '<th style="text-align:left;padding:9px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:700">Cheque #</th>' +
                    '<th style="text-align:left;padding:9px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:700">Payee</th>' +
                    '<th style="text-align:left;padding:9px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:700">Bank</th>' +
                    '<th style="text-align:right;padding:9px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:700">Amount</th>' +
                  '</tr>' +
                '</thead>' +
                '<tbody>' +
                  data.todayCheques.map(c =>
                    '<tr style="border-bottom:1px solid var(--border-2)">' +
                      '<td style="padding:10px 12px;font-family:var(--mono);font-weight:600">' + esc(c.chequeNo) + '</td>' +
                      '<td style="padding:10px 12px">' + esc(c.payeeName || '—') + '</td>' +
                      '<td style="padding:10px 12px;font-size:12px;color:var(--text-3)">' + esc(bankName(c.bankId)) + '</td>' +
                      '<td style="padding:10px 12px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600">' + money(c.amount) + '</td>' +
                    '</tr>'
                  ).join('') +
                  '<tr style="background:var(--surface-2);font-weight:700">' +
                    '<td colspan="3" style="padding:10px 12px;text-align:right">Today\'s total</td>' +
                    '<td style="padding:10px 12px;text-align:right;font-variant-numeric:tabular-nums">' +
                      money(data.todayCheques.reduce((s, c) => s + num(c.amount), 0)) +
                    '</td>' +
                  '</tr>' +
                '</tbody>' +
              '</table>' +
            '</div>'
          : '') +

        /* Next 7 days */
        (cfg.showWeekCheques
          ? '<div style="margin-bottom:24px">' +
              '<div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;' +
                'color:var(--text-3);font-weight:700;margin-bottom:12px">Week Ahead — Cheques Passing</div>' +
              '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">' +
                data.next7.map(d => {
                  const isToday = d.date === today();
                  const isHeavy = d.total > 0;
                  return '<div style="padding:12px 10px;border:1px solid ' +
                    (isToday ? 'var(--accent)' : 'var(--border)') + ';' +
                    'border-radius:10px;background:' + (isHeavy ? 'var(--surface-2)' : 'var(--surface)') + ';text-align:center">' +
                    '<div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:700">' +
                      esc(d.shortLabel) +
                    '</div>' +
                    '<div style="font-size:12px;font-weight:600;margin-top:2px">' +
                      d.date.slice(8) + '/' + d.date.slice(5, 7) +
                    '</div>' +
                    '<div style="font-size:13px;font-weight:700;margin-top:6px;' +
                      (d.total > 0 ? 'color:var(--accent)' : 'color:var(--text-4)') + ';' +
                      'font-variant-numeric:tabular-nums">' +
                      (d.total > 0 ? money(d.total) : '—') +
                    '</div>' +
                    (d.count > 0 ? '<div style="font-size:10px;color:var(--text-3);margin-top:2px">' +
                      d.count + ' cheque' + (d.count > 1 ? 's' : '') + '</div>' : '') +
                  '</div>';
                }).join('') +
              '</div>' +
            '</div>'
          : '') +

        /* 30-day forecast */
        (cfg.showMonthForecast
          ? '<div style="margin-bottom:24px">' +
              '<div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;' +
                'color:var(--text-3);font-weight:700;margin-bottom:12px">30-Day Forecast</div>' +
              '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">' +
                kpiBox('Opening Book', money(data.totalBook), 'var(--text)', 'Today') +
                kpiBox('Lowest Projected', money(data.lowestForecast ? data.lowestForecast.closing : 0),
                  data.lowestForecast && data.lowestForecast.closing < 0 ? 'var(--red)' : 'var(--green)',
                  data.lowestForecast ? dateFmt(data.lowestForecast.date) : '') +
                kpiBox('Shortfall Days', data.shortfallDays.length,
                  data.shortfallDays.length ? 'var(--red)' : 'var(--green)',
                  data.shortfallDays.length
                    ? 'On ' + data.shortfallDays.length + ' day' + (data.shortfallDays.length > 1 ? 's' : '')
                    : '✓ No shortfall expected') +
              '</div>' +
            '</div>'
          : '') +

        /* Alerts */
        (cfg.showAlerts
          ? (function () {
              const alerts = [];
              if (data.pendingApprovals.length) {
                alerts.push({
                  ico: '⏰', color: 'var(--amber)',
                  text: data.pendingApprovals.length + ' cheque' +
                    (data.pendingApprovals.length > 1 ? 's' : '') + ' pending approval — ' +
                    money(data.pendingApprovals.reduce((s, c) => s + num(c.amount), 0))
                });
              }
              if (data.bouncedPending.length) {
                alerts.push({
                  ico: '🚨', color: 'var(--red)',
                  text: data.bouncedPending.length + ' bounced cheque' +
                    (data.bouncedPending.length > 1 ? 's' : '') + ' awaiting bank re-credit — ' +
                    money(data.bouncedPending.reduce((s, c) => s + num(c.amount), 0))
                });
              }
              if (data.shortfallDays.length) {
                alerts.push({
                  ico: '⚠', color: 'var(--red)',
                  text: 'Shortfall expected on ' + data.shortfallDays.length + ' day' +
                    (data.shortfallDays.length > 1 ? 's' : '') +
                    ' — lowest ' + money(data.lowestForecast.closing) +
                    ' on ' + dateFmt(data.lowestForecast.date)
                });
              }
              if (data.lowestForecast && data.lowestForecast.closing >= 0 && data.lowestForecast.closing < 50000) {
                alerts.push({
                  ico: '💡', color: 'var(--amber)',
                  text: 'Low balance alert — projected low of ' +
                    money(data.lowestForecast.closing) + ' on ' + dateFmt(data.lowestForecast.date)
                });
              }
              if (!alerts.length) {
                alerts.push({ ico: '✓', color: 'var(--green)', text: 'All clear — no alerts.' });
              }
              return '<div style="margin-bottom:22px">' +
                '<div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;' +
                  'color:var(--text-3);font-weight:700;margin-bottom:12px">Alerts</div>' +
                '<div style="display:flex;flex-direction:column;gap:8px">' +
                  alerts.map(a =>
                    '<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 14px;' +
                      'background:var(--surface-2);border-radius:10px;font-size:12.5px;line-height:1.5">' +
                      '<span style="font-size:16px">' + a.ico + '</span>' +
                      '<span style="color:' + a.color + ';font-weight:500">' + esc(a.text) + '</span>' +
                    '</div>'
                  ).join('') +
                '</div>' +
              '</div>';
            })()
          : '') +

        /* Holidays in range */
        (cfg.showHolidays && data.holidaysInRange.length
          ? '<div style="margin-bottom:22px">' +
              '<div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;' +
                'color:var(--text-3);font-weight:700;margin-bottom:12px">Holidays in Range</div>' +
              '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
                data.holidaysInRange.map(h =>
                  '<div style="padding:8px 12px;background:var(--accent-soft);color:var(--accent-text);' +
                    'border-radius:8px;font-size:12px">' +
                    (h.type === 'poya' ? '🌕 ' : '🎉 ') +
                    '<strong>' + dateFmt(h.date) + '</strong> — ' + esc(h.name) +
                  '</div>'
                ).join('') +
              '</div>' +
            '</div>'
          : '') +

        /* Footer */
        '<div style="padding-top:16px;border-top:1px solid var(--border);' +
          'display:flex;justify-content:space-between;align-items:center;' +
          'font-size:11px;color:var(--text-4)">' +
          '<div>Generated by ' + esc(biz) + ' · Cheque Manager v17</div>' +
          '<div>' + dateTimeFmt(data.generatedAt) + '</div>' +
        '</div>' +
      '</div>';
  }

  function kpiBox(label, value, color, sub) {
    return '<div style="padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface)">' +
      '<div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;' +
        'font-weight:700;color:var(--text-3)">' + esc(label) + '</div>' +
      '<div style="font-size:20px;font-weight:700;margin-top:6px;color:' + color + ';' +
        'font-variant-numeric:tabular-nums;letter-spacing:-.01em">' + value + '</div>' +
      '<div style="font-size:11px;color:var(--text-4);margin-top:2px">' + esc(sub || '') + '</div>' +
    '</div>';
  }
  window.renderDailyReport = renderDailyReport;

  /* ═══════════════════════════════════════════════════════════════════════
     9. SCREENSHOT — HTML → PNG
     ═══════════════════════════════════════════════════════════════════════ */
  async function captureReportCanvas() {
    const el = document.getElementById('reportCanvas');
    if (!el) throw new Error('Report canvas not found');

    const libs = await ensureLibraries();
    if (!libs.ok || !window.html2canvas) {
      throw new Error('html2canvas not available');
    }

    /* Force light theme for consistent screenshot */
    const html = document.documentElement;
    const originalTheme = html.getAttribute('data-theme');
    html.setAttribute('data-theme', 'professional');

    let canvas;
    try {
      canvas = await window.html2canvas(el, {
        backgroundColor: '#ffffff',
        scale: 2,
        useCORS: true,
        logging: false,
        windowWidth: el.scrollWidth,
        windowHeight: el.scrollHeight
      });
    } finally {
      /* Restore theme */
      if (originalTheme) html.setAttribute('data-theme', originalTheme);
    }

    return canvas;
  }
  window.captureReportCanvas = captureReportCanvas;

  async function downloadReportPNG() {
    try {
      toast('Generating PNG…', 'info');
      const canvas = await captureReportCanvas();
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cheque_report_' + today() + '.png';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('PNG downloaded', 'success');
      }, 'image/png');
    } catch (e) {
      dbg.err('PNG failed: ' + e.message);
      toast('PNG failed: ' + e.message, 'error', 4000);
    }
  }
  window.downloadReportPNG = downloadReportPNG;

  async function copyReportToClipboard() {
    try {
      toast('Copying image…', 'info');
      const canvas = await captureReportCanvas();
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (!blob) throw new Error('Canvas blob failed');

      if (navigator.clipboard && window.ClipboardItem) {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        toast('Image copied to clipboard', 'success');
      } else {
        /* Fallback: download */
        downloadReportPNG();
      }
    } catch (e) {
      dbg.warn('Clipboard failed: ' + e.message);
      downloadReportPNG();
    }
  }
  window.copyReportToClipboard = copyReportToClipboard;

  async function copyCaptionToClipboard() {
    const cfg = Object.assign(getDefaultConfig(), state.filters.dailyReport || {});
    const data = buildReportData(cfg);
    const caption = buildWhatsAppCaption(data, cfg);
    try {
      await navigator.clipboard.writeText(caption);
      toast('Caption copied', 'success');
    } catch (e) {
      /* Fallback: prompt */
      window.prompt('Copy the caption:', caption);
    }
  }
  window.copyCaptionToClipboard = copyCaptionToClipboard;

  /* ═══════════════════════════════════════════════════════════════════════
     10. WHATSAPP SHARE
     ═══════════════════════════════════════════════════════════════════════ */
  async function shareToWhatsApp() {
    const cfg = Object.assign(getDefaultConfig(), state.filters.dailyReport || {});
    const data = buildReportData(cfg);
    const caption = buildWhatsAppCaption(data, cfg);

    /* Strategy:
       1. On mobile with Web Share API → share the PNG file directly
       2. On desktop → download PNG + open WhatsApp Web with pre-filled caption
    */
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    let pngBlob = null;
    try {
      const canvas = await captureReportCanvas();
      pngBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    } catch (e) {
      dbg.warn('PNG capture for share failed: ' + e.message);
    }

    if (isMobile && pngBlob && navigator.canShare && navigator.share) {
      try {
        const file = new File([pngBlob], 'cheque_report_' + today() + '.png', { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: 'Cheque Report — ' + dateFmt(today()),
            text: caption
          });
          toast('Shared', 'success');
          return;
        }
      } catch (e) {
        if (e.name === 'AbortError') return;   /* user cancelled */
        dbg.warn('Web Share failed: ' + e.message);
      }
    }

    /* Desktop / fallback: download PNG + open WhatsApp Web */
    if (pngBlob) {
      const url = URL.createObjectURL(pngBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'cheque_report_' + today() + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    const waUrl = 'https://wa.me/?text=' + encodeURIComponent(caption);
    window.open(waUrl, '_blank', 'noopener');
    toast(pngBlob
      ? 'PNG downloaded. Attach it to the WhatsApp message that just opened.'
      : 'WhatsApp opened with caption. Add the report image manually.',
      'info', 6000);
  }
  window.shareToWhatsApp = shareToWhatsApp;

  /* ═══════════════════════════════════════════════════════════════════════
     11. TEMPLATES
     ═══════════════════════════════════════════════════════════════════════ */
  function openSaveTemplateDialog() {
    const cfg = Object.assign(getDefaultConfig(), state.filters.dailyReport || {});
    const existing = arr(state.data.reportTemplates).filter(t => t.reportType === 'daily_whatsapp');

    const body =
      '<div style="margin-bottom:14px">' +
        '<label class="field">Template Name' +
          '<input id="tplName" placeholder="e.g. Morning WhatsApp Digest">' +
        '</label>' +
      '</div>' +
      '<div class="small muted" style="margin-bottom:14px">' +
        'Saves the current report configuration so you can reuse it later.' +
      '</div>' +
      (existing.length
        ? '<div style="border-top:1px solid var(--border);padding-top:14px">' +
            '<div class="k-label" style="margin-bottom:8px">Existing templates</div>' +
            existing.map(t =>
              '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;' +
                'background:var(--surface-2);border-radius:8px;margin-bottom:6px;font-size:13px">' +
                '<span>' + esc(t.name) + '</span>' +
                '<button class="btn xs danger" data-action="report-delete-template" data-id="' + esc(t.id) + '">Delete</button>' +
              '</div>'
            ).join('') +
          '</div>'
        : '');

    openModal('💾 Save as Template', body, {
      width: 560,
      footer:
        '<button class="btn" data-close-modal>Cancel</button>' +
        '<button class="btn primary" id="tplSaveBtn">Save</button>'
    });

    document.getElementById('tplSaveBtn').onclick = () => {
      const name = document.getElementById('tplName').value.trim();
      if (!name) { toast('Name required', 'error'); return; }
      const template = makeReportTemplate({
        name: name,
        reportType: 'daily_whatsapp',
        config: Object.assign({}, cfg)
      });
      state.data.reportTemplates.push(template);
      markDirty('reportTemplates', template.id);
      closeModal();
      toast('Template saved', 'success');
      renderApp();
    };
  }
  window.openSaveTemplateDialog = openSaveTemplateDialog;

  function loadTemplate(id) {
    const t = arr(state.data.reportTemplates).find(x => x.id === id);
    if (!t) return;
    state.filters.dailyReport = Object.assign(getDefaultConfig(), t.config || {});
    toast('Template loaded: ' + t.name, 'success');
    renderApp();
  }
  window.loadTemplate = loadTemplate;

  function deleteTemplate(id) {
    const t = arr(state.data.reportTemplates).find(x => x.id === id);
    if (!t) return;
    if (!confirm('Delete template "' + t.name + '"?')) return;

    state.data.reportTemplates = state.data.reportTemplates.filter(x => x.id !== id);
    _dirty.add('reportTemplates:' + id);
    delete _snapshot['reportTemplates:' + id];
    scheduleSync();

    closeModal();
    toast('Template deleted', 'success');
    renderApp();
  }
  window.deleteTemplate = deleteTemplate;

  /* ═══════════════════════════════════════════════════════════════════════
     12. ACTION REGISTRATIONS
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_registerAction('report-save-template',   () => openSaveTemplateDialog());
  __LS_registerAction('report-load-template',   (ev, id) => { ev.stopPropagation(); loadTemplate(id); });
  __LS_registerAction('report-delete-template', (ev, id) => { ev.stopPropagation(); deleteTemplate(id); });
  __LS_registerAction('report-share-whatsapp',  () => shareToWhatsApp());
  __LS_registerAction('report-download-png',    () => downloadReportPNG());
  __LS_registerAction('report-copy-caption',    () => copyCaptionToClipboard());
  __LS_registerAction('report-copy-image',      () => copyReportToClipboard());
  __LS_registerAction('report-print',           () => window.print());

  /* ═══════════════════════════════════════════════════════════════════════
     13. ROUTE + NAV
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_addRoute('daily-report', 'Daily Report', renderDailyReport);
  __LS_addNav({
    group: 'Reports',
    id: 'daily-report',
    ico: '📤',
    label: 'WhatsApp Report'
  });

  /* ═══════════════════════════════════════════════════════════════════════
     14. INIT
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_register('S09', function () {
    /* Patch bindView for report controls + chart render on every route change */
    const prevBind = window.bindView;
    window.bindView = function () {
      try { if (prevBind) prevBind(); }
      catch (e) { dbg.warn('bindView previous threw: ' + e.message); }

      const rr = document.getElementById('rptRange');
      if (rr) rr.onchange = () => {
        const cfg = Object.assign(getDefaultConfig(), state.filters.dailyReport || {});
        cfg.rangeMode = rr.value;
        state.filters.dailyReport = cfg;
        renderApp();
      };

      const rf = document.getElementById('rptFrom');
      if (rf) rf.onchange = () => {
        const cfg = Object.assign(getDefaultConfig(), state.filters.dailyReport || {});
        cfg.customFrom = rf.value;
        state.filters.dailyReport = cfg;
        renderApp();
      };

      const rt = document.getElementById('rptTo');
      if (rt) rt.onchange = () => {
        const cfg = Object.assign(getDefaultConfig(), state.filters.dailyReport || {});
        cfg.customTo = rt.value;
        state.filters.dailyReport = cfg;
        renderApp();
      };

      const rb = document.getElementById('rptBank');
      if (rb) rb.onchange = () => {
        const cfg = Object.assign(getDefaultConfig(), state.filters.dailyReport || {});
        cfg.bankId = rb.value;
        state.filters.dailyReport = cfg;
        renderApp();
      };

      document.querySelectorAll('.rptSectionToggle').forEach(el => {
        el.onchange = () => {
          const cfg = Object.assign(getDefaultConfig(), state.filters.dailyReport || {});
          cfg[el.dataset.key] = el.checked;
          state.filters.dailyReport = cfg;
          renderApp();
        };
      });

      /* Render charts whenever the report page is visible */
      if (state.view === 'daily-report') {
        const cfg = Object.assign(getDefaultConfig(), state.filters.dailyReport || {});
        const data = buildReportData(cfg);
        /* Wait one frame so canvases have dimensions */
        setTimeout(() => {
          try { renderCharts(data); }
          catch (e) { dbg.warn('charts: ' + e.message); }
        }, 50);
      }
    };

    /* Auto-refresh report page every 5 minutes while open */
    setInterval(() => {
      if (state.view === 'daily-report') {
        try { renderApp(); }
        catch (e) { dbg.warn('auto-refresh daily-report: ' + e.message); }
      }
    }, 5 * 60 * 1000);

    scriptLoaded('S09');
  });

})();
</script>

  __LS_addCollection('activityLog');

  /* ═══════════════════════════════════════════════════════════════════════
     2. Utilities
     ═══════════════════════════════════════════════════════════════════════ */
  function userRole(email, accessDoc) {
    if (!email) return 'viewer';
    const em = String(email).toLowerCase();
    if (em === CONFIG.adminEmail.toLowerCase()) return 'owner';
    const p = (accessDoc && accessDoc.userPerms && accessDoc.userPerms[em]) || {};
    return (p.role && ROLES[p.role]) ? p.role : 'viewer';
  }
  window.userRole = userRole;

  /* Full text fingerprint of a record for audit-diff */
  function recordFingerprint(rec) {
    try { return JSON.stringify(rec); } catch (e) { return ''; }
  }

  /* Calculate a shallow diff between two records */
  function diffRecords(before, after) {
    const changes = [];
    const keys = new Set([
      ...Object.keys(before || {}),
      ...Object.keys(after || {})
    ]);
    keys.forEach(k => {
      const b = before ? before[k] : undefined;
      const a = after ? after[k] : undefined;
      if (JSON.stringify(b) !== JSON.stringify(a)) {
        changes.push({ field: k, before: b, after: a });
      }
    });
    return changes;
  }
  window.diffRecords = diffRecords;

  /* ═══════════════════════════════════════════════════════════════════════
     3. Schema factories
     ═══════════════════════════════════════════════════════════════════════ */
  function makeActivityLog(seed) {
    seed = seed || {};
    return {
      id: seed.id || uid(),
      at: seed.at || nowISO(),
      by: seed.by || (state.user?.email || 'system'),
      byName: seed.byName || (state.user?.name || ''),
      action: String(seed.action || ''),          /* create | update | delete | restore | login | logout | approve | bounce | void */
      collection: String(seed.collection || ''),
      recordId: String(seed.recordId || ''),
      summary: String(seed.summary || ''),
      meta: seed.meta || {}
    };
  }
  window.makeActivityLog = makeActivityLog;

  function makeAuditEntry(seed) {
    seed = seed || {};
    return {
      id: seed.id || uid(),
      at: seed.at || nowISO(),
      by: seed.by || (state.user?.email || 'system'),
      byName: seed.byName || (state.user?.name || ''),
      collection: String(seed.collection || ''),
      recordId: String(seed.recordId || ''),
      action: seed.action || 'update',            /* create | update | delete | restore */
      changes: arr(seed.changes),                  /* [{field, before, after}, ...] */
      before: seed.before || null,
      after: seed.after || null,
      summary: String(seed.summary || '')
    };
  }
  window.makeAuditEntry = makeAuditEntry;

  function makeLoginHistoryEntry(seed) {
    seed = seed || {};
    return {
      id: seed.id || uid(),
      at: seed.at || nowISO(),
      uid: seed.uid || '',
      email: seed.email || '',
      name: seed.name || '',
      role: seed.role || '',
      userAgent: seed.userAgent || navigator.userAgent,
      language: seed.language || navigator.language,
      referrer: seed.referrer || (document.referrer || ''),
      href: seed.href || location.href,
      timezone: (function () {
        try { return Intl.DateTimeFormat().resolvedOptions().timeZone; }
        catch (e) { return ''; }
      })()
    };
  }
  window.makeLoginHistoryEntry = makeLoginHistoryEntry;

  function makeTrashEntry(seed) {
    seed = seed || {};
    return {
      id: seed.id || uid(),
      collection: String(seed.collection || ''),
      recordId: String(seed.recordId || ''),
      label: String(seed.label || ''),
      item: seed.item || null,
      deletedAt: seed.deletedAt || nowISO(),
      deletedBy: seed.deletedBy || (state.user?.email || 'system'),
      deletedByName: seed.deletedByName || (state.user?.name || ''),
      restoredAt: seed.restoredAt || null,
      restoredBy: seed.restoredBy || null
    };
  }
  window.makeTrashEntry = makeTrashEntry;

  function makeNumberSequence(seed) {
    seed = seed || {};
    return {
      id: seed.id || uid(),
      key: seed.key || '',                         /* e.g. 'cheque', 'invoice' */
      label: String(seed.label || ''),
      prefix: String(seed.prefix || ''),
      suffix: String(seed.suffix || ''),
      pad: num(seed.pad) || 4,
      next: num(seed.next) || 1,
      step: num(seed.step) || 1,
      scope: seed.scope || 'global',               /* global | yearly | monthly */
      lastGenerated: seed.lastGenerated || null,
      active: seed.active !== false,
      createdAt: seed.createdAt || nowISO(),
      updatedAt: seed.updatedAt || nowISO(),
      updatedBy: seed.updatedBy || (state.user?.email || 'system')
    };
  }
  window.makeNumberSequence = makeNumberSequence;

  /* ═══════════════════════════════════════════════════════════════════════
     4. Audit / activity / trash writers
     ═══════════════════════════════════════════════════════════════════════ */
  function logActivity(opts) {
    if (!state.firebaseReady) return;
    try {
      const entry = makeActivityLog(opts);
      state.data.activityLog.push(entry);
      markDirty('activityLog', entry.id);
      trimCollection('activityLog', 5000);
    } catch (e) { dbg.warn('logActivity failed: ' + e.message); }
  }
  window.logActivity = logActivity;

  function recordAudit(opts) {
    if (!state.firebaseReady) return;
    try {
      const entry = makeAuditEntry(opts);
      state.data.auditTrail.push(entry);
      markDirty('auditTrail', entry.id);
      trimCollection('auditTrail', 5000);
    } catch (e) { dbg.warn('recordAudit failed: ' + e.message); }
  }
  window.recordAudit = recordAudit;

  function trimCollection(name, maxSize) {
    if (!Array.isArray(state.data[name])) return;
    if (state.data[name].length <= maxSize) return;
    /* Sort by createdAt descending, keep newest */
    const sorted = state.data[name].slice().sort((a, b) =>
      String(b.at || b.createdAt || '').localeCompare(String(a.at || a.createdAt || ''))
    );
    const keep = sorted.slice(0, maxSize);
    const removed = state.data[name].filter(x => !keep.includes(x));
    removed.forEach(r => {
      _dirty.add(name + ':' + r.id);
      delete _snapshot[name + ':' + r.id];
    });
    state.data[name] = keep;
  }

  function pushToTrash(collection, item, label) {
    if (!state.firebaseReady) return null;
    try {
      const entry = makeTrashEntry({
        collection: collection,
        recordId: item.id,
        label: label || item.name || item.chequeNo || item.bookNo || item.id,
        item: JSON.parse(JSON.stringify(item))
      });
      state.data.trash.unshift(entry);
      markDirty('trash', entry.id);
      trimCollection('trash', 1000);
      return entry;
    } catch (e) {
      dbg.warn('pushToTrash failed: ' + e.message);
      return null;
    }
  }
  window.pushToTrash = pushToTrash;

  function restoreFromTrash(trashId) {
    if (!state.perms.delete) { toast('No permission', 'error'); return; }
    const entry = arr(state.data.trash).find(t => t.id === trashId);
    if (!entry || !entry.item) { toast('Trash entry not found', 'error'); return; }

    const collection = entry.collection;
    const item = entry.item;

    /* Prevent double-restore */
    if (arr(state.data[collection]).some(x => x.id === item.id)) {
      toast('Record already exists in ' + collection, 'warn');
      return;
    }

    /* Push back into collection */
    state.data[collection] = arr(state.data[collection]).concat([item]);
    markDirty(collection, item.id);

    /* Remove from trash */
    state.data.trash = state.data.trash.filter(t => t.id !== trashId);
    _dirty.add('trash:' + trashId);
    delete _snapshot['trash:' + trashId];

    recordAudit({
      collection: collection,
      recordId: item.id,
      action: 'restore',
      before: null,
      after: item,
      summary: 'Restored from Trash'
    });

    logActivity({
      action: 'restore',
      collection: collection,
      recordId: item.id,
      summary: 'Restored ' + (entry.label || item.id)
    });

    toast('Restored', 'success');
    renderApp();
  }
  window.restoreFromTrash = restoreFromTrash;

  function deleteTrashPermanently(trashId) {
    if (!state.perms.delete) { toast('No permission', 'error'); return; }
    const entry = arr(state.data.trash).find(t => t.id === trashId);
    if (!entry) return;
    if (!confirm('Permanently delete "' + (entry.label || entry.id) + '"?\nThis cannot be undone.')) return;

    state.data.trash = state.data.trash.filter(t => t.id !== trashId);
    _dirty.add('trash:' + trashId);
    delete _snapshot['trash:' + trashId];
    scheduleSync();

    logActivity({
      action: 'delete_permanent',
      collection: entry.collection,
      recordId: entry.recordId,
      summary: 'Permanently deleted ' + (entry.label || entry.recordId)
    });

    toast('Deleted permanently', 'success');
    renderApp();
  }
  window.deleteTrashPermanently = deleteTrashPermanently;

  function emptyTrash() {
    if (!state.perms.delete) { toast('No permission', 'error'); return; }
    const count = arr(state.data.trash).length;
    if (!count) { toast('Trash is already empty', 'info'); return; }
    if (!confirm('Permanently delete all ' + count + ' item(s) in Trash?\nThis cannot be undone.')) return;

    state.data.trash.forEach(t => {
      _dirty.add('trash:' + t.id);
      delete _snapshot['trash:' + t.id];
    });
    state.data.trash = [];
    scheduleSync();

    logActivity({ action: 'empty_trash', summary: 'Emptied trash (' + count + ' items)' });
    toast('Trash emptied', 'success');
    renderApp();
  }
  window.emptyTrash = emptyTrash;

  /* ═══════════════════════════════════════════════════════════════════════
     5. Number sequence engine
     ═══════════════════════════════════════════════════════════════════════ */
  function sequenceScopePrefix(scope) {
    const d = new Date();
    if (scope === 'yearly') return String(d.getFullYear()) + '-';
    if (scope === 'monthly') return String(d.getFullYear()) + String(d.getMonth() + 1).padStart(2, '0') + '-';
    return '';
  }

  function nextSequenceValue(key) {
    const seq = arr(state.data.numberSequences).find(s => s.key === key && s.active !== false);
    if (!seq) return '';
    const scopePrefix = sequenceScopePrefix(seq.scope);
    const body = String(seq.next).padStart(seq.pad, '0');
    const value = (seq.prefix || '') + scopePrefix + body + (seq.suffix || '');
    seq.next = num(seq.next) + num(seq.step || 1);
    seq.lastGenerated = value;
    seq.updatedAt = nowISO();
    markDirty('numberSequences', seq.id);
    return value;
  }
  window.nextSequenceValue = nextSequenceValue;

  function seedDefaultSequences() {
    if (arr(state.data.numberSequences).length > 0) return 0;

    const defaults = [
      { key: 'cheque',     label: 'Cheque Number (when no book)', prefix: '', pad: 6, scope: 'global' },
      { key: 'invoice',    label: 'Invoice',                      prefix: 'INV-', pad: 4, scope: 'yearly' },
      { key: 'receipt',    label: 'Receipt',                      prefix: 'RCP-', pad: 4, scope: 'yearly' },
      { key: 'journal',    label: 'Journal Entry',                prefix: 'JE-', pad: 4, scope: 'yearly' },
      { key: 'adjustment', label: 'Bank Adjustment',              prefix: 'ADJ-', pad: 4, scope: 'yearly' }
    ];

    let created = 0;
    defaults.forEach(d => {
      const seq = makeNumberSequence(d);
      state.data.numberSequences.push(seq);
      markDirty('numberSequences', seq.id);
      created++;
    });

    if (created) dbg.ok('Seeded ' + created + ' number sequences');
    return created;
  }
  window.seedDefaultSequences = seedDefaultSequences;

                  '</td>' +

                  '<td>' +
                    '<span class="badge ' +
                      (r.role === 'owner' ? 'purple'
                        : r.role === 'admin' ? 'blue'
                        : r.role === 'manager' ? 'green'

        '</div>' +

          'font-family:var(--mono);font-size:11px;overflow:auto;line-height:1.6">' +
esc(
'rules_version = \'2\';\n' +
'service cloud.firestore {\n' +
'  match /databases/{database}/documents {\n' +
'    function isSignedIn() {\n' +
'      return request.auth != null;\n' +
'    }\n' +
'    function isAdmin() {\n' +
'      return isSignedIn() &&\n' +
'        (request.auth.token.email == "' + CONFIG.adminEmail + '");\n' +
'    }\n' +
'    match /lk/{document=**} {\n' +

'    }\n' +

'  }\n' +
'}'

  /* ═══════════════════════════════════════════════════════════════════════
     7. USER FORM
     ═══════════════════════════════════════════════════════════════════════ */
  async function openUserForm(email) {
    if (!state.perms.users) { toast('No permission', 'error'); return; }

    let access = { allowedEmails: [], userPerms: {} };
    try { access = await loadAccess(true); } catch (e) {}

    const isNew = !email;
    const em = email || '';
    const existing = !isNew ? (access.userPerms[em] || {}) : {};
    const curRole = !isNew ? userRole(em, access) : 'viewer';

    const body =
      (isNew
        ? '<div style="margin-bottom:14px">' +
            '<label class="field">Email' +
              '<input id="uEmail" type="email" placeholder="user@example.com" autocomplete="off">' +
            '</label>' +
          '</div>'
        : '<div style="margin-bottom:14px">' +
            '<div class="k-label">Email</div>' +
            '<div style="font-weight:600;font-size:14px">' + esc(em) + '</div>' +
          '</div>') +

      '<div style="margin-bottom:14px">' +
        selectField('Role', 'uRole',
          Object.keys(ROLES).map(r => ({ value: r, label: r.charAt(0).toUpperCase() + r.slice(1) })),
          curRole,
          { req: true }) +
      '</div>' +

      '<div class="k-label" style="margin:18px 0 8px">Custom Permission Overrides (optional)</div>' +
      '<div class="small muted" style="margin-bottom:10px">' +
        'Leave blank to use the role default. Toggle to override.' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
        ['write', 'approve', 'delete', 'users', 'settings'].map(k => {
          const roleDefault = ROLES[curRole].perms[k];
          const current = existing.perms && existing.perms[k] !== undefined
            ? existing.perms[k]
            : roleDefault;
          return '<label style="display:flex;align-items:center;gap:10px;font-size:13px">' +
            '<input type="checkbox" class="uPerm" data-key="' + k + '" ' + (current ? 'checked' : '') + '>' +
            '<span style="text-transform:capitalize;font-weight:500">' + k + '</span>' +
            '<span class="badge gray">' + (roleDefault ? 'role allows' : 'role denies') + '</span>' +
          '</label>';
        }).join('') +
      '</div>' +

      '<div style="margin-top:18px">' +
        field('Notes', 'uNotes', existing.notes || '', { type: 'textarea' }) +
      '</div>';

    openModal(isNew ? '＋ Add Authorized User' : '✏️ Edit User', body, {
      width: 640,
      footer:
        '<button class="btn" data-close-modal>Cancel</button>' +
        '<button class="btn primary" id="uSaveBtn">' + (isNew ? 'Add' : 'Save') + '</button>'
    });

    document.getElementById('uSaveBtn').onclick = async () => {
      const role = document.getElementById('uRole').value;
      const notes = document.getElementById('uNotes').value.trim();

      let targetEmail = em;
      if (isNew) {
        targetEmail = (document.getElementById('uEmail').value || '').trim().toLowerCase();
        if (!targetEmail || targetEmail.indexOf('@') === -1) {
          toast('Valid email required', 'error');
          return;
        }
        if (targetEmail === CONFIG.adminEmail.toLowerCase()) {
          toast('Admin is always authorized', 'info');
          return;
        }
      }

      /* Collect overrides */
      const overrides = {};
      let anyOverride = false;
      document.querySelectorAll('.uPerm').forEach(cb => {
        const k = cb.dataset.key;
        const roleDefault = ROLES[role].perms[k];
        if (cb.checked !== roleDefault) {
          overrides[k] = cb.checked;
          anyOverride = true;
        }
      });

      /* Update access doc */
      const newAccess = Object.assign({}, access);
      newAccess.allowedEmails = (newAccess.allowedEmails || []).slice();
      newAccess.userPerms = Object.assign({}, newAccess.userPerms || {});

      if (newAccess.allowedEmails.indexOf(targetEmail) === -1) {
        newAccess.allowedEmails.push(targetEmail);
      }
      newAccess.userPerms[targetEmail] = Object.assign(
        {},
        newAccess.userPerms[targetEmail] || {},
        {
          role: role,
          perms: anyOverride ? overrides : null,
          notes: notes,
          updatedAt: nowISO(),
          updatedBy: state.user?.email || 'system'
        }
      );

      try {
        await docRef(CONFIG.accessPath).set({
          allowedEmails: newAccess.allowedEmails,
          userPerms: newAccess.userPerms,
          updatedAt: nowISO(),
          updatedBy: state.user?.email || 'system'
        });
        try { localStorage.removeItem(CONFIG.accessCacheKey); } catch (e) {}

        logActivity({
          action: isNew ? 'user_add' : 'user_update',
          collection: 'access',
          recordId: targetEmail,
          summary: (isNew ? 'Added' : 'Updated') + ' user ' + targetEmail + ' (role: ' + role + ')'
        });

        closeModal();
        toast(isNew ? 'User added' : 'User updated', 'success');
        renderApp();
      } catch (e) {
        dbg.err('Save user failed: ' + (e.code || e.message));

      }

  /* Remove user */
  async function removeUser(email) {
    if (!state.perms.users) { toast('No permission', 'error'); return; }
    if (!email) return;
    const em = email.toLowerCase();
    if (em === CONFIG.adminEmail.toLowerCase()) {
      toast('Cannot remove the admin', 'error');
      return;
    }
    if (!confirm('Remove ' + em + ' from authorized users?\n\nThey will immediately lose access.')) return;

    let access = { allowedEmails: [], userPerms: {} };
    try { access = await loadAccess(true); } catch (e) {}

    access.allowedEmails = (access.allowedEmails || []).filter(x => x !== em);
    delete (access.userPerms || {})[em];

    try {
      await docRef(CONFIG.accessPath).set({
        allowedEmails: access.allowedEmails,
        userPerms: access.userPerms,
        updatedAt: nowISO(),
        updatedBy: state.user?.email || 'system'
      });
      try { localStorage.removeItem(CONFIG.accessCacheKey); } catch (e) {}

      logActivity({
        action: 'user_remove',
        collection: 'access',
        recordId: em,
        summary: 'Removed user ' + em
      });

      toast('User removed', 'success');
      renderApp();
    } catch (e) {
      dbg.err('Remove user failed: ' + (e.code || e.message));
      toast('Remove failed: ' + (e.code || e.message), 'error');
    }
  }
  window.removeUser = removeUser;

        label: document.getElementById('sqLabel').value.trim(),
        prefix: document.getElementById('sqPrefix').value.trim(),
        pad: num(document.getElementById('sqPad').value) || 4,

        step: num(document.getElementById('sqStep').value) || 1,
        suffix: document.getElementById('sqSuffix').value.trim(),
        active: document.getElementById('sqActive').checked
      };

      if (!data.label) { toast('Label is required', 'error'); return; }
