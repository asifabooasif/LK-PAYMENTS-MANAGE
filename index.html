        '<div><div class="k-label">File</div><div><strong>' + esc(imp.fileName) + '</strong></div></div>' +
        '<div><div class="k-label">Imported</div><div><strong>' + dateTimeFmt(imp.createdAt) + '</strong></div></div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-bottom:18px">' +
        '<div><div class="k-label">Rows</div><div style="font-size:18px;font-weight:600">' + imp.rowCount + '</div></div>' +
        '<div><div class="k-label">Matched</div><div style="font-size:18px;font-weight:600;color:var(--green)">' + imp.matchedCount + '</div></div>' +
        '<div><div class="k-label">Unmatched</div><div style="font-size:18px;font-weight:600;color:var(--amber)">' + imp.unmatchedCount + '</div></div>' +
        '<div><div class="k-label">Period</div><div class="small">' + dateFmt(imp.statementFrom) + ' → ' + dateFmt(imp.statementTo) + '</div></div>' +
      '</div>' +
      '<div class="table-wrap" style="max-height:400px;overflow:auto"><table style="font-size:12px">' +
        '<thead><tr>' +
          '<th>Date</th><th>Description</th>' +
          '<th class="num">Amount</th><th>State</th>' +
        '</tr></thead><tbody>' +
        rows.map(t =>
          '<tr>' +
            '<td>' + dateFmt(t.date) + '</td>' +
            '<td>' + esc(t.description.slice(0, 60)) + '</td>' +
            '<td class="num" style="color:' +
              (t.direction === 'debit' ? 'var(--red)' : 'var(--green)') + '">' +
              (t.direction === 'debit' ? '−' : '+') + money(t.amount) + '</td>' +
            '<td>' + matchStateBadge(t.matchState) + '</td>' +
          '</tr>'
        ).join('') +
      '</tbody></table></div>';

    openModal('📥 Import Details', body, {
      width: 800,
      footer: '<button class="btn" data-close-modal>Close</button>'
    });
  }
  window.openImportView = openImportView;

  /* ═══════════════════════════════════════════════════════════════════════
     16. DELETE IMPORT BATCH (cascades to its transactions)
     ═══════════════════════════════════════════════════════════════════════ */
  function deleteImportById(impId) {
    if (!state.perms.delete) { toast('No delete permission', 'error'); return; }
    const imp = arr(state.data.bankImports).find(x => x.id === impId);
    if (!imp) return;
    const rows = arr(state.data.bankTransactions).filter(t => t.importId === impId);

    if (!confirm('Delete import "' + imp.fileName + '"?\n\n' +
      rows.length + ' transaction(s) will also be removed.\n' +
      'Matched cheques are NOT affected.')) return;

    /* Remove transactions */
    const ids = new Set(rows.map(r => r.id));
    state.data.bankTransactions = state.data.bankTransactions.filter(t => !ids.has(t.id));
    rows.forEach(r => {
      _dirty.add('bankTransactions:' + r.id);
      delete _snapshot['bankTransactions:' + r.id];
    });

    /* Remove import */
    state.data.bankImports = state.data.bankImports.filter(x => x.id !== impId);
    _dirty.add('bankImports:' + impId);
    delete _snapshot['bankImports:' + impId];

    scheduleSync();
    closeModal();
    toast('Import deleted', 'success');
    renderApp();
  }
  window.deleteImportById = deleteImportById;

  /* ═══════════════════════════════════════════════════════════════════════
     17. ACTION REGISTRATIONS
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_registerAction('import-open',    (ev, id) => { ev.stopPropagation(); openImportDialog(id || null); });
  __LS_registerAction('import-view',    (ev, id) => { ev.stopPropagation(); openImportView(id); });
  __LS_registerAction('import-delete',  (ev, id) => { ev.stopPropagation(); deleteImportById(id); });
  __LS_registerAction('auto-match-all', () => {
    let total = 0;
    arr(state.data.banks).forEach(b => { total += autoMatchAll(b.id); });
    toast(total ? 'Auto-matched ' + total + ' transaction(s)' : 'Nothing to match', total ? 'success' : 'info');
    renderApp();
  });
  __LS_registerAction('auto-match-bank', (ev, id) => {
    ev.stopPropagation();
    const n = autoMatchAll(id);
    toast(n ? 'Auto-matched ' + n + ' transaction(s)' : 'Nothing new to match', n ? 'success' : 'info');
    renderApp();
  });
  __LS_registerAction('reconcile-bank', (ev, id) => {
    ev.stopPropagation();
    location.hash = '#/reconcile/' + id;
  });
  __LS_registerAction('tx-match',    (ev, id) => { ev.stopPropagation(); openMatchPicker(id); });
  __LS_registerAction('tx-unmatch',  (ev, id) => {
    ev.stopPropagation();
    const tx = txObj(id);
    if (!tx) return;
    tx.matchState = 'unmatched';
    tx.matchedType = null;
    tx.matchedId = null;
    tx.matchedAt = null;
    tx.matchedBy = null;
    tx.updatedAt = nowISO();
    markDirty('bankTransactions', tx.id);
    toast('Unmatched', 'info');
    renderApp();
  });
  __LS_registerAction('tx-ignore',   (ev, id) => {
    ev.stopPropagation();
    const tx = txObj(id);
    if (!tx) return;
    tx.matchState = 'ignored';
    tx.updatedAt = nowISO();
    markDirty('bankTransactions', tx.id);
    toast('Ignored', 'info');
    renderApp();
  });
  __LS_registerAction('tx-restore',  (ev, id) => {
    ev.stopPropagation();
    const tx = txObj(id);
    if (!tx) return;
    tx.matchState = 'unmatched';
    tx.updatedAt = nowISO();
    markDirty('bankTransactions', tx.id);
    toast('Restored', 'info');
    renderApp();
  });
  __LS_registerAction('tx-delete',   (ev, id) => {
    ev.stopPropagation();
    if (!confirm('Delete this transaction?')) return;
    state.data.bankTransactions = state.data.bankTransactions.filter(t => t.id !== id);
    _dirty.add('bankTransactions:' + id);
    delete _snapshot['bankTransactions:' + id];
    scheduleSync();
    toast('Deleted', 'success');
    renderApp();
  });

  /* ═══════════════════════════════════════════════════════════════════════
     18. ROUTES + NAV
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_addRoute('reconciliation', 'Bank Reconciliation', renderReconciliation);
  __LS_addRoute('reconcile', 'Reconcile Bank', function () {
    /* The route receives the bankId as a hash fragment param: #/reconcile/<id> */
    const raw = (location.hash || '').slice(2);
    const parts = raw.split('/').filter(Boolean);
    const bankId = parts[1] || '';
    if (!bankId) return '<div class="empty">Missing bank</div>';
    return renderBankReconcile(bankId);
  });

  __LS_addNav({
    group: 'Setup',
    id: 'reconciliation',
    ico: '🧾',
    label: 'Reconciliation',
    badgeFn: function () {
      return arr(state.data.bankTransactions).filter(t => t.matchState === 'unmatched').length;
    }
  });

  /* ═══════════════════════════════════════════════════════════════════════
     19. INIT
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_register('S06', function () {
    const prevBind = window.bindView;
    window.bindView = function () {
      try { if (prevBind) prevBind(); }
      catch (e) { dbg.warn('bindView previous threw: ' + e.message); }

      const rs = document.getElementById('recSearch');
      if (rs) rs.oninput = () => {
        clearTimeout(rs._t);
        rs._t = setTimeout(() => {
          state.filters.reconcile = Object.assign({}, state.filters.reconcile, { q: rs.value });
          renderApp();
        }, 220);
      };
      const rst = document.getElementById('recState');
      if (rst) rst.onchange = () => {
        state.filters.reconcile = Object.assign({}, state.filters.reconcile, { state: rst.value });
        renderApp();
      };
    };

    scriptLoaded('S06');
  });

})();
</script>
<!-- ═══════════════════════════════════════════════════════════════════════
     S07 — REPORTS (10 reports + CSV export)
     Drops in before </body>, after S06.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════════
     1. Shared helpers
     ═══════════════════════════════════════════════════════════════════════ */

  /* Build report header bar (title + filters + export) */
  function reportHeader(opts) {
    opts = opts || {};
    return '<div class="card">' +
      '<div class="card-head">' +
        '<h3>' + opts.title + '</h3>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
          (opts.filters || '') +
          '<button class="btn" data-action="' + (opts.printAction || 'rpt-print') + '">🖨 Print</button>' +
          (opts.exportAction
            ? '<button class="btn primary" data-action="' + opts.exportAction + '">⬇ CSV</button>'
            : '') +
        '</div>' +
      '</div>';
  }

  /* Download any array of arrays as CSV */
  function downloadCSV(rows, filename) {
    const csv = rows.map(r => r.map(csvEsc).join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename + '_' + today() + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 500);
    toast('CSV downloaded', 'success');
  }
  window.downloadCSV = downloadCSV;

  /* Group cheques by date */
  function chequesByDate(cheques) {
    const map = {};
    cheques.forEach(c => {
      if (!map[c.chequeDate]) map[c.chequeDate] = [];
      map[c.chequeDate].push(c);
    });
    return map;
  }

  /* Running total for a bank across cheques up to a date */
  function bankBalanceOnDate(bankId, asOf) {
    const bank = bankObj(bankId);
    if (!bank) return 0;
    let bal = num(bank.openingBalance);
    arr(state.data.bankAdjustments).forEach(a => {
      if (a.bankId !== bankId) return;
      if (a.date > asOf) return;
      bal += num(a.signedAmount !== undefined ? a.signedAmount : a.amount);
    });
    arr(state.data.cheques).forEach(c => {
      if (c.bankId !== bankId) return;
      if (c.status !== 'cleared') return;
      if (c.clearedAt && c.clearedAt.slice(0, 10) > asOf) return;
      bal -= num(c.amount);
    });
    return bal;
  }
  window.bankBalanceOnDate = bankBalanceOnDate;

  /* Group cheques by month (YYYY-MM) */
  function groupByMonth(cheques, field) {
    const map = {};
    cheques.forEach(c => {
      const v = c[field] || c.chequeDate || '';
      const ym = String(v).slice(0, 7);
      if (!ym) return;
      if (!map[ym]) map[ym] = [];
      map[ym].push(c);
    });
    return map;
  }

  /* ═══════════════════════════════════════════════════════════════════════
     2. REPORTS HUB
     ═══════════════════════════════════════════════════════════════════════ */
  function renderReportsHub() {
    const cards = [
      { id: 'rpt-upcoming',       ico: '📅', label: 'Upcoming Cheques',     desc: 'Cheques scheduled in next 7/14/30/90 days' },
      { id: 'rpt-cashflow',       ico: '📈', label: 'Cash-flow Projection', desc: 'Day-by-day / week / month projection with shortfalls' },
      { id: 'rpt-register',       ico: '📋', label: 'Cheque Register',      desc: 'All cheques with full details and filters' },
      { id: 'rpt-book-usage',     ico: '📚', label: 'Cheque Book Usage',    desc: 'Leaves used, available, spoiled per book' },
      { id: 'rpt-bank-statement', ico: '🏦', label: 'Bank Statement',       desc: 'Running balance per bank including all movements' },
      { id: 'rpt-overdue',        ico: '⏰', label: 'Overdue Approvals',    desc: 'Cheques past their due date awaiting approval' },
      { id: 'rpt-bounced',        ico: '⚠️', label: 'Bounced Cheques',      desc: 'All bounced cheques with reasons' },
      { id: 'rpt-payee-history',  ico: '👥', label: 'Payee Payment History', desc: 'Total paid per payee with breakdown' },
      { id: 'rpt-monthly',        ico: '📊', label: 'Monthly Cheque Summary', desc: 'Counts and totals grouped by month' },
      { id: 'rpt-forecast',       ico: '🔮', label: 'Cash-flow Forecast',   desc: '30 / 60 / 90 day forecast with shortfall warnings' }
    ];

    return '' +
      '<div class="card">' +
        '<div class="card-head"><h3>📊 Reports</h3></div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">' +
          cards.map(c =>
            '<div data-nav="' + c.id + '" ' +
              'style="padding:16px;border:1px solid var(--border);border-radius:12px;' +
              'background:var(--surface);cursor:pointer;transition:all .15s">' +
              '<div style="font-size:24px;margin-bottom:8px">' + c.ico + '</div>' +
              '<div style="font-weight:600;font-size:13.5px;margin-bottom:4px">' + esc(c.label) + '</div>' +
              '<div class="small muted">' + esc(c.desc) + '</div>' +
            '</div>'
          ).join('') +
        '</div>' +
      '</div>';
  }

  /* ═══════════════════════════════════════════════════════════════════════
     3. REPORT 1 — UPCOMING CHEQUES
     ═══════════════════════════════════════════════════════════════════════ */
  function renderRptUpcoming() {
    const f = state.filters.rptUpcoming || {};
    const days = num(f.days) || 30;
    const bankId = f.bankId || 'all';

    const start = today();
    const end = shiftDate(start, days);

    let list = arr(state.data.cheques)
      .filter(c => c.status === 'scheduled')
      .filter(c => c.chequeDate >= start && c.chequeDate <= end);
    if (bankId !== 'all') list = list.filter(c => c.bankId === bankId);

    list.sort((a, b) => a.chequeDate.localeCompare(b.chequeDate));
    const total = list.reduce((s, c) => s + num(c.amount), 0);

    /* Group by date */
    const byDate = chequesByDate(list);
    const dates = Object.keys(byDate).sort();

    return '' +
      reportHeader({
        title: '📅 Upcoming Cheques (next ' + days + ' days)',
        exportAction: 'rpt-upcoming-export',
        filters:
          '<label class="field" style="min-width:140px">Days' +
            '<select id="upDays">' +
              [7, 14, 30, 90, 180].map(d =>
                '<option value="' + d + '"' + (days === d ? ' selected' : '') + '>Next ' + d + ' days</option>'
              ).join('') +
            '</select>' +
          '</label>' +
          '<label class="field" style="min-width:160px">Bank' +
            '<select id="upBank">' +
              '<option value="all"' + (bankId === 'all' ? ' selected' : '') + '>All banks</option>' +
              arr(state.data.banks).map(b =>
                '<option value="' + esc(b.id) + '"' + (bankId === b.id ? ' selected' : '') + '>' + esc(b.name) + '</option>'
              ).join('') +
            '</select>' +
          '</label>'
      }) +

      '<div class="kpi-strip">' +
        '<div class="kpi"><div class="k-label">Cheques</div><div class="k-value">' + list.length + '</div></div>' +
        '<div class="kpi"><div class="k-label">Total Value</div>' +
          '<div class="k-value" style="font-size:18px">' + money(total) + '</div></div>' +
        '<div class="kpi"><div class="k-label">Days Covered</div><div class="k-value">' + days + '</div></div>' +
        '<div class="kpi"><div class="k-label">Distinct Dates</div><div class="k-value">' + dates.length + '</div></div>' +
      '</div>' +

      (list.length
        ? dates.map(d => {
            const cheques = byDate[d];
            const dayTotal = cheques.reduce((s, c) => s + num(c.amount), 0);
            return '<div class="card">' +
              '<div class="card-head" style="margin-bottom:10px">' +
                '<h3 style="font-size:14px">' + dateFmt(d) +
                  ' <span class="badge blue" style="margin-left:8px">' +
                    (diffDays(today(), d) === 0 ? 'Today' : diffDays(today(), d) + ' days') +
                  '</span>' +
                '</h3>' +
                '<strong>' + money(dayTotal) + '</strong>' +
              '</div>' +
              '<div class="table-wrap"><table>' +
                '<thead><tr>' +
                  '<th>Cheque #</th><th>Payee</th><th>Bank</th>' +
                  '<th class="num">Amount</th><th class="actions-cell"></th>' +
                '</tr></thead><tbody>' +
                cheques.map(c =>
                  '<tr>' +
                    '<td class="mono"><strong>' + esc(c.chequeNo) + '</strong></td>' +
                    '<td>' + esc(c.payeeName || '—') + '</td>' +
                    '<td>' + esc(bankName(c.bankId)) + '</td>' +
                    '<td class="num">' + money(c.amount) + '</td>' +
                    '<td class="actions-cell">' +
                      '<button class="btn xs" data-action="cheque-open" data-id="' + esc(c.id) + '">Open</button>' +
                    '</td>' +
                  '</tr>'
                ).join('') +
              '</tbody></table></div>' +
            '</div>';
          }).join('') +
          '<div class="card" style="text-align:right">' +
            '<strong>Grand Total: ' + money(total) + '</strong>' +
          '</div>'
        : '<div class="card"><div class="empty"><span class="big">📅</span>' +
          'No upcoming cheques in the next ' + days + ' days.</div></div>');
  }

  /* ═══════════════════════════════════════════════════════════════════════
     4. REPORT 2 — CASH-FLOW PROJECTION
     ═══════════════════════════════════════════════════════════════════════ */
  function renderRptCashflow() {
    const f = state.filters.rptCashflow || {};
    const days = num(f.days) || 30;
    const group = f.group || 'day';   /* day | week | month */
    const bankId = f.bankId || 'all';

    const banks = bankId === 'all'
      ? arr(state.data.banks).filter(b => b.active !== false)
      : [bankObj(bankId)].filter(Boolean);

    /* Filter cheques: scheduled + approved (approved may still clear) */
    let cheques = arr(state.data.cheques)
      .filter(c => c.status === 'scheduled' || c.status === 'approved')
      .filter(c => c.chequeDate >= today() && c.chequeDate <= shiftDate(today(), days));
    if (bankId !== 'all') cheques = cheques.filter(c => c.bankId === bankId);

    /* Build rows per period */
    const periods = buildPeriods(today(), days, group);
    const rows = periods.map(p => {
      const inPeriod = cheques.filter(c => c.chequeDate >= p.from && c.chequeDate <= p.to);
      const scheduled = inPeriod.filter(c => c.status === 'scheduled');
      const approved  = inPeriod.filter(c => c.status === 'approved');
      return {
        label: p.label,
        from: p.from,
        to: p.to,
        scheduledCount: scheduled.length,
        scheduledTotal: scheduled.reduce((s, c) => s + num(c.amount), 0),
        approvedCount: approved.length,
        approvedTotal: approved.reduce((s, c) => s + num(c.amount), 0)
      };
    });

    /* Compute running projection */
    const openingBank = banks.reduce((s, b) => s + bankBalances(b.id).bank, 0);
    const openingBook = banks.reduce((s, b) => s + bankBalances(b.id).book, 0);

    let runningBank = openingBank;
    let runningBook = openingBook;

    rows.forEach(r => {
      r.openingBank = runningBank;
      r.openingBook = runningBook;
      /* Approved already came out of book but not bank — account for both */
      runningBank -= r.approvedTotal;
      runningBook -= r.scheduledTotal + r.approvedTotal;
      r.closingBank = runningBank;
      r.closingBook = runningBook;
      r.shortfall = r.closingBook < 0;
    });

    const anyShortfall = rows.some(r => r.shortfall);
    const minRow = rows.reduce((m, r) => (m === null || r.closingBook < m.closingBook) ? r : m, null);

    return '' +
      reportHeader({
        title: '📈 Cash-flow Projection — next ' + days + ' days',
        exportAction: 'rpt-cashflow-export',
        filters:
          '<label class="field" style="min-width:130px">Range' +
            '<select id="cfDays">' +
              [7, 14, 30, 60, 90, 180].map(d =>
                '<option value="' + d + '"' + (days === d ? ' selected' : '') + '>Next ' + d + ' days</option>'
              ).join('') +
            '</select>' +
          '</label>' +
          '<label class="field" style="min-width:130px">Group' +
            '<select id="cfGroup">' +
              '<option value="day"' + (group === 'day' ? ' selected' : '') + '>Daily</option>' +
              '<option value="week"' + (group === 'week' ? ' selected' : '') + '>Weekly</option>' +
              '<option value="month"' + (group === 'month' ? ' selected' : '') + '>Monthly</option>' +
            '</select>' +
          '</label>' +
          '<label class="field" style="min-width:150px">Bank' +
            '<select id="cfBank">' +
              '<option value="all"' + (bankId === 'all' ? ' selected' : '') + '>All banks</option>' +
              arr(state.data.banks).map(b =>
                '<option value="' + esc(b.id) + '"' + (bankId === b.id ? ' selected' : '') + '>' + esc(b.name) + '</option>'
              ).join('') +
            '</select>' +
          '</label>'
      }) +

      '<div class="kpi-strip">' +
        '<div class="kpi"><div class="k-label">Opening Bank</div>' +
          '<div class="k-value" style="font-size:18px">' + money(openingBank) + '</div></div>' +
        '<div class="kpi"><div class="k-label">Opening Book</div>' +
          '<div class="k-value" style="font-size:18px;color:var(--accent)">' + money(openingBook) + '</div></div>' +
        '<div class="kpi ' + (anyShortfall ? 'danger' : '') + '">' +
          '<div class="k-label">Lowest Book</div>' +
          '<div class="k-value" style="font-size:18px;color:' +
            (minRow && minRow.closingBook < 0 ? 'var(--red)' : 'var(--green)') + '">' +
            (minRow ? money(minRow.closingBook) : '—') + '</div>' +
          '<div class="k-sub">' + (minRow ? minRow.label : '') + '</div>' +
        '</div>' +
        '<div class="kpi ' + (anyShortfall ? 'danger' : '') + '">' +
          '<div class="k-label">Shortfall?</div>' +
          '<div class="k-value">' + (anyShortfall ? '⚠ Yes' : '✓ No') + '</div>' +
        '</div>' +
      '</div>' +

      (rows.length
        ? '<div class="card">' +
            '<div class="table-wrap"><table>' +
              '<thead><tr>' +
                '<th>Period</th>' +
                '<th class="num">Scheduled</th>' +
                '<th class="num">Approved</th>' +
                '<th class="num">Opening Book</th>' +
                '<th class="num">Closing Book</th>' +
                '<th class="num">Closing Bank</th>' +
                '<th>Alert</th>' +
              '</tr></thead><tbody>' +
              rows.map(r =>
                '<tr' + (r.shortfall ? ' style="background:var(--red-soft)"' : '') + '>' +
                  '<td>' + esc(r.label) + '</td>' +
                  '<td class="num">' + (r.scheduledTotal > 0 ? money(r.scheduledTotal) + ' <span class="small muted">(' + r.scheduledCount + ')</span>' : '—') + '</td>' +
                  '<td class="num">' + (r.approvedTotal > 0 ? money(r.approvedTotal) + ' <span class="small muted">(' + r.approvedCount + ')</span>' : '—') + '</td>' +
                  '<td class="num">' + money(r.openingBook) + '</td>' +
                  '<td class="num" style="font-weight:600;color:' + (r.closingBook < 0 ? 'var(--red)' : 'var(--text)') + '">' + money(r.closingBook) + '</td>' +
                  '<td class="num" style="color:var(--text-3)">' + money(r.closingBank) + '</td>' +
                  '<td>' + (r.shortfall
                    ? '<span class="badge red">Shortfall</span>'
                    : (r.closingBook < 100000 ? '<span class="badge amber">Low</span>' : '<span class="badge green">OK</span>')) + '</td>' +
                '</tr>'
              ).join('') +
            '</tbody></table></div>' +
          '</div>'
        : '<div class="card"><div class="empty">No scheduled or approved cheques in this range.</div></div>');
  }

  function buildPeriods(startDate, days, group) {
    const out = [];
    const start = new Date(startDate + 'T00:00:00');

    if (group === 'day') {
      for (let i = 0; i < days; i++) {
        const d = new Date(start);
        d.setDate(d.getDate() + i);
        const iso = d.toISOString().slice(0, 10);
        out.push({ from: iso, to: iso, label: d.toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' }) });
      }
    } else if (group === 'week') {
      let cur = new Date(start);
      while (cur < addDays(start, days)) {
        const end = new Date(cur);
        end.setDate(end.getDate() + 6);
        const to = end > addDays(start, days - 1) ? addDays(start, days - 1) : end;
        out.push({
          from: cur.toISOString().slice(0, 10),
          to: to.toISOString().slice(0, 10),
          label: 'Week of ' + cur.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' })
        });
        cur = new Date(end);
        cur.setDate(cur.getDate() + 1);
      }
    } else {
      let cur = new Date(start.getFullYear(), start.getMonth(), 1);
      while (cur < addDays(start, days)) {
        const monthEnd = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
        out.push({
          from: cur.toISOString().slice(0, 10),
          to: monthEnd.toISOString().slice(0, 10),
          label: cur.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' })
        });
        cur.setMonth(cur.getMonth() + 1);
      }
    }
    return out;
  }

  function addDays(d, n) {
    const x = new Date(d);
    x.setDate(x.getDate() + n);
    return x;
  }

  /* ═══════════════════════════════════════════════════════════════════════
     7. REPORT 5 — BANK STATEMENT (running balance)
     ═══════════════════════════════════════════════════════════════════════ */
  function renderRptBankStatement() {
    const f = state.filters.rptBankStatement || {};
    const bankId = f.bankId || (arr(state.data.banks)[0]?.id || '');
    const from = f.from || shiftDate(today(), -30);
    const to = f.to || today();

    const bank = bankId ? bankObj(bankId) : null;
    if (!bank) return reportHeader({ title: '🏦 Bank Statement' }) +
      '<div class="card"><div class="empty">Select a bank.</div></div>';

    /* Opening balance on `from` (before movements in range) */
    let opening = num(bank.openingBalance);

    /* Apply all cleared cheques + adjustments BEFORE from date */
    arr(state.data.bankAdjustments).forEach(a => {
      if (a.bankId !== bankId) return;
      if (a.date >= from) return;
      opening += num(a.signedAmount !== undefined ? a.signedAmount : a.amount);
    });
    arr(state.data.cheques).forEach(c => {
      if (c.bankId !== bankId) return;
      if (c.status !== 'cleared') return;
      const clearedOn = c.clearedAt ? c.clearedAt.slice(0, 10) : c.chequeDate;
      if (clearedOn >= from) return;
      opening -= num(c.amount);
    });

    /* Build movement rows in range */
    const rows = [];

    /* Cleared cheques */
    arr(state.data.cheques).forEach(c => {
      if (c.bankId !== bankId) return;
      if (c.status !== 'cleared') return;
      const on = c.clearedAt ? c.clearedAt.slice(0, 10) : c.chequeDate;
      if (on < from || on > to) return;
      rows.push({
        date: on,
        type: 'Cheque',
        ico: '📝',
        ref: c.chequeNo,
        desc: 'Cheque — ' + (c.payeeName || ''),
        debit: num(c.amount),
        credit: 0,
        source: 'cheque',
        sourceId: c.id
      });
    });

    /* Adjustments */
    arr(state.data.bankAdjustments).forEach(a => {
      if (a.bankId !== bankId) return;
      if (a.date < from || a.date > to) return;
      const signed = num(a.signedAmount !== undefined ? a.signedAmount : a.amount);
      rows.push({
        date: a.date,
        type: 'Adjustment',
        ico: '🔧',
        ref: a.reference || '',
        desc: (a.reason || 'Adjustment'),
        debit: signed < 0 ? Math.abs(signed) : 0,
        credit: signed > 0 ? signed : 0,
        source: 'adjustment',
        sourceId: a.id
      });
    });

    /* Bank statement transactions that matched (imported) — show as info rows if unmatched */
    arr(state.data.bankTransactions).forEach(t => {
      if (t.bankId !== bankId) return;
      if (t.date < from || t.date > to) return;
      /* Only show unmatched/ignored imports so we don't double-count the matched ones */
      if (t.matchState === 'matched') return;
      rows.push({
        date: t.date,
        type: 'Imported',
        ico: '📥',
        ref: t.reference || '',
        desc: t.description || 'Imported transaction',
        debit: t.direction === 'debit' ? num(t.amount) : 0,
        credit: t.direction === 'credit' ? num(t.amount) : 0,
        source: 'transaction',
        sourceId: t.id,
        infoOnly: true
      });
    });

    rows.sort((a, b) => a.date.localeCompare(b.date));

    let running = opening;
    rows.forEach(r => {
      if (r.infoOnly) {
        r.balance = running;
      } else {
        running += r.credit - r.debit;
        r.balance = running;
      }
    });

    const totalDebit = rows.filter(r => !r.infoOnly).reduce((s, r) => s + r.debit, 0);
    const totalCredit = rows.filter(r => !r.infoOnly).reduce((s, r) => s + r.credit, 0);
    const closing = running;

    return '' +
      reportHeader({
        title: '🏦 Bank Statement — ' + esc(bank.name),
        exportAction: 'rpt-statement-export',
        filters:
          '<label class="field" style="min-width:160px">Bank' +
            '<select id="stBank">' +
              arr(state.data.banks).map(b =>
                '<option value="' + esc(b.id) + '"' + (bankId === b.id ? ' selected' : '') + '>' + esc(b.name) + '</option>'
              ).join('') +
            '</select>' +
          '</label>' +
          '<label class="field" style="min-width:130px">From' +
            '<input type="date" id="stFrom" value="' + esc(from) + '">' +
          '</label>' +
          '<label class="field" style="min-width:130px">To' +
            '<input type="date" id="stTo" value="' + esc(to) + '">' +
          '</label>'
      }) +

      '<div class="kpi-strip">' +
        '<div class="kpi"><div class="k-label">Opening</div>' +
          '<div class="k-value" style="font-size:18px">' + money(opening) + '</div>' +
          '<div class="k-sub">' + dateFmt(from) + '</div>' +
        '</div>' +
        '<div class="kpi"><div class="k-label">Debits</div>' +
          '<div class="k-value" style="font-size:18px;color:var(--red)">' + money(totalDebit) + '</div></div>' +
        '<div class="kpi"><div class="k-label">Credits</div>' +
          '<div class="k-value" style="font-size:18px;color:var(--green)">' + money(totalCredit) + '</div></div>' +
        '<div class="kpi"><div class="k-label">Closing</div>' +
          '<div class="k-value" style="font-size:18px">' + money(closing) + '</div>' +
          '<div class="k-sub">' + dateFmt(to) + '</div>' +
        '</div>' +
      '</div>' +

      (rows.length
        ? '<div class="card">' +
            '<div class="table-wrap"><table>' +
              '<thead><tr>' +
                '<th>Date</th><th>Type</th><th>Reference</th><th>Description</th>' +
                '<th class="num">Debit</th><th class="num">Credit</th>' +
                '<th class="num">Balance</th>' +
              '</tr></thead><tbody>' +
              '<tr style="background:var(--surface-2)">' +
                '<td colspan="6"><strong>Opening Balance</strong></td>' +
                '<td class="num"><strong>' + money(opening) + '</strong></td>' +
              '</tr>' +
              rows.map(r =>
                '<tr' + (r.infoOnly ? ' style="opacity:.7"' : '') + '>' +
                  '<td>' + dateFmt(r.date) + '</td>' +
                  '<td><span class="small">' + r.ico + ' ' + esc(r.type) + '</span>' + (r.infoOnly ? ' <span class="badge amber">Info</span>' : '') + '</td>' +
                  '<td class="mono small">' + esc(r.ref || '—') + '</td>' +
                  '<td>' + esc(r.desc) + '</td>' +
                  '<td class="num" style="color:var(--red)">' + (r.debit ? money(r.debit) : '') + '</td>' +
                  '<td class="num" style="color:var(--green)">' + (r.credit ? money(r.credit) : '') + '</td>' +
                  '<td class="num"><strong>' + money(r.balance) + '</strong></td>' +
                '</tr>'
              ).join('') +
            '</tbody>' +
            '<tfoot><tr>' +
              '<td colspan="4" style="text-align:right">MOVEMENT</td>' +
              '<td class="num">' + money(totalDebit) + '</td>' +
              '<td class="num">' + money(totalCredit) + '</td>' +
              '<td class="num">' + money(closing) + '</td>' +
            '</tr></tfoot></table></div>' +
          '</div>'
        : '<div class="card"><div class="empty">No movements in this range.</div></div>');
  }

        exportAction: 'rpt-bounced-export',

     ═══════════════════════════════════════════════════════════════════════ */
  function renderRptPayeeHistory() {
    const f = state.filters.rptPayeeHistory || {};
    const type = f.type || 'all';
    const from = f.from || '';
    const to = f.to || '';

    /* Compute totals from cheques (all statuses except cancelled/void) */
    const payees = arr(state.data.payees).filter(p => type === 'all' || p.type === type);
    const chequeIndex = {};

    arr(state.data.cheques).forEach(c => {
      if (['cancelled', 'void'].includes(c.status)) return;
      if (from && c.chequeDate < from) return;
      if (to && c.chequeDate > to) return;
      const pid = c.payeeId;
      if (!pid) return;
      if (!chequeIndex[pid]) chequeIndex[pid] = { count: 0, total: 0, cleared: 0, approved: 0, pending: 0, bounced: 0 };
      const b = chequeIndex[pid];
      b.count++;
      b.total += num(c.amount);
      if (c.status === 'cleared') b.cleared += num(c.amount);
      else if (c.status === 'approved') b.approved += num(c.amount);
      else if (c.status === 'bounced') b.bounced += num(c.amount);
      else b.pending += num(c.amount);
    });

    const list = payees.map(p => Object.assign({ payee: p }, chequeIndex[p.id] || { count: 0, total: 0, cleared: 0, approved: 0, pending: 0, bounced: 0 }));
    list.sort((a, b) => b.total - a.total);

    const grandTotal = list.reduce((s, x) => s + x.total, 0);
    const grandCount = list.reduce((s, x) => s + x.count, 0);

  /* ═══════════════════════════════════════════════════════════════════════
     11. REPORT 9 — MONTHLY CHEQUE SUMMARY
     ═══════════════════════════════════════════════════════════════════════ */
  function renderRptMonthly() {
    const f = state.filters.rptMonthly || {};
    const months = num(f.months) || 12;
    const bankId = f.bankId || 'all';

    /* Build the list of last N months */
    const now = new Date();
    const periodList = [];
    for (let i = months - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      periodList.push({
        ym: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'),
        label: d.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' })
      });
    }

    let cheques = arr(state.data.cheques);
    if (bankId !== 'all') cheques = cheques.filter(c => c.bankId === bankId);

    const byMonth = groupByMonth(cheques, 'chequeDate');

    const rows = periodList.map(p => {
      const list = byMonth[p.ym] || [];
      const written = list.filter(c => c.status !== 'cancelled');
      const cleared = list.filter(c => c.status === 'cleared');
      const bounced = list.filter(c => c.status === 'bounced');
      const cancelled = list.filter(c => c.status === 'cancelled');
      return {
        label: p.label,
        writtenCount: written.length,
        writtenTotal: written.reduce((s, c) => s + num(c.amount), 0),
        clearedCount: cleared.length,
        clearedTotal: cleared.reduce((s, c) => s + num(c.amount), 0),
        bouncedCount: bounced.length,
        bouncedTotal: bounced.reduce((s, c) => s + num(c.amount), 0),
        cancelledCount: cancelled.length
      };
    });

    const totals = rows.reduce((acc, r) => {
      acc.writtenCount += r.writtenCount;
      acc.writtenTotal += r.writtenTotal;
      acc.clearedCount += r.clearedCount;
      acc.clearedTotal += r.clearedTotal;
      acc.bouncedCount += r.bouncedCount;
      acc.bouncedTotal += r.bouncedTotal;
      acc.cancelledCount += r.cancelledCount;
      return acc;
    }, { writtenCount: 0, writtenTotal: 0, clearedCount: 0, clearedTotal: 0, bouncedCount: 0, bouncedTotal: 0, cancelledCount: 0 });

    return '' +
      reportHeader({
        title: '📊 Monthly Cheque Summary — last ' + months + ' months',
        exportAction: 'rpt-monthly-export',
        filters:
          '<label class="field" style="min-width:150px">Months' +
            '<select id="mnMonths">' +
              [3, 6, 12, 24, 36].map(m =>
                '<option value="' + m + '"' + (months === m ? ' selected' : '') + '>Last ' + m + ' months</option>'
              ).join('') +
            '</select>' +
          '</label>' +
          '<label class="field" style="min-width:150px">Bank' +
            '<select id="mnBank">' +
              '<option value="all"' + (bankId === 'all' ? ' selected' : '') + '>All banks</option>' +
              arr(state.data.banks).map(b =>
                '<option value="' + esc(b.id) + '"' + (bankId === b.id ? ' selected' : '') + '>' + esc(b.name) + '</option>'
              ).join('') +
            '</select>' +
          '</label>'
      }) +

      '<div class="card">' +
        '<div class="table-wrap"><table>' +
          '<thead><tr>' +
            '<th>Month</th>' +
            '<th class="num">Written</th><th class="num">Value</th>' +
            '<th class="num">Cleared</th><th class="num">Cleared Value</th>' +
            '<th class="num">Bounced</th><th class="num">Cancelled</th>' +
          '</tr></thead><tbody>' +
          rows.map(r =>
            '<tr>' +
              '<td><strong>' + esc(r.label) + '</strong></td>' +
              '<td class="num">' + r.writtenCount + '</td>' +
              '<td class="num"><strong>' + money(r.writtenTotal) + '</strong></td>' +
              '<td class="num" style="color:var(--green)">' + r.clearedCount + '</td>' +
              '<td class="num" style="color:var(--green)">' + money(r.clearedTotal) + '</td>' +
              '<td class="num" style="color:' + (r.bouncedCount ? 'var(--red)' : 'var(--text-4)') + '">' +
                (r.bouncedCount || '—') + '</td>' +
              '<td class="num" style="color:var(--text-3)">' +
                (r.cancelledCount || '—') + '</td>' +
            '</tr>'
          ).join('') +
        '</tbody>' +
        '<tfoot><tr>' +
          '<td style="text-align:right">TOTAL</td>' +
          '<td class="num">' + totals.writtenCount + '</td>' +
          '<td class="num">' + money(totals.writtenTotal) + '</td>' +
          '<td class="num">' + totals.clearedCount + '</td>' +
          '<td class="num">' + money(totals.clearedTotal) + '</td>' +
          '<td class="num">' + totals.bouncedCount + '</td>' +
          '<td class="num">' + totals.cancelledCount + '</td>' +
        '</tr></tfoot></table></div>' +
      '</div>';
  }

  /* ═══════════════════════════════════════════════════════════════════════
     12. REPORT 10 — CASH-FLOW FORECAST with shortfall alerts
     ═══════════════════════════════════════════════════════════════════════ */
  function renderRptForecast() {
    const f = state.filters.rptForecast || {};
    const horizon = num(f.horizon) || 30;

    const openingBank = totalBankBalance().bank;
    const openingBook = totalBankBalance().book;

    /* Scheduled cheques within horizon */
    const end = shiftDate(today(), horizon);
    const cheques = arr(state.data.cheques)
      .filter(c => (c.status === 'scheduled' || c.status === 'approved'))
      .filter(c => c.chequeDate >= today() && c.chequeDate <= end);

    /* Group by day */
    const byDay = {};
    cheques.forEach(c => {
      if (!byDay[c.chequeDate]) byDay[c.chequeDate] = { scheduled: 0, approved: 0, count: 0 };
      if (c.status === 'scheduled') byDay[c.chequeDate].scheduled += num(c.amount);
      if (c.status === 'approved')  byDay[c.chequeDate].approved += num(c.amount);
      byDay[c.chequeDate].count++;
    });

    /* Walk day by day, detect crossing below 0 or below a safety buffer */
    const daily = [];
    let runningBook = openingBook;
    let runningBank = openingBank;
    let firstShortfall = null;
    let lowest = { book: openingBook, date: null };

    for (let i = 0; i <= horizon; i++) {
      const d = shiftDate(today(), i);
      const dayData = byDay[d] || { scheduled: 0, approved: 0, count: 0 };
      runningBank -= dayData.approved;
      runningBook -= dayData.scheduled + dayData.approved;

      daily.push({
        date: d,
        scheduled: dayData.scheduled,
        approved: dayData.approved,
        count: dayData.count,
        closingBank: runningBank,
        closingBook: runningBook,
        isShortfall: runningBook < 0,
        isLow: runningBook >= 0 && runningBook < 50000
      });

      if (runningBook < lowest.book) {
        lowest = { book: runningBook, date: d };
      }
      if (runningBook < 0 && !firstShortfall) {
        firstShortfall = { date: d, book: runningBook };
      }
    }

    /* Only show days with movement + boundaries for a shorter table */
    const activeDays = daily.filter((d, i) => d.count > 0 || i === 0 || i === daily.length - 1);

    return '' +
      reportHeader({
        title: '🔮 Cash-flow Forecast — next ' + horizon + ' days',
        exportAction: 'rpt-forecast-export',
        filters:
          '<label class="field" style="min-width:150px">Horizon' +
            '<select id="fcHorizon">' +
              [7, 14, 30, 60, 90].map(h =>
                '<option value="' + h + '"' + (horizon === h ? ' selected' : '') + '>Next ' + h + ' days</option>'
              ).join('') +
            '</select>' +
          '</label>'
      }) +

      '<div class="kpi-strip">' +
        '<div class="kpi"><div class="k-label">Opening Bank</div>' +
          '<div class="k-value" style="font-size:16px">' + money(openingBank) + '</div></div>' +
        '<div class="kpi"><div class="k-label">Opening Book</div>' +
          '<div class="k-value" style="font-size:16px;color:var(--accent)">' + money(openingBook) + '</div></div>' +
        '<div class="kpi ' + (firstShortfall ? 'danger' : '') + '">' +
          '<div class="k-label">First Shortfall</div>' +
          '<div class="k-value" style="font-size:14px">' +
            (firstShortfall ? dateFmt(firstShortfall.date) : '— None —') + '</div>' +
          '<div class="k-sub">' +
            (firstShortfall ? money(firstShortfall.book) : 'Safe') + '</div>' +
        '</div>' +
        '<div class="kpi">' +
          '<div class="k-label">Lowest Book</div>' +
          '<div class="k-value" style="font-size:14px;color:' +
            (lowest.book < 0 ? 'var(--red)' : 'var(--green)') + '">' +
            money(lowest.book) + '</div>' +
          '<div class="k-sub">' + (lowest.date ? dateFmt(lowest.date) : '') + '</div>' +
        '</div>' +
      '</div>' +

      (firstShortfall
        ? '<div class="alert" style="background:var(--red-soft);color:var(--red);padding:14px 16px;' +
          'border-radius:var(--r-md);margin-bottom:16px;font-weight:600">' +
          '⚠ Shortfall detected on ' + dateFmt(firstShortfall.date) + ' — ' +
          money(Math.abs(firstShortfall.book)) + ' short. Review scheduled cheques.' +
          '</div>'
        : '<div class="alert" style="background:var(--green-soft);color:var(--green);padding:14px 16px;' +
          'border-radius:var(--r-md);margin-bottom:16px;font-weight:600">' +
          '✓ No shortfall expected in the next ' + horizon + ' days.' +
          '</div>') +

      '<div class="card">' +
        '<div class="table-wrap"><table>' +
          '<thead><tr>' +
            '<th>Date</th><th class="num">Cheques</th>' +
            '<th class="num">Scheduled</th><th class="num">Approved</th>' +
            '<th class="num">Closing Bank</th><th class="num">Closing Book</th>' +
            '<th>Alert</th>' +
          '</tr></thead><tbody>' +
          activeDays.map(d =>
            '<tr' + (d.isShortfall ? ' style="background:var(--red-soft)"' : '') + '>' +
              '<td>' + dateFmt(d.date) + '</td>' +
              '<td class="num">' + (d.count || '—') + '</td>' +
              '<td class="num">' + (d.scheduled ? money(d.scheduled) : '—') + '</td>' +
              '<td class="num">' + (d.approved ? money(d.approved) : '—') + '</td>' +
              '<td class="num">' + money(d.closingBank) + '</td>' +
              '<td class="num" style="font-weight:600;color:' +
                (d.closingBook < 0 ? 'var(--red)' : 'var(--text)') + '">' +
                money(d.closingBook) + '</td>' +
              '<td>' + (d.isShortfall
                ? '<span class="badge red">Shortfall</span>'
                : (d.isLow
                  ? '<span class="badge amber">Low</span>'
                  : '')) + '</td>' +
            '</tr>'
          ).join('') +
        '</tbody></table></div>' +
      '</div>';
  }

      .filter(c => c.status === 'scheduled' || c.status === 'approved')
      .filter(c => c.chequeDate >= today() && c.chequeDate <= shiftDate(today(), days));
    if (bankId !== 'all') cheques = cheques.filter(c => c.bankId === bankId);

    const periods = buildPeriods(today(), days, group);
    const banks = bankId === 'all'
      ? arr(state.data.banks).filter(b => b.active !== false)
      : [bankObj(bankId)].filter(Boolean);

    let runningBook = banks.reduce((s, b) => s + bankBalances(b.id).book, 0);
    let runningBank = banks.reduce((s, b) => s + bankBalances(b.id).bank, 0);

    const rows = [['Period', 'Scheduled Total', 'Approved Total', 'Opening Book', 'Closing Book', 'Closing Bank', 'Shortfall']];
    periods.forEach(p => {
      const inPeriod = cheques.filter(c => c.chequeDate >= p.from && c.chequeDate <= p.to);
      const sched = inPeriod.filter(c => c.status === 'scheduled').reduce((s, c) => s + num(c.amount), 0);
      const appr  = inPeriod.filter(c => c.status === 'approved').reduce((s, c) => s + num(c.amount), 0);
      const opening = runningBook;
      runningBank -= appr;
      runningBook -= sched + appr;
      rows.push([
        p.label, sched.toFixed(2), appr.toFixed(2),
        opening.toFixed(2), runningBook.toFixed(2), runningBank.toFixed(2),
        runningBook < 0 ? 'YES' : ''
      ]);
    });
    downloadCSV(rows, 'cashflow_' + group + '_' + days + 'd');
  }

  function exportRptRegister() {
    const f = state.filters.rptRegister || {};
    const rows = [['Cheque #', 'Date', 'Payee', 'Bank', 'Amount', 'Status', 'Memo', 'Approved At', 'Cleared At', 'Bounced At']];
    let list = arr(state.data.cheques);
    if (f.status && f.status !== 'all') list = list.filter(c => c.status === f.status);
    if (f.bankId && f.bankId !== 'all') list = list.filter(c => c.bankId === f.bankId);
    if (f.from) list = list.filter(c => c.chequeDate >= f.from);
    if (f.to)   list = list.filter(c => c.chequeDate <= f.to);
    list.forEach(c => rows.push([
      c.chequeNo, c.chequeDate, c.payeeName, bankName(c.bankId), num(c.amount).toFixed(2),
      c.status, c.memo || '',
      c.approvedAt || '', c.clearedAt || '', c.bouncedAt || ''
    ]));
    downloadCSV(rows, 'cheque_register');
  }

  function exportRptBookUsage() {
    const rows = [['Book', 'Bank', 'Serial From', 'Serial To', 'Total', 'Available', 'Used', 'Spoiled', 'Printed', 'Void', 'Lost', 'Status']];
    arr(state.data.chequeBooks).forEach(b => {
      const s = bookLeavesSummary(b);
      rows.push([
        b.bookNo, bankName(b.bankId), b.serialStart, b.serialEnd,
        s.total, s.available, s.used, s.spoiled, s.printed, s.void, s.lost,
        b.active !== false ? 'Active' : 'Closed'
      ]);
    });
    downloadCSV(rows, 'cheque_book_usage');
  }

  function exportRptStatement() {
    const f = state.filters.rptBankStatement || {};
    const bankId = f.bankId || (arr(state.data.banks)[0]?.id || '');
    const from = f.from || shiftDate(today(), -30);
    const to = f.to || today();
    if (!bankId) { toast('No bank selected', 'warn'); return; }

    const bank = bankObj(bankId);
    let opening = num(bank.openingBalance);
    arr(state.data.bankAdjustments).forEach(a => {
      if (a.bankId !== bankId) return;
      if (a.date >= from) return;
      opening += num(a.signedAmount !== undefined ? a.signedAmount : a.amount);
    });
    arr(state.data.cheques).forEach(c => {
      if (c.bankId !== bankId || c.status !== 'cleared') return;
      const on = c.clearedAt ? c.clearedAt.slice(0, 10) : c.chequeDate;
      if (on >= from) return;
      opening -= num(c.amount);
    });

    const rows = [['Date', 'Type', 'Reference', 'Description', 'Debit', 'Credit', 'Balance']];
    rows.push([from, 'Opening', '', 'Opening balance', '', '', opening.toFixed(2)]);

    const movements = [];
    arr(state.data.cheques).forEach(c => {
      if (c.bankId !== bankId || c.status !== 'cleared') return;
      const on = c.clearedAt ? c.clearedAt.slice(0, 10) : c.chequeDate;
      if (on < from || on > to) return;
      movements.push({ date: on, type: 'Cheque', ref: c.chequeNo, desc: 'Cheque — ' + (c.payeeName || ''), debit: num(c.amount), credit: 0 });
    });
    arr(state.data.bankAdjustments).forEach(a => {
      if (a.bankId !== bankId) return;
      if (a.date < from || a.date > to) return;
      const signed = num(a.signedAmount !== undefined ? a.signedAmount : a.amount);
      movements.push({
        date: a.date, type: 'Adjustment', ref: a.reference || '', desc: a.reason || 'Adjustment',
        debit: signed < 0 ? Math.abs(signed) : 0, credit: signed > 0 ? signed : 0
      });
    });
    movements.sort((a, b) => a.date.localeCompare(b.date));

    let running = opening;
    movements.forEach(m => {
      running += m.credit - m.debit;
      rows.push([
        m.date, m.type, m.ref, m.desc,
        m.debit ? m.debit.toFixed(2) : '',
        m.credit ? m.credit.toFixed(2) : '',
        running.toFixed(2)
      ]);
    });
    downloadCSV(rows, 'bank_statement_' + (bank.name || 'bank'));
  }

  function exportRptOverdue() {
    const list = chequesNeedingAttention().filter(c => c.chequeDate < today());
    const rows = [['Cheque #', 'Due Date', 'Days Overdue', 'Payee', 'Bank', 'Amount']];
    list.forEach(c => rows.push([
      c.chequeNo, c.chequeDate, diffDays(c.chequeDate, today()),
      c.payeeName, bankName(c.bankId), num(c.amount).toFixed(2)
    ]));
    downloadCSV(rows, 'overdue_approvals');
  }

  function exportRptBounced() {
    const list = arr(state.data.cheques).filter(c => c.status === 'bounced');
    const rows = [['Cheque #', 'Payee', 'Bank', 'Amount', 'Bounced On', 'Reason', 'Re-credited']];
    list.forEach(c => rows.push([
      c.chequeNo, c.payeeName, bankName(c.bankId), num(c.amount).toFixed(2),
      c.bouncedAt ? c.bouncedAt.slice(0, 10) : '', c.bounceReason || '',
      c.bankRecredited ? 'Yes' : (c.bankPendingRecredit ? 'Pending' : 'No')
    ]));
    downloadCSV(rows, 'bounced_cheques');
  }

  function exportRptPayee() {
    const rows = [['Payee', 'Type', 'Phone', 'Email', 'Cheques', 'Total', 'Cleared', 'Approved', 'Pending', 'Bounced']];
    const index = {};
    arr(state.data.cheques).forEach(c => {
      if (['cancelled', 'void'].includes(c.status)) return;
      if (!c.payeeId) return;
      if (!index[c.payeeId]) index[c.payeeId] = { count: 0, total: 0, cleared: 0, approved: 0, pending: 0, bounced: 0 };
      const b = index[c.payeeId];
      b.count++;
      b.total += num(c.amount);
      if (c.status === 'cleared') b.cleared += num(c.amount);
      else if (c.status === 'approved') b.approved += num(c.amount);
      else if (c.status === 'bounced') b.bounced += num(c.amount);
      else b.pending += num(c.amount);
    });

    arr(state.data.payees).forEach(p => {
      const b = index[p.id] || { count: 0, total: 0, cleared: 0, approved: 0, pending: 0, bounced: 0 };
      rows.push([
        p.name, p.type, p.phone || '', p.email || '',
        b.count, b.total.toFixed(2), b.cleared.toFixed(2),
        b.approved.toFixed(2), b.pending.toFixed(2), b.bounced.toFixed(2)
      ]);
    });
    downloadCSV(rows, 'payee_payment_history');
  }

  function exportRptMonthly() {
    const f = state.filters.rptMonthly || {};
    const months = num(f.months) || 12;
    const byMonth = groupByMonth(arr(state.data.cheques), 'chequeDate');

    const rows = [['Month', 'Written Count', 'Written Value', 'Cleared Count', 'Cleared Value', 'Bounced Count', 'Bounced Value', 'Cancelled Count']];
    const now = new Date();
    for (let i = months - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      const label = d.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
      const list = (byMonth[ym] || []).filter(c => c.status !== 'cancelled');
      const cleared = list.filter(c => c.status === 'cleared');
      const bounced = list.filter(c => c.status === 'bounced');
      const cancelled = (byMonth[ym] || []).filter(c => c.status === 'cancelled');
      rows.push([
        label,
        list.length, list.reduce((s, c) => s + num(c.amount), 0).toFixed(2),
        cleared.length, cleared.reduce((s, c) => s + num(c.amount), 0).toFixed(2),
        bounced.length, bounced.reduce((s, c) => s + num(c.amount), 0).toFixed(2),
        cancelled.length
      ]);
    }
    downloadCSV(rows, 'monthly_cheque_summary');
  }

  function exportRptForecast() {
    const f = state.filters.rptForecast || {};
    const horizon = num(f.horizon) || 30;
    const end = shiftDate(today(), horizon);
    const cheques = arr(state.data.cheques)
      .filter(c => (c.status === 'scheduled' || c.status === 'approved'))
      .filter(c => c.chequeDate >= today() && c.chequeDate <= end);

    const openingBank = totalBankBalance().bank;
    const openingBook = totalBankBalance().book;
    let runningBook = openingBook;
    let runningBank = openingBank;

    const rows = [['Date', 'Cheques', 'Scheduled', 'Approved', 'Closing Bank', 'Closing Book', 'Shortfall']];
    const byDay = {};
    cheques.forEach(c => {
      if (!byDay[c.chequeDate]) byDay[c.chequeDate] = { scheduled: 0, approved: 0, count: 0 };
      if (c.status === 'scheduled') byDay[c.chequeDate].scheduled += num(c.amount);
      if (c.status === 'approved')  byDay[c.chequeDate].approved += num(c.amount);
      byDay[c.chequeDate].count++;
    });

    for (let i = 0; i <= horizon; i++) {
      const d = shiftDate(today(), i);
      const data = byDay[d] || { scheduled: 0, approved: 0, count: 0 };
      runningBank -= data.approved;
      runningBook -= data.scheduled + data.approved;
      rows.push([
        d, data.count, data.scheduled.toFixed(2), data.approved.toFixed(2),
        runningBank.toFixed(2), runningBook.toFixed(2),
        runningBook < 0 ? 'SHORTFALL' : ''
      ]);
    }
    downloadCSV(rows, 'cashflow_forecast_' + horizon + 'd');
  }

  /* ═══════════════════════════════════════════════════════════════════════
     4. Schema factory
     ═══════════════════════════════════════════════════════════════════════ */
  function makeHoliday(seed) {
    seed = seed || {};
    return {
      id: seed.id || uid(),
      date: seed.date || today(),
      name: String(seed.name || ''),
      type: ['poya', 'public', 'bank'].includes(seed.type) ? seed.type : 'public',
      source: seed.source || 'manual',        /* 'builtin' | 'api' | 'manual' */
      notes: String(seed.notes || ''),
      createdAt: seed.createdAt || nowISO(),
      createdBy: seed.createdBy || (state.user?.email || 'system'),
      updatedAt: seed.updatedAt || nowISO(),
      updatedBy: seed.updatedBy || (state.user?.email || 'system')
    };
  }
  window.makeHoliday = makeHoliday;

  /* ═══════════════════════════════════════════════════════════════════════
     5. Lookup helpers
     ═══════════════════════════════════════════════════════════════════════ */
  function isHoliday(dateStr) {
    return arr(state.data.holidays).some(h => h.date === dateStr);
  }
  window.isHoliday = isHoliday;

  function holidayOn(dateStr) {
    return arr(state.data.holidays).find(h => h.date === dateStr) || null;
  }
  window.holidayOn = holidayOn;

  function holidaysBetween(fromDate, toDate) {
    return arr(state.data.holidays)
      .filter(h => h.date >= fromDate && h.date <= toDate)
      .sort((a, b) => a.date.localeCompare(b.date));
  }
  window.holidaysBetween = holidaysBetween;

  function upcomingHolidays(days) {
    const to = shiftDate(today(), days || 30);
    return holidaysBetween(today(), to);
  }
  window.upcomingHolidays = upcomingHolidays;

  /* ═══════════════════════════════════════════════════════════════════════
     6. Working-day calculators (skip weekends + holidays)
     ═══════════════════════════════════════════════════════════════════════ */
  function isWeekend(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const dow = d.getDay();
    return dow === 0 || dow === 6;   /* Sun / Sat */
  }
  window.isWeekend = isWeekend;

  function isWorkingDay(dateStr) {
    return !isWeekend(dateStr) && !isHoliday(dateStr);
  }
  window.isWorkingDay = isWorkingDay;

  function nextWorkingDay(dateStr, skipWeekend) {
    let d = dateStr;
    for (let i = 0; i < 30; i++) {
      d = shiftDate(d, 1);
      if (!isHoliday(d)) {
        if (skipWeekend !== false && isWeekend(d)) continue;
        if (skipWeekend === false && isWeekend(d)) return d;   /* caller wants raw next non-holiday */
        return d;
      }
    }
    return d;
  }
  window.nextWorkingDay = nextWorkingDay;

  /* Given a cheque date, what is the actual clearing date at bank? */
  function effectiveClearingDate(chequeDate) {
    if (!chequeDate) return null;
    if (isWorkingDay(chequeDate)) return chequeDate;
    return nextWorkingDay(chequeDate, true);
  }
  window.effectiveClearingDate = effectiveClearingDate;

  /* Human-friendly reason why a date is not a normal working day */
  function nonWorkingReason(dateStr) {
    if (!dateStr) return '';
    const h = holidayOn(dateStr);
    if (h) return h.name + (h.type === 'poya' ? ' (Poya — banks closed)' : ' (holiday — banks closed)');
    if (isWeekend(dateStr)) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.getDay() === 0 ? 'Sunday' : 'Saturday';
    }
    return '';
  }
  window.nonWorkingReason = nonWorkingReason;

  /* ═══════════════════════════════════════════════════════════════════════
     7. Holiday type metadata + badge helper
     ═══════════════════════════════════════════════════════════════════════ */
  const HOLIDAY_TYPES = {
    poya:   { label: 'Poya Day',    ico: '🌕', color: 'purple' },
    public: { label: 'Public',      ico: '🎉', color: 'blue'   },
    bank:   { label: 'Bank Holiday', ico: '🏦', color: 'amber'  }
  };
  window.HOLIDAY_TYPES = HOLIDAY_TYPES;

  function holidayBadge(type) {
    const meta = HOLIDAY_TYPES[type] || HOLIDAY_TYPES.public;
    return '<span class="badge ' + meta.color + '">' + meta.ico + ' ' + esc(meta.label) + '</span>';
  }
  window.holidayBadge = holidayBadge;

  /* ═══════════════════════════════════════════════════════════════════════
     8. Seed built-in holidays if collection is empty
     ═══════════════════════════════════════════════════════════════════════ */
  async function seedHolidaysIfEmpty() {
    if (arr(state.data.holidays).length > 0) return 0;

    let inserted = 0;
    BUILTIN_HOLIDAYS.forEach(h => {
      /* Avoid duplicates by date+name */
      if (arr(state.data.holidays).some(x => x.date === h.date && x.name === h.name)) return;
      const holiday = makeHoliday({
        date: h.date,
        name: h.name,
        type: h.type,
        source: 'builtin'
      });
      state.data.holidays.push(holiday);
      markDirty('holidays', holiday.id);
      inserted++;
    });

    if (inserted) {
      dbg.ok('Seeded ' + inserted + ' holidays');
      /* Push the settings timestamp so we can track */
      state.settings = state.settings || defaultSettings();
      state.settings.calendar = state.settings.calendar || {};
      state.settings.calendar.lastSeededAt = nowISO();
      state.settings.updatedAt = nowISO();
      saveSettings();
    }
    return inserted;
  }
  window.seedHolidaysIfEmpty = seedHolidaysIfEmpty;

  /* ═══════════════════════════════════════════════════════════════════════
     9. Optional API refresh — uses public Google Calendar ICS via non-authenticated
     fetch as a hint. Falls back gracefully if unavailable.
     Only runs once per 24h (cached in localStorage).
     ═══════════════════════════════════════════════════════════════════════ */
  async function tryFetchHolidaysFromAPI() {
    /* Respect 24h cache */
    let lastFetch = 0;
    try { lastFetch = parseInt(localStorage.getItem(HOLIDAY_FETCH_KEY) || '0', 10) || 0; }
    catch (e) {}

    if (Date.now() - lastFetch < HOLIDAY_FETCH_MS) return { skipped: true };

    /* We don't have a guaranteed free SL public holiday API that supports CORS.
       So this is a graceful no-op that still updates the "last attempted" marker.
       The built-in list is our source of truth; user can add/edit manually. */
    try {
      localStorage.setItem(HOLIDAY_FETCH_KEY, String(Date.now()));
    } catch (e) {}

    return { skipped: false, updated: 0 };
  }
  window.tryFetchHolidaysFromAPI = tryFetchHolidaysFromAPI;

  /* ═══════════════════════════════════════════════════════════════════════

  function renderHolidays() {
    const all = arr(state.data.holidays).slice();
    const f = state.filters.holidays || {};
    const year = f.year || String(new Date().getFullYear());
    const type = f.type || 'all';
    const q = (f.q || '').toLowerCase();

    let list = all;
    if (year !== 'all') list = list.filter(h => h.date.slice(0, 4) === year);
    if (type !== 'all') list = list.filter(h => h.type === type);
    if (q) list = list.filter(h => (h.name || '').toLowerCase().indexOf(q) !== -1);
    list.sort((a, b) => a.date.localeCompare(b.date));

    const years = Array.from(new Set(all.map(h => h.date.slice(0, 4)))).sort();
    if (years.indexOf(String(new Date().getFullYear())) === -1) {
      years.push(String(new Date().getFullYear()));
    }
    years.sort();

    /* KPIs */
    const todayStr = today();
    const upcoming = all.filter(h => h.date >= todayStr).sort((a, b) => a.date.localeCompare(b.date));
    const nextHoliday = upcoming[0] || null;
    const poya = all.filter(h => h.type === 'poya').length;

    return '' +

        '<div class="kpi"><div class="k-label">🎉 Public Holidays</div>' +

          '<div class="k-sub">National + religious</div></div>' +
        '<div class="kpi"><div class="k-label">Next Holiday</div>' +
          '<div class="k-value" style="font-size:16px">' +
            (nextHoliday ? esc(nextHoliday.name.slice(0, 22)) : '—') + '</div>' +
          '<div class="k-sub">' +
            (nextHoliday
              ? dateFmt(nextHoliday.date) + ' · ' +
                (diffDays(todayStr, nextHoliday.date) === 0
                  ? 'Today'
                  : 'in ' + diffDays(todayStr, nextHoliday.date) + ' day(s)')
              : 'No upcoming holidays') +
          '</div></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head">' +
          '<h3>📅 Sri Lankan Calendar</h3>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
            '<button class="btn" data-action="holiday-reseed">↺ Re-seed built-in holidays</button>' +
            '<button class="btn" data-action="holiday-export">⬇ Export JSON</button>' +
            '<button class="btn" data-action="holiday-import">⬆ Import JSON</button>' +
            '<button class="btn primary" data-action="holiday-new">＋ New Holiday</button>' +
          '</div>' +
        '</div>' +
        '<div class="md-filter">' +
          '<label class="field">Search' +
            '<input type="search" id="holSearch" value="' + esc(f.q || '') + '" placeholder="Holiday name…">' +
          '</label>' +
          '<label class="field">Year' +
            '<select id="holYear">' +
              '<option value="all"' + (year === 'all' ? ' selected' : '') + '>All years</option>' +
              years.map(y => '<option value="' + esc(y) + '"' + (year === y ? ' selected' : '') + '>' + esc(y) + '</option>').join('') +
            '</select>' +
          '</label>' +

        (list.length
          ? '<div class="table-wrap"><table>' +
              '<thead><tr>' +
                '<th>Date</th><th>Day</th><th>Name</th>' +

              '</tr></thead><tbody>' +
              list.map(h => {
                const isPast = h.date < todayStr;

                const dayName = new Date(h.date + 'T00:00:00')

                  '<td>' + holidayBadge(h.type) + '</td>' +

      (function () {

          '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">' +
            upcoming.map(h => {

              const dayName = d.toLocaleDateString('en-GB', { weekday: 'long' });
              const daysAway = diffDays(todayStr, h.date);
              return '<div style="padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)">' +
                '<div style="font-weight:600;font-size:13px;margin-bottom:4px">' + esc(h.name) + '</div>' +
                '<div class="small muted">' + dateFmt(h.date) + ' · ' + dayName + '</div>' +
                '<div class="small" style="margin-top:6px">' +

                  ' <span class="badge ' + (daysAway <= 3 ? 'red' : (daysAway <= 7 ? 'amber' : 'gray')) + '">' +
                    (daysAway === 0 ? 'Today' : 'in ' + daysAway + 'd') +
                  '</span>' +
                '</div>' +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>';
      })();
  }

  /* ═══════════════════════════════════════════════════════════════════════
     11. MONTH CALENDAR VIEW
     ═══════════════════════════════════════════════════════════════════════ */
  function renderCalendarMonth() {
    const f = state.filters.calendar || {};
    const ym = f.ym || today().slice(0, 7);

    const [year, month] = ym.split('-').map(x => parseInt(x, 10));
    const firstOfMonth = new Date(year, month - 1, 1);
    const lastOfMonth = new Date(year, month, 0);
    const startWeekday = firstOfMonth.getDay();   /* 0 = Sunday */

    const cells = [];
    /* Leading days from previous month */
    for (let i = 0; i < startWeekday; i++) {
      const d = new Date(year, month - 1, 1 - (startWeekday - i));
      cells.push({ date: d, outside: true });
    }
    /* Days of this month */
    for (let d = 1; d <= lastOfMonth.getDate(); d++) {
      cells.push({ date: new Date(year, month - 1, d), outside: false });
    }
    /* Trailing days */
    while (cells.length % 7 !== 0) {
      const d = new Date(year, month - 1, lastOfMonth.getDate() + (cells.length - lastOfMonth.getDate() - startWeekday + 1));
      cells.push({ date: d, outside: true });
    }

    const monthLabel = firstOfMonth.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    const todayStr = today();

    /* Bank charges due this month */
    const monthStart = year + '-' + String(month).padStart(2, '0') + '-01';
    const monthEnd = year + '-' + String(month).padStart(2, '0') + '-' + String(lastOfMonth.getDate()).padStart(2, '0');

    const chequesThisMonth = arr(state.data.cheques)
      .filter(c => c.chequeDate >= monthStart && c.chequeDate <= monthEnd);

    return '' +
      '<div class="card">' +
        '<div class="card-head">' +
          '<h3>📅 ' + esc(monthLabel) + '</h3>' +
          '<div style="display:flex;gap:6px;align-items:center">' +
            '<button class="btn" data-action="cal-prev">←</button>' +
            '<input type="month" id="calPicker" value="' + esc(ym) + '" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)">' +
            '<button class="btn" data-action="cal-next">→</button>' +
          '</div>' +
        '</div>' +

        '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">' +
          ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d =>
            '<div style="text-align:center;padding:8px 0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)">' +
              d +
            '</div>'
          ).join('') +
          cells.map(cell => {
            const dateStr = cell.date.toISOString().slice(0, 10);
            const isToday = dateStr === todayStr;
            const hol = holidayOn(dateStr);
            const chequesOnDay = chequesThisMonth.filter(x => x.chequeDate === dateStr);
            const isWeekendDay = cell.date.getDay() === 0 || cell.date.getDay() === 6;

            let bg = 'var(--surface)';
            let border = 'var(--border)';
            if (hol) {
              if (hol.type === 'poya') bg = 'var(--accent-soft)';
              else if (hol.type === 'public') bg = 'var(--blue-soft)';
              else if (hol.type === 'bank') bg = 'var(--amber-soft)';
              border = 'transparent';
            } else if (isWeekendDay && !cell.outside) {
              bg = 'var(--surface-2)';
            }

            return '<div style="min-height:76px;padding:6px 8px;border:1px solid ' + border + ';' +
              'border-radius:8px;background:' + bg + ';' +
              (isToday ? 'box-shadow:0 0 0 2px var(--accent);' : '') +
              (cell.outside ? 'opacity:.4;' : '') + '">' +
              '<div style="font-size:11px;font-weight:600;color:' +
                (isToday ? 'var(--accent)' : (isWeekendDay ? 'var(--text-4)' : 'var(--text-2)')) + '">' +
                cell.date.getDate() +
              '</div>' +
              (hol
                ? '<div style="font-size:10px;line-height:1.3;margin-top:4px;color:var(--accent-text);font-weight:500">' +
                    esc(hol.name.length > 22 ? hol.name.slice(0, 22) + '…' : hol.name) +
                  '</div>'
                : '') +
              (chequesOnDay.length
                ? '<div style="font-size:10px;margin-top:4px;color:var(--text-3)">' +
                    '📝 ' + chequesOnDay.length + ' cheque' + (chequesOnDay.length > 1 ? 's' : '') +
                  '</div>'
                : '') +
            '</div>';
          }).join('') +
        '</div>' +

        '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--text-3)">' +
          '<div><span style="display:inline-block;width:12px;height:12px;background:var(--accent-soft);border-radius:3px;vertical-align:middle"></span> Poya</div>' +
          '<div><span style="display:inline-block;width:12px;height:12px;background:var(--blue-soft);border-radius:3px;vertical-align:middle"></span> Public</div>' +
          '<div><span style="display:inline-block;width:12px;height:12px;background:var(--amber-soft);border-radius:3px;vertical-align:middle"></span> Bank</div>' +
          '<div><span style="display:inline-block;width:12px;height:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:3px;vertical-align:middle"></span> Weekend</div>' +
        '</div>' +
      '</div>';
  }
  window.renderCalendarMonth = renderCalendarMonth;
