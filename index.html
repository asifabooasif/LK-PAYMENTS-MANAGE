        Object.assign(s, data);
        s.updatedAt = nowISO();
        s.updatedBy = state.user?.email || 'system';
        markDirty('numberSequences', s.id);
      } else {
        const created = makeNumberSequence(data);
        state.data.numberSequences.push(created);
        markDirty('numberSequences', created.id);

  window.renderBackup = renderBackup;

  /* Build payload */
  function buildBackupPayload(scope) {
    const payload = {
      __meta: {
        app: CONFIG.appName,
        version: CONFIG.appVersion,
        schemaVersion: (state.settings?.schemaVersion || 17),
        exportedAt: nowISO(),
        exportedBy: state.user?.email || 'system',
        scope: scope || 'all'
      },
      settings: null,
      data: {}
    };

    if (scope === 'all' || scope === 'settings') {
      payload.settings = JSON.parse(JSON.stringify(state.settings || defaultSettings()));
    }

    const configCollections = ['banks', 'chequeBooks', 'payees', 'numberSequences', 'reportTemplates', 'holidays'];
    const dataCollections = ['cheques', 'bankAdjustments', 'bankTransactions', 'bankImports', 'activityLog', 'auditTrail', 'loginHistory', 'trash'];

    let list = [];
    if (scope === 'all' || scope === 'data') list = list.concat(dataCollections);
    if (scope === 'all' || scope === 'config') list = list.concat(configCollections);
    if (scope === 'all') {
      COLLECTIONS.forEach(c => { if (list.indexOf(c) === -1) list.push(c); });
    }
    if (scope === 'settings') list = [];

    list.forEach(c => {
      if (!Array.isArray(state.data[c])) return;
      payload.data[c] = JSON.parse(JSON.stringify(state.data[c]));
    });

    return payload;
  }

  function exportBackup(scope) {
    try {
      const payload = buildBackupPayload(scope);

      /* Stamp settings lastBackupAt */
      if (scope === 'all' || scope === 'settings') {
        state.settings = state.settings || defaultSettings();
        state.settings.lastBackupAt = nowISO();
        saveSettings();
      }

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'lankashoe_backup_' + (scope || 'all') + '_' + today() + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);

      logActivity({
        action: 'backup_export',
        summary: 'Exported backup (' + (scope || 'all') + ')'
      });

      toast('Backup downloaded', 'success');
    } catch (e) {
      dbg.err('Export failed: ' + e.message);
      toast('Export failed: ' + e.message, 'error');
    }
  }
  window.exportBackup = exportBackup;

  function importBackup(mode) {
    if (!state.perms.settings && state.role !== 'owner' && state.role !== 'admin') {
      toast('Only owner or admin can import backups', 'error');
      return;
    }
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const payload = JSON.parse(String(reader.result || '{}'));
          if (!payload.__meta || !payload.data) {
            toast('Invalid backup file', 'error');
            return;
          }

          const meta = payload.__meta;
          const versionWarning = meta.schemaVersion && meta.schemaVersion !== (state.settings?.schemaVersion || 17);
          if (versionWarning) {
            if (!confirm('Backup was exported from schema v' + meta.schemaVersion +
              ' but you are on v' + (state.settings?.schemaVersion || 17) + '.\n\nContinue anyway?')) return;
          }

          if (mode === 'replace') {
            if (!confirm('REPLACE ALL DATA with this backup?\n\n' +
              'Everything in ' + Object.keys(payload.data).length + ' collection(s) will be wiped and replaced.')) return;
          }

          let inserted = 0, updated = 0, removed = 0;

          /* Apply settings */
          if (payload.settings) {
            state.settings = Object.assign(defaultSettings(), payload.settings);
            state.settings.updatedAt = nowISO();
            state.settings.updatedBy = state.user?.email || 'system';
            await saveSettings();
          }

          /* Apply data */
          Object.keys(payload.data).forEach(col => {
            const incoming = arr(payload.data[col]);
            if (!Array.isArray(state.data[col])) state.data[col] = [];

            if (mode === 'replace') {
              /* Clear existing */
              state.data[col].forEach(ex => {
                _dirty.add(col + ':' + ex.id);
                delete _snapshot[col + ':' + ex.id];
              });
              state.data[col] = [];
              removed += incoming.length;
            }

            incoming.forEach(rec => {
              if (!rec || !rec.id) return;
              const existing = state.data[col].find(x => x.id === rec.id);
              if (existing) {
                Object.assign(existing, rec);
                updated++;
              } else {
                state.data[col].push(rec);
                inserted++;
              }
              markDirty(col, rec.id);
            });
          });

          logActivity({
            action: 'backup_import',
            summary: 'Imported backup (' + mode + ') — ' +
              inserted + ' new, ' + updated + ' updated, ' + removed + ' replaced'
          });

          toast('Imported ' + inserted + ' new, ' + updated + ' updated', 'success', 5000);
          renderApp();
        } catch (e) {
          dbg.err('Import failed: ' + e.message);
          toast('Import failed: ' + e.message, 'error');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }
  window.importBackup = importBackup;

  ['deleteBankById', 'deleteBookById', 'deletePayeeById', 'deleteChequeById', 'deleteAdjustmentById'].forEach(fn => {
    const orig = window[fn];

    window[fn] = function (id) {

      if (fn === 'deleteBankById') { collection = 'banks'; item = bankObj(id); }
      else if (fn === 'deleteBookById') { collection = 'chequeBooks'; item = bookObj(id); }
      else if (fn === 'deletePayeeById') { collection = 'payees'; item = payeeObj(id); }
      else if (fn === 'deleteChequeById') { collection = 'cheques'; item = chequeObj(id); }
      else if (fn === 'deleteAdjustmentById') { collection = 'bankAdjustments'; item = adjObj(id); }

      const r = orig.apply(this, arguments);

      if (item && collection) {

  __LS_registerAction('backup-wipe-data', async () => {

      return;

    if (!confirm('⚠ DANGER — Wipe ALL data from Firestore?\n\nThis deletes everything: banks, cheques, payees, adjustments, etc.\n\nCannot be undone.')) return;
    if (!confirm('Really sure? Type your mind — this is irreversible.')) return;

    let deleted = 0;
    try {
      for (const col of COLLECTIONS) {
        const list = arr(state.data[col]);
        for (let i = 0; i < list.length; i += 450) {
          const batch = firestore.batch();
          list.slice(i, i + 450).forEach(doc => {
            batch.delete(colRef(col).doc(doc.id));
          });
          await batch.commit();
          deleted += Math.min(450, list.length - i);
        }
        state.data[col] = [];
      }
      toast('Wiped ' + deleted + ' records', 'success');
      renderApp();
    } catch (e) {
      dbg.err('Wipe failed: ' + (e.code || e.message));
      toast('Wipe failed: ' + e.message, 'error');

      const aus = document.getElementById('auditSearch');
      if (aus) aus.oninput = () => {
        clearTimeout(aus._t);
        aus._t = setTimeout(() => {
          state.filters.audit = Object.assign({}, state.filters.audit, { q: aus.value });
          renderApp();
        }, 220);
      };
      const auc = document.getElementById('auditCollection');
      if (auc) auc.onchange = () => {
        state.filters.audit = Object.assign({}, state.filters.audit, { collection: auc.value });
        renderApp();
      };
      const aua = document.getElementById('auditAction');
      if (aua) aua.onchange = () => {
        state.filters.audit = Object.assign({}, state.filters.audit, { action: aua.value });
        renderApp();
      };

      /* Activity filters */
      const acs = document.getElementById('activitySearch');
      if (acs) acs.oninput = () => {
        clearTimeout(acs._t);
        acs._t = setTimeout(() => {
          state.filters.activity = Object.assign({}, state.filters.activity, { q: acs.value });
          renderApp();
        }, 220);
      };
    };

    scriptLoaded('S10');
  });

})();
</script>
<!-- ═══════════════════════════════════════════════════════════════════════
     S11 — MULTI-CHEQUE WRITING (BATCH MODE)
     Drops in before </body>, after S10.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════════
     1. Constants
     ═══════════════════════════════════════════════════════════════════════ */
  const MAX_BATCH = 20;             /* hard cap per batch */
  const DEFAULT_ROWS = 3;           /* start with 3 rows */

  /* ═══════════════════════════════════════════════════════════════════════
     2. Modal open — the batch form
     ═══════════════════════════════════════════════════════════════════════ */
  function openBatchChequeForm() {
    if (!state.perms.write) { toast('Read-only role — cannot write cheques', 'error'); return; }

    const banks = arr(state.data.banks).filter(b => b.active !== false);
    if (!banks.length) { toast('Add a bank first', 'warn'); return; }

    const defaultBankId = banks[0].id;

    const body =
      /* ── Batch header ── */
      '<div style="background:var(--accent-soft);border-radius:var(--r-md);padding:12px 16px;' +
        'margin-bottom:16px;font-size:12.5px;color:var(--accent-text);line-height:1.6">' +
        '<strong>ℹ Batch mode</strong> — write up to ' + MAX_BATCH + ' cheques in one go. ' +
        'All cheques share the same bank. Leaves are assigned in order. ' +
        'Each cheque date decides its own status (scheduled vs pending approval).' +
      '</div>' +

      /* ── Shared settings row ── */
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px">' +
        selectField('Bank Account', 'btBank',
          banks.map(b => ({ value: b.id, label: b.name })),
          defaultBankId, { req: true }) +
        '<label class="field">Cheque Book' +
          '<select id="btBook"><option value="">— Manual / No book —</option></select>' +
        '</label>' +
        selectField('Payee Type (default)', 'btPayeeType',
          Object.keys(PAYEE_TYPES).map(k => ({ value: k, label: PAYEE_TYPES[k].ico + ' ' + PAYEE_TYPES[k].label })),
          'supplier') +
      '</div>' +

      /* ── Cheque rows grid ── */
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
        '<strong style="font-size:12.5px">Cheques</strong>' +
        '<div style="display:flex;gap:6px;align-items:center">' +
          '<span class="small muted" id="btRowCount">0 rows</span>' +
          '<button class="btn sm" type="button" id="btAddRow">＋ Add Row</button>' +
        '</div>' +
      '</div>' +

      '<div style="border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden">' +
        '<div style="display:grid;grid-template-columns:38px 32px 1.4fr 1.1fr 1.2fr 1fr 32px;' +
          'gap:0;background:var(--surface-2);font-size:10.5px;font-weight:700;' +
          'text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)">' +
          '<div style="padding:8px 6px;text-align:center">#</div>' +
          '<div style="padding:8px 6px;text-align:center"></div>' +
          '<div style="padding:8px 10px">Payee</div>' +
          '<div style="padding:8px 10px">Cheque #</div>' +
          '<div style="padding:8px 10px;text-align:right">Amount</div>' +
          '<div style="padding:8px 10px">Date</div>' +
          '<div style="padding:8px 6px"></div>' +
        '</div>' +
        '<div id="btRows"></div>' +
      '</div>' +

      /* ── Total bar ── */
      '<div style="margin-top:14px;padding:12px 16px;background:var(--surface-2);border-radius:var(--r-md);' +
        'display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center">' +
        '<div id="btBalanceHint" class="small" style="line-height:1.6"></div>' +
        '<div style="text-align:right">' +
          '<div class="k-label">Total</div>' +
          '<div id="btTotalAmount" style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums">' +
            money(0) + '</div>' +
        '</div>' +
        '<div style="text-align:right">' +
          '<div class="k-label">Cheques</div>' +
          '<div id="btTotalCount" style="font-size:18px;font-weight:700">0</div>' +
        '</div>' +
      '</div>' +

      /* ── Notes ── */
      '<div style="margin-top:14px">' +
        field('Batch Notes (applied to every cheque)', 'btBatchNotes', '',
          { type: 'textarea', placeholder: 'Optional — e.g. "Salary payments Oct 2026"' }) +
      '</div>' +

      /* ── Result area ── */
      '<div id="btResult" style="display:none;margin-top:14px"></div>';

    openModal('📝 Write Multiple Cheques', body, {
      width: 1100,
      footer:
        '<button class="btn" data-close-modal>Cancel</button>' +
        '<button class="btn primary" id="btSaveAllBtn" disabled>Save All Cheques</button>'
    });

    /* ═══ State for this form ═══ */
    const rows = [];   /* each: { id, payeeId, payeeName, payeeType, chequeNo, amount, date, leafIdx } */
    let rowCounter = 0;

    /* ═══ DOM refs ═══ */
    const bankSel = document.getElementById('btBank');
    const bookSel = document.getElementById('btBook');
    const rowsEl  = document.getElementById('btRows');
    const rowCountEl = document.getElementById('btRowCount');
    const totalAmountEl = document.getElementById('btTotalAmount');
    const totalCountEl = document.getElementById('btTotalCount');
    const balanceHintEl = document.getElementById('btBalanceHint');
    const resultEl = document.getElementById('btResult');
    const saveAllBtn = document.getElementById('btSaveAllBtn');

    /* ═══ Refresh books for the selected bank ═══ */
    function refreshBooks() {
      const bid = bankSel.value;
      const books = arr(state.data.chequeBooks).filter(b => b.bankId === bid && b.active !== false);
      bookSel.innerHTML = '<option value="">— Manual / No book —</option>' +
        books.map(b =>
          '<option value="' + esc(b.id) + '">' +
            esc(b.bookNo) + ' (' + esc(b.serialStart) + '–' + esc(b.serialEnd) + ')' +
          '</option>'
        ).join('');
      /* Auto-pick first book if any */
      if (books.length && !bookSel.value) bookSel.value = books[0].id;
      /* Re-assign leaves to all rows */
      reassignLeaves();
    }

    /* ═══ Get next N available leaves from the selected book ═══ */
    function getAvailableLeaves(n) {
      const bkid = bookSel.value;
      if (!bkid) return [];
      const book = bookObj(bkid);
      if (!book) return [];
      const avail = [];
      arr(book.leaves).forEach((leaf, idx) => {
        if (leaf.status === 'available') avail.push({ idx: idx, serial: leaf.serial });
      });
      return avail.slice(0, n);
    }

    /* ═══ Assign leaves sequentially to non-manual rows ═══ */
    function reassignLeaves() {
      const bkid = bookSel.value;
      if (!bkid) {
        rows.forEach(r => { r.leafIdx = null; r.chequeNo = r.chequeNo || ''; });
        renderRows();
        return;
      }
      const leaves = getAvailableLeaves(rows.length);
      rows.forEach((r, i) => {
        if (leaves[i]) {
          r.leafIdx = leaves[i].idx;
          r.chequeNo = leaves[i].serial;
        } else {
          r.leafIdx = null;
        }
      });
      renderRows();
    }

    /* ═══ Add a row ═══ */
    function addRow(seed) {
      if (rows.length >= MAX_BATCH) {
        toast('Maximum ' + MAX_BATCH + ' rows per batch', 'warn');
        return;
      }
      rowCounter++;
      rows.push({
        id: 'r' + rowCounter,
        payeeId: null,
        payeeName: (seed && seed.payeeName) || '',
        payeeType: (seed && seed.payeeType) || 'supplier',
        chequeNo: '',
        amount: 0,
        date: today(),
        leafIdx: null,
        memo: (seed && seed.memo) || ''
      });
      reassignLeaves();
    }

    /* ═══ Remove a row ═══ */
    function removeRow(id) {
      const idx = rows.findIndex(r => r.id === id);
      if (idx === -1) return;
      rows.splice(idx, 1);
      reassignLeaves();
    }

    /* ═══ Render all rows ═══ */
    function renderRows() {
      if (!rows.length) {
        rowsEl.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-4)">' +
          'No rows yet. Click <strong>Add Row</strong> to begin.</div>';
      } else {
        rowsEl.innerHTML = rows.map((r, i) =>
          '<div class="bt-row" data-row-id="' + esc(r.id) + '" style="' +
            'display:grid;grid-template-columns:38px 32px 1.4fr 1.1fr 1.2fr 1fr 32px;' +
            'gap:0;align-items:center;border-top:' + (i === 0 ? 'none' : '1px solid var(--border-2)') + '">' +

            /* Row number */
            '<div style="padding:8px 6px;text-align:center;font-size:11px;' +
              'font-weight:700;color:var(--text-3)">' + (i + 1) + '</div>' +

            /* Payee type icon */
            '<div style="padding:8px 6px;text-align:center;font-size:16px" title="' +
              esc(PAYEE_TYPES[r.payeeType].label) + '">' +
              PAYEE_TYPES[r.payeeType].ico +
            '</div>' +

            /* Payee input */
            '<div style="padding:8px 10px;position:relative">' +
              '<input class="bt-payee" data-row-id="' + esc(r.id) + '" ' +
                'value="' + esc(r.payeeName) + '" ' +
                'placeholder="Type name to search…" autocomplete="off" ' +
                'style="width:100%;padding:7px 10px;border:1px solid var(--border);' +
                'border-radius:6px;background:var(--surface);font-size:12.5px">' +
              '<div class="bt-suggest" data-row-id="' + esc(r.id) + '" ' +
                'style="position:absolute;top:100%;left:10px;right:10px;background:var(--surface);' +
                'border:1px solid var(--border);border-radius:6px;margin-top:4px;max-height:200px;' +
                'overflow-y:auto;z-index:20;box-shadow:var(--shadow-md);display:none"></div>' +
            '</div>' +

            /* Cheque # */
            '<div style="padding:8px 10px">' +
              '<input class="bt-no" data-row-id="' + esc(r.id) + '" ' +
                'value="' + esc(r.chequeNo) + '" ' +
                (r.leafIdx !== null ? 'readonly' : '') +
                ' placeholder="Manual #" ' +
                'style="width:100%;padding:7px 10px;border:1px solid var(--border);' +
                'border-radius:6px;background:' + (r.leafIdx !== null ? 'var(--surface-2)' : 'var(--surface)') + ';' +
                'font-family:var(--mono);font-size:12.5px;' +
                (r.leafIdx !== null ? 'color:var(--text-3);' : '') + '">' +
            '</div>' +

            /* Amount */
            '<div style="padding:8px 10px">' +
              '<input class="bt-amount" data-row-id="' + esc(r.id) + '" type="number" step="0.01" min="0" ' +
                'value="' + (num(r.amount) > 0 ? num(r.amount).toFixed(2) : '') + '" ' +
                'placeholder="0.00" ' +
                'style="width:100%;padding:7px 10px;border:1px solid var(--border);' +
                'border-radius:6px;background:var(--surface);font-size:12.5px;' +
                'text-align:right;font-variant-numeric:tabular-nums">' +
            '</div>' +

            /* Date */
            '<div style="padding:8px 10px">' +
              '<input class="bt-date" data-row-id="' + esc(r.id) + '" type="date" ' +
                'value="' + esc(r.date) + '" ' +
                'style="width:100%;padding:7px 10px;border:1px solid var(--border);' +
                'border-radius:6px;background:var(--surface);font-size:12.5px">' +
            '</div>' +

            /* Remove button */
            '<div style="padding:8px 6px;text-align:center">' +
              '<button class="bt-remove" data-row-id="' + esc(r.id) + '" ' +
                'title="Remove row" ' +
                'style="width:22px;height:22px;border-radius:50%;background:var(--red-soft);' +
                'color:var(--red);border:none;font-size:13px;cursor:pointer;line-height:1">×</button>' +
            '</div>' +
          '</div>'
        ).join('');
      }

      wireRowInputs();
      updateTotals();
    }

    /* ═══ Wire row inputs ═══ */
    function wireRowInputs() {
      /* Payee input — autocomplete + suggestion dropdown */
      document.querySelectorAll('.bt-payee').forEach(inp => {
        const rid = inp.dataset.rowId;
        const sug = document.querySelector('.bt-suggest[data-row-id="' + rid + '"]');

        function showSuggestions() {
          const q = inp.value.trim().toLowerCase();
          if (!q) { sug.style.display = 'none'; return; }
          const matches = arr(state.data.payees)
            .filter(p => p.active !== false)
            .filter(p => (p.name || '').toLowerCase().indexOf(q) !== -1)
            .slice(0, 6);
          let html = matches.map(p =>
            '<div class="bt-sug-item" data-payee-id="' + esc(p.id) + '" data-row-id="' + esc(rid) + '" ' +
              'style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border-2);font-size:12px">' +
              esc(p.name) +
              '<span class="small muted" style="margin-left:6px">' +
                PAYEE_TYPES[p.type].ico + ' ' + esc(PAYEE_TYPES[p.type].label) +
              '</span>' +
            '</div>'
          ).join('');
          html += '<div class="bt-sug-new" data-row-id="' + esc(rid) + '" ' +
            'style="padding:8px 12px;cursor:pointer;color:var(--accent);font-size:12px;font-weight:500">' +
            '＋ Create new: <strong>' + esc(inp.value.trim()) + '</strong>' +
          '</div>';
          sug.innerHTML = html;
          sug.style.display = '';

          /* Wire suggestions */
          sug.querySelectorAll('.bt-sug-item').forEach(it => {
            it.onclick = () => {
              const p = payeeObj(it.dataset.payeeId);
              if (!p) return;
              const row = rows.find(x => x.id === rid);
              if (!row) return;
              row.payeeId = p.id;
              row.payeeName = p.name;
              row.payeeType = p.type;
              if (num(p.lastChequeAmount) > 0 && !num(row.amount)) row.amount = num(p.lastChequeAmount);
              sug.style.display = 'none';
              renderRows();
            };
          });
          sug.querySelectorAll('.bt-sug-new').forEach(it => {
            it.onclick = () => {
              const name = inp.value.trim();
              if (!name) return;
              sug.style.display = 'none';
              quickCreatePayeeInline(name, rid);
            };
          });
        }

        inp.oninput = () => {
          const row = rows.find(x => x.id === rid);
          if (row) { row.payeeName = inp.value; row.payeeId = null; }
          showSuggestions();
          updateTotals();
        };
        inp.onfocus = showSuggestions;
        inp.onblur = () => {
          /* Delay so clicks register */
          setTimeout(() => { sug.style.display = 'none'; }, 200);
        };
      });

      /* Cheque # */
      document.querySelectorAll('.bt-no').forEach(inp => {
        inp.oninput = () => {
          const row = rows.find(x => x.id === inp.dataset.rowId);
          if (row && row.leafIdx === null) row.chequeNo = inp.value;
        };
      });

      /* Amount */
      document.querySelectorAll('.bt-amount').forEach(inp => {
        inp.oninput = () => {
          const row = rows.find(x => x.id === inp.dataset.rowId);
          if (row) row.amount = num(inp.value);
          updateTotals();
        };
      });

      /* Date */
      document.querySelectorAll('.bt-date').forEach(inp => {
        inp.onchange = () => {
          const row = rows.find(x => x.id === inp.dataset.rowId);
          if (row) row.date = inp.value || today();
        };
      });

      /* Remove */
      document.querySelectorAll('.bt-remove').forEach(btn => {
        btn.onclick = () => removeRow(btn.dataset.rowId);
      });
    }

    /* ═══ Update totals + balance hint ═══ */
    function updateTotals() {
      const total = rows.reduce((s, r) => s + num(r.amount), 0);
      const validCount = rows.filter(r =>
        r.payeeName && num(r.amount) > 0 && r.chequeNo
      ).length;

      totalAmountEl.textContent = money(total);
      totalCountEl.textContent = rows.length;
      rowCountEl.textContent = rows.length + ' row' + (rows.length === 1 ? '' : 's');

      /* Balance hint */
      const bid = bankSel.value;
      if (bid) {
        const bal = bankBalances(bid);
        const afterBook = bal.book - total;
        balanceHintEl.innerHTML =
          'Book now: <strong>' + money(bal.book) + '</strong> · ' +
          'After: <strong style="color:' + (afterBook < 0 ? 'var(--red)' : 'var(--green)') + '">' +
          money(afterBook) + '</strong>' +
          (afterBook < 0
            ? '<div style="color:var(--red);font-weight:600;margin-top:2px">⚠ Overdraft by ' +
              money(Math.abs(afterBook)) + '</div>'
            : '');
      } else {
        balanceHintEl.textContent = '';
      }

      /* Save button state */
      const canSave = validCount === rows.length && rows.length > 0;
      saveAllBtn.disabled = !canSave;
    }

    /* ═══ Quick-create payee (inline) ═══ */
    function quickCreatePayeeInline(name, rowId) {
      const row = rows.find(r => r.id === rowId);
      if (!row) return;
      const type = row.payeeType || 'supplier';
      const created = makePayee({
        type: type,
        name: name,
        phone: '',
        email: ''
      });
      state.data.payees.push(created);
      markDirty('payees', created.id);
      row.payeeId = created.id;
      row.payeeName = created.name;
      row.payeeType = created.type;
      toast('Payee created', 'success');
      renderRows();
    }

    /* ═══ Save ALL cheques ═══ */
    async function saveAll() {
      if (!rows.length) { toast('No rows to save', 'warn'); return; }

      /* Validate every row */
      const problems = [];
      const seenNos = new Set();

      rows.forEach((r, i) => {
        const rowNum = i + 1;

        if (!r.payeeName || !r.payeeName.trim()) {
          problems.push('Row ' + rowNum + ': payee name required');
        }
        if (num(r.amount) <= 0) {
          problems.push('Row ' + rowNum + ': amount must be > 0');
        }
        if (!r.chequeNo || !r.chequeNo.trim()) {
          problems.push('Row ' + rowNum + ': cheque number required');
        }
        const key = (r.chequeNo || '').trim();
        if (key && seenNos.has(key)) {
          problems.push('Row ' + rowNum + ': duplicate cheque # ' + key);
        }
        seenNos.add(key);
      });

      if (problems.length) {
        resultEl.style.display = '';
        resultEl.innerHTML =
          '<div style="padding:14px 16px;background:var(--red-soft);color:var(--red);' +
            'border-radius:var(--r-md);font-size:12.5px;line-height:1.7">' +
            '<strong>Fix these ' + problems.length + ' issue(s) first:</strong><br>' +
            problems.map(p => '• ' + esc(p)).join('<br>') +
          '</div>';
        return;
      }

      /* Confirm total overdraft */
      const total = rows.reduce((s, r) => s + num(r.amount), 0);
      const bid = bankSel.value;
      const bal = bankBalances(bid);
      const afterBook = bal.book - total;
      if (afterBook < 0) {
        const ok = confirm(
          '⚠ This batch will push the BOOK balance to ' + money(afterBook) + '\n\n' +
          'Bank balance:      ' + money(bal.bank) + '\n' +
          'Book balance now:  ' + money(bal.book) + '\n' +
          'Batch total:       ' + money(total) + ' (' + rows.length + ' cheques)\n\n' +
          'Continue anyway?'
        );
        if (!ok) return;
      }

      /* Save each row — collect results */
      const batchNotes = document.getElementById('btBatchNotes').value.trim();
      const created = [];
      const failed = [];

      rows.forEach((r, i) => {
        try {
          /* Ensure payee ID is resolved */
          let pid = r.payeeId;
          if (!pid && r.payeeName) {
            const match = arr(state.data.payees).find(p =>
              p.name.toLowerCase() === r.payeeName.toLowerCase().trim()
            );
            if (match) pid = match.id;
          }

          /* Build the cheque */
          const data = {
            chequeNo: r.chequeNo.trim(),
            bankId: bid,
            bookId: bookSel.value || '',
            leafId: r.leafIdx !== null ? r.leafIdx : null,
            payeeId: pid || null,
            payeeType: r.payeeType || 'supplier',
            payeeName: r.payeeName.trim(),
            amount: num(r.amount),
            amountWords: numberToWords(num(r.amount)),
            chequeDate: r.date || today(),
            writtenDate: today(),
            memo: r.memo || '',
            notes: batchNotes
          };

          /* Status decision */
          const isFuture = data.chequeDate > today();
          data.status = isFuture ? 'scheduled' : 'pending_approval';

          /* Create */
          const cheque = makeCheque(data);
          state.data.cheques.push(cheque);
          markDirty('cheques', cheque.id);

          /* Reserve leaf */
          if (window.reserveLeaf) window.reserveLeaf(cheque);

          /* Update payee memory */
          if (window.updatePayeeMemory) window.updatePayeeMemory(cheque, true);

          /* Audit */
          if (window.logActivity) {
            window.logActivity({
              action: 'create',
              collection: 'cheques',
              recordId: cheque.id,
              summary: 'Batch-created cheque ' + cheque.chequeNo + ' — ' + money(cheque.amount)
            });
          }

          created.push(cheque);
        } catch (e) {
          failed.push({ rowIndex: i + 1, row: r, error: e.message || String(e) });
          dbg.warn('Batch row ' + (i + 1) + ' failed: ' + e.message);
        }
      });

      /* Result summary */
      resultEl.style.display = '';
      if (failed.length === 0) {
        resultEl.innerHTML =
          '<div style="padding:14px 16px;background:var(--green-soft);color:var(--green);' +
            'border-radius:var(--r-md);font-size:13px;line-height:1.6">' +
            '<strong>✓ Saved ' + created.length + ' cheque' + (created.length === 1 ? '' : 's') + '</strong><br>' +
            'Total: ' + money(created.reduce((s, c) => s + num(c.amount), 0)) +
            ' · ' +
            created.filter(c => c.status === 'scheduled').length + ' scheduled · ' +
            created.filter(c => c.status === 'pending_approval').length + ' awaiting approval' +
          '</div>';
      } else {
        resultEl.innerHTML =
          '<div style="padding:14px 16px;background:var(--amber-soft);color:var(--amber);' +
            'border-radius:var(--r-md);font-size:12.5px;line-height:1.7">' +
            '<strong>⚠ Partial save — ' + created.length + ' created, ' + failed.length + ' failed</strong><br>' +
            failed.map(f => '• Row ' + f.rowIndex + ': ' + esc(f.error)).join('<br>') +
          '</div>';
      }

      /* Toast */
      toast(
        'Batch saved — ' + created.length + ' cheque' + (created.length === 1 ? '' : 's') +
        (failed.length ? ' (' + failed.length + ' failed)' : ''),
        failed.length ? 'warn' : 'success',
        5000
      );

      /* Refresh the underlying page */
      renderApp();

      /* If all succeeded, close the modal after a short delay */
      if (failed.length === 0) {
        setTimeout(() => {
          closeModal();
          toast('Batch complete', 'success');
        }, 1500);
      }
    }

    /* ═══ Attach header controls ═══ */
    bankSel.onchange = refreshBooks;
    bookSel.onchange = reassignLeaves;
    document.getElementById('btAddRow').onclick = () => addRow();
    saveAllBtn.onclick = saveAll;

    /* ═══ Keyboard shortcuts ═══ */
    const modalRoot = document.querySelector('#modalWrap .modal');
    if (modalRoot) {
      modalRoot.addEventListener('keydown', (e) => {
        /* Ctrl/Cmd+Enter — save all */
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          if (!saveAllBtn.disabled) saveAll();
        }
        /* Alt+N — new row */
        if (e.altKey && (e.key === 'n' || e.key === 'N')) {
          e.preventDefault();
          addRow();
        }
      });
    }

    /* ═══ Initial rows ═══ */
    refreshBooks();
    for (let i = 0; i < DEFAULT_ROWS; i++) addRow();

    /* Focus the first payee input */
    setTimeout(() => {
      const first = document.querySelector('.bt-payee');
      if (first) first.focus();
    }, 100);
  }
  window.openBatchChequeForm = openBatchChequeForm;

  /* ═══════════════════════════════════════════════════════════════════════
     3. Patch the Cheques page — add "Batch Write" button in the header
     ═══════════════════════════════════════════════════════════════════════ */
  const origRenderCheques = REGISTRY.routes.cheques ? REGISTRY.routes.cheques.fn : null;

  function renderChequesWithBatch() {
    if (!origRenderCheques) return '<div class="empty">Cheques view not loaded.</div>';
    const html = origRenderCheques();

    /* Insert the "Batch Write" button next to "Write Cheque" */
    const inject = html.replace(
      '<button class="btn primary" data-action="cheque-new">＋ Write Cheque</button>',
      '<div style="display:flex;gap:6px">' +
        '<button class="btn" data-action="cheque-batch-new">📋 Batch Write</button>' +
        '<button class="btn primary" data-action="cheque-new">＋ Write Cheque</button>' +
      '</div>'
    );
    return inject;
  }

  __LS_addRoute('cheques', 'Cheques', renderChequesWithBatch);

  /* Also inject on the Dashboard's "Write Cheque" button */
  const origDashboard = REGISTRY.routes.dashboard ? REGISTRY.routes.dashboard.fn : null;
  if (origDashboard) {
    function renderDashboardWithBatch() {
      const html = origDashboard();
      return html.replace(
        '<button class="btn primary" data-action="cheque-new">＋ Write Cheque</button>',
        '<div style="display:flex;gap:6px">' +
          '<button class="btn" data-action="cheque-batch-new">📋 Batch</button>' +
          '<button class="btn primary" data-action="cheque-new">＋ Write Cheque</button>' +
        '</div>'
      );
    }
    __LS_addRoute('dashboard', 'Dashboard', renderDashboardWithBatch);
  }

  /* ═══════════════════════════════════════════════════════════════════════
     4. Action registration
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_registerAction('cheque-batch-new', () => openBatchChequeForm());

  /* ═══════════════════════════════════════════════════════════════════════
     5. Init
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_register('S11', function () {
    scriptLoaded('S11');
  });

})();
</script>
<!-- ═══════════════════════════════════════════════════════════════════════
     S10 FIX — Users page renders synchronously
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* Local cache of access doc — populated async, read sync */
  let _accessCache = { allowedEmails: [], userPerms: {} };
  let _accessLoaded = false;

  /* Refresh in the background. Once done, re-render so UI updates. */
  async function refreshAccessCache() {
    try {
      const access = await loadAccess(true);
      _accessCache = access || { allowedEmails: [], userPerms: {} };
      _accessLoaded = true;
      /* Re-render only if the user is currently on the Users page */
      if (state.view === 'users') {
        renderApp();
      }
    } catch (e) {
      dbg.warn('refreshAccessCache: ' + (e.code || e.message));
    }
  }

  /* ─── New sync renderer ─── */
  function renderUsersFixed() {
    if (!state.perms.users) {
      return '<div class="card"><div class="empty"><span class="big">🔒</span>' +
        'You don\'t have permission to manage users.</div></div>';
    }

    /* Kick off background refresh, but render immediately with what we have */
    refreshAccessCache();

    const access = _accessCache;
    const allowed = access.allowedEmails || [];
    const perms = access.userPerms || {};

    /* Build row list from cached access + local users */
    const rows = allowed.map(email => {
      const role = userRole(email, access);
      const p = perms[email] || {};
      const userDoc = arr(state.data.users || []).find(u => (u.email || '').toLowerCase() === email);
      return {
        email: email,
        role: role,
        customPerms: p.perms || null,
        name: userDoc?.name || '',
        photo: userDoc?.photo || '',
        lastLogin: userDoc?.lastLogin || null
      };
    });

    const loginHistory = arr(state.data.loginHistory).slice(0, 10);

    return '' +
      '<div class="kpi-strip">' +
        '<div class="kpi"><div class="k-label">Authorized Emails</div>' +
          '<div class="k-value">' + allowed.length + '</div></div>' +
        '<div class="kpi"><div class="k-label">Roles In Use</div>' +
          '<div class="k-value">' + new Set(rows.map(r => r.role)).size + '</div></div>' +
        '<div class="kpi"><div class="k-label">Your Role</div>' +
          '<div class="k-value" style="font-size:16px;text-transform:capitalize">' + esc(state.role) + '</div></div>' +
        '<div class="kpi"><div class="k-label">Your Permissions</div>' +
          '<div class="k-value" style="font-size:13px;line-height:1.6">' +
            Object.keys(state.perms).filter(k => state.perms[k]).join(' · ') +
          '</div></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head">' +
          '<h3>👥 Authorized Users (' + rows.length + ')</h3>' +
          '<button class="btn primary" data-action="user-add">＋ Add User</button>' +
        '</div>' +
        (rows.length
          ? '<div class="table-wrap"><table>' +
              '<thead><tr>' +
                '<th>User</th><th>Email</th><th>Role</th>' +
                '<th>Custom Perms</th><th>Last Login</th>' +
                '<th class="actions-cell"></th>' +
              '</tr></thead><tbody>' +
              rows.map(r => {
                const initials = (r.name || r.email || '?').slice(0, 1).toUpperCase();
                const isAdminUser = r.email === CONFIG.adminEmail.toLowerCase();
                return '<tr>' +
                  '<td>' +
                    '<div style="display:flex;align-items:center;gap:10px">' +
                      '<div class="user-avatar" style="width:28px;height:28px;font-size:11px">' +
                        (r.photo ? '<img src="' + esc(r.photo) + '" alt="">' : esc(initials)) +
                      '</div>' +
                      '<strong>' + esc(r.name || '—') + '</strong>' +
                    '</div>' +
                  '</td>' +
                  '<td class="small">' + esc(r.email) + '</td>' +
                  '<td>' +
                    '<span class="badge ' +
                      (r.role === 'owner' ? 'purple'
                        : r.role === 'admin' ? 'blue'
                        : r.role === 'manager' ? 'green'
                        : r.role === 'editor' ? 'amber' : 'gray') + '">' +
                      esc(r.role) +
                    '</span>' +
                  '</td>' +
                  '<td class="small">' +
                    (r.customPerms
                      ? Object.keys(r.customPerms).filter(k => r.customPerms[k]).join(', ') || '—'
                      : '<span class="muted">role default</span>') +
                  '</td>' +
                  '<td class="small">' + (r.lastLogin ? dateTimeFmt(r.lastLogin) : '—') + '</td>' +
                  '<td class="actions-cell">' +
                    '<button class="btn xs" data-action="user-edit" data-id="' + esc(r.email) + '">Edit</button>' +
                    (isAdminUser
                      ? ''
                      : ' <button class="btn xs danger" data-action="user-remove" data-id="' + esc(r.email) + '">Remove</button>') +
                  '</td>' +
                '</tr>';
              }).join('') +
            '</tbody></table></div>'
          : '<div class="empty"><span class="big">👥</span>' +
            (!_accessLoaded
              ? 'Loading…'
              : 'No authorized users yet. Click <strong>Add User</strong>.') +
            '</div>') +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head"><h3>📌 Role Reference</h3></div>' +
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>Role</th><th>Write</th><th>Approve</th><th>Delete</th><th>Users</th><th>Settings</th></tr></thead><tbody>' +
          Object.keys(ROLES).map(r => {
            const p = ROLES[r].perms;
            return '<tr>' +
              '<td><strong>' + esc(r) + '</strong></td>' +
              '<td>' + (p.write ? '✓' : '—') + '</td>' +
              '<td>' + (p.approve ? '✓' : '—') + '</td>' +
              '<td>' + (p.delete ? '✓' : '—') + '</td>' +
              '<td>' + (p.users ? '✓' : '—') + '</td>' +
              '<td>' + (p.settings ? '✓' : '—') + '</td>' +
            '</tr>';
          }).join('') +
        '</tbody></table></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head"><h3>🔐 Recent Logins</h3>' +
          '<button class="btn" data-nav="login-history">View all →</button></div>' +
        (loginHistory.length
          ? '<div class="table-wrap"><table>' +
              '<thead><tr><th>When</th><th>Email</th><th>Role</th><th>User Agent</th></tr></thead><tbody>' +
              loginHistory.map(h =>
                '<tr>' +
                  '<td>' + dateTimeFmt(h.at) + '</td>' +
                  '<td class="small">' + esc(h.email) + '</td>' +
                  '<td>' + esc(h.role) + '</td>' +
                  '<td class="small muted" style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
                    esc((h.userAgent || '').slice(0, 80)) + '</td>' +
                '</tr>'
              ).join('') +
            '</tbody></table></div>'
          : '<div class="empty">No login history yet.</div>') +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head"><h3>🛡 Firestore Rules Reminder</h3></div>' +
        '<div class="alert" style="background:var(--surface-2);padding:14px 16px;border-radius:10px;font-size:12.5px;line-height:1.7">' +
          'Client-side access control can be bypassed by anyone with the API key. ' +
          'For true security, publish the rules in your Firebase console → Firestore → Rules.' +
        '</div>' +
      '</div>';
  }

  /* ─── Replace the broken async route ─── */
  __LS_addRoute('users', 'Users', renderUsersFixed);

  /* ─── Fix openUserForm — it was also async ─── */
  function openUserFormFixed(email) {
    if (!state.perms.users) { toast('No permission', 'error'); return; }

    const isNew = !email;
    const em = email || '';
    const access = _accessCache || { allowedEmails: [], userPerms: {} };
    const existing = !isNew ? (access.userPerms[em] || {}) : {};
    const curRole = !isNew ? userRole(em, access) : 'viewer';

    const body =
      (isNew
        ? '<div style="margin-bottom:14px">' +
            '<label class="field">Email' +
              '<input id="uEmail" type="email" placeholder="user@example.com" autocomplete="off">' +
            '</label>' +
          '</div>'
        : '<div style="margin-bottom:14px">' +
            '<div class="k-label">Email</div>' +
            '<div style="font-weight:600;font-size:14px">' + esc(em) + '</div>' +
          '</div>') +

      '<div style="margin-bottom:14px">' +
        selectField('Role', 'uRole',
          Object.keys(ROLES).map(r => ({ value: r, label: r.charAt(0).toUpperCase() + r.slice(1) })),
          curRole,
          { req: true }) +
      '</div>' +

      '<div class="k-label" style="margin:18px 0 8px">Custom Permission Overrides (optional)</div>' +
      '<div class="small muted" style="margin-bottom:10px">' +
        'Leave blank to use the role default. Toggle to override.' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
        ['write', 'approve', 'delete', 'users', 'settings'].map(k => {
          const roleDefault = ROLES[curRole].perms[k];
          const current = existing.perms && existing.perms[k] !== undefined
            ? existing.perms[k]
            : roleDefault;
          return '<label style="display:flex;align-items:center;gap:10px;font-size:13px">' +
            '<input type="checkbox" class="uPerm" data-key="' + k + '" ' + (current ? 'checked' : '') + '>' +
            '<span style="text-transform:capitalize;font-weight:500">' + k + '</span>' +
            '<span class="badge gray">' + (roleDefault ? 'role allows' : 'role denies') + '</span>' +
          '</label>';
        }).join('') +
      '</div>' +

      '<div style="margin-top:18px">' +
        field('Notes', 'uNotes', existing.notes || '', { type: 'textarea' }) +
      '</div>';

    openModal(isNew ? '＋ Add Authorized User' : '✏️ Edit User', body, {
      width: 640,
      footer:
        '<button class="btn" data-close-modal>Cancel</button>' +
        '<button class="btn primary" id="uSaveBtn">' + (isNew ? 'Add' : 'Save') + '</button>'
    });

    document.getElementById('uSaveBtn').onclick = async () => {
      const role = document.getElementById('uRole').value;
      const notes = document.getElementById('uNotes').value.trim();

      let targetEmail = em;
      if (isNew) {
        targetEmail = (document.getElementById('uEmail').value || '').trim().toLowerCase();
        if (!targetEmail || targetEmail.indexOf('@') === -1) {
          toast('Valid email required', 'error');
          return;
        }
        if (targetEmail === CONFIG.adminEmail.toLowerCase()) {
          toast('Admin is always authorized', 'info');
          return;
        }
      }

      const overrides = {};
      let anyOverride = false;
      document.querySelectorAll('.uPerm').forEach(cb => {
        const k = cb.dataset.key;
        const roleDefault = ROLES[role].perms[k];
        if (cb.checked !== roleDefault) {
          overrides[k] = cb.checked;
          anyOverride = true;
        }
      });

      /* Rebuild access doc */
      const newAccess = {
        allowedEmails: (access.allowedEmails || []).slice(),
        userPerms: Object.assign({}, access.userPerms || {})
      };
      if (newAccess.allowedEmails.indexOf(targetEmail) === -1) {
        newAccess.allowedEmails.push(targetEmail);
      }
      newAccess.userPerms[targetEmail] = Object.assign(
        {},
        newAccess.userPerms[targetEmail] || {},
        {
          role: role,
          perms: anyOverride ? overrides : null,
          notes: notes,
          updatedAt: nowISO(),
          updatedBy: state.user?.email || 'system'
        }
      );

      try {
        await docRef(CONFIG.accessPath).set({
          allowedEmails: newAccess.allowedEmails,
          userPerms: newAccess.userPerms,
          updatedAt: nowISO(),
          updatedBy: state.user?.email || 'system'
        });
        try { localStorage.removeItem(CONFIG.accessCacheKey); } catch (e) {}

        if (window.logActivity) {
          window.logActivity({
            action: isNew ? 'user_add' : 'user_update',
            collection: 'access',
            recordId: targetEmail,
            summary: (isNew ? 'Added' : 'Updated') + ' user ' + targetEmail + ' (role: ' + role + ')'
          });
        }

        closeModal();
        toast(isNew ? 'User added' : 'User updated', 'success');
        _accessLoaded = false;
        refreshAccessCache();
      } catch (e) {
        dbg.err('Save user failed: ' + (e.code || e.message));
        toast('Save failed: ' + (e.code || e.message), 'error', 5000);
      }
    };
  }
  window.openUserForm = openUserFormFixed;

  /* Re-register the action handlers to use the fixed versions */
  __LS_registerAction('user-add',    () => openUserFormFixed(null));
  __LS_registerAction('user-edit',   (ev, id) => { ev.stopPropagation(); openUserFormFixed(id); });

  /* ─── Also fix removeUser (it was async) ─── */
  function removeUserFixed(email) {
    if (!state.perms.users) { toast('No permission', 'error'); return; }
    if (!email) return;
    const em = email.toLowerCase();
    if (em === CONFIG.adminEmail.toLowerCase()) {
      toast('Cannot remove the admin', 'error');
      return;
    }
    if (!confirm('Remove ' + em + ' from authorized users?\n\nThey will immediately lose access.')) return;

    /* Use fresh access doc */
    loadAccess(true).then(async (fresh) => {
      const newAccess = {
        allowedEmails: (fresh.allowedEmails || []).filter(x => x !== em),
        userPerms: Object.assign({}, fresh.userPerms || {})
      };
      delete newAccess.userPerms[em];

      try {
        await docRef(CONFIG.accessPath).set({
          allowedEmails: newAccess.allowedEmails,
          userPerms: newAccess.userPerms,
          updatedAt: nowISO(),
          updatedBy: state.user?.email || 'system'
        });
        try { localStorage.removeItem(CONFIG.accessCacheKey); } catch (e) {}

        if (window.logActivity) {
          window.logActivity({
            action: 'user_remove',
            collection: 'access',
            recordId: em,
            summary: 'Removed user ' + em
          });
        }

        toast('User removed', 'success');
        _accessLoaded = false;
        refreshAccessCache();
      } catch (e) {
        dbg.err('Remove user failed: ' + (e.code || e.message));
        toast('Remove failed: ' + (e.code || e.message), 'error');
      }
    }).catch(e => {
      toast('Could not read access doc: ' + (e.code || e.message), 'error');
    });
  }
  window.removeUser = removeUserFixed;
  __LS_registerAction('user-remove', (ev, id) => { ev.stopPropagation(); removeUserFixed(id); });

  scriptLoaded('S10-FIX');
})();
</script>
<!-- ═══════════════════════════════════════════════════════════════════════
     CRITICAL FIX — form IDs prefer modal scope + orphan repair
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════
     1. SCOPED getElementById
     When a modal is open, prefer elements inside the modal.
     ═══════════════════════════════════════════════════════════════ */
  const _origGetById = document.getElementById.bind(document);

  document.getElementById = function (id) {
    if (!id) return null;

    const modal = _origGetById('modalWrap');
    if (modal && modal.classList.contains('open')) {
      const insideModal = modal.querySelector('#' + id);
      if (insideModal) return insideModal;
    }

    return _origGetById(id);
  };

  /* Same idea for querySelectorAll — scope to modal when open */
  const _origQS = document.querySelector.bind(document);
  document.querySelector = function (sel) {
    const modal = _origGetById('modalWrap');
    if (modal && modal.classList.contains('open') && typeof sel === 'string' && sel.startsWith('#')) {
      const inModal = modal.querySelector(sel);
      if (inModal) return inModal;
    }
    return _origQS(sel);
  };

  /* ═══════════════════════════════════════════════════════════════
     2. Prevent saving adjustments without a valid bank
     Wrap the save button of the adjustment form.
     We do this by intercepting clicks on the save button.
     ═══════════════════════════════════════════════════════════════ */
  document.addEventListener('click', function (e) {
    const btn = e.target.closest('#adjSaveBtn');
    if (!btn) return;

    const bankEl = _origQS('#modalWrap #adjBank');
    const typeEl = _origQS('#modalWrap #adjType');
    if (!bankEl) return;

    const bid = bankEl.value;

    /* Reject "all" or empty */
    if (!bid || bid === 'all') {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      toast('Please select a specific bank (not "All")', 'error');
      return;
    }

    /* Reject if the bank doesn't exist in state */
    const exists = arr(state.data.banks).some(b => b.id === bid);
    if (!exists) {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      toast('That bank no longer exists — pick another', 'error');
      return;
    }

    /* Also reject type = "all" or empty */
    if (typeEl && (!typeEl.value || typeEl.value === 'all')) {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      toast('Please select a specific type', 'error');
    }
  }, true);   /* capture phase — runs before the form's own handler */

  /* ═══════════════════════════════════════════════════════════════
     3. Orphan repair — find adjustments with bad bankId
     ═══════════════════════════════════════════════════════════════ */
  function findOrphanAdjustments() {
    return arr(state.data.bankAdjustments).filter(a => {
      if (!a.bankId || a.bankId === 'all') return true;
      return !arr(state.data.banks).some(b => b.id === a.bankId);
    });
  }
  window.findOrphanAdjustments = findOrphanAdjustments;

  function repairOrphanAdjustment(adjId, newBankId) {
    const a = arr(state.data.bankAdjustments).find(x => x.id === adjId);
    if (!a) { toast('Adjustment not found', 'error'); return; }
    if (!newBankId || newBankId === 'all') { toast('Pick a specific bank', 'error'); return; }
    if (!arr(state.data.banks).some(b => b.id === newBankId)) {
      toast('Bank does not exist', 'error'); return;
    }
    a.bankId = newBankId;
    a.updatedAt = nowISO();
    a.updatedBy = state.user?.email || 'system';
    markDirty('bankAdjustments', a.id);
    toast('Adjustment repaired', 'success');
    closeModal();
    renderApp();
  }
  window.repairOrphanAdjustment = repairOrphanAdjustment;

  /* ═══════════════════════════════════════════════════════════════
     4. Repair wizard — modal that lists orphans
     ═══════════════════════════════════════════════════════════════ */
  function openOrphanRepairWizard() {
    const orphans = findOrphanAdjustments();

    if (!orphans.length) {
      openModal('✅ No orphans found',
        '<div class="empty"><span class="big">✓</span>' +
        'All adjustments are assigned to a valid bank.</div>',
        { width: 520, footer: '<button class="btn" data-close-modal>Close</button>' });
      return;
    }

    const banks = arr(state.data.banks).filter(b => b.active !== false);

    const body =
      '<div class="alert" style="background:var(--amber-soft);color:var(--amber);' +
        'padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:12.5px">' +
        '<strong>' + orphans.length + ' adjustment(s) need fixing.</strong><br>' +
        'These have a broken bank reference (older data or a form bug) and are not ' +
        'affecting any bank\'s balance. Pick a real bank for each.' +
      '</div>' +

      orphans.map(a => {
        const options = banks.map(b =>
          '<option value="' + esc(b.id) + '">' + esc(b.name) + '</option>'
        ).join('');
        return '<div style="margin-bottom:16px;padding:14px;border:1px solid var(--border);' +
          'border-radius:10px;background:var(--surface-2)">' +
          '<div style="font-size:13px;font-weight:600;margin-bottom:4px">' +
            esc(a.reason || 'Adjustment') +
          '</div>' +
          '<div class="small muted" style="margin-bottom:8px">' +
            dateFmt(a.date) + ' · ' +
            (a.direction === 'credit' ? '+' : '−') + money(a.amount) + ' · ' +
            'type: ' + esc(a.type || '?') + ' · ' +
            'bankId: ' + esc(a.bankId || '?') +
          '</div>' +
          '<div style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end">' +
            '<label class="field" style="margin:0">Assign to bank' +
              '<select id="orphan-' + esc(a.id) + '">' +
                '<option value="">— Pick a bank —</option>' +
                options +
              '</select>' +
            '</label>' +
            '<button class="btn primary" data-action="repair-orphan" data-id="' + esc(a.id) + '">Fix</button>' +
          '</div>' +
        '</div>';
      }).join('') +

      '<div style="margin-top:20px;padding-top:14px;border-top:1px solid var(--border)">' +
        '<button class="btn danger" data-action="repair-delete-all-orphans">' +
          '🗑 Delete all orphan adjustments' +
        '</button>' +
      '</div>';

    openModal('🔧 Repair Orphan Adjustments', body, {
      width: 720,
      footer: '<button class="btn" data-close-modal>Close</button>'
    });
  }
  window.openOrphanRepairWizard = openOrphanRepairWizard;

  /* ═══════════════════════════════════════════════════════════════
     5. Action handlers
     ═══════════════════════════════════════════════════════════════ */
  __LS_registerAction('repair-orphan', (ev, id) => {
    ev.stopPropagation();
    const sel = _origGetById('orphan-' + id);
    if (!sel) { toast('Picker not found', 'error'); return; }
    const bankId = sel.value;
    if (!bankId) { toast('Pick a bank first', 'error'); return; }
    repairOrphanAdjustment(id, bankId);
    /* Re-open the wizard in case there are more */
    setTimeout(() => openOrphanRepairWizard(), 300);
  });

  __LS_registerAction('repair-delete-all-orphans', () => {
    const orphans = findOrphanAdjustments();
    if (!orphans.length) { toast('No orphans to delete', 'info'); return; }
    if (!confirm('Delete all ' + orphans.length + ' orphan adjustment(s)?\n\n' +
      'This cannot be undone.')) return;

    orphans.forEach(a => {
      state.data.bankAdjustments = state.data.bankAdjustments.filter(x => x.id !== a.id);
      _dirty.add('bankAdjustments:' + a.id);
      delete _snapshot['bankAdjustments:' + a.id];
    });
    scheduleSync();
    toast('Deleted ' + orphans.length + ' orphan(s)', 'success');
    closeModal();
    renderApp();
  });

  /* ═══════════════════════════════════════════════════════════════
     6. Add "Repair orphans" button on the Adjustments page
     ═══════════════════════════════════════════════════════════════ */
  const origRenderAdjustments = REGISTRY.routes.adjustments ? REGISTRY.routes.adjustments.fn : null;
  if (origRenderAdjustments) {
    function renderAdjustmentsWithRepair() {
      const html = origRenderAdjustments();
      const orphans = findOrphanAdjustments();
      if (!orphans.length) return html;

      /* Inject the repair button + banner at the top */
      const banner =
        '<div class="card" style="background:var(--amber-soft);border:1px solid var(--amber)">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px">' +
            '<div>' +
              '<div style="font-weight:600;color:var(--amber)">⚠ ' +
                orphans.length + ' orphan adjustment(s) need fixing</div>' +
              '<div class="small" style="color:var(--amber);margin-top:4px">' +
                'They have an invalid bank reference and are not affecting any balance.' +
              '</div>' +
            '</div>' +
            '<button class="btn primary" data-action="repair-orphans-open">🔧 Repair Now</button>' +
          '</div>' +
        '</div>';

      return banner + html;
    }
    __LS_addRoute('adjustments', 'Bank Adjustments', renderAdjustmentsWithRepair);
  }

  __LS_registerAction('repair-orphans-open', () => openOrphanRepairWizard());

  /* ═══════════════════════════════════════════════════════════════
     7. Auto-run: check for orphans on boot and warn once
     ═══════════════════════════════════════════════════════════════ */
  __LS_register('ORPHAN-FIX', function () {
    setTimeout(() => {
      const orphans = findOrphanAdjustments();
      if (orphans.length) {
        dbg.warn('Found ' + orphans.length + ' orphan adjustment(s)');
        toast(
          '⚠ ' + orphans.length + ' adjustment(s) need repair — open Adjustments page',
          'warn', 8000
        );
      }
      scriptLoaded('ORPHAN-FIX');
    }, 2000);
  });

})();
</script>
<!-- ═══════════════════════════════════════════════════════════════════════
     MASTER FIX — dropdowns, bank statement, orphans, race conditions
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════════
     FIX 1 — Scoped getElementById (modal-first lookup)
     ═══════════════════════════════════════════════════════════════════════ */
  const _origById = document.getElementById.bind(document);
  const _origQS   = document.querySelector.bind(document);

  document.getElementById = function (id) {
    if (!id) return null;
    const modal = _origById('modalWrap');
    if (modal && modal.classList.contains('open')) {
      const insideModal = modal.querySelector('#' + id);
      if (insideModal) return insideModal;
    }
    return _origById(id);
  };

  document.querySelector = function (sel) {
    const modal = _origById('modalWrap');
    if (modal && modal.classList.contains('open') && typeof sel === 'string' && sel.charAt(0) === '#') {
      const inModal = modal.querySelector(sel);
      if (inModal) return inModal;
    }
    return _origQS(sel);
  };

  /* ═══════════════════════════════════════════════════════════════════════
     FIX 2 — Bulletproof cheque book + leaf cascade
     Replace window.openChequeForm with a version that always works.
     ═══════════════════════════════════════════════════════════════════════ */
  const origOpenChequeForm = window.openChequeForm;

  window.openChequeForm = function (id) {
    if (!state.perms.write) { toast('Read-only role — cannot edit', 'error'); return; }

    const c = id ? chequeObj(id) : null;
    if (c && !['draft', 'cancelled', 'pending_approval'].includes(c.status)) {
      toast('This cheque can no longer be edited (' + c.status + ')', 'error');
      return;
    }

    const banks = arr(state.data.banks).filter(b => b.active !== false);
    if (!banks.length) {
      toast('Add a bank first — go to Banks page', 'warn', 5000);
      return;
    }

    const defaultBankId = c?.bankId || banks[0].id;

    const body =
      /* Payee + type */
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">' +
        '<label class="field">Payee' +
          '<div class="payee-input-wrap" style="position:relative">' +
            '<input id="chqPayeeSearch" placeholder="Type name to search or add new…" autocomplete="off" value="' + esc(c?.payeeName || '') + '">' +
            '<div class="payee-suggestions" id="chqPayeeSuggestions"></div>' +
          '</div>' +
        '</label>' +
        selectField('Payee Type', 'chqPayeeType',
          Object.keys(PAYEE_TYPES).map(k => ({ value: k, label: PAYEE_TYPES[k].ico + ' ' + PAYEE_TYPES[k].label })),
          c?.payeeType || 'supplier') +
      '</div>' +

      /* Bank + book */
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">' +
        selectField('Bank Account', 'chqBank', banks.map(b => ({ value: b.id, label: b.name })), defaultBankId, { req: true }) +
        '<label class="field">Cheque Book<select id="chqBook"><option value="">Loading…</option></select></label>' +
      '</div>' +

      /* Cheque # + leaf */
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">' +
        field('Cheque Number', 'chqNo', c?.chequeNo || '', { placeholder: 'Auto from leaf or manual' }) +
        '<label class="field">Leaf<select id="chqLeaf"><option value="">— Manual —</option></select></label>' +
      '</div>' +

      /* Amount + date */
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">' +
        field('Amount', 'chqAmount', c ? num(c.amount).toFixed(2) : '', { type: 'number', step: '0.01', min: 0, req: true, placeholder: '0.00' }) +
        field('Cheque Date', 'chqDate', c?.chequeDate || today(), { type: 'date', req: true }) +
      '</div>' +

      '<div style="margin-bottom:14px">' + field('Amount in Words', 'chqWords', c?.amountWords || '') + '</div>' +

      '<div id="chqPreviewWrap"></div>' +

      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">' +
        field('Memo / Purpose', 'chqMemo', c?.memo || '', { placeholder: 'e.g. Invoice #123 payment' }) +
        field('Written Date', 'chqWrittenDate', c?.writtenDate || today(), { type: 'date' }) +
      '</div>' +

      '<div style="margin-top:14px">' + field('Notes', 'chqNotes', c?.notes || '', { type: 'textarea' }) + '</div>' +

      '<div id="chqBalanceHint" style="margin-top:16px;padding:12px 14px;background:var(--surface-2);border-radius:var(--r-md);font-size:12.5px"></div>';

    openModal(c ? '✏️ Edit Cheque' : '＋ Write New Cheque', body, {
      width: 780,
      footer:
        '<button class="btn" data-close-modal>Cancel</button>' +
        '<button class="btn primary" id="chqSaveBtn">' + (c ? 'Update' : 'Save Cheque') + '</button>'
    });

    /* ── Grab scoped refs ── */
    const _q = (sel) => document.querySelector('#modalWrap ' + sel);
    const bankSel    = _q('#chqBank');
    const bookSel    = _q('#chqBook');
    const leafSel    = _q('#chqLeaf');
    const noInput    = _q('#chqNo');
    const amountInp  = _q('#chqAmount');
    const wordsInp   = _q('#chqWords');
    const payeeInp   = _q('#chqPayeeSearch');
    const sugBox     = _q('#chqPayeeSuggestions');
    let selectedPayeeId = c?.payeeId || null;

    /* ═══════════ Bank → Book → Leaf cascade — BULLETPROOF ═══════════ */

    function refreshBooks() {
      try {
        const bid = bankSel.value;
        const allBooks = arr(state.data.chequeBooks);

        /* Books matching this bank — accept any casing/trim mismatch */
        const matching = allBooks.filter(b =>
          String(b.bankId || '').trim() === String(bid).trim()
        );

        /* Debug log */
        dbg.info('refreshBooks: bank=' + bid + ' → ' + matching.length + ' book(s) of ' + allBooks.length);

        if (!matching.length) {
          bookSel.innerHTML =
            '<option value="">— No books for this bank —</option>' +
            '<option value="__CREATE__">＋ Create new book</option>';
        } else {
          bookSel.innerHTML = '<option value="">— Manual / No book —</option>' +
            matching.map(b => {
              const s = bookLeavesSummary(b);
              return '<option value="' + esc(b.id) + '"' + (c?.bookId === b.id ? ' selected' : '') + '>' +
                esc(b.bookNo) +
                ' (' + esc(b.serialStart) + '–' + esc(b.serialEnd) + ')' +
                ' · ' + s.available + ' left' +
                (b.active === false ? ' · INACTIVE' : '') +
              '</option>';
            }).join('') +
            '<option value="__CREATE__">＋ Create new book</option>';
        }

        refreshLeaves();
        updateBalanceHint();
      } catch (e) {
        dbg.err('refreshBooks: ' + e.message);
      }
    }

    function refreshLeaves() {
      try {
        const bkid = bookSel.value;
        if (bkid === '__CREATE__') {
          leafSel.innerHTML = '<option value="">— Pick a book first —</option>';
          return;
        }
        const book = bkid ? bookObj(bkid) : null;
        if (!book) {
          leafSel.innerHTML = '<option value="">— Manual —</option>';
          return;
        }

        const avail = [];
        arr(book.leaves).forEach((l, i) => {
          if (l.status === 'available') avail.push({ idx: i, serial: l.serial });
        });

        leafSel.innerHTML = '<option value="">— Pick leaf —</option>' +
          avail.map(l =>
            '<option value="' + l.idx + '"' + (c?.leafId === l.idx ? ' selected' : '') + '>' +
              esc(l.serial) +
            '</option>'
          ).join('');

        /* Auto-pick first available for new cheques */
        if (!c && avail.length) {
          leafSel.value = avail[0].idx;
          noInput.value = avail[0].serial;
        }
      } catch (e) {
        dbg.err('refreshLeaves: ' + e.message);
      }
    }

    function updateBalanceHint() {
      const hint = _q('#chqBalanceHint');
      if (!hint) return;
      const bid = bankSel.value;
      if (!bid) { hint.innerHTML = ''; return; }
      const bal = bankBalances(bid);
      const amt = num(amountInp.value);
      const afterBook = bal.book - amt;
      hint.innerHTML =
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">' +
          '<div><div class="k-label">Bank now</div><strong>' + money(bal.bank) + '</strong></div>' +
          '<div><div class="k-label">Book now</div><strong style="color:var(--accent)">' + money(bal.book) + '</strong></div>' +
          '<div><div class="k-label">Book after</div>' +
            '<strong style="color:' + (afterBook < 0 ? 'var(--red)' : 'var(--green)') + '">' + money(afterBook) + '</strong></div>' +
        '</div>' +
        (afterBook < 0
          ? '<div style="margin-top:8px;color:var(--red);font-weight:600">⚠ Overdraft risk of ' + money(Math.abs(afterBook)) + '</div>'
          : '');
    }

    /* Wire cascade */
    bankSel.onchange = () => {
      /* Reset selected book when bank changes */
      bookSel.value = '';
      refreshBooks();
    };

    bookSel.onchange = () => {
      if (bookSel.value === '__CREATE__') {
        /* Open book creation form inline */
        _origById('modalWrap').classList.remove('open');
        setTimeout(() => {
          if (window.openBookForm) window.openBookForm(null);
          /* After user creates book, reopen cheque form */
          const check = setInterval(() => {
            const before = arr(state.data.chequeBooks).length;
            const modalOpen = _origById('modalWrap').classList.contains('open');
            if (!modalOpen) return; /* still in book form */
          }, 500);
        }, 100);
        return;
      }
      refreshLeaves();
    };

    leafSel.onchange = () => {
      const idx = leafSel.value;
      if (idx === '') return;
      const book = bookObj(bookSel.value);
      if (!book) return;
      const leaf = arr(book.leaves)[parseInt(idx, 10)];
      if (leaf) noInput.value = leaf.serial;
    };

    amountInp.oninput = () => {
      const v = num(amountInp.value);
      wordsInp.value = v > 0 ? numberToWords(v) : '';
      renderChequePreview();
      updateBalanceHint();
    };
    _q('#chqDate').oninput = renderChequePreview;

    /* ═══════════ Preview ═══════════ */
    function renderChequePreview() {
      const wrap = _q('#chqPreviewWrap');
      if (!wrap) return;
      const amt = num(amountInp.value);
      if (amt <= 0) { wrap.innerHTML = ''; return; }
      const bank = bankObj(bankSel.value);
      const payee = payeeInp.value.trim();
      const words = wordsInp.value;
      const dateStr = _q('#chqDate').value;
      const no = noInput.value;
      wrap.innerHTML =
        '<div class="cheque-preview">' +
          '<div class="cp-row"><span class="cp-label">Bank</span><span>' + esc(bank ? (bank.bankName || bank.name) : '—') + '</span></div>' +
          '<div class="cp-row"><span class="cp-label">Pay to</span><span style="font-weight:600">' + esc(payee || '________________') + '</span></div>' +
          '<div class="cp-words">' + esc(words || '________________') + '</div>' +
          '<div class="cp-row"><span class="cp-label">Amount</span><span class="cp-amount-box">' + money(amt, { plain: true }) + '</span></div>' +
          '<div class="cp-row" style="margin-top:8px"><span class="cp-label">Date</span><span>' + (dateStr ? dateFmt(dateStr) : '____ / ____ / ______') + '</span></div>' +
          '<div class="cp-row"><span class="cp-label">Cheque #</span><span class="mono">' + esc(no || '—') + '</span></div>' +
          '<div class="micr-line">‖ ' + esc(no || '000000') + ' ‖ ' + esc(bank?.accountNo || '0000000000') + ' ‖</div>' +
        '</div>';
    }

    /* ═══════════ Payee autocomplete — FIXED (no blur race) ═══════════ */
    let payeeBlurTimer = null;

    function renderPayeeSuggestions() {
      const q = payeeInp.value.trim().toLowerCase();
      if (!q) { sugBox.classList.remove('open'); return; }
      const matches = arr(state.data.payees)
        .filter(p => p.active !== false)
        .filter(p => (p.name || '').toLowerCase().indexOf(q) !== -1)
        .slice(0, 8);

      let html = '';
      if (matches.length) {
        html += matches.map(p =>
          '<div class="payee-suggestion" data-payee-id="' + esc(p.id) + '">' +
            '<div>' + esc(p.name) +
              '<span class="type-tag">' + esc((PAYEE_TYPES[p.type] || PAYEE_TYPES.other).label) + '</span>' +
            '</div>' +
            (num(p.lastChequeAmount) > 0
              ? '<div class="last-info">Last: ' + money(p.lastChequeAmount) +
                (p.lastChequeDate ? ' on ' + dateFmt(p.lastChequeDate) : '') + '</div>'
              : '') +
          '</div>'
        ).join('');
      }
      html += '<div class="payee-suggestion" data-action="payee-quick-new">' +
        '＋ Add new payee: <strong>' + esc(payeeInp.value.trim()) + '</strong>' +
      '</div>';
      sugBox.innerHTML = html;
      sugBox.classList.add('open');
    }

    sugBox.addEventListener('mousedown', (e) => {
      /* Use mousedown — fires BEFORE blur */
      e.preventDefault(); /* prevent blur */
      const item = e.target.closest('.payee-suggestion');
      if (!item) return;

      if (item.dataset.action === 'payee-quick-new') {
        const name = payeeInp.value.trim();
        if (name) {
          quickCreatePayeeAndContinue(name, {
            onCreated: (payee) => {
              payeeInp.value = payee.name;
              selectedPayeeId = payee.id;
              const pt = _q('#chqPayeeType');
              if (pt) pt.value = payee.type;
              sugBox.classList.remove('open');
            }
          });
        }
        return;
      }

      const p = payeeObj(item.dataset.payeeId);
      if (!p) return;
      payeeInp.value = p.name;
      selectedPayeeId = p.id;
      const pt = _q('#chqPayeeType');
      if (pt) pt.value = p.type;
      if (num(p.lastChequeAmount) > 0 && !num(amountInp.value)) {
        amountInp.value = num(p.lastChequeAmount).toFixed(2);
        wordsInp.value = numberToWords(p.lastChequeAmount);
      }
      if (p.defaultBankId && banks.find(b => b.id === p.defaultBankId)) {
        bankSel.value = p.defaultBankId;
        refreshBooks();
      }
      sugBox.classList.remove('open');
      renderChequePreview();
      updateBalanceHint();
    });

    payeeInp.oninput = () => {
      renderPayeeSuggestions();
      renderChequePreview();
      const row = null; /* not a batch */
      selectedPayeeId = null;
    };
    payeeInp.onfocus = () => { if (payeeInp.value.trim()) renderPayeeSuggestions(); };
    payeeInp.onblur = () => {
      /* Delay close so mousedown can fire */
      clearTimeout(payeeBlurTimer);
      payeeBlurTimer = setTimeout(() => sugBox.classList.remove('open'), 250);
    };

    /* ═══════════ Initial render ═══════════ */
    refreshBooks();

    /* If editing, restore book/leaf */
    if (c?.bookId) {
      bookSel.value = c.bookId;
      refreshLeaves();
      if (c?.leafId !== null && c?.leafId !== undefined) leafSel.value = String(c.leafId);
    }
    if (c) renderChequePreview();
    updateBalanceHint();

    /* Save */
    _q('#chqSaveBtn').onclick = () => {
      const payload = {
        chequeNo: noInput.value.trim(),
        bankId: bankSel.value,
        bookId: (bookSel.value && bookSel.value !== '__CREATE__') ? bookSel.value : '',
        leafId: (leafSel.value !== '' && leafSel.value !== null) ? parseInt(leafSel.value, 10) : null,
        payeeId: selectedPayeeId,
        payeeType: _q('#chqPayeeType').value || 'supplier',
        payeeName: payeeInp.value.trim(),
        amount: num(amountInp.value),
        amountWords: wordsInp.value,
        chequeDate: _q('#chqDate').value || today(),
        writtenDate: _q('#chqWrittenDate').value || today(),
        memo: _q('#chqMemo').value.trim(),
        notes: _q('#chqNotes').value.trim()
      };

      if (!payload.payeeName)   { toast('Payee name is required', 'error'); return; }
      if (!payload.bankId)      { toast('Bank is required', 'error'); return; }
      if (payload.amount <= 0)  { toast('Amount must be > 0', 'error'); return; }
      if (!payload.chequeDate)  { toast('Cheque date is required', 'error'); return; }

      /* Resolve payee ID */
      if (!payload.payeeId) {
        const match = arr(state.data.payees).find(p =>
          p.name.toLowerCase() === payload.payeeName.toLowerCase()
        );
        if (match) payload.payeeId = match.id;
      }

      /* Overdraft confirm */
      const bal = bankBalances(payload.bankId);
      const afterBook = bal.book - payload.amount;
      if (afterBook < 0) {
        if (!confirm(
          '⚠ This cheque pushes BOOK balance to ' + money(afterBook) + '\n\n' +
          'Continue anyway?'
        )) return;
      }

      const isFuture = payload.chequeDate > today();
      payload.status = isFuture ? 'scheduled' : 'pending_approval';

      if (c) {
        if (window.releaseLeaf) window.releaseLeaf(c);
        Object.assign(c, payload);
        c.amountWords = numberToWords(payload.amount);
        c.updatedAt = nowISO();
        c.updatedBy = state.user?.email || 'system';
        markDirty('cheques', c.id);
        if (window.reserveLeaf) window.reserveLeaf(c);
        if (window.updatePayeeMemory) window.updatePayeeMemory(c, false);
        toast('Cheque updated', 'success');
      } else {
        const created = makeCheque(payload);
        state.data.cheques.push(created);
        markDirty('cheques', created.id);
        if (window.reserveLeaf) window.reserveLeaf(created);
        if (window.updatePayeeMemory) window.updatePayeeMemory(created, true);
        toast(isFuture ? 'Scheduled for ' + dateFmt(created.chequeDate) : 'Cheque saved — awaiting approval', 'success');
      }

      closeModal();
      renderApp();
    };
  };

  /* ═══════════════════════════════════════════════════════════════════════
     FIX 3 — Orphan adjustment auto-repair (assign to first bank)
     ═══════════════════════════════════════════════════════════════════════ */
  function findOrphanAdjustments() {
    return arr(state.data.bankAdjustments).filter(a => {
      if (!a.bankId || a.bankId === 'all') return true;
      return !arr(state.data.banks).some(b => b.id === a.bankId);
    });
  }
  window.findOrphanAdjustments = findOrphanAdjustments;

  function repairOrphanAdjustment(adjId, newBankId) {
    const a = arr(state.data.bankAdjustments).find(x => x.id === adjId);
