<script>
(function () {
  'use strict';

  /* ─── 1. Register the new collection ─────────────────────────────────── */
  __LS_addCollection('payees');

  /* ─── 2. Payee type metadata ─────────────────────────────────────────── */
  const PAYEE_TYPES = {
    supplier: { label: 'Supplier', ico: '🏭', color: 'blue' },
    customer: { label: 'Customer', ico: '👤', color: 'green' },
    employee: { label: 'Employee', ico: '💼', color: 'purple' },
    other:    { label: 'Other',    ico: '📌', color: 'gray' }
  };
  window.PAYEE_TYPES = PAYEE_TYPES;

  /* ─── 3. Schema factory ──────────────────────────────────────────────── */
  function makePayee(seed) {
    seed = seed || {};
    return {
      id: seed.id || uid(),
      type: PAYEE_TYPES[seed.type] ? seed.type : 'supplier',
      name: String(seed.name || ''),
      phone: String(seed.phone || ''),
      email: String(seed.email || ''),
      address: String(seed.address || ''),
      accountNo: String(seed.accountNo || ''),
      defaultBankId: seed.defaultBankId || null,

      /* Smart memory */
      lastChequeAmount: num(seed.lastChequeAmount),
      lastChequeDate: seed.lastChequeDate || null,
      totalPaid: num(seed.totalPaid),
      chequeCount: num(seed.chequeCount),

      notes: String(seed.notes || ''),
      active: seed.active !== false,
      createdAt: seed.createdAt || nowISO(),
      createdBy: seed.createdBy || (state.user?.email || 'system'),
      updatedAt: seed.updatedAt || nowISO(),
      updatedBy: seed.updatedBy || (state.user?.email || 'system')
    };
  }
  window.makePayee = makePayee;

  /* ─── 4. Lookup helpers ──────────────────────────────────────────────── */
  const payeeObj  = (id) => arr(state.data.payees).find(p => p.id === id) || null;
  const payeeName = (id) => { const p = payeeObj(id); return p ? p.name : '—'; };
  window.payeeObj = payeeObj;
  window.payeeName = payeeName;

  function payeeTypeBadge(type) {
    const meta = PAYEE_TYPES[type] || PAYEE_TYPES.other;
    return '<span class="badge ' + meta.color + '">' + meta.ico + ' ' + esc(meta.label) + '</span>';
  }
  window.payeeTypeBadge = payeeTypeBadge;

  /* ─── 5. View ────────────────────────────────────────────────────────── */
  function renderPayees() {
    const all = arr(state.data.payees).slice();
    const filter = state.filters.payees || {};
    const q = (filter.q || '').toLowerCase();
    const type = filter.type || 'all';

    let list = all;
    if (q) {
      list = list.filter(p =>
        (p.name || '').toLowerCase().indexOf(q) !== -1 ||
        (p.phone || '').toLowerCase().indexOf(q) !== -1 ||
        (p.email || '').toLowerCase().indexOf(q) !== -1 ||
        (p.accountNo || '').toLowerCase().indexOf(q) !== -1
      );
    }
    if (type !== 'all') list = list.filter(p => p.type === type);
    list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    const counts = { supplier: 0, customer: 0, employee: 0, other: 0 };
    all.forEach(p => { if (counts[p.type] !== undefined) counts[p.type]++; });

    return '' +
      '<div class="kpi-strip">' +
        '<div class="kpi"><div class="k-label">Total Payees</div><div class="k-value">' + all.length + '</div></div>' +
        '<div class="kpi"><div class="k-label">🏭 Suppliers</div><div class="k-value">' + counts.supplier + '</div></div>' +
        '<div class="kpi"><div class="k-label">👤 Customers</div><div class="k-value">' + counts.customer + '</div></div>' +
        '<div class="kpi"><div class="k-label">💼 Employees</div><div class="k-value">' + counts.employee + '</div></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head">' +
          '<h3>👥 Payees (' + list.length + ')</h3>' +
          '<button class="btn primary" data-action="payee-new">＋ New Payee</button>' +
        '</div>' +
        '<div class="md-filter">' +
          '<label class="field">Search' +
            '<input type="search" id="paySearch" value="' + esc(filter.q || '') + '" placeholder="Name, phone, email, account…">' +
          '</label>' +
          '<label class="field">Type' +
            '<select id="payType">' +
              '<option value="all"' + (type === 'all' ? ' selected' : '') + '>All types</option>' +
              Object.keys(PAYEE_TYPES).map(k =>
                '<option value="' + k + '"' + (type === k ? ' selected' : '') + '>' +
                  PAYEE_TYPES[k].ico + ' ' + esc(PAYEE_TYPES[k].label) +
                '</option>'
              ).join('') +
            '</select>' +
          '</label>' +
          '<div></div><div></div>' +
        '</div>' +
        (list.length
          ? '<div class="table-wrap"><table>' +
              '<thead><tr>' +
                '<th>Type</th><th>Name</th><th>Phone</th><th>Email</th>' +
                '<th class="num">Last Amount</th><th class="num">Cheques</th>' +
                '<th class="num">Total Paid</th><th class="actions-cell"></th>' +
              '</tr></thead><tbody>' +
              list.map(p =>
                '<tr>' +
                  '<td>' + payeeTypeBadge(p.type) + '</td>' +
                  '<td><strong>' + esc(p.name) + '</strong>' +
                    (p.active === false ? ' <span class="badge gray">Inactive</span>' : '') +
                  '</td>' +
                  '<td>' + esc(p.phone || '—') + '</td>' +
                  '<td>' + esc(p.email || '—') + '</td>' +
                  '<td class="num">' + (num(p.lastChequeAmount) > 0 ? money(p.lastChequeAmount) : '—') + '</td>' +
                  '<td class="num">' + num(p.chequeCount) + '</td>' +
                  '<td class="num">' + money(p.totalPaid) + '</td>' +
                  '<td class="actions-cell">' +
                    '<button class="btn xs" data-action="payee-edit" data-id="' + esc(p.id) + '">Edit</button>' +
                    (state.perms.delete
                      ? ' <button class="btn xs danger" data-action="payee-delete" data-id="' + esc(p.id) + '">🗑</button>'
                      : '') +
                  '</td>' +
                '</tr>'
              ).join('') +
            '</tbody></table></div>'
          : '<div class="empty"><span class="big">👥</span>' +
            (all.length ? 'No payees match the filter.' : 'No payees yet. Click <strong>New Payee</strong>.') +
            '</div>') +
      '</div>';
  }

  /* ─── 6. Form ────────────────────────────────────────────────────────── */
  function openPayeeForm(id) {
    if (!state.perms.write) { toast('Read-only role — cannot edit', 'error'); return; }
    const p = id ? payeeObj(id) : null;

    const body =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
        selectField('Type', 'pType',
          Object.keys(PAYEE_TYPES).map(k => ({ value: k, label: PAYEE_TYPES[k].ico + ' ' + PAYEE_TYPES[k].label })),
          p?.type || 'supplier', { req: true }) +
        field('Name', 'pName', p?.name || '', { req: true, placeholder: 'Full name or business name' }) +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">' +
        field('Phone', 'pPhone', p?.phone || '', { placeholder: '07X XXX XXXX' }) +
        field('Email', 'pEmail', p?.email || '', { type: 'email' }) +
      '</div>' +
      '<div style="margin-top:14px">' +
        field('Address', 'pAddress', p?.address || '', { type: 'textarea' }) +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">' +
        field('Bank Account No', 'pAccountNo', p?.accountNo || '', { placeholder: 'Their bank account (optional)' }) +
        selectField('Default Bank (ours)', 'pDefaultBank',
          arr(state.data.banks).map(b => ({ value: b.id, label: b.name })),
          p?.defaultBankId || '', { placeholder: '— None —' }) +
      '</div>' +
      '<div style="margin-top:14px">' +
        field('Notes', 'pNotes', p?.notes || '', { type: 'textarea' }) +
      '</div>' +
      '<div style="margin-top:14px">' +
        '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px">' +
          '<input type="checkbox" id="pActive" ' + ((p?.active !== false) ? 'checked' : '') + '> Active' +
        '</label>' +
      '</div>' +
      (p ? '<div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border);' +
        'display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;font-size:12px">' +
          '<div><div class="k-label">Last Amount</div>' +
            '<strong>' + (num(p.lastChequeAmount) > 0 ? money(p.lastChequeAmount) : '—') + '</strong>' +
            (p.lastChequeDate ? '<div class="small muted">' + dateFmt(p.lastChequeDate) + '</div>' : '') +
          '</div>' +
          '<div><div class="k-label">Cheques Written</div>' +
            '<strong>' + num(p.chequeCount) + '</strong></div>' +
          '<div><div class="k-label">Total Paid</div>' +
            '<strong>' + money(p.totalPaid) + '</strong></div>' +
        '</div>' : '');

    openModal(p ? '✏️ Edit Payee' : '＋ New Payee', body, {
      width: 720,
      footer:
        '<button class="btn" data-close-modal>Cancel</button>' +
        '<button class="btn primary" id="pSaveBtn">' + (p ? 'Update' : 'Create') + '</button>'
    });

    document.getElementById('pSaveBtn').onclick = () => {
      const data = {
        type: document.getElementById('pType').value || 'supplier',
        name: document.getElementById('pName').value.trim(),
        phone: document.getElementById('pPhone').value.trim(),
        email: document.getElementById('pEmail').value.trim(),
        address: document.getElementById('pAddress').value.trim(),
        accountNo: document.getElementById('pAccountNo').value.trim(),
        defaultBankId: document.getElementById('pDefaultBank').value || null,
        notes: document.getElementById('pNotes').value.trim(),
        active: document.getElementById('pActive').checked
      };

      if (!data.name) { toast('Name is required', 'error'); return; }

      /* Duplicate name warning on create */
      if (!p) {
        const dupe = arr(state.data.payees).find(x =>
          x.name.toLowerCase().trim() === data.name.toLowerCase()
        );
        if (dupe && !confirm('A payee named "' + data.name + '" already exists.\nProceed anyway?')) return;
      }

      if (p) {
        Object.assign(p, data);
        p.updatedAt = nowISO();
        p.updatedBy = state.user?.email || 'system';
        markDirty('payees', p.id);
      } else {
        const created = makePayee(data);
        state.data.payees.push(created);
        markDirty('payees', created.id);
      }

      closeModal();
      toast(p ? 'Payee updated' : 'Payee created', 'success');
      renderApp();
    };
  }

  /* ─── 7. Delete ──────────────────────────────────────────────────────── */
  function deletePayeeById(id) {
    if (!state.perms.delete) { toast('No delete permission', 'error'); return; }
    const p = payeeObj(id);
    if (!p) return;

    /* Block if used by any cheque */
    const usedBy = arr(state.data.cheques || []).filter(c => c.payeeId === id);
    if (usedBy.length) {
      toast('Cannot delete — used by ' + usedBy.length + ' cheque(s). Deactivate instead.', 'error', 5000);
      return;
    }

    if (!confirm('Delete payee "' + p.name + '"?')) return;

    state.data.payees = state.data.payees.filter(x => x.id !== id);
    _dirty.add('payees:' + id);
    delete _snapshot['payees:' + id];
    scheduleSync();

    closeModal();
    toast('Payee deleted', 'success');
    renderApp();
  }

  /* ─── 8. Actions registration ────────────────────────────────────────── */
  __LS_registerAction('payee-new',    () => openPayeeForm(null));
  __LS_registerAction('payee-edit',   (ev, id) => { ev.stopPropagation(); openPayeeForm(id); });
  __LS_registerAction('payee-delete', (ev, id) => { ev.stopPropagation(); deletePayeeById(id); });

  /* ─── 9. Route + nav ─────────────────────────────────────────────────── */
  __LS_addRoute('payees', 'Payees', renderPayees);
  __LS_addNav({ group: 'Setup', id: 'payees', ico: '👥', label: 'Payees' });

  /* ─── 10. Bind view inputs (called from S01's bindView via init) ─────── */
  __LS_register('S02', function () {
    /* Nothing extra needed — filters bind on demand in bindView below.
       But we need to make sure S01's bindView knows about payee inputs.
       We do this by patching bindView with a wrapper. */

    const origBind = window.__origBindView || bindView;
    if (!window.__origBindView) window.__origBindView = bindView;

    /* Redefine bindView globally so S01 keeps calling it and our extra bindings run too */
    window.bindView = function () {
      /* Call original S01 bindings */
      try { window.__origBindView(); } catch (e) { dbg.warn('bindView original threw: ' + e.message); }

      /* S02 payee bindings */
      const ps = document.getElementById('paySearch');
      if (ps) {
        ps.oninput = () => {
          clearTimeout(ps._t);
          ps._t = setTimeout(() => {
            state.filters.payees = Object.assign({}, state.filters.payees, { q: ps.value });
            renderApp();
          }, 220);
        };
      }
      const pt = document.getElementById('payType');
      if (pt) pt.onchange = () => {
        state.filters.payees = Object.assign({}, state.filters.payees, { type: pt.value });
        renderApp();
      };
    };

    scriptLoaded('S02');
  });

})();
</script>
<!-- ═══════════════════════════════════════════════════════════════════════
     S03 — CHEQUES (write / list / detail / timeline)
     Drops in before </body>, after S02.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* ─── 1. Register collection ─────────────────────────────────────────── */
  __LS_addCollection('cheques');

  /* ─── 2. Cheque status metadata ──────────────────────────────────────── */
  const CHEQUE_STATUS = {
    draft:            { label: 'Draft',      color: 'gray'   },
    scheduled:        { label: 'Scheduled',  color: 'blue'   },
    pending_approval: { label: 'Pending',    color: 'amber'  },
    approved:         { label: 'Approved',   color: 'green'  },
    cleared:          { label: 'Cleared',    color: 'green'  },
    bounced:          { label: 'Bounced',    color: 'red'    },
    stopped:          { label: 'Stopped',    color: 'amber'  },
    void:             { label: 'Void',       color: 'gray'   },
    cancelled:        { label: 'Cancelled',  color: 'gray'   },
    reissued:         { label: 'Reissued',   color: 'purple' }
  };
  window.CHEQUE_STATUS = CHEQUE_STATUS;

  function chequeStatusBadge(status) {
    const meta = CHEQUE_STATUS[status] || { label: status, color: 'gray' };
    return '<span class="badge ' + meta.color + '">' + esc(meta.label) + '</span>';
  }
  window.chequeStatusBadge = chequeStatusBadge;

  /* ─── 3. Schema factory ──────────────────────────────────────────────── */
  function makeCheque(seed) {
    seed = seed || {};
    const amount = num(seed.amount);
    return {
      id: seed.id || uid(),
      chequeNo: String(seed.chequeNo || ''),
      bankId: seed.bankId || '',
      bookId: seed.bookId || '',
      leafId: seed.leafId !== undefined ? seed.leafId : null,
      payeeId: seed.payeeId || null,
      payeeType: seed.payeeType || 'supplier',
      payeeName: String(seed.payeeName || ''),
      amount: amount,
      amountWords: seed.amountWords || numberToWords(amount),
      chequeDate: seed.chequeDate || today(),
      writtenDate: seed.writtenDate || today(),
      status: seed.status || 'draft',
      memo: String(seed.memo || ''),
      notes: String(seed.notes || ''),

      /* Lifecycle timestamps */
      approvedBy: seed.approvedBy || null,
      approvedAt: seed.approvedAt || null,
      clearedAt: seed.clearedAt || null,
      bouncedAt: seed.bouncedAt || null,
      bounceReason: String(seed.bounceReason || ''),
      stoppedAt: seed.stoppedAt || null,
      voidAt: seed.voidAt || null,
      voidReason: String(seed.voidReason || ''),
      cancelledAt: seed.cancelledAt || null,
      cancelReason: String(seed.cancelReason || ''),
      bankRecredited: seed.bankRecredited || false,
      bankRecreditedAt: seed.bankRecreditedAt || null,
      bankPendingRecredit: seed.bankPendingRecredit || false,
      reissuedChequeId: seed.reissuedChequeId || null,
      reissuedFromId: seed.reissuedFromId || null,

      /* Envelope */
      createdAt: seed.createdAt || nowISO(),
      createdBy: seed.createdBy || (state.user?.email || 'system'),
      updatedAt: seed.updatedAt || nowISO(),
      updatedBy: seed.updatedBy || (state.user?.email || 'system')
    };
  }
  window.makeCheque = makeCheque;

  /* ─── 4. Lookup ──────────────────────────────────────────────────────── */
  const chequeObj = (id) => arr(state.data.cheques).find(c => c.id === id) || null;
  window.chequeObj = chequeObj;

  /* ─── 5. Leaf reserve / release ──────────────────────────────────────── */
  function reserveLeaf(cheque) {
    if (!cheque.bookId || cheque.leafId === null || cheque.leafId === undefined) return;
    const book = bookObj(cheque.bookId);
    if (!book) return;
    const leaf = arr(book.leaves)[cheque.leafId];
    if (!leaf) return;
    leaf.status = 'used';
    leaf.chequeId = cheque.id;
    markDirty('chequeBooks', book.id);
  }
  window.reserveLeaf = reserveLeaf;

  function releaseLeaf(cheque) {
    const book = bookObj(cheque.bookId);
    if (!book || cheque.leafId === null || cheque.leafId === undefined) return;
    const leaf = arr(book.leaves)[cheque.leafId];
    if (leaf && leaf.chequeId === cheque.id) {
      leaf.status = 'available';
      leaf.chequeId = null;
      markDirty('chequeBooks', book.id);
    }
  }
  window.releaseLeaf = releaseLeaf;

  /* ─── 6. Payee memory update ─────────────────────────────────────────── */
  function updatePayeeMemory(cheque, isNew) {
    if (!cheque.payeeId) return;
    const p = payeeObj(cheque.payeeId);
    if (!p) return;
    p.lastChequeAmount = cheque.amount;
    p.lastChequeDate = cheque.chequeDate;
    if (isNew) {
      p.totalPaid = num(p.totalPaid) + num(cheque.amount);
      p.chequeCount = num(p.chequeCount) + 1;
    }
    if (!p.defaultBankId) p.defaultBankId = cheque.bankId;
    p.updatedAt = nowISO();
    p.updatedBy = state.user?.email || 'system';
    markDirty('payees', p.id);
  }
  window.updatePayeeMemory = updatePayeeMemory;

  /* ─── 7. Cheques view ────────────────────────────────────────────────── */
  function renderCheques() {
    const all = arr(state.data.cheques).slice();
    const filter = state.filters.cheques || {};
    const q = (filter.q || '').toLowerCase();
    const status = filter.status || 'all';
    const bankId = filter.bankId || 'all';
    const from = filter.from || '';
    const to = filter.to || '';

    let list = all;
    if (q) {
      list = list.filter(c =>
        (c.chequeNo || '').toLowerCase().indexOf(q) !== -1 ||
        (c.payeeName || '').toLowerCase().indexOf(q) !== -1 ||
        (c.memo || '').toLowerCase().indexOf(q) !== -1
      );
    }
    if (status !== 'all') list = list.filter(c => c.status === status);
    if (bankId !== 'all') list = list.filter(c => c.bankId === bankId);
    if (from) list = list.filter(c => c.chequeDate >= from);
    if (to) list = list.filter(c => c.chequeDate <= to);

    list.sort((a, b) => {
      const d = String(b.chequeDate).localeCompare(String(a.chequeDate));
      if (d) return d;
      return String(b.createdAt).localeCompare(String(a.createdAt));
    });

    const totalValue = list.reduce((s, c) => s + num(c.amount), 0);

    /* KPIs */
    const need = all.filter(c =>
      c.status === 'pending_approval' ||
      (c.status === 'scheduled' && c.chequeDate <= today())
    ).length;
    const approved = all.filter(c => c.status === 'approved').length;
    const cleared = all.filter(c => c.status === 'cleared').length;
    const bounced = all.filter(c => c.status === 'bounced').length;

    return '' +
      '<div class="kpi-strip">' +
        '<div class="kpi"><div class="k-label">Total Cheques</div><div class="k-value">' + all.length + '</div></div>' +
        '<div class="kpi ' + (need ? 'danger' : '') + '">' +
          '<div class="k-label">Need Approval</div>' +
          '<div class="k-value" style="color:' + (need ? 'var(--red)' : 'var(--green)') + '">' + (need || '✓') + '</div>' +
        '</div>' +
        '<div class="kpi warn"><div class="k-label">Approved (Floating)</div><div class="k-value">' + approved + '</div></div>' +
        '<div class="kpi"><div class="k-label">Cleared</div><div class="k-value" style="color:var(--green)">' + cleared + '</div></div>' +
        '<div class="kpi ' + (bounced ? 'danger' : '') + '">' +
          '<div class="k-label">Bounced</div>' +
          '<div class="k-value" style="color:' + (bounced ? 'var(--red)' : 'var(--text-4)') + '">' + bounced + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head">' +
          '<h3>📝 Cheques (' + list.length + ')</h3>' +
          '<button class="btn primary" data-action="cheque-new">＋ Write Cheque</button>' +
        '</div>' +
        '<div class="md-filter">' +
          '<label class="field">Search' +
            '<input type="search" id="chqSearch" value="' + esc(filter.q || '') + '" placeholder="Cheque no, payee, memo…">' +
          '</label>' +
          '<label class="field">Status' +
            '<select id="chqStatus">' +
              '<option value="all"' + (status === 'all' ? ' selected' : '') + '>All</option>' +
              Object.keys(CHEQUE_STATUS).map(k =>
                '<option value="' + k + '"' + (status === k ? ' selected' : '') + '>' +
                  esc(CHEQUE_STATUS[k].label) +
                '</option>'
              ).join('') +
            '</select>' +
          '</label>' +
          '<label class="field">Bank' +
            '<select id="chqBank">' +
              '<option value="all"' + (bankId === 'all' ? ' selected' : '') + '>All banks</option>' +
              arr(state.data.banks).map(b =>
                '<option value="' + esc(b.id) + '"' + (bankId === b.id ? ' selected' : '') + '>' + esc(b.name) + '</option>'
              ).join('') +
            '</select>' +
          '</label>' +
          '<div style="display:flex;gap:6px;align-items:end">' +
            '<label class="field" style="flex:1">From' +
              '<input type="date" id="chqFrom" value="' + esc(from) + '">' +
            '</label>' +
            '<label class="field" style="flex:1">To' +
              '<input type="date" id="chqTo" value="' + esc(to) + '">' +
            '</label>' +
          '</div>' +
        '</div>' +
        (list.length
          ? '<div class="table-wrap"><table>' +
              '<thead><tr>' +
                '<th>Cheque #</th><th>Cheque Date</th><th>Payee</th><th>Bank</th>' +
                '<th class="num">Amount</th><th>Status</th><th class="actions-cell"></th>' +
              '</tr></thead><tbody>' +
              list.map(c =>
                '<tr>' +
                  '<td class="mono"><strong>' + esc(c.chequeNo || '—') + '</strong></td>' +
                  '<td>' + dateFmt(c.chequeDate) + '</td>' +
                  '<td>' +
                    '<strong>' + esc(c.payeeName || '—') + '</strong>' +
                    (c.memo ? '<div class="small muted">' + esc(c.memo).slice(0, 50) + '</div>' : '') +
                  '</td>' +
                  '<td>' + esc(bankName(c.bankId)) + '</td>' +
                  '<td class="num"><strong>' + money(c.amount) + '</strong></td>' +
                  '<td>' + chequeStatusBadge(c.status) + '</td>' +
                  '<td class="actions-cell">' +
                    ((c.status === 'scheduled' || c.status === 'pending_approval')
                      ? '<button class="btn xs primary" data-action="cheque-approve" data-id="' + esc(c.id) + '">Approve</button> '
                      : '') +
                    (c.status === 'approved'
                      ? '<button class="btn xs green" data-action="cheque-clear" data-id="' + esc(c.id) + '">Clear</button> ' +
                        '<button class="btn xs danger" data-action="cheque-bounce" data-id="' + esc(c.id) + '">Bounce</button> '
                      : '') +
                    '<button class="btn xs" data-action="cheque-open" data-id="' + esc(c.id) + '">Open</button>' +
                    (state.perms.write && (c.status === 'draft' || c.status === 'cancelled')
                      ? ' <button class="btn xs" data-action="cheque-edit" data-id="' + esc(c.id) + '">Edit</button>'
                      : '') +
                    (state.perms.delete && ['draft', 'cancelled', 'void'].includes(c.status)
                      ? ' <button class="btn xs danger" data-action="cheque-delete" data-id="' + esc(c.id) + '">🗑</button>'
                      : '') +
                  '</td>' +
                '</tr>'
              ).join('') +
            '</tbody>' +
            '<tfoot><tr>' +
              '<td colspan="4" style="text-align:right">TOTAL (' + list.length + ')</td>' +
              '<td class="num">' + money(totalValue) + '</td>' +
              '<td colspan="2"></td>' +
            '</tr></tfoot></table></div>'
          : '<div class="empty"><span class="big">📝</span>' +
            (all.length ? 'No cheques match the filter.' : 'No cheques yet. Click <strong>Write Cheque</strong>.') +
            '</div>') +
      '</div>';
  }

  /* ─── 8. Cheque form ─────────────────────────────────────────────────── */
  function openChequeForm(id) {
    if (!state.perms.write) { toast('Read-only role — cannot edit', 'error'); return; }

    const c = id ? chequeObj(id) : null;
    if (c && !['draft', 'cancelled', 'pending_approval'].includes(c.status)) {
      toast('This cheque can no longer be edited (' + c.status + ')', 'error');
      return;
    }

    const banks = arr(state.data.banks).filter(b => b.active !== false);
    if (!banks.length) { toast('Add a bank first', 'warn'); return; }

    const defaultBankId = c?.bankId || banks[0].id;

    const body =
      /* Payee + payee type */
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">' +
        '<label class="field">Payee' +
          '<div class="payee-input-wrap">' +
            '<input id="chqPayeeSearch" placeholder="Type name to search or add new…" autocomplete="off" value="' + esc(c?.payeeName || '') + '">' +
            '<div class="payee-suggestions" id="chqPayeeSuggestions"></div>' +
          '</div>' +
        '</label>' +
        selectField('Payee Type', 'chqPayeeType',
          Object.keys(PAYEE_TYPES).map(k => ({ value: k, label: PAYEE_TYPES[k].ico + ' ' + PAYEE_TYPES[k].label })),
          c?.payeeType || 'supplier') +
      '</div>' +

      /* Bank + book */
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">' +
        selectField('Bank Account', 'chqBank', banks.map(b => ({ value: b.id, label: b.name })), defaultBankId, { req: true }) +
        '<label class="field">Cheque Book<select id="chqBook"><option value="">— Manual / No book —</option></select></label>' +
      '</div>' +

      /* Cheque # + leaf */
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">' +
        field('Cheque Number', 'chqNo', c?.chequeNo || '', { placeholder: 'Auto from leaf or manual' }) +
        '<label class="field">Leaf<select id="chqLeaf"><option value="">— Manual —</option></select></label>' +
      '</div>' +

      /* Amount + date */
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">' +
        field('Amount', 'chqAmount', c ? num(c.amount).toFixed(2) : '', { type: 'number', step: '0.01', min: 0, req: true, placeholder: '0.00' }) +
        field('Cheque Date', 'chqDate', c?.chequeDate || today(), { type: 'date', req: true }) +
      '</div>' +

      /* Words */
      '<div style="margin-bottom:14px">' + field('Amount in Words', 'chqWords', c?.amountWords || '') + '</div>' +

      /* Preview */
      '<div id="chqPreviewWrap"></div>' +

      /* Memo + written date */
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">' +
        field('Memo / Purpose', 'chqMemo', c?.memo || '', { placeholder: 'e.g. Invoice #123 payment' }) +
        field('Written Date', 'chqWrittenDate', c?.writtenDate || today(), { type: 'date' }) +
      '</div>' +

      /* Notes */
      '<div style="margin-top:14px">' + field('Notes', 'chqNotes', c?.notes || '', { type: 'textarea' }) + '</div>' +

      /* Balance hint */
      '<div id="chqBalanceHint" style="margin-top:16px;padding:12px 14px;background:var(--surface-2);border-radius:var(--r-md);font-size:12.5px"></div>';

    openModal(c ? '✏️ Edit Cheque' : '＋ Write New Cheque', body, {
      width: 780,
      footer:
        '<button class="btn" data-close-modal>Cancel</button>' +
        '<button class="btn primary" id="chqSaveBtn">' + (c ? 'Update' : 'Save Cheque') + '</button>'
    });

    /* ── Wiring ── */
    const bankSel   = document.getElementById('chqBank');
    const bookSel   = document.getElementById('chqBook');
    const leafSel   = document.getElementById('chqLeaf');
    const noInput   = document.getElementById('chqNo');
    const amountInput = document.getElementById('chqAmount');
    const wordsInput  = document.getElementById('chqWords');
    const payeeSearch = document.getElementById('chqPayeeSearch');
    const suggestBox  = document.getElementById('chqPayeeSuggestions');
    let selectedPayeeId = c?.payeeId || null;

    /* Balance hint */
    function updateBalanceHint() {
      const hint = document.getElementById('chqBalanceHint');
      if (!hint) return;
      const bid = bankSel.value;
      if (!bid) { hint.innerHTML = ''; return; }
      const bal = bankBalances(bid);
      const amt = num(amountInput.value);
      const afterBook = bal.book - amt;
      const afterBank = bal.bank - amt;
      hint.innerHTML =
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">' +
          '<div><div class="k-label">Bank now</div><strong>' + money(bal.bank) + '</strong></div>' +
          '<div><div class="k-label">Book now</div><strong style="color:var(--accent)">' + money(bal.book) + '</strong></div>' +
          '<div><div class="k-label">Book after</div>' +
            '<strong style="color:' + (afterBook < 0 ? 'var(--red)' : 'var(--green)') + '">' + money(afterBook) + '</strong></div>' +
        '</div>' +
        (afterBook < 0
          ? '<div style="margin-top:8px;color:var(--red);font-weight:600">⚠ Insufficient book balance — overdraft risk of ' + money(Math.abs(afterBook)) + '</div>'
          : (afterBook < 50000 && afterBook > 0
            ? '<div style="margin-top:8px;color:var(--amber);font-weight:600">⚠ Low book balance after this cheque</div>'
            : ''));
    }

    /* Cascade: bank → books → leaves */
    function refreshBooks() {
      const bid = bankSel.value;
      const books = arr(state.data.chequeBooks).filter(b => b.bankId === bid && b.active !== false);
      bookSel.innerHTML = '<option value="">— Manual / No book —</option>' +
        books.map(b =>
          '<option value="' + esc(b.id) + '"' + (c?.bookId === b.id ? ' selected' : '') + '>' +
            esc(b.bookNo) + ' (' + esc(b.serialStart) + '–' + esc(b.serialEnd) + ')' +
          '</option>'
        ).join('');
      refreshLeaves();
      updateBalanceHint();
    }

    function refreshLeaves() {
      const bkid = bookSel.value;
      const book = bkid ? bookObj(bkid) : null;
      if (!book) { leafSel.innerHTML = '<option value="">— Manual —</option>'; return; }
      const avail = arr(book.leaves)
        .map((l, i) => ({ serial: l.serial, status: l.status, idx: i }))
        .filter(l => l.status === 'available');
      leafSel.innerHTML = '<option value="">— Pick leaf —</option>' +
        avail.map(l =>
          '<option value="' + l.idx + '"' + (c?.leafId === l.idx ? ' selected' : '') + '>' +
            esc(l.serial) +
          '</option>'
        ).join('');
      if (!c && avail.length) {
        leafSel.value = avail[0].idx;
        noInput.value = avail[0].serial;
      }
    }

    bankSel.onchange = refreshBooks;
    bookSel.onchange = refreshLeaves;
    leafSel.onchange = () => {
      const idx = leafSel.value;
      if (idx === '') return;
      const book = bookObj(bookSel.value);
      if (!book) return;
      const leaf = arr(book.leaves)[parseInt(idx, 10)];
      if (leaf) noInput.value = leaf.serial;
    };

    amountInput.oninput = () => {
      const v = num(amountInput.value);
      wordsInput.value = v > 0 ? numberToWords(v) : '';
      renderChequePreview();
      updateBalanceHint();
    };
    document.getElementById('chqDate').oninput = renderChequePreview;

    /* Cheque preview */
    function renderChequePreview() {
      const wrap = document.getElementById('chqPreviewWrap');
      if (!wrap) return;
      const amt = num(amountInput.value);
      if (amt <= 0) { wrap.innerHTML = ''; return; }
      const bank = bankObj(bankSel.value);
      const payee = payeeSearch.value.trim();
      const words = wordsInput.value;
      const dateStr = document.getElementById('chqDate').value;
      const no = noInput.value;
      wrap.innerHTML =
        '<div class="cheque-preview">' +
          '<div class="cp-row"><span class="cp-label">Bank</span><span>' + esc(bank ? (bank.bankName || bank.name) : '—') + '</span></div>' +
          '<div class="cp-row"><span class="cp-label">Pay to</span><span style="font-weight:600">' + esc(payee || '________________') + '</span></div>' +
          '<div class="cp-words">' + esc(words || '________________') + '</div>' +
          '<div class="cp-row"><span class="cp-label">Amount</span><span class="cp-amount-box">' + money(amt, { plain: true }) + '</span></div>' +
          '<div class="cp-row" style="margin-top:8px"><span class="cp-label">Date</span><span>' + (dateStr ? dateFmt(dateStr) : '____ / ____ / ______') + '</span></div>' +
          '<div class="cp-row"><span class="cp-label">Cheque #</span><span class="mono">' + esc(no || '—') + '</span></div>' +
          '<div class="micr-line">‖ ' + esc(no || '000000') + ' ‖ ' + esc(bank?.accountNo || '0000000000') + ' ‖</div>' +
        '</div>';
    }

    /* Payee autocomplete */
    function renderPayeeSuggestions() {
      const q = payeeSearch.value.trim().toLowerCase();
      if (!q) { suggestBox.classList.remove('open'); return; }
      const matches = arr(state.data.payees)
        .filter(p => p.active !== false)
        .filter(p => (p.name || '').toLowerCase().indexOf(q) !== -1)
        .slice(0, 8);

      if (!matches.length) {
        suggestBox.innerHTML =
          '<div class="payee-suggestion" data-action="payee-quick-new">' +
            '＋ Add new payee: <strong>' + esc(payeeSearch.value.trim()) + '</strong>' +
          '</div>';
        suggestBox.classList.add('open');
        return;
      }

      suggestBox.innerHTML = matches.map(p =>
        '<div class="payee-suggestion" data-payee-id="' + esc(p.id) + '">' +
          '<div>' + esc(p.name) +
            '<span class="type-tag">' + esc((PAYEE_TYPES[p.type] || PAYEE_TYPES.other).label) + '</span>' +
          '</div>' +
          (num(p.lastChequeAmount) > 0
            ? '<div class="last-info">Last: ' + money(p.lastChequeAmount) +
              (p.lastChequeDate ? ' on ' + dateFmt(p.lastChequeDate) : '') + '</div>'
            : '') +
        '</div>'
      ).join('') +
      '<div class="payee-suggestion" data-action="payee-quick-new">' +
        '＋ Add new payee: <strong>' + esc(payeeSearch.value.trim()) + '</strong>' +
      '</div>';
      suggestBox.classList.add('open');
    }

    suggestBox.addEventListener('click', (e) => {
      const item = e.target.closest('.payee-suggestion');
      if (!item) return;

      if (item.dataset.action === 'payee-quick-new') {
        quickCreatePayeeAndContinue(payeeSearch.value.trim());
        return;
      }

      const p = payeeObj(item.dataset.payeeId);
      if (!p) return;

      payeeSearch.value = p.name;
      selectedPayeeId = p.id;
      document.getElementById('chqPayeeType').value = p.type;

      /* Smart memory fill */
      if (num(p.lastChequeAmount) > 0 && !num(amountInput.value)) {
        amountInput.value = num(p.lastChequeAmount).toFixed(2);
        wordsInput.value = numberToWords(p.lastChequeAmount);
      }
      if (p.defaultBankId && banks.find(b => b.id === p.defaultBankId)) {
        bankSel.value = p.defaultBankId;
        refreshBooks();
      }
      suggestBox.classList.remove('open');
      renderChequePreview();
      updateBalanceHint();
    });

    document.addEventListener('click', function closeSug(ev) {
      if (!ev.target.closest('.payee-input-wrap')) {
        const box = document.getElementById('chqPayeeSuggestions');
        if (box) box.classList.remove('open');
      }
    });

    payeeSearch.oninput = () => { renderPayeeSuggestions(); renderChequePreview(); };

    /* Initial cascade */
    refreshBooks();
    if (c?.bookId) {
      bookSel.value = c.bookId;
      refreshLeaves();
      if (c?.leafId !== null && c?.leafId !== undefined) leafSel.value = String(c.leafId);
    }
    if (c) renderChequePreview();
    updateBalanceHint();

    /* Save handler */
    document.getElementById('chqSaveBtn').onclick = () => {
      const payload = {
        chequeNo: noInput.value.trim(),
        bankId: bankSel.value,
        bookId: bookSel.value || '',
        leafId: leafSel.value !== '' ? parseInt(leafSel.value, 10) : null,
        payeeId: selectedPayeeId,
        payeeType: document.getElementById('chqPayeeType').value || 'supplier',
        payeeName: payeeSearch.value.trim(),
        amount: num(amountInput.value),
        amountWords: wordsInput.value,
        chequeDate: document.getElementById('chqDate').value || today(),
        writtenDate: document.getElementById('chqWrittenDate').value || today(),
        memo: document.getElementById('chqMemo').value.trim(),
        notes: document.getElementById('chqNotes').value.trim()
      };
      saveCheque(c, payload);
    };
  }
  window.openChequeForm = openChequeForm;

  /* ─── 9. Quick-create payee from cheque form ─────────────────────────── */
  function quickCreatePayeeAndContinue(name) {
    const tempType = document.getElementById('chqPayeeType').value || 'supplier';
    const wrap = document.getElementById('modalWrap');
    const existing = wrap.innerHTML;

    openModal('＋ Add New Payee',
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
        selectField('Type', 'qpType',
          Object.keys(PAYEE_TYPES).map(k => ({ value: k, label: PAYEE_TYPES[k].ico + ' ' + PAYEE_TYPES[k].label })),
          tempType, { req: true }) +
        field('Name', 'qpName', name, { req: true }) +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">' +
        field('Phone', 'qpPhone', '', { placeholder: 'Optional' }) +
        field('Email', 'qpEmail', '', { type: 'email', placeholder: 'Optional' }) +
      '</div>',
      {
        width: 600,
        footer:
          '<button class="btn" id="qpCancelBtn">Back</button>' +
          '<button class="btn primary" id="qpSaveBtn">Create</button>'
      }
    );

    document.getElementById('qpCancelBtn').onclick = () => { wrap.innerHTML = existing; };
    document.getElementById('qpSaveBtn').onclick = () => {
      const pName = document.getElementById('qpName').value.trim();
      if (!pName) { toast('Name is required', 'error'); return; }
      const created = makePayee({
        type: document.getElementById('qpType').value,
        name: pName,
        phone: document.getElementById('qpPhone').value.trim(),
        email: document.getElementById('qpEmail').value.trim()
      });
      state.data.payees.push(created);
      markDirty('payees', created.id);
      toast('Payee created', 'success');
      wrap.innerHTML = existing;

      /* Refill form */
      const ps = document.getElementById('chqPayeeSearch');
      if (ps) ps.value = pName;
      const pt = document.getElementById('chqPayeeType');
      if (pt) pt.value = created.type;
      window.__lastQuickPayee = created.id;
    };
  }
  window.quickCreatePayeeAndContinue = quickCreatePayeeAndContinue;

  /* ─── 10. Save cheque ────────────────────────────────────────────────── */
  function saveCheque(existing, data) {
    if (!state.perms.write) { toast('Read-only role', 'error'); return; }
    if (!data.payeeName)   { toast('Payee name is required', 'error'); return; }
    if (!data.bankId)      { toast('Bank is required', 'error'); return; }
    if (data.amount <= 0)  { toast('Amount must be greater than zero', 'error'); return; }
    if (!data.chequeDate)  { toast('Cheque date is required', 'error'); return; }

    /* Resolve payee ID */
    if (!data.payeeId && window.__lastQuickPayee) {
      data.payeeId = window.__lastQuickPayee;
      window.__lastQuickPayee = null;
    }
    if (!data.payeeId) {
      const match = arr(state.data.payees).find(p =>
        p.name.toLowerCase() === data.payeeName.toLowerCase()
      );
      if (match) data.payeeId = match.id;
    }

    /* Overdraft warning */
    const bal = bankBalances(data.bankId);
    const afterBook = bal.book - data.amount;
    if (afterBook < 0) {
      const ok = confirm(
        '⚠ This cheque will push the BOOK balance to ' + money(afterBook) + '\n\n' +
        'Bank balance:      ' + money(bal.bank) + '\n' +
        'Book balance now:  ' + money(bal.book) + '\n' +
        'Cheque amount:     ' + money(data.amount) + '\n\n' +
        'Continue anyway?'
      );
      if (!ok) return;
    }

    /* Status logic */
    const isFuture = data.chequeDate > today();
    const newStatus = isFuture ? 'scheduled' : 'pending_approval';

    if (existing) {
      /* Release old leaf */
      releaseLeaf(existing);

      const before = JSON.parse(JSON.stringify(existing));
      Object.assign(existing, data);
      existing.status = newStatus;
      existing.amountWords = numberToWords(data.amount);
      existing.updatedAt = nowISO();
      existing.updatedBy = state.user?.email || 'system';
      markDirty('cheques', existing.id);

      reserveLeaf(existing);
      updatePayeeMemory(existing, false);

      toast('Cheque updated', 'success');
    } else {
      const created = makeCheque(Object.assign({}, data, { status: newStatus }));
      state.data.cheques.push(created);
      markDirty('cheques', created.id);
      reserveLeaf(created);
      updatePayeeMemory(created, true);

      toast(
        isFuture
          ? 'Scheduled for ' + dateFmt(created.chequeDate)
          : 'Cheque saved — awaiting approval',
        'success'
      );
    }

    closeModal();
    renderApp();
  }
  window.saveCheque = saveCheque;

  /* ─── 11. Delete cheque ──────────────────────────────────────────────── */
  function deleteChequeById(id) {
    if (!state.perms.delete) { toast('No delete permission', 'error'); return; }
    const c = chequeObj(id);
    if (!c) return;
    if (!['draft', 'cancelled', 'void'].includes(c.status)) {
      toast('Only draft/cancelled/void cheques can be deleted', 'error');
      return;
    }
    if (!confirm('Delete cheque ' + c.chequeNo + '?')) return;

    releaseLeaf(c);

    state.data.cheques = state.data.cheques.filter(x => x.id !== id);
    _dirty.add('cheques:' + id);
    delete _snapshot['cheques:' + id];
    scheduleSync();

    closeModal();
    toast('Cheque deleted', 'success');
    renderApp();
  }
  window.deleteChequeById = deleteChequeById;

  /* ─── 12. Cheque detail modal ────────────────────────────────────────── */
  function openChequeDetail(id) {
    const c = chequeObj(id);
    if (!c) return;
    const bank  = bankObj(c.bankId);
    const book  = bookObj(c.bookId);
    const payee = payeeObj(c.payeeId);
    const bal   = bankBalances(c.bankId);

    /* Build timeline */
    const timeline = [];
    timeline.push({
      ico: '📝', color: 'var(--text-3)',
      label: 'Created',
      when: c.createdAt,
      by: c.createdBy
    });
    if (c.status === 'scheduled' || c.status === 'pending_approval' || c.approvedAt) {
      timeline.push({
        ico: '⏰', color: 'var(--blue)',
        label: 'Scheduled for ' + dateFmt(c.chequeDate),
        when: c.createdAt,
        by: c.createdBy
      });
    }
    if (c.status === 'pending_approval') {
      timeline.push({
        ico: '⏳', color: 'var(--amber)',
        label: 'Awaiting approval',
        when: nowISO(),
        by: null
      });
    }
    if (c.approvedAt) {
      timeline.push({
        ico: '✓', color: 'var(--green)',
        label: 'Approved',
        when: c.approvedAt,
        by: c.approvedBy
      });
    }
    if (c.clearedAt) {
      timeline.push({
        ico: '✓', color: 'var(--green)',
        label: 'Cleared at bank',
        when: c.clearedAt,
        by: null
      });
    }
    if (c.bouncedAt) {
      timeline.push({
        ico: '⚠', color: 'var(--red)',
        label: 'Bounced' + (c.bounceReason ? ' — ' + c.bounceReason : ''),
        when: c.bouncedAt,
        by: null
      });
    }
    if (c.cancelledAt) {
      timeline.push({
        ico: '✗', color: 'var(--text-3)',
        label: 'Cancelled' + (c.cancelReason ? ' — ' + c.cancelReason : ''),
        when: c.cancelledAt,
        by: null
      });
    }
    if (c.voidAt) {
      timeline.push({
        ico: '✗', color: 'var(--text-3)',
        label: 'Voided' + (c.voidReason ? ' — ' + c.voidReason : ''),
        when: c.voidAt,
        by: null
      });
    }
    if (c.reissuedChequeId) {
      timeline.push({
        ico: '🔁', color: 'var(--accent)',
        label: 'Reissued as new cheque',
        when: nowISO(),
        by: null
      });
    }

    const body =
      /* Header */
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px">' +
        '<div><div class="k-label">Cheque #</div>' +
          '<div style="font-weight:600;font-family:var(--mono)">' + esc(c.chequeNo || '—') + '</div></div>' +
        '<div><div class="k-label">Status</div>' +
          '<div>' + chequeStatusBadge(c.status) + '</div></div>' +
        '<div><div class="k-label">Cheque Date</div>' +
          '<div style="font-weight:600">' + dateFmt(c.chequeDate) + '</div></div>' +
        '<div><div class="k-label">Written Date</div>' +
          '<div style="font-weight:600">' + dateFmt(c.writtenDate) + '</div></div>' +
      '</div>' +

      /* Payee */
      '<div style="margin-bottom:18px">' +
        '<div class="k-label">Payee</div>' +
        '<div style="font-size:16px;font-weight:600">' + esc(c.payeeName || '—') + '</div>' +
        (payee
          ? '<div class="small muted">' + payeeTypeBadge(payee.type) +
            (payee.phone ? ' · ' + esc(payee.phone) : '') +
            (payee.email ? ' · ' + esc(payee.email) : '') +
            '</div>'
          : '') +
      '</div>' +

      /* Amount */
      '<div style="background:var(--surface-2);padding:14px 18px;border-radius:var(--r-md);margin-bottom:18px">' +
        '<div class="k-label">Amount</div>' +
        '<div style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums">' + money(c.amount) + '</div>' +
        '<div class="small muted" style="margin-top:6px">' + esc(c.amountWords) + '</div>' +
      '</div>' +

      /* Bank position (only relevant statuses) */
      (['approved', 'cleared', 'bounced'].includes(c.status)
        ? '<div class="balance-impact" style="margin-bottom:18px">' +
            '<div class="k-label" style="margin-bottom:8px">Bank position now</div>' +
            '<div class="row"><div class="label">Bank</div><div class="from" style="grid-column:2/5;text-align:right">' + money(bal.bank) + '</div></div>' +
            '<div class="row"><div class="label">Book</div><div class="from" style="grid-column:2/5;text-align:right;color:var(--accent)">' + money(bal.book) + '</div></div>' +
            '<div class="row"><div class="label">Floating</div><div class="from" style="grid-column:2/5;text-align:right;color:var(--amber)">' + money(bal.floating) + '</div></div>' +
          '</div>'
        : '') +

      /* Bank + book */
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px">' +
        '<div><div class="k-label">Bank</div><div>' + esc(bank ? bank.name : '—') +
          (bank && bank.accountNo ? '<div class="small muted mono">' + esc(bank.accountNo) + '</div>' : '') +
        '</div></div>' +
        '<div><div class="k-label">Cheque Book</div><div>' + esc(book ? book.bookNo : '—') +
          (book && c.leafId !== null && c.leafId !== undefined
            ? '<div class="small muted">Leaf ' + esc(arr(book.leaves)[c.leafId]?.serial || '—') + '</div>'
            : '') +
        '</div></div>' +
      '</div>' +

      /* Memo & notes */
      (c.memo ? '<div style="margin-bottom:18px"><div class="k-label">Memo</div><div>' + esc(c.memo) + '</div></div>' : '') +
      (c.notes ? '<div style="margin-bottom:18px"><div class="k-label">Notes</div><div>' + esc(c.notes) + '</div></div>' : '') +

      /* Timeline */
      '<div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border)">' +
        '<div class="k-label" style="margin-bottom:10px">Timeline</div>' +
        '<div style="display:flex;flex-direction:column;gap:10px">' +
          timeline.map(t =>
            '<div style="display:flex;align-items:flex-start;gap:10px;font-size:12.5px">' +
              '<span style="font-size:14px;color:' + t.color + '">' + t.ico + '</span>' +
              '<div style="flex:1">' +
                '<div style="font-weight:500">' + esc(t.label) + '</div>' +
                '<div class="small muted">' + dateTimeFmt(t.when) +
                  (t.by ? ' · ' + esc(t.by) : '') +
                '</div>' +
              '</div>' +
            '</div>'
          ).join('') +
        '</div>' +
      '</div>' +

      /* Envelope */
      '<div style="margin-top:22px;padding-top:16px;border-top:1px solid var(--border);' +
        'display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:12px;color:var(--text-3)">' +
        '<div><strong>Created:</strong> ' + dateTimeFmt(c.createdAt) + '</div>' +
        '<div><strong>Updated:</strong> ' + dateTimeFmt(c.updatedAt) + '</div>' +
        '<div><strong>Created by:</strong> ' + esc(c.createdBy || '—') + '</div>' +
        '<div><strong>Updated by:</strong> ' + esc(c.updatedBy || '—') + '</div>' +
      '</div>';

    /* Actions */
    let actions = '';
    if (state.perms.approve && (c.status === 'scheduled' || c.status === 'pending_approval')) {
      actions += '<button class="btn primary" data-action="cheque-approve" data-id="' + esc(c.id) + '">Approve</button> ';
      actions += '<button class="btn" data-action="cheque-reject" data-id="' + esc(c.id) + '">Reject</button> ';
    }
    if (state.perms.write && c.status === 'approved') {
      actions += '<button class="btn green" data-action="cheque-clear" data-id="' + esc(c.id) + '">Mark Cleared</button> ';
      actions += '<button class="btn danger" data-action="cheque-bounce" data-id="' + esc(c.id) + '">Bounce</button> ';
      actions += '<button class="btn danger" data-action="cheque-void" data-id="' + esc(c.id) + '">Void</button> ';
    }
    if (state.perms.write && ['draft', 'cancelled', 'pending_approval'].includes(c.status)) {
      actions += '<button class="btn" data-action="cheque-edit" data-id="' + esc(c.id) + '">Edit</button> ';
    }
    if (state.perms.delete && ['draft', 'cancelled', 'void'].includes(c.status)) {
      actions += '<button class="btn danger" data-action="cheque-delete" data-id="' + esc(c.id) + '">Delete</button> ';
    }
    actions += '<button class="btn" data-close-modal>Close</button>';

    openModal('📝 Cheque Details', body, { width: 740, footer: actions });
  }
  window.openChequeDetail = openChequeDetail;

  /* ─── 13. Action registrations ───────────────────────────────────────── */
  __LS_registerAction('cheque-new',    () => openChequeForm(null));
  __LS_registerAction('cheque-edit',   (ev, id) => { ev.stopPropagation(); closeModal(); setTimeout(() => openChequeForm(id), 0); });
  __LS_registerAction('cheque-open',   (ev, id) => { ev.stopPropagation(); openChequeDetail(id); });
  __LS_registerAction('cheque-delete', (ev, id) => { ev.stopPropagation(); deleteChequeById(id); });

  /* Approval actions are NOT registered here — they belong to S04.
     But if S04 isn't loaded yet, provide a friendly "coming soon". */
  ['cheque-approve', 'cheque-reject', 'cheque-snooze', 'cheque-clear', 'cheque-bounce', 'cheque-void']
    .forEach(a => {
      __LS_registerAction(a, (ev, id) => {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        if (window.__lsS04Ready) return; /* S04 will override */
        toast('Approval workflow arrives in the next update', 'info');
      });
    });

  /* ─── 14. Route + nav ────────────────────────────────────────────────── */
  __LS_addRoute('cheques', 'Cheques', renderCheques);
  __LS_addNav({
    group: 'Cheques',
    id: 'cheques',
    ico: '📝',
    label: 'All Cheques',
    badgeFn: function () {
      return arr(state.data.cheques).filter(c =>
        c.status === 'pending_approval' ||
        (c.status === 'scheduled' && c.chequeDate <= today())
      ).length;
    }
  });

  /* ─── 15. Init — patch bindView to add cheque filters ────────────────── */
  __LS_register('S03', function () {
    const prevBind = window.bindView;

    window.bindView = function () {
      try { if (prevBind) prevBind(); }
      catch (e) { dbg.warn('bindView previous threw: ' + e.message); }

      /* Cheques filters */
      const cs = document.getElementById('chqSearch');
      if (cs) cs.oninput = () => {
        clearTimeout(cs._t);
        cs._t = setTimeout(() => {
          state.filters.cheques = Object.assign({}, state.filters.cheques, { q: cs.value });
          renderApp();
        }, 220);
      };
      const cst = document.getElementById('chqStatus');
      if (cst) cst.onchange = () => {
        state.filters.cheques = Object.assign({}, state.filters.cheques, { status: cst.value });
        renderApp();
      };
      const cb = document.getElementById('chqBank');
      if (cb) cb.onchange = () => {
        state.filters.cheques = Object.assign({}, state.filters.cheques, { bankId: cb.value });
        renderApp();
      };
      const cf = document.getElementById('chqFrom');
      if (cf) cf.onchange = () => {
        state.filters.cheques = Object.assign({}, state.filters.cheques, { from: cf.value });
        renderApp();
      };
      const ct = document.getElementById('chqTo');
      if (ct) ct.onchange = () => {
        state.filters.cheques = Object.assign({}, state.filters.cheques, { to: ct.value });
        renderApp();
      };
    };

    scriptLoaded('S03');
  });

})();
</script>
<!-- ═══════════════════════════════════════════════════════════════════════
     S04 — DUAL BALANCE ENGINE + APPROVAL WORKFLOW + DUE POPUP
     Drops in before </body>, after S03.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════════
     1. DUAL BALANCE ENGINE — replaces S01 stub
     ═══════════════════════════════════════════════════════════════════════

     Bank     = opening − cleared − bank adjustments (adjustments added in S05)
     Book     = Bank − floating
     Floating = approved, not yet cleared

     Bounced/void cheques with bankRecredited=true do NOT affect Bank again
     (because they were never actually cleared in the first place — Bank was
      only reduced on Clear).
     ═══════════════════════════════════════════════════════════════════════ */
  function bankBalances(bankId) {
    const bank = bankObj(bankId);
    if (!bank) return {
      bank: 0, book: 0, floating: 0,
      opening: 0, clearedTotal: 0, approvedPendingTotal: 0, adjustmentsTotal: 0
    };

    const opening = num(bank.openingBalance);
    const cheques = arr(state.data.cheques).filter(c => c.bankId === bankId);

    /* Cleared = money actually left the bank */
    const clearedTotal = cheques
      .filter(c => c.status === 'cleared')
      .reduce((s, c) => s + num(c.amount), 0);

    /* Floating = approved but not yet cleared */
    const floatingCheques = cheques.filter(c => c.status === 'approved');
    const approvedPendingTotal = floatingCheques.reduce((s, c) => s + num(c.amount), 0);

    /* Bank adjustments (populated by S05 — kept here so engine is final) */
    const adjustmentsTotal = arr(state.data.bankAdjustments || [])
      .filter(a => a.bankId === bankId)
      .reduce((s, a) => s + num(a.signedAmount !== undefined ? a.signedAmount : a.amount), 0);

    const bankValue = opening - clearedTotal + adjustmentsTotal;
    const bookValue = bankValue - approvedPendingTotal;

    return {
      bank: bankValue,
      book: bookValue,
      floating: approvedPendingTotal,
      opening: opening,
      clearedTotal: clearedTotal,
      approvedPendingTotal: approvedPendingTotal,
      adjustmentsTotal: adjustmentsTotal
    };
  }
  window.bankBalances = bankBalances;

  function totalBankBalance() {
    const list = arr(state.data.banks).filter(b => b.active !== false);
    return {
      bank:     list.reduce((s, b) => s + bankBalances(b.id).bank, 0),
      book:     list.reduce((s, b) => s + bankBalances(b.id).book, 0),
      floating: list.reduce((s, b) => s + bankBalances(b.id).floating, 0)
    };
  }
  window.totalBankBalance = totalBankBalance;

  /* ═══════════════════════════════════════════════════════════════════════
     2. SNOOZE + POPUP STORAGE
     ═══════════════════════════════════════════════════════════════════════ */
  function getSnoozeMap() {
    try { return JSON.parse(localStorage.getItem(CONFIG.snoozeKey) || '{}'); }
    catch (e) { return {}; }
  }
  function setSnooze(id, untilDate) {
    const map = getSnoozeMap();
    map[id] = untilDate;
    try { localStorage.setItem(CONFIG.snoozeKey, JSON.stringify(map)); } catch (e) {}
  }
  function clearSnooze(id) {
    const map = getSnoozeMap();
    delete map[id];
    try { localStorage.setItem(CONFIG.snoozeKey, JSON.stringify(map)); } catch (e) {}
  }
  function isSnoozed(id) {
    const map = getSnoozeMap();
    const until = map[id];
    if (!until) return false;
    return until > today();
  }
  window.isSnoozed = isSnoozed;

  /* ═══════════════════════════════════════════════════════════════════════
     3. CHEQUES NEEDING ATTENTION
     - scheduled cheques whose date has arrived → auto-promoted to pending
     - pending_approval cheques
     - not snoozed
     ═══════════════════════════════════════════════════════════════════════ */
  function chequesNeedingAttention() {
    return arr(state.data.cheques)
      .filter(c => {
        if (c.status === 'pending_approval') return true;
        if (c.status === 'scheduled' && c.chequeDate <= today()) return true;
        return false;
      })
      .filter(c => !isSnoozed(c.id))
      .sort((a, b) => String(a.chequeDate).localeCompare(String(b.chequeDate)));
  }
  window.chequesNeedingAttention = chequesNeedingAttention;

  /* ═══════════════════════════════════════════════════════════════════════
     4. AUTO-TRANSITION: scheduled → pending_approval on/after cheque date
     ═══════════════════════════════════════════════════════════════════════ */
  function autoTransitionStatuses() {
    const t = today();
    let changed = 0;
    arr(state.data.cheques).forEach(c => {
      if (c.status === 'scheduled' && c.chequeDate <= t) {
        c.status = 'pending_approval';
        c.updatedAt = nowISO();
        c.updatedBy = state.user?.email || 'system';
        markDirty('cheques', c.id);
        changed++;
      }
    });
    if (changed) dbg.ok('Auto-transitioned ' + changed + ' cheque(s) to pending_approval');
    return changed;
  }
  window.autoTransitionStatuses = autoTransitionStatuses;

  /* ═══════════════════════════════════════════════════════════════════════
     5. APPROVALS PAGE
     ═══════════════════════════════════════════════════════════════════════ */
  function renderApprovals() {
    const list = chequesNeedingAttention();
    const totalDue = list.reduce((s, c) => s + num(c.amount), 0);
    const todayCount = list.filter(c => c.chequeDate === today()).length;
    const overdue = list.filter(c => c.chequeDate < today()).length;

    return '' +
      '<div class="kpi-strip">' +
        '<div class="kpi ' + (list.length ? 'danger' : '') + '">' +
          '<div class="k-label">Awaiting Approval</div>' +
          '<div class="k-value">' + list.length + '</div>' +
        '</div>' +
        '<div class="kpi ' + (list.length ? 'danger' : '') + '">' +
          '<div class="k-label">Total Value</div>' +
          '<div class="k-value" style="font-size:18px">' + money(totalDue) + '</div>' +
        '</div>' +
        '<div class="kpi"><div class="k-label">Today</div><div class="k-value">' + todayCount + '</div></div>' +
        '<div class="kpi ' + (overdue ? 'warn' : '') + '">' +
          '<div class="k-label">Overdue</div>' +
          '<div class="k-value" style="color:' + (overdue ? 'var(--amber)' : 'var(--text-4)') + '">' + overdue + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head"><h3>⏰ Cheques Awaiting Approval</h3></div>' +
        (list.length
          ? '<div class="table-wrap"><table>' +
              '<thead><tr>' +
                '<th>Cheque #</th><th>Cheque Date</th><th>Days</th><th>Payee</th><th>Bank</th>' +
                '<th class="num">Amount</th><th class="actions-cell"></th>' +
              '</tr></thead><tbody>' +
              list.map(c => {
                const days = diffDays(c.chequeDate, today());
                const daysLabel = days === 0
                  ? '<span class="badge amber">Today</span>'
                  : (days > 0
                    ? '<span class="badge red">' + days + 'd overdue</span>'
                    : '<span class="badge blue">' + (-days) + 'd</span>');
                return '<tr>' +
                  '<td class="mono"><strong>' + esc(c.chequeNo) + '</strong></td>' +
                  '<td>' + dateFmt(c.chequeDate) + '</td>' +
                  '<td>' + daysLabel + '</td>' +
                  '<td>' + esc(c.payeeName || '—') + '</td>' +
                  '<td>' + esc(bankName(c.bankId)) + '</td>' +
                  '<td class="num"><strong>' + money(c.amount) + '</strong></td>' +
                  '<td class="actions-cell">' +
                    '<button class="btn xs primary" data-action="cheque-approve" data-id="' + esc(c.id) + '">Approve</button> ' +
                    '<button class="btn xs" data-action="cheque-reject" data-id="' + esc(c.id) + '">Reject</button> ' +
                    '<button class="btn xs" data-action="cheque-snooze" data-id="' + esc(c.id) + '">Snooze</button> ' +
                    '<button class="btn xs" data-action="cheque-open" data-id="' + esc(c.id) + '">Open</button>' +
                  '</td>' +
                '</tr>';
              }).join('') +
            '</tbody></table></div>'
          : '<div class="empty"><span class="big">✓</span>All clear. Nothing waiting for approval.</div>') +
      '</div>';
  }
  window.renderApprovals = renderApprovals;

  /* ═══════════════════════════════════════════════════════════════════════
     6. APPROVE DIALOG — shows balance impact, deducts Book on confirm
     ═══════════════════════════════════════════════════════════════════════ */
  function openApproveDialog(id) {
    const c = chequeObj(id);
    if (!c) return;
    if (!state.perms.approve) { toast('You do not have approval permission', 'error'); return; }
    if (c.status !== 'scheduled' && c.status !== 'pending_approval') {
      toast('This cheque is not awaiting approval', 'warn'); return;
    }

    const bal = bankBalances(c.bankId);
    const afterBook = bal.book - num(c.amount);
    const afterBank = bal.bank;
    const afterFloating = bal.floating + num(c.amount);

    const body =
      '<div style="margin-bottom:14px">' +
        '<div style="font-size:18px;font-weight:600">Cheque #' + esc(c.chequeNo) + ' — ' + money(c.amount) + '</div>' +
        '<div class="muted small" style="margin-top:2px">To: ' + esc(c.payeeName) +
          ' · ' + esc(bankName(c.bankId)) + ' · ' + dateFmt(c.chequeDate) + '</div>' +
      '</div>' +

      '<div class="balance-impact">' +
        '<div style="font-weight:600;margin-bottom:8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)">Balance impact</div>' +
        '<div class="row">' +
          '<div class="label">Book</div>' +

        '<div class="row">' +
          '<div class="label">Bank</div>' +

          'border-radius:var(--r-md);font-size:12.5px;font-weight:600">' +
          '⚠ Book balance will go negative by ' + money(Math.abs(afterBook)) + '</div>'
        : '<div style="padding:12px 14px;background:var(--green-soft);color:var(--green);' +
          'border-radius:var(--r-md);font-size:12.5px;font-weight:600">' +
          '✓ Sufficient book balance</div>');

    openModal('✓ Approve Cheque', body, {
      width: 620,
      footer:
        '<button class="btn" data-close-modal>Cancel</button>' +
        '<button class="btn primary" id="apprConfirmBtn">Approve &amp; Deduct Book</button>'
    });

    document.getElementById('apprConfirmBtn').onclick = () => {
      c.status = 'approved';
      c.approvedBy = state.user?.email || 'system';
      c.approvedAt = nowISO();
      c.updatedAt = nowISO();
      c.updatedBy = state.user?.email || 'system';
      markDirty('cheques', c.id);
      clearSnooze(c.id);
      closeModal();
      toast('Approved — ' + money(c.amount) + ' deducted from book balance', 'success');
      renderApp();

  window.openApproveDialog = openApproveDialog;

  /* ═══════════════════════════════════════════════════════════════════════
     7. REJECT DIALOG — 2 options: Reissue later / Cancel permanently
     ═══════════════════════════════════════════════════════════════════════ */
  function openRejectDialog(id) {
    const c = chequeObj(id);
    if (!c) return;
    if (!state.perms.approve) { toast('No approval permission', 'error'); return; }

    const body =
      '<div style="margin-bottom:14px">' +
        '<div style="font-size:16px;font-weight:600">Cheque #' + esc(c.chequeNo) + ' — ' + money(c.amount) + '</div>' +
        '<div class="muted small" style="margin-top:2px">To: ' + esc(c.payeeName) + '</div>' +
      '</div>' +
      '<p style="margin-bottom:14px;color:var(--text-2)">What do you want to do with this cheque?</p>' +
      '<div class="action-grid">' +
        '<div class="action-option" id="rejOptionReissue">' +
          '<div class="opt-title">🔁 Reissue later</div>' +
          '<div class="opt-desc">Cancel this cheque and create a new draft for reissue when ready. Payee will be linked.</div>' +
        '</div>' +
        '<div class="action-option danger" id="rejOptionDead">' +
          '<div class="opt-title">🗑 Cancel permanently</div>' +
          '<div class="opt-desc">Mark as cancelled. No bank impact. Book balance unaffected.</div>' +
        '</div>' +
      '</div>';

    openModal('✗ Reject Cheque', body, {
      width: 620,
      footer: '<button class="btn" data-close-modal>Close</button>'
    });

    document.getElementById('rejOptionReissue').onclick = () => {
      const reason = prompt('Reason for reissue (optional):') || '';

      /* Cancel current cheque */
      c.status = 'cancelled';
      c.cancelReason = reason || 'Reissued';
      c.cancelledAt = nowISO();
      c.updatedAt = nowISO();
      c.updatedBy = state.user?.email || 'system';
      markDirty('cheques', c.id);

      /* Release old leaf */
      if (window.releaseLeaf) window.releaseLeaf(c);

      /* Create new draft, 7 days out */
      const newCheque = makeCheque({
        chequeNo: '',
        bankId: c.bankId,
        bookId: '',
        leafId: null,
        payeeId: c.payeeId,
        payeeType: c.payeeType,
        payeeName: c.payeeName,
        amount: c.amount,
        chequeDate: shiftDate(today(), 7),
        status: 'draft',
        memo: c.memo,
        notes: 'Reissued from #' + c.chequeNo + (reason ? ' — ' + reason : ''),
        reissuedFromId: c.id
      });
      state.data.cheques.push(newCheque);
      markDirty('cheques', newCheque.id);
      c.reissuedChequeId = newCheque.id;
      markDirty('cheques', c.id);

      clearSnooze(c.id);
      closeModal();
      toast('Cancelled. New draft created (reissue in 7 days).', 'success');
      renderApp();
    };

    document.getElementById('rejOptionDead').onclick = () => {
      const reason = prompt('Reason for cancellation (optional):') || '';
      if (!confirm('Cancel cheque #' + c.chequeNo + ' permanently?')) return;

      c.status = 'cancelled';
      c.cancelReason = reason || 'Rejected';
      c.cancelledAt = nowISO();
      c.updatedAt = nowISO();
      c.updatedBy = state.user?.email || 'system';
      markDirty('cheques', c.id);

      if (window.releaseLeaf) window.releaseLeaf(c);

      clearSnooze(c.id);
      closeModal();
      toast('Cheque cancelled', 'success');
      renderApp();
    };
  }
  window.openRejectDialog = openRejectDialog;

  /* ═══════════════════════════════════════════════════════════════════════
     8. SNOOZE DIALOG — 4 durations
     ═══════════════════════════════════════════════════════════════════════ */
  function openSnoozeDialog(id) {
    const c = chequeObj(id);
    if (!c) return;

    const body =
      '<div style="margin-bottom:14px">' +
        '<div style="font-size:16px;font-weight:600">Snooze Cheque #' + esc(c.chequeNo) + '</div>' +
        '<div class="muted small">' + money(c.amount) + ' — ' + esc(c.payeeName) + '</div>' +
      '</div>' +
      '<p style="margin-bottom:14px;color:var(--text-2)">Hide from the approvals popup until when?</p>' +
      '<div class="action-grid">' +
        '<div class="action-option" data-snooze-days="1"><div class="opt-title">Tomorrow</div><div class="opt-desc">1 day</div></div>' +
        '<div class="action-option" data-snooze-days="3"><div class="opt-title">3 days</div><div class="opt-desc">Short defer</div></div>' +
        '<div class="action-option" data-snooze-days="7"><div class="opt-title">1 week</div><div class="opt-desc">7 days</div></div>' +
        '<div class="action-option" data-snooze-days="30"><div class="opt-title">1 month</div><div class="opt-desc">30 days</div></div>' +
