<!DOCTYPE html>
<html lang="en" data-theme="professional">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Lanka Shoe — Cheque Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B3%3C/text%3E%3C/svg%3E">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════════════════
   TOKENS
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-full: 9999px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13.5px; --fs-lg: 15px; --fs-xl: 18px;
  --fs-2xl: 22px; --fs-3xl: 28px;
  --sidebar-w: 240px; --sidebar-w-collapsed: 68px; --topbar-h: 60px; --content-max: 1600px;
  --t-fast: 0.12s ease; --t-base: 0.18s ease;
}
[data-theme="professional"] {
  --bg: #fafaff; --surface: #ffffff; --surface-2: #f6f4fb; --surface-3: #eeebf7;
  --border: #e5e1f0; --border-2: #f0edf7; --border-3: #d4cde6;
  --text: #1a1533; --text-2: #403a5c; --text-3: #78718f; --text-4: #a8a2bd;
  --accent: #7c3aed; --accent-hover: #6d28d9; --accent-soft: #f5f0ff; --accent-text: #6d28d9;
  --green: #10b981; --green-soft: #e9fbf3;
  --amber: #f59e0b; --amber-soft: #fef7e7;
  --red: #ef4444; --red-soft: #fef1f1;
  --blue: #3b82f6; --blue-soft: #eff6ff;
  --shadow-sm: 0 1px 2px rgba(26,21,51,.05);
  --shadow-md: 0 4px 12px rgba(26,21,51,.08);
  --shadow-lg: 0 20px 45px -12px rgba(26,21,51,.2);
  --sidebar-bg: linear-gradient(180deg, #150b30 0%, #2a1758 60%, #3b1d7a 100%);
  --sidebar-text: #e4ddf4; --sidebar-text-2: #9e95bc;
  --sidebar-hover: rgba(255,255,255,.07); --sidebar-active: rgba(124,58,237,.35);
  --sidebar-border: rgba(255,255,255,.08);
}
[data-theme="dark"] {
  --bg: #0a0618; --surface: #12092b; --surface-2: #180d36; --surface-3: #1e1140;
  --border: #2a1a55; --border-2: #1f1142; --border-3: #3a2470;
  --text: #f0eaff; --text-2: #c4b8e4; --text-3: #8e82b8; --text-4: #625a88;
  --accent: #a78bfa; --accent-hover: #c4b5fd; --accent-soft: #241548; --accent-text: #c4b5fd;
  --green: #34d399; --green-soft: #0a2e22;
  --amber: #fbbf24; --amber-soft: #2a1d05;
  --red: #f87171; --red-soft: #2a0e0e;
  --blue: #60a5fa; --blue-soft: #0f1e3d;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
  --shadow-md: 0 4px 16px rgba(0,0,0,.4);
  --shadow-lg: 0 20px 60px -12px rgba(0,0,0,.7);
  --sidebar-bg: linear-gradient(180deg, #0a0618 0%, #180d36 100%);
  --sidebar-text: #c4b8e4; --sidebar-text-2: #625a88;
  --sidebar-hover: rgba(167,139,250,.1); --sidebar-active: rgba(167,139,250,.25);
  --sidebar-border: rgba(167,139,250,.15);
}

/* ═══════════════════════════════════════════════════════════════════════
   RESET + BASE
   ═══════════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: var(--fs-md); line-height: 1.55;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, h4 { font-weight: 600; letter-spacing: -.01em; }
button, input, select, textarea { font-family: inherit; font-size: inherit; outline: none; }
button { cursor: pointer; border: none; background: none; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.muted { color: var(--text-3); }
.small { font-size: var(--fs-xs); }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ═══════════════════════════════════════════════════════════════════════
   LOGIN
   ═══════════════════════════════════════════════════════════════════════ */
.login-wrap {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: var(--sidebar-bg); padding: var(--sp-6);
}
.login-wrap.hidden { display: none; }
.login-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-xl); padding: 44px 40px 36px;
  width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); text-align: center;
}
.login-logo {
  width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px;
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  color: #fff; display: grid; place-items: center; font-size: 30px;
}
.login-card h1 { font-size: var(--fs-2xl); font-weight: 700; margin-bottom: 4px; }
.login-card .tagline { font-size: var(--fs-md); color: var(--text-3); margin-bottom: 28px; }
.google-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 12px 18px; border-radius: var(--r-md);
  border: 1px solid var(--border-3); background: var(--surface);
  color: var(--text); font-weight: 500; font-size: var(--fs-md);
}
.google-btn:hover:not(:disabled) { background: var(--surface-2); }
.google-btn:disabled { opacity: .5; cursor: not-allowed; }
.google-btn svg { width: 18px; height: 18px; flex: 0 0 18px; }
.login-divider { margin: 24px 0; display: flex; align-items: center; gap: 12px; }
.login-divider span { font-size: var(--fs-xs); color: var(--text-4); }
.login-divider::before, .login-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.magic-row { display: flex; gap: 8px; }
.magic-row input {
  flex: 1; padding: 11px 14px; border: 1px solid var(--border);
  border-radius: var(--r-md); background: var(--surface); color: var(--text); font-size: var(--fs-md);
}
.magic-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.magic-row button {
  padding: 11px 16px; border-radius: var(--r-md); border: none;
  background: var(--accent); color: #fff; font-weight: 600; font-size: var(--fs-sm);
}
.magic-row button:hover:not(:disabled) { background: var(--accent-hover); }
.magic-row button:disabled { opacity: .5; cursor: not-allowed; }
.login-msg { font-size: var(--fs-sm); margin-top: 12px; min-height: 20px; line-height: 1.5; white-space: pre-line; }
.login-msg.err { color: var(--red); }
.login-msg.ok { color: var(--green); }
.login-msg.info { color: var(--text-3); }
.login-foot { font-size: var(--fs-xs); color: var(--text-4); margin-top: 26px; line-height: 1.7; }

/* ═══════════════════════════════════════════════════════════════════════
   APP SHELL
   ═══════════════════════════════════════════════════════════════════════ */
.app { display: flex; min-height: 100vh; }
.app.hidden { display: none; }
.sidebar {
  width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
  background: var(--sidebar-bg); color: var(--sidebar-text);
  height: 100vh; position: sticky; top: 0; overflow-y: auto;
  display: flex; flex-direction: column; padding: 20px 12px;
  border-right: 1px solid var(--sidebar-border);
  transition: width var(--t-base), flex-basis var(--t-base), padding var(--t-base);
}
body.collapsed .sidebar {
  width: var(--sidebar-w-collapsed); flex-basis: var(--sidebar-w-collapsed); padding: 20px 8px;
}
body.collapsed .brand-text,
body.collapsed .nav-item span:not(.ico),
body.collapsed .nav-label { display: none; }
body.collapsed .nav-item { justify-content: center; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px; }
.brand-logo {
  width: 34px; height: 34px; flex: 0 0 34px; border-radius: 10px;
  background: linear-gradient(135deg, #a78bfa, #ec4899);
  display: grid; place-items: center; font-size: 16px;
}
.brand-text { min-width: 0; }
.brand-name { font-weight: 600; font-size: var(--fs-md); color: #fff; line-height: 1.2; }
.brand-sub { font-size: var(--fs-xs); color: var(--sidebar-text-2); margin-top: 2px; }
.nav-group { margin-bottom: 18px; }
.nav-label {
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--sidebar-text-2); padding: 6px 10px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: var(--r-sm);
  color: var(--sidebar-text); font-size: var(--fs-md);
  cursor: pointer; transition: background var(--t-fast);
}
.nav-item:hover { background: var(--sidebar-hover); color: #fff; }
.nav-item.active { background: var(--sidebar-active); color: #fff; font-weight: 500; }
.nav-item.disabled { opacity: .4; cursor: not-allowed; }
.nav-item .ico { width: 18px; text-align: center; font-size: 14px; }
.nav-badge {
  margin-left: auto; font-size: 10px; padding: 1px 6px;
  border-radius: var(--r-full); background: var(--red); color: #fff; font-weight: 600;
}
.sidebar-user {
  margin-top: auto; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--r-md);
  background: rgba(255,255,255,.05); border: 1px solid var(--sidebar-border);
}
.user-avatar {
  width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%;
  background: linear-gradient(135deg, #a78bfa, #ec4899); color: #fff;
  display: grid; place-items: center; font-weight: 600; font-size: var(--fs-sm);
  overflow: hidden;
}
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-info { min-width: 0; }
.user-name { font-size: var(--fs-sm); color: #fff; font-weight: 500; }
.user-role { font-size: 10.5px; color: var(--sidebar-text-2); text-transform: uppercase; letter-spacing: .05em; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: var(--topbar-h); padding: 0 22px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  position: sticky; top: 0; z-index: 30;
}
.topbar-title { font-size: var(--fs-lg); font-weight: 600; }
.topbar-sub { font-size: var(--fs-xs); color: var(--text-4); margin-top: 1px; }
.topbar-actions { display: flex; gap: 6px; align-items: center; }
.content { flex: 1; padding: 24px 22px 60px; max-width: var(--content-max); width: 100%; }

/* ═══════════════════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--r-md);
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); font-weight: 500; font-size: var(--fs-sm);
  transition: background var(--t-fast), border-color var(--t-fast); white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { background: var(--surface); border-color: var(--red); color: var(--red); }
.btn.danger:hover:not(:disabled) { background: var(--red-soft); }
.btn.green { background: var(--green); border-color: var(--green); color: #fff; }
.btn.xs { padding: 4px 9px; font-size: 11px; }
.btn.sm { padding: 6px 11px; font-size: var(--fs-xs); }
.btn.icon { padding: 0; width: 36px; height: 36px; justify-content: center; border-radius: var(--r-full); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ═══════════════════════════════════════════════════════════════════════
   CARDS + KPI
   ═══════════════════════════════════════════════════════════════════════ */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 20px 22px; margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.card-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
}
.card-head h3 { font-size: var(--fs-lg); }
.kpi-strip {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px; margin-bottom: 18px;
}
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 14px 16px;
  position: relative; overflow: hidden;
}
.kpi::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), #ec4899);
}
.kpi.warn::before { background: linear-gradient(90deg, var(--amber), var(--red)); }
.kpi.danger::before { background: linear-gradient(90deg, var(--red), #b91c1c); }
.k-label {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; color: var(--text-3);
}
.k-value {
  font-size: var(--fs-2xl); font-weight: 700; margin-top: 6px;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.k-value.sm { font-size: var(--fs-xl); }
.k-sub { font-size: var(--fs-xs); color: var(--text-4); margin-top: 4px; }

/* ═══════════════════════════════════════════════════════════════════════
   BANK CARDS
   ═══════════════════════════════════════════════════════════════════════ */
.bank-cards {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px; margin-bottom: 18px;
}
.bank-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 16px 18px;
  border-left: 4px solid var(--accent); position: relative;
}
.bank-card-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 10px;
}
.bank-card-name { font-weight: 600; font-size: var(--fs-md); }
.bank-card-bank { font-size: var(--fs-xs); color: var(--text-3); margin-top: 2px; }
.bank-balances {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 12px;
}
.bank-balance-item .lbl {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--text-4); font-weight: 700; margin-bottom: 2px;
}
.bank-balance-item .val {
  font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.bank-balance-item .val.book { color: var(--accent); }
.bank-balance-item .val.float { color: var(--amber); }
.bank-balance-item .val.neg { color: var(--red); }

/* ═══════════════════════════════════════════════════════════════════════
   TABLES
   ═══════════════════════════════════════════════════════════════════════ */
.table-wrap {
  overflow-x: auto; border: 1px solid var(--border);
  border-radius: var(--r-lg); background: var(--surface);
}
table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
thead th {
  background: var(--surface-2); text-align: left; padding: 10px 14px;
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--text-3); font-weight: 700; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border-2); color: var(--text-2); }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.actions-cell { white-space: nowrap; text-align: right; }
tfoot td {
  padding: 11px 14px; font-weight: 700;
  background: var(--surface-2); border-top: 2px solid var(--border);
}

/* ═══════════════════════════════════════════════════════════════════════
   BADGES
   ═══════════════════════════════════════════════════════════════════════ */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: var(--r-full);
  font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
  white-space: nowrap;
}
.badge.green  { background: var(--green-soft); color: var(--green); }
.badge.amber  { background: var(--amber-soft); color: var(--amber); }
.badge.red    { background: var(--red-soft); color: var(--red); }
.badge.blue   { background: var(--blue-soft); color: var(--blue); }
.badge.gray   { background: var(--surface-3); color: var(--text-3); }
.badge.purple { background: var(--accent-soft); color: var(--accent-text); }
.badge.dark   { background: var(--text); color: var(--surface); }

.empty {
  padding: 50px 20px; text-align: center;
  color: var(--text-4); font-size: var(--fs-sm);
}
.empty .big { font-size: 34px; display: block; margin-bottom: 10px; opacity: .4; }

/* ═══════════════════════════════════════════════════════════════════════
   FORMS
   ═══════════════════════════════════════════════════════════════════════ */
.field {
  display: flex; flex-direction: column; gap: 6px;
  font-size: var(--fs-sm); font-weight: 500; color: var(--text-2);
}
.field input, .field select, .field textarea {
  padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface); color: var(--text); font-size: var(--fs-md);
  width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.field .req { color: var(--red); }
.md-filter {
  display: grid; grid-template-columns: 2fr 1fr 1fr auto;
  gap: 10px; padding: 14px; margin-bottom: 14px;
  background: var(--surface-2); border: 1px solid var(--border-2);
  border-radius: var(--r-md);
}

/* ═══════════════════════════════════════════════════════════════════════
   TOASTS
   ═══════════════════════════════════════════════════════════════════════ */
#toasts {
  position: fixed; right: 20px; bottom: 20px; z-index: 9000;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  pointer-events: auto; padding: 12px 16px; border-radius: var(--r-md);
  background: var(--text); color: var(--surface); font-size: var(--fs-sm);
  font-weight: 500; box-shadow: var(--shadow-lg); max-width: 380px;
  animation: slideIn var(--t-base); white-space: pre-line;
}
.toast.info { background: var(--accent); color: #fff; }
.toast.success { background: var(--green); color: #fff; }
.toast.warn { background: var(--amber); color: #fff; }
.toast.error { background: var(--red); color: #fff; }
.toast.out { opacity: 0; transition: opacity .3s; }
@keyframes slideIn {
  from { transform: translateX(20px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ═══════════════════════════════════════════════════════════════════════
   MODALS
   ═══════════════════════════════════════════════════════════════════════ */
#modalWrap { position: fixed; inset: 0; z-index: 500; display: none; }
#modalWrap.open { display: block; }
.modal-backdrop {
  position: absolute; inset: 0; background: rgba(26,21,51,.5);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.modal {
  position: relative; background: var(--surface); border-radius: var(--r-xl);
  max-width: 700px; width: calc(100% - 32px); margin: 5vh auto; max-height: 90vh;
  display: flex; flex-direction: column; box-shadow: var(--shadow-lg); overflow: hidden;
}
.modal-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 22px; border-bottom: 1px solid var(--border);
}
.modal-head h3 { font-size: var(--fs-lg); }
.modal-body { padding: 22px; overflow: auto; }
.modal-foot {
  padding: 14px 22px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px; background: var(--surface-2);
}
.icon-btn {
  width: 30px; height: 30px; border-radius: var(--r-sm);
  display: inline-grid; place-items: center;
  background: transparent; border: 1px solid transparent;
  color: var(--text-3); font-size: 14px;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }

/* ═══════════════════════════════════════════════════════════════════════
   DEBUG
   ═══════════════════════════════════════════════════════════════════════ */
#dbg {
  position: fixed; bottom: 12px; left: 12px; right: 12px; max-height: 32vh;
  background: #0a0a0f; color: #e4ddf4; font-family: var(--mono); font-size: 11px;
  padding: 8px 12px; overflow-y: auto; z-index: 999999; border-radius: 10px;

<!-- ═══════════════════════════════════════════════════════════════════════
     S01-B — UTILS

<script>
const uid = () => 'x' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const arr = v => Array.isArray(v) ? v : [];
const sum = (list, key) => arr(list).reduce((a, o) => a + num(o[key]), 0);

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function today() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
const nowISO = () => new Date().toISOString();

function dateFmt(v) {
  if (!v) return '—';
  try {
    const d = new Date(String(v).length === 10 ? v + 'T00:00:00' : v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  } catch { return String(v); }
}

function dateTimeFmt(v) {
  if (!v) return '—';
  try {
    const d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
      + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  } catch { return String(v); }
}

function money(v, opts) {
  opts = opts || {};
  const n = num(v);
  const sym = opts.symbol || 'Rs.';
  const decimals = opts.decimals ?? 2;
  const body = Math.abs(n).toLocaleString('en-LK', {
    minimumFractionDigits: decimals, maximumFractionDigits: decimals
  });
  const sign = n < 0 ? '-' : '';
  return opts.plain ? (sign + body) : (sign + sym + ' ' + body);
}
const money0 = v => money(v, { decimals: 0 });

function diffDays(a, b) {
  if (!a || !b) return 0;
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}

function shiftDate(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function numberToWords(n) {
  n = Math.round(num(n) * 100) / 100;
  if (n === 0) return 'Zero Rupees Only';
  const negative = n < 0;
  n = Math.abs(n);
  const rupees = Math.floor(n);
  const cents = Math.round((n - rupees) * 100);
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine',
                'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen',
                'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  function chunk(x) {
    if (x === 0) return '';
    if (x < 20) return ones[x];
    if (x < 100) return tens[Math.floor(x / 10)] + (x % 10 ? ' ' + ones[x % 10] : '');
    if (x < 1000) return ones[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' + chunk(x % 100) : '');
    return '';
  }
  function convert(x) {
    if (x === 0) return '';
    const crore = Math.floor(x / 10000000);
    const lakh = Math.floor((x % 10000000) / 100000);
    const thousand = Math.floor((x % 100000) / 1000);
    const rest = x % 1000;
    const out = [];
    if (crore) out.push(chunk(crore) + ' Crore');
    if (lakh) out.push(chunk(lakh) + ' Lakh');
    if (thousand) out.push(chunk(thousand) + ' Thousand');
    if (rest) out.push(chunk(rest));
    return out.join(' ');
  }
  let words = convert(rupees) + ' Rupees';
  if (cents > 0) words += ' and ' + chunk(cents) + ' Cents';
  words += ' Only';
  return (negative ? 'Minus ' : '') + words;
}

function csvEsc(v) {
  const s = (v === null || v === undefined) ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
</script>

<!-- ═══════════════════════════════════════════════════════════════════════

<script>
const state = {
  user: null,
  role: 'viewer',
  perms: { write: false, approve: false, delete: false, users: false, settings: false },
  view: 'dashboard',
  settings: null,
  data: { banks: [], chequeBooks: [] },
  filters: { banks: {}, chequebooks: {} },
  firebaseReady: false,
  sync: { inProgress: false, lastPush: null, lastPull: null }
};
window.__LS__ = state;

/* ── Registry (used by every subsequent script) ── */
const REGISTRY = {
  nav: [],         // { group, id, ico, label, order }
  routes: {},      // id → { title, fn }
  inits: [],       // [fn, ...] — called after boot completes
  collections: [], // extra Firestore collections to sync
  modals: {},      // id → openFn (for cross-script modal calls)
  actions: {}      // action-id → handler
};
window.__LS_REGISTRY = REGISTRY;

window.__LS_register = function (id, initFn) {
  if (typeof initFn !== 'function') return;
  REGISTRY.inits.push({ id, fn: initFn });
  dbg.info('[registry] ' + id + ' registered');
};

window.__LS_addRoute = function (id, title, fn) {
  REGISTRY.routes[id] = { title, fn };
};

window.__LS_addNav = function (item) {
  REGISTRY.nav.push(item);
};

window.__LS_addCollection = function (col) {
  if (COLLECTIONS.indexOf(col) === -1) {
    COLLECTIONS.push(col);
    if (!Array.isArray(state.data[col])) state.data[col] = [];
  }
};

window.__LS_registerAction = function (actionId, handler) {
  REGISTRY.actions[actionId] = handler;
};

/* ── Debug console ── */
const dbg = {
  log:  (m) => appendDbg('', m),
  info: (m) => appendDbg('#7dd3fc', m),
  ok:   (m) => appendDbg('#34d399', m),
  warn: (m) => appendDbg('#fbbf24', m),
  err:  (m) => appendDbg('#f87171', m)
};
window.dbg = dbg;

function appendDbg(color, msg) {
  const el = document.getElementById('dbg');
  if (!el) return;
  const line = document.createElement('div');
  line.className = 'ln';
  if (color) line.style.color = color;
  line.textContent = '[' + new Date().toLocaleTimeString('en-GB') + '] ' + msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
  if (el.children.length > 500) el.removeChild(el.firstChild);
  if (color === '#f87171') console.error(msg);
  else if (color === '#fbbf24') console.warn(msg);
  else console.log(msg);
}

function toast(msg, type, ms) {
  const wrap = document.getElementById('toasts');
  if (!wrap) return;
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 350);
  }, ms || 3200);
}
window.toast = toast;

function openModal(title, bodyHTML, opts) {
  opts = opts || {};
  const wrap = document.getElementById('modalWrap');
  if (!wrap) return;
  wrap.innerHTML =
    '<div class="modal-backdrop" data-close-modal></div>' +
    '<div class="modal" style="max-width:' + (opts.width || 700) + 'px">' +
      '<div class="modal-head">' +
        '<h3>' + esc(title) + '</h3>' +
        '<button class="icon-btn" data-close-modal type="button">✕</button>' +
      '</div>' +
      '<div class="modal-body">' + bodyHTML + '</div>' +
      (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
    '</div>';
  wrap.classList.add('open');
}
window.openModal = openModal;

function closeModal() {
  const wrap = document.getElementById('modalWrap');
  if (!wrap) return;
  wrap.classList.remove('open');
  wrap.innerHTML = '';
}
window.closeModal = closeModal;

function field(label, id, value, opts) {
  opts = opts || {};
  const tag = opts.type === 'textarea' ? 'textarea' : 'input';
  const attrs = [
    'id="' + id + '"',
    (opts.type && opts.type !== 'textarea') ? 'type="' + opts.type + '"' : '',
    opts.placeholder ? 'placeholder="' + esc(opts.placeholder) + '"' : '',
    opts.min !== undefined ? 'min="' + opts.min + '"' : '',
    opts.max !== undefined ? 'max="' + opts.max + '"' : '',
    opts.step ? 'step="' + opts.step + '"' : ''
  ].filter(Boolean).join(' ');
  return '<label class="field">' + esc(label) +
    (opts.req ? ' <span class="req">*</span>' : '') +
    (tag === 'textarea'
      ? '<textarea ' + attrs + '>' + esc(value) + '</textarea>'
      : '<input ' + attrs + ' value="' + esc(value) + '">') +
    '</label>';
}
window.field = field;

function selectField(label, id, options, value, opts) {
  opts = opts || {};
  return '<label class="field">' + esc(label) +
    (opts.req ? ' <span class="req">*</span>' : '') +
    '<select id="' + id + '">' +
      (opts.placeholder ? '<option value="">' + esc(opts.placeholder) + '</option>' : '') +
      options.map(o =>
        '<option value="' + esc(o.value) + '"' + (String(o.value) === String(value) ? ' selected' : '') + '>' +
          esc(o.label) +
        '</option>'
      ).join('') +
    '</select>' +
  '</label>';
}
window.selectField = selectField;

function updateSyncIndicator(mode, text) {
  const el = document.getElementById('syncIndicator');
  const txt = document.getElementById('syncText');
  if (!el || !txt) return;
  el.classList.remove('syncing', 'ok', 'err');
  if (mode) el.classList.add(mode);
  txt.textContent = text || 'Ready';
}
window.updateSyncIndicator = updateSyncIndicator;

/* Fired when a scripted part has loaded successfully */
function scriptLoaded(id) {
  dbg.ok('[script] ' + id + ' loaded');
}
window.scriptLoaded = scriptLoaded;
</script>

<!-- ═══════════════════════════════════════════════════════════════════════
     S01-D — FIREBASE INIT
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
let firebaseApp = null;
let auth = null;
let firestore = null;
window.__fb = { app: null, auth: null, firestore: null };

function initFirebase() {
  try {
    if (!window.firebase || !firebase.initializeApp) {
      throw new Error('Firebase SDK did not load — check internet access to gstatic.com');
    }
    let existing = null;
    try { existing = firebase.app(); } catch (e) { existing = null; }
    if (existing && existing.options && existing.options.projectId !== CONFIG.firebase.projectId) {
      try { existing.delete(); } catch (e) {}
      existing = null;
    }
    firebaseApp = existing || firebase.initializeApp(CONFIG.firebase);
    auth = firebase.auth(firebaseApp);
    firestore = firebase.firestore(firebaseApp);
    try { firestore.settings({ merge: true, ignoreUndefinedProperties: true }); } catch (e) {}
    state.firebaseReady = true;
    window.__fb.app = firebaseApp;
    window.__fb.auth = auth;
    window.__fb.firestore = firestore;
    dbg.ok('Firebase ready • ' + CONFIG.firebase.projectId);
    return true;
  } catch (e) {
    state.firebaseReady = false;
    dbg.err('Firebase init failed: ' + e.message);
    return false;
  }
}
window.initFirebase = initFirebase;

const docRef = (path) => firestore.doc(path);
const colRef = (name) => firestore.collection('lk_' + name);
window.docRef = docRef;
window.colRef = colRef;
</script>

<!-- ═══════════════════════════════════════════════════════════════════════
     S01-E — AUTH
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
function setRole(role) {
  role = ROLES[role] ? role : 'viewer';
  state.role = role;
  state.perms = Object.assign({}, ROLES[role].perms);
  dbg.ok('Role set: ' + role);
}

async function loadAccess(forceFresh) {
  if (!forceFresh) {
    try {
      const cached = JSON.parse(localStorage.getItem(CONFIG.accessCacheKey) || 'null');
      if (cached && Date.now() - cached.at < CONFIG.accessCacheMs) return cached.value;
    } catch (e) {}
  }
  try {
    const snap = await docRef(CONFIG.accessPath).get();
    let value;
    if (snap.exists) {
      const d = snap.data() || {};
      value = {
        allowedEmails: Array.isArray(d.allowedEmails) ? d.allowedEmails.map(e => String(e).toLowerCase().trim()) : [],
        userPerms: d.userPerms || {}
      };
      if (value.allowedEmails.indexOf(CONFIG.adminEmail.toLowerCase()) === -1) {
        value.allowedEmails.push(CONFIG.adminEmail.toLowerCase());
      }
    } else {
      value = { allowedEmails: [CONFIG.adminEmail.toLowerCase()], userPerms: {} };
      try {
        await docRef(CONFIG.accessPath).set({
          allowedEmails: value.allowedEmails, userPerms: {},
          createdAt: nowISO(), updatedAt: nowISO()
        });
        dbg.ok('Seeded access doc with admin email');
      } catch (e) { dbg.warn('Could not seed access doc: ' + e.message); }
    }
    try { localStorage.setItem(CONFIG.accessCacheKey, JSON.stringify({ at: Date.now(), value })); } catch (e) {}
    return value;
  } catch (e) {
    try {
      const cached = JSON.parse(localStorage.getItem(CONFIG.accessCacheKey) || 'null');
      if (cached) return cached.value;
    } catch (err) {}
    return { allowedEmails: [CONFIG.adminEmail.toLowerCase()], userPerms: {} };
  }
}

async function checkAccess(email) {
  if (!email) return null;
  const em = email.toLowerCase().trim();
  if (em === CONFIG.adminEmail.toLowerCase()) return 'owner';
  const access = await loadAccess(false);
  if (access.allowedEmails.indexOf(em) === -1) return null;
  const p = access.userPerms[em] || {};
  return (p.role && ROLES[p.role]) ? p.role : 'viewer';
}
window.checkAccess = checkAccess;
window.loadAccess = loadAccess;

function loginMsg(text, type) {
  const el = document.getElementById('loginMsg');
  if (!el) return;
  el.textContent = text || '';
  el.className = 'login-msg' + (type ? ' ' + type : '');
}

async function signInWithGoogle() {
  const btn = document.getElementById('googleBtn');
  const txt = document.getElementById('googleBtnText');
  if (btn && btn.dataset.busy === '1') return;
  loginMsg('');
  if (!state.firebaseReady && !initFirebase()) {
    loginMsg('Firebase could not initialize. Check your internet connection.', 'err');
    return;
  }
  if (btn) { btn.disabled = true; btn.dataset.busy = '1'; }
  if (txt) txt.textContent = 'Connecting to Google…';
  try { await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) {}
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    await auth.signInWithPopup(provider);
  } catch (e) {
    const code = (e && e.code) || '';
    const msg = (e && e.message) || String(e);
    if (code === 'auth/popup-blocked' || code === 'auth/cancelled-popup-request') {
      if (txt) txt.textContent = 'Redirecting to Google…';
      try { await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); return; }
      catch (err) { loginMsg('Google redirect failed: ' + (err.code || err.message), 'err'); }
    } else if (code === 'auth/popup-closed-by-user') {
      loginMsg('Sign-in window closed. Try again.', 'err');
    } else if (code === 'auth/unauthorized-domain') {
      loginMsg('This domain is not authorized in Firebase.\nAdd "' + location.hostname + '" under Authentication → Settings → Authorized domains.', 'err');
    } else if (code === 'auth/operation-not-allowed') {
      loginMsg('Google Sign-In is disabled.\nEnable it in Authentication → Sign-in method.', 'err');
    } else if (code === 'auth/network-request-failed') {
      loginMsg('Network error — check your connection and try again.', 'err');
    } else {
      loginMsg('Sign-in failed: ' + code + '\n' + msg, 'err');
    }
    if (btn) { btn.disabled = false; btn.dataset.busy = '0'; }
    if (txt) txt.textContent = 'Continue with Google';
  }
}

async function signInWithMagicLink() {
  const emailEl = document.getElementById('magicEmail');
  const btn = document.getElementById('magicBtn');
  const email = (emailEl && emailEl.value || '').trim().toLowerCase();
  if (!email || email.indexOf('@') === -1) { loginMsg('Please enter a valid email.', 'err'); return; }
  if (!state.firebaseReady && !initFirebase()) { loginMsg('Firebase could not initialize.', 'err'); return; }
  const role = await checkAccess(email);
  if (!role) { loginMsg('This email is not authorized. Contact the administrator.', 'err'); return; }
  btn.disabled = true;
  btn.textContent = 'Sending…';
  loginMsg('');
  try {
    await auth.sendSignInLinkToEmail(email, {
      url: location.origin + location.pathname,
      handleCodeInApp: true
    });
    try { localStorage.setItem('lankashoe_magic_email', email); } catch (e) {}
    loginMsg('Sign-in link sent to ' + email + '. Check your inbox.', 'ok');
    btn.textContent = 'Sent';
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Send Link'; }, 8000);
  } catch (e) {
    const code = (e && e.code) || '';
    if (code === 'auth/unauthorized-continue-uri') {
      loginMsg('Domain not authorized for email links.\nAdd it in Authentication → Settings.', 'err');
    } else if (code === 'auth/operation-not-allowed') {
      loginMsg('Email link sign-in is disabled in Firebase.', 'err');
    } else {
      loginMsg('Failed: ' + code + ' ' + (e.message || ''), 'err');
    }
    btn.disabled = false;
    btn.textContent = 'Send Link';
  }
}

async function signOut() {
  if (!confirm('Sign out?')) return;
  try { await sync.push(true); } catch (e) {}
  try { await auth.signOut(); } catch (e) {}
  try { localStorage.removeItem(CONFIG.accessCacheKey); } catch (e) {}
  location.reload();
}

async function handleMagicLinkReturn() {
  if (!state.firebaseReady) return false;
  try {
    if (!auth.isSignInWithEmailLink(location.href)) return false;
    let email = null;
    try { email = localStorage.getItem('lankashoe_magic_email'); } catch (e) {}
    if (!email) { email = window.prompt('Confirm your email to finish sign-in:'); if (!email) return false; }
    await auth.signInWithEmailLink(email, location.href);
    try { localStorage.removeItem('lankashoe_magic_email'); } catch (e) {}
    if (location.href.indexOf('apiKey=') !== -1 || location.href.indexOf('oobCode=') !== -1) {
      history.replaceState(null, '', location.pathname);
    }
    return true;
  } catch (e) {
    dbg.err('Magic link return failed: ' + (e.code || e.message));
    return false;
  }
}

async function registerLogin(user) {
  if (!state.firebaseReady) return;
  try {
    const ref = docRef(CONFIG.usersCol + '/' + user.uid);
    const doc = await ref.get();
    const now = nowISO();
    if (doc.exists) {
      await ref.set({
        email: user.email, name: user.displayName || '', photo: user.photoURL || '',
        role: state.role, lastLogin: now
      }, { merge: true });
    } else {
      await ref.set({
        email: user.email, name: user.displayName || '', photo: user.photoURL || '',
        role: state.role, firstLogin: now, lastLogin: now
      });
    }
  } catch (e) { dbg.warn('registerLogin failed: ' + (e.code || e.message)); }
}

async function onAuthStateChanged(user) {
  const btn = document.getElementById('googleBtn');
  const txt = document.getElementById('googleBtnText');
  if (!user) {
    state.user = null;
    showLogin();
    if (btn) { btn.disabled = false; btn.dataset.busy = '0'; }
    if (txt) txt.textContent = 'Continue with Google';
    return;
  }
  if (txt) txt.textContent = 'Verifying access…';
  if (btn) btn.disabled = true;
  try {
    const role = await checkAccess(user.email);
    if (!role) {
      loginMsg('Access denied for ' + user.email + '.\nContact the administrator.', 'err');
      try { await auth.signOut(); } catch (e) {}
      return;
    }
    state.user = {
      uid: user.uid, email: user.email,
      name: user.displayName || (user.email || '').split('@')[0],
      photo: user.photoURL || null
    };
    setRole(role);
    hideLogin();

    updateSyncIndicator('syncing', 'Loading…');
    await loadSettings();
    await sync.pull();

    renderApp();
    updateSyncIndicator('ok', 'Ready');
    toast('Welcome, ' + (state.user.name || state.user.email), 'success');
    registerLogin(user);

    /* Run all registered init functions from S02, S03, etc. */
    for (const it of REGISTRY.inits) {
      try { it.fn(); }
      catch (e) { dbg.err('[init ' + it.id + '] ' + e.message); console.error(e); }
    }
  } catch (e) {
    dbg.err('Auth transition failed: ' + e.message);
    loginMsg('App initialization failed: ' + e.message, 'err');
    if (btn) btn.disabled = false;
    if (txt) txt.textContent = 'Continue with Google';
    updateSyncIndicator('err', 'Error');
  }
}
</script>

<!-- ═══════════════════════════════════════════════════════════════════════
     S01-F — SYNC ENGINE + SETTINGS
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
let _snapshot = {};
let _dirty = new Set();
let _syncTimer = null;

function takeSnapshot() {
  _snapshot = {};
  COLLECTIONS.forEach(col => {
    arr(state.data[col]).forEach(doc => {
      if (doc && doc.id) {
        try { _snapshot[col + ':' + doc.id] = JSON.stringify(doc); } catch (e) {}
      }
    });
  });
  dbg.ok('Snapshot: ' + Object.keys(_snapshot).length + ' docs');
}
window.takeSnapshot = takeSnapshot;

function markDirty(collection, id) {
  if (!collection || !id) return;
  _dirty.add(collection + ':' + id);
  scheduleSync();
}
window.markDirty = markDirty;

function scheduleSync() {
  clearTimeout(_syncTimer);
  updateSyncIndicator('syncing', 'Saving…');
  _syncTimer = setTimeout(() => {
    sync.push(false).catch(e => dbg.err('Sync failed: ' + (e.code || e.message)));
  }, CONFIG.syncDebounceMs);
}
window.scheduleSync = scheduleSync;

const sync = {
  async push(silent) {
    if (!state.firebaseReady || !state.user) return;
    if (state.sync.inProgress) return;
    if (_dirty.size === 0 && silent !== true) return;

    state.sync.inProgress = true;
    updateSyncIndicator('syncing', 'Saving…');

    try {
      const ops = [];
      _dirty.forEach(key => {
        const parts = key.split(':');
        const col = parts[0], id = parts[1];
        const doc = arr(state.data[col]).find(d => d.id === id);
        if (doc) {
          const now = JSON.stringify(doc);
          if (_snapshot[key] !== now) {
            ops.push({ type: 'set', col, id, data: doc });
            _snapshot[key] = now;
          }
        } else if (_snapshot[key] !== undefined) {
          ops.push({ type: 'delete', col, id });
          delete _snapshot[key];
        }
      });

      if (ops.length === 0) {
        _dirty.clear();
        state.sync.inProgress = false;
        updateSyncIndicator('ok', 'Ready');
        return;
      }

      dbg.info('Pushing ' + ops.length + ' change(s)');
      const batchSize = 450;
      for (let i = 0; i < ops.length; i += batchSize) {
        const batch = firestore.batch();
        ops.slice(i, i + batchSize).forEach(op => {
          const ref = colRef(op.col).doc(op.id);
          if (op.type === 'delete') batch.delete(ref);
          else batch.set(ref, JSON.parse(JSON.stringify(op.data)));
        });
        await batch.commit();
      }

      _dirty.clear();
      state.sync.lastPush = new Date();
      updateSyncIndicator('ok', 'Saved');
      if (!silent) dbg.ok('Pushed ' + ops.length + ' change(s)');
      setTimeout(() => updateSyncIndicator('ok', 'Ready'), 1800);
    } catch (e) {
      dbg.err('pushToFirestore: ' + (e.code || e.message));
      updateSyncIndicator('err', 'Sync failed');
    } finally {
      state.sync.inProgress = false;
    }
  },

  async pull() {
    if (!state.firebaseReady || !state.user) return;
    updateSyncIndicator('syncing', 'Loading…');
    try {
      await Promise.all(COLLECTIONS.map(col =>
        colRef(col).get().then(snap => {
          const items = [];
          snap.forEach(d => {
            const data = d.data() || {};
            data.id = data.id || d.id;
            items.push(data);
          });
          state.data[col] = items;
          dbg.info('[' + col + '] ' + items.length + ' loaded');
        }).catch(e => {
          dbg.warn('[' + col + '] ' + (e.code || e.message));
          if (!Array.isArray(state.data[col])) state.data[col] = [];
        })
      ));
      state.sync.lastPull = new Date();
      takeSnapshot();
      updateSyncIndicator('ok', 'Ready');
      dbg.ok('Pull complete');
    } catch (e) {
      dbg.err('Pull failed: ' + (e.code || e.message));
      updateSyncIndicator('err', 'Load failed');
    }
  }
};
window.sync = sync;

function defaultSettings() {
  return {
    business: { name: 'Lanka Shoe', logoInitials: '💳', phone: '', email: '', address: '' },
    currency: { code: 'LKR', symbol: 'Rs.', decimals: 2 },
    appearance: { theme: 'professional', sidebarCollapsed: false },
    accounting: {
      basis: 'accrual',
      fiscalYearStart: '01-01',
      fiscalYearEnd: '12-31',
      closedThrough: null
    },
    defaults: {
      chequeLeafPad: 6,
      chequeDays: 30,
      chequeReminderDays: 7,
      bounceBankCharge: 500
    },
    schemaVersion: 17,
    updatedAt: nowISO(),
    updatedBy: ''
  };
}
window.defaultSettings = defaultSettings;

async function loadSettings() {
  if (!state.firebaseReady) { state.settings = defaultSettings(); return; }
  try {
    const snap = await docRef(CONFIG.settingsPath).get();
    if (snap.exists) {
      state.settings = Object.assign(defaultSettings(), snap.data() || {});
      dbg.ok('Settings loaded');
    } else {
      state.settings = defaultSettings();
      try {
        await docRef(CONFIG.settingsPath).set(JSON.parse(JSON.stringify(state.settings)));
        dbg.ok('Settings doc created');
      } catch (e) { dbg.warn('Settings create failed: ' + e.message); }
    }
  } catch (e) {
    dbg.warn('loadSettings failed: ' + (e.code || e.message));
    state.settings = defaultSettings();
  }
}
window.loadSettings = loadSettings;

async function saveSettings() {
  if (!state.firebaseReady) return;
  try {
    await docRef(CONFIG.settingsPath).set(JSON.parse(JSON.stringify(state.settings)));
    dbg.ok('Settings saved');
  } catch (e) {
    dbg.err('saveSettings: ' + (e.code || e.message));
  }
}
window.saveSettings = saveSettings;
</script>

<!-- ═══════════════════════════════════════════════════════════════════════
     S01-G — SCHEMA FACTORIES (banks, cheque books)
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
function makeBank(seed) {
  seed = seed || {};
  return {
    id: seed.id || uid(),
    name: String(seed.name || ''),
    bankName: String(seed.bankName || ''),
    branch: String(seed.branch || ''),
    accountNo: String(seed.accountNo || ''),
    accountType: seed.accountType || 'current',
    swift: String(seed.swift || ''),
    openingBalance: num(seed.openingBalance),
    openingDate: seed.openingDate || today(),
    coaAccountId: seed.coaAccountId || null,
    color: seed.color || '#7c3aed',
    notes: String(seed.notes || ''),
    active: seed.active !== false,
    createdAt: seed.createdAt || nowISO(),
    createdBy: seed.createdBy || (state.user?.email || 'system'),
    updatedAt: seed.updatedAt || nowISO(),
    updatedBy: seed.updatedBy || (state.user?.email || 'system')
  };
}
window.makeBank = makeBank;

function makeChequeBook(seed) {
  seed = seed || {};
  const serialStart = String(seed.serialStart || '000001');
  const serialEnd = String(seed.serialEnd || '000001');
  const pad = num(seed.pad) || serialStart.length || 6;
  const leaves = Array.isArray(seed.leaves) ? seed.leaves : (() => {
    const start = parseInt(serialStart, 10);
    const end = parseInt(serialEnd, 10);
    if (!Number.isFinite(start) || !Number.isFinite(end) || end < start) return [];
    const out = [];
    for (let n = start; n <= end; n++) {
      out.push({ serial: String(n).padStart(pad, '0'), status: 'available', chequeId: null, note: '' });
    }
    return out;
  })();
  return {
    id: seed.id || uid(),
    bankId: seed.bankId || '',
    bookNo: String(seed.bookNo || ''),
    serialStart: serialStart,
    serialEnd: serialEnd,
    pad: pad,
    leaves: leaves,
    active: seed.active !== false,
    notes: String(seed.notes || ''),
    createdAt: seed.createdAt || nowISO(),
    createdBy: seed.createdBy || (state.user?.email || 'system'),
    updatedAt: seed.updatedAt || nowISO(),
    updatedBy: seed.updatedBy || (state.user?.email || 'system')
  };
}
window.makeChequeBook = makeChequeBook;

const bankObj = (id) => arr(state.data.banks).find(b => b.id === id) || null;
const bankName = (id) => { const b = bankObj(id); return b ? b.name : '—'; };
const bookObj = (id) => arr(state.data.chequeBooks).find(b => b.id === id) || null;
window.bankObj = bankObj;
window.bankName = bankName;
window.bookObj = bookObj;

function bookLeavesSummary(book) {
  const leaves = arr(book.leaves);
  const out = { total: leaves.length, available: 0, printed: 0, used: 0, spoiled: 0, void: 0, lost: 0 };
  leaves.forEach(l => { if (out[l.status] !== undefined) out[l.status]++; });
  return out;
}
window.bookLeavesSummary = bookLeavesSummary;

function nextAvailableLeaf(book) {
  if (!book) return null;
  const leaves = arr(book.leaves);
  for (let i = 0; i < leaves.length; i++) {
    if (leaves[i].status === 'available') return { index: i, leaf: leaves[i] };
  }
  return null;
}
window.nextAvailableLeaf = nextAvailableLeaf;

/* ── Bank balances (stub — S04 will replace with real dual engine) ── */
function bankBalances(bankId) {
  const bank = bankObj(bankId);
  if (!bank) return { bank: 0, book: 0, floating: 0, opening: 0, clearedTotal: 0, approvedPendingTotal: 0 };
  const opening = num(bank.openingBalance);
  const cheques = arr(state.data.cheques || []);
  const clearedTotal = cheques.filter(c => c.bankId === bankId && c.status === 'cleared')
    .reduce((s, c) => s + num(c.amount), 0);
  const floatingCheques = cheques.filter(c => c.bankId === bankId && c.status === 'approved');
  const approvedPendingTotal = floatingCheques.reduce((s, c) => s + num(c.amount), 0);
  const bankValue = opening - clearedTotal;
  const bookValue = bankValue - approvedPendingTotal;
  return {
    bank: bankValue,
    book: bookValue,
    floating: approvedPendingTotal,
    opening: opening,
    clearedTotal: clearedTotal,
    approvedPendingTotal: approvedPendingTotal
  };
}
window.bankBalances = bankBalances;

function totalBankBalance() {
  const list = arr(state.data.banks).filter(b => b.active !== false);
  return {
    bank: list.reduce((s, b) => s + bankBalances(b.id).bank, 0),
    book: list.reduce((s, b) => s + bankBalances(b.id).book, 0),
    floating: list.reduce((s, b) => s + bankBalances(b.id).floating, 0)
  };
}
window.totalBankBalance = totalBankBalance;
</script>

__LS_addNav({ group: 'Setup', id: 'chequebooks', ico: '📚', label: 'Cheque Books' });
__LS_addNav({ group: 'System', id: 'settings', ico: '⚙️', label: 'Settings' });

function parseHash() {
  const raw = (location.hash || '#/dashboard').slice(2);
  const parts = raw.split('/').filter(Boolean);
  return { view: parts[0] || 'dashboard', params: parts.slice(1) };
}

function handleRoute() {
  const r = parseHash();
  state.view = REGISTRY.routes[r.view] ? r.view : 'dashboard';

}

function navigate(view) {
  location.hash = '#/' + view;
}
window.navigate = navigate;

/* ────────────── DASHBOARD ────────────── */
function renderDashboard() {
  const banks = arr(state.data.banks).filter(b => b.active !== false);
  const books = arr(state.data.chequeBooks);
  const cheques = arr(state.data.cheques || []);
  const total = totalBankBalance();
  const scheduled = cheques.filter(c => c.status === 'scheduled');
  const need = cheques.filter(c => c.status === 'pending_approval' || (c.status === 'scheduled' && c.chequeDate <= today()));
  const totalDue = need.reduce((s, c) => s + num(c.amount), 0);

  let totalLeaves = 0, totalAvailable = 0;
  books.forEach(b => {
    const s = bookLeavesSummary(b);
    totalLeaves += s.total;
    totalAvailable += s.available;
  });

  return '' +
    (need.length
      ? '<div class="due-popup-banner">' +
          '<div>' +
            '<div class="msg">⚠ ' + need.length + ' cheque' + (need.length > 1 ? 's' : '') +
              ' due · ' + money(totalDue) + '</div>' +
            '<div class="sub">' + need.map(c => '#' + esc(c.chequeNo)).slice(0, 3).join(' · ') + '</div>' +
          '</div>' +
          '<button class="btn primary" data-action="open-approvals">Review</button>' +
        '</div>'
      : '') +

    '<div class="kpi-strip">' +
      '<div class="kpi">' +
        '<div class="k-label">Total Bank</div>' +
        '<div class="k-value" style="font-size:18px">' + money(total.bank) + '</div>' +
        '<div class="k-sub">Actual bank balance</div>' +
      '</div>' +
      '<div class="kpi">' +
        '<div class="k-label">Book Balance</div>' +
        '<div class="k-value" style="font-size:18px;color:var(--accent)">' + money(total.book) + '</div>' +
        '<div class="k-sub">Safe to spend</div>' +
      '</div>' +
      '<div class="kpi warn">' +
        '<div class="k-label">Floating</div>' +
        '<div class="k-value" style="font-size:18px;color:var(--amber)">' + money(total.floating) + '</div>' +
        '<div class="k-sub">Approved not cleared</div>' +
      '</div>' +
      '<div class="kpi">' +
        '<div class="k-label">Available Leaves</div>' +
        '<div class="k-value">' + totalAvailable + '</div>' +
        '<div class="k-sub">' + totalLeaves + ' total</div>' +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-head"><h3>🏦 Bank Balances</h3>' +
        '<button class="btn primary" data-action="bank-new">＋ Add Bank</button></div>' +
      (banks.length
        ? '<div class="bank-cards">' +
            banks.map(b => {
              const bal = bankBalances(b.id);
              return '<div class="bank-card" style="border-left-color:' + esc(b.color || '#7c3aed') + '">' +
                '<div class="bank-card-head">' +
                  '<div>' +
                    '<div class="bank-card-name">' + esc(b.name) + '</div>' +
                    '<div class="bank-card-bank">' + esc(b.bankName || '') +
                      (b.accountNo ? ' • ' + esc(b.accountNo) : '') + '</div>' +
                  '</div>' +
                '</div>' +
                '<div class="bank-balances">' +
                  '<div class="bank-balance-item">' +
                    '<div class="lbl">Bank</div>' +
                    '<div class="val' + (bal.bank < 0 ? ' neg' : '') + '">' + money(bal.bank) + '</div>' +
                  '</div>' +
                  '<div class="bank-balance-item">' +
                    '<div class="lbl">Book</div>' +
                    '<div class="val book' + (bal.book < 0 ? ' neg' : '') + '">' + money(bal.book) + '</div>' +
                  '</div>' +
                  '<div class="bank-balance-item">' +
                    '<div class="lbl">Float</div>' +
                    '<div class="val float">' + money(bal.floating) + '</div>' +
                  '</div>' +
                '</div>' +
              '</div>';
            }).join('') +
          '</div>'
        : '<div class="empty"><span class="big">🏦</span>No banks yet. Click <strong>Add Bank</strong>.</div>') +
    '</div>' +

    (need.length
      ? '<div class="card">' +
          '<div class="card-head"><h3>⏰ Awaiting Approval</h3>' +
            '<button class="btn" data-nav="approvals">View all →</button></div>' +
          '<div class="table-wrap"><table>' +
            '<thead><tr><th>Cheque #</th><th>Due</th><th>Payee</th><th>Bank</th>' +
              '<th class="num">Amount</th><th></th></tr></thead><tbody>' +
            need.slice(0, 5).map(c =>
              '<tr>' +
                '<td class="mono"><strong>' + esc(c.chequeNo || '—') + '</strong></td>' +
                '<td>' + dateFmt(c.chequeDate) + '</td>' +
                '<td>' + esc(c.payeeName || '—') + '</td>' +
                '<td>' + esc(bankName(c.bankId)) + '</td>' +
                '<td class="num"><strong>' + money(c.amount) + '</strong></td>' +
                '<td class="actions-cell">' +
                  '<button class="btn xs primary" data-action="cheque-approve" data-id="' + esc(c.id) + '">Approve</button>' +
                  ' <button class="btn xs" data-action="cheque-open" data-id="' + esc(c.id) + '">Open</button>' +

            ).join('') +
          '</tbody></table></div>' +
