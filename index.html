    '</div>' +

    '<div class="card">' +
      '<div class="card-head"><h3>Quick Links</h3></div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px">' +
        quickLinkCard('accounts',     '📒', 'Chart of Accounts') +
        quickLinkCard('journals',     '📝', 'Journal Entries') +
        quickLinkCard('ledger',       '📚', 'General Ledger') +
        quickLinkCard('trialbalance', '⚖️', 'Trial Balance') +
        quickLinkCard('profitloss',   '📈', 'Profit & Loss') +
        quickLinkCard('balancesheet', '💼', 'Balance Sheet') +
      '</div>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-head"><h3>Recent Journal Entries</h3>' +
        '<button class="btn sm" data-nav="journals">View all →</button></div>' +
      renderRecentJournalEntries() +
    '</div>';
};

function quickLinkCard(view, ico, label) {
  return '<div data-nav="' + view + '" ' +
    'style="padding:14px;border:1px solid var(--border);border-radius:10px;' +
    'background:var(--surface);cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .12s">' +
    '<span style="font-size:22px">' + ico + '</span>' +
    '<strong style="font-size:13px">' + esc(label) + '</strong>' +
  '</div>';
}

function renderRecentJournalEntries() {
  const list = arr(state.data.journalEntries)
    .slice()
    .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)))
    .slice(0, 5);
  if (!list.length) {
    return '<div class="empty" style="padding:30px">No journal entries yet. ' +
      'Click <strong>New Journal Entry</strong> from the Journals page.</div>';
  }
  return '<div class="table-wrap"><table>' +
    '<thead><tr>' +
      '<th>Entry #</th><th>Date</th><th>Description</th>' +
      '<th class="num">Debit</th><th>Status</th>' +
    '</tr></thead><tbody>' +
    list.map(e =>
      '<tr data-action="journal-open" data-id="' + esc(e.id) + '" style="cursor:pointer">' +
        '<td class="mono"><strong>' + esc(e.entryNo || '—') + '</strong></td>' +
        '<td>' + dateFmt(e.date) + '</td>' +
        '<td>' + esc((e.description || '').slice(0, 60)) + '</td>' +
        '<td class="num">' + money(e.totalDebit) + '</td>' +
        '<td>' + journalStatusBadge(e.status) + '</td>' +
      '</tr>'
    ).join('') +
  '</tbody></table></div>';
}

/* ───────────────────────────────────────────────────────────────────────────
   Chart of Accounts
─────────────────────────────────────────────────────────────────────────── */
VIEWS.accounts = function () {
  ensureStateShape();
  const filter = state.views.accounts || {};
  const showInactive = !!filter.showInactive;
  const search = (filter.search || '').toLowerCase();
  const list = accountsSorted();

  const grouped = ACCOUNT_TYPES.map(t => ({
    type: t,
    accounts: list.filter(a =>
      a.type === t &&
      (showInactive || a.active) &&
      (!search || a.code.toLowerCase().includes(search) || a.name.toLowerCase().includes(search))
    )
  })).filter(g => g.accounts.length);

  return '' +
    '<div class="card">' +
      '<div class="card-head">' +
        '<h3>📒 Chart of Accounts (' + list.length + ')</h3>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
          '<button class="btn primary" data-action="account-new">＋ New Account</button>' +
          '<button class="btn" data-action="accounts-reseed">↺ Add missing standard accounts</button>' +
        '</div>' +
      '</div>' +
      '<div class="rpt-filter">' +
        '<label class="field">Search' +
          '<input type="search" id="acctSearch" value="' + esc(filter.search || '') + '" placeholder="Code or name…">' +
        '</label>' +
        '<label class="field" style="flex-direction:row;align-items:center;gap:8px;padding-top:22px">' +
          '<input type="checkbox" id="acctShowInactive" ' + (showInactive ? 'checked' : '') + '> Show inactive' +
        '</label>' +
      '</div>' +
      (grouped.length
        ? grouped.map(g => {
            const typeTotal = g.accounts.reduce((s, a) => s + accountBalance(a.id), 0);
            return '<div style="margin-bottom:22px">' +
              '<div style="display:flex;justify-content:space-between;align-items:center;' +
              'padding:8px 12px;background:var(--surface-2);border-radius:8px;margin-bottom:6px">' +
                '<strong style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)">' +
                  esc(ACCOUNT_TYPE_LABEL[g.type]) +
                '</strong>' +
                '<strong style="font-variant-numeric:tabular-nums">' + money(typeTotal) + '</strong>' +
              '</div>' +
              '<div class="acct-tree">' +
                '<div class="acct-row head">' +
                  '<div>Code</div><div>Name</div><div>Type</div>' +
                  '<div class="num">Balance</div><div></div>' +
                '</div>' +
                g.accounts.map(a => renderAccountRow(a)).join('') +
              '</div>' +
            '</div>';
          }).join('')
        : '<div class="empty"><span class="big">📒</span>' +
          'No accounts match. <button class="btn primary sm" data-action="accounts-reseed" ' +
          'style="margin-left:8px">Seed default CoA</button></div>') +
    '</div>';
};

function renderAccountRow(a) {
  const bal = accountBalance(a.id);
  const negative = bal < 0;
  const isChild = !!a.parentId;
  return '<div class="acct-row" data-action="account-open" data-id="' + esc(a.id) + '">' +
    '<div class="acct-code">' + esc(a.code) + '</div>' +
    '<div class="acct-name' + (isChild ? ' child' : '') + '">' + esc(a.name) + '</div>' +
    '<div>' + accountBadge(a) + '</div>' +
    '<div class="acct-bal' + (negative ? ' neg' : '') + '">' + money(bal) + '</div>' +
    '<div style="text-align:right">' +
      '<button class="icon-btn" data-action="account-edit" data-id="' + esc(a.id) + '" ' +
      'title="Edit" style="pointer-events:auto">✏️</button>' +
    '</div>' +
  '</div>';
}

/* ───────────────────────────────────────────────────────────────────────────
   Journal Entries
─────────────────────────────────────────────────────────────────────────── */
VIEWS.journals = function () {
  ensureStateShape();
  const filter = state.views.journals || {};
  const from = filter.from || '';
  const to = filter.to || '';
  const status = filter.status || 'all';
  const search = (filter.search || '').toLowerCase();

  let list = arr(state.data.journalEntries).slice();
  if (from) list = list.filter(e => e.date >= from);
  if (to)   list = list.filter(e => e.date <= to);
  if (status !== 'all') list = list.filter(e => e.status === status);
  if (search) {
    list = list.filter(e =>
      (e.entryNo || '').toLowerCase().includes(search) ||
      (e.reference || '').toLowerCase().includes(search) ||
      (e.description || '').toLowerCase().includes(search)
    );
  }
  list.sort((a, b) =>
    b.date.localeCompare(a.date) ||
    String(b.entryNo).localeCompare(String(a.entryNo))
  );

  const totalDebit = list.reduce((a, e) => a + num(e.totalDebit), 0);

  return '' +
    '<div class="card">' +
      '<div class="card-head">' +
        '<h3>📝 Journal Entries (' + list.length + ')</h3>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
          '<button class="btn primary" data-action="journal-new">＋ New Journal Entry</button>' +
        '</div>' +
      '</div>' +
      '<div class="rpt-filter">' +
        '<label class="field">From' +
          '<input type="date" id="jFrom" value="' + esc(from) + '">' +
        '</label>' +
        '<label class="field">To' +
          '<input type="date" id="jTo" value="' + esc(to) + '">' +
        '</label>' +
        '<label class="field">Status' +
          '<select id="jStatus">' +
            '<option value="all"' + (status === 'all' ? ' selected' : '') + '>All</option>' +
            '<option value="draft"' + (status === 'draft' ? ' selected' : '') + '>Draft</option>' +
            '<option value="posted"' + (status === 'posted' ? ' selected' : '') + '>Posted</option>' +
            '<option value="void"' + (status === 'void' ? ' selected' : '') + '>Void</option>' +
          '</select>' +
        '</label>' +
        '<label class="field">Search' +
          '<input type="search" id="jSearch" value="' + esc(filter.search || '') + '" ' +
          'placeholder="Number, reference, description…">' +
        '</label>' +
      '</div>' +
      (list.length
        ? '<div class="table-wrap"><table>' +
            '<thead><tr>' +
              '<th>Entry #</th><th>Date</th><th>Reference</th><th>Description</th>' +
              '<th class="num">Debit</th><th class="num">Credit</th>' +
              '<th>Status</th><th></th>' +
            '</tr></thead><tbody>' +
            list.map(e =>
              '<tr data-action="journal-open" data-id="' + esc(e.id) + '" style="cursor:pointer">' +
                '<td class="mono"><strong>' + esc(e.entryNo || '—') + '</strong></td>' +
                '<td>' + dateFmt(e.date) + '</td>' +
                '<td>' + esc(e.reference || '—') + '</td>' +
                '<td>' + esc((e.description || '').slice(0, 60)) + '</td>' +
                '<td class="num">' + money(e.totalDebit) + '</td>' +
                '<td class="num">' + money(e.totalCredit) + '</td>' +
                '<td>' + journalStatusBadge(e.status) + '</td>' +
                '<td style="text-align:right;white-space:nowrap" onclick="event.stopPropagation()">' +
                  (e.status === 'draft'
                    ? '<button class="btn xs primary" data-action="journal-edit" data-id="' + esc(e.id) + '">Edit</button>'
                    : '') +
                '</td>' +
              '</tr>'
            ).join('') +
          '</tbody>' +
          '<tfoot><tr>' +
            '<td colspan="4" style="text-align:right">TOTAL (' + list.length + ' entries)</td>' +
            '<td class="num">' + money(totalDebit) + '</td>' +
            '<td class="num">' + money(list.reduce((a, e) => a + num(e.totalCredit), 0)) + '</td>' +
            '<td colspan="2"></td>' +
          '</tr></tfoot>' +
          '</table></div>'
        : '<div class="empty"><span class="big">📝</span>' +
          'No journal entries match. Click <strong>New Journal Entry</strong> to begin.</div>') +
    '</div>';
};

/* ───────────────────────────────────────────────────────────────────────────
   General Ledger
─────────────────────────────────────────────────────────────────────────── */
VIEWS.ledger = function () {
  ensureStateShape();
  const lv = state.views.ledger || {};
  const accId = lv.accountId || (accountsSorted()[0]?.id || '');
  const from = lv.from || shiftDate(today(), -90);
  const to = lv.to || today();

  const acc = getAccount(accId);
  const led = acc ? accountLedger(accId, from, to) : null;

  /* Build the account picker with the current selection marked. */
  const picker = '<label class="field">Account' +
    '<select id="lvAccount">' +
      '<option value="">Select account…</option>' +
      ACCOUNT_TYPES.map(t => {
        const list = accountsByType(t);
        if (!list.length) return '';
        return '<optgroup label="' + ACCOUNT_TYPE_LABEL[t] + '">' +
          list.map(a =>
            '<option value="' + esc(a.id) + '"' +
            (a.id === accId ? ' selected' : '') + '>' +
            esc(a.code) + ' — ' + esc(a.name) +
            '</option>'
          ).join('') +
        '</optgroup>';
      }).join('') +
    '</select></label>';

  return '' +
    '<div class="card">' +
      '<div class="card-head">' +
        '<h3>📚 General Ledger</h3>' +
        (acc ? '<span class="badge blue">' + esc(acc.code) + ' ' + esc(acc.name) + '</span>' : '') +
      '</div>' +
      '<div class="rpt-filter">' +
        picker +
        '<label class="field">From' +
          '<input type="date" id="lvFrom" value="' + esc(from) + '">' +
        '</label>' +
        '<label class="field">To' +
          '<input type="date" id="lvTo" value="' + esc(to) + '">' +
        '</label>' +
      '</div>' +
      (acc && led
        ? '<div class="kpi-strip">' +
            kpi('Opening Balance', money(led.opening), dateFmt(from)) +
            kpi('Total Debits', money(led.totalDebit), led.rows.length + ' lines') +
            kpi('Total Credits', money(led.totalCredit), '') +
            kpi('Closing Balance', money(led.closing), dateFmt(to)) +
          '</div>' +
          (led.rows.length
            ? '<div class="table-wrap"><table>' +
                '<thead><tr>' +
                  '<th>Date</th><th>Entry #</th><th>Reference</th><th>Description</th>' +
                  '<th class="num">Debit</th><th class="num">Credit</th>' +
                  '<th class="num">Balance</th>' +
                '</tr></thead><tbody>' +
                led.rows.map(r =>
                  '<tr data-action="journal-open" data-id="' + esc(r.entryId) + '" style="cursor:pointer">' +
                    '<td>' + dateFmt(r.date) + '</td>' +
                    '<td class="mono">' + esc(r.entryNo || '—') + '</td>' +
                    '<td>' + esc(r.reference || '—') + '</td>' +
                    '<td>' + esc(r.description || r.memo || '') + '</td>' +
                    '<td class="num">' + (r.debit ? money(r.debit) : '') + '</td>' +
                    '<td class="num">' + (r.credit ? money(r.credit) : '') + '</td>' +
                    '<td class="num"><strong>' + money(r.balance) + '</strong></td>' +
                  '</tr>'
                ).join('') +
              '</tbody>' +
              '<tfoot><tr>' +
                '<td colspan="4" style="text-align:right">Movement + Opening = Closing</td>' +
                '<td class="num">' + money(led.totalDebit) + '</td>' +
                '<td class="num">' + money(led.totalCredit) + '</td>' +
                '<td class="num">' + money(led.closing) + '</td>' +
              '</tr></tfoot>' +
              '</table></div>'
            : '<div class="empty"><span class="big">📚</span>No transactions in this date range.</div>')
        : '<div class="empty"><span class="big">📚</span>Select an account above to view its ledger.</div>') +
    '</div>';
};

/* ───────────────────────────────────────────────────────────────────────────
   Trial Balance
─────────────────────────────────────────────────────────────────────────── */
VIEWS.trialbalance = function () {
  ensureStateShape();
  const asOf = state.views.trialbalance?.asOf || today();
  const tb = trialBalance(asOf);

  const byType = {};
  tb.rows.forEach(r => {
    if (!byType[r.account.type]) byType[r.account.type] = [];
    byType[r.account.type].push(r);
  });
  const typeOrder = ['asset', 'liability', 'equity', 'income', 'expense'];

  return '' +
    '<div class="card">' +
      '<div class="card-head">' +
        '<h3>⚖️ Trial Balance</h3>' +
        (tb.balanced
          ? '<span class="balanced-ok">✓ Balanced</span>'
          : '<span class="balanced-err">⚠ Off by ' + money(tb.totalDebit - tb.totalCredit) + '</span>') +
      '</div>' +
      '<div class="rpt-filter">' +
        '<label class="field">As of Date' +
          '<input type="date" id="tbAsOf" value="' + esc(asOf) + '">' +
        '</label>' +
        '<div style="align-self:end;display:flex;gap:6px">' +
          '<button class="btn" data-action="tb-print">🖨 Print</button>' +
          '<button class="btn" data-action="tb-export">⬇ CSV</button>' +
        '</div>' +
      '</div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr>' +
          '<th>Code</th><th>Account</th><th>Type</th>' +
          '<th class="num">Debit</th><th class="num">Credit</th>' +
        '</tr></thead><tbody>' +
        (tb.rows.length
          ? typeOrder.map(t => {
              const group = byType[t];
              if (!group) return '';
              return '<tr><td colspan="5" ' +
                'style="background:var(--surface-2);font-weight:700;font-size:11px;' +
                'text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)">' +
                esc(ACCOUNT_TYPE_LABEL[t]) +
                '</td></tr>' +
                group.map(r =>
                  '<tr>' +
                    '<td class="mono">' + esc(r.account.code) + '</td>' +
                    '<td>' + esc(r.account.name) + '</td>' +
                    '<td>' + accountBadge(r.account) + '</td>' +
                    '<td class="num">' + (r.debit ? money(r.debit) : '') + '</td>' +
                    '<td class="num">' + (r.credit ? money(r.credit) : '') + '</td>' +
                  '</tr>'
                ).join('');
            }).join('')
          : '<tr><td colspan="5"><div class="empty">' +
            'No postings yet. Create a journal entry or post opening balances to see balances here.' +
            '</div></td></tr>') +
        '</tbody>' +
        (tb.rows.length
          ? '<tfoot><tr>' +
              '<td colspan="3" style="text-align:right">TOTAL</td>' +
              '<td class="num">' + money(tb.totalDebit) + '</td>' +
              '<td class="num">' + money(tb.totalCredit) + '</td>' +
            '</tr></tfoot>'
          : '') +
      '</table></div>' +
    '</div>';
};

/* ───────────────────────────────────────────────────────────────────────────
   Profit & Loss
─────────────────────────────────────────────────────────────────────────── */
VIEWS.profitloss = function () {
  ensureStateShape();
  const pv = state.views.profitloss || {};
  const from = pv.from || (new Date().getFullYear() + '-01-01');
  const to = pv.to || today();
  const basis = pv.basis || (state.settings?.accounting?.basis || 'accrual');
  const pnl = profitAndLoss(from, to, basis);

  return '' +
    '<div class="card">' +
      '<div class="card-head">' +
        '<h3>📈 Profit & Loss</h3>' +
        '<span class="badge blue">' + (basis === 'cash' ? 'Cash Basis' : 'Accrual Basis') + '</span>' +
      '</div>' +
      '<div class="rpt-filter">' +
        '<label class="field">From' +
          '<input type="date" id="plFrom" value="' + esc(from) + '">' +
        '</label>' +
        '<label class="field">To' +
          '<input type="date" id="plTo" value="' + esc(to) + '">' +
        '</label>' +
        '<label class="field">Basis' +
          '<select id="plBasis">' +
            '<option value="accrual"' + (basis === 'accrual' ? ' selected' : '') + '>Accrual</option>' +
            '<option value="cash"' + (basis === 'cash' ? ' selected' : '') + '>Cash</option>' +
          '</select>' +
        '</label>' +
        '<div style="align-self:end">' +
          '<button class="btn" data-action="pl-print">🖨 Print</button>' +
        '</div>' +
      '</div>' +

      '<div class="stmt-section">' +
        '<h4>Income</h4>' +
        (pnl.income.length
          ? pnl.income.map(x =>
              '<div class="stmt-row">' +
                '<span>' + esc(x.account.code) + ' — ' + esc(x.account.name) + '</span>' +
                '<span class="stmt-amount">' + money(x.amount) + '</span>' +
              '</div>'
            ).join('')
          : '<div class="stmt-row indent">No income recorded in this period</div>') +
        '<div class="stmt-row total">' +
          '<span>Total Income</span>' +
          '<span class="stmt-amount">' + money(pnl.totalIncome) + '</span>' +
        '</div>' +
      '</div>' +

      '<div class="stmt-section">' +
        '<h4>Expenses</h4>' +
        (pnl.expenses.length
          ? pnl.expenses.map(x =>
              '<div class="stmt-row">' +
                '<span>' + esc(x.account.code) + ' — ' + esc(x.account.name) + '</span>' +
                '<span class="stmt-amount">' + money(x.amount) + '</span>' +
              '</div>'
            ).join('')
          : '<div class="stmt-row indent">No expenses recorded in this period</div>') +
        '<div class="stmt-row total">' +
          '<span>Total Expenses</span>' +
          '<span class="stmt-amount">' + money(pnl.totalExpenses) + '</span>' +
        '</div>' +
      '</div>' +

      '<div class="stmt-row grand">' +
        '<span>' + (pnl.netProfit >= 0 ? 'Net Profit' : 'Net Loss') + '</span>' +
        '<span class="stmt-amount" style="color:' +
          (pnl.netProfit >= 0 ? 'var(--green)' : 'var(--red)') + '">' +
          money(Math.abs(pnl.netProfit)) +
        '</span>' +
      '</div>' +
    '</div>';
};

      selectField('Type', 'aType',

        { required: true }) +
    '</div>' +
    '<div style="margin-top:14px">' +
      field('Name', 'aName', acc?.name || '', { required: true, placeholder: 'e.g. Cash on Hand' }) +
    '</div>' +
    '<div style="margin-top:14px">' +
      selectField('Parent Account (optional)', 'aParent',
        parentOptions, acc?.parentId || '',
        { placeholder: '— None —' }) +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">' +
      field('Opening Balance', 'aOB',
        acc ? num(acc.openingBalance).toFixed(2) : '0.00',
        { type: 'number', step: '0.01' }) +
      field('Opening Date', 'aOBDate',
        acc?.openingDate || today(),
        { type: 'date' }) +
    '</div>' +
    '<div style="margin-top:14px">' +
      field('Description', 'aDesc', acc?.description || '', { type: 'textarea' }) +
    '</div>' +
    '<div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px">' +
        '<input type="checkbox" id="aControl" ' + (acc?.isControl ? 'checked' : '') + '>' +
        'Control account (posted from sub-ledger)' +
      '</label>' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px">' +
        '<input type="checkbox" id="aContra" ' + (acc?.isContra ? 'checked' : '') + '>' +
        'Contra account (reverses normal balance)' +
      '</label>' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px">' +
        '<input type="checkbox" id="aActive" ' + ((acc?.active !== false) ? 'checked' : '') + '>' +
        'Active' +
      '</label>' +
    '</div>';

  openModal(acc ? '✏️ Edit Account' : '➕ New Account', body, {
    width: 700,
    footer:
      (acc ? '<button class="btn danger" data-action="account-delete" data-id="' + esc(acc.id) + '">Delete</button>' : '') +
      '<button class="btn" data-close-modal>Cancel</button>' +
      '<button class="btn primary" id="aSaveBtn">' + (acc ? 'Update' : 'Create') + '</button>'
  });

  document.getElementById('aSaveBtn').onclick = () => {
    const data = {
      code: document.getElementById('aCode').value.trim(),
      name: document.getElementById('aName').value.trim(),
      type: document.getElementById('aType').value,
      parentId: document.getElementById('aParent').value || null,
      openingBalance: num(document.getElementById('aOB').value),
      openingDate: document.getElementById('aOBDate').value || null,
      description: document.getElementById('aDesc').value.trim(),
      isControl: document.getElementById('aControl').checked,
      isContra: document.getElementById('aContra').checked,
      active: document.getElementById('aActive').checked
    };

    if (!data.code) { toast('Code is required', 'error'); return; }
    if (!data.name) { toast('Name is required', 'error'); return; }

    const dupe = allAccounts().find(a => a.code === data.code && a.id !== id);
    if (dupe) { toast('Code "' + data.code + '" already in use', 'error'); return; }

    if (acc) {
      Object.assign(acc, data);
      acc.isBank = acc.isControl && (acc.controlType === 'bank' || acc.controlType === 'cash' || acc.controlType === 'petty-cash');
      acc.updatedAt = nowISO();
      acc.updatedBy = state.user?.email || 'system';
      markDirty('accounts', acc.id);
    } else {
      const newAcc = Object.assign(makeAccount(data), data);
      newAcc.isBank = newAcc.isControl && (newAcc.controlType === 'bank' || newAcc.controlType === 'cash' || newAcc.controlType === 'petty-cash');
      state.data.accounts.push(newAcc);
      markDirty('accounts', newAcc.id);
    }

    closeModal();
    toast(acc ? 'Account updated' : 'Account created', 'success');
    renderApp();
  };
}

function deleteAccountById(id) {
  if (!state.perms.delete) { toast('No delete permission', 'error'); return; }
  const acc = getAccount(id);
  if (!acc) return;

  if (accountHasChildren(id)) {
    toast('Has child accounts — reassign or delete them first', 'error');
    return;
  }

  const hasPostings = arr(state.data.journalEntries)
    .some(e => e.status === 'posted' && arr(e.lines).some(l => l.accountId === id));
  if (hasPostings) {
    toast('Account has posted entries — deactivate instead of deleting', 'error');
    return;
  }

  if (!confirm('Delete account "' + acc.code + ' — ' + acc.name + '"?')) return;

  state.data.accounts = state.data.accounts.filter(a => a.id !== id);
  _dirty.add('accounts:' + id);
  delete _snapshot['accounts:' + id];
  state.sync.dirty = true;
  scheduleSync();

  closeModal();
  toast('Account deleted', 'success');
  renderApp();
}

function renderJournalLines(lines) {
  const box = document.getElementById('jeLines');
  if (!box) return;
  box.innerHTML = '';
  lines.forEach(l => appendJournalLine(l));
  recalcJournalTotals();
}

function appendJournalLine(l) {
  const box = document.getElementById('jeLines');
  if (!box) return;

  const row = document.createElement('div');
  row.className = 'jl-row';
  row.innerHTML =
    '<select class="jl-account">' +
      '<option value="">— Select account —</option>' +
      accountOptionsByType() +
    '</select>' +
    '<input type="number" class="jl-debit" step="0.01" min="0" placeholder="0.00">' +
    '<input type="number" class="jl-credit" step="0.01" min="0" placeholder="0.00">' +
    '<input type="text" class="jl-memo" placeholder="Memo">' +
    '<button class="icon-btn" type="button" title="Remove line">✕</button>';

  box.appendChild(row);

  row.querySelector('.jl-account').value = l.accountId || '';
  row.querySelector('.jl-debit').value = num(l.debit) > 0 ? num(l.debit).toFixed(2) : '';
  row.querySelector('.jl-credit').value = num(l.credit) > 0 ? num(l.credit).toFixed(2) : '';
  row.querySelector('.jl-memo').value = l.memo || '';

  row.querySelector('.jl-debit').oninput = () => {
    if (num(row.querySelector('.jl-debit').value) > 0) row.querySelector('.jl-credit').value = '';
    recalcJournalTotals();
  };
  row.querySelector('.jl-credit').oninput = () => {
    if (num(row.querySelector('.jl-credit').value) > 0) row.querySelector('.jl-debit').value = '';
    recalcJournalTotals();
  };
  row.querySelector('.icon-btn').onclick = () => {
    const count = document.querySelectorAll('#jeLines .jl-row').length;
    if (count <= 2) { toast('At least 2 lines required', 'warn'); return; }
    row.remove();
    recalcJournalTotals();
  };
}

function recalcJournalTotals() {
  const rows = document.querySelectorAll('#jeLines .jl-row');
  let debit = 0, credit = 0;
  rows.forEach(r => {
    debit += num(r.querySelector('.jl-debit').value);
    credit += num(r.querySelector('.jl-credit').value);
  });
  const td = document.getElementById('jeTotalDebit');
  const tc = document.getElementById('jeTotalCredit');
  const msg = document.getElementById('jeBalanceMsg');
  if (td) td.textContent = debit.toFixed(2);
  if (tc) tc.textContent = credit.toFixed(2);
  if (msg) {
    if (debit === 0 && credit === 0) {
      msg.innerHTML = '';
    } else if (Math.abs(debit - credit) < 0.005) {
      msg.innerHTML = '<span class="jl-bal-ok">✓ Balanced</span>';
    } else {
      msg.innerHTML = '<span class="jl-bal-err">⚠ Off by ' + money(debit - credit) + '</span>';
    }
  }
}

function readJournalLines() {
  const rows = document.querySelectorAll('#jeLines .jl-row');
  return Array.from(rows)
    .map(r => ({
      accountId: r.querySelector('.jl-account').value,
      debit: num(r.querySelector('.jl-debit').value),
      credit: num(r.querySelector('.jl-credit').value),
      memo: r.querySelector('.jl-memo').value.trim()
    }))
    .filter(l => l.accountId && (l.debit > 0 || l.credit > 0));
}

function saveJournal(entry, mode) {
  const data = {
    date: document.getElementById('jeDate').value || today(),
    reference: document.getElementById('jeReference').value.trim(),
    description: document.getElementById('jeDescription').value.trim(),
    lines: readJournalLines()
  };

  if (data.lines.length < 2) { toast('At least 2 valid lines required', 'error'); return; }

  const v = validateJournalEntry(data);
  if (!v.valid) { toast(v.errors.join('\n'), 'error', 5000); return; }

  let savedEntry;
  if (entry) {
    savedEntry = updateJournalEntry(entry.id, data);
    if (!savedEntry) { toast('Failed to update entry', 'error'); return; }
  } else {
    savedEntry = createJournalEntry(data);
  }

  if (mode === 'posted') {
    const r = postJournalEntry(savedEntry.id);
    if (!r.ok) { toast(r.error, 'error', 5000); return; }
    toast('Entry posted as ' + r.entry.entryNo, 'success');
  } else {
    toast('Saved as draft', 'success');
  }

  closeModal();
  renderApp();
}

        '<th>Account</th><th>Memo</th>' +
        '<th class="num">Debit</th><th class="num">Credit</th>' +

      arr(entry.lines).map(l => {
        const acc = getAccount(l.accountId);
        return '<tr>' +
          '<td>' + (acc
            ? '<span class="mono">' + esc(acc.code) + '</span> ' + esc(acc.name)
            : '<em>Missing account</em>') + '</td>' +
          '<td>' + esc(l.memo || '') + '</td>' +
          '<td class="num">' + (l.debit ? money(l.debit) : '') + '</td>' +
          '<td class="num">' + (l.credit ? money(l.credit) : '') + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody>' +
      '<tfoot><tr>' +
        '<td colspan="2" style="text-align:right">TOTALS</td>' +
        '<td class="num">' + money(entry.totalDebit) + '</td>' +
        '<td class="num">' + money(entry.totalCredit) + '</td>' +
      '</tr></tfoot>' +
    '</table></div>' +
    (entry.status === 'void'
      ? '<div class="alert" style="background:var(--red-soft);color:var(--red);' +
        'padding:12px;border-radius:8px;margin-top:14px;font-size:12.5px">' +
        'Voided ' + dateTimeFmt(entry.voidedAt) + ' by ' + esc(entry.voidedBy || '') +
        (entry.reversedById
          ? ' — reversal entry created (ID ends with ' + esc(entry.reversedById.slice(-6)) + ')'
          : '') +
        '</div>'
      : '') +
    (entry.source === 'reversal'
      ? '<div class="alert" style="background:var(--amber-soft);color:var(--amber);' +
        'padding:12px;border-radius:8px;margin-top:14px;font-size:12.5px">' +
        'This is a reversal entry. It offsets another entry and cannot itself be voided.' +
        '</div>'
      : '');

  openModal('📝 Journal Entry', body, {
    width: 800,
    footer:
      (canEdit ? '<button class="btn" data-action="journal-edit" data-id="' + esc(entry.id) + '">Edit</button>' : '') +
      (entry.status === 'draft'
        ? '<button class="btn primary" data-action="journal-post" data-id="' + esc(entry.id) + '">Post Entry</button>'
        : '') +
      (entry.status === 'posted' && entry.source !== 'reversal'
        ? '<button class="btn danger" data-action="journal-void" data-id="' + esc(entry.id) + '">Void</button>'
        : '') +
      '<button class="btn" data-close-modal>Close</button>'
  });
}

/* ───────────────────────────────────────────────────────────────────────────
   Opening balances actions
─────────────────────────────────────────────────────────────────────────── */
function saveOpeningBalances() {
  if (!state.perms.write) { toast('Read-only', 'error'); return; }
  const inputs = document.querySelectorAll('.ob-input');
  let changed = 0;

  inputs.forEach(inp => {
    const acc = getAccount(inp.dataset.accountId);
    if (!acc) return;
    const v = num(inp.value);
    if (v !== num(acc.openingBalance)) {
      acc.openingBalance = v;
      acc.updatedAt = nowISO();
      markDirty('accounts', acc.id);
      changed++;
    }
  });

  if (changed === 0) { toast('No changes', 'info'); return; }
  toast('Saved ' + changed + ' balance(s)', 'success');
  renderApp();
}

function postOpeningJournal() {
  if (!state.perms.write) { toast('Read-only', 'error'); return; }
  if (state.settings?.accounting?.openingPosted) { toast('Already posted', 'warn'); return; }

  const obAcct = getAccountByCode('3900');
  if (!obAcct) { toast('Opening Balance Equity (3900) account not found', 'error'); return; }

  const lines = [];
  let totalDebit = 0, totalCredit = 0;

  accountsSorted().forEach(a => {
    const ob = num(a.openingBalance);
    if (Math.abs(ob) < 0.005) return;
    const dir = normalDirection(a);
    const absOb = Math.abs(ob);

    if (ob > 0) {
      if (dir === 'debit') {
        lines.push({ accountId: a.id, debit: absOb, credit: 0, memo: 'Opening balance' });
        totalDebit += absOb;
      } else {
        lines.push({ accountId: a.id, debit: 0, credit: absOb, memo: 'Opening balance' });
        totalCredit += absOb;
      }
    } else {
      if (dir === 'debit') {
        lines.push({ accountId: a.id, debit: 0, credit: absOb, memo: 'Opening balance (negative)' });
        totalCredit += absOb;
      } else {
        lines.push({ accountId: a.id, debit: absOb, credit: 0, memo: 'Opening balance (negative)' });
        totalDebit += absOb;
      }
    }
  });

  const diff = totalDebit - totalCredit;
  if (Math.abs(diff) > 0.005) {
    if (diff > 0) {
      lines.push({ accountId: obAcct.id, debit: 0, credit: diff, memo: 'Auto-balancing' });
    } else {
      lines.push({ accountId: obAcct.id, debit: Math.abs(diff), credit: 0, memo: 'Auto-balancing' });
    }
  }

  if (lines.length < 2) { toast('No opening balances entered', 'warn'); return; }

  const entry = createJournalEntry({
    date: today(),
    reference: 'OPENING-BALANCES',
    description: 'Opening balances posted from wizard',
    source: 'opening',
    lines
  });

  const r = postJournalEntry(entry.id);
  if (!r.ok) { toast(r.error, 'error', 5000); return; }

  state.settings.accounting = state.settings.accounting || {};
  state.settings.accounting.openingPosted = true;
  state.settings.accounting.openingPostedAt = nowISO();
  state.settings.updatedAt = nowISO();
  pushSettings();

  toast('Opening balances posted as ' + r.entry.entryNo, 'success');
  renderApp();
}

function resetOpeningBalances() {
  if (!state.perms.delete) { toast('No permission', 'error'); return; }
  if (!confirm('Unlock opening balances for editing? The previously posted opening journal entry stays in the books — you can post a new one after editing.')) return;

  state.settings.accounting = state.settings.accounting || {};
  state.settings.accounting.openingPosted = false;
  state.settings.accounting.openingPostedAt = null;
  state.settings.updatedAt = nowISO();
  pushSettings();
  renderApp();
}

function reseedChartOfAccounts() {
  if (!state.perms.write) { toast('Read-only role', 'error'); return; }

  if (arr(state.data.accounts).length > 0) {
    if (!confirm('Add any missing standard accounts? Existing accounts will not be touched.')) return;
    const existingCodes = new Set(allAccounts().map(a => a.code));
    const missing = STANDARD_COA.filter(def => !existingCodes.has(String(def.code)));

    if (!missing.length) { toast('All standard accounts already exist', 'info'); return; }

    missing.forEach(def => {
      const acc = makeAccount(def);
      state.data.accounts.push(acc);
      markDirty('accounts', acc.id);
    });
    toast('Added ' + missing.length + ' missing accounts', 'success');
    renderApp();
    return;
  }

  if (!confirm('Seed the standard Chart of Accounts? This creates ~55 accounts.')) return;

  state.settings.accounting = state.settings.accounting || {};
  state.settings.accounting.accountsSeeded = false;
  seedChartOfAccountsIfEmpty().then(() => {
    toast('Chart of Accounts seeded', 'success');
    renderApp();
  });
}

function saveSettingsFromForm() {
  const s = state.settings || defaultSettings();
  s.business = s.business || {};
  s.business.name    = document.getElementById('settingsName')?.value.trim()    || s.business.name;
  s.business.tagline = document.getElementById('settingsTagline')?.value.trim() || '';
  s.business.phone   = document.getElementById('settingsPhone')?.value.trim()   || '';
  s.business.email   = document.getElementById('settingsEmail')?.value.trim()   || '';
  s.business.address = document.getElementById('settingsAddress')?.value.trim() || '';

  s.accounting = s.accounting || {};
  const basis = document.getElementById('settingsBasis')?.value;
  if (basis) s.accounting.basis = basis;
  const fyStart = document.getElementById('settingsFYStart')?.value.trim();
  if (fyStart) s.accounting.fiscalYearStart = fyStart;
  const fyEnd = document.getElementById('settingsFYEnd')?.value.trim();
  if (fyEnd) s.accounting.fiscalYearEnd = fyEnd;
  s.accounting.closedThrough = document.getElementById('settingsClosedThrough')?.value || null;

  s.updatedAt = nowISO();
  s.updatedBy = state.user?.email || '';
  state.settings = s;

  pushSettings();
}

async function pushSettings() {
  if (state.offline || !state.firebaseReady || !state.user) return;
  try {
    await docRef(CONFIG.settingsPath).set(JSON.parse(JSON.stringify(state.settings)));
    saveCache();
    toast('Settings saved', 'success');
    applySettings();
  } catch (e) {
    toast('Settings save failed: ' + (e.code || e.message), 'error');
    dbg.err('pushSettings: ' + (e.code || e.message));
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   §15 — ROUTER + GLOBAL CLICK HANDLER + CSV EXPORT
═══════════════════════════════════════════════════════════════════════════ */
function navigate(view) {
  if (!VIEWS[view]) return;
  state.view = view;
  state.views = {};
  renderApp();
}

document.addEventListener('click', e => {
  /* Navigation clicks */
  const nav = e.target.closest('[data-nav]');
  if (nav) { navigate(nav.dataset.nav); return; }

  /* Close modal */
  if (e.target.closest('[data-close-modal]')) { closeModal(); return; }

  /* Action clicks */
  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) return;

  const a = actionEl.dataset.action;
  const id = actionEl.dataset.id;

  const handlers = {
    /* Accounts */
    'account-new': () => openAccountForm(null),
    'account-open': () => openAccountForm(id),
    'account-edit': (ev) => { ev.stopPropagation(); openAccountForm(id); },
    'account-delete': () => deleteAccountById(id),
    'accounts-reseed': () => reseedChartOfAccounts(),

    /* Journals */
    'journal-new': () => openJournalForm(null),
    'journal-edit': () => { closeModal(); openJournalForm(id); },
    'journal-open': () => openJournalView(id),
    'journal-delete': () => {
      if (!confirm('Delete this draft entry?')) return;
      const r = deleteJournalEntry(id);
      if (!r.ok) { toast(r.error, 'error'); return; }
      closeModal(); toast('Draft deleted', 'success'); renderApp();
    },
    'journal-post': () => {
      const r = postJournalEntry(id);
      if (!r.ok) { toast(r.error, 'error', 5000); return; }
      closeModal(); toast('Posted as ' + r.entry.entryNo, 'success'); renderApp();
    },
    'journal-void': () => {
      if (!confirm('Void this entry? A reversing entry will be created.')) return;
      const r = voidJournalEntry(id);
      if (!r.ok) { toast(r.error, 'error', 5000); return; }
      closeModal();
      toast('Voided — reversal ' + r.reversal.entryNo + ' created', 'success');
      renderApp();
    },

    /* Opening balances */
    'ob-save': () => saveOpeningBalances(),
    'ob-post': () => postOpeningJournal(),
    'ob-reset': () => resetOpeningBalances(),

    /* Report buttons */
    'tb-print': () => window.print(),
    'tb-export': () => exportTrialBalanceCSV(),
    'pl-print': () => window.print(),
    'bs-print': () => window.print(),

    /* Debug panel actions */
    'dbg-force-push': () => { pushToFirestore().then(() => toast('Pushed', 'success')); },
    'dbg-force-pull': () => {
      pullFromFirestore()
        .then(async () => {
          await seedChartOfAccountsIfEmpty();
          takeSnapshot();
          renderApp();
          toast('Pulled', 'success');
        });
    },
    'dbg-snapshot': () => { takeSnapshot(); toast('Snapshot taken', 'success'); },
    'dbg-qa': () => runQA()
    /* ── Phase 3: Customers ── */
    'customer-new': () => openCustomerForm(null),
    'customer-open': () => { toast('Customer detail view coming soon', 'info'); },
    'customer-edit': (ev) => { ev.stopPropagation(); openCustomerForm(id); },
    'customer-delete': (ev) => {
      ev.stopPropagation();
      if (document.getElementById('modalWrap').classList.contains('open')) closeModal();
      deleteCustomerById(id);
    },
    'customers-export': () => exportAllCustomersCSV(),
    'customers-bulk-export': () => customerBulkExport(),
    'customers-bulk-delete': () => customerBulkDelete(),
    'customers-bulk-clear': () => customerBulkClear(),
  };

  if (handlers[a]) { e.preventDefault(); handlers[a](e); }
});

function exportTrialBalanceCSV() {
  const asOf = state.views.trialbalance?.asOf || today();
  const tb = trialBalance(asOf);
  const rows = [['Code', 'Account', 'Type', 'Debit', 'Credit']];

  tb.rows.forEach(r => rows.push([
    r.account.code, r.account.name, ACCOUNT_TYPE_LABEL[r.account.type],
    r.debit || '', r.credit || ''
  ]));
  rows.push(['', 'TOTAL', '', tb.totalDebit, tb.totalCredit]);

  const csv = rows.map(r => r.map(csvEsc).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'trial_balance_' + asOf + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('CSV downloaded', 'success');
}

function showLogin() {
  document.getElementById('loginWrap').classList.remove('hidden');
  document.getElementById('appRoot').classList.add('hidden');
}
function hideLogin() {
  document.getElementById('loginWrap').classList.add('hidden');
  document.getElementById('appRoot').classList.remove('hidden');
}
function loginMsg(text, type) {
  const el = document.getElementById('loginMsg');
  if (!el) return;
  el.textContent = text || '';
  el.className = 'login-msg' + (type ? ' ' + type : '');
}

async function boot() {
  dbg.ok('Boot — v' + CONFIG.appVersion);

  /* 1. Cache first — instant paint with correct branding */
  loadCache();
  ensureStateShape();

  /* 2. Wire static buttons */
  document.getElementById('googleBtn').addEventListener('click', signInWithGoogle);
  document.getElementById('magicBtn').addEventListener('click', signInWithMagicLink);
  document.getElementById('magicEmail').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); signInWithMagicLink(); }
  });
  document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
    state.settings.appearance = state.settings.appearance || {};
    state.settings.appearance.sidebarCollapsed = !state.settings.appearance.sidebarCollapsed;
    applySettings();
  });
  document.getElementById('themeBtn').addEventListener('click', () => {
    const order = ['professional', 'dark'];
    state.settings.appearance = state.settings.appearance || {};
    const cur = state.settings.appearance.theme || 'professional';
    const idx = order.indexOf(cur);
    state.settings.appearance.theme = order[(idx + 1) % order.length];
    applySettings();
  });
  document.getElementById('syncBtn').addEventListener('click', async () => {
    toast('Syncing…', 'info');
    try { await pushToFirestore(); toast('Sync complete', 'success'); }
    catch (e) { toast('Sync failed: ' + (e.code || e.message), 'error'); }
  });
  document.getElementById('signOutBtn').addEventListener('click', signOut);

  /* 3. Global keyboard */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.ctrlKey && e.key === '`') {
      e.preventDefault();
      document.getElementById('dbg').classList.toggle('on');
    }
  });

  /* 4. Firebase init */
  if (!initFirebase()) {
    loginMsg('Firebase failed to load. Check your internet connection and reload.', 'err');
    return;
  }

  /* 5. Magic link return */
  await handleMagicLinkReturn();

  /* 6. Auth listener */
  auth.onAuthStateChanged(onAuthStateChanged);

  /* 7. QA mode */
  if (new URLSearchParams(location.search).has('qa')) {
    setTimeout(runQA, 2500);
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   §17 — DEV HOOKS
   Debug panel + QA self-test + public API for the console.
═══════════════════════════════════════════════════════════════════════════ */
const dbg = {
  log:   (m) => append('', m),
  info:  (m) => append('#7dd3fc', m),
  ok:    (m) => append('#34d399', m),
  warn:  (m) => append('#fbbf24', m),
  err:   (m) => append('#f87171', m)
};

function append(color, msg) {
  const el = document.getElementById('dbg');
  if (!el) return;

  const line = document.createElement('div');
  line.className = 'ln';
  if (color) line.style.color = color;
  line.textContent = '[' + new Date().toLocaleTimeString('en-GB') + '] ' + msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;

  if (el.children.length > 500) el.removeChild(el.firstChild);

  if (color === '#f87171') console.error(msg);
  else if (color === '#fbbf24') console.warn(msg);
  else console.log(msg);
}

document.getElementById('dbgBtn').addEventListener('click', () => {
  document.getElementById('dbg').classList.toggle('on');
});

function runQA() {
  const results = [];
  const assert = (name, cond) => results.push({ name, pass: !!cond });

  /* Core */
  assert('state exists', typeof state === 'object');
  assert('CONFIG loaded', CONFIG.adminEmail === 'asifabooasif@gmail.com');
  assert('COLLECTIONS > 40', COLLECTIONS.length > 40);
  assert('esc escapes quote', esc("O'Brien") === 'O&#39;Brien');
  assert('esc escapes slash', esc('<\/script>') === '&lt;&#47;script&gt;');
  assert('num parses', num('12.34') === 12.34);
  assert('num handles NaN', num('x') === 0);

  /* Accounting */
  assert('accountBalance works', typeof accountBalance === 'function');
  assert('trialBalance works', (() => { try { trialBalance(); return true; } catch { return false; } })());
  assert('accountLedger works', (() => { try { accountLedger(arr(state.data.accounts)[0]?.id || 'x'); return true; } catch { return false; } })());
  assert('profitAndLoss works', (() => { try { profitAndLoss('2024-01-01', '2024-12-31'); return true; } catch { return false; } })());
  assert('balanceSheet works', (() => { try { balanceSheet(); return true; } catch { return false; } })());
  assert('validateJournalEntry works', (() => { try { validateJournalEntry({ date: today(), lines: [] }); return true; } catch { return false; } })());

  /* Views */
  Object.keys(VIEWS).forEach(name => {
    assert('View renders: ' + name, (() => { try { VIEWS[name](); return true; } catch (e) { return false; } })());
  });

  /* Report and log */
  const passed = results.filter(r => r.pass).length;
  const failed = results.filter(r => !r.pass);

  dbg.info('═══════════════════════════════════════');
  dbg.ok('QA — ' + passed + '/' + results.length + ' passed');
  failed.forEach(f => dbg.err('FAIL: ' + f.name));
  dbg.info('═══════════════════════════════════════');

  toast('QA: ' + passed + '/' + results.length + ' passed',
    failed.length ? 'warn' : 'success', 5000);

  return { passed, failed, total: results.length };
}

/* ───────────────────────────────────────────────────────────────────────────
   Save customer
─────────────────────────────────────────────────────────────────────────── */
function saveCustomer(existing) {
  if (!state.perms.write) { toast('Read-only role', 'error'); return; }

  const data = {
    name: document.getElementById('cName').value.trim(),
    phone: document.getElementById('cPhone').value.trim(),
    email: document.getElementById('cEmail').value.trim(),
    business: document.getElementById('cBusiness').value.trim(),
    address: document.getElementById('cAddress').value.trim(),
    notes: document.getElementById('cNotes').value.trim(),

    openingBalance: num(document.getElementById('cOpening').value),
    openingDate: document.getElementById('cOpeningDate').value || null,
    openingBalanceType: document.getElementById('cOpeningType').value || 'receivable',
    chequeLimit: num(document.getElementById('cLimit').value),

    salespersonId: document.getElementById('cSalesperson').value || null,
    priceListId: document.getElementById('cPriceList').value || null,

    blacklisted: document.getElementById('cBlacklist').checked,
    blacklistReason: document.getElementById('cBlacklistReason').value.trim()
  };

  if (!data.name) { toast('Name is required', 'error'); return; }

  /* Duplicate name check on create */
  if (!existing) {
    const dupe = allCustomers().find(c =>
      c.name.toLowerCase().trim() === data.name.toLowerCase()
    );
    if (dupe) {
      if (!confirm('A customer named "' + data.name + '" already exists.\nProceed anyway?')) return;
    }
  }

  if (existing) {
    /* Preserve IDs, timestamps, and blacklist metadata if toggle unchanged */
    const wasBlacklisted = existing.blacklisted;
    const before = JSON.parse(JSON.stringify(existing));

    Object.assign(existing, data);
    existing.updatedAt = nowISO();
    existing.updatedBy = state.user?.email || 'system';

    if (data.blacklisted && !wasBlacklisted) {
      existing.blacklistedAt = nowISO();
      existing.blacklistedBy = state.user?.email || 'system';
    } else if (!data.blacklisted && wasBlacklisted) {
      existing.blacklistedAt = null;
      existing.blacklistedBy = null;
    }

    markDirty('customers', existing.id);

    /* Also log a version history entry */
    recordVersion('customers', existing.id, 'update', before, existing);
  } else {
    const created = makeCustomer(data);
    created.blacklistedAt = data.blacklisted ? nowISO() : null;
    created.blacklistedBy = data.blacklisted ? (state.user?.email || 'system') : null;
    state.data.customers.push(created);
    markDirty('customers', created.id);
    recordVersion('customers', created.id, 'create', null, created);
  }

  closeModal();
  toast(existing ? 'Customer updated' : 'Customer created', 'success');
  renderApp();
}

/* ───────────────────────────────────────────────────────────────────────────
   Delete customer
─────────────────────────────────────────────────────────────────────────── */
function deleteCustomerById(id) {
  if (!state.perms.delete) { toast('No delete permission', 'error'); return; }

  const c = custObj(id);
  if (!c) return;

  /* Block if customer has active cheques */
  const activeCheques = arr(state.data.customerCheques).filter(q =>
    q.customerId === id && (q.status === 'In Hand' || q.status === 'Issued')
  );
  if (activeCheques.length) {
    toast('Cannot delete — ' + activeCheques.length +
      ' active cheque(s). Clear or void them first.', 'error', 5000);
    return;
  }

  if (!confirm('Move "' + c.name + '" to Trash?\nTheir cheque history will stay intact.')) return;

  /* Soft delete: push to trash, remove from live list */
  const trashEntry = {
    id: uid(),
    collection: 'customers',
    item: JSON.parse(JSON.stringify(c)),
    label: c.name,
    deletedBy: state.user?.email || 'system',
    deletedAt: nowISO()
  };

  if (!Array.isArray(state.data.trash)) state.data.trash = [];
  state.data.trash.unshift(trashEntry);
  markDirty('trash', trashEntry.id);

  state.data.customers = state.data.customers.filter(x => x.id !== id);
  _dirty.add('customers:' + id);
  delete _snapshot['customers:' + id];
  state.sync.dirty = true;
  scheduleSync();

  closeModal();
  toast('Moved to Trash', 'success');
  renderApp();
}

/* ───────────────────────────────────────────────────────────────────────────
   Record version (simple — Phase 13 will expand this)
─────────────────────────────────────────────────────────────────────────── */
function recordVersion(collection, id, action, before, after) {
  if (!Array.isArray(state.data.versionHistory)) state.data.versionHistory = [];

  state.data.versionHistory.unshift({
    id: uid(),
    collection: collection,
    recordId: id,
    action: action,
    before: before,
    after: after,
    at: nowISO(),
    by: state.user?.email || 'system'
  });

  /* Cap at 3000 entries to keep Firestore doc sizes small */
  if (state.data.versionHistory.length > 3000) {
    state.data.versionHistory = state.data.versionHistory.slice(0, 3000);
  }
}

function customerBulkExport() {
  const ids = Array.from(document.querySelectorAll('.cust-check:checked')).map(c => c.dataset.bulkId);
  if (!ids.length) { toast('Nothing selected', 'warn'); return; }

  const rows = [['Name','Phone','Email','Business','Balance','Rating','Cheques','Bounced','Lifetime']];
  ids.forEach(id => {
    const c = custObj(id);
    if (!c) return;
    const r = computeCustomerRating(id);
    const summary = customerChequeSummary(id);
    rows.push([
      c.name,
      c.phone || '',
      c.email || '',
      c.business || '',
      customerBalance(id),
      r.label,
      summary.total.count,
      summary.bounced.count,
      r.totalCleared
    ]);
  });

  const csv = rows.map(r => r.map(csvEsc).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'customers_selected_' + today() + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Exported ' + ids.length + ' customers', 'success');
}

function customerBulkDelete() {
  if (!state.perms.delete) { toast('No delete permission', 'error'); return; }

  const ids = Array.from(document.querySelectorAll('.cust-check:checked')).map(c => c.dataset.bulkId);
  if (!ids.length) { toast('Nothing selected', 'warn'); return; }

  /* Check for active cheques */
  let blocked = 0;
  ids.forEach(id => {
    const active = arr(state.data.customerCheques).filter(q =>
      q.customerId === id && (q.status === 'In Hand' || q.status === 'Issued')
    );
    if (active.length) blocked++;
  });

  if (blocked > 0) {
    toast(blocked + ' customer(s) have active cheques — cannot delete', 'error', 5000);
    return;
  }

  if (!confirm('Move ' + ids.length + ' customer(s) to Trash?')) return;

  ids.forEach(id => {
    const c = custObj(id);
    if (!c) return;
    const trashEntry = {
      id: uid(),
      collection: 'customers',
      item: JSON.parse(JSON.stringify(c)),
      label: c.name,
      deletedBy: state.user?.email || 'system',
      deletedAt: nowISO()
    };
    state.data.trash.unshift(trashEntry);
    markDirty('trash', trashEntry.id);
    _dirty.add('customers:' + id);
    delete _snapshot['customers:' + id];
  });

  state.data.customers = state.data.customers.filter(c => !ids.includes(c.id));
  state.sync.dirty = true;
  scheduleSync();

  customerBulkClear();
  toast('Moved ' + ids.length + ' to Trash', 'success');
  renderApp();
}
