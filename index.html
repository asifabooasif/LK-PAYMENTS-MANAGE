    });

    document.querySelectorAll('[data-snooze-days]').forEach(el => {
      el.onclick = () => {
        const days = parseInt(el.dataset.snoozeDays, 10);
        setSnooze(c.id, shiftDate(today(), days));
        closeModal();
        toast('Snoozed for ' + days + ' day' + (days > 1 ? 's' : ''), 'info');
        renderApp();
      };
    });
  }
  window.openSnoozeDialog = openSnoozeDialog;

  /* ═══════════════════════════════════════════════════════════════════════
     9. CLEAR DIALOG — deduct Bank balance, remove from Floating
     ═══════════════════════════════════════════════════════════════════════ */
  function openClearDialog(id) {
    const c = chequeObj(id);
    if (!c) return;
    if (c.status !== 'approved') { toast('Only approved cheques can be cleared', 'error'); return; }

    const bal = bankBalances(c.bankId);
    const afterBank = bal.bank - num(c.amount);
    const afterFloating = bal.floating - num(c.amount);

    const body =
      '<div style="margin-bottom:14px">' +
        '<div style="font-size:18px;font-weight:600">Mark cheque #' + esc(c.chequeNo) + ' as cleared?</div>' +
        '<div class="muted small" style="margin-top:4px">Bank has confirmed the payment.</div>' +
      '</div>' +
      '<div class="balance-impact">' +
        '<div class="row">' +
          '<div class="label">Bank</div>' +
          '<div class="from">' + money(bal.bank) + '</div>' +
          '<div class="arrow">→</div>' +
          '<div class="to" style="color:' + (afterBank < 0 ? 'var(--red)' : 'var(--green)') + '">' + money(afterBank) + '</div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="label">Book</div>' +
          '<div class="from">' + money(bal.book) + '</div>' +
          '<div class="arrow">→</div>' +
          '<div class="to" style="color:var(--text-3)">' + money(bal.book) + ' <span class="small">(unchanged)</span></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="label">Floating</div>' +
          '<div class="from">' + money(bal.floating) + '</div>' +
          '<div class="arrow">→</div>' +
          '<div class="to" style="color:var(--amber)">' + money(afterFloating) + '</div>' +
        '</div>' +
      '</div>';

    openModal('✓ Mark as Cleared', body, {
      width: 620,
      footer:
        '<button class="btn" data-close-modal>Cancel</button>' +
        '<button class="btn green" id="clearConfirmBtn">Confirm Cleared</button>'
    });

    document.getElementById('clearConfirmBtn').onclick = () => {
      c.status = 'cleared';
      c.clearedAt = nowISO();
      c.updatedAt = nowISO();
      c.updatedBy = state.user?.email || 'system';
      markDirty('cheques', c.id);
      closeModal();
      toast('Marked cleared — bank balance updated', 'success');
      renderApp();
    };
  }
  window.openClearDialog = openClearDialog;

  /* ═══════════════════════════════════════════════════════════════════════
     10. BOUNCE / VOID DIALOG — 4 options
     ═══════════════════════════════════════════════════════════════════════ */
  function openBounceOrVoidDialog(id, mode) {
    const c = chequeObj(id);
    if (!c) return;
    const isBounce = mode === 'bounce';

    /* Both bounce and void apply to an approved or cleared cheque */
    if (c.status !== 'approved' && c.status !== 'cleared') {
      toast('Only approved or cleared cheques can be ' + (isBounce ? 'bounced' : 'voided'), 'error');
      return;
    }

    const body =
      '<div style="margin-bottom:14px">' +
        '<div style="font-size:18px;font-weight:600">' +
          (isBounce
            ? '⚠ Cheque #' + esc(c.chequeNo) + ' bounced at bank'
            : '⚠ Void cheque #' + esc(c.chequeNo)) +
        '</div>' +
        '<div class="muted small" style="margin-top:4px">' +
          money(c.amount) + ' — ' + esc(c.payeeName) + '</div>' +
      '</div>' +
      '<p style="margin-bottom:12px;color:var(--text-2)">How should the bank balance be handled?</p>' +
      '<div class="action-grid">' +
        '<div class="action-option" data-bounce-mode="credit_now">' +
          '<div class="opt-title">✓ Re-credit bank now</div>' +
          '<div class="opt-desc">Money returned. Bank balance increases by ' + money(c.amount) + ' immediately.</div>' +
        '</div>' +
        '<div class="action-option" data-bounce-mode="wait">' +
          '<div class="opt-title">⏳ Wait for bank confirmation</div>' +
          '<div class="opt-desc">Bank balance unchanged. Adjust manually once the credit appears on the statement.</div>' +
        '</div>' +
        '<div class="action-option" data-bounce-mode="reissue">' +
          '<div class="opt-title">🔁 Re-credit + Reissue</div>' +
          '<div class="opt-desc">Re-credit the bank, cancel this cheque, and create a new draft for reissue.</div>' +
        '</div>' +
        '<div class="action-option danger" data-bounce-mode="cancel">' +
          '<div class="opt-title">✗ Cancel</div>' +
          '<div class="opt-desc">Close without changing anything.</div>' +
        '</div>' +
      '</div>' +
      (isBounce
        ? '<div style="margin-top:14px">' +
          '<label class="field">Bounce reason (optional)' +
            '<input id="bncReason" placeholder="e.g. Insufficient funds, signature mismatch">' +
          '</label>' +
          '</div>'
        : '');

    openModal(isBounce ? '⚠ Bounce Cheque' : '⚠ Void Cheque', body, {
      width: 660,
      footer: '<button class="btn" data-close-modal>Close</button>'
    });

    document.querySelectorAll('[data-bounce-mode]').forEach(el => {
      el.onclick = () => {
        const m = el.dataset.bounceMode;
        if (m === 'cancel') { closeModal(); return; }

        const reason = isBounce
          ? (document.getElementById('bncReason')?.value.trim() || '')
          : 'Voided';

        /* Change status */
        c.status = isBounce ? 'bounced' : 'void';
        if (isBounce) {
          c.bouncedAt = nowISO();
          c.bounceReason = reason;
        } else {
          c.voidAt = nowISO();
          c.voidReason = reason;
        }
        c.updatedAt = nowISO();
        c.updatedBy = state.user?.email || 'system';

        /* Bank re-credit decision */
        if (m === 'credit_now' || m === 'reissue') {
          c.bankRecredited = true;
          c.bankRecreditedAt = nowISO();
          c.bankPendingRecredit = false;
        } else if (m === 'wait') {
          c.bankRecredited = false;
          c.bankPendingRecredit = true;
        }

        markDirty('cheques', c.id);

        /* Reissue: create new draft */
        if (m === 'reissue') {
          const newCheque = makeCheque({
            chequeNo: '',
            bankId: c.bankId,
            bookId: '',
            leafId: null,
            payeeId: c.payeeId,
            payeeType: c.payeeType,
            payeeName: c.payeeName,
            amount: c.amount,
            chequeDate: shiftDate(today(), 7),
            status: 'draft',
            memo: c.memo,
            notes: 'Reissued from #' + c.chequeNo,
            reissuedFromId: c.id
          });
          state.data.cheques.push(newCheque);
          markDirty('cheques', newCheque.id);
          c.reissuedChequeId = newCheque.id;
          markDirty('cheques', c.id);
        }

        closeModal();
        const msg =
          m === 'credit_now' ? (isBounce ? 'Bounced — bank re-credited' : 'Voided — bank re-credited') :
          m === 'wait'      ? 'Marked — bank adjustment pending' :
          m === 'reissue'   ? (isBounce ? 'Bounced + reissued' : 'Voided + reissued') :
                              'Done';
        toast(msg, 'success');
        renderApp();
      };
    });
  }
  window.openBounceOrVoidDialog = openBounceOrVoidDialog;

  /* ═══════════════════════════════════════════════════════════════════════
     11. DAILY DUE POPUP
     ═══════════════════════════════════════════════════════════════════════ */
  function showDailyDuePopup() {
    const list = chequesNeedingAttention();
    if (!list.length) return;

    const lastDate = (function () {
      try { return localStorage.getItem(CONFIG.popupKey); } catch (e) { return null; }
    })();
    const t = today();
    if (lastDate === t) return;

    const total = list.reduce((s, c) => s + num(c.amount), 0);

    const body =
      '<div style="margin-bottom:14px">' +
        '<div style="font-size:18px;font-weight:600">⏰ ' + list.length + ' cheque' +
          (list.length > 1 ? 's' : '') + ' awaiting approval</div>' +
        '<div class="muted small" style="margin-top:4px">Total: <strong>' + money(total) + '</strong></div>' +
      '</div>' +
      '<div class="table-wrap" style="max-height:320px;overflow:auto">' +
        '<table>' +
          '<thead><tr><th>Cheque #</th><th>Date</th><th>Payee</th><th class="num">Amount</th><th></th></tr></thead>' +
          '<tbody>' +
          list.map(c =>
            '<tr>' +
              '<td class="mono"><strong>' + esc(c.chequeNo) + '</strong></td>' +
              '<td>' + dateFmt(c.chequeDate) + '</td>' +
              '<td>' + esc(c.payeeName || '—') + '</td>' +
              '<td class="num"><strong>' + money(c.amount) + '</strong></td>' +
              '<td class="actions-cell">' +
                '<button class="btn xs primary" data-action="cheque-approve" data-id="' + esc(c.id) + '">Approve</button> ' +
                '<button class="btn xs" data-action="cheque-snooze" data-id="' + esc(c.id) + '">Snooze</button>' +
              '</td>' +
            '</tr>'
          ).join('') +
          '</tbody>' +
        '</table>' +
      '</div>';

    openModal('⏰ Cheques Due for Approval', body, {
      width: 720,
      footer:
        '<button class="btn" id="popupDismissBtn">Dismiss for today</button>' +
        '<button class="btn primary" data-action="open-approvals">Go to Approvals</button>'
    });

    try { localStorage.setItem(CONFIG.popupKey, t); } catch (e) {}

    document.getElementById('popupDismissBtn').onclick = () => closeModal();
  }
  window.showDailyDuePopup = showDailyDuePopup;

     ═══════════════════════════════════════════════════════════════════════ */

    return REGISTRY.routes.dashboard ? REGISTRY.routes.dashboard.fn : null;
  })();

    /* Use the patched version that uses chequesNeedingAttention() */
    const banks = arr(state.data.banks).filter(b => b.active !== false);

    const cheques = arr(state.data.cheques || []);
    const total = totalBankBalance();
    const need = chequesNeedingAttention();
    const totalDue = need.reduce((s, c) => s + num(c.amount), 0);

    books.forEach(b => {
      const s = bookLeavesSummary(b);
      totalLeaves += s.total;
      totalAvailable += s.available;

      .filter(c => c.status === 'scheduled' && c.chequeDate >= today())
      .sort((a, b) => a.chequeDate.localeCompare(b.chequeDate))

            '<div class="table-wrap"><table>' +

        : '') +

      '<div class="card">' +
        '<div class="card-head"><h3>📅 Upcoming (scheduled)</h3></div>' +
        (upcoming.length
          ? '<div class="table-wrap"><table>' +
              '<thead><tr><th>Date</th><th>Cheque #</th><th>Payee</th><th>Bank</th>' +
                '<th class="num">Amount</th><th>Status</th></tr></thead><tbody>' +
              upcoming.map(c =>
                '<tr data-action="cheque-open" data-id="' + esc(c.id) + '" style="cursor:pointer">' +
                  '<td>' + dateFmt(c.chequeDate) + '</td>' +
                  '<td class="mono"><strong>' + esc(c.chequeNo || '—') + '</strong></td>' +
                  '<td>' + esc(c.payeeName || '—') + '</td>' +
                  '<td>' + esc(bankName(c.bankId)) + '</td>' +
                  '<td class="num">' + money(c.amount) + '</td>' +
                  '<td>' + chequeStatusBadge(c.status) + '</td>' +
                '</tr>'
              ).join('') + '</tbody></table></div>'
          : '<div class="empty"><span class="big">📅</span>No scheduled cheques.</div>') +
      '</div>';
  }

  /* Replace the dashboard route */
  __LS_addRoute('dashboard', 'Dashboard', renderDashboardPatched);

  /* ═══════════════════════════════════════════════════════════════════════
     13. ACTION REGISTRATIONS — override S03 stubs
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_registerAction('cheque-approve', (ev, id) => {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    closeModal();
    setTimeout(() => openApproveDialog(id), 0);
  });
  __LS_registerAction('cheque-reject', (ev, id) => {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    closeModal();
    setTimeout(() => openRejectDialog(id), 0);
  });
  __LS_registerAction('cheque-snooze', (ev, id) => {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    closeModal();
    setTimeout(() => openSnoozeDialog(id), 0);
  });
  __LS_registerAction('cheque-clear', (ev, id) => {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    closeModal();
    setTimeout(() => openClearDialog(id), 0);
  });
  __LS_registerAction('cheque-bounce', (ev, id) => {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    closeModal();
    setTimeout(() => openBounceOrVoidDialog(id, 'bounce'), 0);
  });
  __LS_registerAction('cheque-void', (ev, id) => {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    closeModal();
    setTimeout(() => openBounceOrVoidDialog(id, 'void'), 0);
  });

  window.__lsS04Ready = true;

  /* ═══════════════════════════════════════════════════════════════════════
     14. ROUTE + NAV
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_addRoute('approvals', 'Approvals', renderApprovals);
  __LS_addNav({
    group: 'Cheques',
    id: 'approvals',
    ico: '⏰',
    label: 'Approvals',
    badgeFn: function () { return chequesNeedingAttention().length; }
  });

  /* ═══════════════════════════════════════════════════════════════════════
     15. INIT — auto-transition on boot, show popup after load
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_register('S04', function () {
    /* Run auto-transition on boot */
    try { autoTransitionStatuses(); } catch (e) { dbg.warn('autoTransition: ' + e.message); }

    /* Re-render so the new dashboard + approvals badge reflect */
    try { renderApp(); } catch (e) {}

    /* Show daily popup after a short delay */
    setTimeout(() => {
      try { showDailyDuePopup(); }
      catch (e) { dbg.warn('showDailyDuePopup: ' + e.message); }
    }, 600);

    /* Also re-check every 60 seconds in case user keeps the tab open past midnight */
    setInterval(() => {
      const n = autoTransitionStatuses();
      if (n) renderApp();
    }, 60 * 1000);

    scriptLoaded('S04');
  });

})();
</script>
<!-- ═══════════════════════════════════════════════════════════════════════
     S05 — BANK ADJUSTMENTS
     Drops in before </body>, after S04.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════════
     1. Register collection
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_addCollection('bankAdjustments');

  /* ═══════════════════════════════════════════════════════════════════════
     2. Adjustment type metadata
     ═══════════════════════════════════════════════════════════════════════ */
  const ADJUSTMENT_TYPES = {
    bank_charge:   { label: 'Bank Charge',   ico: '🏦', sign: -1, color: 'red'    },
    interest:      { label: 'Interest Credit', ico: '💵', sign: +1, color: 'green'  },
    correction:    { label: 'Correction',     ico: '🔧', sign:  0, color: 'amber'  },
    other:         { label: 'Other',          ico: '📌', sign:  0, color: 'gray'   }
  };
  window.ADJUSTMENT_TYPES = ADJUSTMENT_TYPES;

  function adjustmentBadge(type) {
    const meta = ADJUSTMENT_TYPES[type] || ADJUSTMENT_TYPES.other;
    return '<span class="badge ' + meta.color + '">' + meta.ico + ' ' + esc(meta.label) + '</span>';
  }
  window.adjustmentBadge = adjustmentBadge;

  /* ═══════════════════════════════════════════════════════════════════════
     3. Schema factory
     signedAmount: +credit / -debit. bankBalances() reads this directly.
     ═══════════════════════════════════════════════════════════════════════ */
  function makeBankAdjustment(seed) {
    seed = seed || {};
    const amount = num(seed.amount);
    const direction = seed.direction === 'credit' ? 'credit' : 'debit';
    const signedAmount = direction === 'credit' ? Math.abs(amount) : -Math.abs(amount);

    return {
      id: seed.id || uid(),
      bankId: seed.bankId || '',
      date: seed.date || today(),
      type: seed.type || 'correction',
      direction: direction,                 /* 'credit' | 'debit' */
      amount: Math.abs(amount),             /* always positive */
      signedAmount: signedAmount,           /* +credit / -debit */
      reason: String(seed.reason || ''),
      reference: String(seed.reference || ''),
      notes: String(seed.notes || ''),

      /* audit */
      createdAt: seed.createdAt || nowISO(),
      createdBy: seed.createdBy || (state.user?.email || 'system'),
      updatedAt: seed.updatedAt || nowISO(),
      updatedBy: seed.updatedBy || (state.user?.email || 'system')
    };
  }
  window.makeBankAdjustment = makeBankAdjustment;

  /* ═══════════════════════════════════════════════════════════════════════
     4. Lookup helpers
     ═══════════════════════════════════════════════════════════════════════ */
  const adjObj = (id) => arr(state.data.bankAdjustments).find(a => a.id === id) || null;
  window.adjObj = adjObj;

  function adjustmentsForBank(bankId) {
    return arr(state.data.bankAdjustments)
      .filter(a => a.bankId === bankId)
      .sort((a, b) => String(b.date).localeCompare(String(a.date)));
  }
  window.adjustmentsForBank = adjustmentsForBank;

  function adjustmentsNet(bankId) {
    return adjustmentsForBank(bankId)
      .reduce((s, a) => s + num(a.signedAmount !== undefined ? a.signedAmount : a.amount), 0);
  }
  window.adjustmentsNet = adjustmentsNet;

  /* ═══════════════════════════════════════════════════════════════════════
     5. ADJUSTMENTS PAGE
     ═══════════════════════════════════════════════════════════════════════ */
  function renderAdjustments() {
    const all = arr(state.data.bankAdjustments).slice();
    const filter = state.filters.adjustments || {};
    const bankId = filter.bankId || 'all';
    const type = filter.type || 'all';
    const from = filter.from || '';
    const to = filter.to || '';
    const q = (filter.q || '').toLowerCase();

    let list = all;
    if (bankId !== 'all') list = list.filter(a => a.bankId === bankId);
    if (type !== 'all') list = list.filter(a => a.type === type);
    if (from) list = list.filter(a => a.date >= from);
    if (to)   list = list.filter(a => a.date <= to);
    if (q) {
      list = list.filter(a =>
        (a.reason || '').toLowerCase().indexOf(q) !== -1 ||
        (a.reference || '').toLowerCase().indexOf(q) !== -1 ||
        (a.notes || '').toLowerCase().indexOf(q) !== -1
      );
    }
    list.sort((a, b) => {
      const d = String(b.date).localeCompare(String(a.date));
      if (d) return d;
      return String(b.createdAt).localeCompare(String(a.createdAt));
    });

    const totalCredit = list.filter(a => num(a.signedAmount) > 0)
      .reduce((s, a) => s + Math.abs(num(a.signedAmount)), 0);
    const totalDebit = list.filter(a => num(a.signedAmount) < 0)
      .reduce((s, a) => s + Math.abs(num(a.signedAmount)), 0);
    const net = totalCredit - totalDebit;

    return '' +
      '<div class="kpi-strip">' +
        '<div class="kpi">' +
          '<div class="k-label">Adjustments</div>' +
          '<div class="k-value">' + all.length + '</div>' +
          '<div class="k-sub">Total entries</div>' +
        '</div>' +
        '<div class="kpi">' +
          '<div class="k-label">Total Credits</div>' +
          '<div class="k-value" style="font-size:18px;color:var(--green)">' + money(totalCredit) + '</div>' +
          '<div class="k-sub">Money in</div>' +
        '</div>' +
        '<div class="kpi">' +
          '<div class="k-label">Total Debits</div>' +
          '<div class="k-value" style="font-size:18px;color:var(--red)">' + money(totalDebit) + '</div>' +
          '<div class="k-sub">Money out</div>' +
        '</div>' +
        '<div class="kpi">' +
          '<div class="k-label">Net Impact</div>' +
          '<div class="k-value" style="font-size:18px;color:' +
            (net >= 0 ? 'var(--green)' : 'var(--red)') + '">' +
            (net >= 0 ? '+' : '') + money(net) + '</div>' +
          '<div class="k-sub">On bank balances</div>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head">' +
          '<h3>🔧 Bank Adjustments (' + list.length + ')</h3>' +
          '<button class="btn primary" data-action="adj-new">＋ New Adjustment</button>' +
        '</div>' +
        '<div class="md-filter">' +
          '<label class="field">Search' +
            '<input type="search" id="adjSearch" value="' + esc(filter.q || '') + '" placeholder="Reason, reference, notes…">' +
          '</label>' +
          '<label class="field">Bank' +
            '<select id="adjBank">' +
              '<option value="all"' + (bankId === 'all' ? ' selected' : '') + '>All banks</option>' +
              arr(state.data.banks).map(b =>
                '<option value="' + esc(b.id) + '"' + (bankId === b.id ? ' selected' : '') + '>' + esc(b.name) + '</option>'
              ).join('') +
            '</select>' +
          '</label>' +
          '<label class="field">Type' +
            '<select id="adjType">' +
              '<option value="all"' + (type === 'all' ? ' selected' : '') + '>All types</option>' +
              Object.keys(ADJUSTMENT_TYPES).map(k =>
                '<option value="' + k + '"' + (type === k ? ' selected' : '') + '>' +
                  ADJUSTMENT_TYPES[k].ico + ' ' + esc(ADJUSTMENT_TYPES[k].label) +
                '</option>'
              ).join('') +
            '</select>' +
          '</label>' +
          '<div style="display:flex;gap:6px;align-items:end">' +
            '<label class="field" style="flex:1">From' +
              '<input type="date" id="adjFrom" value="' + esc(from) + '">' +
            '</label>' +
            '<label class="field" style="flex:1">To' +
              '<input type="date" id="adjTo" value="' + esc(to) + '">' +
            '</label>' +
          '</div>' +
        '</div>' +
        (list.length
          ? '<div class="table-wrap"><table>' +
              '<thead><tr>' +
                '<th>Date</th><th>Bank</th><th>Type</th><th>Reason</th>' +
                '<th>Reference</th><th class="num">Amount</th><th class="actions-cell"></th>' +
              '</tr></thead><tbody>' +
              list.map(a => {
                const signed = num(a.signedAmount);
                const amtCls = signed > 0 ? 'var(--green)' : (signed < 0 ? 'var(--red)' : 'var(--text-3)');
                const amtSign = signed > 0 ? '+' : (signed < 0 ? '−' : '');
                return '<tr>' +
                  '<td>' + dateFmt(a.date) + '</td>' +
                  '<td>' + esc(bankName(a.bankId)) + '</td>' +
                  '<td>' + adjustmentBadge(a.type) + '</td>' +
                  '<td><strong>' + esc(a.reason || '—') + '</strong>' +
                    (a.notes ? '<div class="small muted">' + esc(a.notes).slice(0, 50) + '</div>' : '') +
                  '</td>' +
                  '<td class="mono small">' + esc(a.reference || '—') + '</td>' +
                  '<td class="num" style="color:' + amtCls + ';font-weight:600">' +
                    amtSign + money(Math.abs(signed)) + '</td>' +
                  '<td class="actions-cell">' +
                    '<button class="btn xs" data-action="adj-edit" data-id="' + esc(a.id) + '">Edit</button>' +
                    (canDeleteAdjustment(a)
                      ? ' <button class="btn xs danger" data-action="adj-delete" data-id="' + esc(a.id) + '">🗑</button>'
                      : '') +
                  '</td>' +
                '</tr>';
              }).join('') +
            '</tbody>' +
            '<tfoot><tr>' +
              '<td colspan="5" style="text-align:right">NET IMPACT</td>' +
              '<td class="num" style="color:' + (net >= 0 ? 'var(--green)' : 'var(--red)') + '">' +
                (net >= 0 ? '+' : '') + money(net) + '</td>' +
              '<td></td>' +
            '</tr></tfoot></table></div>'
          : '<div class="empty"><span class="big">🔧</span>' +
            (all.length ? 'No adjustments match the filter.' : 'No adjustments yet. Click <strong>New Adjustment</strong>.') +
            '</div>') +
      '</div>';
  }
  window.renderAdjustments = renderAdjustments;

  /* ═══════════════════════════════════════════════════════════════════════
     6. Adjustments on BANK DETAIL — inline preview card
     Used by the Bank page (patched below).
     ═══════════════════════════════════════════════════════════════════════ */
  function adjustmentsSummaryRow(bankId) {
    const net = adjustmentsNet(bankId);
    const count = adjustmentsForBank(bankId).length;
    if (!count) return '';
    return '<div class="small muted" style="margin-top:4px">' +
      count + ' adj · net ' + (net >= 0 ? '+' : '−') + money(Math.abs(net)) +
      '</div>';
  }

  /* ═══════════════════════════════════════════════════════════════════════
     7. ADJUSTMENT FORM
     ═══════════════════════════════════════════════════════════════════════ */
  function openAdjustmentForm(id) {
    if (!state.perms.write) { toast('Read-only role — cannot edit', 'error'); return; }
    const a = id ? adjObj(id) : null;
    const banks = arr(state.data.banks).filter(b => b.active !== false);
    if (!banks.length) { toast('Add a bank first', 'warn'); return; }

    /* Default type = bank_charge with the settings default amount */
    const defaultType = a?.type || 'bank_charge';
    const defaultAmount = a
      ? num(a.amount).toFixed(2)
      : (defaultType === 'bank_charge'
          ? num(state.settings?.defaults?.bounceBankCharge).toFixed(2)
          : '0.00');

    const body =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
        selectField('Bank', 'adjBank', banks.map(b => ({ value: b.id, label: b.name })),
          a?.bankId || banks[0].id, { req: true }) +
        field('Date', 'adjDate', a?.date || today(), { type: 'date', req: true }) +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px">' +
        selectField('Type', 'adjType',
          Object.keys(ADJUSTMENT_TYPES).map(k => ({
            value: k,
            label: ADJUSTMENT_TYPES[k].ico + ' ' + ADJUSTMENT_TYPES[k].label
          })),
          defaultType, { req: true }) +
        selectField('Direction', 'adjDirection', [
          { value: 'debit',  label: '− Debit (money out)'  },
          { value: 'credit', label: '+ Credit (money in)'  }
        ], a?.direction || 'debit', { req: true }) +
        field('Amount', 'adjAmount', defaultAmount, { type: 'number', step: '0.01', min: 0, req: true }) +
      '</div>' +
      '<div style="margin-top:14px">' +
        field('Reason', 'adjReason', a?.reason || '', {
          req: true,
          placeholder: 'e.g. Monthly service charge, cheque bounce fee, interest credited'
        }) +
      '</div>' +
      '<div style="margin-top:14px">' +
        field('Reference', 'adjReference', a?.reference || '', {
          placeholder: 'Bank statement ref / transaction ID (optional)'
        }) +
      '</div>' +
      '<div style="margin-top:14px">' +
        field('Notes', 'adjNotes', a?.notes || '', { type: 'textarea' }) +
      '</div>' +
      '<div id="adjPreview" style="margin-top:16px;padding:12px 14px;background:var(--surface-2);border-radius:var(--r-md);font-size:12.5px"></div>' +

      (a
        ? '<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);' +
          'display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:12px;color:var(--text-3)">' +
            '<div><strong>Created:</strong> ' + dateTimeFmt(a.createdAt) + ' by ' + esc(a.createdBy || '—') + '</div>' +
            '<div><strong>Updated:</strong> ' + dateTimeFmt(a.updatedAt) + ' by ' + esc(a.updatedBy || '—') + '</div>' +
          '</div>'
        : '');

    openModal(a ? '✏️ Edit Adjustment' : '＋ New Bank Adjustment', body, {
      width: 720,
      footer:
        '<button class="btn" data-close-modal>Cancel</button>' +
        '<button class="btn primary" id="adjSaveBtn">' + (a ? 'Update' : 'Create') + '</button>'
    });

    /* Live preview of balance impact */
    function updatePreview() {
      const preview = document.getElementById('adjPreview');
      if (!preview) return;
      const bid = document.getElementById('adjBank').value;
      const dir = document.getElementById('adjDirection').value;
      const amt = num(document.getElementById('adjAmount').value);
      if (!bid || amt <= 0) { preview.innerHTML = 'Enter amount to see balance impact.'; return; }

      const bal = bankBalances(bid);
      const signed = dir === 'credit' ? amt : -amt;
      const afterBank = bal.bank + signed;
      const afterBook = bal.book + signed;

      preview.innerHTML =
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">' +
          '<div><div class="k-label">Bank now</div><strong>' + money(bal.bank) + '</strong></div>' +
          '<div><div class="k-label">After</div>' +
            '<strong style="color:' + (afterBank < 0 ? 'var(--red)' : 'var(--green)') + '">' + money(afterBank) + '</strong></div>' +
          '<div><div class="k-label">Book after</div>' +
            '<strong style="color:var(--accent)">' + money(afterBook) + '</strong></div>' +
        '</div>' +
        '<div class="small muted" style="margin-top:6px">' +
          (signed >= 0 ? '+' : '−') + money(Math.abs(signed)) + ' will ' +
          (signed >= 0 ? 'increase' : 'decrease') + ' this bank\'s balance.</div>';
    }

    ['adjBank', 'adjDirection', 'adjAmount'].forEach(idd => {
      const el = document.getElementById(idd);
      if (el) el.addEventListener('input', updatePreview);
    });
    updatePreview();

    /* Change type → auto-adjust direction */
    const typeSel = document.getElementById('adjType');
    typeSel.addEventListener('change', () => {
      const meta = ADJUSTMENT_TYPES[typeSel.value];
      if (meta && meta.sign === -1) document.getElementById('adjDirection').value = 'debit';
      if (meta && meta.sign === +1) document.getElementById('adjDirection').value = 'credit';
      const amtInput = document.getElementById('adjAmount');
      if (typeSel.value === 'bank_charge' && (!a || !num(a.amount))) {
        amtInput.value = num(state.settings?.defaults?.bounceBankCharge).toFixed(2);
      }
      updatePreview();
    });

    document.getElementById('adjSaveBtn').onclick = () => {
      const bankId = document.getElementById('adjBank').value;
      const date = document.getElementById('adjDate').value || today();
      const type = document.getElementById('adjType').value || 'correction';
      const direction = document.getElementById('adjDirection').value || 'debit';
      const amount = num(document.getElementById('adjAmount').value);
      const reason = document.getElementById('adjReason').value.trim();
      const reference = document.getElementById('adjReference').value.trim();
      const notes = document.getElementById('adjNotes').value.trim();

      if (!bankId) { toast('Bank is required', 'error'); return; }
      if (amount <= 0) { toast('Amount must be greater than zero', 'error'); return; }
      if (!reason) { toast('Reason is required', 'error'); return; }

      const data = {
        bankId, date, type, direction, amount, reason, reference, notes
      };

      if (a) {
        const before = JSON.parse(JSON.stringify(a));
        Object.assign(a, makeBankAdjustment(Object.assign({}, before, data, { id: a.id })));
        a.createdAt = before.createdAt;
        a.createdBy = before.createdBy;
        a.updatedAt = nowISO();
        a.updatedBy = state.user?.email || 'system';
        markDirty('bankAdjustments', a.id);
      } else {
        const created = makeBankAdjustment(data);
        state.data.bankAdjustments.push(created);
        markDirty('bankAdjustments', created.id);
      }

      closeModal();
      toast(a ? 'Adjustment updated' : 'Adjustment created', 'success');
      renderApp();
    };
  }
  window.openAdjustmentForm = openAdjustmentForm;

  /* ═══════════════════════════════════════════════════════════════════════
     8. PERMISSIONS — deletion guard
     ═══════════════════════════════════════════════════════════════════════ */
  function canDeleteAdjustment(a) {
    if (!state.perms.delete) return false;
    if (state.role === 'owner' || state.role === 'admin') return true;
    return (a.createdBy === (state.user?.email || ''));
  }
  window.canDeleteAdjustment = canDeleteAdjustment;

  function deleteAdjustmentById(id) {
    const a = adjObj(id);
    if (!a) return;
    if (!canDeleteAdjustment(a)) {
      toast('You can only delete adjustments you created', 'error');
      return;
    }
    if (!confirm('Delete this adjustment?\n\n' +
      adjustmentBadgeLabel(a) + ' — ' + money(a.amount) + '\nReason: ' + a.reason)) return;

    state.data.bankAdjustments = state.data.bankAdjustments.filter(x => x.id !== id);
    _dirty.add('bankAdjustments:' + id);
    delete _snapshot['bankAdjustments:' + id];
    scheduleSync();

    closeModal();
    toast('Adjustment deleted — bank balance updated', 'success');
    renderApp();
  }

  function adjustmentBadgeLabel(a) {
    const meta = ADJUSTMENT_TYPES[a.type] || ADJUSTMENT_TYPES.other;
    return meta.label;
  }

  /* ═══════════════════════════════════════════════════════════════════════
     9. ACTION REGISTRATIONS
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_registerAction('adj-new',    () => openAdjustmentForm(null));
  __LS_registerAction('adj-edit',   (ev, id) => { ev.stopPropagation(); openAdjustmentForm(id); });
  __LS_registerAction('adj-delete', (ev, id) => { ev.stopPropagation(); deleteAdjustmentById(id); });

  /* ═══════════════════════════════════════════════════════════════════════
     10. PATCH BANKS VIEW — show adjustments column + KPI
     ═══════════════════════════════════════════════════════════════════════ */
  const origRenderBanks = REGISTRY.routes.banks ? REGISTRY.routes.banks.fn : null;

  function renderBanksPatched() {
    const all = arr(state.data.banks).slice().sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    const filter = state.filters.banks || {};
    const q = (filter.q || '').toLowerCase();
    const status = filter.status || 'all';

          '</label>' +
          '<label class="field">Status' +
            '<select id="bankStatus">' +
              '<option value="all"' + (status === 'all' ? ' selected' : '') + '>All</option>' +
              '<option value="active"' + (status === 'active' ? ' selected' : '') + '>Active only</option>' +
              '<option value="inactive"' + (status === 'inactive' ? ' selected' : '') + '>Inactive only</option>' +
            '</select>' +
          '</label>' +
          '<div></div><div></div>' +
        '</div>' +
        (list.length
          ? '<div class="table-wrap"><table>' +
              '<thead><tr>' +
                '<th>Name</th><th>Bank</th><th>Account No</th>' +
                '<th class="num">Opening</th><th class="num">Bank</th>' +
                '<th class="num">Book</th><th class="num">Floating</th>' +
                '<th class="num">Adjustments</th>' +
                '<th>Status</th><th class="actions-cell"></th>' +
              '</tr></thead><tbody>' +
              list.map(b => {
                const bal = bankBalances(b.id);
                const net = adjustmentsNet(b.id);
                const count = adjustmentsForBank(b.id).length;
                return '<tr>' +
                  '<td><strong>' + esc(b.name) + '</strong>' +
                    adjustmentsSummaryRow(b.id) +
                  '</td>' +
                  '<td>' + esc(b.bankName || '—') + '</td>' +
                  '<td class="mono">' + esc(b.accountNo || '—') + '</td>' +
                  '<td class="num">' + money(b.openingBalance) + '</td>' +
                  '<td class="num" style="font-weight:600;' + (bal.bank < 0 ? 'color:var(--red)' : '') + '">' + money(bal.bank) + '</td>' +
                  '<td class="num" style="font-weight:600;color:var(--accent)">' + money(bal.book) + '</td>' +
                  '<td class="num" style="color:var(--amber)">' + (bal.floating > 0 ? money(bal.floating) : '—') + '</td>' +
                  '<td class="num" style="color:' +
                    (net > 0 ? 'var(--green)' : (net < 0 ? 'var(--red)' : 'var(--text-4)')) + '">' +
                    (count ? ((net >= 0 ? '+' : '−') + money(Math.abs(net))) : '—') +
                  '</td>' +
                  '<td>' + (b.active !== false
                    ? '<span class="badge green">Active</span>'
                    : '<span class="badge gray">Inactive</span>') + '</td>' +
                  '<td class="actions-cell">' +
                    '<button class="btn xs" data-action="bank-edit" data-id="' + esc(b.id) + '">Edit</button>' +
                    (state.perms.delete
                      ? ' <button class="btn xs danger" data-action="bank-delete" data-id="' + esc(b.id) + '">🗑</button>'
                      : '') +
                  '</td>' +
                '</tr>';
              }).join('') +
            '</tbody></table></div>'
          : '<div class="empty"><span class="big">🏦</span>' +
            (all.length ? 'No banks match.' : 'No banks yet.') +
            '</div>') +
      '</div>';
  }

  /* Replace route */
  __LS_addRoute('banks', 'Banks', renderBanksPatched);

  /* ═══════════════════════════════════════════════════════════════════════
     11. ROUTE + NAV
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_addRoute('adjustments', 'Bank Adjustments', renderAdjustments);
  __LS_addNav({
    group: 'Setup',
    id: 'adjustments',
    ico: '🔧',
    label: 'Bank Adjustments'
  });

  /* ═══════════════════════════════════════════════════════════════════════
     12. INIT
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_register('S05', function () {
    /* Patch bindView to add adjustment filters */
    const prevBind = window.bindView;
    window.bindView = function () {
      try { if (prevBind) prevBind(); }
      catch (e) { dbg.warn('bindView previous threw: ' + e.message); }

      const as = document.getElementById('adjSearch');
      if (as) as.oninput = () => {
        clearTimeout(as._t);
        as._t = setTimeout(() => {

          renderApp();

      };
      const ab = document.getElementById('adjBank');
      if (ab) ab.onchange = () => {
        state.filters.adjustments = Object.assign({}, state.filters.adjustments, { bankId: ab.value });
        renderApp();

      const at = document.getElementById('adjType');
      if (at) at.onchange = () => {
        state.filters.adjustments = Object.assign({}, state.filters.adjustments, { type: at.value });
        renderApp();
      };
      const af = document.getElementById('adjFrom');
      if (af) af.onchange = () => {
        state.filters.adjustments = Object.assign({}, state.filters.adjustments, { from: af.value });
        renderApp();
      };
      const att = document.getElementById('adjTo');
      if (att) att.onchange = () => {
        state.filters.adjustments = Object.assign({}, state.filters.adjustments, { to: att.value });
        renderApp();
      };
    };

    scriptLoaded('S05');
  });

})();

<!-- ═══════════════════════════════════════════════════════════════════════
     S06 — BANK STATEMENT IMPORT + RECONCILIATION
     Drops in before </body>, after S05.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════════════
     1. Register collections
     ═══════════════════════════════════════════════════════════════════════ */
  __LS_addCollection('bankTransactions');   /* parsed statement rows */
  __LS_addCollection('bankImports');        /* import batches */

  /* ═══════════════════════════════════════════════════════════════════════
     2. Bank presets — which columns the CSV is expected to have
     ═══════════════════════════════════════════════════════════════════════ */
  const BANK_PRESETS = {
    generic: {
      label: 'Generic (auto-detect)',
      hints: {
        date:    ['date', 'transaction date', 'txn date', 'value date', 'posted date'],
        desc:    ['description', 'narration', 'particulars', 'details', 'remarks', 'reference'],
        debit:   ['debit', 'withdrawal', 'withdrawals', 'dr', 'paid out'],
        credit:  ['credit', 'deposit', 'deposits', 'cr', 'paid in'],
        amount:  ['amount', 'transaction amount', 'value'],
        balance: ['balance', 'running balance', 'closing balance']
      }
    },
    sampath: {
      label: 'Sampath Bank',
      hints: {
        date:    ['date'],
        desc:    ['description'],
        debit:   ['debit'],
        credit:  ['credit'],
        balance: ['balance']
      }
    },
    commercial: {
      label: 'Commercial Bank',
      hints: {
        date:    ['date'],
        desc:    ['description', 'transaction details'],
        debit:   ['debit', 'withdrawals'],
        credit:  ['credit', 'deposits'],
        balance: ['balance']
      }
    },
    hnb: {
      label: 'Hatton National Bank (HNB)',
      hints: {
        date:    ['transaction date'],
        desc:    ['description', 'particulars'],
        debit:   ['debit'],
        credit:  ['credit'],
        balance: ['balance']
      }
    },
    boc: {
      label: 'Bank of Ceylon (BOC)',
      hints: {
        date:    ['date'],
        desc:    ['description', 'narration'],
        debit:   ['debit', 'withdrawal'],
        credit:  ['credit', 'deposit'],
        balance: ['balance']
      }
    },
    nsb: {
      label: 'National Savings Bank (NSB)',
      hints: {
        date:    ['date'],
        desc:    ['description', 'narration'],
        debit:   ['debit', 'withdrawals'],
        credit:  ['credit', 'deposits'],
        balance: ['balance']
      }
    },
    dfcc: {
      label: 'DFCC Bank',
      hints: {
        date:    ['date'],
        desc:    ['description', 'particulars'],
        debit:   ['debit'],
        credit:  ['credit'],
        balance: ['balance']
      }
    },
    seylan: {
      label: 'Seylan Bank',
      hints: {
        date:    ['date'],
        desc:    ['description', 'narration'],
        debit:   ['debit'],
        credit:  ['credit'],
        balance: ['balance']
      }
    },
    peoples: {
      label: "People's Bank",
      hints: {
        date:    ['date'],
        desc:    ['description', 'narration'],
        debit:   ['debit', 'withdrawals'],
        credit:  ['credit', 'deposits'],
        balance: ['balance']
      }
    }
  };
  window.BANK_PRESETS = BANK_PRESETS;

  /* ═══════════════════════════════════════════════════════════════════════
     3. Schema factories
     ═══════════════════════════════════════════════════════════════════════ */
  function makeBankTransaction(seed) {
    seed = seed || {};
    const amount = num(seed.amount);
    return {
      id: seed.id || uid(),
      importId: seed.importId || null,
      bankId: seed.bankId || '',
      date: seed.date || today(),
      description: String(seed.description || ''),
      reference: String(seed.reference || ''),
      amount: Math.abs(amount),
      direction: seed.direction === 'credit' ? 'credit' : 'debit',
      signedAmount: seed.direction === 'credit' ? Math.abs(amount) : -Math.abs(amount),
      balanceAfter: seed.balanceAfter !== undefined ? num(seed.balanceAfter) : null,

      /* matching state */
      matchState: seed.matchState || 'unmatched',   /* unmatched | matched | ignored */
      matchedType: seed.matchedType || null,        /* cheque | adjustment | manual */
      matchedId: seed.matchedId || null,
      matchedAt: seed.matchedAt || null,
      matchedBy: seed.matchedBy || null,

      /* dedupe hash — same bank + date + amount + short desc fingerprint */
      fingerprint: seed.fingerprint || '',

      createdAt: seed.createdAt || nowISO(),
      createdBy: seed.createdBy || (state.user?.email || 'system'),
      updatedAt: seed.updatedAt || nowISO(),
      updatedBy: seed.updatedBy || (state.user?.email || 'system')
    };
  }
  window.makeBankTransaction = makeBankTransaction;

  function makeBankImport(seed) {
    seed = seed || {};
    return {
      id: seed.id || uid(),
      bankId: seed.bankId || '',
      fileName: String(seed.fileName || ''),
      preset: seed.preset || 'generic',
      rowCount: num(seed.rowCount),
      matchedCount: num(seed.matchedCount),
      ignoredCount: num(seed.ignoredCount),
      unmatchedCount: num(seed.unmatchedCount),
      statementFrom: seed.statementFrom || null,
      statementTo: seed.statementTo || null,
      statementOpening: num(seed.statementOpening),
      statementClosing: num(seed.statementClosing),
      createdAt: seed.createdAt || nowISO(),
      createdBy: seed.createdBy || (state.user?.email || 'system'),
      updatedAt: seed.updatedAt || nowISO(),
      updatedBy: seed.updatedBy || (state.user?.email || 'system')
    };
  }
  window.makeBankImport = makeBankImport;

  /* ═══════════════════════════════════════════════════════════════════════
     4. Lookups
     ═══════════════════════════════════════════════════════════════════════ */
  const txObj = (id) => arr(state.data.bankTransactions).find(t => t.id === id) || null;
  window.txObj = txObj;

  function transactionsForBank(bankId, opts) {
    opts = opts || {};
    let list = arr(state.data.bankTransactions).filter(t => t.bankId === bankId);
    if (opts.state) list = list.filter(t => t.matchState === opts.state);
    return list.sort((a, b) => String(b.date).localeCompare(String(a.date)));
  }
  window.transactionsForBank = transactionsForBank;

  function importsForBank(bankId) {
    return arr(state.data.bankImports)
      .filter(i => i.bankId === bankId)
      .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  }
  window.importsForBank = importsForBank;

  /* ═══════════════════════════════════════════════════════════════════════
     5. CSV PARSING — robust enough for quoted fields, CRLF, BOM
     ═══════════════════════════════════════════════════════════════════════ */
  function parseCSV(text) {
    /* Strip UTF-8 BOM */
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;
    let i = 0;

    while (i < text.length) {
      const ch = text[i];

      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += ch; i++; continue;
      }

      if (ch === '"') { inQuotes = true; i++; continue; }
      if (ch === ',') { row.push(field); field = ''; i++; continue; }
      if (ch === '\r') { i++; continue; }
      if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }

      field += ch; i++;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.length && r.some(c => String(c).trim() !== ''));
  }
  window.parseCSV = parseCSV;

  /* ═══════════════════════════════════════════════════════════════════════
     6. DATE PARSING — understands many formats
     ═══════════════════════════════════════════════════════════════════════ */
  function parseDateAny(v) {
    if (!v) return null;
    const s = String(v).trim();

    /* ISO YYYY-MM-DD or YYYY/MM/DD */
    let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if (m) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);

    /* DD/MM/YYYY or DD-MM-YYYY or D/M/YY */
    m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
    if (m) {
      let d = pad2(m[1]), mo = pad2(m[2]), y = m[3];
      if (y.length === 2) y = (parseInt(y, 10) > 50 ? '19' : '20') + y;
      return y + '-' + mo + '-' + d;
    }

    /* DD-MMM-YYYY or DD MMM YYYY (Jan, Feb, …) */
    m = s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3,})[\s\-](\d{2,4})/);
    if (m) {
      const monthIdx = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec']
        .indexOf(m[2].toLowerCase().slice(0, 3));
      if (monthIdx >= 0) {
        let y = m[3];
        if (y.length === 2) y = (parseInt(y, 10) > 50 ? '19' : '20') + y;
        return y + '-' + pad2(monthIdx + 1) + '-' + pad2(m[1]);
      }
    }

    /* Fallback: native Date */
    const d = new Date(s);
    if (!isNaN(d.getTime())) {
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    }
    return null;
  }
  function pad2(x) { return String(x).padStart(2, '0'); }
  window.parseDateAny = parseDateAny;

  /* ═══════════════════════════════════════════════════════════════════════
     7. NUMBER PARSING — handles commas, spaces, parentheses for negatives
     ═══════════════════════════════════════════════════════════════════════ */
  function parseAmountAny(v) {
    if (v === null || v === undefined) return 0;
    let s = String(v).trim();
    if (!s) return 0;
    let negative = false;
    if (/^\(.*\)$/.test(s)) { negative = true; s = s.slice(1, -1); }
    if (s.indexOf('-') === 0) { negative = true; s = s.slice(1); }
    s = s.replace(/[^0-9.]/g, '');
    if (!s) return 0;
    const n = parseFloat(s);
    if (!Number.isFinite(n)) return 0;
    return negative ? -n : n;
  }
  window.parseAmountAny = parseAmountAny;

  /* ═══════════════════════════════════════════════════════════════════════
     8. COLUMN AUTO-DETECT
     ═══════════════════════════════════════════════════════════════════════ */
  function autoDetectColumns(headerRow, preset) {
    const h = arr(headerRow).map(c => String(c || '').trim().toLowerCase());
    const hints = BANK_PRESETS[preset]?.hints || BANK_PRESETS.generic.hints;
    const found = { date: -1, desc: -1, debit: -1, credit: -1, amount: -1, balance: -1 };

    Object.keys(hints).forEach(key => {
      const list = hints[key] || [];
      for (let i = 0; i < h.length; i++) {
        const cell = h[i];
        if (list.some(k => cell.indexOf(k) !== -1)) {
          if (found[key] === -1) found[key] = i;
          break;
        }
      }
    });

    /* Heuristic fallbacks if hints didn't catch anything */
    if (found.date === -1) {
      for (let i = 0; i < h.length; i++) {
        if (/\bdate\b/.test(h[i])) { found.date = i; break; }
      }
    }
    if (found.desc === -1) {
      for (let i = 0; i < h.length; i++) {
        if (/\b(desc|narr|detail|particular|remark)\b/.test(h[i])) { found.desc = i; break; }
      }
    }
    if (found.debit === -1) {
      for (let i = 0; i < h.length; i++) {
        if (/\b(debit|withdraw|dr|out)\b/.test(h[i])) { found.debit = i; break; }
      }
    }
    if (found.credit === -1) {
      for (let i = 0; i < h.length; i++) {
        if (/\b(credit|deposit|cr|in)\b/.test(h[i])) { found.credit = i; break; }
      }
    }
    if (found.amount === -1) {
      for (let i = 0; i < h.length; i++) {
        if (/\bamount\b/.test(h[i])) { found.amount = i; break; }
      }
    }
    if (found.balance === -1) {
      for (let i = 0; i < h.length; i++) {
        if (/balance/.test(h[i])) { found.balance = i; break; }
      }
    }

    return found;
  }
  window.autoDetectColumns = autoDetectColumns;

  /* ═══════════════════════════════════════════════════════════════════════
     9. FINGERPRINT — dedupe on re-import
     ═══════════════════════════════════════════════════════════════════════ */
  function fingerprint(bankId, date, amount, desc) {
    const d = (desc || '').toLowerCase().replace(/\s+/g, ' ').slice(0, 32);
    return [bankId, date, amount.toFixed(2), d].join('|');
  }
  window.statementFingerprint = fingerprint;

  /* ═══════════════════════════════════════════════════════════════════════
     10. AUTO-MATCH ENGINE
     Scores candidate cheques + adjustments for a given bank transaction.
     ═══════════════════════════════════════════════════════════════════════ */
  function findMatchCandidates(tx) {
    const candidates = [];
    const bankId = tx.bankId;
    const amount = Math.abs(num(tx.amount));
    const txDate = tx.date;

    /* Match against cheques (approved / cleared) that are on this bank */
    arr(state.data.cheques)
      .filter(c => c.bankId === bankId)
      .filter(c => c.status === 'approved' || c.status === 'cleared')
      .forEach(c => {
        const cAmt = num(c.amount);
        if (Math.abs(cAmt - amount) > 0.01) return;   /* amount must match */

        const dateDiff = Math.abs(diffDays(c.chequeDate, txDate));

        /* Score */
        let score = 100;
        score -= dateDiff * 5;                        /* day gap penalty */
        if (c.chequeNo && tx.description &&
            tx.description.indexOf(c.chequeNo) !== -1) score += 40;
        if (c.payeeName && tx.description &&
            tx.description.toLowerCase().indexOf(c.payeeName.toLowerCase()) !== -1) score += 30;

        candidates.push({
          kind: 'cheque',
          id: c.id,
          label: 'Cheque #' + c.chequeNo + ' — ' + c.payeeName,
          amount: cAmt,
          date: c.chequeDate,
          score: Math.max(0, score),
          status: c.status
        });
      });

    /* Match against adjustments */
    arr(state.data.bankAdjustments)
      .filter(a => a.bankId === bankId)
      .forEach(a => {
        const aAmt = Math.abs(num(a.amount));
        if (Math.abs(aAmt - amount) > 0.01) return;

        /* Direction must match */
        const aSign = num(a.signedAmount) >= 0 ? 'credit' : 'debit';
        if (aSign !== tx.direction) return;

        const dateDiff = Math.abs(diffDays(a.date, txDate));
        let score = 100 - dateDiff * 5;
        if (a.reason && tx.description &&
            tx.description.toLowerCase().indexOf(a.reason.toLowerCase()) !== -1) score += 40;

        candidates.push({
          kind: 'adjustment',
          id: a.id,
          label: 'Adjustment — ' + a.reason,
          amount: aAmt,
          date: a.date,
          score: Math.max(0, score),
          status: a.type
        });
      });

    candidates.sort((a, b) => b.score - a.score);
    return candidates;
  }
  window.findMatchCandidates = findMatchCandidates;

  function autoMatchAll(bankId) {
    const list = arr(state.data.bankTransactions)
      .filter(t => t.bankId === bankId && t.matchState === 'unmatched');

    let matched = 0;
    list.forEach(tx => {
      const candidates = findMatchCandidates(tx);
      const best = candidates[0];
      /* Require a strong match: score >= 90 AND next candidate is at least 20 pts lower */
      if (best && best.score >= 90 && (!candidates[1] || best.score - candidates[1].score >= 20)) {
        tx.matchState = 'matched';
        tx.matchedType = best.kind;
        tx.matchedId = best.id;
        tx.matchedAt = nowISO();
        tx.matchedBy = state.user?.email || 'system';
        tx.updatedAt = nowISO();
        markDirty('bankTransactions', tx.id);
        matched++;
      }
    });

    if (matched) dbg.ok('Auto-matched ' + matched + ' transaction(s)');
    return matched;
  }
  window.autoMatchAll = autoMatchAll;

  /* ═══════════════════════════════════════════════════════════════════════
     11. STATEMENT IMPORT FLOW
     ═══════════════════════════════════════════════════════════════════════ */
  function openImportDialog(bankId) {
    if (!state.perms.write) { toast('Read-only role', 'error'); return; }
    const banks = arr(state.data.banks).filter(b => b.active !== false);
    if (!banks.length) { toast('Add a bank first', 'warn'); return; }

    const body =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">' +
        selectField('Bank', 'impBank', banks.map(b => ({ value: b.id, label: b.name })),
          bankId || banks[0].id, { req: true }) +
        selectField('Preset', 'impPreset',
          Object.keys(BANK_PRESETS).map(k => ({ value: k, label: BANK_PRESETS[k].label })),
          'generic', { req: true }) +
      '</div>' +
      '<div style="margin-bottom:14px">' +
        '<label class="field">CSV File' +
          '<input type="file" id="impFile" accept=".csv,text/csv">' +
        '</label>' +
        '<div class="small muted" style="margin-top:6px">' +
          'Columns are auto-detected. Supported: date, description, debit, credit, amount, balance.' +
        '</div>' +
      '</div>' +
      '<div id="impPreview" style="display:none"></div>';

    openModal('📥 Import Bank Statement', body, {
      width: 900,
      footer:
        '<button class="btn" data-close-modal>Cancel</button>' +
        '<button class="btn primary" id="impConfirmBtn" disabled>Import</button>'
    });

    let parsed = null;

    const fileEl = document.getElementById('impFile');
    fileEl.onchange = () => {
      const file = fileEl.files && fileEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || '');
        const rows = parseCSV(text);
        if (rows.length < 2) {
          toast('CSV has no data rows', 'error');
          return;
        }
        const header = rows[0];
        const preset = document.getElementById('impPreset').value;
        const cols = autoDetectColumns(header, preset);

        const dataRows = rows.slice(1);
        const parsedRows = [];
        const missing = [];

        dataRows.forEach((r, i) => {
          const dateRaw = cols.date >= 0 ? r[cols.date] : '';
          const date = parseDateAny(dateRaw);
          if (!date) { missing.push(i + 2); return; }

          const desc = cols.desc >= 0 ? String(r[cols.desc] || '').trim() : '';
          const bal  = cols.balance >= 0 ? parseAmountAny(r[cols.balance]) : null;

          let amt = 0;
          let dir = 'debit';

          if (cols.debit >= 0 && cols.credit >= 0) {
            const d = parseAmountAny(r[cols.debit]);
            const c = parseAmountAny(r[cols.credit]);
            if (c > 0 && d === 0) { amt = c; dir = 'credit'; }
            else if (d > 0 && c === 0) { amt = d; dir = 'debit'; }
            else if (d > 0 && c > 0) { amt = d + c; dir = 'debit'; }   /* weird row */
            else if (d < 0 && c === 0) { amt = Math.abs(d); dir = 'debit'; }
            else if (c < 0 && d === 0) { amt = Math.abs(c); dir = 'credit'; }
            else { missing.push(i + 2); return; }
          } else if (cols.amount >= 0) {
            const v = parseAmountAny(r[cols.amount]);
            if (v === 0) { missing.push(i + 2); return; }
            amt = Math.abs(v);
            dir = v < 0 ? 'debit' : 'credit';
          } else {
            missing.push(i + 2); return;
          }

          if (amt <= 0) { missing.push(i + 2); return; }

          parsedRows.push({
            date: date,
            description: desc,
            amount: amt,
            direction: dir,
            balanceAfter: bal
          });
        });

        if (!parsedRows.length) {
          toast('No valid rows found. Check the columns.', 'error');
          return;
        }

        parsed = { rows: parsedRows, cols, fileName: file.name, preset };

        /* Preview */
        const preview = document.getElementById('impPreview');
        preview.style.display = '';
        preview.innerHTML =
          '<div class="card" style="margin:0;background:var(--surface-2);border:none">' +
            '<div class="card-head" style="margin-bottom:10px">' +
              '<h3 style="font-size:14px">Preview (' + parsedRows.length + ' rows)</h3>' +
              '<span class="small muted">Detected: ' +
                'date=' + (cols.date >= 0 ? header[cols.date] : '—') + ', ' +
                'desc=' + (cols.desc >= 0 ? header[cols.desc] : '—') + ', ' +
                (cols.debit >= 0 && cols.credit >= 0
                  ? 'debit=' + header[cols.debit] + ', credit=' + header[cols.credit]
                  : 'amount=' + (cols.amount >= 0 ? header[cols.amount] : '—')) +
                (cols.balance >= 0 ? ', balance=' + header[cols.balance] : '') +
              '</span>' +
            '</div>' +
            '<div class="table-wrap" style="max-height:280px;overflow:auto">' +
              '<table style="font-size:12px">' +
                '<thead><tr>' +
                  '<th>Date</th><th>Description</th>' +
                  '<th class="num">Debit</th><th class="num">Credit</th>' +
                  '<th class="num">Balance</th>' +
                '</tr></thead><tbody>' +
                parsedRows.slice(0, 50).map(r =>
                  '<tr>' +
                    '<td>' + dateFmt(r.date) + '</td>' +
                    '<td>' + esc(r.description.slice(0, 60)) + '</td>' +
                    '<td class="num" style="color:var(--red)">' +
                      (r.direction === 'debit' ? money(r.amount) : '') + '</td>' +
                    '<td class="num" style="color:var(--green)">' +
                      (r.direction === 'credit' ? money(r.amount) : '') + '</td>' +
                    '<td class="num">' +
                      (r.balanceAfter !== null ? money(r.balanceAfter) : '') + '</td>' +
                  '</tr>'
                ).join('') +
                (parsedRows.length > 50
                  ? '<tr><td colspan="5" class="muted small">' +
                    '… and ' + (parsedRows.length - 50) + ' more rows</td></tr>'
                  : '') +
              '</tbody></table>' +
            '</div>' +
            (missing.length
              ? '<div class="small muted" style="margin-top:8px">' +
                '⚠ Skipped ' + missing.length + ' row(s) with unparseable date or amount.</div>'
              : '') +
          '</div>';

        document.getElementById('impConfirmBtn').disabled = false;
      };
      reader.readAsText(file);
    };

    document.getElementById('impConfirmBtn').onclick = () => {
      if (!parsed) return;
      commitImport(bankId || document.getElementById('impBank').value, parsed);
    };
  }
  window.openImportDialog = openImportDialog;

  function commitImport(bankId, parsed) {
    const rows = parsed.rows;
    const ids = [];

    /* Create import batch first */
    const dates = rows.map(r => r.date).sort();
    const statementFrom = dates[0];
    const statementTo = dates[dates.length - 1];
    const opening = rows[0]?.balanceAfter !== null && rows[0]?.balanceAfter !== undefined
      ? rows[0].balanceAfter + (rows[0].direction === 'credit' ? -rows[0].amount : rows[0].amount)
      : 0;
    const closing = rows[rows.length - 1]?.balanceAfter || null;

    const batch = makeBankImport({
      bankId: bankId,
      fileName: parsed.fileName,
      preset: parsed.preset,
      rowCount: rows.length,
      statementFrom: statementFrom,
      statementTo: statementTo,
      statementOpening: opening,
      statementClosing: closing || 0
    });
    state.data.bankImports.push(batch);
    markDirty('bankImports', batch.id);

    /* Existing fingerprints to avoid dupes */
    const existingFps = new Set(
      arr(state.data.bankTransactions).map(t => t.fingerprint).filter(Boolean)
    );

    let inserted = 0, skipped = 0;

    rows.forEach(r => {
      const fp = fingerprint(bankId, r.date, r.amount, r.description);
      if (existingFps.has(fp)) { skipped++; return; }
      existingFps.add(fp);

      const tx = makeBankTransaction({
        importId: batch.id,
        bankId: bankId,
        date: r.date,
        description: r.description,
        amount: r.amount,
        direction: r.direction,
        balanceAfter: r.balanceAfter,
        fingerprint: fp
      });
      state.data.bankTransactions.push(tx);
      markDirty('bankTransactions', tx.id);
      ids.push(tx.id);
      inserted++;
    });

    /* Auto-match what we can */
    const matched = autoMatchAll(bankId);

    /* Update batch counters */
    batch.matchedCount = matched;
    batch.unmatchedCount = inserted - matched;
    batch.updatedAt = nowISO();
    markDirty('bankImports', batch.id);

    closeModal();
    toast(
      'Imported ' + inserted + ' row' + (inserted !== 1 ? 's' : '') +
      (skipped ? ' (' + skipped + ' duplicate skipped)' : '') +
      (matched ? ' · ' + matched + ' auto-matched' : ''),
      'success',
      5000
    );
    renderApp();
  }

  /* ═══════════════════════════════════════════════════════════════════════
     13. BANK-DETAIL RECONCILIATION VIEW
     ═══════════════════════════════════════════════════════════════════════ */
  function renderBankReconcile(bankId) {
    const bank = bankObj(bankId);
    if (!bank) return '<div class="empty">Bank not found.</div>';

    const filter = state.filters.reconcile || {};
    const stateFilter = filter.state || 'unmatched';
    const q = (filter.q || '').toLowerCase();

    let list = transactionsForBank(bankId, {
      state: stateFilter === 'all' ? null : stateFilter
    });
    if (q) {
      list = list.filter(t =>
        (t.description || '').toLowerCase().indexOf(q) !== -1 ||
        (t.reference || '').toLowerCase().indexOf(q) !== -1
      );
    }

    const bal = bankBalances(bankId);
    const stmtClosing = (function () {
      const last = arr(state.data.bankTransactions)
        .filter(t => t.bankId === bankId && t.balanceAfter !== null)
        .sort((a, b) => String(b.date).localeCompare(String(a.date)))[0];
      return last ? last.balanceAfter : null;
    })();
    const diff = stmtClosing !== null ? (bal.bank - stmtClosing) : 0;

    return '' +
      '<div class="card">' +
        '<div class="card-head">' +
          '<h3>🏦 ' + esc(bank.name) + ' — Reconciliation</h3>' +
          '<div style="display:flex;gap:6px">' +
            '<button class="btn" data-nav="reconciliation">← Back</button>' +
            '<button class="btn primary" data-action="import-open" data-id="' + esc(bankId) + '">📥 Import Statement</button>' +
            '<button class="btn primary" data-action="auto-match-bank" data-id="' + esc(bankId) + '">⚡ Auto-match</button>' +
          '</div>' +
        '</div>' +

        '<div class="kpi-strip">' +
          '<div class="kpi">' +
            '<div class="k-label">System Bank Balance</div>' +
            '<div class="k-value" style="font-size:18px">' + money(bal.bank) + '</div>' +
          '</div>' +
          '<div class="kpi">' +
            '<div class="k-label">Statement Closing</div>' +
            '<div class="k-value" style="font-size:18px">' +
              (stmtClosing !== null ? money(stmtClosing) : '—') + '</div>' +
          '</div>' +
          '<div class="kpi ' + (stmtClosing !== null && Math.abs(diff) > 0.01 ? 'danger' : '') + '">' +
            '<div class="k-label">Difference</div>' +
            '<div class="k-value" style="font-size:18px;color:' +
              (stmtClosing === null ? 'var(--text-4)' : (Math.abs(diff) <= 0.01 ? 'var(--green)' : 'var(--red)')) + '">' +
              (stmtClosing === null ? '—' : (diff >= 0 ? '+' : '−') + money(Math.abs(diff))) +
            '</div>' +
            '<div class="k-sub">' +
              (stmtClosing === null ? 'Import statement first' :
                (Math.abs(diff) <= 0.01 ? '✓ Reconciled' : 'Investigate')) +
            '</div>' +
          '</div>' +
          '<div class="kpi">' +
            '<div class="k-label">Floating</div>' +
            '<div class="k-value" style="font-size:18px;color:var(--amber)">' + money(bal.floating) + '</div>' +
          '</div>' +
        '</div>' +

        '<div class="md-filter">' +
          '<label class="field">Search' +
            '<input type="search" id="recSearch" value="' + esc(filter.q || '') + '" placeholder="Description…">' +
          '</label>' +
          '<label class="field">State' +
            '<select id="recState">' +
              '<option value="unmatched"' + (stateFilter === 'unmatched' ? ' selected' : '') + '>Unmatched</option>' +
              '<option value="matched"' + (stateFilter === 'matched' ? ' selected' : '') + '>Matched</option>' +
              '<option value="ignored"' + (stateFilter === 'ignored' ? ' selected' : '') + '>Ignored</option>' +
              '<option value="all"' + (stateFilter === 'all' ? ' selected' : '') + '>All</option>' +
            '</select>' +
          '</label>' +
          '<div></div><div></div>' +
        '</div>' +

        (list.length
          ? '<div class="table-wrap"><table>' +
              '<thead><tr>' +
                '<th>Date</th><th>Description</th><th class="num">Debit</th>' +
                '<th class="num">Credit</th><th>State</th><th>Match</th>' +
                '<th class="actions-cell"></th>' +
              '</tr></thead><tbody>' +
              list.map(t =>
                '<tr>' +
                  '<td>' + dateFmt(t.date) + '</td>' +
                  '<td>' + esc(t.description || '—') + '</td>' +
                  '<td class="num" style="color:var(--red)">' +
                    (t.direction === 'debit' ? money(t.amount) : '') + '</td>' +
                  '<td class="num" style="color:var(--green)">' +
                    (t.direction === 'credit' ? money(t.amount) : '') + '</td>' +
                  '<td>' + matchStateBadge(t.matchState) + '</td>' +
                  '<td class="small">' + renderMatchLabel(t) + '</td>' +
                  '<td class="actions-cell">' +
                    (t.matchState === 'unmatched'
                      ? '<button class="btn xs primary" data-action="tx-match" data-id="' + esc(t.id) + '">Match</button> '
                      : '') +
                    (t.matchState === 'matched'
                      ? '<button class="btn xs" data-action="tx-unmatch" data-id="' + esc(t.id) + '">Unmatch</button> '
                      : '') +
                    (t.matchState === 'ignored'
                      ? '<button class="btn xs" data-action="tx-restore" data-id="' + esc(t.id) + '">Restore</button> '
                      : '') +
                    (t.matchState === 'unmatched'
                      ? '<button class="btn xs" data-action="tx-ignore" data-id="' + esc(t.id) + '">Ignore</button> '
                      : '') +
                    (state.perms.delete
                      ? '<button class="btn xs danger" data-action="tx-delete" data-id="' + esc(t.id) + '">🗑</button>'
                      : '') +
                  '</td>' +
                '</tr>'
              ).join('') +
            '</tbody></table></div>'
          : '<div class="empty">No ' + stateFilter + ' transactions.</div>') +
      '</div>';

  window.renderBankReconcile = renderBankReconcile;

  function matchStateBadge(s) {
    if (s === 'matched')   return '<span class="badge green">Matched</span>';
    if (s === 'unmatched') return '<span class="badge amber">Unmatched</span>';
    if (s === 'ignored')   return '<span class="badge gray">Ignored</span>';
    return '<span class="badge gray">' + esc(s) + '</span>';
  }

  function renderMatchLabel(t) {
    if (t.matchState !== 'matched') return '—';
    if (t.matchedType === 'cheque') {
      const c = chequeObj(t.matchedId);
      return c ? '→ Cheque #' + esc(c.chequeNo) + ' (' + esc(c.payeeName) + ')' : '— (missing)';
    }
    if (t.matchedType === 'adjustment') {
      const a = adjObj(t.matchedId);
      return a ? '→ Adj: ' + esc(a.reason) : '— (missing)';
    }
    return '→ ' + esc(t.matchedType);
  }

  function openMatchPicker(txId) {
    const tx = txObj(txId);
    if (!tx) return;
    if (!state.perms.write) { toast('Read-only role', 'error'); return; }

    const candidates = findMatchCandidates(tx);

    const body =
      '<div style="margin-bottom:14px">' +
        '<div style="font-size:16px;font-weight:600">' +
          (tx.direction === 'credit' ? '+' : '−') + money(tx.amount) +
        '</div>' +
        '<div class="muted small">' + dateFmt(tx.date) + ' · ' + esc(tx.description || '—') + '</div>' +
      '</div>' +

      (candidates.length
        ? '<p style="margin-bottom:10px;color:var(--text-2);font-size:12.5px">' +
          'Top matches (highest score first):</p>' +
          '<div style="display:flex;flex-direction:column;gap:8px">' +
          candidates.slice(0, 10).map(c =>
            '<div class="action-option" data-match-kind="' + esc(c.kind) + '" data-match-id="' + esc(c.id) + '">' +
              '<div class="opt-title">' +
                (c.kind === 'cheque' ? '📝 ' : '🔧 ') + esc(c.label) +
                '<span class="badge ' + (c.score >= 90 ? 'green' : c.score >= 60 ? 'amber' : 'gray') + '" ' +
                  'style="margin-left:8px">Score ' + c.score + '</span>' +
              '</div>' +
              '<div class="opt-desc">' +
                money(c.amount) + ' · ' + dateFmt(c.date) +
                (c.status ? ' · ' + esc(c.status) : '') +
              '</div>' +
            '</div>'
          ).join('') +
          '</div>'
        : '<div class="empty">' +
          '<span class="big">🔍</span>' +
          'No candidates found — no cheque or adjustment for ' + money(tx.amount) +
          ' on ' + dateFmt(tx.date) + '. You can create a matching adjustment first.' +
          '</div>');

    openModal('🔗 Match Transaction', body, {
      width: 660,
      footer: '<button class="btn" data-close-modal>Close</button>'
    });

    document.querySelectorAll('[data-match-kind]').forEach(el => {
      el.onclick = () => {
        const kind = el.dataset.matchKind;
        const mid = el.dataset.matchId;
        tx.matchState = 'matched';
        tx.matchedType = kind;
        tx.matchedId = mid;
        tx.matchedAt = nowISO();
        tx.matchedBy = state.user?.email || 'system';
        tx.updatedAt = nowISO();
        markDirty('bankTransactions', tx.id);
        closeModal();
        toast('Matched', 'success');
        renderApp();
      };
    });
  }
  window.openMatchPicker = openMatchPicker;

  /* ═══════════════════════════════════════════════════════════════════════

     ═══════════════════════════════════════════════════════════════════════ */

    if (!imp) return;

    const rows = arr(state.data.bankTransactions).filter(t => t.importId === impId);

    const body =
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px">' +
