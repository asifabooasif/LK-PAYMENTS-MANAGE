<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Lanka Shoe — Business Manager</title>
<meta name="theme-color" content="#7c3aed">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👟</text></svg>">

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   ROOT VARIABLES + THEMES
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --accent:#7c3aed;--accent-soft:rgba(124,58,237,.12);--accent-dark:#6d28d9;
  --bg:#f6f7fb;--surface:#ffffff;--surface-2:#f2f3f8;--surface-3:#e8eaf1;
  --text:#0f172a;--text-2:#334155;--text-3:#64748b;--text-4:#94a3b8;
  --border:#e2e8f0;--border-strong:#cbd5e1;
  --green:#10b981;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6;
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 4px 14px rgba(15,23,42,.08);
  --shadow-lg:0 18px 40px rgba(15,23,42,.14);
  --sidebar-w:236px;--font-size:13.5px;--density:1;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
[data-theme="aurora"]{
  --bg:#0a0714;--surface:#14101f;--surface-2:#1c1730;--surface-3:#252041;
  --text:#f4f2ff;--text-2:#c4bdd6;--text-3:#8880a4;--text-4:#5a5271;
  --border:#2c2544;--border-strong:#3d3559;
  --accent:#a855f7;--accent-soft:rgba(168,85,247,.18);--accent-dark:#9333ea;
}
[data-theme="linear"]{
  --bg:#0e0e10;--surface:#18181b;--surface-2:#232326;--surface-3:#2d2d33;
  --text:#fafafa;--text-2:#d4d4d8;--text-3:#a1a1aa;--text-4:#71717a;
  --border:#2a2a2e;--border-strong:#3f3f46;
  --accent:#6366f1;--accent-soft:rgba(99,102,241,.18);--accent-dark:#4f46e5;
}
[data-theme="notion"]{
  --bg:#fbfaf7;--surface:#ffffff;--surface-2:#f4f2ed;--surface-3:#eae6dd;
  --text:#1a1a1a;--text-2:#3d3d3d;--text-3:#757575;--text-4:#a0a0a0;
  --border:#e8e5dd;--border-strong:#d1cdc1;
  --accent:#c2632a;--accent-soft:rgba(194,99,42,.12);--accent-dark:#a04e1e;
}
[data-theme="glass"]{
  --bg:#080b1a;--surface:rgba(23,28,48,.72);--surface-2:rgba(38,44,68,.68);--surface-3:rgba(52,60,88,.72);
  --text:#eef2ff;--text-2:#c7cde0;--text-3:#8f97b3;--text-4:#5f6880;
  --border:rgba(140,155,200,.16);--border-strong:rgba(160,175,220,.28);
  --accent:#5b6ef5;--accent-soft:rgba(91,110,245,.18);--accent-dark:#4353e0;
  --shadow:0 8px 32px rgba(0,0,0,.45);backdrop-filter:blur(14px);
}
[data-density="compact"]{--density:.82}
[data-density="spacious"]{--density:1.22}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font);font-size:var(--font-size);color:var(--text);
  background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--text-4)}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
.mono{font-family:var(--mono);font-size:.92em}
.small{font-size:12px}
.muted{color:var(--text-3)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.center{text-align:center}

#loginOverlay{
  position:fixed;inset:0;z-index:800;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0a0714 0%,#1e1b4b 50%,#312e81 100%);
  padding:20px;overflow:auto;
}
#loginOverlay::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 20% 30%,rgba(124,58,237,.35) 0%,transparent 50%),
             radial-gradient(circle at 80% 70%,rgba(59,130,246,.28) 0%,transparent 50%);
  pointer-events:none;
}
.login-card{
  position:relative;background:rgba(255,255,255,.98);border-radius:22px;
  padding:42px 38px;width:100%;max-width:420px;box-shadow:0 28px 80px rgba(0,0,0,.42);
  backdrop-filter:blur(18px);animation:loginIn .5s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes loginIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.login-logo{
  width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#7c3aed,#4f46e5);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;
  margin:0 auto 20px;box-shadow:0 12px 30px rgba(124,58,237,.42);letter-spacing:-1px;
}
.login-title{font-size:24px;font-weight:800;text-align:center;color:#0f172a;letter-spacing:-.02em}
.login-sub{font-size:13px;text-align:center;color:#64748b;margin-top:6px;margin-bottom:28px}
.google-btn{
  width:100%;padding:12px 16px;background:#fff;border:1.5px solid #e2e8f0;border-radius:11px;
  font-size:14px;font-weight:600;color:#1e293b;display:flex;align-items:center;justify-content:center;
  gap:10px;transition:all .18s ease;cursor:pointer;
}
.google-btn:hover:not(:disabled){background:#f8fafc;border-color:#cbd5e1;transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,23,42,.08)}
.google-btn:disabled{opacity:.55;cursor:not-allowed}
.google-btn svg{flex-shrink:0}
.login-note{font-size:11.5px;color:#94a3b8;text-align:center;margin-top:22px;line-height:1.6}
#loginError{
  margin-top:14px;padding:10px 14px;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;
  border-radius:9px;font-size:12.5px;white-space:pre-line;display:none;
}
#loginError.show{display:block;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

#appRoot{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;transition:margin-left .22s ease;flex-shrink:0;
}
.sidebar.collapsed{margin-left:calc(-1 * var(--sidebar-w))}
.sb-brand{
  padding:18px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);
}
.sb-logo{
  width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
  flex-shrink:0;letter-spacing:-1px;
}
.sb-brand-text{flex:1;min-width:0}
.sb-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-tag{font-size:10.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{flex:1;overflow-y:auto;padding:10px 8px}
.sb-item{
  display:flex;align-items:center;gap:10px;padding:8.5px 12px;border-radius:8px;cursor:pointer;
  font-size:13px;color:var(--text-2);transition:background .15s,color .15s;user-select:none;
}
.sb-item:hover{background:var(--surface-2);color:var(--text)}
.sb-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sb-item .ico{width:20px;text-align:center;font-size:14px;flex-shrink:0}
.sb-section{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-4);padding:12px 12px 4px;font-weight:600}
.sb-foot{padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-user{flex:1;min-width:0}
.sb-user-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-role{font-size:10.5px;color:var(--text-3)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{
  height:56px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 18px;gap:12px;flex-shrink:0;
}
.icon-btn{
  width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--text-3);transition:background .15s,color .15s;font-size:16px;position:relative;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn .dot{
  position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);
  border:1.5px solid var(--surface);
}
.page-title{font-size:15px;font-weight:700;color:var(--text);flex:1;letter-spacing:-.01em}
.view{flex:1;overflow-y:auto;padding:20px 24px 40px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:600;
  background:var(--surface-2);color:var(--text);border:1px solid var(--border);
  transition:all .15s ease;white-space:nowrap;
}
.btn:hover{background:var(--surface-3);border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.danger{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.btn.danger:hover{background:#fecaca}
.btn.green{background:#d1fae5;color:#065f46;border-color:#a7f3d0}
.btn.green:hover{background:#a7f3d0}
.btn.sm{padding:6px 10px;font-size:11.5px}
.btn.xs{padding:4px 8px;font-size:11px;border-radius:6px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-3)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:16px;overflow:hidden;
}
.card-head{
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.card-head h3{font-size:14px;font-weight:700;letter-spacing:-.01em}
.card-head .meta{font-size:12px;color:var(--text-3);margin-top:2px}
.card-body{padding:18px}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);font-weight:700;margin:18px 0 10px}

.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--text-2)}
.field .req{color:var(--red)}
.field input,.field select,.field textarea{
  padding:8.5px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;
  width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
.field textarea{resize:vertical;min-height:60px;font-family:inherit}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.row-flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.table-wrap{overflow-x:auto;max-height:calc(100vh - 300px);border-radius:0 0 var(--radius) var(--radius)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{
  position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--text-3);
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
tbody tr[data-action]{cursor:pointer}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}

.empty{padding:60px 20px;text-align:center;color:var(--text-3);font-size:13px}
.empty-ico{font-size:38px;opacity:.35;margin-bottom:12px}

.badge{
  display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;
  letter-spacing:.01em;white-space:nowrap;
}
.badge.gray{background:var(--surface-3);color:var(--text-3)}
.badge.green{background:rgba(16,185,129,.14);color:#059669}
.badge.red{background:rgba(239,68,68,.14);color:#dc2626}
.badge.amber{background:rgba(245,158,11,.18);color:#b45309}
.badge.blue{background:rgba(59,130,246,.14);color:#2563eb}
.badge.purple{background:rgba(139,92,246,.14);color:#7c3aed}
.tag{
  display:inline-block;padding:2.5px 8px;border-radius:20px;font-size:10.5px;font-weight:600;
  background:var(--surface-2);color:var(--text-3);margin-right:4px;
}
.tag.reliable{background:rgba(16,185,129,.12);color:#059669}
.tag.slow{background:rgba(245,158,11,.14);color:#d97706}
.tag.priority{background:rgba(239,68,68,.12);color:#dc2626}
.rev-badge{
  display:inline-block;padding:2px 7px;background:rgba(239,68,68,.14);color:#dc2626;
  border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.04em;
}

.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s;
}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi-label{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.kpi-value{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums}
.kpi-sub{font-size:11.5px;color:var(--text-3)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab{
  padding:9px 14px;font-size:12.5px;font-weight:500;color:var(--text-3);cursor:pointer;
  border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

.filter-bar{
  display:flex;gap:10px;padding:12px 18px;background:var(--surface-2);
  border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.filter-bar .field{flex:1;min-width:160px;max-width:300px}

#modalRoot{
  position:fixed;inset:0;z-index:900;background:rgba(15,23,42,.55);
  display:none;align-items:flex-start;justify-content:center;padding:5vh 20px;overflow-y:auto;
  backdrop-filter:blur(4px);
}
#modalRoot.open{display:flex;animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:640px;
  box-shadow:0 28px 70px rgba(0,0,0,.4);animation:modalIn .22s cubic-bezier(.2,.9,.3,1.1);
  max-height:90vh;display:flex;flex-direction:column;overflow:hidden;
}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{
  padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  gap:12px;
}
.modal-head h3{font-size:15px;font-weight:700}
.modal-body{padding:22px;overflow-y:auto;flex:1}

.toast-stack{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:11px;padding:11px 14px;box-shadow:var(--shadow-lg);
  min-width:260px;max-width:400px;transform:translateX(120%);opacity:0;
  transition:transform .22s ease,opacity .22s ease;
}
.toast.show{transform:translateX(0);opacity:1}
.toast-ico{
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;
}
.toast-success .toast-ico{background:rgba(16,185,129,.15);color:#10b981}
.toast-error .toast-ico{background:rgba(239,68,68,.15);color:#ef4444}
.toast-warn .toast-ico{background:rgba(245,158,11,.18);color:#f59e0b}
.toast-info .toast-ico{background:rgba(59,130,246,.15);color:#3b82f6}
.toast-msg{flex:1;font-size:12.5px;line-height:1.4}
.toast-x{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:16px;padding:0 4px}
.toast-x:hover{color:var(--text)}

.cmdk{
  position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:9998;display:flex;
  align-items:flex-start;justify-content:center;padding-top:14vh;backdrop-filter:blur(6px);
  animation:fadeIn .15s;
}
.cmdk-box{
  width:min(640px,92vw);background:var(--surface);border-radius:14px;
  box-shadow:0 28px 70px rgba(0,0,0,.45);overflow:hidden;border:1px solid var(--border);
  animation:modalIn .2s cubic-bezier(.2,.9,.3,1.1);
}
.cmdk-in{padding:16px 20px;border-bottom:1px solid var(--border)}
.cmdk-in input{width:100%;border:none;outline:none;font-size:16px;background:transparent;color:var(--text)}
.cmdk-list{max-height:52vh;overflow-y:auto;padding:6px}
.cmdk-item{
  padding:9px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;
  gap:10px;font-size:13px;transition:background .1s;
}
.cmdk-item.sel{background:var(--accent-soft);color:var(--accent)}
.cmdk-item .ico{width:22px;text-align:center;font-size:14px}
.cmdk-group{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);
  padding:10px 14px 4px;font-weight:600;
}

#dbgBtn{
  position:fixed;bottom:20px;left:20px;z-index:9997;width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-size:18px;
  box-shadow:0 8px 24px rgba(124,58,237,.45);display:flex;align-items:center;justify-content:center;
  transition:transform .15s;cursor:pointer;
}
#dbgBtn:hover{transform:scale(1.08)}
#dbgPanel{
  position:fixed;bottom:80px;left:20px;z-index:9996;width:min(520px,calc(100vw - 40px));
  max-height:60vh;background:#0a0a0f;border-radius:14px;box-shadow:0 22px 60px rgba(0,0,0,.55);
  border:1px solid #1e1e2a;display:none;flex-direction:column;overflow:hidden;font-family:var(--mono);
}
#dbgPanel.open{display:flex}
.dbg-head{
  padding:10px 14px;background:#0f0f18;border-bottom:1px solid #1e1e2a;display:flex;
  align-items:center;justify-content:space-between;color:#94a3b8;font-size:11.5px;
}
.dbg-head .dbg-title{font-weight:700;color:#e0e7ff}
.dbg-tools{display:flex;gap:6px}
.dbg-tools button{
  padding:3px 8px;font-size:10.5px;color:#94a3b8;background:#1a1a28;border-radius:5px;
  border:1px solid #262636;cursor:pointer;
}
.dbg-tools button:hover{color:#fff;background:#252536}
#dbgLog{flex:1;overflow-y:auto;padding:8px 14px;font-size:11.5px;line-height:1.7;color:#cbd5e1}
.dbg-line{padding:2px 0;border-bottom:1px solid #101018;display:flex;gap:8px;word-break:break-word}
.dbg-time{color:#475569;flex-shrink:0}
.dbg-tag{font-weight:700;flex-shrink:0}
.dbg-tag.BOOT{color:#7dd3fc}
.dbg-tag.FB{color:#a78bfa}
.dbg-tag.AUTH{color:#34d399}
.dbg-tag.DATA{color:#fbbf24}
.dbg-tag.SAVE{color:#f472b6}
.dbg-tag.LOAD{color:#60a5fa}
.dbg-tag.ERROR{color:#f87171}
.dbg-tag.WARN{color:#facc15}
.dbg-msg{color:#cbd5e1;flex:1}

#fabBtn{

(function mirrorConsole(){
  const wrap=(name,orig)=>{
    return function(){
      const args=Array.from(arguments).map(a=>{
        if(a instanceof Error)return a.message;
        if(typeof a==='object'){try{return JSON.stringify(a).slice(0,200);}catch(e){return String(a);}}
        return String(a);
      });
      dbg(name==='error'?'ERROR':name==='warn'?'WARN':'INFO','console.'+name+': '+args.join(' '));
      try{orig.apply(console,arguments);}catch(e){}
    };
  };
  console.log=wrap('log',console.log);
  console.warn=wrap('warn',console.warn);
  console.error=wrap('error',console.error);
})();

function num(v){const n=parseFloat(v);return isFinite(n)?n:0;}

function uniq(a){return Array.from(new Set(arr(a)));}
function esc(s){
  if(s===null||s===undefined)return'';

  const out=[];const d=new Date();
  for(let i=n-1;i>=0;i--){const dd=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(dd.toISOString().slice(0,7));}
  return out;
}

function money(v){
  const s=db&&db.settings?db.settings:{currency:'Rs.',currencyPosition:'before',decimalPlaces:2,thousandsSeparator:','};
  const n=num(v);
  const dec=num(s.decimalPlaces)||0;
  const parts=Math.abs(n).toFixed(dec).split('.');
  const intPart=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,s.thousandsSeparator||',');
  const formatted=intPart+(parts[1]?'.'+parts[1]:'');
  const sign=n<0?'-':'';
  return sign+(s.currencyPosition==='after'?formatted+' '+s.currency:esc(s.currency)+' '+formatted);
}
function moneyPlain(v){return money(v).replace(/^Rs\.?\s*/,'');}
function fmtCompact(n){
  n=num(n);const a=Math.abs(n);
  if(a>=1e9)return(n/1e9).toFixed(1)+'B';
  if(a>=1e6)return(n/1e6).toFixed(1)+'M';
  if(a>=1e3)return(n/1e3).toFixed(1)+'K';
  return String(Math.round(n));
}
function amountInWords(n){
  n=Math.round(num(n));
  if(n===0)return'Zero Rupees Only';
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?ones[x]:tens[Math.floor(x/10)]+(x%10?' '+ones[x%10]:'');
  const three=x=>{
    const h=Math.floor(x/100),r=x%100;
    return(h?ones[h]+' Hundred'+(r?' ':''):'')+(r?two(r):'');
  };
  const parts=[];
  const cr=Math.floor(n/10000000);n%=10000000;
  const lk=Math.floor(n/100000);n%=100000;
  const th=Math.floor(n/1000);n%=1000;
  const hd=Math.floor(n/100);n%=100;
  if(cr)parts.push(three(cr)+' Crore');
  if(lk)parts.push(three(lk)+' Lakh');
  if(th)parts.push(three(th)+' Thousand');
  if(hd||n)parts.push(three(hd*100+n));
  return parts.join(' ').trim()+' Rupees Only';
}

function toast(msg,type,duration){
  type=type||'info';duration=duration||3200;
  const c=document.getElementById('toastStack');
  const ico={success:'✓',error:'✕',warn:'⚠',info:'ℹ'}[type]||'•';

  el.innerHTML='<div class="toast-ico">'+ico+'</div><div class="toast-msg">'+esc(msg)+'</div><button class="toast-x" aria-label="dismiss">×</button>';
  el.querySelector('.toast-x').onclick=()=>dismiss();
  c.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  const all=c.querySelectorAll('.toast');
  if(all.length>4)dismissEl(all[0]);
  setTimeout(dismiss,type==='error'?5000:duration);
  function dismiss(){dismissEl(el);}
}
function dismissEl(el){
  if(!el||!el.parentNode)return;
  el.classList.remove('show');
  setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},240);
}

async function loadFromFirestore(){
  if(!firebaseReady||offlineMode)return;
  dbg('FB','Loading from Firestore…');
  try{
    const doc=await firestore.doc('lk/settings').get();
    if(doc.exists)db.settings=Object.assign(defaultSettings(),doc.data()||{});
    dbg('FB','Loaded settings');
  }catch(e){dbg('WARN','settings load: '+(e.code||e.message));}
  await Promise.all(COLLECTIONS.map(async col=>{
    try{
      const snap=await firestore.collection(DATA_PREFIX+col).get();
      db[col]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      dbg('LOAD','['+DATA_PREFIX+col+'] '+db[col].length+' docs');
    }catch(e){
      dbg('WARN','['+DATA_PREFIX+col+'] '+(e.code||e.message));
      if(!Array.isArray(db[col]))db[col]=[];
    }
  }));
  dbg('FB','Load complete');
  normalizeDb();
}

async function pushToFirestore(){
  if(!firebaseReady||offlineMode)return;
  if(currentUserRole!=='admin'&&currentUserRole!=='accountant')return;
  try{
    await firestore.doc('lk/settings').set(db.settings||{},{merge:true});
  }catch(e){dbg('WARN','settings save: '+(e.code||e.message));}
  let totalOps=0,errors=0;
  await Promise.all(COLLECTIONS.map(async col=>{
    try{
      const colRef=firestore.collection(DATA_PREFIX+col);
      const existing=await colRef.get();
      const existingIds=new Set(existing.docs.map(d=>d.id));
      const current=arr(db[col]);
      const currentIds=new Set(current.map(x=>x.id));
      const batch=firestore.batch();
      let ops=0;
      current.forEach(item=>{
        if(!item||!item.id)return;
        batch.set(colRef.doc(item.id),item,{merge:true});
        ops++;
      });
      existingIds.forEach(id=>{
        if(!currentIds.has(id)){batch.delete(colRef.doc(id));ops++;}
      });
      if(ops>0){await batch.commit();totalOps+=ops;dbg('SAVE','['+DATA_PREFIX+col+'] '+ops+' ops');}
    }catch(e){
      errors++;
      dbg('WARN','['+DATA_PREFIX+col+'] '+(e.code||e.message));
    }
  }));
  if(errors===0)dbg('SAVE','Synced '+totalOps+' ops • '+COLLECTIONS.length+' collections');
  else dbg('WARN','Sync completed with '+errors+' errors');
}
window.pushToFirestore=pushToFirestore;

async function checkAccess(email){
  if(!email)return false;
  if(email.toLowerCase()===ADMIN_EMAIL.toLowerCase())return'admin';
  try{
    const doc=await firestore.doc(ACCESS_DOC_PATH).get();
    if(!doc.exists)return false;
    const data=doc.data()||{};
    const list=(data.allowedEmails||[]).map(e=>String(e).toLowerCase().trim());
    if(!list.includes(email.toLowerCase().trim()))return false;
    const perms=(data.userPerms||{})[email.toLowerCase().trim()]||{};
    currentUserPerms=perms;
    return perms.role||'viewer';
  }catch(e){dbg('WARN','checkAccess: '+(e.code||e.message));return false;}
}

  }catch(e){

function renderCmdkResults(q){
  const list=document.getElementById('cmdkList');if(!list)return;
  const items=[];const term=(q||'').toLowerCase().trim();
  const navs=[
    ['dashboard','Dashboard','🏠'],['customers','Customers','C'],['suppliers','Suppliers','S'],
    ['categories','Categories','📂'],['purchases','Purchases','🛒'],['receipts','Receipts','🧾'],
    ['cheques','Customer Cheques','💳'],['payments','Payments','💸'],['banks','Bank Accounts','🏦'],
    ['chequebooks','Cheque Books','📚'],['expenses','Expenses','📉'],['journals','Journals','📓'],
    ['ledger','Ledger','📒'],['aging','Aging','⏳'],['budgets','Budgets','💰'],['cashflow','Cash Flow','📈'],
    ['reports','Reports','📊'],['documents','Documents','📄'],['calendar','Calendar','📅'],
    ['todo','Tasks','✓'],['history','History','📜'],['logins','Login History','🔐'],
    ['ai','AI Assistant','🤖'],['backup','Backup','💾'],['trash','Trash','🗑'],['settings','Settings','⚙']
  ];
  navs.forEach(([k,l,i])=>{if(!term||l.toLowerCase().includes(term))items.push({group:'Navigate',icon:i,label:l,run:()=>{ui.view=k;closeCmdk();if(typeof render==='function')render();}});});
  const acts=[
    {icon:'＋',label:'Add Customer',run:()=>{closeCmdk();typeof openCustomerForm==='function'&&openCustomerForm();}},
    {icon:'＋',label:'Add Supplier',run:()=>{closeCmdk();typeof openSupplierForm==='function'&&openSupplierForm();}},
    {icon:'＋',label:'Add Purchase',run:()=>{closeCmdk();typeof openPurchaseForm==='function'&&openPurchaseForm();}},
    {icon:'＋',label:'Add Expense',run:()=>{closeCmdk();typeof openExpenseForm==='function'&&openExpenseForm();}},
    {icon:'💸',label:'Pay Supplier',run:()=>{closeCmdk();typeof openPaymentForm==='function'&&openPaymentForm();}},
    {icon:'⬇',label:'Download Backup',run:()=>{closeCmdk();download('lankashoe_'+today()+'.json',JSON.stringify(db,null,2),'application/json');}},
    {icon:'🌗',label:'Toggle Theme',run:()=>{closeCmdk();db.settings.uiTheme=db.settings.uiTheme==='aurora'?'professional':'aurora';save();applySettings();if(typeof render==='function')render();}}
  ];
  acts.forEach(a=>{if(!term||a.label.toLowerCase().includes(term))items.push({group:'Action',...a});});
  if(term.length>=2){
    arr(db.suppliers).forEach(s=>{if((s.name||'').toLowerCase().includes(term))items.push({group:'Suppliers',icon:'S',label:s.name,meta:s.phone||'',run:()=>{closeCmdk();typeof showSupplierDetail==='function'&&showSupplierDetail(s.id);}});});
    arr(db.customers).forEach(c=>{if((c.name||'').toLowerCase().includes(term))items.push({group:'Customers',icon:'C',label:c.name,meta:c.phone||'',run:()=>{closeCmdk();typeof showCustomerDetail==='function'&&showCustomerDetail(c.id);}});});
  }
  __cmdkItems=items;__cmdkSel=0;
  if(!items.length){list.innerHTML='<div style="padding:30px;text-align:center;color:var(--text-3);font-size:12.5px">No results</div>';return;}
  let html='',lastG='';
  items.forEach((it,i)=>{
    if(it.group!==lastG){html+='<div class="cmdk-group">'+esc(it.group)+'</div>';lastG=it.group;}
    html+='<div class="cmdk-item '+(i===0?'sel':'')+'" data-idx="'+i+'"><span class="ico">'+it.icon+'</span><span style="flex:1">'+esc(it.label)+'</span>'+(it.meta?'<span style="font-size:11px;color:var(--text-3)">'+esc(it.meta)+'</span>':'')+'</div>';
  });
  list.innerHTML=html;
  list.querySelectorAll('.cmdk-item').forEach(el=>{
    el.onclick=()=>{const i=+el.dataset.idx;items[i].run();};
    el.onmouseenter=()=>{__cmdkSel=+el.dataset.idx;updateCmdkSel();};
  });
}
function updateCmdkSel(){
  document.querySelectorAll('#cmdkList .cmdk-item').forEach((el,i)=>{
    el.classList.toggle('sel',i===__cmdkSel);
    if(i===__cmdkSel)el.scrollIntoView({block:'nearest'});
  });
}
function cmdkKey(e){
  if(e.key==='Escape'){closeCmdk();e.preventDefault();return;}
  if(e.key==='ArrowDown'){__cmdkSel=Math.min(__cmdkSel+1,__cmdkItems.length-1);updateCmdkSel();e.preventDefault();}
  else if(e.key==='ArrowUp'){__cmdkSel=Math.max(__cmdkSel-1,0);updateCmdkSel();e.preventDefault();}
  else if(e.key==='Enter'){const it=__cmdkItems[__cmdkSel];if(it){it.run();e.preventDefault();}}
}

  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdk();}

function computeNotifications(){
  const out=[];
  const s=db.settings||{};
  if(s.notifEnabled===false)return out;
  const today0=today();
  if(s.notifDueSoon!==false){
    arr(db.chequeLeaves).filter(l=>l.status==='Issued'&&l.dueDate).forEach(l=>{
      const dd=daysBetween(today0,l.dueDate);
      if(dd>=0&&dd<=num(s.chequeReminderDays||7)){
        out.push({id:'due-'+l.id,title:'Cheque due in '+dd+'d',desc:(l.bankName||'')+' • '+money(l.amount||0),view:'chequebooks'});
      }
    });
  }
  if(s.notifOverdueCheques!==false){
    arr(db.chequeLeaves).filter(l=>l.status==='Issued'&&l.dueDate&&l.dueDate<today0).forEach(l=>{
      out.push({id:'ovd-'+l.id,title:'Overdue cheque',desc:(l.bankName||'')+' • '+money(l.amount||0),view:'chequebooks'});
    });
  }
  if(s.notifBounced!==false){
    arr(db.customerCheques).filter(c=>c.status==='Bounced').forEach(c=>{
      out.push({id:'bnc-'+c.id,title:'Bounced cheque',desc:c.customerName+' • '+money(c.amount||0),view:'cheques'});
    });
  }
  return out.slice(0,40);
}
function renderNotifPanel(){
  const list=document.getElementById('notifList');
  const dot=document.getElementById('notifDot');
  if(!list)return;
  const items=computeNotifications();
  const unread=items.filter(n=>!(db.notifRead&&db.notifRead[n.id]));
  if(dot)dot.classList.toggle('hidden',!unread.length);
  if(!items.length){list.innerHTML='<div class="empty" style="padding:40px 20px">🎉 All caught up</div>';return;}
  list.innerHTML=items.map(n=>{
    const read=db.notifRead&&db.notifRead[n.id];
    return '<div class="notif-item '+(read?'':'unread')+'" data-action="notif-click" data-id="'+esc(n.id)+'" data-view="'+esc(n.view||'')+'"><div class="t">'+esc(n.title)+'</div><div class="d">'+esc(n.desc)+'</div></div>';
  }).join('');
}
window.renderNotifPanel=renderNotifPanel;
function toggleNotif(){
  const p=document.getElementById('notifPanel');
  p.classList.toggle('open');
  if(p.classList.contains('open'))renderNotifPanel();
}
window.toggleNotif=toggleNotif;
function markAllNotifRead(){
  if(!db.notifRead)db.notifRead={};
  computeNotifications().forEach(n=>db.notifRead[n.id]=true);
  save();renderNotifPanel();
}
window.markAllNotifRead=markAllNotifRead;

function renderFabMenu(){

  const items=[

    {ico:'S',label:'New Supplier',run:'openSupplierForm'},

function toggleFab(){

}

function fabRun(fn){
  document.getElementById('fabMenu').classList.remove('open');

}

   RENDER DISPATCHER
   ───────────────────────────────────────────────────────────────────────────── */
function render(){
  renderSidebar();
  const view=document.getElementById('view');
  if(!view)return;
  const fn='view'+ui.view.charAt(0).toUpperCase()+ui.view.slice(1);
  if(typeof window[fn]==='function'){view.innerHTML=window[fn]();}
  else view.innerHTML='<div class="card"><div class="empty"><div class="empty-ico">🚧</div>Module "'+esc(ui.view)+'" loading…<br><span class="small">Waiting for Part 2+ of the build.</span></div></div>';
  const title=document.getElementById('pageTitle');
  const nav=NAV_ITEMS.find(n=>n.key===ui.view);
  if(title&&nav)title.textContent=nav.label;
  renderNotifPanel();
  updateSidebarWidget();
}
window.render=render;

function updateSidebarWidget(){
  const w=document.getElementById('sbWidget');
  if(!w||!db.settings||!db.settings.showMaturityWidget){if(w)w.style.display='none';return;}
  const today0=today();
  const upcoming=arr(db.chequeLeaves).filter(l=>l.status==='Issued'&&l.dueDate>=today0).sort((a,b)=>a.dueDate<b.dueDate?-1:1)[0];
  if(!upcoming){w.style.display='none';return;}
  const days=daysBetween(today0,upcoming.dueDate);
  w.style.display='';
  w.innerHTML='<div class="w-label">Next Cheque</div><div class="w-value">'+esc(upcoming.bankName||'')+' · '+money(upcoming.amount||0)+'</div><div class="w-sub">in '+days+' day'+(days!==1?'s':'')+'</div>';
}

/* ─────────────────────────────────────────────────────────────────────────────
   GLOBAL EVENT DELEGATION
   ───────────────────────────────────────────────────────────────────────────── */
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const a=el.dataset.action,id=el.dataset.id;
  const map={
    'close-modal':()=>closeModal(),
    'toggle-sidebar':()=>toggleSidebar(),
    'nav':()=>{ui.view=el.dataset.view;render();},
    'toggle-notif':()=>toggleNotif(),
    'clear-notif':()=>markAllNotifRead(),
    'toggle-fab':()=>toggleFab(),
    'signout':()=>handleSignOut(),
    'notif-click':()=>{
      db.notifRead=db.notifRead||{};
      db.notifRead[id]=true;
      const v=el.dataset.view;
      document.getElementById('notifPanel').classList.remove('open');
      if(v){ui.view=v;render();}
      save();
    }
  };
  if(map[a]){e.preventDefault();map[a]();return;}
});

/* ─────────────────────────────────────────────────────────────────────────────
   SAFE SHIELD
   ───────────────────────────────────────────────────────────────────────────── */
(function shield(){
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('keydown',function(e){
    const k=e.key;
    if(k==='F12'){e.preventDefault();toast('Developer tools blocked','warn',1800);return;}
    if(e.ctrlKey&&e.shiftKey&&(k==='I'||k==='J'||k==='C')){e.preventDefault();toast('Developer tools blocked','warn',1800);}
  });
})();

   BOOT
   ───────────────────────────────────────────────────────────────────────────── */
(async function boot(){
  dbg('BOOT','Boot starting • version '+APP_VER);
  renderSidebar();
  renderFabMenu();
  setTimeout(function(){
    const lo=document.getElementById('loginOverlay');
    const app=document.getElementById('appRoot');
    const loginVisible=lo&&lo.style.display!=='none';
    if(!loginVisible&&(!app||app.style.display==='none')){if(lo)lo.style.display='flex';dbg('WARN','Boot timeout — showing login');}
  },2500);
  try{await initFirebase();}catch(e){dbg('ERROR','initFirebase: '+(e.message||e));}
  if(!firebaseReady){
    showLoginError('Firebase init failed: '+(firebaseInitError||'Unknown'));
    const btn=document.getElementById('googleSignInBtn');
    if(btn){btn.disabled=true;btn.innerHTML='<span style="font-weight:600">Firebase Unavailable</span>';}
    const note=document.getElementById('loginNote');
    if(note&&!document.getElementById('offlineBtn')){
      const ob=document.createElement('button');
      ob.id='offlineBtn';ob.className='google-btn';ob.style.marginTop='14px';
      ob.innerHTML='Continue in Offline Mode';ob.onclick=enterOfflineMode;
      note.parentNode.insertBefore(ob,note);
    }
    return;
  }
  try{auth.onAuthStateChanged(onAuthStateChanged);}
  catch(e){dbg('ERROR','auth listener failed');showLoginError('Auth listener failed. Reload the page.');}
})();

/* ─────────────────────────────────────────────────────────────────────────────
   DASHBOARD
   ───────────────────────────────────────────────────────────────────────────── */
function viewDashboard(){
  const s=db.settings||{};
  const now=nowISO();
  const todayStr=today();
  const thisMonth=todayStr.slice(0,7);
  const purchases=arr(db.purchases);
  const payments=arr(db.payments);
  const expenses=arr(db.expenses);
  const suppliers=arr(db.suppliers);
  const customers=arr(db.customers);
  const cheques=arr(db.customerCheques);
  const leaves=arr(db.chequeLeaves);

  const totalPurch=sum(purchases,'amount');
  const totalPaid=sum(payments,'amount');
  const payable=totalPurch-totalPaid;
  const thisMonthPurch=sum(purchases.filter(p=>inMonth(p.date,thisMonth)),'amount');
  const thisMonthExp=sum(expenses.filter(e=>inMonth(e.date,thisMonth)),'amount');
  const bouncedTotal=sum(cheques.filter(c=>c.status==='Bounced'),'amount');
  const chequesDue=sum(leaves.filter(l=>l.status==='Issued'&&l.dueDate>=todayStr&&l.dueDate<=shiftDate(todayStr,7)),'amount');
  const cash=arr(db.bankAccounts).reduce((acc,b)=>acc+num(b.openingBalance||0),0);

  const kpiKeys=currentKpiPrefs();
  const kpiRenderers={
    purchases:()=>kpiCard('Total Purchases',money(totalPurch),purchases.length+' invoices'),
    payable:()=>kpiCard('Payable',money(payable),suppliers.length+' suppliers'),
    receivable:()=>kpiCard('Receivable',money(bouncedTotal),'From bounced cheques'),
    chequesDue:()=>kpiCard('Cheques Due (7d)',money(chequesDue),'Next 7 days'),
    bounced:()=>kpiCard('Bounced',money(bouncedTotal),cheques.filter(c=>c.status==='Bounced').length+' cheques'),
    cash:()=>kpiCard('Bank Balance',money(cash),arr(db.bankAccounts).length+' accounts'),
    suppliers:()=>kpiCard('Suppliers',suppliers.length,'Total'),
    customers:()=>kpiCard('Customers',customers.length,'Total'),
    expenses:()=>kpiCard('Expenses (Month)',money(thisMonthExp),'This month'),
    lowStock:()=>kpiCard('Low Stock',0,'N/A')
  };

  const hero=`<div class="dash-hero">
    <h2>Welcome back, ${esc((currentUser&&(currentUser.name||currentUser.email.split('@')[0]))||'there')} 👋</h2>
    <div class="sub">Here's what's happening at ${esc(s.shopName||APP_NAME)} today</div>
    <div class="row">
      <div class="stat"><div class="stat-label">This Month Purchases</div><div class="stat-val">${money(thisMonthPurch)}</div></div>
      <div class="stat"><div class="stat-label">This Month Expenses</div><div class="stat-val">${money(thisMonthExp)}</div></div>
      <div class="stat"><div class="stat-label">Net Payable</div><div class="stat-val">${money(payable)}</div></div>
    </div>
  </div>`;

  const kpiHTML=kpiKeys.length
    ? '<div class="kpi-strip">'+kpiKeys.map(k=>kpiRenderers[k]?kpiRenderers[k]():'').join('')+'</div>'
    : '<div class="card"><div class="empty"><div class="empty-ico">📊</div>No KPIs selected<br><button class="btn primary" style="margin-top:12px" onclick="openKpiPicker()">Choose KPIs</button></div></div>';

  const recentActivity=arr(db.activityLog).slice(-8).reverse();
  const activityHTML=recentActivity.length
    ? recentActivity.map(a=>`<div style="padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px">
        <div style="font-weight:600">${esc(a.action)}</div>
        <div class="muted small">${esc(a.details||a.entity||'')} • ${dateTimeFmt(a.timestamp)}</div>
      </div>`).join('')
    : '<div class="empty">No activity yet</div>';

  const upcomingCheques=leaves
    .filter(l=>l.status==='Issued'&&l.dueDate>=todayStr)
    .sort((a,b)=>a.dueDate<b.dueDate?-1:1)
    .slice(0,6);
  const chequeHTML=upcomingCheques.length
    ? upcomingCheques.map(l=>`<div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:600;font-size:12.5px">${esc(l.bankName||'—')}</div>
        <div class="muted small">Due ${dateFmt(l.dueDate)}${l.payee?' • '+esc(l.payee):''}</div></div>
        <strong>${money(l.amount||0)}</strong>
      </div>`).join('')
    : '<div class="empty">No upcoming cheques</div>';

  const topSuppliers=suppliers.map(su=>({name:su.name,balance:supplierOutstanding(su.id)}))
    .filter(x=>x.balance>0).sort((a,b)=>b.balance-a.balance).slice(0,5);
  const topSupHTML=topSuppliers.length
    ? topSuppliers.map(su=>`<div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between">
        <span>${esc(su.name)}</span><strong>${money(su.balance)}</strong></div>`).join('')
    : '<div class="empty">All clear 🎉</div>';

  return hero+
    '<div class="row-flex" style="justify-content:flex-end;margin-bottom:12px">'+
      '<button class="btn sm" onclick="openKpiPicker()">⚙ Customise KPIs</button>'+
      '<button class="btn sm" onclick="ui.view=\'reports\';render()">📊 Reports</button>'+
    '</div>'+
    kpiHTML+
    '<div class="grid-2">'+
      '<div class="card"><div class="card-head"><h3>📜 Recent Activity</h3><button class="btn xs" onclick="ui.view=\'history\';render()">View all</button></div><div class="card-body">'+activityHTML+'</div></div>'+
      '<div class="card"><div class="card-head"><h3>⏰ Upcoming Cheques</h3></div><div class="card-body">'+chequeHTML+'</div></div>'+
      '<div class="card"><div class="card-head"><h3>💸 Top Payables</h3><button class="btn xs" onclick="ui.view=\'aging\';render()">Aging</button></div><div class="card-body">'+topSupHTML+'</div></div>'+
      '<div class="card"><div class="card-head"><h3>⚡ Quick Actions</h3></div><div class="card-body">'+
        '<div class="row-flex" style="flex-wrap:wrap">'+
          '<button class="btn" onclick="openPurchaseForm()">🛒 New Purchase</button>'+
          '<button class="btn" onclick="openPaymentForm()">💸 Pay Supplier</button>'+
          '<button class="btn" onclick="openReceiptForm()">🧾 New Receipt</button>'+
          '<button class="btn" onclick="openExpenseForm()">📉 Add Expense</button>'+
          '<button class="btn" onclick="openCustomerForm()">＋ Customer</button>'+
          '<button class="btn" onclick="openSupplierForm()">＋ Supplier</button>'+
        '</div>'+
      '</div></div>'+
    '</div>';
}
window.viewDashboard=viewDashboard;

function kpiCard(label,value,sub,opts){
  opts=opts||{};
  return `<div class="kpi"><div class="kpi-label">${esc(label)}</div><div class="kpi-value" style="${opts.small?'font-size:17px':''}">${esc(value)}</div>${sub?'<div class="kpi-sub">'+esc(sub)+'</div>':''}</div>`;
}

function currentKpiPrefs(){
  const stored=arr(db.kpiPrefs);

  if(pref&&Array.isArray(pref.keys)&&pref.keys.length)return pref.keys;
  return ['purchases','payable','chequesDue','bounced','cash','expenses'];
}

function saveKpiPicker(){
  const selected=Array.from(document.querySelectorAll('.kpi-pick:checked')).map(el=>el.value);

function exportCollectionCSV(collection,name){
  const items=arr(db[collection]);
  if(!items.length){toast('No data','warn');return;}
  const keys=Array.from(new Set(items.flatMap(o=>Object.keys(o))));
  const headers=keys;
  const rows=items.map(o=>keys.map(k=>{
    const v=o[k];
    if(v===null||v===undefined)return'';
    if(typeof v==='object')return JSON.stringify(v);
    return v;
  }));
  download((name||collection)+'_'+today()+'.csv',toCSV(headers,rows),'text/csv');
  toast('Exported '+items.length+' rows','success');
}

/* ─────────────────────────────────────────────────────────────────────────────
   SOFT DELETE (Trash helper)
   ───────────────────────────────────────────────────────────────────────────── */
function softDelete(collection,id,label){
  if(!Array.isArray(db[collection]))return false;
  const idx=db[collection].findIndex(x=>x.id===id);
  if(idx===-1)return false;
  const item=db[collection][idx];
  if(!Array.isArray(db.trash))db.trash=[];
  db.trash.push({
    id:uid(),
    originalCollection:collection,
    item:JSON.parse(JSON.stringify(item)),
    label:label||item.name||item.category||'',
    deletedAt:nowISO(),
    deletedBy:(currentUser&&currentUser.email)||'system'
  });
  db[collection].splice(idx,1);
  logAct('Delete '+collection,collection,id,label||'');
  return true;
}
window.softDelete=softDelete;

  ev.preventDefault();

  const data={
    date:f.pDate.value||today(),
    supplierId:f.pSupplier.value,

    categoryId:f.pCat.value||null,
    amount:num(f.pAmount.value),

  };
  if(!data.supplierId){toast('Select supplier','error');return;}
  if(data.amount<=0){toast('Enter amount','error');return;}

    const before=JSON.parse(JSON.stringify(old));
    Object.assign(old,data,{updatedAt:nowISO()});
    trackVersion('purchases',id,'Update',before,old);

function saveCheque(ev){
  ev.preventDefault();
  if(!canWrite()){toast('Read-only mode','error');return;}
  const f=ev.target,id=f.dataset.id;
  const cust=arr(db.customers).find(c=>c.id===f.ccCust.value);
  const data={
    customerId:f.ccCust.value,
    customerName:cust?cust.name:'',
    chequeNo:f.ccNo.value.trim(),
    bank:f.ccBank.value.trim(),
    categoryId:f.ccCat.value||null,
    date:f.ccDate.value||today(),
    dueDate:f.ccDue.value||null,
    amount:num(f.ccAmount.value),
    chequeType:f.ccType.value,
    status:(id&&arr(db.customerCheques).find(x=>x.id===id).status)||'In Hand'
  };
  if(!data.customerId||!data.chequeNo){toast('Customer and cheque no required','error');return;}
  if(data.amount<=0){toast('Enter amount','error');return;}
  if(id){
    Object.assign(arr(db.customerCheques).find(x=>x.id===id),data,{updatedAt:nowISO()});
    logAct('Update Cheque','Cheque',id,data.chequeNo);
  }else{
    const cid=uid();
    db.customerCheques.push(Object.assign({id:cid,createdAt:nowISO()},data));
    logAct('Add Cheque','Cheque',cid,data.chequeNo+' • '+money(data.amount));
  }
  save();closeModal();render();toast('✅ Cheque saved','success');
}

function saveBulkCheques(){
  if(!canWrite()){toast('Read-only mode','error');return;}
  const rows=Array.from(document.querySelectorAll('.bulk-cheque-row'));
  let saved=0,total=0;
  const byCustomer={};
  rows.forEach(r=>{
    const cust=r.querySelector('.bk-cust').value;
    const no=r.querySelector('.bk-no').value.trim();
    const bank=r.querySelector('.bk-bank').value.trim();
    const date=r.querySelector('.bk-date').value;
    const amt=num(r.querySelector('.bk-amt').value);
    if(!cust||!no||amt<=0)return;
    const custObj=arr(db.customers).find(c=>c.id===cust);
    const ch={
      id:uid(),customerId:cust,customerName:custObj?custObj.name:'',
      chequeNo:no,bank:bank,date:date||today(),
      dueDate:shiftDate(date||today(),num((db.settings||{}).defaultChequeDays||30)),
      amount:amt,chequeType:'Crossed',status:'In Hand',createdAt:nowISO()
    };
    db.customerCheques.push(ch);
    if(!byCustomer[cust])byCustomer[cust]={name:custObj?custObj.name:'',amount:0,count:0};
    byCustomer[cust].amount+=amt;byCustomer[cust].count++;
    total+=amt;saved++;
  });
  // Create one receipt per customer
  Object.keys(byCustomer).forEach(cid=>{
    const g=byCustomer[cid];
    if(!Array.isArray(db.receipts))db.receipts=[];
    db.receipts.push({
      id:uid(),customerId:cid,customerName:g.name,date:today(),
      method:'Cheque',amount:g.amount,chequeCount:g.count,
      notes:'Bulk entry',createdAt:nowISO()
    });
  });
  if(!saved){toast('No valid rows','error');return;}
  logAct('Bulk Cheque Entry','Cheque',null,saved+' cheques • '+money(total));
  save();closeModal();render();toast('✅ '+saved+' cheques saved','success');
}
window.saveBulkCheques=saveBulkCheques;

function saveSupplierPayment(ev){
  ev.preventDefault();
  if(!canWrite()){toast('Read-only mode','error');return;}
  const f=ev.target;
  const sid=f.dataset.supplier||(f.pSupplier?f.pSupplier.value:'');
  if(!sid){toast('Select supplier','error');return;}
  const amount=num(f.pAmount.value);
  if(amount<=0){toast('Enter amount','error');return;}
  const data={
    id:uid(),supplierId:sid,
    purchaseId:f.pPurchase?f.pPurchase.value||null:null,
    date:f.pDate.value||today(),
    amount,method:f.pMethod.value,
    reference:f.pRef.value.trim(),
    notes:f.pNotes.value.trim(),
    reversed:false,
    createdAt:nowISO(),
    createdBy:(currentUser&&currentUser.email)||'system'
  };
  if(!Array.isArray(db.payments))db.payments=[];
  db.payments.push(data);
  if(data.purchaseId)applyPaymentToPurchase(data.purchaseId,amount);
  if(!Array.isArray(db.journals))db.journals=[];
  db.journals.push({
    id:uid(),date:data.date,reference:'PAY-'+data.id.slice(-4),
    entityType:'supplier',entityId:sid,
    debit:amount,credit:0,description:'Payment to supplier',createdAt:nowISO()
  });
  trackVersion('payments',data.id,'Create',null,data);
  logAct('Add Payment','Supplier',sid,money(amount)+' via '+data.method);
  save();closeModal();render();
  toast('✅ Payment '+money(amount)+' recorded','success');
  setTimeout(()=>showPaymentSlip(data.id),250);
}
window.saveSupplierPayment=saveSupplierPayment;

function applyPaymentToPurchase(purchaseId,amount){
  const pur=arr(db.purchases).find(p=>p.id===purchaseId);
  if(!pur)return;
  pur.paidAmount=num(pur.paidAmount)+amount;
  pur.fullyPaid=pur.paidAmount>=num(pur.amount)-0.01;
}

function reversePayment(id){
  if(!canWrite())return;
  const p=arr(db.payments).find(x=>x.id===id);
  if(!p)return;
  if(p.reversed){toast('Already reversed','warn');return;}
  if(!confirm('Reverse this payment of '+money(p.amount)+'?\n\nAn offsetting journal will be created.'))return;
  const reason=prompt('Reason for reversal:');
  if(reason===null)return;
  p.reversed=true;p.reversedAt=nowISO();p.reverseReason=reason||'';
  p.reversedBy=(currentUser&&currentUser.email)||'system';
  if(p.purchaseId){
    const pur=arr(db.purchases).find(x=>x.id===p.purchaseId);
    if(pur){
      pur.paidAmount=Math.max(0,num(pur.paidAmount)-num(p.amount));
      pur.fullyPaid=pur.paidAmount>=num(pur.amount)-0.01;
    }
  }
  if(!Array.isArray(db.journals))db.journals=[];
  db.journals.push({
    id:uid(),date:today(),reference:'REV-'+p.id.slice(-4),
    entityType:'supplier',entityId:p.supplierId,
    debit:0,credit:num(p.amount),
    description:'Reversal of payment — '+(reason||''),createdAt:nowISO()
  });
  logAct('Reverse Payment','Supplier',p.supplierId,money(p.amount)+' — '+(reason||''));
  save();render();toast('Payment reversed','warn');
}
window.reversePayment=reversePayment;

function saveBatch(ev){
  ev.preventDefault();
  const f=ev.target;
  const ids=Array.from(document.querySelectorAll('.batch-pay:checked')).map(el=>el.value);
  if(!ids.length){toast('Select at least one payment','error');return;}
  const bid=uid();
  const batch={
    id:bid,bankAccountId:f.bBank.value,date:f.bDate.value||today(),
    paymentIds:ids,
    total:ids.reduce((a,id)=>a+num((arr(db.payments).find(p=>p.id===id)||{}).amount),0),
    createdAt:nowISO()
  };
  if(!Array.isArray(db.paymentBatches))db.paymentBatches=[];
  db.paymentBatches.push(batch);
  ids.forEach(id=>{const p=arr(db.payments).find(x=>x.id===id);if(p)p.batchId=bid;});
  logAct('Create Payment Batch','Payment',bid,ids.length+' payments • '+money(batch.total));
  save();closeModal();render();toast('📦 Batch created','success');
}

function bankObj(id){return arr(db.bankAccounts).find(b=>b.id===id)||null;}
function bankLogo(name){
  if(!name)return'🏦';
  const n=name.toLowerCase();
  if(n.includes('commercial'))return'🏦';
  if(n.includes('sampath'))return'🏛';
  if(n.includes('hnb')||n.includes('hatton'))return'🏢';
  if(n.includes('seylan'))return'🏬';
  if(n.includes('peoples'))return'🏦';
  if(n.includes('boc')||n.includes('bank of ceylon'))return'🏛';
  return'🏦';
}
window.bankObj=bankObj;window.bankLogo=bankLogo;

function bankBalance(id){
  const b=bankObj(id);if(!b)return 0;
  const opening=num(b.openingBalance);
  const txns=arr(db.bankTransactions).filter(t=>t.bankAccountId===id);
  const deposits=sum(txns.filter(t=>t.type==='deposit'),'amount');
  const withdrawals=sum(txns.filter(t=>t.type==='withdrawal'),'amount');
  const fees=sum(arr(db.bankFees).filter(f=>f.bankAccountId===id),'amount');
  return opening+deposits-withdrawals-fees;
}
window.bankBalance=bankBalance;

function generateLeaves(bookId){
  const book=arr(db.chequeBooks).find(x=>x.id===bookId);if(!book)return;
  if(book.leafGenerated){toast('Leaves already generated','warn');return;}
  if(!confirm('Generate '+((book.endNo-book.startNo)+1)+' cheque leaves?'))return;
  if(!Array.isArray(db.chequeLeaves))db.chequeLeaves=[];
  const pad=num((db.settings||{}).chequeLeafPad||4);
  for(let i=book.startNo;i<=book.endNo;i++){
    db.chequeLeaves.push({
      id:uid(),bookId:book.id,bankAccountId:book.bankAccountId,
      bankName:book.bankName,leafNo:String(i).padStart(pad,'0'),
      status:'Available',createdAt:nowISO()
    });
  }
  book.leafGenerated=true;
  logAct('Generate Cheque Leaves','ChequeBook',bookId,book.bookNo);
  save();render();toast('✅ Leaves generated','success');
}
window.generateLeaves=generateLeaves;

function supplierLedger(supplierId){
  const s=arr(db.suppliers).find(x=>x.id===supplierId);
  if(!s)return{rows:[],balance:0};
  const opening=num(s.openingBalance||0);
  const purchases=arr(db.purchases).filter(p=>p.supplierId===supplierId).map(p=>({date:p.date,type:'Purchase',ref:p.invoiceNo||'',debit:num(p.amount),credit:0,description:p.description||''}));
  const payments=arr(db.payments).filter(p=>p.supplierId===supplierId).map(p=>({date:p.date,type:p.reversed?'Payment (reversed)':'Payment',ref:p.reference||'',debit:0,credit:num(p.amount),isReversal:p.reversed,description:p.method||''}));
  const returns=arr(db.supplierReturns).filter(r=>r.supplierId===supplierId).map(r=>({date:r.date,type:'Credit Note',ref:r.reference||'',debit:0,credit:num(r.amount),description:r.description||''}));
  const journals=arr(db.journals).filter(j=>j.entityType==='supplier'&&j.entityId===supplierId).map(j=>({date:j.date,type:'Journal',ref:j.reference||'',debit:num(j.debit),credit:num(j.credit),description:j.description||''}));
  const all=[...purchases,...payments,...returns,...journals].sort((a,b)=>a.date<b.date?-1:1);
  let bal=opening;
  const rows=all.map(r=>{bal+=r.debit-r.credit;return{...r,balance:bal};});
  return{rows,opening,balance:bal};
}
window.supplierLedger=supplierLedger;

function customerLedger(customerId){
  const c=arr(db.customers).find(x=>x.id===customerId);
  if(!c)return{rows:[]};
  const cheques=arr(db.customerCheques).filter(x=>x.customerId===customerId).map(ch=>({
    date:ch.date,type:ch.status||'Cheque',chequeId:ch.id,
    ref:ch.chequeNo||'',status:ch.status,amount:num(ch.amount)
  }));
  const settlements=arr(db.chequeSettlements).filter(s=>s.customerId===customerId).map(s=>({
    date:s.date,type:'Recovery',chequeId:s.chequeId,
    ref:s.reference||'',status:'Recovered',amount:num(s.amount)
  }));
  return{rows:[...cheques,...settlements].sort((a,b)=>a.date<b.date?1:-1)};
}

/* ═══════════════════════════════════════════════════════════════════════════
   AGING
   ═══════════════════════════════════════════════════════════════════════════ */
function supplierAging(supplierId){
  const buckets=[30,60,90];const s=db.settings||{};
  if(Array.isArray(s.supplierAgingBuckets))buckets.splice(0,3,...s.supplierAgingBuckets);
  const b1=buckets[0],b2=buckets[1],b3=buckets[2];
  const today0=today();
  const purchases=arr(db.purchases).filter(p=>p.supplierId===supplierId);
  const out={current:0,d30:0,d60:0,d90:0,total:0};
  purchases.forEach(p=>{
    const bal=num(p.amount)-num(p.paidAmount);
    if(bal<=0)return;
    const due=p.dueDate||p.date;
    const age=daysBetween(due,today0);
    if(age<=0)out.current+=bal;
    else if(age<=b1)out.current+=bal;
    else if(age<=b2)out.d30+=bal;
    else if(age<=b3)out.d60+=bal;
    else out.d90+=bal;
    out.total+=bal;
  });
  return out;
}
window.supplierAging=supplierAging;

function customerAging(customerId){
  const buckets=[30,60,90];const s=db.settings||{};
  if(Array.isArray(s.supplierAgingBuckets))buckets.splice(0,3,...s.supplierAgingBuckets);
  const [b1,b2,b3]=buckets;
  const today0=today();
  const bounced=arr(db.customerCheques).filter(c=>c.customerId===customerId&&c.status==='Bounced');
  const out={current:0,d30:0,d60:0,d90:0,total:0};
  bounced.forEach(c=>{
    const age=daysBetween(c.bouncedDate||c.date,today0);
    const amt=num(c.amount);
    if(age<=b1)out.current+=amt;
    else if(age<=b2)out.d30+=amt;
    else if(age<=b3)out.d60+=amt;
    else out.d90+=amt;
    out.total+=amt;
  });
  return out;
}
window.customerAging=customerAging;

function globalAging(){
  const agg={current:0,d30:0,d60:0,d90:0,total:0};
  arr(db.suppliers).forEach(s=>{

function viewBudgets(){
  const rows=arr(db.budgets);
  const thisMonth=today().slice(0,7);
  const spentByCat={};
  arr(db.expenses).filter(e=>inMonth(e.date,thisMonth)).forEach(e=>{
    const cat=e.category||'Uncategorized';
    spentByCat[cat]=(spentByCat[cat]||0)+num(e.amount);
  });
  const totalBudget=sum(rows,'amount');
  const totalSpent=Object.values(spentByCat).reduce((a,b)=>a+b,0);

  return '<div class="kpi-strip">'+
    kpiCard('Budgeted',money(totalBudget),rows.length+' categories',{small:true})+
    kpiCard('Spent (Month)',money(totalSpent),'',{small:true})+
    kpiCard('Remaining',money(totalBudget-totalSpent),'',{small:true})+
  '</div>'+
  '<div class="card">'+
    '<div class="card-head"><h3>💰 Budget Tracker</h3>'+
      '<button class="btn primary" onclick="openBudgetForm()">＋ Set Budget</button>'+
    '</div>'+
    (rows.length?rows.map(b=>{
      const spent=spentByCat[b.category]||0;
      const pct=b.amount>0?Math.min(100,Math.round((spent/b.amount)*100)):0;
      const color=pct>=100?'var(--red)':pct>=80?'var(--amber)':'var(--green)';
      return '<div class="budget-card">'+
        '<div class="budget-head">'+
          '<div class="budget-name">'+esc(b.category)+'</div>'+
          '<div class="row-flex" style="gap:6px">'+
            '<span class="badge '+(pct>=100?'red':pct>=80?'amber':'green')+'">'+pct+'%</span>'+
            '<button class="btn xs" onclick="openBudgetForm(\''+b.id+'\')">✏️</button>'+
            '<button class="btn xs danger" onclick="deleteBudget(\''+b.id+'\')">🗑</button>'+
          '</div>'+
        '</div>'+
        '<div class="progress-bar"><div style="width:'+pct+'%;background:'+color+'"></div></div>'+
        '<div class="budget-vals"><span>Spent '+money(spent)+'</span><span>Budget '+money(b.amount)+'</span></div>'+
      '</div>';
    }).join(''):'<div class="empty"><div class="empty-ico">💰</div>No budgets set<br><button class="btn primary" style="margin-top:12px" onclick="openBudgetForm()">＋ Set First Budget</button></div>')+
  '</div>';

function openBudgetForm(id){
  const b=id?arr(db.budgets).find(x=>x.id===id):null;
  openModal(b?'✏️ Edit Budget':'➕ Set Budget',
    '<form onsubmit="saveBudget(event)" data-id="'+(b?b.id:'')+'">'+
    '<label class="field">Category <span class="req">*</span><input name="bdCat" required value="'+esc(b?(b.category||''):'')+'" placeholder="Rent, Utilities, Salaries…"></label>'+

    '<div class="form-actions">'+

      '<button type="submit" class="btn primary">Save</button>'+
    '</div></form>');
}

function saveBudget(ev){
  ev.preventDefault();
  if(!canWrite())return;
  const f=ev.target,id=f.dataset.id;
  const data={category:f.bdCat.value.trim(),amount:num(f.bdAmt.value)};
  if(!data.category){toast('Category required','error');return;}
  if(data.amount<=0){toast('Enter amount','error');return;}
  if(id){Object.assign(arr(db.budgets).find(x=>x.id===id),data);}
  else{db.budgets.push(Object.assign({id:uid(),createdAt:nowISO()},data));}
  save();closeModal();render();toast('✅ Budget saved','success');
}
window.saveBudget=saveBudget;

function deleteBudget(id){
  if(!canWrite())return;
  if(!confirm('Delete this budget?'))return;
  db.budgets=arr(db.budgets).filter(b=>b.id!==id);
  save();render();toast('Budget deleted','success');
}
window.deleteBudget=deleteBudget;

/* ═══════════════════════════════════════════════════════════════════════════
   CASH FLOW FORECAST
   ═══════════════════════════════════════════════════════════════════════════ */
function viewCashflow(){
  const today0=today();
  const days=90;
  const inflows=[],outflows=[];
  // Inflows: expected cheque clearings (own leaves issued that are due in future)
  arr(db.chequeLeaves).filter(l=>l.status==='Issued'&&l.dueDate&&l.dueDate>=today0&&l.dueDate<=shiftDate(today0,days)).forEach(l=>{
    inflows.push({date:l.dueDate,amount:num(l.amount||0),label:l.payee||'Cheque '+(l.leafNo||'')});
  });
  // Outflows: purchases due but unpaid
  arr(db.purchases).forEach(p=>{
    const bal=num(p.amount)-num(p.paidAmount);
    if(bal<=0)return;
    const due=p.dueDate||shiftDate(p.date,30);
    if(due>=today0&&due<=shiftDate(today0,days))outflows.push({date:due,amount:bal,label:supName(p.supplierId)+' — '+(p.invoiceNo||'')});
  });
  // Outflows: recurring cheques
  arr(db.recurringCheques).forEach(r=>{
    const next=r.nextDue||r.startDate;
    if(next>=today0&&next<=shiftDate(today0,days))outflows.push({date:next,amount:num(r.amount||0),label:r.description||'Recurring cheque'});
  });

  const allDates=Array.from(new Set([...inflows.map(x=>x.date),...outflows.map(x=>x.date)])).sort();
  // Group by week
  const weeks=[];
  const start=new Date(today0);
  for(let i=0;i<Math.ceil(days/7);i++){
    const wkStart=shiftDate(today0,i*7);
    const wkEnd=shiftDate(today0,(i+1)*7-1);
    const wkIn=inflows.filter(x=>x.date>=wkStart&&x.date<=wkEnd).reduce((a,b)=>a+b.amount,0);
    const wkOut=outflows.filter(x=>x.date>=wkStart&&x.date<=wkEnd).reduce((a,b)=>a+b.amount,0);
    weeks.push({start:wkStart,end:wkEnd,in:wkIn,out:wkOut,net:wkIn-wkOut});
  }
  const totalIn=weeks.reduce((a,b)=>a+b.in,0);
  const totalOut=weeks.reduce((a,b)=>a+b.out,0);
  const maxV=Math.max(1,...weeks.map(w=>Math.max(w.in,w.out)));
  const barW=Math.max(2,Math.round(900/weeks.length/2)-2);
  const chart=weeks.map(w=>{
    const hIn=Math.round((w.in/maxV)*120)||1;
    const hOut=Math.round((w.out/maxV)*120)||1;
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:'+(barW*2+8)+'px">'+
      '<div style="height:130px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center">'+
        '<div style="width:'+barW+'px;height:'+hIn+'px;background:var(--green);border-radius:4px 4px 0 0" title="In: '+money(w.in)+'"></div>'+
      '</div>'+
      '<div style="height:130px;display:flex;flex-direction:column;align-items:center">'+
        '<div style="width:'+barW+'px;height:'+hOut+'px;background:var(--red);border-radius:0 0 4px 4px" title="Out: '+money(w.out)+'"></div>'+
      '</div>'+
      '<div class="lbl">W'+(weeks.indexOf(w)+1)+'</div>'+
      '<div class="lbl" style="font-weight:700">'+fmtCompact(w.net)+'</div>'+
    '</div>';
  }).join('');

  const events=[...inflows.map(x=>({...x,dir:'in'})),...outflows.map(x=>({...x,dir:'out'}))].sort((a,b)=>a.date<b.date?-1:1).slice(0,60);

  return '<div class="kpi-strip">'+
    kpiCard('Forecast In (90d)',money(totalIn),'',{small:true})+
    kpiCard('Forecast Out (90d)',money(totalOut),'',{small:true})+
    kpiCard('Net Position',money(totalIn-totalOut),'',{small:true})+
  '</div>'+
  '<div class="card">'+
    '<div class="card-head"><h3>📈 12-Week Cash Flow Forecast</h3>'+
      '<div class="row-flex small" style="color:var(--text-3)"><span style="color:var(--green)">■ Inflows</span> <span style="color:var(--red)">■ Outflows</span></div>'+
    '</div>'+
    '<div class="card-body"><div style="display:flex;align-items:flex-end;gap:8px;overflow-x:auto;padding:8px 0">'+chart+'</div></div>'+
  '</div>'+
  '<div class="card">'+
    '<div class="card-head"><h3>📋 Upcoming Events (next 90 days)</h3></div>'+
    '<div class="table-wrap"><table><thead><tr>'+
      '<th>Date</th><th>Direction</th><th>Description</th><th class="num">Amount</th>'+
    '</tr></thead><tbody>'+
    (events.length?events.map(e=>'<tr>'+
      '<td>'+dateFmt(e.date)+'</td>'+
      '<td>'+(e.dir==='in'?'<span class="badge green">Inflow</span>':'<span class="badge red">Outflow</span>')+'</td>'+
      '<td class="small">'+esc(e.label)+'</td>'+
      '<td class="num"><strong style="color:'+(e.dir==='in'?'var(--green)':'var(--red)')+'">'+(e.dir==='in'?'+':'-')+moneyPlain(e.amount)+'</strong></td>'+
    '</tr>').join(''):emptyRow(4,'No events in the next 90 days'))+
    '</tbody></table></div>'+
  '</div>';
}
window.viewCashflow=viewCashflow;

/* ═══════════════════════════════════════════════════════════════════════════
   STATEMENT OF ACCOUNT
   ═══════════════════════════════════════════════════════════════════════════ */
function buildStatementHTML(entityType,entityId,from,to){
  const isSup=entityType==='supplier';
  const entity=isSup?arr(db.suppliers).find(s=>s.id===entityId):arr(db.customers).find(c=>c.id===entityId);
  if(!entity)return'<div class="soa"><p>Entity not found.</p></div>';
  const L=isSup?supplierLedger(entityId):customerLedger(entityId);
  const rows=L.rows.filter(r=>{
    if(from&&r.date<from)return false;
    if(to&&r.date>to)return false;
    return true;
  });
  const openBal=isSup?num(entity.openingBalance||0):0;
  let bal=openBal;
  const tbody=rows.map(r=>{
    bal+=(num(r.debit)||0)-(num(r.credit)||0);
    return '<tr>'+
      '<td>'+dateFmt(r.date)+'</td>'+
      '<td>'+esc(r.type||'')+'</td>'+
      '<td class="mono small">'+esc(r.ref||'—')+'</td>'+
      '<td class="small">'+esc(r.description||'')+'</td>'+
      '<td class="num">'+(r.debit?moneyPlain(r.debit):'—')+'</td>'+
      '<td class="num">'+(r.credit?moneyPlain(r.credit):'—')+'</td>'+
      '<td class="num"><strong>'+moneyPlain(bal)+'</strong></td>'+
    '</tr>';
  }).join('');
  const totalDebit=rows.reduce((a,r)=>a+num(r.debit),0);
  const totalCredit=rows.reduce((a,r)=>a+num(r.credit),0);
  return '<div class="soa">'+
    letterheadBlock()+
    '<div class="soa-title" style="text-align:right;margin-bottom:18px"><h1>STATEMENT OF ACCOUNT</h1><div class="sub">'+dateFmt(from||'1970-01-01')+' — '+dateFmt(to||today())+'</div></div>'+
    '<div class="soa-info">'+
      '<div><div class="lbl">'+(isSup?'Supplier':'Customer')+'</div><div class="val"><strong>'+esc(entity.name||'')+'</strong><br>'+esc(entity.phone||'')+'<br>'+esc(entity.address||'')+'</div></div>'+
      '<div><div class="lbl">Account Summary</div><div class="val">Opening: <strong>'+money(openBal)+'</strong><br>Closing: <strong>'+money(bal)+'</strong></div></div>'+
    '</div>'+
    '<table><thead><tr>'+
      '<th>Date</th><th>Type</th><th>Reference</th><th>Description</th>'+
      '<th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th>'+
    '</tr></thead><tbody>'+
    (rows.length?tbody:'<tr><td colspan="7" style="text-align:center;padding:30px;color:#888">No transactions in this period</td></tr>')+
    '</tbody></table>'+
    '<div class="totals"><table>'+
      '<tr><td>Total Debit</td><td class="num">'+money(totalDebit)+'</td></tr>'+
      '<tr><td>Total Credit</td><td class="num">'+money(totalCredit)+'</td></tr>'+
      '<tr><td>Closing Balance</td><td class="num">'+money(bal)+'</td></tr>'+
    '</table></div>'+
    '<div class="foot">'+esc((db.settings||{}).shopName||APP_NAME)+' • Generated '+dateTimeFmt(nowISO())+' • This is a computer-generated statement.</div>'+
  '</div>';
}
window.buildStatementHTML=buildStatementHTML;

function openStatementForm(entityType){
  const opts=(entityType==='supplier'?arr(db.suppliers):arr(db.customers)).map(e=>'<option value="'+e.id+'">'+esc(e.name)+'</option>').join('');
  const defFrom=shiftDate(today(),-90);
  openModal('📄 Statement of Account',
    '<form onsubmit="runStatement(event,\''+entityType+'\')">'+
    '<label class="field">'+ (entityType==='supplier'?'Supplier':'Customer') +' <span class="req">*</span><select name="soEnt" required><option value="">— Select —</option>'+opts+'</select></label>'+
    '<div class="form-grid" style="margin-top:12px">'+
      '<label class="field">From<input name="soFrom" type="date" value="'+defFrom+'"></label>'+
      '<label class="field">To<input name="soTo" type="date" value="'+today()+'"></label>'+
    '</div>'+
    '<div class="form-actions">'+
      '<button type="button" class="btn" data-action="close-modal">Cancel</button>'+
      '<button type="button" class="btn" onclick="runStatement(event,\''+entityType+'\',true)">👁 Preview</button>'+
      '<button type="submit" class="btn primary">🖨 Generate</button>'+
    '</div></form>');
}
window.openStatementForm=openStatementForm;

function runStatement(ev,entityType,previewOnly){
  if(ev)ev.preventDefault();
  const form=document.querySelector('.modal-body form')||document.querySelector('form');
  if(!form)return;
  const ent=form.soEnt.value,from=form.soFrom.value,to=form.soTo.value;
  if(!ent){toast('Select entity','error');return;}
  const html=buildStatementHTML(entityType,ent,from,to);
  if(previewOnly){
    closeModal();
    openModal('📄 Statement Preview',
      '<div style="background:#fff;border-radius:10px;max-height:65vh;overflow:auto">'+html+'</div>'+
      '<div class="form-actions no-print">'+
        '<button class="btn" data-action="close-modal">Close</button>'+
        '<button class="btn primary" onclick="closeModal();window._lastStatementHTML&&openPrintWindow(\'Statement of Account\',window._lastStatementHTML)">🖨 Print</button>'+
      '</div>',{wide:true});
    window._lastStatementHTML=html;
  } else {
    window._lastStatementHTML=html;
    closeModal();
    openPrintWindow('Statement of Account',html);
  }
}
window.runStatement=runStatement;

function executeReport(cfg){
  const src=REPORT_SOURCES[cfg.source];
  if(!src)return{result:{rows:[]}};
  let items=[];
  if(cfg.source==='customers'){
    items=arr(db.customers).map(c=>({...c}));
  } else if(cfg.source==='suppliers'){
    items=arr(db.suppliers).map(s=>({...s,balance:supplierOutstanding(s.id)}));
  } else if(cfg.source==='purchases'){
    items=arr(db.purchases).map(p=>({...p,supplierName:supName(p.supplierId),balance:num(p.amount)-num(p.paidAmount)}));
  } else if(cfg.source==='receipts'){
    items=arr(db.receipts).map(r=>({...r}));
  } else if(cfg.source==='customerCheques'){
    items=arr(db.customerCheques).map(c=>({...c}));
  } else if(cfg.source==='payments'){
    items=arr(db.payments).filter(p=>!p.reversed).map(p=>({...p,supplierName:supName(p.supplierId)}));
  } else if(cfg.source==='expenses'){
    items=arr(db.expenses).map(e=>({...e}));
  } else if(cfg.source==='chequeLeaves'){
    items=arr(db.chequeLeaves).map(l=>({...l}));
  }
  // Filters
  if(cfg.filters.from)items=items.filter(x=>(x.date||x.createdAt||'')>=cfg.filters.from);
  if(cfg.filters.to)items=items.filter(x=>(x.date||x.createdAt||'')<=cfg.filters.to);
  if(cfg.filters.search){
    const q=cfg.filters.search.toLowerCase();
    items=items.filter(x=>Object.values(x).some(v=>String(v||'').toLowerCase().includes(q)));
  }
  const valueKey=cfg.valueKey||'amount';
  if(cfg.groupBy&&cfg.groupBy!=='none'){
    const buckets={};
    items.forEach(it=>{
      let key;
      if(cfg.groupBy==='month')key=(it.date||it.createdAt||'').slice(0,7)||'—';
      else if(cfg.groupBy==='year')key=(it.date||it.createdAt||'').slice(0,4)||'—';
      else key=it[cfg.groupBy]||'—';
      if(!buckets[key])buckets[key]={_key:key,_count:0,_sum:0,_vals:[]};
      buckets[key]._count++;
      buckets[key]._sum+=num(it[valueKey]);
      buckets[key]._vals.push(num(it[valueKey]));
    });
    const rows=Object.values(buckets).sort((a,b)=>a._key<b._key?-1:1).map(b=>{
      let value;
      if(cfg.aggregate==='count')value=b._count;
      else if(cfg.aggregate==='avg')value=b._vals.length?b._sum/b._vals.length:0;
      else if(cfg.aggregate==='max')value=Math.max(...b._vals);
      else if(cfg.aggregate==='min')value=Math.min(...b._vals);
      else value=b._sum;
      return{_key:b._key,_count:b._count,_value:value};
    });
    return{result:{rows,grouped:true},valueKey};
  }
  return{result:{rows:items,grouped:false},valueKey};
}
window.executeReport=executeReport;

function renderReportChart(exec){
  const cfg=reportCfg;
  if(exec.result.grouped){
    const items=exec.result.rows.slice(0,24).map(r=>({label:String(r._key||'—').slice(0,10),value:r._value}));
    if(!items.length)return'<div class="empty">No data</div>';
    const maxV=Math.max(1,...items.map(i=>i.value));
    if(cfg.chartType==='line'){
      const w=900,h=240,pad=30;
      const step=items.length>1?(w-pad*2)/(items.length-1):0;
      const pts=items.map((it,i)=>((pad+i*step)+','+(h-pad-(it.value/maxV)*(h-pad*2)))).join(' ');
      return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:260px"><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="'+pts+'"/>'+
        items.map((it,i)=>{const x=pad+i*step,y=h-pad-(it.value/maxV)*(h-pad*2);return '<circle cx="'+x+'" cy="'+y+'" r="4" fill="var(--accent)"/><text x="'+x+'" y="'+(h-8)+'" font-size="10" fill="var(--text-3)" text-anchor="middle">'+esc(it.label)+'</text>';}).join('')+
      '</svg>';
    }
    return '<div style="display:flex;align-items:flex-end;gap:4px;height:200px;overflow-x:auto;padding:4px">'+
      items.map(it=>{
        const h=Math.max(2,Math.round((it.value/maxV)*160));
        return '<div style="flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="font-size:10px;font-weight:700">'+fmtCompact(it.value)+'</div><div style="width:100%;max-width:40px;height:'+h+'px;background:linear-gradient(180deg,var(--accent),var(--accent-dark));border-radius:5px 5px 0 0"></div><div style="font-size:10px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px;text-align:center">'+esc(it.label)+'</div></div>';
      }).join('')+'</div>';
  }
  const months=lastMonths(12);
  const values=months.map(m=>sum(exec.result.rows.filter(r=>inMonth(r.date||r.createdAt||'',m)),exec.valueKey));
  const maxV=Math.max(1,...values);
  if(cfg.chartType==='line'){
    const w=900,h=240,pad=30;
    const step=(w-pad*2)/(months.length-1);
    const pts=months.map((m,i)=>((pad+i*step)+','+(h-pad-(values[i]/maxV)*(h-pad*2)))).join(' ');
    return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:260px"><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="'+pts+'"/>'+
      months.map((m,i)=>{const x=pad+i*step,y=h-pad-(values[i]/maxV)*(h-pad*2);return '<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="var(--accent)"/><text x="'+x+'" y="'+(h-8)+'" font-size="10" fill="var(--text-3)" text-anchor="middle">'+esc(monthLabel(m))+'</text>';}).join('')+
    '</svg>';
  }
  return '<div style="display:flex;align-items:flex-end;gap:4px;height:200px;padding:4px">'+
    months.map((m,i)=>{
      const h=Math.max(2,Math.round((values[i]/maxV)*160));
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="font-size:10px;font-weight:700">'+fmtCompact(values[i])+'</div><div style="width:100%;max-width:36px;height:'+h+'px;background:linear-gradient(180deg,var(--accent),var(--accent-dark));border-radius:5px 5px 0 0"></div><div style="font-size:10px;color:var(--text-3)">'+esc(monthLabel(m))+'</div></div>';
    }).join('')+'</div>';
}
