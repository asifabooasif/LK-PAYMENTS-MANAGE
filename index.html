function toggleSwitch(el, name){ const on = !el.classList.contains('on'); el.classList.toggle('on', on); const cb = el.querySelector('input[type=checkbox]'); if(cb) cb.checked = on; }
window.toggleSwitch = toggleSwitch;
function saveSettings(e){
  e.preventDefault();
  const f = e.target, s = db.settings;
  const $ = n => { const el = f.querySelector('[name="' + n + '"]'); return el ? el.value : undefined; };
  const $cb = n => { const el = f.querySelector('[name="' + n + '"]'); return el ? el.checked : undefined; };
  const set = (k, n) => { if($(n) !== undefined) s[k] = $(n); };
  set('shopName','st_shopName'); set('shopTagline','st_shopTagline'); set('logoText','st_logoText'); set('taxId','st_taxId');
  set('businessPhone','st_businessPhone'); set('businessEmail','st_businessEmail'); set('businessAddress','st_businessAddress');
  set('uiTheme','st_uiTheme'); if($('st_fontSize') !== undefined) s.fontSize = num($('st_fontSize')) || 13.5;
  set('currency','st_currency'); set('currencyPosition','st_currencyPosition');
  if($('st_decimalPlaces') !== undefined) s.decimalPlaces = num($('st_decimalPlaces'));
  set('defaultBank','st_defaultBank');
  if($('st_defaultChequeDays') !== undefined) s.defaultChequeDays = num($('st_defaultChequeDays'));
  if($('st_defaultSupplierCreditDays') !== undefined) s.defaultSupplierCreditDays = num($('st_defaultSupplierCreditDays'));
  if($('st_defaultSupplierCreditLimit') !== undefined) s.defaultSupplierCreditLimit = num($('st_defaultSupplierCreditLimit'));
  const b1 = num($('st_ageB1')), b2 = num($('st_ageB2')), b3 = num($('st_ageB3'));
  if(b1 && b2 && b3 && b1 < b2 && b2 < b3) s.supplierAgingBuckets = [b1, b2, b3];
  if($('st_defaultCustomerCreditDays') !== undefined) s.defaultCustomerCreditDays = num($('st_defaultCustomerCreditDays'));
  if($('st_defaultCustomerCreditLimit') !== undefined) s.defaultCustomerCreditLimit = num($('st_defaultCustomerCreditLimit'));
  if($cb('st_notifEnabled') !== undefined) s.notifEnabled = $cb('st_notifEnabled');
  if($cb('st_notifOverdueCheques') !== undefined) s.notifOverdueCheques = $cb('st_notifOverdueCheques');
  if($cb('st_notifBounced') !== undefined) s.notifBounced = $cb('st_notifBounced');
  if($cb('st_notifAging90') !== undefined) s.notifAging90 = $cb('st_notifAging90');
  if($('st_notifThresholdAmount') !== undefined) s.notifThresholdAmount = num($('st_notifThresholdAmount'));
  if($cb('st_autoSave') !== undefined) s.autoSave = $cb('st_autoSave');
  if($cb('st_confirmBeforeDelete') !== undefined) s.confirmBeforeDelete = $cb('st_confirmBeforeDelete');
  if($cb('st_enableActivityLog') !== undefined) s.enableActivityLog = $cb('st_enableActivityLog');
  if($('st_undoWindow') !== undefined) s.undoWindowSeconds = num($('st_undoWindow'));
  logAct('Update Settings','System',null,'');
  save(); applySettings(); render(); toast('Settings saved');
}
window.saveSettings = saveSettings;
function resetAllSettings(){ if(!confirm('Reset ALL settings?')) return; db.settings = defaultSettings(); save(); applySettings(); render(); toast('Reset'); }
window.resetAllSettings = resetAllSettings;

/* ---------- USER ACCESS ---------- */
async function addAllowedEmail(){
  if(currentUserRole !== 'admin'){ toast('Admin only','error'); return; }
  const el = document.getElementById('newAllowedEmail');
  const roleEl = document.getElementById('newUserRole');
  const email = (el?.value || '').trim().toLowerCase();
  const role = roleEl?.value || 'editor';
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Valid email required','error'); return; }
  if(email === ADMIN_EMAIL.toLowerCase()){ toast('Already admin','info'); return; }
  let list = [];
  try{ const d = await firestore.doc(ACCESS_DOC_PATH).get(); list = d.exists ? (d.data().allowedEmails || []) : [ADMIN_EMAIL]; }catch(e){ list = (db.allowedEmails || []).slice(); }
  if(list.map(e => String(e).toLowerCase().trim()).includes(email)){ toast('Already authorized','warn'); return; }
  const perms = { ...(db.userPerms || {}), [email]: { role } };
  const newList = [...list, email];
  const ok = await saveAccessList(newList, perms, 'Added ' + email + ' as ' + role);
  if(!ok) return;
  save(); render(); toast('User added: ' + email, 'ok');
  if(el) el.value = '';
}
window.addAllowedEmail = addAllowedEmail;
async function removeAllowedEmail(email){
  if(currentUserRole !== 'admin'){ toast('Admin only','error'); return; }
  if(String(email).toLowerCase() === ADMIN_EMAIL.toLowerCase()){ toast('Cannot remove admin','error'); return; }
  if(!confirm('Remove access for ' + email + '?')) return;
  let list = [];
  try{ const d = await firestore.doc(ACCESS_DOC_PATH).get(); list = d.exists ? (d.data().allowedEmails || []) : []; }catch(e){ list = (db.allowedEmails || []).slice(); }
  const newList = list.filter(e => String(e).toLowerCase().trim() !== String(email).toLowerCase().trim());
  const perms = { ...(db.userPerms || {}) }; delete perms[email.toLowerCase()];
  const ok = await saveAccessList(newList, perms, 'Removed ' + email);
  if(!ok) return;
  save(); render(); toast('Removed: ' + email);
}
window.removeAllowedEmail = removeAllowedEmail;

    'sort': () => setSort(el.dataset.tbl, el.dataset.key),
    'toggle-notif': () => toggleNotif(),
    'clear-notif': () => markAllNotifRead(),
    'toggle-fab': () => toggleFab(),
    'signout': () => handleSignOut(),
    'force-sync': () => { pushToFirestore().then(() => toast('Synced','info')); },
    'force-reload': async () => { if(!confirm('Reload from cloud? Unsaved local changes will be lost.')) return; await loadFromFirestore(); applySettings(); render(); toast('Reloaded','info'); },

    'supplier-aging': () => showSupplierAging(id),
    'add-purchase': () => openPurchaseForm(),
    'edit-purchase': () => openPurchaseForm(id),
    'del-purchase': () => deletePurchase(id),
    'add-cat': () => openCatForm(),
    'edit-cat': () => openCatForm(id),
    'del-cat': () => deleteCat(id),
    'add-receipt': () => openReceiptForm(),
    'view-receipt-batch': () => viewReceiptBatch(id),

    'edit-cc': () => openCCForm(id),
    'del-cc': () => deleteCC(id),
    'clear-cc': () => clearCheque(id, false),
    'bounce-cc': () => bounceCheque(id, false),
    'unbounce-cc': () => unbounceCC(id),
    'add-own': () => openOwnForm(),
    'edit-own': () => openOwnForm(id),
    'del-own': () => deleteOwn(id),
    'clear-own': () => clearCheque(id, true),
    'bounce-own': () => bounceCheque(id, true),
    'unbounce-own': () => unbounceOwn(id),
    'add-cbook': () => openChequeBookForm(),
    'edit-cbook': () => openChequeBookForm(id),
    'del-cbook': () => deleteChequeBook(id),
    'add-bank': () => openBankForm(),
    'edit-bank': () => openBankForm(id),
    'del-bank': () => deleteBank(id),
    'add-payment-nav': () => { toggleFab(); ui.view = 'payments'; render(); },
    'view-payment': () => viewPayment(id),

    'edit-expense': () => openExpenseForm(id),
    'del-expense': () => deleteExpense(id),
    'add-journal': () => openJournalForm(),
    'del-journal': () => deleteJournal(id),
    'backup-json': () => { download('lankashoe_' + today() + '.json', JSON.stringify(buildBackup(), null, 2), 'application/json'); toast('Downloaded'); },
    'csv': () => exportCSV(el.dataset.set),
    'import-json': () => importBackup(),

  };
  if(actions[a]){ e.preventDefault(); actions[a](); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeModal(); document.getElementById('notifPanel')?.classList.remove('open'); document.getElementById('fabMenu')?.classList.remove('open'); document.getElementById('fabBtn')?.classList.remove('open'); }
  if(e.key === 'F2'){ e.preventDefault(); ui.view = 'settings'; render(); }
});

/* ============================================================
   BOOT — login wiring happens BEFORE Firebase init
   ============================================================ */
(function initialDisplay(){
  try{
    const overlay = document.getElementById('loginOverlay');
    const appRoot = document.getElementById('appRoot');
    const fab = document.getElementById('fabBtn');
    if(overlay) overlay.classList.remove('hidden');
    if(appRoot) appRoot.style.display = 'none';
    if(fab) fab.style.display = 'none';
  }catch(e){ console.error('Initial display:', e); }
})();

function attachLoginButton(){
  const btn = document.getElementById('googleSignInBtn');
  if(btn && !btn._wired){
    btn._wired = true;
    btn.addEventListener('click', handleSignIn);
    console.log('[boot] login button wired');
  }
}
attachLoginButton();

function addFallbackButtons(){
  const note = document.querySelector('.login-note');
  if(!note) return;
  if(!document.getElementById('offlineBtn')){
    const ob = document.createElement('button');
    ob.id = 'offlineBtn';
    ob.className = 'google-btn';
    ob.style.marginTop = '14px';
    ob.innerHTML = '⚠ Continue in Offline Mode';
    ob.onclick = enterOfflineMode;
    note.parentNode.insertBefore(ob, note);
  }
  if(!document.getElementById('hardResetBtn')){
    const rb = document.createElement('button');
    rb.id = 'hardResetBtn';
    rb.className = 'google-btn';
    rb.style.marginTop = '10px';
    rb.style.background = 'transparent';
    rb.style.color = 'var(--text-4)';
    rb.style.fontSize = '12px';
    rb.innerHTML = '🔄 Hard Reset (clear cache)';
    rb.onclick = () => { if(!confirm('Clear all local data and reload?')) return; try{ localStorage.removeItem('lankashoe_cache'); }catch(e){} location.reload(); };
    note.parentNode.insertBefore(rb, note);
  }
}

(async function boot(){
  try{
    const ok = await initFirebase();
    if(!ok){
      console.warn('[boot] Firebase failed:', firebaseInitError);
      showLoginError('Firebase could not initialize.\n\n' + (firebaseInitError || 'Unknown') + '\n\nYou can still use the app offline below.');
      const btn = document.getElementById('googleSignInBtn');
      if(btn){ btn.disabled = false; btn.style.opacity = '0.55'; }
      addFallbackButtons();
      return;
    }
    console.log('[boot] Firebase ready');
    auth.onAuthStateChanged(function(user){
      try{ onAuthStateChanged(user); }
      catch(e){ console.error('[auth]', e); showLoginError('Auth error: ' + (e.message || String(e))); addFallbackButtons(); }
    });
    console.log('[boot] auth listener attached');
  }catch(e){
    console.error('[boot] fatal:', e);
    showLoginError('Boot error:\n\n' + (e.message || String(e)));
    addFallbackButtons();
  }
})();
</script>
