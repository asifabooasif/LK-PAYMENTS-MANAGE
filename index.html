  /* ═══════════════════════════════════════════════════════════════════════
     FIX 4 — Bank statement improvements
     Replace renderRptBankStatement so it shows:
     - pending (scheduled/approved) cheques too
     - unmatched imported transactions
     - helpful empty state
     ═══════════════════════════════════════════════════════════════════════ */
  function renderRptBankStatementFixed() {
    const f = state.filters.rptBankStatement || {};
    const bankId = f.bankId || (arr(state.data.banks)[0]?.id || '');
    const from = f.from || shiftDate(today(), -30);
    const to = f.to || today();

    const bank = bankId ? bankObj(bankId) : null;
    if (!bank) {
      return reportHeader
        ? reportHeader({ title: '🏦 Bank Statement' }) + '<div class="card"><div class="empty">Select a bank.</div></div>'
        : '<div class="card"><div class="empty">Select a bank.</div></div>';
    }

    /* Opening = openingBalance + all adjustments before `from` - all cleared cheques before `from` */
    let opening = num(bank.openingBalance);
    arr(state.data.bankAdjustments).forEach(a => {
      if (String(a.bankId) !== String(bankId)) return;
      if (a.date >= from) return;
      opening += num(a.signedAmount !== undefined ? a.signedAmount : a.amount);
    });
    arr(state.data.cheques).forEach(c => {
      if (c.bankId !== bankId) return;
      if (c.status !== 'cleared') return;
      const clearedOn = c.clearedAt ? c.clearedAt.slice(0, 10) : c.chequeDate;
      if (clearedOn >= from) return;
      opening -= num(c.amount);
    });

    /* Rows in range */
    const rows = [];

    /* Cleared cheques */
    arr(state.data.cheques).forEach(c => {
      if (c.bankId !== bankId) return;
      if (c.status !== 'cleared') return;
      const on = c.clearedAt ? c.clearedAt.slice(0, 10) : c.chequeDate;
      if (on < from || on > to) return;
      rows.push({
        date: on, type: 'Cleared Cheque', ico: '✓',
        ref: c.chequeNo,
        desc: 'Cheque cleared — ' + (c.payeeName || ''),
        debit: num(c.amount), credit: 0,
        source: 'cheque', sourceId: c.id
      });
    });

    /* Pending cheques (scheduled/approved) — show as info */
    arr(state.data.cheques).forEach(c => {
      if (c.bankId !== bankId) return;
      if (c.status !== 'scheduled' && c.status !== 'approved') return;
      if (c.chequeDate < from || c.chequeDate > to) return;
      rows.push({
        date: c.chequeDate, type: c.status === 'approved' ? 'Approved' : 'Scheduled',
        ico: c.status === 'approved' ? '⏳' : '📅',
        ref: c.chequeNo,
        desc: 'Cheque ' + c.status + ' — ' + (c.payeeName || ''),
        debit: num(c.amount), credit: 0,
        source: 'cheque', sourceId: c.id,
        infoOnly: true
      });
    });

    /* Adjustments */
    arr(state.data.bankAdjustments).forEach(a => {
      if (String(a.bankId) !== String(bankId)) return;
      if (a.date < from || a.date > to) return;
      const signed = num(a.signedAmount !== undefined ? a.signedAmount : a.amount);
      rows.push({
        date: a.date, type: 'Adjustment', ico: '🔧',
        ref: a.reference || '',
        desc: a.reason || 'Adjustment',
        debit: signed < 0 ? Math.abs(signed) : 0,
        credit: signed > 0 ? signed : 0,
        source: 'adjustment', sourceId: a.id
      });
    });

    /* Unmatched imported transactions */
    arr(state.data.bankTransactions).forEach(t => {
      if (t.bankId !== bankId) return;
      if (t.date < from || t.date > to) return;
      if (t.matchState === 'matched') return;
      rows.push({
        date: t.date, type: 'Imported', ico: '📥',
        ref: t.reference || '',
        desc: t.description || 'Imported',
        debit: t.direction === 'debit' ? num(t.amount) : 0,
        credit: t.direction === 'credit' ? num(t.amount) : 0,
        source: 'transaction', sourceId: t.id,
        infoOnly: true
      });
    });

    rows.sort((a, b) => a.date.localeCompare(b.date));

    let running = opening;
    rows.forEach(r => {
      if (r.infoOnly) {
        r.balance = running;
      } else {
        running += r.credit - r.debit;
        r.balance = running;
      }
    });

    const totalDebit  = rows.filter(r => !r.infoOnly).reduce((s, r) => s + r.debit, 0);
    const totalCredit = rows.filter(r => !r.infoOnly).reduce((s, r) => s + r.credit, 0);
    const closing = running;

    const header = (typeof reportHeader === 'function')
      ? reportHeader({
          title: '🏦 Bank Statement — ' + esc(bank.name),
          exportAction: 'rpt-statement-export',
          filters:
            '<label class="field" style="min-width:160px">Bank' +
              '<select id="stBank">' +
                arr(state.data.banks).map(b =>
                  '<option value="' + esc(b.id) + '"' + (bankId === b.id ? ' selected' : '') + '>' + esc(b.name) + '</option>'
                ).join('') +
              '</select>' +
            '</label>' +
            '<label class="field" style="min-width:130px">From' +
              '<input type="date" id="stFrom" value="' + esc(from) + '">' +
            '</label>' +
            '<label class="field" style="min-width:130px">To' +
              '<input type="date" id="stTo" value="' + esc(to) + '">' +
            '</label>'
        })
      : '<div class="card"><div class="card-head"><h3>🏦 Bank Statement — ' + esc(bank.name) + '</h3></div>';

    return header +
      '<div class="kpi-strip">' +
        '<div class="kpi"><div class="k-label">Opening</div>' +
          '<div class="k-value" style="font-size:18px">' + money(opening) + '</div>' +
          '<div class="k-sub">' + dateFmt(from) + '</div></div>' +
        '<div class="kpi"><div class="k-label">Debits</div>' +
          '<div class="k-value" style="font-size:18px;color:var(--red)">' + money(totalDebit) + '</div></div>' +
        '<div class="kpi"><div class="k-label">Credits</div>' +
          '<div class="k-value" style="font-size:18px;color:var(--green)">' + money(totalCredit) + '</div></div>' +
        '<div class="kpi"><div class="k-label">Closing</div>' +
          '<div class="k-value" style="font-size:18px">' + money(closing) + '</div>' +
          '<div class="k-sub">' + dateFmt(to) + '</div></div>' +
      '</div>' +

      (rows.length
        ? '<div class="card">' +
            '<div class="table-wrap"><table>' +
              '<thead><tr>' +
                '<th>Date</th><th>Type</th><th>Reference</th><th>Description</th>' +
                '<th class="num">Debit</th><th class="num">Credit</th>' +
                '<th class="num">Balance</th>' +
              '</tr></thead><tbody>' +
              '<tr style="background:var(--surface-2)">' +
                '<td colspan="6"><strong>Opening Balance</strong></td>' +
                '<td class="num"><strong>' + money(opening) + '</strong></td>' +
              '</tr>' +
              rows.map(r =>
                '<tr' + (r.infoOnly ? ' style="opacity:.7"' : '') + '>' +
                  '<td>' + dateFmt(r.date) + '</td>' +
                  '<td><span class="small">' + r.ico + ' ' + esc(r.type) + '</span>' +
                    (r.infoOnly ? ' <span class="badge amber">Pending</span>' : '') + '</td>' +
                  '<td class="mono small">' + esc(r.ref || '—') + '</td>' +
                  '<td>' + esc(r.desc) + '</td>' +
                  '<td class="num" style="color:var(--red)">' + (r.debit ? money(r.debit) : '') + '</td>' +
                  '<td class="num" style="color:var(--green)">' + (r.credit ? money(r.credit) : '') + '</td>' +
                  '<td class="num"><strong>' + money(r.balance) + '</strong></td>' +
                '</tr>'
              ).join('') +
            '</tbody>' +
            '<tfoot><tr>' +
              '<td colspan="4" style="text-align:right">MOVEMENT</td>' +
              '<td class="num">' + money(totalDebit) + '</td>' +
              '<td class="num">' + money(totalCredit) + '</td>' +
              '<td class="num">' + money(closing) + '</td>' +
            '</tr></tfoot></table></div>' +
          '</div>'
        : '<div class="card"><div class="empty">' +
            '<span class="big">📄</span>' +
            '<strong>No movements in this range.</strong><br><br>' +
            'This bank has opening balance ' + money(opening) + '.<br>' +
            'Cheques appear here once they are <strong>cleared</strong>.<br>' +
            'Scheduled/approved cheques show as <em>pending</em> rows.' +
            '<br><br>' +
            '<button class="btn sm" data-nav="cheques">View cheques →</button> ' +
            '<button class="btn sm" data-action="cheque-new">＋ Write cheque</button> ' +
            '<button class="btn sm" data-action="import-open" data-id="' + esc(bankId) + '">📥 Import statement</button>' +
          '</div></div>');
  }
  window.renderRptBankStatement = renderRptBankStatementFixed;

<!-- ═══════════════════════════════════════════════════════════════════════
     BANK STATEMENT — COMPLETE REWRITE
     Standalone, no external dependencies. Includes bank selector,
     opening balance row, all movements, pending rows, closing balance.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  function renderBankStatementV3() {
    const f = state.filters.rptBankStatement || {};
    const banks = arr(state.data.banks);

    /* ─── No banks yet ─── */
    if (!banks.length) {
      return '<div class="card"><div class="empty">' +
        '<span class="big">🏦</span>' +
        'No banks yet. Add a bank to view statements.' +
        '<div style="margin-top:14px">' +
          '<button class="btn primary" data-nav="banks">Go to Banks</button>' +
        '</div>' +
      '</div></div>';
    }

    /* ─── Bank selection ─── */
    const bankId = f.bankId || banks[0].id;
    const bank = bankObj(bankId);
    if (!bank) {
      return '<div class="card"><div class="empty">Select a bank to view its statement.</div></div>';
    }

    /* ─── Date range ─── */
    const from = f.from || shiftDate(today(), -30);
    const to   = f.to   || today();
    const showPending = f.showPending !== false;

    /* ─── Opening balance = bank opening + movements before `from` ─── */
    let opening = num(bank.openingBalance);

    arr(state.data.bankAdjustments).forEach(a => {
      if (String(a.bankId) !== String(bankId)) return;
      if (a.date >= from) return;
      const signed = num(a.signedAmount !== undefined && a.signedAmount !== null
        ? a.signedAmount
        : (a.direction === 'credit' ? Math.abs(num(a.amount)) : -Math.abs(num(a.amount))));
      opening += signed;
    });

    arr(state.data.cheques).forEach(c => {
      if (c.bankId !== bankId) return;
      if (c.status !== 'cleared') return;
      const clearedOn = c.clearedAt ? c.clearedAt.slice(0, 10) : c.chequeDate;
      if (clearedOn >= from) return;
      opening -= num(c.amount);
    });

    /* ═══════════════════════════════════════════════════════════════════
       BUILD MOVEMENTS LIST
       ═══════════════════════════════════════════════════════════════════ */
    const movements = [];

    /* 1. Cleared cheques (debits) */
    arr(state.data.cheques).forEach(c => {
      if (c.bankId !== bankId) return;
      if (c.status !== 'cleared') return;
      const on = c.clearedAt ? c.clearedAt.slice(0, 10) : c.chequeDate;
      if (on < from || on > to) return;
      movements.push({
        date: on,
        icon: '✓',
        type: 'Cheque Cleared',
        ref: c.chequeNo,
        desc: c.payeeName || '',
        debit: num(c.amount),
        credit: 0,
        source: 'cheque',
        sourceId: c.id,
        sortOrder: 1
      });
    });

    /* 2. Adjustments (debit or credit) */
    arr(state.data.bankAdjustments).forEach(a => {
      if (String(a.bankId) !== String(bankId)) return;
      if (a.date < from || a.date > to) return;
      const signed = num(a.signedAmount !== undefined && a.signedAmount !== null
        ? a.signedAmount
        : (a.direction === 'credit' ? Math.abs(num(a.amount)) : -Math.abs(num(a.amount))));
      movements.push({
        date: a.date,
        icon: '🔧',
        type: signed >= 0 ? 'Adjustment (Cr)' : 'Adjustment (Dr)',
        ref: a.reference || '',
        desc: a.reason || 'Adjustment',
        debit: signed < 0 ? Math.abs(signed) : 0,
        credit: signed > 0 ? signed : 0,
        source: 'adjustment',
        sourceId: a.id,
        sortOrder: 2
      });
    });

    /* 3. Imported bank transactions that are NOT yet matched to a cheque */
    arr(state.data.bankTransactions).forEach(t => {
      if (t.bankId !== bankId) return;
      if (t.date < from || t.date > to) return;
      if (t.matchState === 'matched') return;   /* matched rows would double-count */
      movements.push({
        date: t.date,
        icon: '📥',
        type: 'Imported',
        ref: t.reference || '',
        desc: t.description || 'Imported transaction',
        debit: t.direction === 'debit' ? num(t.amount) : 0,
        credit: t.direction === 'credit' ? num(t.amount) : 0,
        source: 'transaction',
        sourceId: t.id,
        isInfo: true,
        sortOrder: 3
      });
    });

    /* 4. Scheduled + approved cheques (info only — not yet affecting balance) */
    if (showPending) {
      arr(state.data.cheques).forEach(c => {
        if (c.bankId !== bankId) return;
        if (c.status !== 'scheduled' && c.status !== 'approved') return;
        if (c.chequeDate < from || c.chequeDate > to) return;
        movements.push({
          date: c.chequeDate,
          icon: c.status === 'approved' ? '⏳' : '📅',
          type: c.status === 'approved' ? 'Approved (pending)' : 'Scheduled',
          ref: c.chequeNo,
          desc: c.payeeName || '',
          debit: num(c.amount),
          credit: 0,
          source: 'cheque',
          sourceId: c.id,
          isInfo: true,
          sortOrder: 4
        });
      });
    }

    /* Sort by date, then by type order */
    movements.sort((a, b) => {
      const d = a.date.localeCompare(b.date);
      if (d) return d;
      return a.sortOrder - b.sortOrder;
    });

    /* Running balance — info rows don't move it */
    let running = opening;
    movements.forEach(m => {
      if (!m.isInfo) {
        running += m.credit - m.debit;
      }
      m.balance = running;
    });

    const totalDebit  = movements.filter(m => !m.isInfo).reduce((s, m) => s + m.debit, 0);
    const totalCredit = movements.filter(m => !m.isInfo).reduce((s, m) => s + m.credit, 0);
    const closing = running;
    const infoCount = movements.filter(m => m.isInfo).length;

    /* Bank options for the selector */
    const bankOptions = banks.map(b =>
      '<option value="' + esc(b.id) + '"' + (b.id === bank.id ? ' selected' : '') + '>' +
        esc(b.name) +
        (b.accountNo ? ' · ' + esc(b.accountNo) : '') +
      '</option>'
    ).join('');

    /* ═══════════════════════════════════════════════════════════════════
       RENDER
       ═══════════════════════════════════════════════════════════════════ */
    return '' +

<!-- ═══════════════════════════════════════════════════════════════════════
     FINAL EXCEL IMPORT FIX (HNB / Bank Statements)
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  console.log('%c[script] FINAL-IMPORT loaded', 'color:#10b981;font-weight:bold');

  const XLSX_CDN = 'https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js';

  function ensureXLSX() {
    return new Promise((resolve, reject) => {
      if (window.XLSX) return resolve();
      const s = document.createElement('script');
      s.src = XLSX_CDN;
      s.async = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Failed to load Excel library. Please disable AdBlocker.'));
      document.head.appendChild(s);
    });
  }

  function findRealHeaderRow(rows) {
    for (let i = 0; i < Math.min(rows.length, 50); i++) {
      const row = rows[i];
      if (!row || !row.length) continue;
     
      const cells = row.map(c => String(c || '').toLowerCase().trim()).filter(Boolean);
      const hasDate = cells.some(c => c.includes('date'));
      const hasDebit = cells.some(c => c.includes('debit'));
      const hasCredit = cells.some(c => c.includes('credit'));

      // HNB specifically has "Value Date", "Debit", "Credit", "Running Balance"
      if (hasDate && hasDebit && hasCredit) {
        console.log('Found real header row at line ' + (i + 1), row);
        return i;
      }
    }
    console.warn('No header found, using row 0');
    return 0;
  }

  function mapColumns(headerRow) {
    const h = headerRow.map(c => String(c || '').toLowerCase().trim());
    const out = { date: -1, desc: -1, debit: -1, credit: -1, balance: -1 };

    h.forEach((cell, i) => {
      if (out.date === -1 && cell.includes('date')) out.date = i;
      if (out.desc === -1 && (cell.includes('details') || cell.includes('description'))) out.desc = i;
      if (out.debit === -1 && cell.includes('debit')) out.debit = i;
      if (out.credit === -1 && cell.includes('credit')) out.credit = i;
      if (out.balance === -1 && cell.includes('balance')) out.balance = i;
    });

    console.log('Mapped Columns:', out);
    return out;
  }

  function parseDateSmart(v) {
    if (!v) return null;
   
    // JS Date object from SheetJS
    if (v instanceof Date) {
      return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
    }
   
    // Excel Serial Number (e.g. 45000)
    if (typeof v === 'number' && v > 20000 && v < 70000) {
      const d = new Date(Math.round((v - 25569) * 86400 * 1000));
      return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
    }

    const s = String(v).trim();
    if (!s) return null;

    // YYYY-MM-DD
    let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if (m) return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');

    // DD/MM/YYYY or DD-MM-YYYY
    m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
    if (m) {
      let d = String(m[1]).padStart(2, '0');
      let mo = String(m[2]).padStart(2, '0');
      let y = m[3];
      if (y.length === 2) y = (parseInt(y, 10) > 50 ? '19' : '20') + y;
      return y + '-' + mo + '-' + d;
    }

    // Fallback JS Date
    const d = new Date(s);
    if (!isNaN(d.getTime())) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    return null;
  }

  function parseAmountAny(v) {
    if (v === null || v === undefined) return 0;
    let s = String(v).trim();
    if (!s) return 0;
    let negative = false;
    if (s.indexOf('-') === 0) { negative = true; s = s.slice(1); }
    s = s.replace(/[^0-9.]/g, '');
    if (!s) return 0;
    const n = parseFloat(s);
    return negative ? -n : n;
  }

  window.openImportDialog = function (bankId) {
    if (!state.perms.write) { toast('Read-only role', 'error'); return; }
    const banks = arr(state.data.banks).filter(b => b.active !== false);
    if (!banks.length) { toast('Add a bank first', 'warn'); return; }

    const body =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">' +
        '<label class="field">Bank' +
          '<select id="impBank">' +
            banks.map(b => '<option value="' + esc(b.id) + '"' + (bankId === b.id ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('') +
          '</select>' +
        '</label>' +
        '<div class="field">File (.csv, .xlsx)' +
          '<input type="file" id="impFile" accept=".csv,.xlsx,.xls" style="padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);width:100%">' +
        '</div>' +
      '</div>' +
      '<div id="impPreview" style="display:none"></div>';

    openModal('📥 Import Bank Statement', body, {
      width: 900,
      footer: '<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="impConfirmBtn" disabled>Import</button>'
    });

    let parsed = null;

    document.getElementById('impFile').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const isExcel = /\.(xlsx|xls)$/i.test(file.name);

      try {
        let rows = [];
        if (isExcel) {
          toast('Loading Excel parser…', 'info');
          await ensureXLSX();
          const data = await file.arrayBuffer();
          const workbook = window.XLSX.read(data, { type: 'array', cellDates: true });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, raw: false });
        } else {
          const text = await file.text();
          // Simple CSV parser fallback
          rows = text.split('\n').map(l => l.split(','));
        }

        if (!rows || rows.length < 2) { toast('File is empty', 'error'); return; }

        const headerIndex = findRealHeaderRow(rows);
        const headerRow = rows[headerIndex];
        const cols = mapColumns(headerRow);

        if (cols.date === -1 || cols.debit === -1 || cols.credit === -1) {
          toast('Could not detect Date, Debit, or Credit columns.', 'error', 5000);
          console.error('Headers found:', headerRow);
          return;
        }

        const dataRows = rows.slice(headerIndex + 1);
        const parsedRows = [];
        let skipped = 0;

        dataRows.forEach((row) => {
          if (!row || !row.length) return;
         
          const dateVal = parseDateSmart(row[cols.date]);
          if (!dateVal) { skipped++; return; }

          const desc = cols.desc >= 0 ? String(row[cols.desc] || '').trim() : '';
         
          let debit = cols.debit >= 0 ? parseAmountAny(row[cols.debit]) : 0;
          let credit = cols.credit >= 0 ? parseAmountAny(row[cols.credit]) : 0;

          if (debit === 0 && credit === 0) return;

          const dir = credit > 0 ? 'credit' : 'debit';
          const amount = credit > 0 ? credit : debit;
          let balAfter = cols.balance >= 0 ? parseAmountAny(row[cols.balance]) : null;

          parsedRows.push({ date: dateVal, description: desc, amount: Math.abs(amount), direction: dir, balanceAfter: balAfter });
        });

        if (!parsedRows.length) {
          toast('No transaction rows detected. Check the file format.', 'error', 5000);
          console.error('Data rows sample:', dataRows.slice(0, 3));
          return;
        }

        parsed = { rows: parsedRows, fileName: file.name, preset: 'generic' };

        const preview = document.getElementById('impPreview');
        preview.style.display = '';
        preview.innerHTML =
          '<div class="card" style="background:var(--surface-2);border:none;padding:14px">' +
            '<div style="margin-bottom:10px"><strong>Preview: ' + parsedRows.length + ' transaction(s)</strong></div>' +
            '<div class="table-wrap" style="max-height:300px;overflow:auto">' +
              '<table style="font-size:12px">' +
                '<thead><tr><th>Date</th><th>Description</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead>' +
                '<tbody>' +
                  parsedRows.slice(0, 100).map(r =>
                    '<tr>' +
                      '<td>' + dateFmt(r.date) + '</td>' +
                      '<td>' + esc(r.description.slice(0, 50)) + '</td>' +
                      '<td class="num" style="color:var(--red)">' + (r.direction === 'debit' ? money(r.amount) : '') + '</td>' +
                      '<td class="num" style="color:var(--green)">' + (r.direction === 'credit' ? money(r.amount) : '') + '</td>' +
                      '<td class="num">' + (r.balanceAfter !== null ? money(r.balanceAfter) : '') + '</td>' +
                    '</tr>'
                  ).join('') +
                '</tbody>' +
              '</table>' +
            '</div>' +
          '</div>';

        document.getElementById('impConfirmBtn').disabled = false;

      } catch (err) {
        console.error(err);
        toast('Parse failed: ' + err.message, 'error', 5000);
      }
    };

    document.getElementById('impConfirmBtn').onclick = () => {
      if (!parsed) return;
      const targetBankId = document.getElementById('impBank').value;
      if (typeof window.commitImport === 'function') {
        window.commitImport(targetBankId, parsed);
      }
    };
  };

  scriptLoaded('FINAL-IMPORT');
})();
</script>

  async function extractTextFromXLSX(file) {
    const buffer = await file.arrayBuffer();
    const view = new DataView(buffer);
    let eocdOffset = -1;
    for (let i = buffer.byteLength - 22; i >= 0; i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocdOffset = i; break; }
    }
    if (eocdOffset === -1) throw new Error("Not a valid XLSX file");

    const cdOffset = view.getUint32(eocdOffset + 16, true);
    const numEntries = view.getUint16(eocdOffset + 10, true);
    let offset = cdOffset;
    const files = {};
    for (let i = 0; i < numEntries; i++) {
      if (view.getUint32(offset, true) !== 0x02014b50) break;
      const compMethod = view.getUint16(offset + 10, true);
      const compSize = view.getUint32(offset + 20, true);
      const fnLen = view.getUint16(offset + 28, true);
      const extraLen = view.getUint16(offset + 30, true);
      const commentLen = view.getUint16(offset + 32, true);
      const lhOffset = view.getUint32(offset + 42, true);
      const fnBytes = new Uint8Array(buffer, offset + 46, fnLen);
      const filename = new TextDecoder().decode(fnBytes);
      files[filename] = { compMethod, compSize, lhOffset };
      offset += 46 + fnLen + extraLen + commentLen;
    }

    async function extract(filename) {
      const f = files[filename];
      if (!f) return null;
      const lhFnLen = view.getUint16(f.lhOffset + 26, true);
      const lhExtraLen = view.getUint16(f.lhOffset + 28, true);
      const dataStart = f.lhOffset + 30 + lhFnLen + lhExtraLen;
      const compData = new Uint8Array(buffer, dataStart, f.compSize);
      if (f.compMethod === 0) return new TextDecoder().decode(compData);
      if (f.compMethod === 8) {
        const ds = new DecompressionStream('deflate-raw');
        const stream = new Blob([compData]).stream().pipeThrough(ds);
        return await new Response(stream).text();
      }
      return '';
    }

    const sharedStringsXml = await extract('xl/sharedStrings.xml');
    const strings = [];
    if (sharedStringsXml) {
      const sDoc = new DOMParser().parseFromString(sharedStringsXml, 'text/xml');
      const siNodes = sDoc.getElementsByTagName('si');
      for (let i = 0; i < siNodes.length; i++) {
        let text = '';
        const tNodes = siNodes[i].getElementsByTagName('t');
        for (let j = 0; j < tNodes.length; j++) text += tNodes[j].textContent;
        strings.push(text);
      }
    }

    const sheetXml = await extract('xl/worksheets/sheet1.xml');
    if (!sheetXml) throw new Error("Could not read sheet1.xml");

    const sDoc = new DOMParser().parseFromString(sheetXml, 'text/xml');
    const rowNodes = sDoc.getElementsByTagName('row');
    let text = '';
   
    for (let i = 0; i < rowNodes.length; i++) {
      const cNodes = rowNodes[i].getElementsByTagName('c');
      const rowData = [];
      for (let j = 0; j < cNodes.length; j++) {
        const c = cNodes[j];
        const type = c.getAttribute('t');
        const vNode = c.getElementsByTagName('v')[0];
        const isNode = c.getElementsByTagName('is')[0];
       
        let val = '';
        if (type === 's' && vNode) {
          val = strings[parseInt(vNode.textContent, 10)] || '';
        } else if (type === 'inlineStr' && isNode) {
          const tNode = isNode.getElementsByTagName('t')[0];
          val = tNode ? tNode.textContent : '';
        } else if (vNode) {
          val = vNode.textContent;
        }
        rowData.push(val);
      }
      if (rowData.some(c => c !== '')) {
        text += rowData.join(' | ') + '\n';
      }
    }
    return text;
  }

      const vWords1 = document.getElementById('inp-words1').value;
      const vWords2 = document.getElementById('inp-words2').value;

      const dateStr = cal.date.spaced ? formatSpacedDate(vDate) : formatStdDate(vDate);

      target.innerHTML = isPrint ? '' : '<div class="pro-grid"></div>';

      const addEl = (k, content, extraClass='') => {
        if (!cal[k].show && !['payee','date','amount','words1','words2'].includes(k)) return;
        if (!isPrint && k === 'micr') return; // Only show in print if toggled

        const div = document.createElement('div');
        div.className = `pro-el ${extraClass}`;
        div.dataset.k = k;
        div.style.left = cal[k].x + 'mm';
        div.style.top = cal[k].y + 'mm';
        div.style.fontSize = cal[k].fs + 'px';
        
        if (k === 'acPayee') {
          div.style.color = '#1d4ed8';
          div.style.fontWeight = '900';
          div.style.letterSpacing = '2px';
          div.style.transform = 'rotate(-15deg)';
          div.textContent = 'A/C PAYEE ONLY';
        } else if (k === 'bearer') {
          div.style.textDecoration = 'line-through';
          div.textContent = 'Or Bearer';
        } else if (k === 'amount') {
          div.textContent = `**${vAmount.toLocaleString('en-LK', {minimumFractionDigits:2})}**`;
        } else if (k === 'date') {
          div.textContent = dateStr;
        } else if (k === 'payee') {
          div.textContent = vPayee;
        } else if (k === 'words1') {
          div.textContent = vWords1;
          div.classList.add('pro-words');
        } else if (k === 'words2') {
          div.textContent = vWords2;
          div.classList.add('pro-words');
        } else if (k === 'micr') {
          div.textContent = `⑈ ${editData.chequeNo} ⑈ ${editData.accountNo} ⑈`;
          div.style.letterSpacing = '3px';
        }
        
        if (!isPrint) div.onclick = (e) => { e.stopPropagation(); activeEl = k; updateSelection(); };
        target.appendChild(div);
      };

      addEl('acPayee', '');
      addEl('date', '');
      addEl('payee', '');
      addEl('bearer', '');
      addEl('words1', '');
      addEl('words2', '');
      addEl('amount', '');
      if (cal.micr.show) addEl('micr', '');

      if (!isPrint) updateSelection();
    };

    const updateSelection = () => {
      document.querySelectorAll('.pro-el').forEach(el => el.classList.toggle('active', el.dataset.k === activeEl));
      document.querySelectorAll('.p-group').forEach(el => {
         el.querySelector('.p-title').style.color = el.dataset.target === activeEl ? 'var(--accent)' : 'var(--text-3)';
      });
      // Sync alignment inputs
      document.querySelectorAll('.al-inp').forEach(inp => {
        if (inp.dataset.k === activeEl) {
          inp.value = cal[activeEl][inp.dataset.p];
        }
      });
    };

    // Tab Switching
    document.querySelectorAll('.pro-tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.pro-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.pro-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
      };
    });

    // Handle Input Changes
    ['payee','date','amount','words1','words2'].forEach(k => {
      document.getElementById('inp-'+k).oninput = () => renderPaper();
    });

    // Handle Toggles
    document.getElementById('tgl-acpayee').onchange = (e) => { cal.acPayee.show = e.target.checked; renderPaper(); };
    document.getElementById('tgl-bearer').onchange = (e) => { cal.bearer.show = e.target.checked; renderPaper(); };
    document.getElementById('tgl-spaced').onchange = (e) => { cal.date.spaced = e.target.checked; renderPaper(); };
    document.getElementById('tgl-micr').onchange = (e) => { cal.micr.show = e.target.checked; renderPaper(); };

    // Handle Alignment Inputs
    document.querySelectorAll('.al-inp').forEach(inp => {
      inp.onchange = (e) => {
        const k = e.target.dataset.k;
        const p = e.target.dataset.p;
        cal[k][p] = parseFloat(e.target.value) || 0;
        renderPaper();
      };
    });

    document.querySelectorAll('.p-group').forEach(grp => {
      grp.onclick = () => { if(grp.dataset.target) { activeEl = grp.dataset.target; updateSelection(); } };
    });

    // Handle Bank Dropdown
    document.getElementById('proBankSel').onchange = (e) => {
      const newPreset = e.target.value;
      const newCal = JSON.parse(localStorage.getItem('chq_pro_cal_v3_' + newPreset) || JSON.stringify(BANK_PRESETS[newPreset]));
      Object.assign(cal, newCal);
      // Update toggles and inputs
      document.getElementById('tgl-acpayee').checked = cal.acPayee.show;
      document.getElementById('tgl-bearer').checked = cal.bearer.show;
      document.getElementById('tgl-spaced').checked = cal.date.spaced;
      document.getElementById('tgl-micr').checked = cal.micr.show;
      document.querySelectorAll('.al-inp').forEach(inp => inp.value = cal[inp.dataset.k][inp.dataset.p]);
      renderPaper();
    };

    // Keyboard Nudge
    const handleKeys = (e) => {
      if (!document.getElementById('proVisual')) return;
      const step = e.shiftKey ? 5 : 1;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
        if (e.key === 'ArrowUp') cal[activeEl].y -= step;
        if (e.key === 'ArrowDown') cal[activeEl].y += step;
        if (e.key === 'ArrowLeft') cal[activeEl].x -= step;
        if (e.key === 'ArrowRight') cal[activeEl].x += step;
        document.querySelectorAll('.al-inp').forEach(inp => { if (inp.dataset.k === activeEl) inp.value = cal[activeEl][inp.dataset.p]; });
        renderPaper();
      }
    };
    document.addEventListener('keydown', handleKeys);

    const origClose = window.closeModal;
    window.closeModal = function() {
      document.removeEventListener('keydown', handleKeys);
      localStorage.setItem(calKey, JSON.stringify(cal)); // Auto-save on close
      window.closeModal = origClose;
      origClose.apply(this, arguments);
    };

    // Print Buttons
    const doPrint = (isTest) => {
      if (isTest) {
        // Override inputs for a test
        document.getElementById('inp-payee').value = 'John Doe';
        document.getElementById('inp-date').value = today();
        document.getElementById('inp-amount').value = 12345.67;
        document.getElementById('inp-words1').value = 'Twelve Thousand Three Hundred';
        document.getElementById('inp-words2').value = 'And Forty Five Cents Only';
      }
      
      renderPaper(true); // Render hidden print area
      document.getElementById('proPrintArea').style.display = 'block';
      
      setTimeout(() => {
        window.print();
        document.getElementById('proPrintArea').style.display = 'none';
      }, 150);
    };

    document.getElementById('proPrintBtn').onclick = () => doPrint(false);
    document.getElementById('proTestBtn').onclick = () => doPrint(true);

    renderPaper();
  };
})();
</script>

<script>
(function () {

    const f = state.filters.premiumReport || {};
    const targetDate = f.date || shiftDate(today(), 1); 
    const viewMode = f.viewMode || 'dashboard'; 

    const dateLabel = dateFmt(targetDate);
    const businessName = state.settings?.business?.name || 'Lanka Shoe';
    
    // --- ACCOUNTING LOGIC (Includes Backlog) ---
    const allCheques = arr(state.data.cheques);
    const allBanks = arr(state.data.banks).filter(b => b.active !== false);

    // 1. Get ALL Pending Cheques UP TO the target date (Backlog + New)
    const pendingCheques = allCheques.filter(c => 
      c.chequeDate <= targetDate && 
      ['scheduled', 'approved', 'pending_approval'].includes(c.status)
    );

    const totalRequired = pendingCheques.reduce((s, c) => s + num(c.amount), 0);
    
    // 2. Separate Backlog vs Target Date
    const backlogCheques = pendingCheques.filter(c => c.chequeDate < today()); // Strictly past dates
    const backlogTotal = backlogCheques.reduce((s, c) => s + num(c.amount), 0);

    const targetDateCheques = pendingCheques.filter(c => c.chequeDate >= today() && c.chequeDate <= targetDate);
    const targetDateTotal = targetDateCheques.reduce((s, c) => s + num(c.amount), 0);

    // 3. Bank Breakdown for ALL pending cheques
    const bankData = allBanks.map(b => {
      const bCheques = pendingCheques.filter(c => c.bankId === b.id).sort((a,b) => a.chequeDate.localeCompare(b.chequeDate));
      const bTotal = bCheques.reduce((s, c) => s + num(c.amount), 0);
      const bal = bankBalances(b.id);
      
      const needed = Math.max(0, bTotal - bal.bank);
      
      const payees = {};
      bCheques.forEach(c => {
        if (!payees[c.payeeName]) payees[c.payeeName] = { total: 0, cheques: [] };
        payees[c.payeeName].total += num(c.amount);
        payees[c.payeeName].cheques.push(c);
      });

      return {
        bank: b,
        total: bTotal,
        balance: bal.bank,
        needed: needed,
        payees: Object.keys(payees).map(name => ({ name, total: payees[name].total, cheques: payees[name].cheques }))
      };
    }).filter(b => b.total > 0 || b.needed > 0); 

    // 4. Top Payee

      allPayees[c.payeeName].count++;

      const backlog = pending.filter(c => c.chequeDate < today());
      
      const banks = arr(state.data.banks).map(b => ({
        name: b.name,
        balance: bankBalances(b.id).bank,
        due: pending.filter(c => c.bankId === b.id).reduce((s,c) => s + num(c.amount), 0)
      })).filter(b => b.due > 0 || b.balance > 0);

      const prompt = `You are a financial assistant for a Sri Lankan business. Write a highly professional, WhatsApp-ready summary for the business owner.
Target Date: ${dateStr}.
Total Pending Amount UP TO this date: Rs. ${pending.reduce((s,c)=>s+num(c.amount),0)}
Note: This includes Rs. ${backlog.reduce((s,c)=>s+num(c.amount),0)} from PREVIOUS days that haven't cleared yet.
Bank Breakdown: ${JSON.stringify(banks)}

Write a short, bulleted message using emojis. Warn them if they need to deposit money into any bank to cover BOTH backlog and upcoming cheques. Keep it under 150 words.`;

      try {
        const res = await fetch('https://generativelanguage.googleapis.com/v1beta/openai/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify({ model: 'gemini-3.8-flash', messages: [{ role: 'user', content: prompt }], temperature: 0.7 })
        });
        
        if (!res.ok) throw new Error('API Error');
        const data = await res.json();
        txt.innerText = data.choices[0].message.content;
      } catch (err) {
        txt.innerHTML = '<span style="color:red">Error: ' + err.message + '</span>';
      }
    };

    window.downloadReportPNG = async function () {
      const el = document.getElementById('reportCanvas') || document.getElementById('reportRenderArea');
      if (!el) return;
      if (!window.html2canvas) { toast('Image library loading... wait 1 sec.', 'info'); return; }

      toast('Generating high-res image...', 'info');
      try {
        const canvas = await window.html2canvas(el, { scale: 3, useCORS: true, backgroundColor: '#f8fafc' });
        const link = document.createElement('a');
        link.download = `LankaShoe_Report_${today()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        toast('Image downloaded!', 'success');
      } catch (err) {
        toast('Failed to generate image: ' + err.message, 'error');
      }
    };

    scriptLoaded('S09-PREMIUM');
  });
})();

<script>

  // 1. Deep Math: Update bankBalances to handle Floating perfectly
  window.bankBalances = function(bankId) {
    const bank = bankObj(bankId);
    if (!bank) return { bank: 0, book: 0, floating: 0 };

    const cheques = arr(state.data.cheques).filter(c => c.bankId === bankId);
    const clearedTotal = cheques.filter(c => c.status === 'cleared').reduce((s, c) => s + num(c.amount), 0);
    const approvedTotal = cheques.filter(c => c.status === 'approved').reduce((s, c) => s + num(c.amount), 0);

    let adjBankTotal = 0;
    let adjFloatingIn = 0;

    arr(state.data.bankAdjustments).filter(a => String(a.bankId) === String(bankId)).forEach(a => {
        const isFloating = a.status === 'floating';
        const sign = num(a.signedAmount !== undefined ? a.signedAmount : a.amount);
        
        if (isFloating) {
            adjFloatingIn += sign; // e.g., +50,000 for incoming floating party cheque
        } else if (a.status !== 'bounced') {
            adjBankTotal += sign; // e.g., -500 for bank charge, +50,000 for cleared deposit
        }
    });

    const bankValue = num(bank.openingBalance) - clearedTotal + adjBankTotal;
    const bookValue = bankValue - approvedTotal;
    // Floating = Approved Outgoing (liabilities) minus Floating Incoming (assets)
    const floatingValue = approvedTotal - adjFloatingIn; 

    return {
      bank: bankValue,
      book: bookValue,
      floating: floatingValue, 
      opening: num(bank.openingBalance),
      clearedTotal,
      approvedPendingTotal: approvedTotal,
      adjustmentsTotal: adjBankTotal
    };
  };

  // 2. Complete Rewrite of the Adjustments List View
  window.renderAdjustments = function() {
    const all = arr(state.data.bankAdjustments).slice();

    const totalCredit = list.filter(a => num(a.signedAmount) > 0 && a.status !== 'floating' && a.status !== 'bounced').reduce((s, a) => s + Math.abs(num(a.signedAmount)), 0);
    const totalDebit = list.filter(a => num(a.signedAmount) < 0 && a.status !== 'bounced').reduce((s, a) => s + Math.abs(num(a.signedAmount)), 0);
    const net = totalCredit - totalDebit;

    return '' +
      '<div class="kpi-strip">' +
        '<div class="kpi"><div class="k-label">Adjustments</div><div class="k-value">' + all.length + '</div></div>' +

        '<div class="kpi"><div class="k-label">Total Debits</div><div class="k-value" style="color:var(--red)">' + money(totalDebit) + '</div></div>' +
        '<div class="kpi"><div class="k-label">Net Impact</div><div class="k-value" style="color:' + (net >= 0 ? 'var(--green)' : 'var(--red)') + '">' + (net >= 0 ? '+' : '') + money(net) + '</div></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head"><h3>🔧 Bank Adjustments (' + list.length + ')</h3>' +
          '<button class="btn primary" data-action="adj-new">＋ New Adjustment</button></div>' +
        
        '<div class="md-filter">' +
          '<label class="field">Search<input type="search" id="adjSearch" value="' + esc(filter.q || '') + '" placeholder="Reason, reference…"></label>' +
          '<label class="field">Type<select id="adjTypeFilter">' +
            '<option value="all">All Types</option>' +
            Object.keys(window.ADJUSTMENT_TYPES).map(k => '<option value="' + k + '">' + window.ADJUSTMENT_TYPES[k].label + '</option>').join('') +
            '<option value="transfer_out">Transfers</option>' +
          '</select></label>' +
          '<div></div><div></div>' +
        '</div>' +

        (list.length
          ? '<div class="table-wrap"><table>' +
              '<thead><tr><th>Date</th><th>Bank</th><th>Type</th><th>Reason / Desc</th><th>Reference</th><th class="num">Amount</th><th class="actions-cell"></th></tr></thead><tbody>' +
              list.map(a => {
                const signed = num(a.signedAmount);
                const isFloating = a.status === 'floating';
                const isBounced = a.status === 'bounced';
                let amtColor = signed > 0 ? 'var(--green)' : 'var(--red)';
                let rowOpacity = isBounced ? 'opacity: 0.5;' : '';
                
                if (isFloating) amtColor = 'var(--amber)';

                // Determine Badge
                let badgeHtml = '';
                if (a.type === 'transfer_out') badgeHtml = '<span class="badge amber">📤 Transfer Out</span>';
                else if (a.type === 'transfer_in') badgeHtml = '<span class="badge green">📥 Transfer In</span>';
                else if (a.type === 'party_cheque') {
                    if (isFloating) badgeHtml = '<span class="badge amber">📜 Floating Chq</span>';
                    else if (isBounced) badgeHtml = '<span class="badge red">❌ Bounced Chq</span>';
                    else badgeHtml = '<span class="badge green">📜 Cleared Chq</span>';
                }
                else if (a.customName) badgeHtml = '<span class="badge gray">🏷️ ' + esc(a.customName) + '</span>';
                else badgeHtml = '<span class="badge blue">' + esc(a.type) + '</span>';

                return '<tr style="' + rowOpacity + '">' +
                  '<td>' + dateFmt(a.date) + '</td>' +
                  '<td>' + esc(bankName(a.bankId)) + '</td>' +
                  '<td>' + badgeHtml + '</td>' +

                    '<strong>' + esc(a.reason || '—') + '</strong>' +
                    (a.attachment ? ' <span class="small" style="cursor:pointer;color:var(--accent)" data-action="adj-view-receipt" data-id="' + a.id + '">📎 View Receipt</span>' : '') +
                  '</td>' +
                  '<td class="mono small">' + esc(a.reference || '—') + '</td>' +
                  '<td class="num" style="color:' + amtColor + ';font-weight:600;">' + (signed > 0 ? '+' : '') + money(signed) + '</td>' +
                  '<td class="actions-cell">' +
                    (isFloating ? '<button class="btn xs primary" data-action="adj-mark-cleared" data-id="' + a.id + '">Mark Cleared</button> ' : '') +
                    (isFloating ? '<button class="btn xs danger" data-action="adj-mark-bounced" data-id="' + a.id + '">Bounce</button> ' : '') +
                    '<button class="btn xs" data-action="adj-edit" data-id="' + a.id + '">Edit</button>' +
                    ' <button class="btn xs danger" data-action="adj-delete" data-id="' + a.id + '">🗑</button>' +
                  '</td>' +
                '</tr>';
              }).join('') +
            '</tbody></table></div>'
          : '<div class="empty"><span class="big">🔧</span>No adjustments found.</div>') +
      '</div>';
  };

  // 3. The Massive Form
  window.openAdjustmentFormPro = function(id) {

        // If floating, it doesn't hit the bank balance yet
        const afterBank = isFloating ? bal.bank : bal.bank + signedAmt;

        preview.innerHTML = `

    } else {
        toast('Attachment is a file name (legacy record): ' + a.attachment, 'info');
    }
  });

  window.__LS_registerAction('adj-new', () => window.openAdjustmentFormPro(null));
  window.__LS_registerAction('adj-edit', (ev, id) => { ev.stopPropagation(); window.openAdjustmentFormPro(id); });
  window.openAdjustmentForm = window.openAdjustmentFormPro;

})();
</script>
<!-- ═══════════════════════════════════════════════════════════════════════
     FEATURE 5: MASSIVE BATCH CHEQUE WRITER (With ALL Fields)
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  window.openBatchChequeFormPro = function() {
    if (!state.perms.write) { toast('Read-only role', 'error'); return; }
    const banks = arr(state.data.banks).filter(b => b.active !== false);
    if (!banks.length) { toast('Add a bank first', 'warn'); return; }

    const style = document.createElement('style');
    style.innerHTML = `
      .bw-wrap { display: flex; flex-direction: column; height: 75vh; background: #f8fafc; margin: -22px; }
      .bw-header { background: #0f172a; color: #fff; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent); }
      .bw-kpi-box { display: flex; gap: 30px; align-items: center; }
      .bw-kpi .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #94a3b8; font-weight: 700; margin-bottom: 4px; }
      .bw-kpi .val { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
      
      .bw-grid-wrap { flex: 1; overflow: auto; padding: 20px; }
      .bw-table { width: 100%; min-width: 1600px; border-collapse: separate; border-spacing: 0 8px; }
      
      .bw-table th { text-align: left; padding: 10px 14px; font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 800; letter-spacing: 0.5px; background: #fff; border-bottom: 2px solid #e2e8f0; position: sticky; top: 0; z-index: 10; white-space: nowrap; }
      .bw-table td { background: #fff; padding: 8px 14px; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; vertical-align: middle; position: relative; }
      .bw-table tr td:first-child { border-left: 1px solid #e2e8f0; border-radius: 8px 0 0 8px; }
      .bw-table tr td:last-child { border-right: 1px solid #e2e8f0; border-radius: 0 8px 8px 0; }
      
      .bw-input { width: 100%; border: 1px solid transparent; padding: 8px 10px; border-radius: 6px; font-size: 13px; background: transparent; transition: 0.15s; font-family: var(--font); }
      .bw-input:focus { border-color: var(--accent); background: #fff; outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
      .bw-input[readonly] { background: #f8fafc; color: #64748b; cursor: not-allowed; font-size: 11px; }
      .bw-num { text-align: right; font-variant-numeric: tabular-nums; }
      
      .bw-suggestions { position: absolute; top: 100%; left: 14px; right: 14px; background: #fff; border: 1px solid var(--border); border-radius: 6px; margin-top: 4px; max-height: 200px; overflow-y: auto; z-index: 100; box-shadow: var(--shadow-lg); display: none; }
      .bw-suggestions.open { display: block; }
      .bw-suggest-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border-2); font-size: 13px; }
      .bw-suggest-item:hover { background: var(--surface-2); }
      .bw-suggest-item .small { color: var(--text-3); font-size: 11px; margin-top: 2px; }
    `;
    document.head.appendChild(style);

    const body = `
      <div class="bw-wrap">
        <div class="bw-header">
          <div>
            <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 4px;">Batch Cheque Writer</h2>
            <div style="font-size: 12px; color: #94a3b8;">Complete data entry for multiple cheques.</div>
          </div>
          <div class="bw-kpi-box">
            <div class="bw-kpi">
              <div class="lbl">Total Batch Amount</div>
              <div class="val" id="bwTotalAmount" style="color: #eab308;">Rs. 0.00</div>
            </div>
            <div class="bw-kpi">
              <div class="lbl">Book Balance (After)</div>
              <div class="val" id="bwBookAfter">Rs. 0.00</div>
            </div>
            <div class="bw-kpi">
              <div class="lbl">Cheques</div>
              <div class="val" id="bwRowCount">0</div>
            </div>
          </div>
        </div>

        <div style="padding: 16px 24px; background: #fff; border-bottom: 1px solid #e2e8f0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
          <label class="field" style="margin: 0;">Source Bank
            <select id="bwBank" style="font-weight: 600;">${banks.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select>
          </label>
          <label class="field" style="margin: 0;">Cheque Book
            <select id="bwBook" style="font-weight: 600;"><option value="">— Manual / No book —</option></select>
          </label>
          <div style="display: flex; align-items: flex-end;">
            <button class="btn" id="bwAddRow" style="width: 100%; border-style: dashed;">＋ Add 1 Row</button>
          </div>
        </div>

        <div class="bw-grid-wrap">
          <table class="bw-table">
            <thead>
              <tr>
                <th style="width: 40px; text-align: center;">#</th>
                <th style="width: 200px;">Payee Name</th>
                <th style="width: 120px;">Payee Type</th>
                <th style="width: 110px;">Cheque No.</th>
                <th style="width: 120px;">Amount (Rs.)</th>
                <th style="width: 220px;">Amount in Words</th>
                <th style="width: 130px;">Cheque Date</th>
                <th style="width: 130px;">Written Date</th>
                <th style="width: 150px;">Memo</th>
                <th style="width: 150px;">Notes</th>
                <th style="width: 40px;"></th>
              </tr>
            </thead>
            <tbody id="bwRows"></tbody>
          </table>
        </div>
      </div>
    `;

    openModal('📝 Write Batch Cheques', body, {
      width: 1400,
      footer: `<button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="bwSaveAllBtn" style="padding: 10px 24px;">💾 Save All Cheques</button>`
    });

    document.querySelector('#modalWrap .modal').style.maxWidth = '98vw';
    document.querySelector('#modalWrap .modal').style.width = '98vw';
    document.querySelector('#modalWrap .modal-body').style.padding = '0';
    document.querySelector('#modalWrap .modal-body').style.overflow = 'hidden';

    let rows = [];
    let rowCounter = 0;

    const bankSel = document.getElementById('bwBank');
    const bookSel = document.getElementById('bwBook');
    const rowsContainer = document.getElementById('bwRows');
    const totalEl = document.getElementById('bwTotalAmount');
    const bookAfterEl = document.getElementById('bwBookAfter');
    const rowCountEl = document.getElementById('bwRowCount');

    function refreshBooks() {
      const bid = bankSel.value;
      const books = arr(state.data.chequeBooks).filter(b => b.bankId === bid && b.active !== false);
      bookSel.innerHTML = '<option value="">— Manual / No book —</option>' + 
        books.map(b => `<option value="${b.id}">${esc(b.bookNo)} (${b.serialStart} - ${b.serialEnd})</option>`).join('');
      if (books.length) bookSel.value = books[0].id;
      reassignLeaves();
    }

    function reassignLeaves() {
      const bkid = bookSel.value;
      const book = bkid ? bookObj(bkid) : null;
      const availLeaves = book ? arr(book.leaves).filter(l => l.status === 'available') : [];
      let leafIdx = 0;

      rows.forEach(r => {
        if (!r.isManualNo && book) {
          if (leafIdx < availLeaves.length) {
            const leaf = availLeaves[leafIdx];
            r.leafId = arr(book.leaves).indexOf(leaf);
            r.chequeNo = leaf.serial;
            leafIdx++;
          } else {
            r.leafId = null;
            r.chequeNo = '';
          }
        }
      });
      renderGrid();
    }

    function addRow() {
      if (rows.length >= 50) { toast('Max 50 rows per batch', 'warn'); return; }
      rowCounter++;
      rows.push({ 
        id: 'r' + rowCounter, 
        payeeId: null, 
        payeeName: '', 
        payeeType: 'supplier',
        chequeNo: '', 
        isManualNo: false, 
        amount: 0, 
        amountWords: '',
        date: today(), 
        writtenDate: today(),
        memo: '', 
        notes: '',
        leafId: null 
      });
      reassignLeaves();
    }

    function renderGrid() {
      rowsContainer.innerHTML = rows.map((r, i) => `
        <tr data-row-id="${r.id}">
          <td style="text-align: center; font-weight: 700; color: #94a3b8;">${i + 1}</td>
          
          <td>
            <input type="text" class="bw-input bw-payee" value="${esc(r.payeeName)}" placeholder="Search saved payee..." autocomplete="off" data-id="${r.id}">
            <div class="bw-suggestions" id="sug-${r.id}"></div>
          </td>
          
          <td>
            <select class="bw-input bw-type">
              ${Object.keys(PAYEE_TYPES).map(k => `<option value="${k}" ${r.payeeType === k ? 'selected' : ''}>${PAYEE_TYPES[k].label}</option>`).join('')}
            </select>
          </td>
          
          <td><input type="text" class="bw-input bw-no ${r.isManualNo ? '' : 'bg-slate-50'}" value="${esc(r.chequeNo)}" placeholder="Manual #"></td>
          
          <td><input type="number" class="bw-input bw-num bw-amt" value="${r.amount > 0 ? r.amount : ''}" placeholder="0.00" step="0.01"></td>
          
          <td><input type="text" class="bw-input bw-words" value="${esc(r.amountWords)}" readonly placeholder="Auto-generated"></td>
          
          <td><input type="date" class="bw-input bw-date" value="${r.date}"></td>
          
          <td><input type="date" class="bw-input bw-wdate" value="${r.writtenDate}"></td>
          
          <td><input type="text" class="bw-input bw-memo" value="${esc(r.memo)}" placeholder="Optional"></td>
          
          <td><input type="text" class="bw-input bw-notes" value="${esc(r.notes)}" placeholder="Optional"></td>
          
          <td style="text-align: center;"><button class="icon-btn bw-del" style="color: var(--red);">✕</button></td>
        </tr>
      `).join('');

      bindRowEvents();
      recalc();
    }

    function recalc() {
      const total = rows.reduce((s, r) => s + num(r.amount), 0);
      const bal = bankBalances(bankSel.value);
      const afterBook = bal.book - total;

      totalEl.textContent = money(total);
      bookAfterEl.textContent = money(afterBook);
      rowCountEl.textContent = rows.length;
      bookAfterEl.style.color = afterBook < 0 ? '#ef4444' : '#10b981';
    }

    function bindRowEvents() {
      document.querySelectorAll('#bwRows tr').forEach(tr => {
        const rid = tr.dataset.rowId;
        const row = rows.find(x => x.id === rid);
        if (!row) return;

        const payeeInp = tr.querySelector('.bw-payee');
        const sugBox = document.getElementById('sug-' + rid);

        payeeInp.oninput = (e) => {
          row.payeeName = e.target.value;
          row.payeeId = null;
          
          const q = e.target.value.trim().toLowerCase();
          if (!q) { sugBox.classList.remove('open'); return; }

          const matches = arr(state.data.payees).filter(p => p.active !== false && (p.name || '').toLowerCase().indexOf(q) !== -1).slice(0, 5);

          if (!matches.length) {
            sugBox.innerHTML = '<div class="bw-suggest-item" style="color:var(--accent); font-weight:600;">＋ Add new payee: ' + esc(e.target.value) + '</div>';
            sugBox.classList.add('open');
            return;
          }

          sugBox.innerHTML = matches.map(p => `
            <div class="bw-suggest-item" data-pid="${p.id}">
              <strong>${esc(p.name)}</strong>
              <div class="small">${esc(PAYEE_TYPES[p.type]?.label || 'Payee')} ${num(p.lastChequeAmount) > 0 ? ' · Last: '+money(p.lastChequeAmount) : ''}</div>
            </div>
          `).join('');
          sugBox.classList.add('open');
        };

        sugBox.onmousedown = (e) => {
          e.preventDefault(); 
          const item = e.target.closest('.bw-suggest-item');
          if (!item) return;
          
          if (item.dataset.pid) {
            const p = payeeObj(item.dataset.pid);
            if (p) {
              payeeInp.value = p.name;
              row.payeeId = p.id;
              row.payeeName = p.name;
              
              // Auto-fill type
              tr.querySelector('.bw-type').value = p.type;
              row.payeeType = p.type;

              // Auto-fill amount
              const amtInp = tr.querySelector('.bw-amt');
              if (num(p.lastChequeAmount) > 0 && !num(amtInp.value)) {
                amtInp.value = num(p.lastChequeAmount).toFixed(2);
                row.amount = num(p.lastChequeAmount);
                row.amountWords = numberToWords(row.amount);
                tr.querySelector('.bw-words').value = row.amountWords;
                recalc();
              }
            }
          }
          sugBox.classList.remove('open');
        };

        payeeInp.onblur = () => { setTimeout(() => sugBox.classList.remove('open'), 200); };

        // Payee Type
        tr.querySelector('.bw-type').onchange = (e) => { row.payeeType = e.target.value; };

        // Cheque No
        const noInp = tr.querySelector('.bw-no');
        noInp.oninput = (e) => {
          row.chequeNo = e.target.value;
          row.isManualNo = true;
          row.leafId = null;
          noInp.classList.remove('bg-slate-50');
        };

        // Amount & Words
        tr.querySelector('.bw-amt').oninput = (e) => { 
          row.amount = num(e.target.value); 
          row.amountWords = numberToWords(row.amount);
          tr.querySelector('.bw-words').value = row.amountWords;
          recalc(); 
        };

        // Dates & Memo & Notes
        tr.querySelector('.bw-date').onchange = (e) => { row.date = e.target.value; };
        tr.querySelector('.bw-wdate').onchange = (e) => { row.writtenDate = e.target.value; };
        tr.querySelector('.bw-memo').oninput = (e) => { row.memo = e.target.value; };
        tr.querySelector('.bw-notes').oninput = (e) => { row.notes = e.target.value; };

        // Delete
        tr.querySelector('.bw-del').onclick = () => {
          rows = rows.filter(x => x.id !== rid);
          reassignLeaves();
        };
      });
    }

    document.getElementById('bwSaveAllBtn').onclick = () => {
      const validRows = rows.filter(r => r.payeeName.trim() && num(r.amount) > 0 && r.chequeNo.trim());
      if (validRows.length === 0) { toast('No valid rows to save', 'warn'); return; }
      if (validRows.length !== rows.length) {
        if (!confirm('Some rows are missing Payee, Amount, or Cheque #. They will be skipped. Continue?')) return;
      }

      const total = validRows.reduce((s, r) => s + num(r.amount), 0);
      const bal = bankBalances(bankSel.value);
      if (bal.book - total < 0) {
        if (!confirm('⚠ Warning: This batch exceeds your Book Balance by ' + money(Math.abs(bal.book - total)) + '. Continue?')) return;
      }

      let savedCount = 0;
      validRows.forEach(r => {
        let pid = r.payeeId;
        if (!pid) {
          const match = arr(state.data.payees).find(p => p.name.toLowerCase() === r.payeeName.toLowerCase());
          if (match) pid = match.id;
        }

        const isFuture = r.date > today();
        const status = isFuture ? 'scheduled' : 'pending_approval';

        const newCheque = makeCheque({
          chequeNo: r.chequeNo,
          bankId: bankSel.value,
          bookId: bookSel.value || '',
          leafId: r.leafId,
          payeeId: pid,
          payeeType: r.payeeType,
          payeeName: r.payeeName,
          amount: num(r.amount),
          amountWords: r.amountWords,
          chequeDate: r.date,
          writtenDate: r.writtenDate || today(),
          status: status,
          memo: r.memo,
          notes: r.notes || 'Created via Batch Writer'
        });

        state.data.cheques.push(newCheque);
        markDirty('cheques', newCheque.id);
        
        if (r.leafId !== null && bookSel.value) {
          const book = bookObj(bookSel.value);
          if (book) {
            book.leaves[r.leafId].status = 'used';
            book.leaves[r.leafId].chequeId = newCheque.id;
            markDirty('chequeBooks', book.id);
          }
        }
        savedCount++;
      });

      toast(`Successfully saved ${savedCount} cheques!`, 'success');
      closeModal();
      renderApp();
    };

    bankSel.onchange = refreshBooks;
    bookSel.onchange = reassignLeaves;
    document.getElementById('bwAddRow').onclick = addRow;

    refreshBooks();
    for (let i = 0; i < 3; i++) addRow();
  };

  window.__LS_registerAction('cheque-batch-new', () => window.openBatchChequeFormPro());

})();
</script>
<!-- ═══════════════════════════════════════════════════════════════════════
     APPROVALS UPGRADE — Show All Scheduled Cheques
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  window.renderApprovals = function() {
    // Read filter state (default to 'due')
    const filterMode = state.filters.approvalsMode || 'due';

    // Get ALL pending cheques (scheduled, pending_approval)
    let allPending = arr(state.data.cheques).filter(c => 
      c.status === 'scheduled' || c.status === 'pending_approval'
    );

    // Apply filter based on mode
    let list = [];
    if (filterMode === 'all') {
      list = allPending;
    } else {
      // 'due' mode (today or overdue)
      list = allPending.filter(c => c.chequeDate <= today() || c.status === 'pending_approval');
    }

    // Remove snoozed (only from 'due' mode, 'all' mode shows everything)
    if (filterMode === 'due') {
      list = list.filter(c => !isSnoozed(c.id));
    }

    // Sort by date
    list.sort((a, b) => String(a.chequeDate).localeCompare(String(b.chequeDate)));

    const totalDue = list.reduce((s, c) => s + num(c.amount), 0);
    const todayCount = list.filter(c => c.chequeDate === today()).length;
    const overdue = list.filter(c => c.chequeDate < today()).length;

    return '' +
      '<div class="kpi-strip">' +
        '<div class="kpi ' + (list.length ? 'danger' : '') + '">' +
          '<div class="k-label">' + (filterMode === 'all' ? 'Total Scheduled' : 'Due Now') + '</div>' +
          '<div class="k-value">' + list.length + '</div>' +
        '</div>' +
        '<div class="kpi ' + (list.length ? 'danger' : '') + '">' +
          '<div class="k-label">Total Value</div>' +
          '<div class="k-value" style="font-size:18px">' + money(totalDue) + '</div>' +
        '</div>' +
        '<div class="kpi"><div class="k-label">Today</div><div class="k-value">' + todayCount + '</div></div>' +
        '<div class="kpi ' + (overdue ? 'warn' : '') + '">' +
          '<div class="k-label">Overdue</div>' +
          '<div class="k-value" style="color:' + (overdue ? 'var(--amber)' : 'var(--text-4)') + '">' + overdue + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head">' +
          '<h3>⏰ Cheques Awaiting Approval</h3>' +
          '<div style="display:flex; gap:6px;">' +
            '<button class="btn sm ' + (filterMode === 'due' ? 'primary' : '') + '" data-action="approvals-view-due">Due Now</button>' +
            '<button class="btn sm ' + (filterMode === 'all' ? 'primary' : '') + '" data-action="approvals-view-all">All Scheduled</button>' +
          '</div>' +
        '</div>' +
        (list.length
          ? '<div class="table-wrap"><table>' +
              '<thead><tr>' +
                '<th>Cheque #</th><th>Cheque Date</th><th>Days</th><th>Payee</th><th>Bank</th>' +
                '<th class="num">Amount</th><th class="actions-cell"></th>' +
              '</tr></thead><tbody>' +
              list.map(c => {
                const days = diffDays(c.chequeDate, today());
                let daysLabel = '';
                if (days === 0) daysLabel = '<span class="badge amber">Today</span>';
                else if (days > 0) daysLabel = '<span class="badge red">' + days + 'd overdue</span>';
                else daysLabel = '<span class="badge blue">In ' + (-days) + 'd</span>';

                return '<tr>' +
                  '<td class="mono"><strong>' + esc(c.chequeNo) + '</strong></td>' +
                  '<td>' + dateFmt(c.chequeDate) + '</td>' +
                  '<td>' + daysLabel + '</td>' +
                  '<td>' + esc(c.payeeName || '—') + '</td>' +
                  '<td>' + esc(bankName(c.bankId)) + '</td>' +
                  '<td class="num"><strong>' + money(c.amount) + '</strong></td>' +
                  '<td class="actions-cell">' +
                    '<button class="btn xs primary" data-action="cheque-approve" data-id="' + esc(c.id) + '">Approve</button> ' +
                    '<button class="btn xs" data-action="cheque-reject" data-id="' + esc(c.id) + '">Reject</button> ' +
                    '<button class="btn xs" data-action="cheque-open" data-id="' + esc(c.id) + '">Open</button>' +
                  '</td>' +
                '</tr>';
              }).join('') +
            '</tbody></table></div>'
          : '<div class="empty"><span class="big">✓</span>' +
            (filterMode === 'all' ? 'No scheduled cheques found.' : 'All clear. Nothing waiting for approval right now.') +
            '</div>') +
      '</div>';
  };

  // Add action handlers for the toggles
  window.__LS_registerAction('approvals-view-due', () => {
    state.filters.approvalsMode = 'due';
    renderApp();
  });
  
  window.__LS_registerAction('approvals-view-all', () => {
    state.filters.approvalsMode = 'all';
    renderApp();
  });

  // Override the route to use the new function
  __LS_addRoute('approvals', 'Approvals', window.renderApprovals);

})();
</script>
<!-- ═══════════════════════════════════════════════════════════════════════
     PAYEE LINK FIX & LIVE RECALCULATION
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  // 1. Auto-Repair Broken Links in the background
  function repairPayeeLinks() {
    let fixed = 0;
    const payees = arr(state.data.payees);
    
    arr(state.data.cheques).forEach(c => {
      // If cheque has a name but no ID, try to find the matching payee
      if (!c.payeeId && c.payeeName) {
        const cleanName = c.payeeName.trim().toLowerCase();
        const match = payees.find(p => p.name.trim().toLowerCase() === cleanName);
        if (match) {
          c.payeeId = match.id;
          markDirty('cheques', c.id);
          fixed++;
        }
      }
    });

    if (fixed > 0) {
      dbg.ok('Auto-repaired ' + fixed + ' cheque links to payees.');
      renderApp(); // Re-render if we fixed something
    }
  }

  // 2. Override the Payee View to calculate totals LIVE
  window.renderPayees = function() {
    const all = arr(state.data.payees).slice();
    const filter = state.filters.payees || {};
    const q = (filter.q || '').toLowerCase();
    const type = filter.type || 'all';

    // Calculate real stats from cheques
    const stats = {};
    arr(state.data.cheques).forEach(c => {
      if (!c.payeeId) return;
      if (!stats[c.payeeId]) {
        stats[c.payeeId] = { count: 0, total: 0, lastAmt: 0, lastDate: null };
      }
      const s = stats[c.payeeId];
      s.count++;
      s.total += num(c.amount);
      
      // Find the most recent cheque for "Last Amount"
      if (!s.lastDate || c.chequeDate > s.lastDate) {
        s.lastDate = c.chequeDate;

<!-- ═══════════════════════════════════════════════════════════════════════
     CHEQUE BOOK AUTO-NUMBERING (Fills Gaps Automatically)
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  // Intercept the openBookForm function
  const origOpenBookForm = window.openBookForm;
  
  window.openBookForm = function(id) {
    // If creating a new book (no ID)
    if (!id) {
      // 1. Get all existing book numbers
      const books = arr(state.data.chequeBooks);
      
      // 2. Extract just the numbers from the strings (e.g. "BK-001" becomes 1)
      const existingNumbers = books.map(b => {
        const match = String(b.bookNo).match(/(\d+)$/);
        return match ? parseInt(match[1], 10) : null;
      }).filter(n => n !== null).sort((a, b) => a - b);
      
      // 3. Find the first available gap
      let nextNumber = 1;
      for (let i = 0; i < existingNumbers.length; i++) {
        if (existingNumbers[i] === nextNumber) {
          nextNumber++; // This number is taken, try the next one
        } else if (existingNumbers[i] > nextNumber) {
          break; // We found a gap!
        }
      }
      
      // 4. Format as "001", "002", etc. (3 digits)
      const autoBookNo = String(nextNumber).padStart(3, '0');
      
      // 5. Call the original form to open the modal
      origOpenBookForm(id);
      
      // 6. Inject the auto-generated number into the input field
      setTimeout(() => {
        const input = document.getElementById('kBookNo');
        if (input) {
          input.value = autoBookNo;
          // Highlight the text so the user knows it's auto-filled (optional)
          input.select(); 
        }
      }, 50);
      
    } else {
      // If editing an existing book, just open it normally
      origOpenBookForm(id);
    }
  };

})();
</script>

        if (doc) {

          if (_snapshot[key] !== now) {
            ops.push({ type: 'set', col, id, data: doc });
            _snapshot[key] = now;
          }
        } else {
          // If it's marked dirty but NOT in the local array, it MUST be deleted.
          ops.push({ type: 'delete', col, id });
          delete _snapshot[key];
