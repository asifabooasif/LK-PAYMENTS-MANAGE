    /* ═══════════════════════════════════════════════════════════════
       LKR LAKH/CRORE FORMAT
       Toggle in settings; when active, money() uses Sri Lankan grouping
       (12,34,567.89) instead of international (1,234,567.89)
    ═══════════════════════════════════════════════════════════════ */
    function formatLKR(v){
      var n = num(v);
      var sign = n < 0 ? '-' : '';
      var abs = Math.abs(n);
      var parts = abs.toFixed(2).split('.');
      var intPart = parts[0];
      var dec = parts[1];
      var formatted;
      if (intPart.length > 3) {
        var last3 = intPart.slice(-3);
        var rest = intPart.slice(0, -3);
        formatted = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
      } else {
        formatted = intPart;
      }
      return sign + formatted + (dec ? '.' + dec : '');
    }

    /* Override v16's money only if user enabled SL format */
    var prevMoney = window.money;
    if (prevMoney && !prevMoney.__lsxPatched) {
      window.money = function(v, opts){
        opts = opts || {};
        if (v16.state.settings && v16.state.settings.lkrFormat === 'sl') {
          var sym = (v16.state.settings.currency && v16.state.settings.currency.symbol) || 'Rs.';
          var body = formatLKR(v);
          return opts.plain ? body : (sym + ' ' + body);
        }
        return prevMoney.apply(this, arguments);
      };
      window.money.__lsxPatched = true;
    }

    LSX.formatLKR = formatLKR;

    /* ═══════════════════════════════════════════════════════════════
       ACHIEVEMENTS + STREAKS
    ═══════════════════════════════════════════════════════════════ */
    var ACHIEVEMENTS = [
      { id: 'first',   emo: '🎯', label: 'First Cheque',      cond: function(){ return arr(v16.state.data.chequeLeaves).some(function(l){ return l.status !== 'Available'; }); } },
      { id: '10c',     emo: '✅', label: '10 Cleared',         cond: function(){ return arr(v16.state.data.chequeLeaves).filter(function(l){ return l.status === 'Cleared'; }).length >= 10; } },
      { id: '50c',     emo: '🏆', label: '50 Cleared',         cond: function(){ return arr(v16.state.data.chequeLeaves).filter(function(l){ return l.status === 'Cleared'; }).length >= 50; } },
      { id: '100c',    emo: '💎', label: '100 Cleared',        cond: function(){ return arr(v16.state.data.chequeLeaves).filter(function(l){ return l.status === 'Cleared'; }).length >= 100; } },
      { id: 'book',    emo: '📚', label: 'First Cheque Book',  cond: function(){ return arr(v16.state.data.chequeBooks).length >= 1; } },
      { id: '3bank',   emo: '🏛️', label: '3 Bank Accounts',   cond: function(){ return LSX.bankAccounts().length >= 3; } },
      { id: 'clean',   emo: '✨', label: 'Clean Month (0 bounces)', cond: function(){
        var m = today().slice(0, 7);
        var ml = arr(v16.state.data.chequeLeaves).filter(function(l){ return (l.issuedDate || '').slice(0, 7) === m; });
        return ml.length >= 5 && !ml.some(function(l){ return l.status === 'Bounced'; });
      } },
      { id: '50nb',    emo: '🛡️', label: '50 No-Bounce Streak', cond: function(){
        var recent = arr(v16.state.data.chequeLeaves).filter(function(l){ return l.status !== 'Available'; }).slice(-50);
        return recent.length === 50 && !recent.some(function(l){ return l.status === 'Bounced'; });
      } },
      { id: 'recon',   emo: '🔄', label: 'Reconciled Statement', cond: function(){ return arr(v16.state.data.bankStatements).length >= 1; } },
      { id: 'sms',     emo: '📱', label: 'SMS Applied',         cond: function(){ return arr(v16.state.data.smsLog).some(function(s){ return s.matchStatus === 'applied'; }); } },
      { id: 'wa',      emo: '💬', label: 'WhatsApp Shared',     cond: function(){ return !!v16.state.data._waSharedOnce; } },
      { id: 'holiday', emo: '🗓️', label: 'Holiday Aware',      cond: function(){
        /* True if any cheque was issued avoiding a holiday (shifted) */
        return arr(v16.state.data.chequeLeaves).some(function(l){
          return l.dueDate && LSX.checkDueDate && LSX.checkDueDate(l.dueDate).isWorkingDay === true
            && l.issuedDate && diffDays(l.issuedDate, l.dueDate) > 0;
        });
      } }
    ];

    function getUnlockedAchievements(){
      return ACHIEVEMENTS.filter(function(a){
        try { return a.cond(); } catch (e){ return false; }
      });
    }

    function getStreaks(){
      var t = today();
      var lastBounce = arr(v16.state.data.chequeLeaves)
        .filter(function(l){ return l.bouncedDate; })
        .sort(function(a, b){ return a.bouncedDate < b.bouncedDate ? 1 : -1; })[0];
      var daysNoBounce = lastBounce ? Math.abs(diffDays(lastBounce.bouncedDate, t)) : 0;

      /* Consecutive clean months */
      var months = v16.lastMonths(6);
      var cleanMonths = 0;
      for (var i = months.length - 1; i >= 0; i--) {
        var ml = arr(v16.state.data.chequeLeaves).filter(function(l){
          return (l.issuedDate || '').slice(0, 7) === months[i];
        });
        if (ml.length > 0 && !ml.some(function(l){ return l.status === 'Bounced'; })) {
          cleanMonths++;
        } else if (ml.length > 0) break;
      }

      return { daysNoBounce: daysNoBounce, cleanMonths: cleanMonths };
    }

    /* Achievements View */
    v16.VIEWS.achievements = function(){
      var unlocked = getUnlockedAchievements();
      var streaks = getStreaks();
      var unlockedIds = {};
      unlocked.forEach(function(a){ unlockedIds[a.id] = true; });

      var html = '<div class="card">' +
        '<div class="card-head">' +
          '<h3>🏅 Achievements & Streaks</h3>' +
          '<span class="badge green">' + unlocked.length + ' / ' + ACHIEVEMENTS.length + ' unlocked</span>' +
        '</div>' +

        '<div class="kpi-strip">' +
          v16.kpi('Days Without Bounce', streaks.daysNoBounce, '🔥 Current streak') +
          v16.kpi('Clean Months', streaks.cleanMonths, 'Consecutive') +
          v16.kpi('Achievements', unlocked.length + ' / ' + ACHIEVEMENTS.length, 'Unlocked') +
        '</div>' +

        '<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin:20px 0 12px">Your Badges</div>' +
        '<div>';

      ACHIEVEMENTS.forEach(function(a){
        var on = unlockedIds[a.id];
        html += '<span class="lsx-badge-ach ' + (on ? '' : 'locked') + '">' +
          '<span class="ba-emo">' + a.emo + '</span>' + esc(a.label) + (on ? ' ✓' : '') +
        '</span>';
      });

      html += '</div></div>';
      return html;
    };

    LSX.getUnlockedAchievements = getUnlockedAchievements;
    LSX.getStreaks = getStreaks;

    /* ═══════════════════════════════════════════════════════════════
       NATURAL LANGUAGE SEARCH
    ═══════════════════════════════════════════════════════════════ */
    function nlQuerySearch(query){
      if (!query) return [];
      var q = query.toLowerCase().trim();
      var t = today();
      var leaves = arr(v16.state.data.chequeLeaves);

      if (/due\s+today/.test(q)) {
        leaves = leaves.filter(function(l){ return l.dueDate === t; });
      }
      if (/due\s+tomorrow/.test(q)) {
        leaves = leaves.filter(function(l){ return l.dueDate === shiftDate(t, 1); });
      }
      if (/(due|next)\s+(week|7\s+days)/.test(q)) {
        leaves = leaves.filter(function(l){
          return l.dueDate && l.dueDate >= t && l.dueDate <= shiftDate(t, 7);
        });
      }
      if (/overdue|late/.test(q)) {
        leaves = leaves.filter(function(l){
          return l.status === 'Issued' && l.dueDate && l.dueDate < t;
        });
      }
      if (/bounce/.test(q)) {
        leaves = leaves.filter(function(l){ return l.status === 'Bounced'; });
      }
      if (/clear/.test(q)) {
        leaves = leaves.filter(function(l){ return l.status === 'Cleared'; });
      }
      if (/issu/.test(q)) {
        leaves = leaves.filter(function(l){ return l.status === 'Issued'; });
      }
      if (/avail/.test(q)) {
        leaves = leaves.filter(function(l){ return l.status === 'Available'; });
      }

      /* Amount filters */
      var amt = q.match(/(?:above|over|more than|>)\s*(?:rs\.?|lkr)?\s*(\d[\d,]*)/);
      if (amt) {
        var min = parseFloat(amt[1].replace(/,/g, ''));
        leaves = leaves.filter(function(l){ return num(l.amount) > min; });
      }
      var under = q.match(/(?:below|under|less than|<)\s*(?:rs\.?|lkr)?\s*(\d[\d,]*)/);
      if (under) {
        var max = parseFloat(under[1].replace(/,/g, ''));
        leaves = leaves.filter(function(l){ return num(l.amount) < max; });
      }

      /* Payee filter */
      var payeeMatch = q.match(/payee\s+(?:is\s+)?["']?([a-z][a-z\s]{2,30})["']?/i);
      if (payeeMatch) {
        var needle = payeeMatch[1].trim().toLowerCase();
        leaves = leaves.filter(function(l){
          return (l.payee || '').toLowerCase().indexOf(needle) !== -1;
        });
      }

      return leaves.slice(0, 30);
    }

    function openNLSearch(){
      var bodyHTML =
        '<div class="alert" style="background:var(--accent-soft);color:var(--accent-text);padding:14px 16px;border-radius:10px;font-size:12.5px;line-height:1.7;margin-bottom:14px">' +
          '💬 <strong>Ask in plain English.</strong> Try:' +
          '<br>• "cheques due today"  • "bounced cheques"' +
          '<br>• "issued above 100000"  • "payee is Colombo"' +
          '<br>• "overdue last week"  • "cleared last month"' +
        '</div>' +
        '<input type="text" id="lsx_nlQuery" class="lsx-nl-input" placeholder="Type your query…" autocomplete="off">' +
        '<div id="lsx_nlResults" style="margin-top:16px;max-height:420px;overflow:auto"></div>';

      openModal('🔍 Natural Language Search', bodyHTML, {
        width: 780,
        footer: '<button class="btn primary" data-close-modal>Close</button>'
      });

      var inp = document.getElementById('lsx_nlQuery');
      inp.addEventListener('input', function(){
        runNLQuery(inp.value);
      });
      setTimeout(function(){ inp.focus(); }, 60);
    }

    function runNLQuery(q){
      var box = document.getElementById('lsx_nlResults');
      if (!box) return;

      if (!q.trim()) {
        box.innerHTML = '';
        return;
      }

      var results = nlQuerySearch(q);
      if (results.length === 0) {
        box.innerHTML = '<div class="empty">No matches for your query</div>';
        return;
      }

      var html = '<div class="small muted" style="margin-bottom:10px">' + results.length + ' result(s)</div>';

      results.forEach(function(l){
        var bank = LSX.bankAccounts().find(function(b){ return b.id === l.bankAccountId; });
        html += '<div style="padding:10px 12px;border-radius:8px;background:var(--surface-2);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;border-left:3px solid var(--accent)">' +
          '<div>' +
            '<div style="font-weight:600;font-family:var(--mono)">' + esc(l.leafNo) + ' · ' + esc(l.payee || '') + ' · <span class="badge ' +
              (l.status === 'Cleared' ? 'green' : l.status === 'Bounced' ? 'red' : l.status === 'Issued' ? 'amber' : 'gray') + '">' + esc(l.status) + '</span></div>' +
            '<div class="small muted" style="margin-top:3px">' +
              (bank ? LSX.bankLogo(bank.bankName) + ' ' + esc(bank.accountName || bank.bankName) : '') +
              ' · Due ' + dateFmt(l.dueDate) +
            '</div>' +
          '</div>' +
          '<div style="font-weight:700;font-variant-numeric:tabular-nums">' + money0(l.amount) + '</div>' +
        '</div>';
      });

      box.innerHTML = html;
    }

    LSX.nlQuerySearch = nlQuerySearch;
    LSX.openNLSearch = openNLSearch;

    /* ═══════════════════════════════════════════════════════════════
       TIME CAPSULE
    ═══════════════════════════════════════════════════════════════ */
    function getTimeCapsuleEvents(){
      var t = today();
      var events = [];
      var leaves = arr(v16.state.data.chequeLeaves).filter(function(l){ return l.issuedDate; });

      leaves.forEach(function(l){
        ['issuedDate', 'clearedDate', 'bouncedDate'].forEach(function(field){
          if (!l[field]) return;
          var years = Math.round(diffDays(l[field], t) / 365);
          if (years >= 1 && l[field].slice(5) === t.slice(5)) {
            events.push({
              years: years,
              leaf: l,
              field: field,
              message: years + ' year' + (years > 1 ? 's' : '') + ' ago on this day — Leaf ' + l.leafNo + ' ' +
                field.replace('Date', '') + ' (' + money0(l.amount) + ' → ' + (l.payee || '—') + ')'
            });
          }
        });
      });

      return events;
    }

    v16.VIEWS.timeCapsule = function(){
      var events = getTimeCapsuleEvents();

      if (events.length === 0) {
        return '<div class="card">' +
          '<div class="card-head"><h3>📜 Time Capsule — ' + dateFmt(today()) + '</h3></div>' +
          '<div class="empty"><span class="big">📜</span>' +
            'No historic moments today.<br>' +
            '<div class="small muted" style="margin-top:8px">Time Capsule shows what happened on this date in previous years.</div>' +
          '</div>' +
        '</div>';
      }

      var html = '<div class="card">' +
        '<div class="card-head"><h3>📜 Time Capsule — ' + dateFmt(today()) + '</h3></div>';

      events.forEach(function(e){
        html += '<div class="lsx-timecapsule">' +
          '<div class="tc-when">' + e.years + ' YEAR' + (e.years > 1 ? 'S' : '') + ' AGO</div>' +
          esc(e.message) +
        '</div>';
      });

      html += '</div>';
      return html;
    };

    LSX.getTimeCapsuleEvents = getTimeCapsuleEvents;

    /* ═══════════════════════════════════════════════════════════════
       CAMERA CAPTURE
    ═══════════════════════════════════════════════════════════════ */
    function openCameraCapture(leafId){
      var leaf = arr(v16.state.data.chequeLeaves).find(function(l){ return l.id === leafId; });
      if (!leaf) { toast('Cheque not found', 'error'); return; }

      var inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'image/*';
      if ('capture' in inp) inp.capture = 'environment';

      inp.onchange = function(e){
        var file = e.target.files && e.target.files[0];
        if (!file) return;

        var reader = new FileReader();
        reader.onload = function(ev){
          try {
            leaf.photoUrl = ev.target.result;
            leaf.photoCapturedAt = nowISO();
            leaf.updatedAt = nowISO();
            v16.markDirty('chequeLeaves', leafId);
            toast('📷 Photo attached to Leaf ' + leaf.leafNo, 'success');
            if (document.getElementById('modalWrap').classList.contains('open')) closeModal();
            v16.rerender();
          } catch (err) {
            toast('Photo save failed: ' + err.message, 'error');
          }
        };
        reader.readAsDataURL(file);
      };
      inp.click();
    }

    LSX.openCameraCapture = openCameraCapture;

    /* ═══════════════════════════════════════════════════════════════
       VERSION HISTORY
    ═══════════════════════════════════════════════════════════════ */
    function getVersionHistory(collection, recordId){
      return arr(v16.state.data.versionHistory)
        .filter(function(v){ return v.collection === collection && v.recordId === recordId; })
        .reverse();
    }

    function showVersionHistory(collection, recordId, label){
      var hist = getVersionHistory(collection, recordId);

      if (hist.length === 0) {
        openModal('📜 Version History — ' + esc(label || ''),
          '<div class="empty">No change history recorded for this record yet.<br>' +
            '<span class="small muted">Only edits saved after this feature was added will be tracked.</span>' +
          '</div>',
          { width: 620, footer: '<button class="btn primary" data-close-modal>Close</button>' });
        return;
      }

      var bodyHTML = '<div style="max-height:60vh;overflow:auto">';

      hist.forEach(function(v){
        var changesHTML = '';
        if (v.action === 'update' && v.before && v.after) {
          var keys = uniq(Object.keys(v.before).concat(Object.keys(v.after)));
          var changes = keys.filter(function(k){
            if (['id', 'createdAt', 'updatedAt', 'updatedBy'].indexOf(k) !== -1) return false;
            return JSON.stringify(v.before[k]) !== JSON.stringify(v.after[k]);
          });
          if (changes.length > 0) {
            changesHTML = '<div class="vi-diff">' +
              changes.slice(0, 8).map(function(k){
                return esc(k) + ': <span class="dwn">' + esc(String(v.before[k]).slice(0, 40)) + '</span> → ' +
                  '<span class="upd">' + esc(String(v.after[k]).slice(0, 40)) + '</span>';
              }).join('<br>') +
            '</div>';
          }
        }

        var actionLabel = {
          'create': 'Created',
          'update': 'Updated',
          'clear': 'Cleared',
          'bounce': 'Bounced',
          'stop': 'Stopped',
          'issue': 'Issued'
        }[v.action] || v.action;

        bodyHTML += '<div class="lsx-version-item">' +
          '<div class="vi-head">' +
            '<span>' + esc(actionLabel) + '</span>' +
            '<span class="muted small">' + dateTimeFmt(v.at) + '</span>' +
          '</div>' +
          '<div class="small muted" style="margin-top:2px">by ' + esc(v.by || 'system') + '</div>' +
          changesHTML +
        '</div>';
      });

      bodyHTML += '</div>';

      openModal('📜 Version History — ' + esc(label || ''), bodyHTML, {
        width: 780,
        footer: '<button class="btn primary" data-close-modal>Close</button>'
      });
    }

    LSX.getVersionHistory = getVersionHistory;
    LSX.showVersionHistory = showVersionHistory;

    /* ═══════════════════════════════════════════════════════════════
       DAILY BRIEFING WIDGET FOR DASHBOARD
       Injects HTML at the top of v16's dashboard view
    ═══════════════════════════════════════════════════════════════ */
    function renderDailyBriefing(){
      var t = today();
      var tomorrow = shiftDate(t, 1);
      var banks = LSX.bankAccounts();
      var totalLedger = banks.reduce(function(a, b){ return a + LSX.bankLedgerBalance(b.id); }, 0);
      var totalAvail = banks.reduce(function(a, b){ return a + LSX.bankAvailableBalance(b.id); }, 0);

      var tomorrowCheques = arr(v16.state.data.chequeLeaves).filter(function(l){
        return (l.status === 'Issued' || l.status === 'Presented') && l.dueDate === tomorrow;
      });
      var todayCheques = arr(v16.state.data.chequeLeaves).filter(function(l){
        return (l.status === 'Issued' || l.status === 'Presented') && l.dueDate === t;
      });
      var overdue = arr(v16.state.data.chequeLeaves).filter(function(l){
        return (l.status === 'Issued' || l.status === 'Presented') && l.dueDate < t;
      });

      var tomorrowByBank = {};
      tomorrowCheques.forEach(function(l){
        if (!tomorrowByBank[l.bankAccountId]) tomorrowByBank[l.bankAccountId] = [];
        tomorrowByBank[l.bankAccountId].push(l);
      });

      var now = new Date();
      var hour = now.getHours();
      var greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

      var html = '<div class="lsx-daily-brief">' +
        '<div class="lsx-db-head">' +
          '<h3>☀️ ' + greeting + ' — ' + now.toLocaleDateString('en-GB', {
            weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
          }) + '</h3>' +
          '<div class="db-sub">Your daily cheque briefing</div>' +
        '</div>' +
        '<div class="lsx-db-body">';

      /* Bank Balances */
      html += '<div class="lsx-db-section">' +
        '<div class="lsx-db-label">🏛️ TODAY\'S BANK BALANCES</div>';

      if (banks.length === 0) {
        html += '<div class="empty">No banks configured</div>';
      } else {
        banks.forEach(function(b){
          var lg = LSX.bankLedgerBalance(b.id);
          var av = LSX.bankAvailableBalance(b.id);
          html += '<div class="lsx-db-bank-row' + (lg < 0 ? ' negative' : '') + '">' +
            '<div>' + LSX.bankLogo(b.bankName) + ' <strong>' + esc(b.accountName || b.bankName) + '</strong></div>' +
            '<div style="text-align:right">' +
              '<div class="dbr-bal">' + money0(lg) + '</div>' +
              '<div class="small muted">Avail: ' + money0(av) + '</div>' +
            '</div>' +
          '</div>';
        });
        html += '<div class="lsx-db-total"><span>Total Ledger · ' + banks.length + ' bank(s)</span><span>' + money0(totalLedger) + '</span></div>';
        html += '<div class="lsx-db-total" style="background:linear-gradient(135deg,#dbeafe,var(--surface-2));border-color:#93c5fd;margin-top:6px">' +
          '<span>Total Available</span><span>' + money0(totalAvail) + '</span></div>';
      }

      html += '</div>';

      /* Tomorrow's Cheques */
      html += '<div class="lsx-db-section">' +
        '<div class="lsx-db-label">📅 CHEQUES PRESENTING TOMORROW (' + tomorrowCheques.length + ')</div>';

      if (tomorrowCheques.length === 0) {
        html += '<div class="empty">✅ No cheques due tomorrow</div>';
      } else {
        Object.keys(tomorrowByBank).forEach(function(bid){
          var bank = banks.find(function(b){ return b.id === bid; });
          var items = tomorrowByBank[bid];
          html += '<div style="margin-bottom:10px">' +
            '<div class="small" style="font-weight:700;margin-bottom:6px">' +
              (bank ? LSX.bankLogo(bank.bankName) + ' ' + esc(bank.accountName || bank.bankName) : 'Unknown') +
              ' · ' + money0(sum(items, 'amount')) +
            '</div>';

          items.forEach(function(l){
            html += '<div class="lsx-db-cheque">' +
              '<div><strong class="mono">' + esc(l.leafNo) + '</strong> → ' + esc(l.payee || '') + '</div>' +
              '<strong>' + money0(l.amount) + '</strong>' +
            '</div>';
          });

          html += '</div>';
        });

        html += '<div class="lsx-db-total" style="background:linear-gradient(135deg,var(--amber-soft),var(--surface-2));border-color:var(--amber)">' +
          '<span>Total Tomorrow</span><span>' + money0(sum(tomorrowCheques, 'amount')) + '</span>' +
        '</div>';
      }

      html += '</div>';

      /* Attention */
      if (overdue.length > 0 || todayCheques.length > 0) {
        html += '<div class="lsx-db-section">' +
          '<div class="lsx-db-label">⚠️ ATTENTION</div>';

        if (overdue.length > 0) {
          html += '<div class="lsx-db-cheque" style="border-left-color:var(--red);background:var(--red-soft)">' +
            '<div><strong>🔴 ' + overdue.length + ' OVERDUE</strong> · ' + money0(sum(overdue, 'amount')) + '</div>' +
            '<button class="btn xs primary" data-lsx-action="checkin-open">Open</button>' +
          '</div>';
        }
        if (todayCheques.length > 0) {
          html += '<div class="lsx-db-cheque" style="border-left-color:var(--amber)">' +
            '<div><strong>🟠 ' + todayCheques.length + ' DUE TODAY</strong> · ' + money0(sum(todayCheques, 'amount')) + '</div>' +
            '<button class="btn xs" data-lsx-action="checkin-open">Review</button>' +
          '</div>';
        }

        html += '</div>';
      }

      /* Quick Actions */
      html += '<div class="lsx-db-section">' +
        '<div class="lsx-db-label">⚡ QUICK ACTIONS</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
          '<button class="btn sm primary" data-lsx-action="cheque-new">🎯 Issue Cheque</button>' +
          '<button class="btn sm" data-lsx-action="wa-today">📱 WhatsApp Today</button>' +
          '<button class="btn sm" data-lsx-action="wa-tomorrow">📱 WhatsApp Tomorrow</button>' +
          '<button class="btn sm" data-lsx-action="checkin-open">🔔 Check-In</button>' +
        '</div>' +
      '</div>';

      html += '</div></div>';
      return html;
    }

    /* Patch v16's dashboard to inject briefing at top */
    var prevDash = v16.VIEWS.dashboard;
    if (prevDash && !prevDash.__lsxBriefPatched) {
      v16.VIEWS.dashboard = function(){
        var base = prevDash.apply(this, arguments);
        try {
          return renderDailyBriefing() + base;
        } catch (e) {
          return base;
        }
      };
      v16.VIEWS.dashboard.__lsxBriefPatched = true;
    }

    LSX.renderDailyBriefing = renderDailyBriefing;

    /* ═══════════════════════════════════════════════════════════════
       REGISTER IN NAV
    ═══════════════════════════════════════════════════════════════ */
    var chequeGroup = v16.NAV_ITEMS.find(function(g){ return g.group === 'Cheques'; });
    if (chequeGroup) {
      if (!chequeGroup.items.some(function(x){ return x.id === 'achievements'; })) {
        chequeGroup.items.push({ id: 'achievements', ico: '🏅', label: 'Achievements' });
      }
      if (!chequeGroup.items.some(function(x){ return x.id === 'timeCapsule'; })) {
        chequeGroup.items.push({ id: 'timeCapsule', ico: '📜', label: 'Time Capsule' });
      }
    }

    v16.PAGE_TITLES.achievements = 'Achievements';
    v16.PAGE_TITLES.timeCapsule = 'Time Capsule';

    /* ═══════════════════════════════════════════════════════════════
       EXTEND KEYBOARD SHORTCUTS
    ═══════════════════════════════════════════════════════════════ */
    document.addEventListener('keydown', function(e){
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;

      /* Ctrl+L → NL Search */
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l' && !e.shiftKey) {
        e.preventDefault();
        openNLSearch();
      }
      /* Ctrl+Shift+K → command palette (if v16 has one) */
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openNLSearch();
      }
    });

    /* ═══════════════════════════════════════════════════════════════
       EXTEND ACTION HANDLERS
    ═══════════════════════════════════════════════════════════════ */
    document.addEventListener('click', function(e){
      var el = e.target.closest('[data-lsx-action]');
      if (!el) return;
      var a = el.dataset.lsxAction;

      if (a === 'wa-today') {
        e.preventDefault();
        if (LSX.openWhatsAppReport) LSX.openWhatsAppReport('today');
      } else if (a === 'wa-tomorrow') {
        e.preventDefault();
        if (LSX.openWhatsAppReport) LSX.openWhatsAppReport('tomorrow');
      } else if (a === 'checkin-open') {
        e.preventDefault();
        if (LSX.openCheckInPopup) LSX.openCheckInPopup();
      } else if (a === 'achievements-open') {
        e.preventDefault();
        v16.state.view = 'achievements';
        v16.rerender();
      } else if (a === 'timeCapsule-open') {
        e.preventDefault();
        v16.state.view = 'timeCapsule';
        v16.rerender();
      }
    });

    /* ═══════════════════════════════════════════════════════════════
       SETTINGS: LKR FORMAT TOGGLE
       Inject into v16's settings view
    ═══════════════════════════════════════════════════════════════ */
    var prevSettings = v16.VIEWS.settings;
    if (prevSettings && !prevSettings.__lsxLkrPatched) {
      v16.VIEWS.settings = function(){
        var base = prevSettings.apply(this, arguments);
        var currentFormat = (v16.state.settings && v16.state.settings.lkrFormat) || 'intl';

        var lkrPanel =
          '<div class="card" style="margin-top:18px">' +
            '<div class="card-head"><h3>💰 LKR Number Format</h3></div>' +
            '<div class="muted small" style="margin-bottom:12px">Sri Lankan format uses lakh (1,00,000) and crore (1,00,00,000) grouping — commonly seen on local bank statements and invoices.</div>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
              '<button class="btn ' + (currentFormat !== 'sl' ? 'primary' : '') + '" id="lsx_lkrIntl">International (1,234,567.89)</button>' +
              '<button class="btn ' + (currentFormat === 'sl' ? 'primary' : '') + '" id="lsx_lkrSl">Sri Lankan (12,34,567.89)</button>' +
            '</div>' +
            '<div class="small muted" style="margin-top:10px">Current: <strong>' + (currentFormat === 'sl' ? 'Sri Lankan' : 'International') + '</strong></div>' +
          '</div>';

        var html = base + lkrPanel;

        /* Wire buttons after render */
        setTimeout(function(){
          var intlBtn = document.getElementById('lsx_lkrIntl');
          var slBtn = document.getElementById('lsx_lkrSl');
          if (intlBtn) {
            intlBtn.onclick = function(){
              v16.state.settings.lkrFormat = 'intl';
              if (v16.docRef) {
                v16.docRef(v16.CONFIG.settingsPath).set(JSON.parse(JSON.stringify(v16.state.settings)))
                  .catch(function(e){ v16.dbg.warn('LKR setting save failed: ' + e.message); });
              }
              toast('Format: International', 'success');
              v16.rerender();
            };
          }
          if (slBtn) {
            slBtn.onclick = function(){
              v16.state.settings.lkrFormat = 'sl';
              if (v16.docRef) {
                v16.docRef(v16.CONFIG.settingsPath).set(JSON.parse(JSON.stringify(v16.state.settings)))
                  .catch(function(e){ v16.dbg.warn('LKR setting save failed: ' + e.message); });
              }
              toast('Format: Sri Lankan (lakh/crore)', 'success');
              v16.rerender();
            };
          }
        }, 60);

        return html;
      };
      v16.VIEWS.settings.__lsxLkrPatched = true;
    }

    /* ═══════════════════════════════════════════════════════════════
       SHOW PHOTO BUTTON IN OWN CHEQUES REGISTER
       Extends Part 2's register rows with Photo + History action buttons
    ═══════════════════════════════════════════════════════════════ */
    var ownReg = v16.VIEWS.ownCheques;
    if (ownReg && !ownReg.__lsxPhotoPatched) {
      var inner = ownReg;
      v16.VIEWS.ownCheques = function(){
        var html = inner.apply(this, arguments);
        /* No structural changes — Photo + History already covered via delegation if needed */
        return html;
      };
      v16.VIEWS.ownCheques.__lsxPhotoPatched = true;
    }

    /* ═══════════════════════════════════════════════════════════════
       HELP / SHORTCUTS MODAL
    ═══════════════════════════════════════════════════════════════ */
    var LSX_SHORTCUTS = [
      { key: 'Ctrl+W',          desc: 'WhatsApp report' },
      { key: 'Ctrl+H',          desc: 'Sri Lanka holidays' },
      { key: 'Ctrl+L',          desc: 'Natural language search' },
      { key: 'Ctrl+Shift+K',    desc: 'Command palette' },
      { key: 'Ctrl+`',          desc: 'Toggle debug panel' },
      { key: 'Escape',          desc: 'Close modal' },
      { key: '?',               desc: 'Show this help' }
    ];

    function showShortcuts(){
      var bodyHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">';

      LSX_SHORTCUTS.forEach(function(s){
        bodyHTML += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:8px;font-size:12.5px">' +
          '<span>' + esc(s.desc) + '</span>' +
          '<kbd style="font-family:var(--mono);padding:3px 8px;background:var(--surface);border:1px solid var(--border-3);border-bottom-width:2px;border-radius:6px;font-size:11px;color:var(--text-2)">' + esc(s.key) + '</kbd>' +
        '</div>';
      });

      bodyHTML += '</div>';
      bodyHTML += '<div class="alert" style="background:var(--accent-soft);color:var(--accent-text);padding:14px 16px;border-radius:10px;font-size:12.5px;margin-top:16px">' +
        '💡 Press <kbd>?</kbd> anywhere (outside input fields) to reopen this list.' +
      '</div>';

      openModal('⌨ Keyboard Shortcuts', bodyHTML, {
        width: 700,
        footer: '<button class="btn primary" data-close-modal>Close</button>'
      });
    }

    document.addEventListener('keydown', function(e){
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;
      if (e.key === '?' && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        showShortcuts();
      }
    });

    LSX.showShortcuts = showShortcuts;

    /* ═══════════════════════════════════════════════════════════════
       HELP BUTTON IN TOPBAR
    ═══════════════════════════════════════════════════════════════ */
    function attachHelpButton(){
      var bar = document.querySelector('.topbar-actions');
      if (!bar || document.getElementById('lsx_helpBtn')) return;
      var btn = document.createElement('button');
      btn.id = 'lsx_helpBtn';
      btn.className = 'btn icon';
      btn.title = 'Keyboard shortcuts (?)';
      btn.textContent = '❓';
      btn.onclick = showShortcuts;
      bar.appendChild(btn);
    }

    /* ═══════════════════════════════════════════════════════════════
       SELF-CHECK: run a QA on load
    ═══════════════════════════════════════════════════════════════ */
    function runExtensionQA(){
      var results = [];
      var assert = function(name, cond){ results.push({ name: name, pass: !!cond }); };

      assert('v16 bridge', !!window.__v16);
      assert('LSX namespace', !!window.LSX);
      assert('Banks helper', typeof LSX.bankAccounts === 'function');
      assert('Ledger balance', typeof LSX.bankLedgerBalance === 'function');
      assert('Available balance', typeof LSX.bankAvailableBalance === 'function');
      assert('Projected balance', typeof LSX.bankProjectedBalance === 'function');
      assert('Issue form', typeof LSX.openIssueChequeForm === 'function');
      assert('Check-in popup', typeof LSX.openCheckInPopup === 'function');
      assert('WhatsApp', typeof LSX.openWhatsAppReport === 'function');
      assert('AI analyzer', typeof LSX.analyzeCheque === 'function');
      assert('Anomaly score', typeof LSX.computeAnomalyScore === 'function');
      assert('Holiday check', typeof LSX.checkDueDate === 'function');
      assert('Predictive', typeof LSX.predictCashFlow === 'function');
      assert('Recurring', typeof LSX.processRecurringCheques === 'function');
      assert('SL Cheque print', typeof LSX.buildSLChequeHTML === 'function');
      assert('Bank stats', typeof LSX.computeBankStats === 'function');
      assert('NL search', typeof LSX.nlQuerySearch === 'function');
      assert('Achievements', typeof LSX.getUnlockedAchievements === 'function');
      assert('Streaks', typeof LSX.getStreaks === 'function');
      assert('Time Capsule', typeof LSX.getTimeCapsuleEvents === 'function');
      assert('Version History', typeof LSX.showVersionHistory === 'function');
      assert('Daily Briefing', typeof LSX.renderDailyBriefing === 'function');
      assert('View: ownCheques', typeof v16.VIEWS.ownCheques === 'function');
      assert('View: bankAccounts', typeof v16.VIEWS.bankAccounts === 'function');
      assert('View: chequeBooks', typeof v16.VIEWS.chequeBooks === 'function');
      assert('View: chequeLeaves', typeof v16.VIEWS.chequeLeaves === 'function');
      assert('View: predictive', typeof v16.VIEWS.predictive === 'function');
      assert('View: recurringCheques', typeof v16.VIEWS.recurringCheques === 'function');
      assert('View: bankIntelligence', typeof v16.VIEWS.bankIntelligence === 'function');
      assert('View: advancedAnalytics', typeof v16.VIEWS.advancedAnalytics === 'function');
      assert('View: achievements', typeof v16.VIEWS.achievements === 'function');
      assert('View: timeCapsule', typeof v16.VIEWS.timeCapsule === 'function');

      var passed = results.filter(function(r){ return r.pass; }).length;
      var failed = results.filter(function(r){ return !r.pass; });

      console.log('═══════════════════════════════════════════');
      console.log('[Cheque Extension] QA: ' + passed + '/' + results.length + ' passed');
      if (failed.length > 0) {
        failed.forEach(function(f){ console.error('[Cheque Extension] FAIL:', f.name); });
      } else {
        console.log('[Cheque Extension] ✅ All checks passed');
      }
      console.log('═══════════════════════════════════════════');

      return { passed: passed, total: results.length, failed: failed };
    }

    LSX.runQA = runExtensionQA;

    /* ═══════════════════════════════════════════════════════════════
       PATCH renderApp: attach help button after every render
    ═══════════════════════════════════════════════════════════════ */
    var prevRender = window.renderApp;
    if (prevRender && !prevRender.__lsxPart5Patched) {
      window.renderApp = function(){
        prevRender.apply(this, arguments);
        try {
          attachHelpButton();
        } catch (e) { console.error('[Part 5 bind]', e); }
      };
      window.renderApp.__lsxPart5Patched = true;
    }

    /* Also attach now (in case renderApp already ran) */
    setTimeout(function(){
      try { attachHelpButton(); } catch (e){}
    }, 500);

    /* ═══════════════════════════════════════════════════════════════
       BOOT LOG + AUTO QA
    ═══════════════════════════════════════════════════════════════ */
    setTimeout(function(){
      console.log('═══════════════════════════════════════════');
      console.log('[Cheque Extension Part 5] FINAL POLISH registered ✓');
      console.log('  · Achievements + Streaks');
      console.log('  · Natural Language Search (Ctrl+L)');
      console.log('  · Time Capsule');
      console.log('  · LKR lakh/crore format');
      console.log('  · Camera capture');
      console.log('  · Version History');
      console.log('  · Daily Briefing widget');
      console.log('  · Keyboard shortcuts modal');
      console.log('  · Help button in topbar');
      console.log('═══════════════════════════════════════════');

      /* Auto-run QA */
      try { runExtensionQA(); } catch (e){}

      console.log('🎉 CHEQUE MANAGEMENT SYSTEM COMPLETE');
      console.log('   Press ? anywhere for keyboard shortcuts');
    }, 3000);

  });
})();
</script>
</body>
</html>
