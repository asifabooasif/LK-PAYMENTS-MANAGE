/* ═══════════════════════════════════════════════════════════════════════════
   SCORECARDS
   ═══════════════════════════════════════════════════════════════════════════ */
function supplierScore(supplierId){
  const s=arr(db.suppliers).find(x=>x.id===supplierId);
  if(!s)return null;
  const purchases=arr(db.purchases).filter(p=>p.supplierId===supplierId);
  const payments=arr(db.payments).filter(p=>p.supplierId===supplierId&&!p.reversed);
  const returns=arr(db.supplierReturns).filter(r=>r.supplierId===supplierId);
  const totalPurch=sum(purchases,'amount');
  const totalPaid=sum(payments,'amount');
  const totalReturn=sum(returns,'amount');
  const payable=totalPurch+num(s.openingBalance)-totalPaid-totalReturn;
  // Payment velocity — average days between purchase and matching payment
  let totalDays=0,count=0;
  payments.forEach(p=>{
    const pur=arr(db.purchases).filter(x=>x.supplierId===supplierId&&x.date<=p.date).sort((a,b)=>b.date<a.date?-1:1)[0];
    if(pur){totalDays+=daysBetween(pur.date,p.date);count++;}
  });
  const avgDays=count?totalDays/count:0;
  // Return ratio
  const returnRatio=totalPurch?((totalReturn/totalPurch)*100):0;
  // Reliability score
  let score=100;
  if(avgDays>60)score-=Math.min(30,(avgDays-60)/2);
  if(returnRatio>5)score-=Math.min(20,(returnRatio-5)*2);
  if(payable>0&&num(s.creditLimit)>0&&payable>num(s.creditLimit))score-=15;
  score=Math.max(0,Math.min(100,Math.round(score)));
  return{name:s.name,score,avgDays,count,totalPurch,totalPaid,totalReturn,payable,returnRatio,purchases:purchases.length};
}
window.supplierScore=supplierScore;

function customerScore(customerId){
  const c=arr(db.customers).find(x=>x.id===customerId);
  if(!c)return null;
  const cheques=arr(db.customerCheques).filter(x=>x.customerId===customerId);
  const cleared=cheques.filter(x=>x.status==='Cleared');
  const bounced=cheques.filter(x=>x.status==='Bounced');
  const recovered=cheques.filter(x=>x.status==='Recovered');
  const totalAmt=sum(cheques,'amount');
  const clearedAmt=sum(cleared,'amount');
  const bouncedAmt=sum(bounced,'amount');
  const outstanding=sum(bounced.filter(x=>x.status==='Bounced'),'amount');
  let score=100;
  if(cheques.length>0)score=Math.round((cleared.length/cheques.length)*100);
  if(c.blacklisted)score=0;
  return{name:c.name,score,cheques:cheques.length,cleared:cleared.length,bounced:bounced.length,recovered:recovered.length,totalAmt,clearedAmt,bouncedAmt,outstanding,reliability:score};
}
window.customerScore=customerScore;

function scoreBadgeClass(score){
  if(score>=85)return'excellent';
  if(score>=65)return'good';
  if(score>=40)return'fair';
  return'poor';
}
function scoreLabel(score){
  if(score>=85)return'Excellent';
  if(score>=65)return'Good';
  if(score>=40)return'Fair';
  return'Poor';
}
window.scoreBadgeClass=scoreBadgeClass;window.scoreLabel=scoreLabel;

function renderScorecards(){
  const sup=arr(db.suppliers).map(s=>supplierScore(s.id)).filter(Boolean).sort((a,b)=>a.score-b.score);
  const cust=arr(db.customers).map(c=>customerScore(c.id)).filter(Boolean).sort((a,b)=>a.score-b.score);
  return '<div class="card">'+
    '<div class="card-head"><h3>🎯 Supplier Scorecards</h3><span class="badge gray">Lowest scores first — need attention</span></div>'+
    (sup.length?sup.map(s=>'<div class="score-row"><div class="score-badge '+scoreBadgeClass(s.score)+'">'+s.score+'</div><div class="score-name">'+esc(s.name)+'<div class="score-meta">'+s.purchases+' purchases • '+money(s.payable)+' payable</div><div class="score-detail"><span>Avg pay: <strong>'+s.avgDays.toFixed(1)+'d</strong></span><span>Return: <strong>'+s.returnRatio.toFixed(1)+'%</strong></span><span>Paid: <strong>'+money(s.totalPaid)+'</strong></span></div></div></div>').join(''):'<div class="empty">No suppliers</div>')+
  '</div>'+
  '<div class="card">'+
    '<div class="card-head"><h3>👤 Customer Reliability Scorecards</h3></div>'+
    (cust.length?cust.map(c=>'<div class="score-row"><div class="score-badge '+scoreBadgeClass(c.score)+'">'+c.score+'</div><div class="score-name">'+esc(c.name)+'<div class="score-meta">'+c.cheques+' cheques • '+c.reliability+'% reliability</div><div class="score-detail"><span>Cleared: <strong>'+c.cleared+'</strong></span><span>Bounced: <strong>'+c.bounced+'</strong></span><span>Owed: <strong>'+money(c.outstanding)+'</strong></span></div></div></div>').join(''):'<div class="empty">No customers</div>')+
  '</div>';
}

async function refreshUsers(){
  if(offlineMode){toast('Offline — cannot refresh','warn');return;}
  toast('Refreshing…','info');
  await loadAccessList();
  render();
  toast('Users refreshed','success');
}
async function addNewUser(){
  const inp=document.getElementById('newUserEmail'),roleSel=document.getElementById('newUserRole');
  if(!inp)return;
  const email=inp.value.trim().toLowerCase();
  if(!email||email.indexOf('@')===-1){toast('Valid email required','error');return;}
  if(arr(db.allowedEmails).some(e=>String(e).toLowerCase()===email)){toast('Already authorized','warn');return;}
  const newList=uniq(arr(db.allowedEmails).concat([email]));
  const perms=Object.assign({},db.userPerms||{});
  perms[email]={role:roleSel?roleSel.value:'viewer'};
  const ok=await saveAccessList(newList,perms);
  if(ok){inp.value='';render();toast('✅ User added: '+email,'success');}
}
async function changeUserRole(email,role){
  const perms=Object.assign({},db.userPerms||{});
  perms[email]=Object.assign({},perms[email]||{},{role});
  const ok=await saveAccessList(arr(db.allowedEmails),perms);
  if(ok){toast('Role updated','success');render();}
}
async function removeUser(email){
  if(email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){toast('Cannot remove admin','error');return;}
  if(!confirm('Remove access for '+email+'?'))return;
  const newList=arr(db.allowedEmails).filter(e=>String(e).toLowerCase()!==email.toLowerCase());
  const perms=Object.assign({},db.userPerms||{});
  delete perms[email];
  const ok=await saveAccessList(newList,perms);
  if(ok){render();toast('Removed','success');}
}
window.refreshUsers=refreshUsers;window.addNewUser=addNewUser;window.changeUserRole=changeUserRole;window.removeUser=removeUser;

function saveSettings(e){

  if(!canAdmin()){toast('Admin only','error');return;}
  const f=e.target,s=db.settings;
  const $=n=>{const el=f.querySelector('[name="'+n+'"]');return el?el.value:undefined;};
  const $cb=n=>{const el=f.querySelector('[name="'+n+'"]');return el?el.checked:undefined;};
  const set=(k,n)=>{const v=$(n);if(v!==undefined)s[k]=v;};
  set('shopName','st_shopName');set('shopTagline','st_shopTagline');set('logoText','st_logoText');
  set('businessPhone','st_businessPhone');set('businessEmail','st_businessEmail');
  set('businessAddress','st_businessAddress');set('brNumber','st_brNumber');
  if($('st_fontSize')!==undefined)s.fontSize=num($('st_fontSize'))||13.5;
  set('currency','st_currency');set('currencyPosition','st_currencyPosition');
  if($('st_decimalPlaces')!==undefined)s.decimalPlaces=num($('st_decimalPlaces'));
  set('thousandsSeparator','st_thousandsSeparator');set('dateFormat','st_dateFormat');
  if($('st_chequeLeafPad')!==undefined)s.chequeLeafPad=Math.max(2,num($('st_chequeLeafPad')));
  if($('st_defaultChequeDays')!==undefined)s.defaultChequeDays=num($('st_defaultChequeDays'));
  if($('st_chequeReminderDays')!==undefined)s.chequeReminderDays=num($('st_chequeReminderDays'));
  if($('st_bounceBankCharge')!==undefined)s.bounceBankCharge=num($('st_bounceBankCharge'));
  if($('st_recoveryFollowUpDays')!==undefined)s.recoveryFollowUpDays=num($('st_recoveryFollowUpDays'));
  if($('st_lowBalanceThreshold')!==undefined)s.lowBalanceThreshold=num($('st_lowBalanceThreshold'));
  if($('st_defaultSupplierCreditDays')!==undefined)s.defaultSupplierCreditDays=num($('st_defaultSupplierCreditDays'));
  if($('st_defaultSupplierCreditLimit')!==undefined)s.defaultSupplierCreditLimit=num($('st_defaultSupplierCreditLimit'));
  const b1=num($('st_ageB1')),b2=num($('st_ageB2')),b3=num($('st_ageB3'));

function importBackup(){
  const input=document.getElementById('importFile');
  if(!input||!input.files.length){toast('Choose a file first','error');return;}
  if(!confirm('Import will replace all current data. Continue?'))return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      const data=parsed.data||parsed;
      if(!data||typeof data!=='object')throw new Error('Invalid backup file');
      db=Object.assign(seed(),data);
      normalizeDb();applySettings();save();
      render();toast('✅ Imported successfully','success');
    }catch(err){toast('Invalid file: '+err.message,'error');}
  };
  reader.readAsText(input.files[0]);
}

function restoreFromTrash(trashId){
  if(!canWrite())return;
  const idx=arr(db.trash).findIndex(x=>x.id===trashId);
  if(idx===-1)return;
  const it=db.trash[idx];
  if(!Array.isArray(db[it.originalCollection]))db[it.originalCollection]=[];
  db[it.originalCollection].push(it.item);
  db.trash.splice(idx,1);
  logAct('Restore from Trash',it.originalCollection,it.item.id,it.label||'');
  save();render();toast('Restored','success');
}
window.restoreFromTrash=restoreFromTrash;

function permanentDeleteFromTrash(trashId){
  if(!canWrite())return;
  if(!confirm('Delete forever? Cannot be undone.'))return;
  db.trash=arr(db.trash).filter(x=>x.id!==trashId);
  save();render();toast('Deleted forever','warn');
}
window.permanentDeleteFromTrash=permanentDeleteFromTrash;

function emptyTrash(){
  if(!canWrite())return;
  if(!confirm('Permanently delete ALL items in Trash?'))return;
  const n=arr(db.trash).length;
  db.trash=[];
  save();render();toast('Emptied '+n+' items','success');
}
window.emptyTrash=emptyTrash;

function purgeOldTrash(){
  const cutoff=shiftDate(today(),-30);
  const before=arr(db.trash).length;
  db.trash=arr(db.trash).filter(x=>(x.deletedAt||'')>=cutoff);
  const removed=before-arr(db.trash).length;
  if(removed>0){save();toast('Purged '+removed+' old items','success');}
}
window.purgeOldTrash=purgeOldTrash;

function saveTodo(ev){
  ev.preventDefault();
  const f=ev.target,id=f.dataset.id;
  const data={
    title:f.tdTitle.value.trim(),
    dueDate:f.tdDue.value||null,
    priority:f.tdPri.value,
    notes:f.tdNotes.value.trim(),
    owner:(currentUser&&currentUser.email)||'system'
  };
  if(!data.title){toast('Title required','error');return;}
  if(id){
    Object.assign(arr(db.todos).find(x=>x.id===id),data,{updatedAt:nowISO()});
  }else{
    db.todos.push(Object.assign({id:uid(),done:false,createdAt:nowISO()},data));
  }
  save();closeModal();render();toast('✅ Task saved','success');
}
window.saveTodo=saveTodo;

function toggleTodo(id){
  const t=arr(db.todos).find(x=>x.id===id);if(!t)return;
  t.done=!t.done;
  if(t.done)t.completedAt=nowISO();
  save();render();
}
window.toggleTodo=toggleTodo;

function deleteTodo(id){
  if(!confirm('Delete this task?'))return;
  db.todos=arr(db.todos).filter(t=>t.id!==id);
  save();render();toast('Deleted','success');
}
window.deleteTodo=deleteTodo;

/* ═══════════════════════════════════════════════════════════════════════════
   CHEQUE CALENDAR
   ═══════════════════════════════════════════════════════════════════════════ */
function viewCalendar(){
  const now=new Date();
  const year=ui.calendar&&ui.calendar.year||now.getFullYear();
  const month=ui.calendar&&ui.calendar.month!==undefined?ui.calendar.month:now.getMonth();
  const firstDay=new Date(year,month,1);
  const lastDay=new Date(year,month+1,0);
  const startWeekday=firstDay.getDay();
  const daysInMonth=lastDay.getDate();
  const todayStr=today();

  // Gather events
  const events={};
  const addEvent=(dateStr,evt)=>{if(!events[dateStr])events[dateStr]=[];events[dateStr].push(evt);};
  arr(db.chequeLeaves).filter(l=>l.status==='Issued'&&l.dueDate).forEach(l=>addEvent(l.dueDate,{type:'due',label:'📤 '+money(l.amount||0)+' — '+(l.payee||''),id:l.id}));
  arr(db.purchases).forEach(p=>{
    const bal=num(p.amount)-num(p.paidAmount);
    if(bal<=0)return;
    const due=p.dueDate||shiftDate(p.date,30);
    addEvent(due,{type:'pay',label:'🛒 '+money(bal)+' — '+supName(p.supplierId),id:p.id});
  });
  arr(db.customerCheques).filter(c=>c.status==='In Hand'&&c.dueDate).forEach(c=>addEvent(c.dueDate,{type:'recv',label:'💳 '+money(c.amount)+' — '+(c.customerName||''),id:c.id}));

  const cells=[];
  const prevMonth=new Date(year,month,0).getDate();
  for(let i=startWeekday-1;i>=0;i--)cells.push({day:prevMonth-i,other:true});
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    cells.push({day:d,dateStr,events:events[dateStr]||[],isToday:dateStr===todayStr});
  }
  const remaining=(7-(cells.length%7))%7;
  for(let i=1;i<=remaining;i++)cells.push({day:i,other:true});

  const monthName=new Date(year,month,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});

  return '<div class="card">'+
    '<div class="card-head"><h3>📅 '+esc(monthName)+'</h3>'+
      '<div class="row-flex">'+
        '<button class="btn sm" onclick="calNav(-1)">← Prev</button>'+
        '<button class="btn sm" onclick="calNav(0)">Today</button>'+
        '<button class="btn sm" onclick="calNav(1)">Next →</button>'+
      '</div>'+
    '</div>'+
    '<div style="padding:12px 18px 0">'+
      '<div style="display:flex;gap:14px;font-size:11.5px;color:var(--text-3);flex-wrap:wrap">'+
        '<span><span style="display:inline-block;width:10px;height:10px;background:rgba(245,158,11,.4);border-radius:2px;vertical-align:middle;margin-right:4px"></span>Own cheque due</span>'+
        '<span><span style="display:inline-block;width:10px;height:10px;background:rgba(239,68,68,.35);border-radius:2px;vertical-align:middle;margin-right:4px"></span>Purchase to pay</span>'+
        '<span><span style="display:inline-block;width:10px;height:10px;background:rgba(16,185,129,.35);border-radius:2px;vertical-align:middle;margin-right:4px"></span>Customer cheque</span>'+
      '</div>'+
    '</div>'+
    '<div class="cal-grid" style="padding:18px">'+
      ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>'<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--text-3);text-align:center;padding:4px">'+d+'</div>').join('')+
      cells.map(c=>{
        const cellEvents=(c.events||[]).slice(0,3);
        const more=(c.events||[]).length-3;
        return '<div class="cal-cell '+(c.other?'other':'')+' '+(c.isToday?'today':'')+'">'+
          '<div class="day-num">'+c.day+'</div>'+
          cellEvents.map(e=>'<div class="cal-event '+e.type+'" onclick="showCalEvent(\''+e.type+'\',\''+e.id+'\')">'+esc(e.label)+'</div>').join('')+
          (more>0?'<div style="font-size:10px;color:var(--text-3);margin-top:2px">+' +more+' more</div>':'')+
        '</div>';
      }).join('')+
    '</div>'+
  '</div>';
}
window.viewCalendar=viewCalendar;

function calNav(delta){
  if(!ui.calendar)ui.calendar={year:new Date().getFullYear(),month:new Date().getMonth()};
  if(delta===0){ui.calendar.year=new Date().getFullYear();ui.calendar.month=new Date().getMonth();}
  else{
    let m=ui.calendar.month+delta,y=ui.calendar.year;
    if(m<0){m=11;y--;}if(m>11){m=0;y++;}
    ui.calendar.month=m;ui.calendar.year=y;
  }
  render();
}
window.calNav=calNav;

function showCalEvent(type,id){
  if(type==='due')showLeafDetail(id);
  else if(type==='pay')showPurchaseDetail(id);
  else if(type==='recv')showChequeDetail(id);

      (msgs.length?msgs.map(m=>'<div class="ai-msg '+(m.role==='user'?'user':'bot')+'">'+esc(m.text)+'</div>').join(''):'<div class="ai-msg bot">Hi! I can answer questions about your data.\nTry: "How much did I pay Col Footwear last month?" or "Top 5 suppliers by purchases".</div>')+
    '</div>'+
    '<div class="ai-suggestions" id="aiSuggestions">'+suggestions.map(s=>'<div class="ai-suggestion" onclick="aiAsk(\''+esc(s).replace(/'/g,"\\'")+'\')">'+esc(s)+'</div>').join('')+'</div>'+
    '<div class="ai-input-bar">'+
      '<input id="aiInput" placeholder="Ask me anything about your business data…" onkeydown="if(event.key===\'Enter\')aiAskFromInput()">'+
      '<button class="btn primary" onclick="aiAskFromInput()">Send</button>'+
    '</div>'+
  '</div>';
}
window.viewAi=viewAi;

function aiAskFromInput(){
  const el=document.getElementById('aiInput');
  if(!el)return;
  const q=el.value.trim();
  if(!q)return;
  el.value='';
  aiAsk(q);
}
window.aiAskFromInput=aiAskFromInput;

function aiAsk(question){
  if(!Array.isArray(db._aiHistory))db._aiHistory=[];
  db._aiHistory.push({role:'user',text:question,at:nowISO()});
  const answer=aiAnswer(question);
  db._aiHistory.push({role:'bot',text:answer,at:nowISO()});
  if(db._aiHistory.length>200)db._aiHistory=db._aiHistory.slice(-200);
  save();
  const container=document.getElementById('aiMessages');
  if(container){
    container.innerHTML=db._aiHistory.slice(-30).map(m=>'<div class="ai-msg '+(m.role==='user'?'user':'bot')+'">'+esc(m.text)+'</div>').join('');
    container.scrollTop=container.scrollHeight;
  }
}
window.aiAsk=aiAsk;

function aiAnswer(q){
  const s=q.toLowerCase();
  const thisMonth=today().slice(0,7);
  // Paid this month?
  if(/(paid|payment).*(this month|current month)/.test(s)||/this month.*paid/.test(s)){
    const total=sum(arr(db.payments).filter(p=>!p.reversed&&inMonth(p.date,thisMonth)),'amount');
    return '💰 You paid '+money(total)+' this month across '+arr(db.payments).filter(p=>!p.reversed&&inMonth(p.date,thisMonth)).length+' payments.';
  }
  // Total payable
  if(/payable|owe/.test(s)&&!/(customer|receivable)/.test(s)){
    const total=arr(db.suppliers).reduce((a,su)=>a+supplierOutstanding(su.id),0);
    return '📊 Total payable to suppliers: '+money(total);
  }
  // Bounced
  if(/bounce/.test(s)){
    const b=arr(db.customerCheques).filter(c=>c.status==='Bounced');
    return '⚠ You have '+b.length+' bounced cheques totalling '+money(sum(b,'amount'))+'.';
  }
  // Top suppliers
  if(/top.*supplier/.test(s)||/supplier.*by.*purchase/.test(s)){
    const list=arr(db.suppliers).map(su=>({name:su.name,amt:sum(arr(db.purchases).filter(p=>p.supplierId===su.id),'amount')})).filter(x=>x.amt>0).sort((a,b)=>b.amt-a.amt).slice(0,5);
    if(!list.length)return 'No supplier purchases yet.';
    return '🏆 Top 5 suppliers by purchases:\n'+list.map((x,i)=>(i+1)+'. '+x.name+' — '+money(x.amt)).join('\n');
  }
  // Supplier count
  if(/how many suppliers|supplier count/.test(s))return 'You have '+arr(db.suppliers).length+' suppliers.';
  if(/how many customers|customer count/.test(s))return 'You have '+arr(db.customers).length+' customers.';
  // Expense by category
  const catMatch=q.match(/on\s+([a-z]+)/i);
  if(/spend|expense/.test(s)&&catMatch){
    const cat=catMatch[1].toLowerCase();
    const total=sum(arr(db.expenses).filter(e=>(e.category||'').toLowerCase().includes(cat)),'amount');
    return '📉 You spent '+money(total)+' on '+cat+'.';
  }
  // Specific supplier
  const sup=arr(db.suppliers).find(x=>s.includes((x.name||'').toLowerCase()));
  if(sup){
    const bal=supplierOutstanding(sup.id);
    const paid=sum(arr(db.payments).filter(p=>p.supplierId===sup.id&&!p.reversed),'amount');
    return '🏭 '+sup.name+'\n• Outstanding: '+money(bal)+'\n• Total paid: '+money(paid)+'\n• Purchases: '+arr(db.purchases).filter(p=>p.supplierId===sup.id).length;
  }
  // Specific customer
  const cust=arr(db.customers).find(x=>s.includes((x.name||'').toLowerCase()));
  if(cust){
    const score=customerScore(cust.id);
    return '👤 '+cust.name+'\n• Reliability: '+score.score+'%\n• Cheques: '+score.cheques+' ('+score.cleared+' cleared, '+score.bounced+' bounced)\n• Outstanding: '+money(score.outstanding);
  }
  // Purchases total
  if(/total.*purchase/.test(s)||/purchase.*total/.test(s)){
    return '🛒 Total purchases: '+money(sum(arr(db.purchases),'amount'))+' across '+arr(db.purchases).length+' invoices.';
  }
  // Cash
  if(/cash|bank.*balance/.test(s)){
    const total=arr(db.bankAccounts).reduce((a,b)=>a+bankBalance(b.id),0);
    return '💵 Total bank balance: '+money(total)+' across '+arr(db.bankAccounts).length+' accounts.';
  }
  // Help
  if(/help|what.*can.*you/.test(s))return 'I can answer questions like:\n• "How much did I pay this month?"\n• "Top 5 suppliers"\n• "Total payable"\n• "Bounced cheques"\n• "How many customers?"\n• "Spend on Rent"';
  return '🤔 I didn\'t understand. Try asking about payments, suppliers, customers, purchases, expenses, or bounced cheques.';
}
window.aiAnswer=aiAnswer;

/* ═══════════════════════════════════════════════════════════════════════════
   LOGIN ALERTS (records device on login)
   ═══════════════════════════════════════════════════════════════════════════ */
(function loginAlertHook(){
  const orig=window.logLogin;
  window.logLogin=function(user){
    if(typeof orig==='function')orig(user);
    if(!firebaseReady||offlineMode)return;
    try{
      const known=arr(db.loginHistory).filter(l=>l.email===user.email).length;
      if(known>1){
        const last=arr(db.loginHistory).filter(l=>l.email===user.email).slice(-2,-1)[0];
        if(last&&last.platform&&last.platform!==navigator.platform){
          setTimeout(()=>toast('🔔 New device login detected','info',5000),1500);
        }
      }
    }catch(e){}
  };
})();

/* ═══════════════════════════════════════════════════════════════════════════
   EVENT DELEGATION (final — picks up new actions)
   ═══════════════════════════════════════════════════════════════════════════ */
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const a=el.dataset.action,id=el.dataset.id;
  const map={
    'print-payment-slip':()=>printPaymentSlip(id),
    'show-payment-slip':()=>showPaymentSlip(id),
    'show-receipt-voucher':()=>showReceiptVoucher(id),
    'pay-supplier':()=>openPaymentForm(el.dataset.supplier||id),
    'purchase-detail':()=>showPurchaseDetail(id),
    'supplier-detail':()=>showSupplierDetail(id),
    'customer-detail':()=>showCustomerDetail(id),
    'receipt-detail':()=>showReceiptDetail(id),
    'expense-detail':()=>showExpenseDetail(id)
  };
  if(map[a]){e.preventDefault();map[a]();return;}
},true);

/* ═══════════════════════════════════════════════════════════════════════════
   FINAL BOOT HOOK (patch the render dispatcher with all new views)
   ═══════════════════════════════════════════════════════════════════════════ */
(function finalizeBoot(){
  // Re-render sidebar to pick up new nav items
  if(typeof renderSidebar==='function'){
    // Add 'documents', 'calendar', 'ai' to sidebar groups
    const originalRender=window.renderSidebar;
    window.renderSidebar=function(){
      const nav=document.getElementById('sbNav');
      if(!nav)return;
      const groups=[
        {label:'Main',items:['dashboard','customers','suppliers','categories']},
        {label:'Transactions',items:['purchases','receipts','cheques','payments']},
        {label:'Banking',items:['banks','chequebooks','expenses','journals','ledger','aging']},
        {label:'Insights',items:['reports','documents','calendar','todo','history']},
        {label:'Tools',items:['ai','backup','trash','settings']}
      ];
      const NAV_ITEMS_FULL=[
        {key:'dashboard',icon:'🏠',label:'Dashboard'},
        {key:'customers',icon:'C',label:'Customers'},
        {key:'suppliers',icon:'S',label:'Suppliers'},
        {key:'categories',icon:'📂',label:'Categories'},
        {key:'purchases',icon:'🛒',label:'Purchases'},
        {key:'receipts',icon:'🧾',label:'Receipts'},
        {key:'cheques',icon:'💳',label:'Customer Cheques'},
        {key:'payments',icon:'💸',label:'Payments'},
        {key:'banks',icon:'🏦',label:'Bank Accounts'},
        {key:'chequebooks',icon:'📚',label:'Cheque Books'},
        {key:'expenses',icon:'📉',label:'Expenses'},
        {key:'journals',icon:'📓',label:'Journals'},
        {key:'ledger',icon:'📒',label:'Ledger'},
        {key:'aging',icon:'⏳',label:'Aging'},
        {key:'budgets',icon:'💰',label:'Budgets'},
        {key:'cashflow',icon:'📈',label:'Cash Flow'},
        {key:'reports',icon:'📊',label:'Reports'},
        {key:'documents',icon:'📄',label:'Documents'},
        {key:'calendar',icon:'📅',label:'Calendar'},
        {key:'todo',icon:'✓',label:'Tasks'},
        {key:'history',icon:'📜',label:'History'},
        {key:'logins',icon:'🔐',label:'Login History'},
        {key:'ai',icon:'🤖',label:'AI Assistant'},
        {key:'backup',icon:'💾',label:'Backup'},
        {key:'trash',icon:'🗑',label:'Trash'},
        {key:'settings',icon:'⚙',label:'Settings'}
      ];
      nav.innerHTML=groups.map(g=>{
        const items=g.items.map(k=>NAV_ITEMS_FULL.find(n=>n.key===k)).filter(Boolean);
        if(!items.length)return'';
        return '<div class="sb-section">'+g.label+'</div>'+items.map(it=>
          '<div class="sb-item '+(ui.view===it.key?'active':'')+'" data-action="nav" data-view="'+it.key+'"><span class="ico">'+it.icon+'</span>'+esc(it.label)+'</div>'
        ).join('');
      }).join('');
    };
  }
  // Page title map
  const titleMap={
    dashboard:'Dashboard',customers:'Customers',suppliers:'Suppliers',categories:'Categories',
    purchases:'Purchases',receipts:'Receipts',cheques:'Customer Cheques',payments:'Payments',
    banks:'Bank Accounts',chequebooks:'Cheque Books',expenses:'Expenses',journals:'Journals',
    ledger:'Ledger',aging:'Aging',budgets:'Budgets',cashflow:'Cash Flow',
    reports:'Reports',documents:'Documents',calendar:'Calendar',todo:'Tasks',
    history:'History',logins:'Login History',ai:'AI Assistant',
    backup:'Backup',trash:'Trash',settings:'Settings'
  };
  const origRender=window.render;
  window.render=function(){
    // Temporarily override page title map
    const t=document.getElementById('pageTitle');
    if(t&&titleMap[ui.view])t.textContent=titleMap[ui.view];
    origRender();
    if(t&&titleMap[ui.view])t.textContent=titleMap[ui.view];
  };
  // Re-render to show new nav
  renderSidebar();
})();

/* ═══ END OF PART 6 ═══ */
</script>
