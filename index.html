function progressRing(value, total, color, size){
  size = size || 90;
  const pct = total > 0 ? Math.min(1, value/total) : 0;
  const r = (size-8)/2, c = size/2, circ = 2*Math.PI*r;
  return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">'
    + '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" stroke="var(--surface-3)" stroke-dasharray="' + circ + '"/>'
    + '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" stroke="' + color + '" stroke-dasharray="' + circ + '" stroke-dashoffset="' + (circ*(1-pct)) + '"/>'
    + '</svg>';
}
window.progressRing = progressRing;

function lineChartSVG(series, opts){
  opts = opts || {};
  const w = opts.w || 800, h = opts.h || 220;
  const pad = { l:54, r:12, t:12, b:30 };
  const pW = w - pad.l - pad.r, pH = h - pad.t - pad.b;
  const max = Math.max(1, Math.max.apply(null, series.flatMap(s => s.values)));
  const n = series[0] ? series[0].values.length : 0;
  const sX = n > 1 ? pW/(n-1) : pW;

  let grid = '';
  for(let i = 0; i <= 4; i++){
    const y = pad.t + (pH*i/4);
    grid += '<line x1="' + pad.l + '" y1="' + y + '" x2="' + (pad.l+pW) + '" y2="' + y + '" stroke="var(--border-2)"/>';
    grid += '<text x="' + (pad.l-6) + '" y="' + (y+3) + '" font-size="9.5" fill="var(--text-4)" text-anchor="end">' + fmtCompact(max*(4-i)/4) + '</text>';
  }

  let lines = '';
  series.forEach(s => {
    const pts = s.values.map((v,i) => [pad.l + i*sX, pad.t + pH - (v/max)*pH]);
    lines += '<path d="M' + pts.map(p => p.join(',')).join(' L') + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  });

  const labels = (opts.labels||[]).map((l,i) =>
    '<text x="' + (pad.l + i*sX) + '" y="' + (h-8) + '" font-size="9.5" fill="var(--text-4)" text-anchor="middle">' + esc(l) + '</text>'
  ).join('');

  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' + grid + lines + labels + '</svg>';
}
window.lineChartSVG = lineChartSVG;

function barChartSVG(items, opts){
  opts = opts || {};
  const w = opts.w || 500, h = opts.h || 200;
  const pad = { l:60, r:12, t:12, b:32 };
  const pW = w - pad.l - pad.r, pH = h - pad.t - pad.b;
  const max = Math.max(1, Math.max.apply(null, items.map(i => i.value)));
  const bw = pW / items.length * 0.7;
  const gap = pW / items.length * 0.3;

  let bars = '';
  items.forEach((it, i) => {
    const bH = (it.value/max)*pH;
    const x = pad.l + i*(pW/items.length) + gap/2;
    const y = pad.t + pH - bH;
    bars += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bH + '" fill="' + (it.color||'var(--accent)') + '" rx="4"/>';
    bars += '<text x="' + (x + bw/2) + '" y="' + (h-10) + '" font-size="9.5" fill="var(--text-4)" text-anchor="middle">'
      + esc(String(it.label).length > 10 ? String(it.label).slice(0,9)+'…' : it.label) + '</text>';
  });

  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' + bars + '</svg>';
}
window.barChartSVG = barChartSVG;

function lastMonths(n){
  const out = []; const d = new Date(); d.setDate(1);
  for(let i = n-1; i >= 0; i--){
    const x = new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push(x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0'));
  }
  return out;
}
window.lastMonths = lastMonths;

function monthLabel(k){
  if(!k) return '—';
  const p = k.split('-');
  return new Date(Number(p[0]), Number(p[1])-1, 1).toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
}

/* ═══════════════════════════════════════════════════════════════════════
   VIEW: ANALYTICS
   ═══════════════════════════════════════════════════════════════════════ */
function viewAnalytics(){
  const months = lastMonths(12);

  const totalIssued = arr(db.chequeLeaves).filter(l => ['Issued','Presented','Cleared','Bounced','Stopped','Dead'].indexOf(l.status) !== -1);
  const cleared = totalIssued.filter(l => l.status === 'Cleared');
  const bounced = totalIssued.filter(l => l.status === 'Bounced');
  const bounceRate = totalIssued.length ? (bounced.length/totalIssued.length*100) : 0;
  const totalValue = sum(totalIssued, 'amount');
  const bounceValue = sum(bounced, 'amount');

  const avgCheque = cleared.length ? sum(cleared,'amount')/cleared.length : 0;

  /* Bounce trend */
  const bounceTrend = months.map(m => {
    const mc = arr(db.chequeLeaves).filter(l => (l.issuedDate||'').slice(0,7) === m);
    if(!mc.length) return 0;
    return (mc.filter(l => l.status === 'Bounced').length/mc.length)*100;
  });

  const bounceAmts = months.map(m =>
    sum(arr(db.chequeLeaves).filter(l => l.status === 'Bounced' && (l.bouncedDate||l.issuedDate||'').slice(0,7) === m),'amount')
  );

  /* Outflow heatmap */
  const heatmap = months.map(m => ({
    month: m,
    value: sum(arr(db.chequeLeaves).filter(l => l.status === 'Issued' && (l.dueDate||'').slice(0,7) === m),'amount')
  }));
  const maxHeat = Math.max(1, ...heatmap.map(x => x.value));

  /* Per-bank aging */
  const bankStats = arr(db.bankAccounts).map(b => {
    const issued = arr(db.chequeLeaves).filter(l => l.bankAccountId === b.id && (l.status === 'Issued' || l.status === 'Presented'));
    const cleared = arr(db.chequeLeaves).filter(l => l.bankAccountId === b.id && l.status === 'Cleared');
    const bounced = arr(db.chequeLeaves).filter(l => l.bankAccountId === b.id && l.status === 'Bounced');
    return { bank: b, outstanding: sum(issued,'amount'), outstandingCount: issued.length, clearedCount: cleared.length, bouncedCount: bounced.length };
  });

  /* Bank charges */
  const chargesByCat = groupBy(arr(db.bankCharges), c => c.category || 'other');
  const chargeBreakdown = Object.keys(chargesByCat).map(cat => ({
    label: cat.replace(/_/g,' '),
    value: sum(chargesByCat[cat],'amount'),
    color: 'var(--red)'
  })).sort((a,b) => b.value - a.value);

  /* Cash flow 30 days */
  const t = today();
  const days = 30;
  const dailyIn = [], dailyOut = [], dailyBal = [];
  let running = arr(db.bankAccounts).reduce((a,b) => a + bankAvailableBalance(b.id), 0);
  for(let i = 0; i < days; i++){
    const d = shiftDate(t, i);
    const inflow = sum(arr(db.bankTransactions).filter(tx => tx.date === d && ['deposit','transfer_in','interest_credit'].indexOf(tx.type) !== -1), 'amount');
    const outflow = sum(arr(db.bankTransactions).filter(tx => tx.date === d && tx.type === 'cheque_issued' && tx.status !== 'reversed'), 'amount');
    running += inflow - outflow;
    dailyIn.push(inflow);
    dailyOut.push(outflow);
    dailyBal.push(running);
  }

  const lowest = Math.min(...dailyBal);
  const lowestDay = dailyBal.indexOf(lowest);

  return '<div class="kpi-strip">'
    + kpiCard('Cheques Issued', totalIssued.length, moneyPlain(totalValue), '')
    + kpiCard('Cleared', cleared.length, moneyPlain(sum(cleared,'amount')), 'green')
    + kpiCard('Bounced', bounced.length, bounceRate.toFixed(1) + '% rate', 'red')
    + kpiCard('Avg Cheque', moneyPlain(avgCheque), 'Cleared avg', 'blue')
    + '</div>'

    + (lowest < 0
      ? '<div class="alert danger"><span class="ico">⚠</span><div>Cash projected to go <strong>negative</strong> in 30 days: lowest <strong>' + money(lowest) + '</strong> on ' + dateFmt(shiftDate(t, lowestDay)) + '</div></div>'
      : '')

    + '<div class="grid grid-2" style="gap:14px">'

    + '<div class="card"><div class="card-head"><h3>📉 Bounce Rate Trend (12 months)</h3></div>'
    + '<div class="chart-box">' + lineChartSVG([{ values:bounceTrend, color:'var(--red)' }], { w:600, h:220, labels: months.map(monthLabel) }) + '</div>'
    + '<div class="small muted" style="text-align:center;margin-top:8px">% of cheques bounced per month</div></div>'

    + '<div class="card"><div class="card-head"><h3>💸 Bounce Amount Trend</h3></div>'

(function patchLeafDetailForVoucher(){
  const orig = window.showLeafDetail;

  const wrapped = function(leafId){
    const r = orig.apply(this, arguments);
    setTimeout(()=>{
      const modal = document.querySelector('#modalWrap .modal-body .form-actions');
      if(!modal || modal.querySelector('[data-vch-btn]')) return;
      const l = arr(db.chequeLeaves).find(x => x.id === leafId);

      const btn = document.createElement('button');

      btn.onclick = ()=>{ closeModal(); setTimeout(()=>showChequeVoucher(leafId), 120); };
      modal.insertBefore(btn, modal.firstChild);
    }, 60);
    return r;
  };
  wrapped.__patchedVoucher = true;
  window.showLeafDetail = wrapped;
})();

function defaultPrintProfile(){
  return {
    id: uid(),
    companyId: db.companyId,
    name: 'Default Profile',
    printerName: 'Standard',
    paperSize: 'cheque-6x3',
    offsetX: 0, offsetY: 0, scalePct: 100,

      { key:'payee', x:75, y:52, fontSize:12, fontFamily:'Courier New', align:'left' },
      { key:'amountFigures', x:600, y:52, fontSize:14, fontFamily:'Courier New', align:'right' },
      { key:'amountWords', x:30, y:82, fontSize:11, fontFamily:'Courier New', align:'left' },
      { key:'micrLine', x:60, y:132, fontSize:13, fontFamily:'MICR E-13B', align:'left' }
    ],
    micrEnabled: true,
    isDefault: true,
    createdAt: nowISO()
  };
}

function getPrintProfile(){
  let prof = arr(db.chequePrintProfiles).find(p => p.isDefault);
  if(!prof){
    prof = defaultPrintProfile();
    db.chequePrintProfiles.push(prof);
    save();
  }
  return prof;
}
window.getPrintProfile = getPrintProfile;

/**
 * Build the printed cheque HTML from a leaf + profile
 */
function buildChequePrintHTML(leafId, profile){
  const l = arr(db.chequeLeaves).find(x => x.id === leafId);
  if(!l) return { html: '', title: '' };
  const bank = arr(db.bankAccounts).find(b => b.id === l.bankAccountId);
  profile = profile || getPrintProfile();

  const dateStr = (() => {
    if(!l.issuedDate) return '';
    const d = new Date(l.issuedDate + 'T00:00:00');
    return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
  })();

  const micrLine = '\u2446' + String(l.leafNo).padStart(6,'0') + '\u2446 '
    + String((bank && bank.accountNo) || '0000000000').padStart(10,'0')
    + '\u2446 ' + String(Math.round(num(l.amount))).padStart(10,'0');

  const fieldValues = {
    date: dateStr,
    payee: l.payee || '',
    amountFigures: '**' + moneyPlain(l.amount) + '**',
    amountWords: amountInWords(l.amount),
    micrLine: micrLine
  };

  const fieldsHTML = profile.fields.map(f => {
    const v = fieldValues[f.key] !== undefined ? fieldValues[f.key] : '';
    return '<div class="cheque-field ' + f.key + '" style="left:' + f.x + 'px;top:' + f.y + 'px;'
      + 'font-size:' + f.fontSize + 'pt;font-family:' + f.fontFamily + ';text-align:' + f.align + ';">'
      + esc(v) + '</div>';
  }).join('');

  const canvasWidth = 693; // ~ 6.9 inches at 100 dpi
  const canvasHeight = 280;

  const html = '<div class="print-stage">'
    + '<div class="cheque-canvas" style="width:' + canvasWidth + 'px;height:' + canvasHeight + 'px;'
    + 'transform:scale(' + (profile.scalePct/100) + ');transform-origin:top left;'
    + 'margin-left:' + profile.offsetX + 'px;margin-top:' + profile.offsetY + 'px;">'
    + fieldsHTML
    + '</div></div>';

  return { html, title: 'Cheque — Leaf ' + l.leafNo };
}
window.buildChequePrintHTML = buildChequePrintHTML;

/**
 * Print Preview Modal for a cheque
 */
function openChequePrintPreview(leafId){
  const l = arr(db.chequeLeaves).find(x => x.id === leafId);
  if(!l){ toast('Cheque not found','error'); return; }

let _cpIndex = 0;

function buildCommandList(){

    ['settings','Settings','⚙️']
  ];

    kind:'view', label:'Go to ' + v[1], ico: v[2],
    action: () => { ui.view = v[0]; render(); }
  }));

  const actions = [
    ['Issue New Cheque','🎯', () => openIssueChequeForm()],
    ['Open Check-In Popup','🔔', () => openCheckInPopup()],
    ['Register Cheque Book','📚', () => openChequeBookForm()],

    ['Print Cheque Voucher','🖨', () => openChequeVoucherPicker()],
    ['Batch Print Cheques','🖨', () => openBatchPrint()],
    ['Calibrate Printer','⚙️', () => openPrinterCalibration()],
    ['Cheque Register Report','📋', () => openChequeRegisterReport()],
    ['Bank Statement Report','🏄', () => openBankStatementReport()],
    ['Age Analysis','⏳', () => printAgeAnalysisReport()],
    ['Cycle Theme','🎨', () => cycleTheme()],
    ['Toggle Sticky Notes','📝', () => toggleStickyPanel()],
    ['Show Shortcuts','⌨', () => showShortcuts()],
    ['Download Backup','💾', () => backupNow()],
    ['Force Sync to Cloud','🔄', () => forceSync()]
  ];
  actions.forEach(a => out.push({ kind:'action', label: a[0], ico: a[1], action: a[2] }));

  arr(db.chequeLeaves).filter(l => l.status !== 'Available').slice(-50).forEach(l => out.push({
    kind:'cheque', label:'Leaf ' + l.leafNo + ' · ' + money(l.amount),

    action: () => showLeafDetail(l.id)
  }));

    kind:'bank', label: b.accountName || b.bankName, ico:'🏛️',
    sub: b.bankName, action: () => showBankDetail(b.id)
  }));

window.buildCommandList = buildCommandList;

function openCmdPalette(){
  const cp = document.getElementById('cmdPalette');
  if(!cp) return;
  cp.classList.add('open');
  const inp = document.getElementById('cpInput');
  inp.value = ''; inp.focus();
  renderCmdPalette('');
}
window.openCmdPalette = openCmdPalette;

function closeCmdPalette(){
  const cp = document.getElementById('cmdPalette');
  if(cp) cp.classList.remove('open');
}
window.closeCmdPalette = closeCmdPalette;

function renderCmdPalette(query){
  const q = (query || '').toLowerCase().trim();
  const all = buildCommandList();
  _cpResults = q
    ? all.filter(x => (x.label||'').toLowerCase().includes(q) || (x.sub||'').toLowerCase().includes(q)).slice(0, 40)
    : all.slice(0, 20);
  _cpIndex = 0;

  const box = document.getElementById('cpResults');
  if(!box) return;
  if(!_cpResults.length){
    box.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-4)">No matches</div>';
    return;
  }
  box.innerHTML = _cpResults.map((r,i) =>
    '<div class="cp-item ' + (i===0?'active':'') + '" onclick="runCmdPaletteItem(' + i + ')">'
    + '<span class="cp-ico">' + r.ico + '</span>'
    + '<span style="flex:1">' + esc(r.label)
    + (r.sub ? '<small style="display:block;color:var(--text-4);font-size:11px">' + esc(r.sub) + '</small>' : '')
    + '</span><span class="cp-kind">' + esc(r.kind) + '</span></div>'
  ).join('');
}
window.renderCmdPalette = renderCmdPalette;

function runCmdPaletteItem(i){
  const r = _cpResults[i]; if(!r) return;
  closeCmdPalette();
  try { r.action(); } catch(e){ console.error(e); }
}
window.runCmdPaletteItem = runCmdPaletteItem;

function cmdPaletteKeydown(e){
  if(e.key === 'Escape'){ closeCmdPalette(); return; }
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    _cpIndex = Math.min(_cpResults.length-1, _cpIndex+1);
    highlightCmdItem(); return;
  }
  if(e.key === 'ArrowUp'){
    e.preventDefault();
    _cpIndex = Math.max(0, _cpIndex-1);
    highlightCmdItem(); return;
  }
  if(e.key === 'Enter'){
    e.preventDefault();
    runCmdPaletteItem(_cpIndex);
  }
}
window.cmdPaletteKeydown = cmdPaletteKeydown;

function highlightCmdItem(){
  const items = document.querySelectorAll('#cpResults .cp-item');
  items.forEach((el,i) => el.classList.toggle('active', i === _cpIndex));
  const a = items[_cpIndex];
  if(a) a.scrollIntoView({ block:'nearest' });
}
window.highlightCmdItem = highlightCmdItem;

/* Global key handlers */
document.addEventListener('keydown', function(e){
  const cp = document.getElementById('cmdPalette');
  const tag = (e.target && e.target.tagName) || '';
  const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable;

  /* Ctrl+K */
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    if(cp && cp.classList.contains('open')) closeCmdPalette();
    else openCmdPalette();
    return;
  }

  /* Escape */
  if(e.key === 'Escape'){
    closeModal(); closeCmdPalette();
    const sp = document.getElementById('stickyPanel'); if(sp) sp.classList.remove('open');
    return;
  }

  if(cp && cp.classList.contains('open')) return;

  /* Ctrl+/ */
  if((e.ctrlKey || e.metaKey) && e.key === '/'){
    e.preventDefault(); showShortcuts(); return;
  }

  /* Ctrl+B */
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b' && !e.shiftKey){
    e.preventDefault();
    document.body.classList.toggle('sidebar-collapsed');
    return;
  }

  /* Ctrl+D */
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd'){
    e.preventDefault(); cycleTheme(); return;
  }

  /* Ctrl+S */
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
    e.preventDefault(); forceSync(); return;
  }

  /* Ctrl+Shift+N */
  if((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'n'){
    e.preventDefault();
    if(window.openIssueChequeForm) openIssueChequeForm();
    return;
  }

  /* Ctrl+N */
  if((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'n'){
    e.preventDefault();
    const v = ui.view;
    if(v === 'banks') openBankForm();
    else if(v === 'chequeBooks') openChequeBookForm();
    else if(v === 'own') openIssueChequeForm();
    else if(window.openBankForm) openBankForm();
    return;
  }

  /* Ctrl+P */
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p' && !e.shiftKey){
    e.preventDefault();
    if(window.printCurrentView) printCurrentView();
    return;
  }

  if(isTyping) return;

  /* ? */
  if(e.key === '?'){
    e.preventDefault(); showShortcuts(); return;
  }

  /* / */
  if(e.key === '/'){
    e.preventDefault();
    const gs = document.getElementById('globalSearch');
    if(gs) gs.focus();
    return;
  }

  /* G then X */
  if(window._lastKey === 'g' && Date.now() - window._lastKeyTime < 1200){
    const map = { d:'dashboard', b:'banks', c:'chequeBooks', o:'own', s:'sms', a:'analytics', r:'reports', l:'leaves' };
    if(map[e.key.toLowerCase()]){
      e.preventDefault();
      ui.view = map[e.key.toLowerCase()];
      render();
      window._lastKey = '';
      toast('→ ' + (titles[ui.view] || ui.view), 'info');
      return;
    }
  }
  if(e.key.toLowerCase() === 'g'){
    window._lastKey = 'g';
    window._lastKeyTime = Date.now();
    return;
  }
  window._lastKey = '';
});

let _stickyColor = 'yellow';

function toggleStickyPanel(){
  const p = document.getElementById('stickyPanel');
  if(!p) return;
  p.classList.toggle('open');
  if(p.classList.contains('open')) renderStickyList();
}
window.toggleStickyPanel = toggleStickyPanel;

function renderStickyList(){
  const list = document.getElementById('stickyList');
  if(!list) return;
  const notes = arr(db.stickyNotes || []).slice().sort((a,b) => (a.createdAt||'') < (b.createdAt||'') ? 1 : -1);
  if(!notes.length){
    list.innerHTML = '<div class="empty" style="padding:30px 10px;font-size:12px">No notes yet.<br>Write your first below.</div>';
    return;
  }
  list.innerHTML = notes.map(n => {
    const cls = n.color && n.color !== 'yellow' ? ' ' + n.color : '';
    return '<div class="sticky-note' + cls + '">'
      + '<div class="sn-actions"><button onclick="deleteStickyNote(\'' + n.id + '\')">✕</button></div>'
      + esc(n.text)
      + '<div class="sn-time">' + dateTimeFmt(n.createdAt) + (n.page ? ' • ' + esc(n.page) : '') + '</div></div>';
  }).join('');
}
window.renderStickyList = renderStickyList;

function saveStickyNote(){
  const inp = document.getElementById('stickyInput');
  if(!inp) return;
  const text = inp.value.trim();
  if(!text){ toast('Write something first','warn'); return; }
  if(!Array.isArray(db.stickyNotes)) db.stickyNotes = [];
  db.stickyNotes.push({
    id:uid(), text, color:_stickyColor||'yellow', page:ui.view,
    createdAt:nowISO(), createdBy:(currentUser&&currentUser.email)||'system'
  });
  inp.value = ''; _stickyColor = 'yellow';
  document.querySelectorAll('.sticky-color button').forEach(b => b.classList.remove('on'));
  const first = document.querySelector('.sticky-color button'); if(first) first.classList.add('on');
  save(); renderStickyList();
  toast('📝 Note saved','success');
}
window.saveStickyNote = saveStickyNote;

function deleteStickyNote(id){
  if(!confirm('Delete this note?')) return;
  db.stickyNotes = arr(db.stickyNotes).filter(n => n.id !== id);
  save(); renderStickyList();
}
window.deleteStickyNote = deleteStickyNote;

function setStickyColor(color, btn){
  _stickyColor = color;
  document.querySelectorAll('.sticky-color button').forEach(b => b.classList.remove('on'));
  if(btn) btn.classList.add('on');
}
window.setStickyColor = setStickyColor;

/* ═══════════════════════════════════════════════════════════════════════
   HOVER PREVIEW
   ═══════════════════════════════════════════════════════════════════════ */
(function installHoverPreview(){
  let hoverEl = null, timer = null, currentTarget = null;

  function make(){
    if(hoverEl) return hoverEl;
    hoverEl = document.createElement('div');
    hoverEl.className = 'hover-preview';
    document.body.appendChild(hoverEl);
    return hoverEl;
  }

  function showFor(el, kind, id){
    if(currentTarget === el) return;
    currentTarget = el;
    const card = make();
    let html = '';

    if(kind === 'leaf'){
      const l = arr(db.chequeLeaves).find(x => x.id === id); if(!l) return;
      const bank = arr(db.bankAccounts).find(b => b.id === l.bankAccountId);
      html = '<div class="hp-head"><div class="hp-avatar">' + esc(l.leafNo) + '</div>'
        + '<div><div class="hp-name">Leaf ' + esc(l.leafNo) + '</div>'
        + '<div class="hp-sub">' + esc(l.status) + '</div></div></div>'
        + '<div class="hp-row"><span>Bank</span><span>' + (bank ? esc(bank.accountName || bank.bankName) : '—') + '</span></div>'
        + '<div class="hp-row"><span>Payee</span><span>' + esc(l.payee || '—') + '</span></div>'
        + (l.amount ? '<div class="hp-row"><span>Amount</span><span>' + moneyPlain(l.amount) + '</span></div>' : '')
        + (l.dueDate ? '<div class="hp-row"><span>Due</span><span>' + dateFmt(l.dueDate) + '</span></div>' : '');
    } else if(kind === 'bank'){
      const b = arr(db.bankAccounts).find(x => x.id === id); if(!b) return;
      html = '<div class="hp-head"><div class="hp-avatar">' + bankLogo(b.bankName).replace(/<[^>]+>/g,'').slice(0,3) + '</div>'
        + '<div><div class="hp-name">' + esc(b.accountName || b.bankName) + '</div>'
        + '<div class="hp-sub">' + esc(b.bankName) + '</div></div></div>'
        + '<div class="hp-row"><span>Ledger</span><span>' + moneyPlain(bankLedgerBalance(b.id)) + '</span></div>'
        + '<div class="hp-row"><span>Available</span><span>' + moneyPlain(bankAvailableBalance(b.id)) + '</span></div>'
        + '<div class="hp-row"><span>Book</span><span>' + moneyPlain(bankBookBalance(b.id)) + '</span></div>';
    }

    card.innerHTML = html;
    const rect = el.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    let left = rect.right + 12;
    let top = rect.top;
    if(left + 320 > vw - 8) left = rect.left - 332;
    if(left < 8) left = 8;
    if(top + 200 > vh - 8) top = vh - 208;
    if(top < 8) top = 8;
    card.style.left = left + 'px';
    card.style.top = top + 'px';
    requestAnimationFrame(() => card.classList.add('show'));
  }

  function hide(){
    if(hoverEl) hoverEl.classList.remove('show');
    currentTarget = null;
  }

  document.addEventListener('mouseover', e => {
    const cell = e.target.closest('[data-hover-leaf], [data-hover-bank]');
    if(!cell) return;
    clearTimeout(timer);
    const kind = cell.dataset.hoverLeaf ? 'leaf' : 'bank';
    const id = cell.dataset.hoverLeaf || cell.dataset.hoverBank;
    timer = setTimeout(() => showFor(cell, kind, id), 320);
  }, true);

  document.addEventListener('mouseout', e => {
    const cell = e.target.closest('[data-hover-leaf], [data-hover-bank]');
    if(!cell) return;
    clearTimeout(timer);
    hide();
  }, true);
})();

(function installPWA(){
  try {
    const manifest = {
      name: (db.settings && db.settings.shopName) || 'Lanka Shoe Cheques',
      short_name: 'Lanka Cheques',
      start_url: location.pathname || '.',
      display: 'standalone',
      background_color: '#f8f9fc',
      theme_color: '#7c3aed',
      icons: [
        { src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="32" fill="#7c3aed"/><text x="96" y="128" font-size="112" text-anchor="middle">🏛️</text></svg>'), sizes:'192x192', type:'image/svg+xml' },
        { src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="64" fill="#7c3aed"/><text x="256" y="340" font-size="320" text-anchor="middle">🏛️</text></svg>'), sizes:'512x512', type:'image/svg+xml' }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type:'application/manifest+json' });
    const url = URL.createObjectURL(blob);
    let link = document.querySelector('link[rel="manifest"]');
    if(!link){ link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
    link.href = url;
  } catch(e){}

  try {
    if('serviceWorker' in navigator && location.protocol !== 'file:'){
      const swCode = `self.addEventListener('install',function(e){self.skipWaiting()});self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim())});self.addEventListener('fetch',function(e){})`;
      const swBlob = new Blob([swCode], { type:'application/javascript' });
      const swURL = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swURL, { scope:'./' }).catch(()=>{});
    }
  } catch(e){}

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    try { if(localStorage.getItem('lks2_pwa_dismissed') === '1') return; } catch(e){}
    if(document.querySelector('.pwa-banner')) return;
    const b = document.createElement('div');
    b.className = 'pwa-banner';
    b.innerHTML = '<div class="pwa-ico">📱</div>'
      + '<div style="flex:1;min-width:180px"><div style="font-weight:700;font-size:13px">Install Lanka Cheques</div>'
      + '<div class="small muted" style="margin-top:2px">Open as a standalone app</div></div>'
      + '<div class="row-flex">'
      + '<button class="btn sm" onclick="dismissPWAInstall()">Later</button>'
      + '<button class="btn sm primary" onclick="triggerPWAInstall()">Install</button>'
      + '</div>';
    document.body.appendChild(b);
  });

  window.triggerPWAInstall = async function(){
    if(!deferredPrompt){ toast('Install not available','warn'); return; }
    try {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      const b = document.querySelector('.pwa-banner');
      if(b) b.remove();
    } catch(e){}
  };
  window.dismissPWAInstall = function(){
    try { localStorage.setItem('lks2_pwa_dismissed','1'); } catch(e){}
    const b = document.querySelector('.pwa-banner');
    if(b) b.remove();
  };
})();

    + '<button class="btn" onclick="openChequeRegisterReport()">📋 Cheque Register Report</button>'
    + '</div></div>'

    + '<div class="card"><div class="card-head"><h3>📋 Issued Cheques Ready to Print (' + issuedLeaves.length + ')</h3>'
    + (issuedLeaves.length ? '<button class="btn sm primary" onclick="openBatchPrint()">🖨 Batch Print</button>' : '')
    + '</div>'
    + (issuedLeaves.length
      ? '<div class="table-wrap"><table><thead><tr>'
        + '<th>Leaf</th><th>Bank</th><th>Payee</th><th class="num">Amount</th><th>Due</th><th></th>'
        + '</tr></thead><tbody>'
        + issuedLeaves.map(l => {
            const bank = arr(db.bankAccounts).find(b => b.id === l.bankAccountId);
            return '<tr><td class="mono"><strong>' + esc(l.leafNo) + '</strong></td>'
              + '<td>' + (bank ? esc(bank.accountName || bank.bankName) : '—') + '</td>'
              + '<td>' + esc(l.payee||'') + '</td>'
              + '<td class="num">' + moneyPlain(l.amount) + '</td>'
              + '<td>' + dateFmt(l.dueDate) + '</td>'
              + '<td><button class="btn xs" onclick="openChequePrintPreview(\'' + l.id + '\')">👁 Preview</button> '
              + '<button class="btn xs primary" onclick="printCheque(\'' + l.id + '\')">🖨 Print</button></td></tr>';
          }).join('')
        + '</tbody></table></div>'
      : '<div class="empty"><div class="big">🖨</div>No issued cheques to print</div>')
    + '</div>'

    + '<div class="card"><div class="card-head"><h3>📜 Print History</h3></div>'
    + (printedLeaves.length
      ? '<div class="table-wrap" style="max-height:400px"><table><thead><tr>'
        + '<th>Leaf</th><th>Payee</th><th>Printed At</th><th class="num">Reprints</th>'
        + '</tr></thead><tbody>'
        + printedLeaves.slice(-30).reverse().map(l =>
            '<tr><td class="mono"><strong>' + esc(l.leafNo) + '</strong></td>'
            + '<td>' + esc(l.payee||'') + '</td>'
            + '<td>' + dateTimeFmt(l.printedAt) + '</td>'
            + '<td class="num">' + (l.reprintCount || 0) + '</td></tr>').join('')
        + '</tbody></table></div>'
      : '<div class="empty">No cheques printed yet</div>')
    + '</div>';
}
window.viewPrintQueue = viewPrintQueue;

/* ═══════════════════════════════════════════════════════════════════════
   PATCH: extend leaf detail with print button
   ═══════════════════════════════════════════════════════════════════════ */
(function patchLeafDetailForPrint(){
  const orig = window.showLeafDetail;
  if(typeof orig !== 'function' || orig.__patchedPrint) return;
  const wrapped = function(leafId){
    const r = orig.apply(this, arguments);
    setTimeout(()=>{
      const modal = document.querySelector('#modalWrap .modal-body .form-actions');
      if(!modal || modal.querySelector('[data-print-btn]')) return;
      const l = arr(db.chequeLeaves).find(x => x.id === leafId);
      if(!l) return;
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.setAttribute('data-print-btn','1');
      btn.textContent = '🖨 Print Cheque';
      btn.onclick = ()=>{ closeModal(); setTimeout(()=>openChequePrintPreview(leafId), 120); };
      modal.insertBefore(btn, modal.firstChild);
    }, 60);
    return r;
  };
  wrapped.__patchedPrint = true;
  window.showLeafDetail = wrapped;
})();

/* ═══════════════════════════════════════════════════════════════════════
   PATCH: hover attributes on bank cards + leaf rows
   ═══════════════════════════════════════════════════════════════════════ */
(function patchHoverAttributes(){
  const origBanks = window.renderBankCard;
  if(typeof origBanks === 'function' && !origBanks.__hoverPatched){
    window.renderBankCard = function(b){
      const html = origBanks.apply(this, arguments);
      return html.replace('<div class="bank-card"', '<div class="bank-card" data-hover-bank="' + b.id + '"');
    };
    window.renderBankCard.__hoverPatched = true;
    window.renderBankCard = window.renderBankCard;
  }
})();

/* ═══════════════════════════════════════════════════════════════════════
   FAB OVERRIDE — chunk 3
   ═══════════════════════════════════════════════════════════════════════ */
(function fabOverrideChunk3(){
  const _orig = window.render;
  if(_orig.__patchedFab3) return;
  window.render = function(){
    _orig.apply(this, arguments);
    const fab = document.getElementById('fabBtn');
    if(!fab) return;
    if(ui.view === 'print'){ fab.style.display=''; fab.onclick = ()=>openBatchPrint(); fab.title='Batch Print'; }
    else if(ui.view === 'bankCharges'){
      fab.style.display = 'none';
    }
  };
  window.render.__patchedFab3 = true;
})();

/* ═══════════════════════════════════════════════════════════════════════
   FIRST-RUN ONBOARDING
   ═══════════════════════════════════════════════════════════════════════ */
(function setupOnboarding(){
  let fired = false;
  const tryFire = () => {
    if(fired) return;
    if(!currentUser) return;
    try { if(localStorage.getItem('lks2_onb_seen') === '1') return; } catch(e){}
    fired = true;
    setTimeout(() => openOnboarding(), 3000);
  };
  let tries = 0;
  const iv = setInterval(() => { tries++; tryFire(); if(fired || tries > 60) clearInterval(iv); }, 500);
})();
